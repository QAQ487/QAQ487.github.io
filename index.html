<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="QAQ487 的個人頁面">
  <title>QAQ487</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1c1915;
      --muted: #5e574e;
      --line: #d9d1c4;
      --card: #fffcf7;
      --accent: #2f6f62;
      --placeholder: #8a5a2a;
    }

    * { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #efe8db 0, transparent 12rem),
        var(--bg);
      color: var(--ink);
      font-family: "PingFang HK", "Noto Sans CJK HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
    }

    .wrap {
      width: min(42rem, calc(100% - 2rem));
      margin: 0 auto;
      padding: 4.5rem 0 5rem;
    }

    header h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      font-weight: 650;
      letter-spacing: 0.04em;
      line-height: 1.1;
    }

    .placeholder {
      margin: 1rem 0 0;
      padding: 0.7rem 0.85rem;
      border: 1px dashed var(--placeholder);
      border-radius: 0.5rem;
      color: var(--placeholder);
      background: rgba(138, 90, 42, 0.06);
      font-size: 0.95rem;
    }

    .placeholder strong {
      font-weight: 650;
    }

    main { margin-top: 2.75rem; }

    .section-label {
      margin: 0 0 0.85rem;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
      gap: 0.85rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .card {
      display: block;
      height: 100%;
      padding: 1.15rem 1.15rem 1.2rem;
      border: 1px solid var(--line);
      border-radius: 0.8rem;
      background: var(--card);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 1px 0 rgba(28, 25, 21, 0.04);
    }

    .card:hover,
    .card:focus-visible {
      border-color: var(--accent);
      outline: 2px solid transparent;
      box-shadow: 0 0 0 3px rgba(47, 111, 98, 0.18);
    }

    .card h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 650;
      line-height: 1.35;
    }

    .card p {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .go {
      display: inline-block;
      margin-top: 0.9rem;
      color: var(--accent);
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>QAQ487</h1>
      <!-- 佔位簡介：請替換成你的自我介紹 -->
      <p class="placeholder"><strong>佔位文字：</strong>這段簡介是預留位置，請之後自行修改。</p>
    </header>

    <main>
      <p class="section-label">Projects</p>
      <!-- 之後可在此清單加入更多作品卡片 -->
      <ul class="cards">
        <li>
          <a class="card" href="/handbook/">
            <h2>遊戲畫面表現手冊</h2>
            <p>Game Visual Handbook</p>
            <p lang="ja">ゲーム画面表現ハンドブック</p>
            <span class="go">開啟</span>
          </a>
        </li>
      </ul>
    </main>
  </div>
</body>
</html>
