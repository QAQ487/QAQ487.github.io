"Not a fade to black (TRN-01); a day-night cycle is a continuous, playable change of state. Not a sky gradient alone (ENV-02).", "use": "A sense of time, schedule-based play (enemies come out at night), mood shifts.", "prompt": "Add a day-night cycle to the game: one day = 8 min; multiply-tint the whole scene by interpolating 4 key colours (dawn #ffd9b0, noon #ffffff, dusk #ff9a6a, night #3a4a8a); at night windows and torches glow with additive warm light whose intensity rises as it gets darker."}, "ja": {"name": "昼夜サイクル", "observe": "ゲーム内の時間が進むと、画面全体の色味・明るさ・空が朝・昼・夕・夜と移り変わる。夜には窓や松明などの光源が灯り、影の向きや長さが変わることもある。", "notThis": "黒へのフェード（TRN-01）ではなく、連続的でプレイ可能な状態変化。空のグラデーション（ENV-02、空だけを扱う）とも違う。", "use": "時間の感覚、時間帯に応じた遊び（夜に敵が出る）、雰囲気の変化。", "prompt": "ゲームに昼夜サイクルを追加して：1 日 8 分。4 つのキー色（朝 #ffd9b0、昼 #ffffff、夕 #ff9a6a、夜 #3a4a8a）を補間してシーン全体に乗算で色付け。夜は家の窓と松明が加算合成で暖かく光り、暗くなるほど強くなる。"}, "params": "day length · key colours & times · light intensity curve · shadow length · ambient vs light balance", "impl": "Global ambient colour in a constant buffer, applied as multiply in the sprite pixel shader (or a fullscreen multiply pass). Lights accumulate additively into a light render target, composited as rgb*ambient + light. Interpolate key colours on the CPU.", "related": ["ENV-02", "TRN-03", "PIX-21"], "refs": [{"t": "Godot docs — 2D lights and shadows", "u": "https://docs.godotengine.org/en/stable/tutorials/2d/2d_lights_and_shadows.html"}, {"t": "Wikipedia — Diurnal cycle (general background)", "u": "https://en.wikipedia.org/wiki/Diurnal_cycle"}], "nosrc": false}, {"id": "ENV-02", "cat": "ENV", "sub": "時間與天空", "std": "Sky gradient", "aliases": ["Skybox", "Sky dome", "Gradient sky"], "type": "S", "zh": {"name": "天空漸層（天空盒）", "observe": "背景天空是一道由上到下的顏色漸層（3D 遊戲中是包住場景的天空盒），顏色隨時間改變，並可能有太陽、月亮、星星、雲層等獨立圖層。", "notThis": "不是日夜循環（ENV-01，整個場景的調色）；天空漸層只處理「最遠的背景」。也不是視差捲動（PIX-15，多層景深移動）。", "use": "側視或有地平線的場景、標題畫面、時間表現。", "prompt": "在遊戲的側視場景（若有）或標題畫面中加入天空漸層：上、中、下 3 個色標，每個時段一組色票，以 8 色階的抖色（不是平滑漸層）呈現，保持像素風；太陽與月亮沿弧線移動。"}, "en": {"name": "Sky gradient", "observe": "The background sky is a top-to-bottom colour gradient (in 3D a skybox surrounding the scene), changing with time, possibly with separate sun, moon, star and cloud layers.", "notThis": "Not a day-night cycle (ENV-01, tinting the whole scene); the sky gradient handles only the farthest background. Not parallax scrolling (PIX-15, multi-depth layers).", "use": "Side-view or horizon scenes, title screens, showing time.", "prompt": "Add a sky gradient to side-view scenes (if any) or the title screen of the game: 3 colour stops (top/middle/bottom) with one palette per time of day, rendered as 8 dithered bands rather than a smooth gradient to stay pixel-art; move the sun and moon along an arc."}, "ja": {"name": "空のグラデーション（スカイボックス）", "observe": "背景の空が上から下への色のグラデーション（3D ではシーンを包むスカイボックス）で、時間とともに色が変わり、太陽・月・星・雲などの別レイヤーを持つこともある。", "notThis": "昼夜サイクル（ENV-01、シーン全体の色付け）とは違い、「最も遠い背景」だけを扱う。視差スクロール（PIX-15、多層の奥行き）とも違う。", "use": "横視点や地平線のある場面、タイトル画面、時間の表現。", "prompt": "ゲームの横視点の場面（あれば）やタイトル画面に空のグラデーションを：上・中・下の 3 色、時間帯ごとに 1 組のパレット、滑らかなグラデーションではなく 8 段のディザで描いてドット絵らしさを保つ。太陽と月は弧を描いて動く。"}, "params": "colour stops per time · band count / dither · sun & moon path · star fade · cloud layers", "impl": "Fullscreen background quad with a pixel shader: lerp between stops by uv.y; quantise to N bands with an ordered-dither offset. In 3D, a cubemap skybox drawn with depth = far plane (depth test LESS_EQUAL).", "related": ["ENV-01", "PIX-15", "PIX-08"], "refs": [{"t": "Wikipedia — Skybox (video games)", "u": "https://en.wikipedia.org/wiki/Skybox_(video_games)"}], "nosrc": false}, {"id": "ENV-03", "cat": "ENV", "sub": "世界狀態", "std": "Seasonal change", "aliases": ["Seasons", "Seasonal palette swap", "Season cycle"], "type": "C", "zh": {"name": "季節變化", "observe": "同一張地圖隨季節改變外觀：春天花開、夏天深綠、秋天樹葉變橙紅並落葉、冬天積雪與光禿樹枝；通常靠調色盤替換加上少量額外物件。", "notThis": "不是天氣（ENV-04/05，短期、會來會走）；季節是長週期、整體色彩的變化。也不是腐化擴散（ENV-16，局部蔓延）。", "use": "農場／生活模擬、長期遊玩的時間感、地區差異。", "prompt": "在遊戲中加入四季：草地與樹葉使用調色盤替換（春 #7fcf5a、夏 #4f9a3f、秋 #d98a3a、冬 #e8eef2），秋天加入落葉粒子、冬天樹木換成光禿版本並在屋頂加積雪條；季節切換時以 2 秒的抖色轉場過渡。"}, "en": {"name": "Seasonal change", "observe": "The same map changes appearance with the seasons: spring flowers, deep summer green, orange-red autumn leaves falling, winter snow and bare branches — usually palette swaps plus a few extra props.", "notThis": "Not weather (ENV-04/05, short-term and passing); seasons are long-cycle, whole-palette changes. Not corruption spread (ENV-16, local creep).", "use": "Farming/life sims, a sense of long-term time, regional variety.", "prompt": "Add four seasons to the game: palette-swap grass and leaves (spring #7fcf5a, summer #4f9a3f, autumn #d98a3a, winter #e8eef2); add falling-leaf particles in autumn; in winter swap trees to bare versions and add snow strips on roofs; cross between seasons with a 2 s dither transition."}, "ja": {"name": "季節の変化", "observe": "同じマップが季節で見た目を変える：春は花、夏は濃い緑、秋は葉が橙や赤に色づいて落ち、冬は雪と枯れ枝。多くはパレット差し替えと少しの追加オブジェクトで作る。", "notThis": "天候（ENV-04/05、短期的に来ては去る）とは違い、長い周期で全体の色が変わる。侵食の広がり（ENV-16、局所的に広がる）とも違う。", "use": "農場・生活シム、長期プレイの時間感、地域の違い。", "prompt": "ゲームに四季を追加して：草と葉をパレット差し替え（春 #7fcf5a、夏 #4f9a3f、秋 #d98a3a、冬 #e8eef2）。秋は落ち葉の粒子、冬は木を枯れ木版にして屋根に雪の帯。季節の切り替えは 2 秒のディザ転換で。"}, "params": "palette per season · prop swaps · particle set · transition style & length", "impl": "Palette-indexed sprites (PIX-06) with a season palette row selected by a constant; or a colour LUT texture lerped between seasons. Props swap via tile variants in the tilemap.", "related": ["PIX-06", "ENV-05", "TRN-09"], "refs": [], "nosrc": true}, {"id": "ENV-04", "cat": "ENV", "sub": "天氣", "std": "Rain", "aliases": ["Rainfall", "Rain particles", "Rain splash"], "type": "S", "zh": {"name": "下雨", "observe": "大量細長斜線（雨絲）快速落下，落地處出現小水花或圓形漣漪，畫面整體變暗、偏藍灰，可能有積水反光。", "notThis": "不是下雪（ENV-05，慢、會飄、會積）；也不是風吹（ENV-08）。雨的辨識重點是「快速斜線＋落地水花」。", "use": "氣氛、天氣系統、劇情（悲傷場面）、玩法（火系變弱）。", "prompt": "在遊戲中加入下雨：約 200 條 1×4 像素淺藍色雨絲，以 15° 斜角、每秒 240px 落下；在隨機地面位置生成 3 幀的小水花（十字形 → 圓圈）；畫面整體 multiply #8a9ab8；雨量 0–1 可調並平滑過渡。"}, "en": {"name": "Rain", "observe": "Many thin slanted streaks fall fast, with small splashes or ring ripples where they land; the whole image darkens toward blue-grey, possibly with wet reflections.", "notThis": "Not snow (ENV-05, slow, drifting, accumulating) nor wind (ENV-08). Rain reads as fast slanted streaks plus ground splashes.", "use": "Mood, weather systems, story (sad scenes), gameplay (fire weakened).", "prompt": "Add rain to the game: ~200 light-blue 1×4 px streaks falling at 15° and 240 px/s; spawn 3-frame splashes (cross → ring) at random ground spots; multiply the scene by #8a9ab8; expose intensity 0–1 with smooth transitions."}, "ja": {"name": "雨", "observe": "細長い斜めの線（雨筋）が大量に速く落ち、地面に小さな水しぶきや輪の波紋ができる。画面全体が暗く青灰色になり、水たまりの反射が出ることもある。", "notThis": "雪（ENV-05、遅く漂い積もる）や風（ENV-08）とは違う。見分けるポイントは「速い斜線＋地面の水しぶき」。", "use": "雰囲気、天候システム、物語（悲しい場面）、ゲーム性（火属性が弱まる）。", "prompt": "ゲームに雨を追加して：1×4 ドットの水色の雨筋を約 200 本、15° の角度で毎秒 240px 落とす。地面のランダムな位置に 3 フレームの水しぶき（十字→輪）を出し、シーン全体に #8a9ab8 を乗算。雨量 0〜1 を調整でき、なめらかに変化。"}, "params": "drop count · angle · speed · streak length · splash rate · scene tint · intensity ramp", "impl": "Screen-space particle system: drops are instanced quads (or a single scrolling rain texture with several UV-scrolled layers). Splashes spawn at random world points in view. Tint via the ambient constant from ENV-01.", "related": ["ENV-05", "ENV-06", "ENV-13", "ENV-08"], "refs": [{"t": "Wikipedia — Particle system", "u": "https://en.wikipedia.org/wiki/Particle_system"}, {"t": "Unity Manual — Particle System", "u": "https://docs.unity3d.com/Manual/class-ParticleSystem.html"}, {"t": "Godot docs — 2D particle systems", "u": "https://docs.godotengine.org/en/stable/tutorials/2d/particle_systems_2d.html"}], "nosrc": false}, {"id": "ENV-05", "cat": "ENV", "sub": "天氣", "std": "Snow", "aliases": ["Snowfall", "Snow accumulation", "Snow cover"], "type": "S", "zh": {"name": "下雪／積雪", "observe": "白色雪片緩慢落下並左右飄動，大小不一；時間越長地面與屋頂越白（積雪），角色走過留下痕跡。", "notThis": "不是下雨（ENV-04，快速直落）；也不是環境粒子（ENV-11，零星漂浮、不會積）。積雪是「狀態會累積」。", "use": "冬季、寒冷地區、季節變化的一部分。", "prompt": "在遊戲中加入下雪：約 120 個 1–2px 白色雪片，下落速度 20–40px/s，以正弦波左右飄（振幅 3–6px）；積雪值 0–1 每分鐘增加 0.1，控制地面白色覆蓋（用噪聲門檻逐步擴大）和屋頂雪條高度。"}, "en": {"name": "Snow", "observe": "White flakes fall slowly, drifting side to side in varied sizes; over time the ground and roofs whiten (accumulation) and characters leave tracks.", "notThis": "Not rain (ENV-04, fast and straight) nor ambient particles (ENV-11, sparse floating that never accumulates). Snow cover is state that builds up.", "use": "Winter, cold regions, part of seasonal change.", "prompt": "Add snow to the game: ~120 white 1–2 px flakes falling at 20–40 px/s, swaying sinusoidally (3–6 px amplitude); an accumulation value 0–1 grows 0.1 per minute, driving white ground coverage (an expanding noise threshold) and roof-snow strip height."}, "ja": {"name": "雪・積雪", "observe": "白い雪片が大きさもまちまちにゆっくり左右に揺れながら落ち、時間とともに地面や屋根が白くなり（積雪）、キャラが歩くと跡が残る。", "notThis": "雨（ENV-04、速くまっすぐ落ちる）や環境パーティクル（ENV-11、まばらに漂い積もらない）とは違い、積雪は「状態が蓄積する」。", "use": "冬、寒冷地、季節変化の一部。", "prompt": "ゲームに雪を追加して：1〜2px の白い雪片を約 120 個、落下速度 20〜40px/s、振幅 3〜6px の正弦波で左右に揺らす。積雪値 0〜1 を毎分 0.1 増やし、地面の白い覆い（ノイズのしきい値で徐々に拡大）と屋根の雪の帯の高さを制御。"}, "params": "flake count · size range · fall speed · sway amplitude/frequency · accumulation rate · coverage noise", "impl": "Flakes: instanced quads with per-instance phase for sway. Accumulation: a ground shader samples a noise texture; covered = noise < snowAmount, mixed toward white; roofs get a sprite strip whose height ∝ snowAmount.", "related": ["ENV-04", "ENV-10", "ENV-03"], "refs": [{"t": "Wikipedia — Particle system", "u": "https://en.wikipedia.org/wiki/Particle_system"}, {"t": "Unity Manual — Particle System", "u": "https://docs.unity3d.com/Manual/class-ParticleSystem.html"}, {"t": "The Book of Shaders — Noise", "u": "https://thebookofshaders.com/11/"}], "nosrc": false}, {"id": "ENV-06", "cat": "ENV", "sub": "天氣", "std": "Lightning flash", "aliases": ["Thunder flash", "Storm flash", "Sky flash"], "type": "S", "zh": {"name": "閃電閃光", "observe": "暴風雨中畫面突然整體閃白一兩下（有時能看到一道鋸齒狀閃電），景物瞬間變成高對比剪影，然後回到暗色；隨後（延遲）才有雷聲。", "notThis": "不是閃電弧特效（VFX-10，戰鬥中的電擊）；閃電閃光是環境照明事件。也不是淡出至白（TRN-02）。", "use": "暴風雨氣氛、恐怖驚嚇、短暫照亮黑暗地圖讓玩家看到敵人。", "prompt": "在遊戲的暴雨夜加入閃電閃光：每 6–14 秒隨機一次，畫面以加法提亮 2 次（0.05 秒、間隔 0.08 秒、第二次較弱），閃光期間所有物件畫成深色剪影；1% 機率在遠方天空畫一道 3 段鋸齒閃電；雷聲延遲 0.5–2 秒。"}, "en": {"name": "Lightning flash", "observe": "In a storm the whole image suddenly flashes white once or twice (sometimes with a jagged bolt), objects become high-contrast silhouettes for an instant, then darkness returns; thunder follows after a delay.", "notThis": "Not an electric-arc VFX (VFX-10, combat electricity); this is an environmental lighting event. Not a fade to white (TRN-02).", "use": "Storm mood, horror jump scares, briefly lighting a dark map so players see enemies.", "prompt": "Add lightning flashes to stormy nights in the game: randomly every 6–14 s, brighten additively twice (0.05 s each, 0.08 s apart, the second weaker), drawing objects as dark silhouettes during the flash; occasionally draw a 3-segment jagged bolt in the far sky; thunder follows 0.5–2 s later."}, "ja": {"name": "稲光（雷のフラッシュ）", "observe": "嵐の中で画面全体が突然 1〜2 回白く光り（ギザギザの稲妻が見えることも）、景色が一瞬高コントラストのシルエットになって暗さに戻る。少し遅れて雷鳴。", "notThis": "電撃エフェクト（VFX-10、戦闘中の電気）とは違い、環境の照明イベント。ホワイトアウト（TRN-02）とも違う。", "use": "嵐の雰囲気、ホラーの驚かし、暗いマップを一瞬照らして敵を見せる。", "prompt": "ゲームの嵐の夜に稲光を追加して：6〜14 秒ごとにランダムで、加算で 2 回明るく（各 0.05 秒、間隔 0.08 秒、2 回目は弱め）、その間は物体を暗いシルエットで描く。時々遠くの空に 3 段のギザギザの稲妻、雷鳴は 0.5〜2 秒後。"}, "params": "interval range · flash count & intensity · silhouette mode · bolt chance · thunder delay", "impl": "Fullscreen additive quad for the flash; silhouette mode = draw sprites with a solid dark colour override (same uniform as FB-01). Bolt: a line-strip mesh from a midpoint-displacement generator.", "related": ["VFX-10", "ENV-04", "TRN-02"], "refs": [{"t": "Envato Tuts+ — How to generate shockingly good 2D lightning effects", "u": "https://gamedevelopment.tutsplus.com/how-to-generate-shockingly-good-2d-lightning-effects--gamedev-2681t"}, {"t": "Wikipedia — Lichtenberg figure", "u": "https://en.wikipedia.org/wiki/Lichtenberg_figure"}], "nosrc": false}, {"id": "ENV-07", "cat": "ENV", "sub": "天氣", "std": "Cloud shadows", "aliases": ["Moving cloud shadows", "Cloud shadow overlay"], "type": "C", "zh": {"name": "雲影", "observe": "地面上有大片柔和的暗色斑塊緩緩移動，像天空中的雲遮住陽光；角色與建築經過時也會變暗。", "notThis": "不是霧（會變白、看不清）；也不是戰爭迷霧（ENV-15，與可見性有關）。雲影只是「移動的陰暗」，不影響遊戲規則。", "use": "讓靜態俯視地圖有生命感與風向感，成本很低。", "prompt": "在遊戲中加入雲影：一張 256×256 的可平鋪柔和噪聲貼圖，以每秒 6px 向東北方向捲動，以 multiply 疊在地面與角色上，最暗處亮度降到 80%；陰天時增加覆蓋率。"}, "en": {"name": "Cloud shadows", "observe": "Large soft dark patches drift slowly across the ground, like clouds blocking the sun; characters and buildings darken as they pass under.", "notThis": "Not fog (which whitens and obscures) nor fog of war (ENV-15, visibility). Cloud shadows are only moving shade with no gameplay effect.", "use": "Adds life and a sense of wind to a static top-down map at very low cost.", "prompt": "Add cloud shadows to the game: a tileable 256×256 soft-noise texture scrolling north-east at 6 px/s, multiplied over ground and characters, darkest areas at 80% brightness; increase coverage on overcast days."}, "ja": {"name": "雲の影", "observe": "地面の上を大きく柔らかい暗い斑点がゆっくり移動し、空の雲が日差しを遮っているように見える。キャラや建物も通ると暗くなる。", "notThis": "霧（白く見えにくくなる）や戦場の霧（ENV-15、視界に関わる）とは違い、「動く陰」でしかなくゲームのルールには影響しない。", "use": "静的な見下ろしマップに生命感と風向きを与える。コストが非常に低い。", "prompt": "ゲームに雲の影を追加して：256×256 のタイル可能な柔らかいノイズテクスチャを毎秒 6px で北東へスクロールし、地面とキャラに乗算。最も暗い部分は明るさ 80%。曇りの日は覆う割合を増やす。"}, "params": "texture scale · scroll direction & speed · darkness · coverage threshold · softness", "impl": "Fullscreen multiply pass (Blend: DestColor/Zero) sampling a tiling noise texture with world-space UVs + time*windDir so shadows stay locked to the world when the camera moves.", "related": ["ENV-08", "ENV-01"], "refs": [{"t": "The Book of Shaders — Noise", "u": "https://thebookofshaders.com/11/"}], "nosrc": true}, {"id": "ENV-08", "cat": "ENV", "sub": "地表與植被", "std": "Foliage sway", "aliases": ["Wind sway", "Vertex wind", "Swaying trees"], "type": "S", "zh": {"name": "風吹搖擺", "observe": "樹木、草叢、旗幟隨風左右搖擺：底部固定、頂部擺動最大，並有陣風造成的波浪狀起伏從一側傳到另一側。", "notThis": "不是互動草（ENV-09，因角色接觸而彎）；風吹是持續、全域的環境動作。也不是簡單整張圖左右晃（底部應該不動）。", "use": "讓場景活起來，表現風向與天氣強度。", "prompt": "在遊戲中為樹木與草叢加入風吹搖擺：在 shader 中依頂點高度（0=根部、1=頂端）偏移 x：offset = height² × (sin(time×1.7 + worldX×0.05) × 1.5 + gust × 2.5) px；陣風以每 5 秒一次的波從西向東經過。像素模式偏移取整。"}, "en": {"name": "Foliage sway", "observe": "Trees, bushes and flags sway in the wind: the base stays fixed, the top moves most, and gusts send wave-like ripples across from one side to the other.", "notThis": "Not interactive grass (ENV-09, bending from character contact); sway is a constant, global ambient motion. Not wobbling the whole image (the base must stay put).", "use": "Brings scenes to life and shows wind direction and storm strength.", "prompt": "Add foliage sway to trees and bushes in the game: in the shader offset x by vertex height h (0 = root, 1 = top): offset = h² × (sin(time×1.7 + worldX×0.05) × 1.5 + gust × 2.5) px; a gust wave passes west → east every 5 s. Round offsets in pixel mode."}, "ja": {"name": "風による揺れ（フォリッジスウェイ）", "observe": "木・草むら・旗が風で左右に揺れる。根元は固定で先端ほど大きく揺れ、突風による波のようなうねりが片側から反対側へ伝わる。", "notThis": "インタラクティブな草（ENV-09、キャラの接触で曲がる）とは違い、持続的で全体的な環境の動き。画像全体を左右に振るのとも違う（根元は動かない）。", "use": "シーンに生命感を与え、風向きや天候の強さを表す。", "prompt": "ゲームの木と草むらに風の揺れを追加して：シェーダーで頂点の高さ h（0＝根元、1＝先端）に応じて x をずらす：offset = h² ×（sin(time×1.7 + worldX×0.05)×1.5 + gust×2.5）px。突風の波は 5 秒ごとに西から東へ。ドットモードではオフセットを丸める。"}, "params": "base amplitude · frequency · spatial phase · gust strength & interval · height falloff exponent · pixel rounding", "impl": "Vertex shader on foliage quads: use the quad’s local v (top = 1) as height weight; offset.x = pow(h,2)*(A*sin(t*f + worldX*k) + gust(worldX - t*speed)). For sprites, split tall trees into 2–3 horizontal slices so the bend reads.", "related": ["ENV-09", "ENV-07", "ENV-04"], "refs": [{"t": "GPU Gems ch.7 — Rendering countless blades of waving grass", "u": "https://developer.nvidia.com/gpugems/gpugems/part-i-natural-effects/chapter-7-rendering-countless-blades-waving-grass"}, {"t": "GPU Gems 3 ch.16 — Vegetation procedural animation and shading in Crysis", "u": "https://developer.nvidia.com/gpugems/gpugems3/part-iii-rendering/chapter-16-vegetation-procedural-animation-and-shading-crysis"}], "nosrc": false}, {"id": "ENV-09", "cat": "ENV", "sub": "地表與植被", "std": "Interactive grass", "aliases": ["Grass displacement", "Player-reactive grass", "Bending grass"], "type": "C", "zh": {"name": "互動草", "observe": "角色走過草叢時，附近的草葉被推開、向外彎倒，離開後慢慢彈回原位；有時伴隨草屑粒子。", "notThis": "不是風吹（ENV-08，與角色無關）；也不是足跡（ENV-10，痕跡會留下）。互動草會恢復。", "use": "讓角色與世界有接觸感；俯視角遊戲特別有效。", "prompt": "在遊戲中加入互動草：每株草（或草地 tile 的草葉）讀取最近 4 個角色位置，在 12px 半徑內向遠離角色方向彎倒最多 4px（頂端），角色離開後以阻尼彈簧 0.5 秒回彈；被攻擊斬到時噴出 3–5 片草屑。"}, "en": {"name": "Interactive grass", "observe": "When a character walks through grass, nearby blades are pushed aside and bend outward, then slowly spring back after it leaves; sometimes with clipping particles.", "notThis": "Not wind sway (ENV-08, independent of characters) nor footprints (ENV-10, which leave a lasting mark). Interactive grass recovers.", "use": "Gives characters physical contact with the world; especially effective top-down.", "prompt": "Add interactive grass to the game: each grass tuft reads the 4 nearest character positions and, within 12 px, bends away from them by up to 4 px at the tip; after they leave it springs back with a damped spring over 0.5 s; when slashed it sprays 3–5 grass clippings."}, "ja": {"name": "インタラクティブな草", "observe": "キャラが草むらを歩くと周りの草が押しのけられて外側へ倒れ、離れるとゆっくり元に戻る。草の切れ端の粒子が出ることも。", "notThis": "風の揺れ（ENV-08、キャラと無関係）や足跡（ENV-10、跡が残る）とは違い、元に戻る。", "use": "キャラと世界の接触感を出す。見下ろし型で特に効果的。", "prompt": "ゲームにインタラクティブな草を追加して：草の株ごとに最も近い 4 体のキャラ位置を読み、12px 以内なら離れる方向へ先端を最大 4px 倒し、離れたら減衰バネで 0.5 秒かけて戻す。斬られたら草の切れ端を 3〜5 枚飛ばす。"}, "params": "influence radius · max bend · spring time · number of tracked actors · clipping particles", "impl": "Pass up to N actor positions in a constant buffer; in the grass vertex shader bend = sum(normalize(p-actor)*falloff(dist)) * h². For persistence/springback, render actor \"stamps\" into a low-res displacement render target that fades each frame, and sample it in the vertex shader.", "related": ["ENV-08", "ENV-10"], "refs": [{"t": "GPU Gems ch.7 — Rendering countless blades of waving grass", "u": "https://developer.nvidia.com/gpugems/gpugems/part-i-natural-effects/chapter-7-rendering-countless-blades-waving-grass"}], "nosrc": true}, {"id": "ENV-10", "cat": "ENV", "sub": "地表與植被", "std": "Footprints", "aliases": ["Trail deformation", "Snow trails", "Ground deformation"], "type": "C", "zh": {"name": "足跡／地表痕跡", "observe": "角色在雪地、沙地、泥地走過時留下一串腳印或拖痕，痕跡慢慢淡化或被新雪覆蓋。", "notThis": "不是互動草（ENV-09，會彈回）；也不是殘留物（FB-12，戰鬥產物）。足跡是移動留下的地表變形。", "use": "強化地面材質感與追蹤玩法（跟着腳印找敵人）。", "prompt": "在遊戲的雪地與泥地加入足跡：角色每走 6px 在左右腳交替位置印一個 2×1 深色腳印貼花，雪地 20 秒、泥地 40 秒內線性淡出；下雪時淡出速度加倍。"}, "en": {"name": "Footprints", "observe": "Characters leave a line of footprints or drag marks in snow, sand or mud; the marks slowly fade or get covered by fresh snow.", "notThis": "Not interactive grass (ENV-09, which springs back) nor permanence (FB-12, combat leftovers). Footprints are ground deformation left by movement.", "use": "Reinforces ground material and enables tracking play (follow the enemy’s footprints).", "prompt": "Add footprints to snow and mud in the game: every 6 px of movement stamp a 2×1 dark footprint decal at alternating left/right foot positions; fade linearly over 20 s on snow and 40 s on mud, twice as fast while snowing."}, "ja": {"name": "足跡（地面の跡）", "observe": "キャラが雪・砂・泥の上を歩くと足跡や引きずった跡が残り、徐々に薄れたり新雪に覆われたりする。", "notThis": "インタラクティブな草（ENV-09、元に戻る）や残留物（FB-12、戦闘の産物）とは違い、移動によって残る地面の変形。", "use": "地面の素材感を強め、追跡の遊び（足跡をたどって敵を探す）を可能にする。", "prompt": "ゲームの雪と泥の地面に足跡を追加して：6px 移動ごとに左右交互の足の位置へ 2×1 の濃い足跡デカールを置き、雪は 20 秒、泥は 40 秒で線形にフェード。雪が降っている間はフェードを 2 倍速に。"}, "params": "stamp spacing · decal size · fade time per material · max decals · snow refill rate", "impl": "Decal ring buffer (like FB-12) or a persistent \"trail\" render target in world space: draw stamps into it, and each frame draw a full-screen quad that slightly fades it toward empty; the ground shader darkens/indents by sampling it.", "related": ["ENV-05", "ENV-09", "FB-12"], "refs": [{"t": "Real Time VFX community (realtimevfx.com)", "u": "https://realtimevfx.com/"}], "nosrc": true}, {"id": "ENV-11", "cat": "ENV", "sub": "天氣", "std": "Ambient particles", "aliases": ["Floating motes", "Dust motes", "Fireflies", "Pollen"], "type": "C", "zh": {"name": "環境粒子", "observe": "畫面中零星漂浮的小光點或微粒：白天的花粉、灰塵、飄落的葉子，夜晚的螢火蟲；移動緩慢、方向隨機、壽命長。", "notThis": "不是下雪或下雨（ENV-04/05，大量、方向一致）；也不是拾取閃光（VFX-16，附在物件上）。環境粒子是低密度的背景氣氛。", "use": "讓畫面「有空氣」；區分地區（森林有螢火蟲、礦坑有灰塵）。", "prompt": "在遊戲的夜晚森林加入螢火蟲：同時最多 24 隻，每隻以 Perlin 噪聲緩慢漂移（速度 8px/s），以 2–4 秒週期明滅（加法混合、黃綠色 #d8ff8a、中心 1px 加 3px 柔光）；白天城鎮改為 12 個淡白色花粉向風向飄動。"}, "en": {"name": "Ambient particles", "observe": "Sparse little lights or motes floating on screen: pollen, dust and drifting leaves by day, fireflies at night; slow, random in direction, long-lived.", "notThis": "Not snow or rain (ENV-04/05, dense and uniformly directed) nor a pickup sparkle (VFX-16, attached to an item). Ambient particles are low-density background atmosphere.", "use": "Gives the image \"air\" and distinguishes regions (fireflies in the forest, dust in mines).", "prompt": "Add fireflies to the night forest in the game: up to 24 at once, each drifting slowly on Perlin noise (8 px/s) and pulsing on a 2–4 s period (additive, yellow-green #d8ff8a, 1 px core plus 3 px soft glow); in the daytime town use 12 faint white pollen motes drifting with the wind."}, "ja": {"name": "環境パーティクル", "observe": "画面にまばらに漂う小さな光や粒：昼は花粉・ほこり・舞う葉、夜はホタル。動きはゆっくりで方向はランダム、寿命が長い。", "notThis": "雪や雨（ENV-04/05、大量で方向がそろう）やピックアップのきらめき（VFX-16、アイテムに付く）とは違い、低密度の背景の雰囲気づくり。", "use": "画面に「空気」を感じさせ、地域を区別する（森にはホタル、鉱山にはほこり）。", "prompt": "ゲームの夜の森にホタルを追加して：同時に最大 24 匹、Perlin ノイズでゆっくり漂い（8px/s）、2〜4 秒周期で明滅（加算、黄緑 #d8ff8a、中心 1px と 3px の柔らかい光）。昼の町では淡い白の花粉 12 個を風向きに流す。"}, "params": "count · drift speed · noise frequency · pulse period · colour & glow · spawn area relative to camera", "impl": "Small CPU emitter around the camera bounds; render in the additive particle batch (Blend One/One) after the light pass so fireflies stay bright at night.", "related": ["ENV-04", "ENV-05", "VFX-16"], "refs": [{"t": "Godot docs — 2D particle systems", "u": "https://docs.godotengine.org/en/stable/tutorials/2d/particle_systems_2d.html"}, {"t": "Unity Manual — Particle System", "u": "https://docs.unity3d.com/Manual/class-ParticleSystem.html"}], "nosrc": false}, {"id": "ENV-12", "cat": "ENV", "sub": "水", "std": "Water surface", "aliases": ["Shoreline foam", "Animated water", "Water tiles"], "type": "S", "zh": {"name": "水面（含岸邊浪花）", "observe": "水面有緩慢移動的亮色波紋線與反光點，靠近岸邊有一圈白色浪花線隨波浪前後推進；深水較暗、淺水較亮。", "notThis": "不是漣漪（ENV-13，由物體觸發的一圈圈擴散）；也不是焦散（ENV-14，水底的光網）。水面是持續的表面動畫。", "use": "河流、湖泊、海岸；俯視角地圖中最常見的動態元素之一。", "prompt": "在遊戲的河流加入水面效果：水 tile 使用兩層反方向捲動的波紋貼圖（每秒 4px 與 -3px）疊加；岸邊根據到陸地的距離（距離場）畫 1px 白色浪花線，以 2 秒週期前後推移 2px；淺水（距岸 <6px）亮度 +15%。"}, "en": {"name": "Water surface", "observe": "The surface has slowly moving bright ripple lines and glints; near the shore a white foam line pushes back and forth with the waves; deep water is darker, shallows lighter.", "notThis": "Not ripples (ENV-13, rings triggered by objects) nor caustics (ENV-14, the light net on the bottom). The water surface is the continuous surface animation.", "use": "Rivers, lakes, coasts — one of the most common animated elements on top-down maps.", "prompt": "Add a water surface to the river in the game: water tiles combine two ripple textures scrolling in opposite directions (4 px/s and -3 px/s); along the shore draw a 1 px white foam line from a distance-to-land field, advancing and retreating 2 px on a 2 s cycle; shallows (<6 px from shore) +15% brightness."}, "ja": {"name": "水面（波打ち際の泡）", "observe": "水面にゆっくり動く明るい波線と反射の点があり、岸辺には白い泡の線が波に合わせて行き来する。深いところは暗く、浅瀬は明るい。", "notThis": "波紋（ENV-13、物体がきっかけの輪の広がり）やコースティクス（ENV-14、水底の光の網）とは違い、持続する表面のアニメーション。", "use": "川・湖・海岸。見下ろしマップで最もよく使う動く要素の一つ。", "prompt": "ゲームの川に水面表現を：水タイルに逆方向にスクロールする 2 層の波紋テクスチャ（毎秒 4px と -3px）を重ね、岸辺には陸地までの距離場から 1px の白い泡の線を描き、2 秒周期で 2px 行き来させる。浅瀬（岸から 6px 未満）は明るさ +15%。"}, "params": "scroll speeds · ripple texture · foam width & cycle · depth gradient · glint density · palette", "impl": "Water pixel shader: two UV-scrolled samples of a ripple texture combined; foam = step(abs(sdfShore - (0.5+0.5*sin(t*π))*w), 0.5px); depth tint from the same shore SDF baked into a texture alongside the tilemap.", "related": ["ENV-13", "ENV-14", "VFX-03"], "refs": [{"t": "GPU Gems ch.1 — Effective water simulation from physical models", "u": "https://developer.nvidia.com/gpugems/gpugems/part-i-natural-effects/chapter-1-effective-water-simulation-physical-models"}, {"t": "Catlike Coding — Texture distortion (flowmaps)", "u": "https://catlikecoding.com/unity/tutorials/flow/texture-distortion/"}, {"t": "Alex Vlachos — Water flow in Portal 2 (SIGGRAPH 2010, PDF)", "u": "https://alex.vlachos.com/graphics/Vlachos-SIGGRAPH10-WaterFlow.pdf"}], "nosrc": false}, {"id": "ENV-13", "cat": "ENV", "sub": "水", "std": "Ripples", "aliases": ["Interactive water", "Water ripples", "Wake"], "type": "C", "zh": {"name": "漣漪（互動水面）", "observe": "物體落水、角色涉水或雨滴打在水面時，從接觸點擴散出一圈圈變大變淡的環；移動中的角色後方拖出 V 形尾波。", "notThis": "不是衝擊波（VFX-06，戰鬥特效、扭曲畫面）；漣漪只在水面上且較柔和。也不是一般水面動畫（ENV-12，與物體無關）。", "use": "角色涉水、釣魚浮標、雨天水面、石頭丟進水裡。", "prompt": "在遊戲中，角色在淺水移動時每 0.25 秒在腳下生成一個漣漪：橢圓環（寬高比 2:1，配合俯視角）半徑由 2px 擴到 14px、0.8 秒內淡出，顏色為水面亮色；下雨時水面隨機生成小漣漪。"}, "en": {"name": "Ripples", "observe": "When something drops in, a character wades or rain hits, rings spread from the contact point, growing and fading; moving characters trail a V-shaped wake.", "notThis": "Not a shockwave (VFX-06, a combat effect distorting the screen); ripples are softer and live only on the water. Not the general water animation (ENV-12, independent of objects).", "use": "Wading characters, fishing floats, rainy water, stones thrown in.", "prompt": "In your game, when a character moves through shallow water spawn a ripple under its feet every 0.25 s: a 2:1 ellipse ring (to suit the top-down view) growing from 2 px to 14 px radius and fading over 0.8 s in the water highlight colour; spawn small random ripples while raining."}, "ja": {"name": "波紋（インタラクティブな水面）", "observe": "物が落ちる、キャラが水を歩く、雨粒が当たると、接点から輪が広がって大きく薄くなる。動くキャラの後ろには V 字の航跡ができる。", "notThis": "衝撃波（VFX-06、戦闘エフェクトで画面を歪める）とは違い、水面だけの柔らかいもの。一般的な水面アニメ（ENV-12、物体と無関係）とも違う。", "use": "キャラの水中歩行、釣りの浮き、雨の水面、石を投げ込む。", "prompt": "ゲームで、キャラが浅瀬を移動する時に 0.25 秒ごとに足元へ波紋を出して：縦横比 2:1 の楕円の輪（見下ろし視点に合わせる）で半径 2px→14px、0.8 秒でフェード、色は水面のハイライト色。雨の時は水面にランダムに小さな波紋。"}, "params": "spawn interval · max radius · lifetime · ellipse ratio · ring thickness · wake angle", "impl": "Simple: ring sprites in the water layer with a stencil/mask so they clip to water tiles. Advanced: a low-res height-field simulation (2-buffer wave equation in a compute shader, ms_cs) sampled for normal-based refraction.", "related": ["ENV-12", "VFX-06", "ENV-04"], "refs": [{"t": "GPU Gems ch.1 — Effective water simulation from physical models", "u": "https://developer.nvidia.com/gpugems/gpugems/part-i-natural-effects/chapter-1-effective-water-simulation-physical-models"}, {"t": "Microsoft Learn — Direct3D 11 compute shader", "u": "https://learn.microsoft.com/en-us/windows/win32/direct3d11/direct3d-11-advanced-stages-compute-shader"}], "nosrc": false}, {"id": "ENV-14", "cat": "ENV", "sub": "水", "std": "Caustics", "aliases": ["Water caustics", "Light caustics", "Pool-floor light pattern"], "type": "S", "zh": {"name": "焦散（水底光紋）", "observe": "淺水底部或水面附近的牆上，有一張不斷變形的明亮網狀光紋，是水面折射陽光聚焦形成的。", "notThis": "不是水面波紋（ENV-12，在水面上）；焦散在水底或被照射的物體上，呈「網狀亮線」。", "use": "清澈淺水、泳池、海底洞窟、魔法泉水；提高水的「透明感」。", "prompt": "在遊戲的清澈泉水中加入焦散：在水底 tile 上以加法混合疊一張可平鋪的焦散貼圖，兩層以不同方向與縮放捲動並取 min()，形成會變化的網狀亮線，強度 0.35，只在淺水區出現。"}, "en": {"name": "Caustics", "observe": "On the floor of shallow water or on walls near water there is a constantly deforming bright net of light — sunlight focused by refraction through the waves.", "notThis": "Not surface ripples (ENV-12, on the surface); caustics appear on the bottom or lit objects as a net of bright lines.", "use": "Clear shallows, pools, sea caves, magic springs — makes water feel transparent.", "prompt": "Add caustics to the clear spring in the game: additively blend a tileable caustics texture over the bottom tiles, sampling two layers scrolled in different directions and scales and taking min() to form a shifting net of bright lines; strength 0.35, shallows only."}, "ja": {"name": "コースティクス（水底の光の網）", "observe": "浅い水の底や水辺の壁に、絶えず形を変える明るい網目状の光の模様ができる。水面の屈折で日光が集まってできる。", "notThis": "水面の波紋（ENV-12、水面上）とは違い、水底や照らされた物体の上に「網状の明るい線」として現れる。", "use": "透き通った浅瀬、プール、海の洞窟、魔法の泉。水の透明感を高める。", "prompt": "ゲームの澄んだ泉にコースティクスを追加して：水底タイルにタイル可能なコースティクステクスチャを加算合成し、方向とスケールの違う 2 層をスクロールさせて min() を取り、変化する網目の光を作る。強さ 0.35、浅瀬のみ。"}, "params": "texture scale · two-layer scroll speeds/directions · intensity · depth falloff · colour", "impl": "Pixel shader: c = min(tex(uv*s1 + t*v1), tex(uv*s2 + t*v2)); out += c * intensity * shallowMask. A procedural alternative is Voronoi/cellular noise edges (bos_cell).", "related": ["ENV-12", "ENV-13"], "refs": [{"t": "Wikipedia — Caustic (optics)", "u": "https://en.wikipedia.org/wiki/Caustic_(optics)"}, {"t": "GPU Gems ch.2 — Rendering water caustics", "u": "https://developer.nvidia.com/gpugems/gpugems/part-i-natural-effects/chapter-2-rendering-water-caustics"}, {"t": "The Book of Shaders — Cellular noise", "u": "https://thebookofshaders.com/12/"}], "nosrc": false}, {"id": "ENV-15", "cat": "ENV", "sub": "世界狀態", "std": "Fog of war", "aliases": ["Unexplored darkness", "Vision mask", "Shroud"], "type": "S", "zh": {"name": "戰爭迷霧", "observe": "地圖上未探索的區域是全黑，曾探索但目前看不到的區域是半暗（只顯示地形、不顯示敵人），角色周圍視野半徑內才完全可見；視野邊緣通常是柔和或像素化的。", "notThis": "不是 2D 陰影投射（PIX-22，依障礙物計算視線陰影）——但兩者可結合。也不是雲影（ENV-07，純裝飾）。戰爭迷霧影響「玩家知道什麼」。", "use": "策略、塔防、探索類地圖；遊戲的夜間或洞窟探索。", "prompt": "在遊戲中加入戰爭迷霧：以 8px 為格的迷霧格子，三種狀態（未探索=全黑、已探索=50% 暗並隱藏敵人、可見=清晰）；主角視野半徑 64px、塔樓 96px；格子邊緣以 2×2 Bayer 抖色過渡，保持像素風。"}, "en": {"name": "Fog of war", "observe": "Unexplored map areas are black, explored-but-not-currently-visible areas are dimmed (terrain shown, enemies hidden), and only within units’ vision radius is everything visible; edges are usually soft or dithered.", "notThis": "Not 2D shadow casting (PIX-22, line-of-sight shadows from obstacles) — though they combine well. Not cloud shadows (ENV-07, decorative). Fog of war controls what the player knows.", "use": "Strategy, tower defence, exploration maps; night or cave exploration in the game.", "prompt": "Add fog of war to the game: an 8 px fog grid with three states (unexplored = black, explored = 50% dark with enemies hidden, visible = clear); hero vision radius 64 px, towers 96 px; dither the cell edges with a 2×2 Bayer pattern to stay pixel-art."}, "ja": {"name": "戦場の霧（フォグ・オブ・ウォー）", "observe": "未探索のエリアは真っ黒、探索済みだが今は見えないエリアは半分暗く（地形のみで敵は見えない）、ユニットの視界半径内だけが完全に見える。境界は柔らかいかディザ状が多い。", "notThis": "2D の影の投影（PIX-22、障害物から視線の影を計算）とは違うが、組み合わせられる。雲の影（ENV-07、装飾のみ）とも違い、「プレイヤーが何を知っているか」を左右する。", "use": "ストラテジー、タワーディフェンス、探索マップ。ゲームの夜や洞窟の探索。", "prompt": "ゲームに戦場の霧を追加して：8px 単位の霧グリッドで 3 状態（未探索＝真っ黒、探索済み＝50% 暗く敵を隠す、可視＝はっきり）。主人公の視界半径 64px、塔は 96px。境界は 2×2 Bayer ディザでぼかしてドット絵らしく。"}, "params": "cell size · vision radii · explored dim level · edge softness/dither · update rate", "impl": "CPU updates a small R8 texture (one texel per cell: 0 unexplored, 0.5 explored, 1 visible); fullscreen pass samples it with linear filtering, then applies a Bayer threshold for the dithered edge. Gameplay uses the same grid to hide enemies.", "related": ["PIX-22", "PIX-08", "ENV-07"], "refs": [{"t": "Wikipedia — Fog of war", "u": "https://en.wikipedia.org/wiki/Fog_of_war"}, {"t": "Red Blob Games — 2D visibility", "u": "https://www.redblobgames.com/articles/visibility/"}], "nosrc": false}, {"id": "ENV-16", "cat": "ENV", "sub": "世界狀態", "std": "Corruption spread", "aliases": ["Biome blend", "Blight spread", "Creep"], "type": "D", "zh": {"name": "腐化擴散（生態區混合）", "observe": "某種「壞」的地表（紫色腐化、黑色枯萎、菌毯）從一個源頭向外蔓延，邊緣不規則並有過渡帶；被覆蓋的植物變色或枯死。淨化時則反向退去。", "notThis": "不是季節變化（ENV-03，全地圖一起變）；腐化是局部、有源頭、會蔓延的。也不是戰爭迷霧（ENV-15）。", "use": "顯示敵方勢力範圍、倒數壓力、淨化玩法的回饋。", "prompt": "在遊戲中加入敵人營地的腐化擴散：以營地為中心的腐化半徑每分鐘增加 8px；地面以噪聲擾動的距離場判斷，內部使用紫灰色草地 tile、邊緣 6px 寬度內以抖色混合兩種 tile，並在邊緣隨機生成小紫色孢子粒子；摧毀營地後半徑在 5 秒內縮回 0。"}, "en": {"name": "Corruption spread", "observe": "A \"bad\" ground (purple corruption, black blight, creep) spreads outward from a source with an irregular edge and a transition band; plants it covers change colour or wither. Cleansing makes it recede.", "notThis": "Not seasonal change (ENV-03, the whole map at once); corruption is local, sourced and spreading. Not fog of war (ENV-15).", "use": "Shows enemy territory, adds countdown pressure, rewards cleansing play.", "prompt": "Add corruption spread around enemy camps in the game: radius grows 8 px per minute from the camp; decide coverage with a noise-perturbed distance field, using purple-grey grass tiles inside and a 6 px dithered blend band at the edge, spawning small purple spore particles there; when the camp is destroyed the radius shrinks to 0 over 5 s."}, "ja": {"name": "侵食の広がり（バイオームの混合）", "observe": "紫の侵食、黒い枯死、菌のじゅうたんのような「悪い」地面が発生源から外へ広がり、境界は不規則で移行帯がある。覆われた植物は色が変わったり枯れたりし、浄化すると逆に退く。", "notThis": "季節の変化（ENV-03、マップ全体が一斉に変わる）とは違い、局所的で発生源があり広がっていく。戦場の霧（ENV-15）とも違う。", "use": "敵勢力の範囲を示す、時間的なプレッシャー、浄化の遊びの手応え。", "prompt": "ゲームの敵の野営地に侵食の広がりを追加して：野営地中心の侵食半径を毎分 8px 拡大、ノイズで揺らした距離場で範囲を決め、内側は紫灰色の草タイル、境界 6px はディザで 2 種類のタイルを混ぜ、境界に小さな紫の胞子の粒子。野営地を壊したら 5 秒で半径を 0 へ。"}, "params": "growth rate · noise amplitude/scale · blend band width · dither vs smooth · particle density · recede speed", "impl": "Ground pixel shader: d = distance(worldPos, source) + noise(worldPos*s)*amp; w = saturate((radius - d)/band); choose tile palette by Bayer(w) for a dithered edge. Gameplay queries the same function for \"inside corruption\".", "related": ["ENV-03", "ENV-15", "PIX-17", "PIX-08"], "refs": [{"t": "The Book of Shaders — Noise", "u": "https://thebookofshaders.com/11/"}, {"t": "Boris the Brave — Classification of tilesets", "u": "https://www.boristhebrave.com/2021/11/14/classification-of-tilesets/"}], "nosrc": true}, {"id": "ENV-17", "cat": "ENV", "sub": "天氣", "std": "Heat haze", "aliases": ["Heat shimmer", "Heat distortion", "Mirage shimmer"], "type": "S", "zh": {"name": "熱浪扭曲", "observe": "高溫地面上方或火焰、熔岩附近，背景景物出現細小的波浪狀晃動扭曲，像隔着一層流動的透明空氣看東西。", "notThis": "不是衝擊波（VFX-06，單次、圓形擴散）；熱浪是持續、細微、向上流動的扭曲。也不是水面（ENV-12）。", "use": "沙漠、熔爐、火堆、熔岩區、火系魔法持續區域。", "prompt": "在遊戲的鐵匠熔爐與火堆上方加入熱浪扭曲：在 32×24px 範圍內，對背景做 x 方向偏移 = sin(y×0.6 − time×6) × 0.8px，向上漸弱；偏移取樣後再以最近鄰取樣保持像素清晰。"}, "en": {"name": "Heat haze", "observe": "Above hot ground or near fire and lava, background objects show small wavy shimmering distortion, like looking through flowing transparent air.", "notThis": "Not a shockwave (VFX-06, a single expanding ring); heat haze is continuous, subtle and flows upward. Not a water surface (ENV-12).", "use": "Deserts, forges, campfires, lava zones, lingering fire-magic areas.", "prompt": "Add heat haze above the blacksmith’s forge and campfires in the game: within a 32×24 px region offset the background in x by sin(y×0.6 − time×6) × 0.8 px, fading toward the top; sample with nearest-neighbour after the offset to keep pixels crisp."}, "ja": {"name": "陽炎（ヒートヘイズ）", "observe": "熱い地面の上や火・溶岩の近くで、背景の景色が細かく波打つように揺れて歪み、流れる透明な空気越しに見ているようになる。", "notThis": "衝撃波（VFX-06、一回きりで円形に広がる）とは違い、持続的で細かく、上へ流れる歪み。水面（ENV-12）とも違う。", "use": "砂漠、炉、焚き火、溶岩地帯、炎魔法が残る範囲。", "prompt": "ゲームの鍛冶屋の炉と焚き火の上に陽炎を追加して：32×24px の範囲で、背景の x 方向のずれ = sin(y×0.6 − time×6)×0.8px、上に行くほど弱く。ずらしてから最近傍サンプリングでドットをくっきり保つ。"}, "params": "region size · amplitude · vertical frequency · scroll speed · falloff · nearest vs linear sampling", "impl": "Distortion pass: render the scene to a texture, then draw distortion quads that sample it with uv + offset (offset from a scrolling noise/normal texture or analytic sin). Same pipeline as VFX-06.", "related": ["VFX-06", "VFX-12", "VFX-03"], "refs": [{"t": "Wikipedia — Heat haze", "u": "https://en.wikipedia.org/wiki/Heat_haze"}, {"t": "Catlike Coding — Texture distortion (flowmaps)", "u": "https://catlikecoding.com/unity/tutorials/flow/texture-distortion/"}], "nosrc": false}, {"id": "VFX-01", "cat": "VFX", "sub": "載體與技術", "std": "Soft particles", "aliases": ["Depth-faded particles", "Depth fade", "Soft intersection"], "type": "S", "zh": {"name": "柔和粒子（深度淡化）", "observe": "煙、霧、光暈這類面片穿進地面或牆身時，交界處不會出現一條筆直的硬邊，而是越接近表面越透明，看起來像「融」進場景。", "notThis": "不是一般的透明度隨壽命淡出（那是整粒一起變淡）；柔和粒子只在「貼近其他表面」的部分變淡。也不是貼花（FX-06，貼在表面上）。", "use": "讓煙霧、塵土、火光暈、水花在地面或角色附近不露出面片的四方邊，畫面更自然。", "prompt": "在粒子 pixel shader 加入柔和粒子：讀取場景深度貼圖，計算 fade = saturate((sceneDepth − particleDepth) × 1/0.5m)，再乘到粒子 alpha。煙霧和塵土用 0.5m 淡化距離，火光暈用 0.2m。需要可切換開關，方便比較有無效果。"}, "en": {"name": "Soft particles", "observe": "When smoke, fog or glow quads cut into the floor or a wall, there is no straight hard seam: the particle becomes more transparent the closer it gets to the surface, so it seems to melt into the scene.", "notThis": "Not ordinary fade-over-lifetime (the whole particle fades together); soft particles fade only where they are close to other geometry. Not a decal (FX-06, which lies on a surface).", "use": "Stops smoke, dust, glows and splashes from showing the square edge of their quad where they meet the ground or characters.", "prompt": "Add soft particles to the particle pixel shader: sample the scene depth texture, compute fade = saturate((sceneDepth − particleDepth) × 1/0.5 m) and multiply it into particle alpha. Use 0.5 m fade distance for smoke and dust, 0.2 m for fire glows. Expose a toggle so I can compare on/off."}, "ja": {"name": "ソフトパーティクル（深度フェード）", "observe": "煙・霧・光のにじみなどの板ポリが床や壁にめり込んでも、境目にまっすぐな硬い線が出ず、表面に近いほど透明になってシーンに溶け込んで見える。", "notThis": "寿命によるフェード（粒全体が一緒に薄くなる）とは違い、他のジオメトリに近い部分だけが薄くなる。デカール（FX-06、表面に貼る）でもない。", "use": "煙・土煙・炎のグロー・水しぶきが地面やキャラと交わる所で板ポリの四角い縁を見せないため。", "prompt": "パーティクル用ピクセルシェーダにソフトパーティクルを追加して。シーン深度テクスチャを読み、fade = saturate((sceneDepth − particleDepth) × 1/0.5m) を粒子の alpha に掛ける。煙と土煙は 0.5m、炎のグローは 0.2m のフェード距離。比較できるよう ON/OFF の切り替えを付けて。"}, "params": "fade distance (world units) · per-material override · depth linearisation · near-camera fade", "impl": "Bind the scene depth buffer as an SRV (create it with a typeless R24G8/R32 format so it can be both DSV and SRV; render particles with depth-write off and the DSV read-only). In the PS: linearise both depths and alpha *= saturate((sceneZ − pixelZ) / fadeDist). In a pure 2D top-down renderer, approximate with a per-sprite \"ground height\" gradient instead.", "related": ["VFX-12", "FX-01 Sprite / Billboard particles", "FX-06 Decals"], "refs": [{"t": "NVIDIA — Soft Particles whitepaper (PDF)", "u": "https://developer.download.nvidia.com/whitepapers/2007/SDK10/SoftParticles_hi.pdf"}, {"t": "Microsoft Learn — Configuring depth-stencil functionality", "u": "https://learn.microsoft.com/en-us/windows/win32/direct3d11/d3d10-graphics-programming-guide-depth-stencil"}, {"t": "Unity Manual — Particle System Renderer module", "u": "https://docs.unity3d.com/Manual/PartSysRendererModule.html"}], "nosrc": false}, {"id": "VFX-02", "cat": "VFX", "sub": "載體與技術", "std": "GPU particles", "aliases": ["Compute-shader particles", "GPU particle simulation", "Massive particles"], "type": "S", "zh": {"name": "GPU 粒子", "observe": "畫面上同時有成千上萬粒子（火花、螢火、魔法塵）在流動、旋轉、受力場推動，而幀率不跌。粒子的運動通常看起來像流體或群體。", "notThis": "不是一般 CPU 粒子（每粒在 CPU 更新，數百至數千粒已經到頂）；GPU 粒子是把模擬放在 compute shader。看起來的差別主要是「數量級」與整體流動感。", "use": "需要極大量粒子的場面：魔法漩渦、大群螢火蟲、雪暴、大型爆發，或環境飄浮粒子覆蓋整個地圖。", "prompt": "在引擎中加入一個 GPU 粒子系統：粒子狀態放在 RWStructuredBuffer，每幀用 compute shader 更新位置、速度和壽命（加入 curl noise 力場），死掉的粒子用 append/consume buffer 回收，再用 DrawInstancedIndirect 畫成 billboard。目標 100,000 粒子 60fps，並提供 debug 顯示當前存活數量。"}, "en": {"name": "GPU particles", "observe": "Tens of thousands of particles (sparks, fireflies, magic dust) swirl and get pushed around by force fields on screen at once without the frame rate dropping. Motion often reads like a fluid or a swarm.", "notThis": "Not ordinary CPU particles (each updated on the CPU; tops out at hundreds to a few thousand). GPU particles run the simulation in a compute shader; visually the difference is mostly the order of magnitude and the coherent flow.", "use": "Scenes that need huge counts: magic vortices, swarms of fireflies, blizzards, big bursts, or ambient particles across a whole map.", "prompt": "Add a GPU particle system to your engine: keep particle state in a RWStructuredBuffer, update position/velocity/age each frame in a compute shader (with a curl-noise force field), recycle dead particles through an append/consume index buffer, and draw them as billboards with DrawInstancedIndirect. Target 100,000 particles at 60 fps and show a debug counter of live particles."}, "ja": {"name": "GPU パーティクル", "observe": "画面上に数万の粒子（火花・ホタル・魔法の塵）が同時に流れ、渦巻き、力場に押されてもフレームレートが落ちない。動きは流体や群れのように見えることが多い。", "notThis": "通常の CPU パーティクル（CPU で1粒ずつ更新し、数百〜数千が上限）とは違い、シミュレーションを compute shader で行う。見た目の違いは主に「桁違いの数」と全体のまとまった流れ。", "use": "膨大な数が必要な場面：魔法の渦、ホタルの大群、吹雪、大規模な炸裂、マップ全体の環境パーティクルなど。", "prompt": "エンジンに GPU パーティクルシステムを追加して。粒子の状態は RWStructuredBuffer に置き、毎フレーム compute shader で位置・速度・寿命を更新（curl noise の力場を加える）。死んだ粒子は append/consume のインデックスバッファで再利用し、DrawInstancedIndirect でビルボード描画。100,000 粒子で 60fps を目標に、生存数のデバッグ表示も付けて。"}, "params": "max count · emit rate · force fields (curl noise, attractors) · lifetime · sort (none / bitonic) · collision (depth buffer)", "impl": "HLSL-style example (GLSL: SSBOs): StructuredBuffer<Particle> with UAV; dead-list as AppendStructuredBuffer; emit CS + update CS (Dispatch(ceil(N/256))); CopyStructureCount into an indirect-args buffer then DrawInstancedIndirect with a VS that reads the buffer by SV_InstanceID and expands a quad. Additive particles need no sorting; alpha particles need a bitonic sort pass.", "related": ["ENV-11", "VFX-03", "FX-01 Sprite / Billboard particles"], "refs": [{"t": "Microsoft Learn — Direct3D 11 compute shader", "u": "https://learn.microsoft.com/en-us/windows/win32/direct3d11/direct3d-11-advanced-stages-compute-shader"}, {"t": "Microsoft Learn — Introduction to buffers in Direct3D 11", "u": "https://learn.microsoft.com/en-us/windows/win32/direct3d11/overviews-direct3d-11-resources-buffers-intro"}, {"t": "Godot docs — GPUParticles2D class", "u": "https://docs.godotengine.org/en/stable/classes/class_gpuparticles2d.html"}, {"t": "Unity — Visual Effect Graph manual (GPU particles)", "u": "https://docs.unity3d.com/Packages/com.unity.visualeffectgraph@17.0/manual/index.html"}, {"t": "Bridson et al. — Curl-noise for procedural fluid flow (SIGGRAPH 2007, PDF)", "u": "https://www.cs.ubc.ca/~rbridson/docs/bridson-siggraph2007-curlnoise.pdf"}], "nosrc": false}, {"id": "VFX-03", "cat": "VFX", "sub": "載體與技術", "std": "Flowmap", "aliases": ["Flow map", "Vector-field distortion", "Flow field texture"], "type": "S", "zh": {"name": "流向圖（Flowmap）", "observe": "水、岩漿、霧、能量的紋理沿着指定方向流動，例如河水繞過石頭、在彎位轉向，而不是整片同一方向滾動。通常隱約看得到兩層紋理交替淡入淡出。", "notThis": "不是 UV 滾動（VFX-05，整張貼圖同一方向勻速移動）；流向圖每個像素的流動方向和速度都可以不同。也不是畫面扭曲（FX-07，把背景折射變形）。", "use": "河流、瀑布底、岩漿、魔法能量池、旋渦等需要「繞着東西流」的表面；對俯視角像素遊戲的河流特別有用。", "prompt": "在遊戲的河流加入 flowmap：用一張 RG 貼圖（R=x, G=y 流向，0.5 為靜止）描述水流繞過石頭和橋墩，shader 以兩個相位（相差半周期）偏移水紋 UV 並交叉淡化，週期 1.5 秒；之後再把結果量化到調色盤，保持像素風。"}, "en": {"name": "Flowmap", "observe": "The texture of water, lava, mist or energy moves along authored directions — a river bends around a rock and turns at a corner — instead of the whole surface scrolling one way. You can often faintly see two layers of the pattern cross-fading.", "notThis": "Not UV scrolling (VFX-05, the whole texture moving uniformly in one direction); a flowmap gives every pixel its own direction and speed. Not screen distortion (FX-07, refracting the background).", "use": "Rivers, waterfall pools, lava, magic energy pools and whirlpools — anything that must flow around things; great for rivers in top-down pixel games.", "prompt": "Add a flowmap to the game river: an RG texture (R = x, G = y flow, 0.5 = still) describing water flowing around rocks and bridge posts. The shader offsets the water-pattern UV with two phases half a cycle apart and cross-fades them, period 1.5 s; then quantise the result to the palette to stay pixel-art."}, "ja": {"name": "フローマップ", "observe": "水・溶岩・霧・エネルギーの模様が指定した方向に沿って流れる。川が岩を回り込み、曲がり角で向きを変えるなど、全面が一方向にスクロールするのではない。2 層の模様が交互にクロスフェードしているのがうっすら見えることが多い。", "notThis": "UV スクロール（VFX-05、テクスチャ全体が一方向に等速移動）とは違い、ピクセルごとに流れの向きと速さが変えられる。画面歪み（FX-07、背景を屈折させる）でもない。", "use": "川・滝つぼ・溶岩・魔法のエネルギー溜まり・渦など「何かを回り込んで流れる」表面。見下ろし型ドット絵ゲームの川に特に有効。", "prompt": "ゲームの川にフローマップを入れて。RG テクスチャ（R=x、G=y の流れ、0.5 が静止）で岩や橋脚を回り込む流れを描き、シェーダで水紋の UV を半周期ずれた 2 つの位相でずらしてクロスフェード、周期 1.5 秒。最後にパレットへ量子化してドット絵感を保つこと。"}, "params": "flow strength · cycle period · pattern tiling · flow texture resolution · noise offset per pixel (hides pulsing)", "impl": "PS: float2 f = flowTex.Sample(s, uv).rg*2-1; float p0 = frac(t/period), p1 = frac(t/period+0.5); float w = abs(1-2*p0); col = lerp(tex(uv - f*p0*k), tex(uv - f*p1*k), 1-w). Add a noise value to t per pixel to break up the synchronous pulse. Author the flow texture in a paint tool or bake from a path spline.", "related": ["VFX-05", "ENV-12", "ENV-13", "FX-07 Distortion / Refraction"], "refs": [{"t": "Catlike Coding — Texture distortion (flowmaps)", "u": "https://catlikecoding.com/unity/tutorials/flow/texture-distortion/"}, {"t": "Alex Vlachos — Water flow in Portal 2 (SIGGRAPH 2010, PDF)", "u": "https://alex.vlachos.com/graphics/Vlachos-SIGGRAPH10-WaterFlow.pdf"}], "nosrc": false}, {"id": "VFX-04", "cat": "VFX", "sub": "載體與技術", "std": "Dissolve", "aliases": ["Burn-away", "Noise dissolve", "Disintegration", "Dissolve shader"], "type": "C", "zh": {"name": "溶解／燒走", "observe": "物件沿着一個不規則的噪聲邊緣逐步消失，邊緣通常有一圈發光（橙色像燒紙、藍色像魔法）。反過來播就變成「浮現」。", "notThis": "不是淡出（整體一起變透明）；溶解是一部分完全不見、一部分完全保留，中間只有發光邊。也不是死亡特效（FB-04，爆成碎片）或碎裂（VFX-19，裂成幾何碎塊飛走）。", "use": "敵人死亡、召喚物消失、建築被魔法抹除、物件浮現；也可做轉場。", "prompt": "在遊戲加入溶解效果：敵人死後 0.8 秒內，用 8×8 像素塊的噪聲作門檻，把精靈逐格消去，邊緣 1 像素顯示橙黃色發光；要對齊像素格，不要平滑漸變。同一個 shader 反向播放用於敵人從傳送門浮現。"}, "en": {"name": "Dissolve", "observe": "An object disappears along an irregular noise edge, usually with a glowing rim (orange like burning paper, blue for magic). Played in reverse it becomes a materialise.", "notThis": "Not a fade (everything turns transparent together); with a dissolve, parts are fully gone and parts fully remain, with only a glowing edge between. Not a death pop (FB-04, bursting into chunks) or a shatter (VFX-19, breaking into geometric shards that fly off).", "use": "Enemy deaths, summons vanishing, buildings erased by magic, objects appearing; can also be a transition.", "prompt": "Add a dissolve to the game: over 0.8 s after an enemy dies, threshold the sprite against noise in 8×8-pixel blocks so it is erased cell by cell, with a 1-pixel orange-yellow glowing rim at the edge. Keep it snapped to the pixel grid, no smooth gradients. Reuse the same shader in reverse for enemies emerging from a portal."}, "ja": {"name": "ディゾルブ（焼失）", "observe": "オブジェクトが不規則なノイズ状の縁に沿って少しずつ消えていき、縁には光るライン（紙が燃えるようなオレンジや、魔法らしい青）があることが多い。逆再生すると「出現」になる。", "notThis": "フェード（全体が一緒に透明になる）とは違い、完全に消えた部分と完全に残る部分があり、その間に光る縁だけがある。撃破演出（FB-04、破片に弾ける）や破砕（VFX-19、幾何学的な破片が飛ぶ）でもない。", "use": "敵の撃破、召喚物の消滅、魔法で消される建物、オブジェクトの出現。画面転換にも使える。", "prompt": "ゲームにディゾルブを追加して。敵撃破後 0.8 秒で、ノイズを閾値にしてスプライトを 1 ドット単位で消していき、縁の 1 ドットはオレンジ〜黄色に光らせる。ピクセルグリッドに揃え、滑らかなグラデーションにしないこと。同じシェーダを逆再生してポータルから出てくる敵にも使う。"}, "params": "progress 0..1 · noise scale · edge width · edge colour/HDR intensity · direction bias (top-down, from hit point) · pixel snapping", "impl": "PS: float n = noiseTex.Sample(pointSampler, uv*scale).r (+ optional gradient for direction); clip(n - progress); edge = 1 - smoothstep(0, edgeW, n - progress); col.rgb = lerp(col.rgb, edgeColor*intensity, edge). For pixel art sample the noise at sprite-texel resolution (floor(uv*texSize)) with point filtering.", "related": ["FB-04", "TRN-03", "VFX-15", "VFX-19"], "refs": [{"t": "Cyanilux — Dissolve shader breakdown", "u": "https://www.cyanilux.com/tutorials/dissolve-shader-breakdown/"}, {"t": "The Book of Shaders — Noise", "u": "https://thebookofshaders.com/11/"}, {"t": "Godot docs — CanvasItem shaders", "u": "https://docs.godotengine.org/en/stable/tutorials/shaders/shader_reference/canvas_item_shader.html"}], "nosrc": false}, {"id": "VFX-05", "cat": "VFX", "sub": "載體與技術", "std": "UV scrolling", "aliases": ["Panning texture", "UV panning", "Texture scrolling", "Scrolling UVs"], "type": "S", "zh": {"name": "UV 滾動（貼圖平移）", "observe": "一條瀑布、輸送帶、能量光束或魔法環上的紋理不斷向一個方向流動，而物件本身沒有移動；兩層以不同速度滾動時會有深度感。", "notThis": "不是流向圖（VFX-03，每點方向不同）；UV 滾動整塊同方向同速。也不是序列格動畫（FX-04，逐格換圖）；這裏只有一張圖在移位。", "use": "瀑布、輸送帶、河流（簡單版）、光束、傳送門、旋轉魔法陣的紋理，成本極低。", "prompt": "在遊戲中，瀑布和光束用 UV 滾動：瀑布貼圖以 40px/s 向下滾動，再疊一層 70px/s、50% 透明的白色水紋；偏移量要四捨五入到整像素，避免像素抖動。光束貼圖沿長度方向 120px/s 滾動。"}, "en": {"name": "UV scrolling", "observe": "The texture on a waterfall, conveyor, energy beam or magic ring keeps moving in one direction while the object itself stays still; two layers at different speeds give a sense of depth.", "notThis": "Not a flowmap (VFX-03, direction varies per point); UV scrolling moves the whole texture uniformly. Not a flipbook (FX-04, swapping frames); here a single image is offset.", "use": "Waterfalls, conveyors, simple rivers, beams, portals, spinning magic-circle textures — extremely cheap.", "prompt": "In your game, use UV scrolling for waterfalls and beams: the waterfall texture scrolls down at 40 px/s with a second white ripple layer at 70 px/s and 50% opacity; round the offset to whole pixels to avoid shimmering. Beam textures scroll along their length at 120 px/s."}, "ja": {"name": "UV スクロール（テクスチャのパン）", "observe": "滝・ベルトコンベア・エネルギービーム・魔法陣の模様が一方向に流れ続けるが、物体そのものは動かない。2 層を違う速度で流すと奥行きが出る。", "notThis": "フローマップ（VFX-03、点ごとに向きが違う）とは違い、全体が同じ向き・同じ速さで動く。フリップブック（FX-04、コマを差し替える）でもなく、1 枚の画像をずらしているだけ。", "use": "滝、コンベア、簡易的な川、ビーム、ポータル、回転する魔法陣の模様など。非常に低コスト。", "prompt": "ゲームで滝とビームに UV スクロールを使って。滝のテクスチャは 40px/s で下へ流し、70px/s・不透明度 50% の白い水紋を重ねる。オフセットは整数ピクセルに丸めてチラつきを防ぐ。ビームのテクスチャは長さ方向に 120px/s で流す。"}, "params": "speed (u,v) per layer · layer count & blend · tiling · pixel snapping of offset · wrap mode", "impl": "VS or PS: uv += speed * time (wrap/repeat sampler). Pass time in a per-frame constant buffer; keep time modulo the texture period to avoid float precision loss after hours. For pixel art: offset = floor(speed*time*texSize)/texSize.", "related": ["VFX-03", "VFX-11", "FX-04 Flipbook / Sprite-sheet animation"], "refs": [{"t": "Unity Shader Graph — Tiling And Offset node", "u": "https://docs.unity3d.com/Packages/com.unity.shadergraph@17.0/manual/Tiling-And-Offset-Node.html"}, {"t": "Godot docs — Your first 2D shader (UV / TIME)", "u": "https://docs.godotengine.org/en/stable/tutorials/shaders/your_first_shader/your_first_2d_shader.html"}], "nosrc": false}, {"id": "VFX-06", "cat": "VFX", "sub": "戰鬥特效", "std": "Shockwave", "aliases": ["Ring wave", "Shock ring", "Distortion ring", "Impact ring"], "type": "C", "zh": {"name": "衝擊波環", "observe": "重擊、落地、爆炸時，從中心向外擴散一個圓環：環內外的畫面被推開扭曲，環本身有一條亮邊，越擴越淡、越擴越薄。", "notThis": "不是水紋（ENV-13，多圈持續的小波紋）；衝擊波通常只有一圈、很快。也不是畫面震動（FB-07，整個鏡頭搖）。", "use": "強調重擊、Boss 落地、爆炸、技能釋放的力量範圍；同時可提示攻擊範圍。", "prompt": "在遊戲中，攻城槌撞城門或 Boss 落地時，從撞擊點擴散一圈衝擊波：0.4 秒內半徑由 0 到 60px，環寬 6px 由厚變薄，環內畫面向外位移最多 3px，同時畫一條 1px 白色亮環並淡出；配合少量塵土粒子。"}, "en": {"name": "Shockwave", "observe": "On a heavy hit, landing or explosion, a ring expands from the centre: the image is pushed and distorted around the ring, which has a bright edge that fades and thins as it grows.", "notThis": "Not water ripples (ENV-13, several small continuous rings); a shockwave is usually one fast ring. Not screen shake (FB-07, moving the whole camera).", "use": "Sells the force and radius of heavy hits, boss landings, explosions and skill casts; also hints at the area of effect.", "prompt": "In your game, when the battering ram hits the gate or a boss lands, emit a shockwave from the impact point: radius 0→60 px over 0.4 s, ring width 6 px thinning out, pixels inside the ring displaced outward by up to 3 px, plus a 1-px white ring that fades; add a few dust particles."}, "ja": {"name": "衝撃波リング", "observe": "強打・着地・爆発の時、中心から円環が広がる。リングの周りの画面が押しのけられて歪み、リング自体は明るい縁を持ち、広がるほど薄く細くなる。", "notThis": "水の波紋（ENV-13、小さな輪が何重にも続く）とは違い、衝撃波は普通 1 本で速い。画面揺れ（FB-07、カメラ全体が揺れる）でもない。", "use": "強打、ボスの着地、爆発、スキル発動の力強さと範囲を伝える。攻撃範囲のヒントにもなる。", "prompt": "ゲームで、破城槌が門に当たった時やボスが着地した時に衝撃波を出して。0.4 秒で半径 0→60px、リング幅 6px は徐々に細く、リング内の画面を最大 3px 外向きにずらし、1px の白いリングを描いてフェードアウト。少量の土煙パーティクルも添える。"}, "params": "max radius · duration · ring width · displacement strength · ring colour · easing (ease-out)", "impl": "Render the scene to an offscreen RT, then a full-screen (or bounding-quad) PS: d = length(uv - c); k = ring profile (smoothstep band around r(t)); uv2 = uv + normalize(uv - c) * k * strength; sample scene at uv2. Draw the bright rim as a separate additive ring sprite. Support several simultaneous waves via a small constant-buffer array.", "related": ["FB-07", "ENV-13", "VFX-09", "FX-07 Distortion / Refraction"], "refs": [{"t": "Harry Alisavakis — My take on shaders: shockwave effect", "u": "https://halisavakis.com/my-take-on-shaders-shockwave-effect/"}, {"t": "Wikipedia — Shock wave (physical background)", "u": "https://en.wikipedia.org/wiki/Shock_wave"}, {"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}], "nosrc": false}, {"id": "VFX-07", "cat": "VFX", "sub": "戰鬥特效", "std": "Slash VFX", "aliases": ["Sword arc", "Swoosh", "Slash trail", "Weapon trail"], "type": "C", "zh": {"name": "刀光弧", "observe": "揮劍或揮爪時，武器掃過的路徑留下一道新月形的光弧：前端最亮最粗，尾端變細變淡，通常白色核心配一圈顏色。", "notThis": "不是殘影（FX-03，留下整個角色姿勢的影子）；也不是一般拖尾（FX-02，跟住移動物件的長條）。刀光弧是對應一次揮擊動作、形狀固定的弧形特效。", "use": "讓近戰攻擊的範圍和方向清楚可見；小型像素角色揮武器時特別需要，否則動作太細看不見。", "prompt": "在遊戲中為主角的劍攻擊加刀光弧：揮擊 0.12 秒內，從 −60° 掃到 +80° 畫一道半徑 14px 的新月弧，前緣白色 2px、外圈淺藍，尾部 0.1 秒內收窄淡出；命中時在弧線末端加 3–4 粒火花。"}, "en": {"name": "Slash VFX", "observe": "When a sword or claw swings, the path it sweeps leaves a crescent of light: brightest and thickest at the leading edge, thinning and fading toward the tail, usually a white core with a coloured rim.", "notThis": "Not afterimages (FX-03, copies of the whole character pose); not a generic trail (FX-02, a ribbon following a moving object). A slash is a fixed-shape arc tied to a single swing.", "use": "Makes the reach and direction of melee attacks readable — essential for small pixel characters whose weapon swing is otherwise too tiny to see.", "prompt": "Add a slash arc to the hero’s sword attack in the game: during the 0.12 s swing, sweep a crescent of radius 14 px from −60° to +80°, 2 px white leading edge and pale-blue outer band, with the tail narrowing and fading over 0.1 s; on hit, add 3–4 sparks at the end of the arc."}, "ja": {"name": "斬撃エフェクト（剣閃）", "observe": "剣や爪を振ると、武器が通った軌跡に三日月形の光の弧が残る。先端が最も明るく太く、後ろほど細く薄くなる。白い芯に色の縁が付くことが多い。", "notThis": "残像（FX-03、キャラ全体のポーズが残る）でも一般的なトレイル（FX-02、移動物体を追う帯）でもない。斬撃は1回の振りに対応する形の決まった弧。", "use": "近接攻撃の範囲と方向をはっきり見せる。小さなドット絵キャラでは武器の振りが細すぎて見えないので特に必要。", "prompt": "ゲームの主人公の剣攻撃に斬撃エフェクトを付けて。0.12 秒の振りの間に −60°→+80° へ半径 14px の三日月形を描き、先端は白 2px、外側は薄い青、尾は 0.1 秒で細くなって消える。命中時は弧の先端に火花を 3〜4 粒。"}, "params": "arc angle range · radius · thickness profile · core/rim colours · lifetime of tail · sweep easing · hit sparks", "impl": "Build a triangle-strip mesh each frame: N segments along the arc from angleStart to angleNow; per-vertex alpha/width from segment age (age = now - segmentTime). Or author a crescent flipbook (cheap for pixel art: 3–4 frames). Draw additive, after characters, with the strip in world space attached to the character pivot.", "related": ["FX-02 Trails / Ribbons", "FX-03 Afterimages", "VFX-08", "FB-06"], "refs": [{"t": "Real Time VFX community (realtimevfx.com)", "u": "https://realtimevfx.com/"}, {"t": "Unity Manual — Trail Renderer", "u": "https://docs.unity3d.com/Manual/class-TrailRenderer.html"}, {"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}], "nosrc": false}, {"id": "VFX-08", "cat": "VFX", "sub": "戰鬥特效", "std": "Projectile trail", "aliases": ["Tracer", "Bullet trail", "Arrow trail", "Missile trail"], "type": "C", "zh": {"name": "彈道拖尾", "observe": "箭、子彈、魔法彈、炮彈飛行時身後留下一條逐漸變細、變淡的軌跡：可能是一條光線、一串粒子或一串煙團。", "notThis": "不是光束（VFX-11，持續連接兩點的一條線）；拖尾跟着會移動的投射物，舊的部分隨時間消失。也不是刀光弧（VFX-07，一次揮擊的固定弧形）。", "use": "讓玩家看清投射物從哪裏來、往哪裏去、速度多快；塔防場面有大量箭矢時特別重要。", "prompt": "在遊戲中為箭塔的箭加拖尾：記錄最近 6 個位置，畫成由 2px 收窄到 0px 的淡黃色線，0.15 秒淡出；法師塔魔法彈則每 0.03 秒在身後放一粒紫色粒子，0.3 秒縮小消失；投石則留下灰色煙團。"}, "en": {"name": "Projectile trail", "observe": "Arrows, bullets, magic bolts and cannonballs leave a thinning, fading trail behind them — a streak of light, a string of particles or a series of smoke puffs.", "notThis": "Not a beam (VFX-11, a line continuously connecting two points); a trail follows a moving projectile and its old part expires over time. Not a slash (VFX-07, a fixed arc for one swing).", "use": "Shows where a projectile came from, where it is going and how fast; vital in tower-defence scenes full of arrows.", "prompt": "Add trails to arrow-tower arrows in the game: keep the last 6 positions and draw a pale-yellow line tapering 2 px→0 px that fades over 0.15 s. Mage-tower bolts drop a purple particle every 0.03 s that shrinks away over 0.3 s; catapult stones leave grey smoke puffs."}, "ja": {"name": "弾道トレイル（トレーサー）", "observe": "矢・弾丸・魔法弾・砲弾が飛ぶと、後ろに細く薄くなっていく軌跡が残る。光の筋、粒子の列、煙の玉の列などがある。", "notThis": "ビーム（VFX-11、2点を常につなぐ線）とは違い、トレイルは動く投射物を追い、古い部分は時間で消える。斬撃（VFX-07、1回の振りの固定の弧）でもない。", "use": "投射物がどこから来てどこへ向かい、どれくらい速いかを見せる。矢が大量に飛ぶタワーディフェンスでは特に重要。", "prompt": "ゲームの弓塔の矢にトレイルを付けて。直近 6 点の位置を記録して、2px→0px に細くなる淡い黄色の線を描き 0.15 秒でフェード。魔法塔の魔法弾は 0.03 秒ごとに紫の粒子を後ろに落として 0.3 秒で縮んで消える。投石は灰色の煙の玉を残す。"}, "params": "history length / sample spacing · width taper · fade time · emit-by-distance vs by-time · colour · world vs local space", "impl": "Ring buffer of past positions per projectile (CPU), expanded into a camera-facing triangle strip each frame in a dynamic vertex buffer (rewritten each frame). For particle trails, emit by distance travelled so speed changes do not leave gaps.", "related": ["VFX-11", "VFX-07", "FB-15", "FX-02 Trails / Ribbons"], "refs": [{"t": "Unity Manual — Trail Renderer", "u": "https://docs.unity3d.com/Manual/class-TrailRenderer.html"}, {"t": "Unity Manual — Particle System Trails module", "u": "https://docs.unity3d.com/Manual/PartSysTrailsModule.html"}, {"t": "Wikipedia — Tracer ammunition", "u": "https://en.wikipedia.org/wiki/Tracer_ammunition"}, {"t": "Godot docs — Line2D class", "u": "https://docs.godotengine.org/en/stable/classes/class_line2d.html"}], "nosrc": false}, {"id": "VFX-09", "cat": "VFX", "sub": "戰鬥特效", "std": "Explosion", "aliases": ["Layered explosion", "Fireball", "Blast", "Burst"], "type": "S", "zh": {"name": "爆炸（分層）", "observe": "一次爆炸由幾層依次組成：1–2 幀全白閃光 → 迅速膨脹的火球 → 向外飛的碎片和火花 → 慢慢升起、擴散、變暗的煙 → 地上留下焦痕。每層時長不同。", "notThis": "不是死亡特效（FB-04，敵人被擊倒的收尾）；也不是衝擊波（VFX-06，只有一圈環）。爆炸是多層組合，衝擊波往往只是其中一層。", "use": "炸彈、火藥桶、法術命中、建築被毀；分層做法讓爆炸有「重量」並可按大小縮放。", "prompt": "在遊戲中做火藥桶爆炸：第 0 幀白色閃光圓 24px（2 幀）；火球 0.25 秒由 6px 膨脹到 22px，顏色黃→橙→紅；同時噴出 12 粒碎木片受重力；煙團 1.2 秒內上升 20px、變大並由深灰轉淡；最後留下一個 3 秒後淡出的黑色焦痕貼花，並觸發一次畫面震動。"}, "en": {"name": "Explosion", "observe": "An explosion is a stack of layers in sequence: a 1–2 frame white flash → a rapidly expanding fireball → debris and sparks flying out → smoke that rises, spreads and darkens slowly → a scorch mark left on the ground. Each layer has its own duration.", "notThis": "Not a death effect (FB-04, the closing beat of a defeated enemy) nor a shockwave (VFX-06, a single ring). An explosion is a composite; a shockwave is often just one of its layers.", "use": "Bombs, powder kegs, spell impacts, destroyed buildings; layering gives weight and lets you scale small→large.", "prompt": "Build a powder-keg explosion in the game: frame 0 a 24 px white flash circle (2 frames); fireball grows 6→22 px over 0.25 s, colour yellow→orange→red; at the same time 12 wood splinters fly out under gravity; smoke puffs rise 20 px over 1.2 s while growing and fading from dark grey; finally leave a black scorch decal that fades after 3 s, and trigger one screen shake."}, "ja": {"name": "爆発（レイヤー構成）", "observe": "1 回の爆発は順番に重なる層でできている：1〜2 フレームの真っ白な閃光 → 急速に膨らむ火球 → 外へ飛ぶ破片と火花 → ゆっくり昇り広がって暗くなる煙 → 地面に残る焦げ跡。層ごとに長さが違う。", "notThis": "撃破演出（FB-04、倒された敵の締め）や衝撃波（VFX-06、リング1本）とは違う。爆発は複数層の組み合わせで、衝撃波はその一部にすぎないことが多い。", "use": "爆弾、火薬樽、魔法の着弾、建物の破壊。層に分けることで重さが出て、大小にスケールしやすい。", "prompt": "ゲームで火薬樽の爆発を作って。0 フレーム目に 24px の白い閃光円（2 フレーム）、火球は 0.25 秒で 6→22px に膨らみ色は黄→橙→赤、同時に木片 12 個を重力付きで飛ばす。煙は 1.2 秒で 20px 上昇しながら大きくなり濃い灰色から薄くなる。最後に黒い焦げ跡デカールを残して 3 秒後にフェード、画面揺れも 1 回入れて。"}, "params": "flash frames · fireball size & duration · colour over life · debris count & gravity · smoke lifetime & rise · scorch decal lifetime · scale factor", "impl": "Author as a parent effect with sub-emitters (flash sprite, fireball flipbook or scaled additive circle, debris CPU particles, alpha-blended smoke sorted back-to-front, decal). Draw order: decal → smoke (alpha) → fireball/flash (additive blend, One/One). Drive all layers from one normalized time so the whole effect scales.", "related": ["VFX-06", "VFX-18", "VFX-12", "FB-07", "FB-15"], "refs": [{"t": "Unity Manual — Particle System Sub Emitters module", "u": "https://docs.unity3d.com/Manual/PartSysSubEmitModule.html"}, {"t": "Unity Manual — Color over Lifetime module", "u": "https://docs.unity3d.com/Manual/PartSysColorOverLifeModule.html"}, {"t": "Wikipedia — Explosion (physical background)", "u": "https://en.wikipedia.org/wiki/Explosion"}, {"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}], "nosrc": false}, {"id": "VFX-10", "cat": "VFX", "sub": "戰鬥特效", "std": "Lightning", "aliases": ["Electric arc", "Lightning bolt", "Chain lightning", "Zap"], "type": "S", "zh": {"name": "閃電／電弧", "observe": "兩點之間出現鋸齒狀、會分叉的亮線，每隔幾幀整條重新生成形狀，外面有一圈藍白色光暈；連鎖閃電會由一個目標跳到下一個。", "notThis": "不是光束（VFX-11，平直、穩定、持續的線）；電弧形狀不斷跳動。也不是天氣閃電爆光（ENV-06，整個畫面變白）。", "use": "電系法術、電塔、連鎖攻擊、機械短路；跳動感本身就傳達「危險、高能」。", "prompt": "在遊戲加入電擊塔：每次攻擊從塔頂向最近的敵人發出電弧，用中點位移法生成 5 層細分的鋸齒線，每 0.05 秒重新隨機一次，持續 0.25 秒；再從第一個目標跳到 60px 內另外兩隻敵人。線心白色 1px、外圈淺藍光暈，命中時敵人閃白。"}, "en": {"name": "Lightning", "observe": "A jagged, branching bright line appears between two points, regenerating its shape every few frames, with a blue-white glow; chain lightning hops from one target to the next.", "notThis": "Not a beam (VFX-11, a straight, stable, continuous line); an arc keeps jittering. Not a weather lightning flash (ENV-06, the whole screen lighting up).", "use": "Electric spells, tesla towers, chain attacks, machinery shorting out; the jitter itself says \"dangerous, high-energy\".", "prompt": "Add a shock tower to the game: each attack fires an arc from the tower top to the nearest enemy, generated by midpoint displacement with 5 subdivision levels, re-randomised every 0.05 s for 0.25 s; then it chains from the first target to two more enemies within 60 px. White 1-px core with a pale-blue glow; struck enemies hit-flash."}, "ja": {"name": "稲妻・電撃アーク", "observe": "2点の間にギザギザで枝分かれする明るい線が現れ、数フレームごとに形が作り直され、周りに青白い光のにじみがある。チェインライトニングは標的から標的へ跳ぶ。", "notThis": "ビーム（VFX-11、まっすぐで安定し持続する線）とは違い、アークは常に形が跳ねる。天候の稲光（ENV-06、画面全体が白くなる）でもない。", "use": "雷属性の魔法、テスラ塔、連鎖攻撃、機械のショート。跳ねる感じそのものが「危険・高エネルギー」を伝える。", "prompt": "ゲームに電撃塔を追加して。攻撃のたびに塔の上から最寄りの敵へアークを飛ばす。中点変位法で 5 段階分割したギザギザ線を 0.05 秒ごとに再生成、0.25 秒持続。最初の標的から 60px 以内の別の敵 2 体へ連鎖。芯は白 1px、外側は薄い青のグロー、命中した敵はヒットフラッシュ。"}, "params": "subdivision depth · jitter amplitude (relative to length) · regen interval · branch probability · glow width · chain range & count", "impl": "CPU: recursive midpoint displacement (offset ∝ segment length × roughness), optional branches at random midpoints; upload as a line strip expanded to quads in a GS or on the CPU. Draw twice: wide low-alpha glow + thin white core, both additive. Seed the RNG with floor(time/regenInterval) for deterministic replay.", "related": ["VFX-11", "ENV-06", "FB-01"], "refs": [{"t": "Envato Tuts+ — How to generate shockingly good 2D lightning effects", "u": "https://gamedevelopment.tutsplus.com/how-to-generate-shockingly-good-2d-lightning-effects--gamedev-2681t"}, {"t": "Wikipedia — Lichtenberg figure", "u": "https://en.wikipedia.org/wiki/Lichtenberg_figure"}, {"t": "Wikipedia — Lightning (physical background)", "u": "https://en.wikipedia.org/wiki/Lightning"}], "nosrc": false}, {"id": "VFX-11", "cat": "VFX", "sub": "戰鬥特效", "std": "Beam", "aliases": ["Laser", "Ray", "Continuous beam", "Channelled beam"], "type": "C", "zh": {"name": "光束／激光", "observe": "一條持續連接施放者與目標的直線光柱：起點有發射光、終點有命中火花，中段紋理沿光束流動，寬度會輕微脈動；通常有充能 → 持續 → 收束三段。", "notThis": "不是彈道拖尾（VFX-08，跟着飛行物、會消失）；也不是閃電（VFX-10，鋸齒、每幾幀變形）。光束是穩定的一條直線，只要持續施放就一直存在。", "use": "持續傷害技能、治療光束、防禦塔鎖定、吸取生命；清楚顯示「誰正在打誰」。", "prompt": "在遊戲加入法師塔光束：先在塔頂充能 0.3 秒（光點變大），然後射出寬 4px 的紫白光束到目標，光束紋理沿長度方向以 120px/s 滾動、寬度每 0.1 秒在 3–5px 之間脈動；目標處有持續的火花噴濺。停止時光束在 0.1 秒內收窄到 0。"}, "en": {"name": "Beam", "observe": "A straight shaft of light continuously connects the caster and target: a muzzle glow at the start, impact sparks at the end, a texture flowing along the middle, and a slight width pulse; usually charge → sustain → wind-down.", "notThis": "Not a projectile trail (VFX-08, following a flying object and expiring); not lightning (VFX-10, jagged and re-shaped every few frames). A beam is one stable straight line that persists while channelled.", "use": "Channelled damage, healing beams, tower lock-ons, life drain; clearly shows who is hitting whom.", "prompt": "Add a mage-tower beam to the game: charge for 0.3 s at the tower top (a growing light point), then fire a 4 px purple-white beam to the target; its texture scrolls along the length at 120 px/s and the width pulses between 3–5 px every 0.1 s; continuous spark spray at the target. On stop, the beam narrows to 0 over 0.1 s."}, "ja": {"name": "ビーム（レーザー）", "observe": "術者と標的を常につなぐまっすぐな光の柱。始点に発射光、終点に着弾の火花、中間は模様がビームに沿って流れ、幅がわずかに脈打つ。普通は チャージ → 持続 → 収束 の 3 段階。", "notThis": "弾道トレイル（VFX-08、飛ぶ物体を追って消える）や稲妻（VFX-10、ギザギザで数フレームごとに変形）とは違う。ビームは安定した 1 本の直線で、照射している間ずっと存在する。", "use": "持続ダメージ技、回復ビーム、塔のロックオン、ドレイン。「誰が誰を攻撃しているか」がはっきり分かる。", "prompt": "ゲームに魔法塔のビームを追加して。塔の上で 0.3 秒チャージ（光点が大きくなる）してから、幅 4px の紫白のビームを標的へ。模様は長さ方向に 120px/s でスクロール、幅は 0.1 秒ごとに 3〜5px で脈動、標的には火花が出続ける。停止時は 0.1 秒で幅 0 まで細くなる。"}, "params": "width & pulse · texture scroll speed · start/end caps · charge & wind-down times · impact spray rate · colour", "impl": "Single quad (or 3: start cap, stretched body, end cap) oriented from A to B, UV.x = distance in texels so the texture does not stretch; scroll UV.x with time. Additive blend; add a wider low-alpha glow quad underneath. Raycast/physics decides B each frame.", "related": ["VFX-10", "VFX-05", "VFX-08"], "refs": [{"t": "Unity Manual — Line Renderer", "u": "https://docs.unity3d.com/Manual/class-LineRenderer.html"}, {"t": "Godot docs — Line2D class", "u": "https://docs.godotengine.org/en/stable/classes/class_line2d.html"}, {"t": "Real Time VFX community (realtimevfx.com)", "u": "https://realtimevfx.com/"}], "nosrc": false}, {"id": "VFX-12", "cat": "VFX", "sub": "元素", "std": "Fire and smoke", "aliases": ["Flames", "Campfire", "Torch fire", "Smoke plume"], "type": "S", "zh": {"name": "火與煙", "observe": "火焰由底部亮黃、往上變橙紅並縮小消失的粒子組成，跳動閃爍；頂端轉成灰色煙團，慢慢上升、變大、變淡並被風吹斜；偶爾有火星彈出。", "notThis": "不是爆炸（VFX-09，一次性、膨脹）；火與煙是持續循環的。也不是氣場（VFX-14，貼着角色輪廓的光）。", "use": "營火、火把、燃燒的房屋、着火狀態、煙囱；俯視角城鎮裏常見的生活與戰爭氣氛。", "prompt": "在遊戲中做被敵人點燃的房屋火焰：每秒發射 30 粒火焰粒子，壽命 0.6 秒，顏色由 #fff2a0→#f08a3a→#b6483a，大小 3px→1px，上升 18px/s 並左右輕微擺動；火焰粒子用加法混合。另外每秒 6 團煙，壽命 2 秒，由深灰變淡、大小 3px→8px，受風向右漂 10px/s；每秒隨機彈出 2 粒火星。"}, "en": {"name": "Fire and smoke", "observe": "Flames are particles that start bright yellow at the base, turn orange-red as they rise and shrink away, flickering; at the top they become grey smoke puffs that slowly rise, grow, fade and lean with the wind, with the odd ember popping out.", "notThis": "Not an explosion (VFX-09, one-shot and expanding); fire and smoke loop continuously. Not an aura (VFX-14, light hugging a character outline).", "use": "Campfires, torches, burning houses, burning status, chimneys — everyday and wartime atmosphere in a top-down town.", "prompt": "Build fire for a house set alight by enemies in the game: emit 30 flame particles/s, lifetime 0.6 s, colour #fff2a0→#f08a3a→#b6483a, size 3 px→1 px, rising 18 px/s with a slight side-to-side wobble, additive blend. Plus 6 smoke puffs/s, lifetime 2 s, dark grey fading out, size 3→8 px, drifting right with the wind at 10 px/s; pop 2 random embers per second."}, "ja": {"name": "炎と煙", "observe": "炎は根元が明るい黄色で、昇るにつれ橙〜赤になり小さくなって消える粒子でできていて、揺らめく。上端では灰色の煙になり、ゆっくり昇りながら大きく薄くなり風で傾く。時々火の粉が飛ぶ。", "notThis": "爆発（VFX-09、一度きりで膨らむ）とは違い、炎と煙は継続ループ。オーラ（VFX-14、キャラの輪郭に沿う光）でもない。", "use": "焚き火、松明、燃える家、炎上状態、煙突。見下ろし型の町の生活感や戦火の雰囲気に。", "prompt": "ゲームで敵に放火された家の炎を作って。炎の粒子を毎秒 30 個、寿命 0.6 秒、色は #fff2a0→#f08a3a→#b6483a、大きさ 3px→1px、18px/s で上昇しつつ左右に少し揺らし、加算合成。さらに煙を毎秒 6 個、寿命 2 秒、濃い灰色から薄く、大きさ 3→8px、風で右へ 10px/s 流す。火の粉を毎秒 2 個ランダムに飛ばして。"}, "params": "emit rate · lifetime · colour gradient over life · size over life · rise speed · wobble/noise · wind · smoke alpha & growth · ember rate", "impl": "Two emitters: flames additive (BLEND_ONE/ONE) with colour-over-life in a 1D gradient texture; smoke alpha-blended (SRC_ALPHA/INV_SRC_ALPHA) drawn before flames, sorted by age. Pixel-art variant: quantise particle positions to the pixel grid and pick colours from the palette by life bucket instead of lerping.", "related": ["VFX-09", "VFX-01", "VFX-02", "FB-05"], "refs": [{"t": "GPU Gems ch.6 — Fire in the \"Vulcan\" demo", "u": "https://developer.nvidia.com/gpugems/gpugems/part-i-natural-effects/chapter-6-fire-vulcan-demo"}, {"t": "Unity Manual — Color over Lifetime module", "u": "https://docs.unity3d.com/Manual/PartSysColorOverLifeModule.html"}, {"t": "Godot docs — 2D particle systems", "u": "https://docs.godotengine.org/en/stable/tutorials/2d/particle_systems_2d.html"}, {"t": "Wikipedia — Particle system", "u": "https://en.wikipedia.org/wiki/Particle_system"}], "nosrc": false}, {"id": "VFX-13", "cat": "VFX", "sub": "元素", "std": "Magic circle", "aliases": ["Rune circle", "Summoning circle", "Spell circle", "Ground sigil"], "type": "C", "zh": {"name": "魔法陣", "observe": "地面上出現一個由幾個同心圓、符文和幾何圖形組成的圖案：線條先逐段畫出，各圈以不同方向旋轉，發光並脈動；完成後閃一下、向上冒光，然後淡出。", "notThis": "不是範圍指示（FX-08，純粹提示攻擊範圍的簡單形狀）；魔法陣是有裝飾性的施法演出。也不是傳送效果（VFX-15，角色本身消失出現）。", "use": "施法前搖、召喚、傳送門、陷阱、祝福區域；給「蓄力中」一個看得見的過程。", "prompt": "在遊戲加入法師施法魔法陣：在腳下畫一個俯視壓扁（高度 60%）的魔法陣，外圈半徑 18px，0.4 秒內逐段畫出；外圈順時針、內圈逆時針旋轉，中間六芒星；邊緣 8 個符文逐個亮起。施法完成時閃白一次並向上噴出光柱，0.3 秒淡出。"}, "en": {"name": "Magic circle", "observe": "A pattern of concentric rings, runes and geometry appears on the ground: the lines draw on segment by segment, rings spin in opposite directions, glow and pulse; on completion it flashes, shoots light upward and fades.", "notThis": "Not an area-of-effect indicator (FX-08, a plain shape showing where an attack lands); a magic circle is decorative casting theatre. Not a teleport (VFX-15, where the character itself vanishes and appears).", "use": "Spell wind-ups, summons, portals, traps, blessing zones; gives \"charging\" a visible progression.", "prompt": "Add a casting magic circle for mages in the game: draw a circle at their feet squashed to 60% height for the top-down view, outer radius 18 px, drawn on over 0.4 s; outer ring clockwise, inner ring counter-clockwise, a hexagram in the middle, 8 runes around the rim lighting up one by one. On cast, flash white once and shoot a light pillar upward, fading over 0.3 s."}, "ja": {"name": "魔法陣", "observe": "地面に同心円・ルーン・幾何学模様でできた図形が現れる。線が少しずつ描かれ、各リングが逆方向に回転し、光って脈打つ。完成すると一瞬光って上へ光が噴き、フェードアウトする。", "notThis": "範囲表示（FX-08、攻撃範囲を示すだけの単純な形）とは違い、魔法陣は装飾的な詠唱演出。テレポート（VFX-15、キャラ自体が消えて現れる）でもない。", "use": "詠唱の予備動作、召喚、ポータル、罠、祝福エリア。「溜めている」過程を目に見せる。", "prompt": "ゲームの魔法使いの詠唱に魔法陣を追加して。足元に見下ろし用に高さ 60% に潰した魔法陣を描き、外周半径 18px、0.4 秒で線を順に描く。外側のリングは時計回り、内側は反時計回り、中央に六芒星、縁の 8 つのルーンが一つずつ光る。詠唱完了で一度白く光り上へ光の柱を出し、0.3 秒でフェード。"}, "params": "ring count & radii · draw-on duration · rotation speeds per ring · rune count · glow/pulse · perspective squash · completion burst", "impl": "Author ring/rune art as separate textures (or a single SDF texture) on flat quads in world space; per-ring rotation via UV rotation in the PS; draw-on via an angular mask: clip(drawAngle - atan2(uv)). Additive blend with a low-alpha wider glow copy. For top-down 2D just scale Y by 0.6.", "related": ["FX-08 Telegraph / AoE indicator", "VFX-15", "VFX-14", "FX-13 Anticipation / Wind-up"], "refs": [{"t": "Wikipedia — Magic circle (folklore background)", "u": "https://en.wikipedia.org/wiki/Magic_circle"}, {"t": "Real Time VFX community (realtimevfx.com)", "u": "https://realtimevfx.com/"}], "nosrc": true}, {"id": "VFX-14", "cat": "VFX", "sub": "狀態與增益", "std": "Aura", "aliases": ["Buff glow", "Power-up aura", "Outline glow", "Rim aura"], "type": "C", "zh": {"name": "氣場／增益光", "observe": "角色被增益或進入強化狀態時，身體輪廓外圍有一圈發光（會脈動），腳下或身邊有粒子向上飄，有時地面有光圈。只要狀態持續就一直存在。", "notThis": "不是狀態染色（FB-05，把角色本身染色）；氣場在輪廓「外面」。也不是治療效果（VFX-17，一次性的回復演出）或受擊閃白（FB-01）。", "use": "顯示增益、狂暴、無敵、精英敵人、被選中的單位；在混亂戰場中一眼找到重要角色。", "prompt": "在遊戲中，被祝福的居民顯示金色氣場：精靈輪廓外 1px 金色描邊，透明度在 0.5–1 之間每 0.8 秒脈動一次；腳下每 0.15 秒升起一粒金色像素粒子，壽命 0.6 秒、上升 10px；精英敵人則用紅色同款氣場。"}, "en": {"name": "Aura", "observe": "When a character is buffed or powered up, a glowing (pulsing) band surrounds its outline, particles drift upward from its feet or body, and sometimes a ring lies on the ground. It lasts as long as the state does.", "notThis": "Not a status tint (FB-05, colouring the character itself); an aura sits outside the outline. Not a healing effect (VFX-17, a one-shot restore) or a hit flash (FB-01).", "use": "Shows buffs, rage, invulnerability, elite enemies, selected units — lets you spot important characters at a glance in a chaotic battle.", "prompt": "In your game, blessed NPCs show a gold aura: a 1-px gold outline outside the sprite whose opacity pulses between 0.5 and 1 every 0.8 s; every 0.15 s a gold pixel particle rises from the feet, living 0.6 s and rising 10 px. Elite enemies use the same aura in red."}, "ja": {"name": "オーラ（バフの光）", "observe": "バフや強化状態になったキャラの輪郭の外側に光る帯があり（脈打つ）、足元や体から粒子が上へ漂い、地面に光の輪が出ることもある。状態が続く限り表示される。", "notThis": "状態異常の色付け（FB-05、キャラ自体を染める）とは違い、オーラは輪郭の外側にある。回復エフェクト（VFX-17、一度きりの回復演出）やヒットフラッシュ（FB-01）でもない。", "use": "バフ、狂化、無敵、精鋭の敵、選択中のユニットを示す。混沌とした戦場で重要なキャラを一目で見つけられる。", "prompt": "ゲームで祝福された町の人に金色のオーラを付けて。スプライトの外側に 1px の金色の縁取りを付け、不透明度を 0.8 秒周期で 0.5〜1 の間で脈動。足元から 0.15 秒ごとに金色のドット粒子を出し、寿命 0.6 秒で 10px 上昇。精鋭の敵は同じ仕組みで赤いオーラ。"}, "params": "outline width · colour · pulse period & range · particle rate & rise · ground ring on/off · stacking priority (which aura wins)", "impl": "Outline in the sprite PS: sample alpha at 4–8 neighbour texel offsets; if centre alpha = 0 and any neighbour > 0, output aura colour × pulse (requires 1-texel transparent padding in the atlas). Particles from a small CPU emitter attached to the entity. Put aura colour/pulse in per-instance data so many units batch together.", "related": ["FB-05", "VFX-17", "VFX-12", "FB-01"], "refs": [{"t": "Godot docs — CanvasItem shaders", "u": "https://docs.godotengine.org/en/stable/tutorials/shaders/shader_reference/canvas_item_shader.html"}, {"t": "Cyanilux — Forcefield shader breakdown", "u": "https://www.cyanilux.com/tutorials/forcefield-shader-breakdown/"}, {"t": "Wikipedia — Status effect", "u": "https://en.wikipedia.org/wiki/Status_effect"}], "nosrc": false}, {"id": "VFX-15", "cat": "VFX", "sub": "元素", "std": "Spawn / teleport effect", "aliases": ["Warp-in", "Materialise", "Summon effect", "Blink", "Beam-in"], "type": "C", "zh": {"name": "出生／傳送效果", "observe": "角色在一處消失、在另一處出現：常見做法是一道垂直光柱，角色被拉成細長條或縮成一點變白消失，同時粒子向內吸或向外散；出現時順序相反，最後角色「落地」並稍微壓扁回彈。", "notThis": "不是溶解（VFX-04，沿噪聲邊緣慢慢消失，可單獨使用）；傳送是成對的「消失＋出現」並帶方向性。也不是魔法陣（VFX-13，地面施法圖案，可作為傳送的前奏）。", "use": "敵人出生點、傳送門、瞬移技能、召喚單位、復活；讓玩家知道「有東西出現了，而且是在這裏」。", "prompt": "在遊戲做敵人出生效果：出生點先出現一個綠色地面光圈 0.3 秒，然後一道 6px 寬的垂直光柱落下，敵人剪影由 0 高度拉伸至 150% 再回彈到 100%（0.2 秒），同時 8 粒綠色粒子向外散；光柱 0.2 秒收窄消失。主角瞬移則反向：先拉長變白消失，再在目的地出現。"}, "en": {"name": "Spawn / teleport effect", "observe": "A character vanishes in one place and appears in another: typically a vertical light pillar, the character stretched thin or shrunk to a point and turned white, with particles sucked in or scattered out; arrival plays in reverse and ends with the character landing in a small squash-and-stretch.", "notThis": "Not a dissolve (VFX-04, fading along a noise edge, usable on its own); a teleport is a paired vanish + appear with direction. Not a magic circle (VFX-13, a ground casting pattern that may precede a teleport).", "use": "Enemy spawn points, portals, blink skills, summoned units, respawns — tells the player \"something appeared, right here\".", "prompt": "Build an enemy spawn in the game: a green ground ring appears at the spawn point for 0.3 s, then a 6-px vertical light pillar drops, the enemy silhouette stretches from 0 height to 150% and settles to 100% (0.2 s) while 8 green particles scatter outward; the pillar narrows and vanishes over 0.2 s. The hero’s blink is the reverse: stretch, go white and vanish, then appear at the destination."}, "ja": {"name": "出現・テレポート演出", "observe": "キャラがある場所で消えて別の場所に現れる。よくあるのは縦の光の柱で、キャラが細長く引き伸ばされるか一点に縮んで白くなり消え、粒子が吸い込まれるか飛び散る。出現は逆順で、最後に着地して少し潰れて戻る。", "notThis": "ディゾルブ（VFX-04、ノイズ状の縁で消える。単体でも使う）とは違い、テレポートは「消える＋現れる」の対で方向性がある。魔法陣（VFX-13、地面の詠唱図形。テレポートの前振りになり得る）でもない。", "use": "敵の出現地点、ポータル、瞬間移動スキル、召喚ユニット、復活。「何かが現れた、しかもここに」と伝える。", "prompt": "ゲームで敵の出現演出を作って。出現地点に緑の地面リングを 0.3 秒出し、幅 6px の縦の光柱を落とす。敵のシルエットは高さ 0 から 150% に伸びてから 100% に戻り（0.2 秒）、同時に緑の粒子 8 個が外へ散る。光柱は 0.2 秒で細くなって消える。主人公の瞬間移動は逆：伸びて白くなり消えてから目的地に現れる。"}, "params": "pillar width & height · stretch curve · white-out amount · particle in/out count · ground ring · landing squash · delay between vanish and appear", "impl": "Sprite VS scales the quad around its feet pivot (scaleY curve from a small CB value); PS lerps to white with a flash uniform (reuse the hit-flash path). Pillar = additive quad with vertical gradient; particles from a burst emitter with inward velocity (spawn on a circle, velocity toward centre).", "related": ["VFX-04", "VFX-13", "FB-13", "FB-01"], "refs": [{"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}, {"t": "Godot docs — 2D particle systems", "u": "https://docs.godotengine.org/en/stable/tutorials/2d/particle_systems_2d.html"}], "nosrc": true}, {"id": "VFX-16", "cat": "VFX", "sub": "元素", "std": "Pickup sparkle", "aliases": ["Collect effect", "Item glint", "Twinkle", "Shine"], "type": "C", "zh": {"name": "拾取閃光", "observe": "可拾取的物品放在地上時，表面每隔一陣有一下閃光（四角星形閃一下、或一條光斜掃過）；被拾起時爆出星星和光圈，物品飛向介面，數字跳動。", "notThis": "不是拾取吸附（FB-14，物品「飛向玩家」的移動）；閃光是「提示此物可拾取」和「拾取那一下的回饋」。也不是增益氣場（VFX-14，持續包住角色）。", "use": "讓金幣、寶物、資源在雜亂的地面上被看見；拾取時給即時滿足感。", "prompt": "在遊戲中，地上的金幣每 1.2 秒出現一次 5px 四角星閃光（0.15 秒），位置在金幣右上角；被主角拾取時爆出 6 粒黃色星星、一個 0.2 秒擴散到 10px 的光圈，金幣縮小飛向左上角金幣計數，計數放大 130% 再回彈。"}, "en": {"name": "Pickup sparkle", "observe": "A collectable lying on the ground gives a periodic glint (a four-pointed star twinkle or a shine sweeping across it); when picked up it bursts into stars and a ring, flies to the UI and the counter bumps.", "notThis": "Not pickup magnetism (FB-14, the movement of items flying to the player); the sparkle is the \"this can be picked up\" hint plus the feedback of the pickup moment. Not a buff aura (VFX-14, persistently surrounding a character).", "use": "Makes coins, treasure and resources visible on busy ground and gives instant satisfaction on pickup.", "prompt": "In your game, coins on the ground show a 5-px four-pointed star glint (0.15 s) at their top-right every 1.2
