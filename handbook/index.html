倍に制限し、0.5 秒でスムージング。対象が切れないよう、引くときは寄るときの 2 倍の速さにする。"}, "params": "margin px · min/max zoom · zoom smoothing (separate in/out) · aspect handling · per-target weight", "impl": "Compute an AABB of targets in world space, pad it, derive the zoom (2D) or the camera distance/FOV (3D: distance = (boxRadius) / tan(fov/2)). Smooth zoom in log space so in/out feel symmetric; then centre on the box and apply bounds.", "related": ["CAM-13 Group framing", "CAM-19 Zoom", "CAMX-12", "FB-09"], "refs": [{"t": "Itay Keren — Scroll Back: The Theory and Practice of Cameras in Side-Scrollers (Game Developer)", "u": "https://www.gamedeveloper.com/design/scroll-back-the-theory-and-practice-of-cameras-in-side-scrollers"}, {"t": "Cinemachine 3.1 — Group Framing extension", "u": "https://docs.unity3d.com/Packages/com.unity.cinemachine@3.1/manual/CinemachineGroupFraming.html"}], "nosrc": false}, {"id": "CAMX-03", "cat": "CAMX", "sub": "跟隨與構圖規則", "std": "Lock-on camera", "aliases": ["Target lock", "Z-targeting", "Lock-on targeting", "Soft lock"], "type": "S", "zh": {"name": "鎖定敵人鏡頭（Lock-on）", "observe": "按下鎖定鍵後，目標身上出現準星，鏡頭轉到角色身後並一直朝向目標；角色左右移動時會繞著目標橫移，目標保持在畫面中央附近，背景則大幅掃過。", "notThis": "不是繞人物旋轉鏡頭（CAM-10 Orbit camera，由玩家自由轉）；鎖定時朝向由目標決定。也不是自動回正（CAM-12 Recentering，只回到角色背後）。", "use": "3D 動作的一對一戰鬥、需要持續面向敵人的瞄準、與遠處角色對話。", "prompt": "在遊戲中加入鎖定鏡頭：按 L1 鎖定 20 m 內最接近畫面中心的敵人；鏡頭放在「目標→角色」延長線上、角色後方 4 m、高 1.6 m，並把視線對準角色與目標之間 70% 處；目標頭上顯示旋轉準星；切換目標或解除時以 0.25 秒平滑過渡。"}, "en": {"name": "Lock-on camera", "observe": "After pressing the lock button a reticle appears on the target, and the camera swings behind the character and keeps facing the target; moving left or right makes the character strafe around it, so the target stays near the centre while the background sweeps past.", "notThis": "Not an orbit camera (CAM-10 Orbit camera, freely rotated by the player); while locked, the facing is decided by the target. Not auto-recentering (CAM-12 Recentering, which only returns behind the character).", "use": "One-on-one fights in 3D action games, aiming that must keep facing an enemy, talking to distant characters.", "prompt": "In your game, add a lock-on camera: pressing L1 locks the enemy within 20 m that is closest to the screen centre; place the camera on the target→character line, 4 m behind and 1.6 m above the character, aimed at a point 70% of the way from character to target; show a rotating reticle on the target; blend over 0.25 s when switching or releasing."}, "ja": {"name": "ロックオンカメラ（ターゲットロック）", "observe": "ロックボタンを押すと対象に照準が付き、カメラはキャラの背後へ回って常に対象の方を向く。左右に動くとキャラは対象の周りを回り込み、対象は画面中央付近に留まったまま背景が大きく流れる。", "notThis": "オービットカメラ（CAM-10 Orbit camera、プレイヤーが自由に回す）とは違い、ロック中の向きは対象が決める。自動リセンター（CAM-12 Recentering、キャラの背後へ戻すだけ）とも違う。", "use": "3D アクションの一対一の戦闘、敵を向き続ける照準、離れたキャラとの会話。", "prompt": "ゲームにロックオンカメラを追加して：L1 で 20 m 以内・画面中心に最も近い敵をロック。カメラは「対象→キャラ」の延長線上、キャラの 4 m 後方・高さ 1.6 m に置き、キャラから対象へ 70% の地点を注視させる。対象には回転する照準を表示し、切り替え・解除は 0.25 秒で補間する。"}, "params": "lock range · target selection rule · camera distance/height · aim bias between character and target · blend time · break-lock distance", "impl": "Camera yaw = atan2 of (target − character); position = character − dir × distance + up × height; look-at = lerp(character, target, bias). Damp yaw separately from position. Break the lock when the target dies, leaves range, or the line of sight is blocked for > 1 s.", "related": ["CAM-10 Orbit camera", "CAM-12 Recentering", "CAM-11 Over-the-shoulder camera", "CAMX-01"], "refs": [{"t": "Frame Advance — Lock-on targeting", "u": "https://frameadvance.net/mechanics/lock-on-targeting/"}, {"t": "Wikipedia — The Legend of Zelda: Ocarina of Time (Z-targeting section)", "u": "https://en.wikipedia.org/wiki/The_Legend_of_Zelda:_Ocarina_of_Time"}, {"t": "Cinemachine 3.1 — Rotation Composer (aim at a look-at target)", "u": "https://docs.unity3d.com/Packages/com.unity.cinemachine@3.1/manual/CinemachineRotationComposer.html"}], "nosrc": false}, {"id": "CAMX-04", "cat": "CAMX", "sub": "跟隨與構圖規則", "std": "Edge scrolling", "aliases": ["Edge pan", "Screen-edge panning", "Mouse edge scroll"], "type": "C", "zh": {"name": "畫面邊緣推移（Edge scrolling）", "observe": "滑鼠游標移到畫面邊緣的一條窄帶時，鏡頭往那個方向平移；游標越貼近邊緣移得越快，離開窄帶就停下。鏡頭不跟任何角色。", "notThis": "不是跟隨鏡頭（CAM-01／CAM-04，鏡頭跟著角色）；這裡鏡頭完全由游標控制。也不是拖曳平移（按住滑鼠拖動地圖）或小地圖點擊跳轉（UI-08）。", "use": "即時戰略、城市建造、戰術遊戲等俯瞰大地圖的遊戲。", "prompt": "在遊戲中加入邊緣推移：畫面四邊各 16 px 為觸發帶；游標在帶內時，鏡頭以 600 px/秒 ×（深入帶內的比例）的速度向該方向移動，對角可同時觸發；視窗失焦或游標在 UI 上時停用；鏡頭不得超出地圖邊界，並提供開關選項。"}, "en": {"name": "Edge scrolling", "observe": "When the mouse cursor enters a thin band at the edge of the screen, the camera pans in that direction; the closer to the edge the faster it moves, and it stops when the cursor leaves the band. The camera follows no character.", "notThis": "Not a follow camera (CAM-01 / CAM-04, tracking a character); here the camera is driven only by the cursor. Not drag-panning (holding the mouse to drag the map) or minimap click-to-jump (UI-08).", "use": "Real-time strategy, city builders, tactics games — anything viewed from above over a large map.", "prompt": "In your game, add edge scrolling: a 16 px trigger band on each screen edge; while the cursor is in a band, pan at 600 px/s × (how deep into the band), diagonals allowed; disable when the window loses focus or the cursor is over UI; clamp to the map bounds and offer an on/off option."}, "ja": {"name": "エッジスクロール（画面端パン）", "observe": "マウスカーソルを画面端の細い帯に入れると、その方向へカメラがパンする。端に近いほど速く動き、帯から出ると止まる。カメラはどのキャラも追わない。", "notThis": "追従カメラ（CAM-01／CAM-04、キャラを追う）とは違い、カメラはカーソルだけで動く。ドラッグでのパンやミニマップのクリック移動（UI-08）とも違う。", "use": "RTS、街づくり、タクティクスなど、大きなマップを俯瞰するゲーム。", "prompt": "ゲームにエッジスクロールを追加して：画面の各辺 16 px をトリガー帯にし、カーソルが帯内にある間は 600 px/秒×（帯への入り込み率）でその方向へパン、斜めも可。ウィンドウ非アクティブ時や UI 上では無効。マップ境界でクランプし、オン/オフ設定を用意する。"}, "params": "band width px · max pan speed · speed curve (constant/progressive) · diagonal · disable over UI · map bounds", "impl": "Each frame read the cursor in normalised viewport space; for each axis compute depth = clamp((band − distToEdge)/band); velocity = maxSpeed × depth × direction; integrate with frame dt; clamp camera to map bounds. Confine the cursor to the window in fullscreen.", "related": ["CAM-09 Camera bounds", "UI-08", "ENV-15", "CAMX-07"], "refs": [{"t": "GDevelop docs — Edge scroll camera extension", "u": "https://wiki.gdevelop.io/gdevelop5/extensions/edge-scroll-camera/"}, {"t": "Rambod Dev — UE5 RTS camera edge scrolling (tutorial)", "u": "https://rambod.net/tutorial/ue5-rts-camera-edge-scrolling"}, {"t": "Wikipedia — Real-time strategy", "u": "https://en.wikipedia.org/wiki/Real-time_strategy"}], "nosrc": false}, {"id": "CAMX-05", "cat": "CAMX", "sub": "跟隨與構圖規則", "std": "Auto-scrolling", "aliases": ["Forced scrolling", "Autoscroller", "Auto-scroll level"], "type": "S", "zh": {"name": "強制捲軸（Auto-scrolling）", "observe": "鏡頭以固定速度朝一個方向自己前進，不理會玩家；玩家必須在畫面內移動，落後時會被畫面左邊推著走，若被夾在牆與邊緣之間就會受傷或死亡。", "notThis": "不是跟隨鏡頭（CAM-04 Camera damping，鏡頭追玩家）；這裡是玩家追鏡頭。也不是視差捲動（PIX-15，描述背景分層的移動速度）。", "use": "射擊遊戲、追逐關、坐車／坐船段落、需要時間壓力的關卡。", "prompt": "在遊戲中做一段強制捲軸關卡：鏡頭以 40 px/秒向右前進，在特定位置可加速到 80 px/秒或暫停；玩家位置限制在鏡頭範圍內，左邊緣會推動玩家；玩家被邊緣與地形夾住時判定死亡，並在左邊緣顯示紅色警示漸層。"}, "en": {"name": "Auto-scrolling", "observe": "The camera advances on its own in one direction at a set speed, regardless of the player; the player must keep moving within the screen, gets pushed along by the trailing edge if they fall behind, and is hurt or killed if crushed between a wall and the edge.", "notThis": "Not a follow camera (CAM-04 Camera damping, the camera chasing the player); here the player chases the camera. Not parallax scrolling (PIX-15, which describes how background layers move).", "use": "Shoot-’em-ups, chase levels, vehicle or boat sections, levels that need time pressure.", "prompt": "In your game, build an auto-scrolling section: the camera moves right at 40 px/s, speeding up to 80 px/s or pausing at scripted points; clamp the player to the camera view so the left edge pushes them; if the player is squeezed between the edge and terrain, kill them, and show a red warning gradient on the left edge."}, "ja": {"name": "強制スクロール", "observe": "カメラがプレイヤーに関係なく一定速度で一方向へ進む。プレイヤーは画面内を動き続ける必要があり、遅れると後ろ端に押され、壁と画面端に挟まれるとダメージや即死になる。", "notThis": "追従カメラ（CAM-04 Camera damping、カメラがプレイヤーを追う）とは逆で、プレイヤーがカメラを追う。視差スクロール（PIX-15、背景レイヤーの動き方）とも違う。", "use": "シューティング、追跡ステージ、乗り物・船の場面、時間的な圧をかけたいステージ。", "prompt": "ゲームに強制スクロール区間を作って：カメラは 40 px/秒で右へ進み、決まった地点で 80 px/秒に加速または停止。プレイヤーはカメラ範囲内に制限して左端で押し出し、画面端と地形に挟まれたらミス。左端には赤い警告グラデーションを表示する。"}, "params": "scroll speed · speed keyframes · push vs kill at trailing edge · crush rule · warning cue", "impl": "Drive camera position from a level-time curve (keyframed speed integrated over time), not from the player. After moving the player, clamp it into the camera rect; if the clamp pushes it into solid geometry, trigger the crush/death state.", "related": ["PIX-15", "CAM-09 Camera bounds", "CAMX-06", "TRN-16"], "refs": [{"t": "Wikipedia — Scrolling (auto-scrolling, flip-screen)", "u": "https://en.wikipedia.org/wiki/Scrolling"}, {"t": "Wikipedia — Scrolling shooter", "u": "https://en.wikipedia.org/wiki/Scrolling_shooter"}, {"t": "Itay Keren — Scroll Back: The Theory and Practice of Cameras in Side-Scrollers (Game Developer)", "u": "https://www.gamedeveloper.com/design/scroll-back-the-theory-and-practice-of-cameras-in-side-scrollers"}], "nosrc": false}, {"id": "CAMX-06", "cat": "CAMX", "sub": "跟隨與構圖規則", "std": "Flip-screen", "aliases": ["Screen-by-screen scrolling", "Room-by-room camera", "Flick-screen"], "type": "S", "zh": {"name": "一格一格房間式鏡頭（Flip-screen）", "observe": "世界被切成剛好一個畫面大的房間，鏡頭在房間內完全不動；角色走出畫面邊緣的一瞬間，畫面直接換成下一個房間，沒有任何捲動。", "notThis": "不是跨房間推移（TRN-16 Room transition scroll，會用約 0.5 秒滑過去）；Flip-screen 是瞬間切換。也不是一般切鏡（CAM-31 Camera cut，用在演出鏡頭之間）。", "use": "復古風格、解謎或探索型的單畫面房間設計、低成本的地圖構成。", "prompt": "在遊戲中用 Flip-screen 鏡頭：每個房間 320×180 px，鏡頭固定在房間格；角色中心越過房間邊界時，鏡頭在同一幀跳到相鄰房間，角色保留位置並向內推 4 px 以免來回觸發；切換時可加 1 幀白閃或無效果。"}, "en": {"name": "Flip-screen", "observe": "The world is cut into rooms exactly one screen in size and the camera never moves inside a room; the instant the character walks off an edge, the view is replaced by the next room with no scrolling at all.", "notThis": "Not a room transition scroll (TRN-16 Room transition scroll, which slides over in about 0.5 s); flip-screen is instantaneous. Not a general camera cut (CAM-31 Camera cut, used between cinematic shots).", "use": "Retro styles, puzzle or exploration games built from single-screen rooms, cheap map construction.", "prompt": "In your game, use a flip-screen camera: each room is 320×180 px and the camera snaps to the room grid; when the character’s centre crosses a room boundary, jump the camera to the neighbouring room on the same frame, keep the character’s position and nudge it 4 px inward to avoid ping-ponging; optionally a 1-frame white flash."}, "ja": {"name": "フリップスクリーン（画面切り替え式）", "observe": "世界がちょうど 1 画面分の部屋に区切られ、部屋の中ではカメラが一切動かない。キャラが画面端から出た瞬間、スクロールなしで次の部屋に画面が丸ごと切り替わる。", "notThis": "部屋間スクロール（TRN-16 Room transition scroll、約 0.5 秒で滑る）とは違い、瞬時に切り替わる。演出用のカット（CAM-31 Camera cut）とも違う。", "use": "レトロ風、1 画面単位の部屋で作る謎解き・探索ゲーム、低コストなマップ構成。", "prompt": "ゲームにフリップスクリーン方式のカメラを使って：部屋は 320×180 px、カメラは部屋グリッドに固定。キャラの中心が部屋の境界を越えたら同じフレームで隣の部屋へジャンプし、キャラの位置は保ったまま内側へ 4 px 押して往復の再判定を防ぐ。任意で 1 フレームの白フラッシュ。"}, "params": "room size · trigger point (centre vs edge) · inward nudge · optional flash · entity freeze/reset per room", "impl": "Camera position = floor(player / roomSize) × roomSize, updated only on boundary crossing. Pause or despawn entities outside the current room; respawn room contents on entry if the design calls for it.", "related": ["TRN-16", "CAMX-05", "CAM-31 Camera cut", "CAM-07 Region-based-anchors"], "refs": [{"t": "Wikipedia — Glossary of video game terms: Flip-screen", "u": "https://en.wikipedia.org/wiki/Flip-screen"}, {"t": "Wikipedia — Scrolling (auto-scrolling, flip-screen)", "u": "https://en.wikipedia.org/wiki/Scrolling"}], "nosrc": false}, {"id": "CAMX-07", "cat": "CAMX", "sub": "投影與鏡頭", "std": "Top-down view", "aliases": ["Bird's-eye view", "Overhead view", "Straight-down view"], "type": "S", "zh": {"name": "俯視鏡頭（正上方）", "observe": "鏡頭從正上方垂直往下看：屋子只看到屋頂、樹只看到樹冠、角色多半只看到頭頂與肩膀；地面沒有前後透視，所有物件都沒有「正面」。", "notThis": "不是斜俯視（CAMX-08 Three-quarter view，能同時看到頂面與正面）；正上方視角看不到牆面。也不是等角投影（CAMX-09，菱形格子）。", "use": "俯視射擊、賽車、策略、需要精準判斷位置與方向的遊戲。", "prompt": "在遊戲中使用正上方俯視鏡頭：正交投影、鏡頭垂直向下；角色畫成頭頂加肩膀的圓形輪廓並以朝向旋轉 sprite；建築只畫屋頂並向東南加 3 px 投影以分出高度；所有碰撞以地面 2D 形狀計算。"}, "en": {"name": "Top-down view", "observe": "The camera looks straight down: houses show only roofs, trees only their crowns, characters mostly the top of the head and shoulders; the ground has no front-to-back perspective and no object has a \"front\".", "notThis": "Not a three-quarter view (CAMX-08 Three-quarter view, which shows tops and fronts together); a straight-down view never shows walls. Not isometric (CAMX-09, diamond grid).", "use": "Top-down shooters, racing, strategy, games that need precise reading of position and direction.", "prompt": "In your game, use a straight-down top-down camera: orthographic, looking vertically down; draw characters as head-and-shoulder circles and rotate the sprite to face the movement direction; draw buildings as roofs only, with a 3 px drop shadow to the south-east to suggest height; compute all collision as 2D ground shapes."}, "ja": {"name": "トップダウン視点（真上からの俯瞰）", "observe": "カメラが真上から垂直に見下ろす。家は屋根だけ、木は樹冠だけ、キャラはほぼ頭頂と肩だけが見え、地面に奥行きの遠近はなく、どの物にも「正面」がない。", "notThis": "見下ろし斜め視点（CAMX-08 Three-quarter view、上面と正面が同時に見える）とは違い、壁面は見えない。アイソメトリック（CAMX-09、菱形グリッド）とも違う。", "use": "見下ろし型シューター、レース、ストラテジーなど、位置と向きを正確に読ませたいゲーム。", "prompt": "ゲームで真上からのトップダウンカメラを使って：正投影でカメラは垂直下向き。キャラは頭と肩の円形シルエットで描き、移動方向へスプライトを回転。建物は屋根だけを描き、南東へ 3 px の影を落として高さを示す。当たり判定はすべて地面の 2D 形状で計算する。"}, "params": "camera pitch 90° · ortho size · sprite rotation vs 8-direction frames · drop-shadow offset for height", "impl": "Orthographic camera looking down −Y (3D) or plain 2D with rotated sprites. Height cues come from drop shadows and slight scale, not from drawing walls. Sort by layer, not by Y.", "related": ["CAMX-08", "CAMX-09", "CAM-17 Orthographic projection", "PIX-18"], "refs": [{"t": "Wikipedia — Video game graphics (top-down perspective)", "u": "https://en.wikipedia.org/wiki/Top-down_perspective"}, {"t": "Wikipedia — Bird's-eye view", "u": "https://en.wikipedia.org/wiki/Bird's-eye_view"}, {"t": "Missroot — Camera views in 2D games (top-down, three-quarter, isometric…)", "u": "https://missroot.com/learn/camera-views/"}], "nosrc": false}, {"id": "CAMX-08", "cat": "CAMX", "sub": "投影與鏡頭", "std": "Three-quarter view", "aliases": ["3/4 view", "3/4 top-down", "Top-down RPG view", "Oblique top-down"], "type": "C", "zh": {"name": "斜俯視（3/4 視角）", "observe": "鏡頭從斜上方看：同時看到物件的頂面與正面，例如屋頂加前牆、桌面加桌腳、角色整個身體；地面上的格子仍是長方形，越往畫面上方代表越遠。", "notThis": "不是正上方俯視（CAMX-07，看不到正面）；也不是等角投影（CAMX-09，格子是菱形、同時看到兩個側面）。和斜投影（CAMX-10）接近，但 3/4 通常把深度壓扁，只露出一個正面。", "use": "傳統 2D RPG、農場模擬、動作冒險；物件需要一眼認得出時。", "prompt": "在遊戲中使用 3/4 斜俯視：地圖格 16×16 px，所有物件同時畫頂面與正面，正面高度約為實際高度的 0.7 倍；角色畫上、下、側 3 個方向（另一側翻轉）；物件以腳底 Y 座標排序，角色走到屋後時被前牆遮住。"}, "en": {"name": "Three-quarter view", "observe": "The camera looks down at an angle: you see the top and the front of things together — roof plus front wall, table top plus legs, the character’s whole body; ground tiles are still rectangles and higher on screen means farther away.", "notThis": "Not a straight-down top-down view (CAMX-07, no fronts visible); not isometric (CAMX-09, diamond tiles with two sides visible). Close to oblique projection (CAMX-10), but 3/4 usually squashes depth and shows a single front face.", "use": "Classic 2D RPGs, farming sims, action-adventure — whenever objects must be recognisable at a glance.", "prompt": "In your game, use a three-quarter top-down view: 16×16 px tiles; draw every object with both its top and front face, front height ≈ 0.7 × real height; draw characters in 3 directions (up, down, side, flip for the other side); sort objects by foot Y so the character is hidden by a front wall when walking behind a house."}, "ja": {"name": "見下ろし斜め視点（3/4 ビュー）", "observe": "カメラが斜め上から見下ろし、物の上面と正面が同時に見える（屋根と前の壁、天板と脚、キャラの全身など）。地面のタイルは長方形のままで、画面の上ほど奥にある。", "notThis": "真上からのトップダウン（CAMX-07、正面が見えない）とも、アイソメトリック（CAMX-09、菱形タイルで 2 つの側面が見える）とも違う。斜投影（CAMX-10）に近いが、3/4 はふつう奥行きを圧縮し正面 1 面だけを見せる。", "use": "古典的な 2D RPG、農場シム、アクションアドベンチャーなど、物を一目で判別させたいとき。", "prompt": "ゲームで 3/4 見下ろし視点を使って：タイル 16×16 px。すべての物を上面と正面の両方で描き、正面の高さは実際の約 0.7 倍。キャラは上・下・横の 3 方向（反対側は反転）。足元の Y 座標でソートし、家の裏に回ったキャラが前壁に隠れるようにする。"}, "params": "implied camera tilt · front-face height ratio · direction count for sprites · sort key (foot Y)", "impl": "Pure 2D: art is drawn in the projection; the engine only needs Y-sorting by the sprite pivot at the feet. In 3D, approximate with a pitched orthographic camera (≈ 45–60°) and scale world Z so tiles stay square on screen.", "related": ["CAMX-07", "CAMX-10", "PIX-16", "PIX-24"], "refs": [{"t": "Missroot — Camera views in 2D games (top-down, three-quarter, isometric…)", "u": "https://missroot.com/learn/camera-views/"}, {"t": "Goonstation dev docs — Sprite guidelines (three-quarter perspective)", "u": "https://docs.goonhub.com/guidelines/sprites.html"}, {"t": "Wikipedia — Video game graphics (top-down perspective)", "u": "https://en.wikipedia.org/wiki/Top-down_perspective"}], "nosrc": false}, {"id": "CAMX-09", "cat": "CAMX", "sub": "投影與鏡頭", "std": "Isometric / dimetric projection", "aliases": ["Isometric view", "2:1 dimetric", "Pixel isometric", "Axonometric view"], "type": "S", "zh": {"name": "等角／二等角投影（Isometric / Dimetric）", "observe": "地面格子變成菱形，物件同時露出頂面與左右兩個側面；平行線永遠平行、沒有消失點，遠處物件不會變小。像素遊戲常用的「等角」其實多是寬高 2:1 的二等角（約 26.57°）。", "notThis": "不是 3/4 斜俯視（CAMX-08，只看到一個正面、格子是長方形）；也不是透視投影（CAM-16 Perspective projection，有消失點）。", "use": "策略、城市建造、戰術 RPG、模擬經營等需要同時看清地形與建築的遊戲。", "prompt": "在遊戲中使用 2:1 二等角投影：菱形地磚 32×16 px；格子 (i, j) 的畫面座標 = ((i − j) × 16, (i + j) × 8)，高度每層向上 16 px；物件以 (i + j) 再加高度排序；滑鼠拾取時把畫面座標反算回格子；光源固定從左上，頂面最亮、左面中、右面最暗。"}, "en": {"name": "Isometric / dimetric projection", "observe": "Ground tiles become diamonds and objects show their top plus both left and right sides; parallel lines stay parallel with no vanishing point, so distant objects never shrink. The \"isometric\" of pixel games is usually 2:1 dimetric (about 26.57°).", "notThis": "Not a three-quarter view (CAMX-08, one front face, rectangular tiles); not perspective projection (CAM-16 Perspective projection, which has vanishing points).", "use": "Strategy, city builders, tactics RPGs, management sims — games that need terrain and buildings readable together.", "prompt": "In your game, use a 2:1 dimetric projection: 32×16 px diamond tiles; tile (i, j) maps to screen ((i − j) × 16, (i + j) × 8), each height level up 16 px; sort objects by (i + j) then height; for mouse picking invert the mapping back to the tile; light from the upper left: top face brightest, left face mid, right face darkest."}, "ja": {"name": "アイソメトリック／ダイメトリック投影", "observe": "地面のタイルが菱形になり、物の上面と左右 2 つの側面が同時に見える。平行線は平行のまま消失点がなく、遠くの物も小さくならない。ドット絵の「アイソメ」は多くの場合、幅と高さ 2:1 のダイメトリック（約 26.57°）。", "notThis": "3/4 見下ろし（CAMX-08、正面 1 面・長方形タイル）とも、透視投影（CAM-16 Perspective projection、消失点がある）とも違う。", "use": "ストラテジー、街づくり、タクティクス RPG、経営シムなど、地形と建物を同時に読ませたいゲーム。", "prompt": "ゲームで 2:1 ダイメトリック投影を使って：菱形タイル 32×16 px。タイル (i, j) の画面座標＝((i−j)×16, (i+j)×8)、高さは 1 段ごとに 16 px 上へ。描画順は (i+j)、次に高さ。マウスのピッキングは画面座標からタイルへ逆変換。光は左上固定で、上面が最も明るく、左面が中間、右面が最も暗い。"}, "params": "tile size & ratio (2:1 vs true 30°) · height step · sort key · picking inverse · shading per face", "impl": "2D: map grid→screen with a 2×2 matrix and invert it for picking; sort by depth = i + j (+ height). 3D: orthographic camera, yaw 45°, pitch ≈ 30° (2:1 look) or 35.264° (true isometric).", "related": ["CAMX-08", "CAMX-10", "PIX-16", "PIX-17", "PIX-19"], "refs": [{"t": "Wikipedia — Isometric video game graphics", "u": "https://en.wikipedia.org/wiki/Isometric_video_game_graphics"}, {"t": "Wikipedia — Isometric projection", "u": "https://en.wikipedia.org/wiki/Isometric_projection"}, {"t": "Wikipedia — Axonometric projection (isometric, dimetric, trimetric)", "u": "https://en.wikipedia.org/wiki/Axonometric_projection"}], "nosrc": false}, {"id": "CAMX-10", "cat": "CAMX", "sub": "投影與鏡頭", "std": "Oblique projection", "aliases": ["Cabinet projection", "Cavalier projection", "Oblique top-down", "2.5D buildings"], "type": "S", "zh": {"name": "斜投影（Oblique）", "observe": "物件的正面以真實形狀、不變形地畫出，深度方向則斜斜地往一個固定角度（常見 45°）延伸，並常縮短為一半；所有深度線互相平行，沒有消失點。", "notThis": "不是等角投影（CAMX-09，正面也會傾斜）；也不是 3/4 斜俯視（CAMX-08，深度往正上方而非斜向延伸）。斜投影的辨認重點是「正面是端正的長方形，側面斜著出去」。", "use": "側視或俯視 2D 遊戲中的建築與道具、2.5D 場景、需要正面細節（招牌、門窗）不變形的美術。", "prompt": "在遊戲中用斜投影畫建築：正面按實際尺寸畫成長方形，深度沿 45° 往右上延伸、長度為實際深度的 0.5（cabinet 投影）；所有深度邊保持平行；屋頂與側牆用比正面暗 15% 的色調；角色仍按腳底 Y 排序。"}, "en": {"name": "Oblique projection", "observe": "The front of an object is drawn true to shape with no distortion, while depth recedes at a fixed angle (often 45°) and is often shortened to half; all depth lines stay parallel with no vanishing point.", "notThis": "Not isometric (CAMX-09, where the front is slanted too); not a three-quarter view (CAMX-08, where depth goes straight up the screen rather than diagonally). The tell: the front is an upright rectangle and the side goes off at a slant.", "use": "Buildings and props in side-view or top-down 2D games, 2.5D scenes, art where front details (signs, doors, windows) must stay undistorted.", "prompt": "In your game, draw buildings in oblique projection: the front face is a true-size rectangle, depth recedes at 45° to the upper right at 0.5 × real depth (cabinet projection); keep all depth edges parallel; shade roof and side walls 15% darker than the front; still sort characters by foot Y."}, "ja": {"name": "斜投影（オブリーク）", "observe": "物の正面は歪みのない実際の形で描かれ、奥行き方向は一定の角度（よくあるのは 45°）で斜めに伸び、長さは半分に縮めることが多い。奥行きの線はすべて平行で消失点はない。", "notThis": "アイソメトリック（CAMX-09、正面も傾く）とも、3/4 見下ろし（CAMX-08、奥行きが斜めではなく画面の真上へ伸びる）とも違う。見分け方は「正面がまっすぐな長方形で、側面が斜めに出ている」こと。", "use": "横視点・見下ろし 2D の建物や小道具、2.5D の場面、看板や窓など正面の細部を歪ませたくない絵。", "prompt": "ゲームの建物を斜投影で描いて：正面は実寸の長方形、奥行きは 45° 右上方向へ実際の奥行きの 0.5 倍（キャビネット投影）で伸ばす。奥行きの辺はすべて平行に保ち、屋根と側壁は正面より 15% 暗くする。キャラは引き続き足元の Y でソート。"}, "params": "receding angle (30–60°) · depth ratio (1 cavalier, 0.5 cabinet) · face shading · sort key", "impl": "In 2D the projection is baked into the art. In 3D use an orthographic camera with a shear matrix: x′ = x + z·k·cos θ, y′ = y + z·k·sin θ (k = depth ratio) applied before the ortho projection.", "related": ["CAMX-08", "CAMX-09", "PIX-19", "CAM-17 Orthographic projection"], "refs": [{"t": "Wikipedia — Oblique projection", "u": "https://en.wikipedia.org/wiki/Oblique_projection"}, {"t": "Wikipedia — Cavalier perspective", "u": "https://en.wikipedia.org/wiki/Cavalier_perspective"}, {"t": "Wikipedia — 2.5D", "u": "https://en.wikipedia.org/wiki/2.5D"}], "nosrc": false}, {"id": "CAMX-11", "cat": "CAMX", "sub": "投影與鏡頭", "std": "Fixed camera angles", "aliases": ["Fixed camera system", "Static camera angles", "Pre-set camera shots", "Cinematic fixed cameras"], "type": "S", "zh": {"name": "固定機位鏡頭", "observe": "每個區域放著一台固定位置、固定角度的鏡頭，像監視器一樣；角色在畫面中走近、走遠、變大變小，鏡頭不跟著移動；走進下一個區域時直接切到另一台機位。", "notThis": "不是劇本鏡頭（CIN-03，演出中暫時接管）；固定機位是正常遊玩時的鏡頭。也不是沿路線運鏡（CAM-27 Rail camera，鏡頭會沿軌道移動）。", "use": "恐怖、懸疑、解謎冒險；需要電影式構圖、隱藏畫面外威脅、或使用預先渲染背景的遊戲。", "prompt": "在遊戲中使用固定機位：每個房間放 1–3 台鏡頭，以觸發體積決定目前用哪台；切換時直接硬切，同時保持玩家的移動方向 0.5 秒不變（避免切鏡後推桿方向突然反轉）；每台鏡頭可只用旋轉追看角色、位置不動。"}, "en": {"name": "Fixed camera angles", "observe": "Each area has a camera at a fixed position and angle, like a security camera; the character walks toward and away from it, growing and shrinking on screen, while the camera never moves; entering the next area cuts straight to another camera.", "notThis": "Not a scripted camera (CIN-03, a temporary takeover during a sequence); fixed cameras are the normal gameplay camera. Not a rail camera (CAM-27 Rail camera, which moves along a track).", "use": "Horror, mystery, puzzle adventures; games that want filmic composition, threats hidden off-screen, or pre-rendered backgrounds.", "prompt": "In your game, use fixed camera angles: 1–3 cameras per room, chosen by trigger volumes; switch with a hard cut and keep the player’s movement direction unchanged for 0.5 s after the cut (so the stick direction doesn’t suddenly flip); a camera may rotate to track the character while its position stays fixed."}, "ja": {"name": "固定カメラアングル", "observe": "エリアごとに位置と角度が固定されたカメラが置かれ、監視カメラのように映す。キャラが近づいたり遠ざかったりして画面内で大きさが変わるが、カメラは動かない。次のエリアに入ると別のカメラへ直接カットする。", "notThis": "スクリプトカメラ（CIN-03、演出中に一時的に操作を奪う）とは違い、通常プレイ時のカメラ。レールカメラ（CAM-27 Rail camera、軌道に沿って動く）とも違う。", "use": "ホラー、サスペンス、謎解きアドベンチャー。映画的な構図、画面外の脅威、プリレンダー背景を使いたいゲーム。", "prompt": "ゲームで固定カメラアングルを使って：部屋ごとに 1〜3 台のカメラを置き、トリガーボリュームでどれを使うか決める。切り替えはハードカットにし、カット後 0.5 秒はプレイヤーの移動方向を維持して、スティックの向きが急に逆転しないようにする。位置は固定のまま回転だけでキャラを追うカメラも可。"}, "params": "camera placement per zone · trigger volumes & hysteresis · cut vs short blend · input direction hold time · pan-only tracking", "impl": "Store camera transforms per zone; on zone change, cut. Convert stick input to world direction using the camera that was active when the stick was last neutral to keep movement continuous across cuts. Add overlap (hysteresis) between trigger volumes to avoid flicker.", "related": ["CIN-03", "CAM-27 Rail camera", "CAM-31 Camera cut", "TRN-13"], "refs": [{"t": "Wikipedia — Virtual camera system (fixed, tracking, interactive)", "u": "https://en.wikipedia.org/wiki/Virtual_camera_system"}, {"t": "Wikipedia — Tank controls", "u": "https://en.wikipedia.org/wiki/Tank_controls"}, {"t": "Wikipedia — Pre-rendering", "u": "https://en.wikipedia.org/wiki/Pre-rendering"}, {"t": "Cinemachine 3.1 — Clear Shot (choose among fixed cameras)", "u": "https://docs.unity3d.com/Packages/com.unity.cinemachine@3.1/manual/CinemachineClearShot.html"}], "nosrc": false}, {"id": "CAMX-12", "cat": "CAMX", "sub": "運鏡與剪接", "std": "Split screen / Dynamic split screen", "aliases": ["Voronoi split screen", "Splitscreen", "Dynamic split"], "type": "S", "zh": {"name": "分割畫面／動態分割", "observe": "本地多人時畫面被分成數塊，每名玩家各有一個鏡頭。動態（Voronoi）版本在玩家靠近時只用一個共用畫面；拉開距離後，畫面沿著與兩人連線垂直的斜線分開，分隔線的角度直接指出隊友在哪個方向。", "notThis": "不是 Zoom-to-fit（CAMX-02，一個鏡頭拉遠包住所有人）；分割畫面是多個鏡頭。也不是固定上下／左右分割；動態分割的分隔線會旋轉，靠近時合併。", "use": "本地合作或對戰、需要各自探索又要知道隊友位置的雙人遊戲。", "prompt": "在遊戲中加入雙人動態分割畫面：兩人畫面距離小於畫面高度 60% 時用一個鏡頭看兩人中點；超過時把畫面沿垂直於兩人連線的直線分成兩半，每個鏡頭讓自己的玩家落在所屬那一半的中心；分隔線寬度隨距離由 0 漸變到 3 px，合併與分開都不出現跳動。"}, "en": {"name": "Split screen / Dynamic split screen", "observe": "In local multiplayer the screen is divided and each player gets a camera. The dynamic (Voronoi) version uses one shared view while players are close; once they drift apart, the screen splits along a line perpendicular to the line between them, so the divider’s angle tells you where your partner is.", "notThis": "Not zoom-to-fit (CAMX-02, one camera zooming out to keep everyone); split screen uses several cameras. Not a fixed horizontal/vertical split; the dynamic divider rotates and merges when players are close.", "use": "Local co-op or versus, two-player games where each explores freely but must know where the other is.", "prompt": "In your game, add a two-player dynamic split screen: while the players are within 60% of the screen height of each other, use one camera at their midpoint; beyond that, split the screen along the line perpendicular to the players’ separation, with each camera placing its player at the centre of its half; fade the divider width from 0 to 3 px with distance so merging and splitting never pop."}, "ja": {"name": "画面分割／ダイナミック分割", "observe": "ローカルマルチでは画面を分け、プレイヤーごとにカメラを持つ。ダイナミック（ボロノイ）版では、近いうちは共有の 1 画面で、離れると 2 人を結ぶ線に垂直な斜めの線で画面が分かれ、境界線の角度が相方の方向を示す。", "notThis": "ズーム・トゥ・フィット（CAMX-02、1 台のカメラが引いて全員を収める）とは違い、複数のカメラを使う。固定の上下・左右分割とも違い、境界線が回転し、近づくと合体する。", "use": "ローカル協力・対戦、各自が自由に探索しつつ相方の位置を把握したい 2 人用ゲーム。", "prompt": "ゲームに 2 人用のダイナミック画面分割を追加して：2 人の距離が画面高さの 60% 未満なら中点を映す 1 台のカメラ。それを超えたら 2 人の離れる方向に垂直な線で画面を二分し、各カメラは自分のプレイヤーを担当する半分の中心に置く。境界線の太さは距離に応じて 0→3 px に変え、合体・分割で映像が跳ばないようにする。"}, "params": "split distance · merge feather range · divider width/colour · player placement within half · max players (2 vs N-way)", "impl": "Render each player camera to its own target (or use stencil per region); composite with a fullscreen pass choosing the source per pixel by sign(dot(pixel − centre, n)). Camera_i = player_i ± n × r, where r = splitDistance/2, so the merged and split views match at the threshold.", "related": ["CAMX-02", "CAM-13 Group framing", "UI-09"], "refs": [{"t": "Wikipedia — Split screen (video games)", "u": "https://en.wikipedia.org/wiki/Split_screen_(video_games)"}, {"t": "Matt Woelk — Voronoi split screen: a quick tour", "u": "https://mattwoelk.github.io/voronoi_split_screen_notes/"}, {"t": "Godot demo projects — Dynamic split screen (GitHub)", "u": "https://github.com/godotengine/godot-demo-projects/tree/master/viewport/dynamic_split_screen"}, {"t": "Juicing Your Cameras With Math (GDC, YouTube)", "u": "https://www.youtube.com/watch?v=tu-Qe66AvtY"}], "nosrc": false}, {"id": "CAMX-13", "cat": "CAMX", "sub": "運鏡與剪接", "std": "Camera banking", "aliases": ["Roll on turn", "Camera lean", "Bank into turns", "Camera roll"], "type": "C", "zh": {"name": "轉彎時鏡頭側傾（Camera banking）", "observe": "追尾鏡頭在載具轉彎時往彎道內側傾斜，地平線跟著斜幾度；轉彎越急傾斜越多，直路時慢慢回正。傾斜比轉向稍微慢半拍，帶出速度感與離心感。", "notThis": "不是斜水平鏡頭（CAM-26 Dutch angle，靜態的構圖手法）；Banking 是隨轉向即時變化的動態側傾。也不是鏡頭震動（FB-07，隨機抖動）。", "use": "賽車、飛行、滑板／滑雪、高速移動的第三人稱段落。", "prompt": "在遊戲中加入鏡頭側傾：側傾角 = 轉向率 × 0.12，最大 ±10°，以 0.3 秒平滑時間追上（比偏航慢）；甩尾時上限提高到 ±14°；直線時以 0.5 秒回正；提供「減少鏡頭晃動」選項把側傾關掉。"}, "en": {"name": "Camera banking", "observe": "A chase camera tilts toward the inside of a turn as the vehicle corners, tipping the horizon a few degrees; sharper turns tilt more, and it slowly levels out on straights. The roll lags slightly behind the steering, adding a sense of speed and centrifugal force.", "notThis": "Not a Dutch angle (CAM-26 Dutch angle, a static composition choice); banking is a dynamic roll that follows the steering in real time. Not screen shake (FB-07, random jitter).", "use": "Racing, flying, skating/skiing, fast third-person movement sections.", "prompt": "In your game, add camera banking: roll angle = turn rate × 0.12, clamped to ±10°, reached with a 0.3 s smoothing time (slower than yaw); raise the limit to ±14° while drifting; level out over 0.5 s on straights; add a \"reduce camera motion\" option that disables the roll."}, "ja": {"name": "カメラバンク（旋回時のロール）", "observe": "乗り物が曲がると追従カメラがカーブの内側へ傾き、地平線が数度傾く。急なカーブほど大きく傾き、直線ではゆっくり水平に戻る。ロールは操舵より少し遅れて付き、スピード感と遠心力を出す。", "notThis": "ダッチアングル（CAM-26 Dutch angle、静的な構図技法）とは違い、操舵にリアルタイムで追従する動的なロール。画面揺れ（FB-07、ランダムな振動）とも違う。", "use": "レース、フライト、スケート・スキー、高速移動する三人称の場面。", "prompt": "ゲームにカメラバンクを追加して：ロール角＝旋回率×0.12、上限 ±10°、0.3 秒のスムージングで追従（ヨーより遅く）。ドリフト中は上限を ±14° に。直線では 0.5 秒で水平に戻し、「カメラの揺れを減らす」設定でロールを無効にできるようにする。"}, "params": "roll gain · max roll · roll smoothing vs yaw smoothing · drift multiplier · comfort toggle", "impl": "Compute target roll from yaw rate (or lateral acceleration), damp it with its own spring, and apply it as a rotation around the camera’s forward axis after look-at. Keep the follow rig on the vehicle’s flattened heading so the vehicle’s own roll does not whip the horizon.", "related": ["CAM-26 Dutch angle", "FB-07", "CAM-04 Camera damping", "PIX-20"], "refs": [{"t": "Unity Discussions — arcade vehicle camera: \"banking when turning\"", "u": "https://discussions.unity.com/t/arcade-vehicle-physics-w-drifting-advice-needed/820285"}, {"t": "RCCP docs — Cameras (cornering lean / roll settings)", "u": "https://bonecrackergames.com/bonecrackergames.com/admin/AssetStoreDemos/RCCP/New12/Documentation/HTML/07_cameras.html"}, {"t": "Cinemachine 3.1 — Cinemachine Camera (lens incl. Dutch roll)", "u": "https://docs.unity3d.com/Packages/com.unity.cinemachine@3.1/manual/CinemachineCamera.html"}, {"t": "Wikipedia — Banked turn", "u": "https://en.wikipedia.org/wiki/Banked_turn"}], "nosrc": false}, {"id": "NPR-01", "cat": "NPR", "sub": "卡通明暗", "std": "Gooch shading", "aliases": ["Gooch lighting", "Cool-to-warm shading", "Technical illustration shading"], "type": "S", "zh": {"name": "Gooch 冷暖明暗", "observe": "物件的受光面偏暖（黃、橙），背光面不是變黑，而是轉為偏冷的藍紫色；整個形體由暖到冷平滑過渡，再配上黑色輪廓線和一小點純白高光，像技術插圖或產品說明圖。", "notThis": "不是卡通明暗（原手冊 REN-03，亮暗被切成幾個硬色階）；Gooch 是平滑漸變，重點是「暗部用冷色而不是黑色」。也不是補光／邊緣光（原手冊 REN-05，只在輪廓邊緣加亮）。", "use": "技術說明、建造或編輯模式的預覽、教學關卡、需要在任何光照下都讀得出形體的物件檢視器。", "prompt": "為遊戲中的物件加入 Gooch 冷暖明暗：k=(1+N·L)/2；冷色 = (0,0,0.55)+0.25×基礎色，暖色 = (0.6,0.6,0)+0.5×基礎色，最終顏色 = lerp(冷色, 暖色, k)；暗部亮度不得低於 0.15。另外加 1–2px 黑色輪廓線（深度＋法線邊緣），以及 Blinn-Phong 指數 48、閾值 0.55 的硬邊白色高光。光源方向可在檢視器中旋轉，主光仰角約 45°。"}, "en": {"name": "Gooch shading", "observe": "The lit side of an object leans warm (yellow, orange) and the side facing away does not go black but turns a cool blue-violet; the form blends smoothly from warm to cool, with black outlines and a small pure-white highlight, like a technical illustration or product diagram.", "notThis": "Not toon shading (original handbook REN-03, which cuts light and dark into a few hard bands); Gooch is a smooth ramp whose point is “shadows go cool, not black”. Not rim lighting (original handbook REN-05, which only brightens the silhouette edge).", "use": "Technical explanations, build/edit-mode previews, tutorial levels, object viewers where form must read under any lighting.", "prompt": "Add Gooch shading to the game’s objects: k=(1+N·L)/2; cool = (0,0,0.55)+0.25×base colour, warm = (0.6,0.6,0)+0.5×base colour, final = lerp(cool, warm, k); shadow brightness never below 0.15. Add 1–2 px black outlines (depth + normal edges) and a hard white highlight with Blinn-Phong exponent 48 thresholded at 0.55. Let the viewer rotate the light; key light about 45° above the horizon."}, "ja": {"name": "グーチシェーディング（寒暖シェーディング）", "observe": "光が当たる面は暖色（黄・橙）寄りになり、光から背いた面は黒くならずに寒色の青紫へ変わる。形が暖色から寒色へなめらかにつながり、黒い輪郭線と小さな純白のハイライトが添えられて、技術イラストや製品説明図のように見える。", "notThis": "トゥーンシェーディング（元ハンドブック REN-03、明暗を数段の硬い色帯に分ける）とは違い、グーチはなめらかなグラデーションで、要点は「影を黒ではなく寒色にする」こと。リムライト（元ハンドブック REN-05、輪郭の縁だけを明るくする）とも違う。", "use": "技術解説、建築・編集モードのプレビュー、チュートリアル、どんな照明でも形が読み取れる必要があるオブジェクトビューア。", "prompt": "ゲームのオブジェクトにグーチシェーディングを追加する：k=(1+N·L)/2、寒色 = (0,0,0.55)+0.25×ベース色、暖色 = (0.6,0.6,0)+0.5×ベース色、最終色 = lerp(寒色, 暖色, k)。影の明るさは 0.15 未満にしない。さらに 1〜2px の黒い輪郭線（深度＋法線エッジ）と、Blinn-Phong 指数 48・しきい値 0.55 の硬い白ハイライトを加える。ビューアでライトを回転でき、キーライトは仰角約 45°。"}, "params": "cool colour · warm colour · base-colour mix (α, β) · highlight exponent & threshold · outline width", "impl": "Per pixel: k = 0.5 + 0.5*dot(N, L); kCool = coolBlue + alpha*albedo; kWarm = warmYellow + beta*albedo; col = lerp(kCool, kWarm, k). Add a thresholded Blinn-Phong highlight (step(t, pow(dot(N,H), e))) in white and an edge-detection or inverted-hull outline. No ambient term is needed — the cool tone is the “ambient”.", "related": ["REN-03 Toon shading", "REN-05 Rim lighting", "NPR-03", "LGT-01"], "refs": [{"t": "Wikipedia — Gooch shading", "u": "https://en.wikipedia.org/wiki/Gooch_shading"}, {"t": "Gooch, Gooch, Shirley, Cohen — A Non-Photorealistic Lighting Model for Automatic Technical Illustration (SIGGRAPH 98)", "u": "https://users.cs.northwestern.edu/~ago820/SIG98/abstract.html"}, {"t": "Wikipedia — Non-photorealistic rendering", "u": "https://en.wikipedia.org/wiki/Non-photorealistic_rendering"}], "nosrc": false}, {"id": "NPR-02", "cat": "NPR", "sub": "卡通明暗", "std": "Stylized specular / Anime hair highlight", "aliases": ["Angel ring", "Hair halo highlight", "Toon specular", "Stylized highlight"], "type": "C", "zh": {"name": "風格化高光／動畫頭髮高光（天使環）", "observe": "頭髮上有一條明亮、邊緣鋸齒狀的弧形色帶，像光環一樣橫繞頭頂；高光的形狀是畫出來的固定圖形（帶狀、星形、方塊），邊緣清晰，不會像寫實高光那樣是一團隨光源滑動的柔和光斑。", "notThis": "不是一般的高光（原手冊 REN-10，柔和光斑，位置完全由光源與視角計算）；也不是各向異性反射（原手冊 REN-11，物理上沿髮絲拉長的高光）。天使環是「形狀被美術控制、大致跟著視角」的風格化圖案。", "use": "動漫風角色的頭髮、眼睛反光、塑膠或金屬道具的卡通高光、角色立繪與 3D 模型風格統一。", "prompt": "為動漫風角色的頭髮加入天使環高光：頭髮先用兩階卡通明暗（N·L 閾值 0.15）；在頭部法線緯度約 0.72 rad 處畫一條寬 0.085 的亮帶，顏色為頭髮基礎色 ×1.6 並偏亮紫；沿頭部周圍分成 48 條髮束，每條以雜湊值把亮帶上下偏移 ±0.05，形成鋸齒；光源只把亮帶左右推移 ±0.05，主要跟隨鏡頭。亮帶中央再加 35% 寬的純白芯。可用 UV 對齊的高光遮罩貼圖代替程序計算。"}, "en": {"name": "Stylized specular / Anime hair highlight (angel ring)", "observe": "A bright, jagged-edged arc of colour wraps around the top of the head like a halo; the highlight is a drawn, fixed shape (band, star, block) with crisp edges, not a soft blob that slides with the light as in realistic shading.", "notThis": "Not an ordinary specular highlight (original handbook REN-10, a soft blob placed purely by light and view) nor anisotropic reflection (original handbook REN-11, a physically stretched highlight along fibres). The angel ring is an artist-shaped pattern that mostly follows the view.", "use": "Anime-style character hair, eye glints, cartoon highlights on plastic or metal props, keeping 3D models consistent with 2D character art.", "prompt": "Add an angel-ring highlight to anime-style hair: two-tone toon base (N·L threshold 0.15); draw a band at head-normal latitude ≈0.72 rad, width 0.085, coloured hair base ×1.6 shifted toward pale violet; split the head into 48 strands around its circumference and offset the band by a hashed ±0.05 per strand for a jagged edge; the light only pushes the band ±0.05 sideways, it mainly follows the camera. Add a pure-white core 35% of the band width. A UV-aligned highlight mask texture can replace the procedural band."}, "ja": {"name": "様式化スペキュラー／アニメ髪ハイライト（天使の輪）", "observe": "髪の上に明るくギザギザした縁の弧が、光の輪のように頭頂をぐるりと横切る。ハイライトは描かれた決まった形（帯・星・ブロック）で縁がくっきりしており、写実的な表現のように光源につれて滑る柔らかな光の塊ではない。", "notThis": "通常のスペキュラーハイライト（元ハンドブック REN-10、光源と視点だけで位置が決まる柔らかい光の塊）や異方性反射（元ハンドブック REN-11、繊維方向に物理的に伸びたハイライト）とは違う。天使の輪は「形をアーティストが制御し、おおむね視点についてくる」様式化された模様。", "use": "アニメ調キャラクターの髪、瞳のキャッチライト、プラスチックや金属の小物のトゥーンハイライト、2D 立ち絵と 3D モデルの表現をそろえる。", "prompt": "アニメ調キャラクターの髪に天使の輪ハイライトを追加する：ベースは 2 段のトゥーン陰影（N·L しきい値 0.15）。頭部法線の緯度約 0.72 rad の位置に幅 0.085 の明るい帯を描き、色は髪のベース色 ×1.6 で淡い紫寄りにする。頭の周囲を 48 本の毛束に分け、毛束ごとにハッシュ値で帯を ±0.05 上下にずらしてギザギザにする。光源は帯を左右に ±0.05 動かすだけで、基本はカメラに追従。帯の中央に幅 35% の純白の芯を加える。手続き計算の代わりに UV に沿ったハイライトマスクテクスチャでもよい。"}, "params": "band latitude · band width · strand count & jitter · view vs light follow · core width · colour", "impl": "Compute the band in a space the artist controls: latitude from the head-local normal (or a UV v-coordinate on a hair card), shifted slightly by dot(L, headRight); jitter edges with hash(strandIndex). Mask = abs(lat - centre + jitter) < width; add a white core where the mask is narrower. Composite after the toon ramp, before outlines. A matcap or a painted mask texture scrolled by view angle are common alternatives.", "related": ["REN-10 Specular highlight", "REN-11 Anisotropy", "REN-03 Toon shading", "NPR-01"], "refs": [{"t": "URP 渲染實戰 — 頭髮天使環 Angel ring (Kajiya-Kay → toon band)", "u": "https://gametech.byte888.com/urp/zh-hant/case/14-7.html"}, {"t": "MooaToon docs — Add stylized hair highlights", "u": "https://mooatoon.com/en/docs/Tutorial/AddStylizedHairHighlights"}, {"t": "Wikipedia — Specular highlight", "u": "https://en.wikipedia.org/wiki/Specular_highlight"}, {"t": "Wikipedia — Blinn–Phong reflection model", "u": "https://en.wikipedia.org/wiki/Blinn%E2%80%93Phong_reflection_model"}], "nosrc": false}, {"id": "NPR-03", "cat": "NPR", "sub": "描邊", "std": "Edge-detection outline", "aliases": ["Sobel outline", "Screen-space outline", "Depth/normal edge detection", "Post-process outline"], "type": "S", "zh": {"name": "邊緣偵測描邊（深度／法線 Sobel）", "observe": "畫面上所有物件的外輪廓和內部折角（例如方塊的稜、甜甜圈內圈）同時出現粗細一致的線條；線條是在畫面上「找出來」的，所以連物件互相重疊的地方、地面交界都有線。", "notThis": "不是反轉外殼描邊（原手冊 REN-04 的 inverted hull，每個模型自己長出一圈背面外殼，通常只有外輪廓、看不到內部折角）。邊緣偵測是全畫面後處理，依深度跳變找出剪影、依法線變化找出折角。", "use": "卡通／漫畫風的整體畫面、建築或機械的清晰結構線、技術預覽，或給大量物件統一描邊而不需逐個模型處理。", "prompt": "在遊戲中加入全畫面邊緣偵測描邊：讀取深度和法線緩衝，對兩者各做 3×3 Sobel；深度梯度除以該像素深度（相對門檻 0.35，對遠處穩定），法線梯度門檻 1.2，以 smoothstep(0.6×門檻, 門檻) 柔化；兩者取最大值後把線條以 #1d1b26 乘在畫面上，線寬 1px（1080p 時 2px）。天空像素不參與深度比較，線條在霧中隨距離淡出。"}, "en": {"name": "Edge-detection outline (depth/normal Sobel)", "observe": "Every object’s silhouette and its internal creases (a box’s corners, the inner ring of a torus) all get even-width lines at once; the lines are “found” in screen space, so overlaps between objects and contact with the ground get lines too.", "notThis": "Not inverted-hull outlines (original handbook REN-04, where each mesh grows its own back-facing shell, usually only the outer silhouette, no inner creases). Edge detection is a fullscreen post-process: depth jumps find silhouettes, normal changes find creases.", "use": "Cartoon/comic looks across the whole frame, crisp structural lines on architecture or machines, technical previews, or uniform outlines on many objects without per-mesh setup.", "prompt": "Add a fullscreen edge-detection outline to the game: read the depth and normal buffers and run a 3×3 Sobel on each; divide the depth gradient by that pixel’s depth (relative threshold 0.35, stable with distance), normal-gradient threshold 1.2, soften both with smoothstep(0.6×threshold, threshold); take the max and multiply lines onto the image in #1d1b26, width 1 px (2 px at 1080p). Sky pixels are excluded from the depth test, and lines fade with distance inside fog."}, "ja": {"name": "エッジ検出アウトライン（深度・法線 Sobel）", "observe": "画面内のすべてのオブジェクトの外形線と内部の折れ目（箱の角、ドーナツの内側の輪など）に、太さのそろった線が一度に現れる。線は画面上で「検出」されるので、物同士が重なる所や地面との境目にも線が出る。", "notThis": "背面法アウトライン（元ハンドブック REN-04 の inverted hull、各モデルが裏向きの殻を持ち、たいてい外形線だけで内部の折れ目は出ない）とは違う。エッジ検出は全画面ポストプロセスで、深度の段差からシルエットを、法線の変化から折れ目を見つける。", "use": "画面全体のトゥーン・コミック調、建築や機械のはっきりした構造線、技術プレビュー、モデルごとの設定なしで大量のオブジェクトに統一した線を付けたいとき。", "prompt": "ゲームに全画面エッジ検出アウトラインを追加する：深度バッファと法線バッファを読み、それぞれ 3×3 Sobel をかける。深度勾配はそのピクセルの深度で割り（相対しきい値 0.35、距離に対して安定）、法線勾配のしきい値は 1.2、どちらも smoothstep(0.6×しきい値, しきい値) で柔らかくする。最大値を取り #1d1b26 で画面に乗算、線幅 1px（1080p では 2px）。空のピクセルは深度比較から除外し、フォグ内では距離に応じて線を薄くする。"}, "params": "depth threshold (relative) · normal threshold · line width / kernel radius · line colour · distance fade · which buffers (depth, normal, object id)", "impl": "Fullscreen pass after opaque geometry: gD = sobel(depth)/depth, gN = sqrt(sum over xyz of sobel(normal.c)²); edge = max(smoothstep(a,b,gD), smoothstep(c,d,gN)); col *= 1 - edge*lineAlpha. Wider lines: sample at ±k pixels or dilate. An object-ID buffer adds lines between touching objects of similar depth. Needs a normal prepass (or reconstruct from depth).", "related": ["REN-04 Outline", "NPR-01", "NPR-05", "PIX-13"], "refs": [{"t": "Wikipedia — Sobel operator", "u": "https://en.wikipedia.org/wiki/Sobel_operator"}, {"t": "Wikipedia — Edge detection", "u": "https://en.wikipedia.org/wiki/Edge_detection"}, {"t": "Roystan — Outline shader (depth + normal edge detection)", "u": "https://roystan.net/articles/outline-shader/"}, {"t": "Alexander Ameye — 5 ways to draw an outline", "u": "https://ameye.dev/notes/rendering-outlines/"}], "nosrc": false}, {"id": "NPR-04", "cat": "NPR", "sub": "描邊", "std": "Line boil", "aliases": ["Boiling lines", "Wiggle lines", "Jittered outline"], "type": "C", "zh": {"name": "線條抖動（Line boil）", "observe": "靜止的角色或物件，輪廓線卻在不停地輕微顫動，好像每幾格就被重新描過一次；顫動是一跳一跳的（每秒約 8–12 次），只換幾張圖輪流播放，填色本身通常不動。", "notThis": "不是鏡頭震動（整個畫面平移）；也不是像素畫的次像素動畫（PIX-14，刻意設計的微小動作）。線條抖動是「同一張畫重描幾次」造成的手繪不穩定感，不是角色在動。也不是邊緣偵測描邊（NPR-03，線條穩定）。", "use": "手繪動畫、塗鴉或兒童畫風、夢境與不安的場景、讓 3D 或向量畫面帶有手作質感。", "prompt": "為遊戲中的手繪風輪廓加入線條抖動：準備 3 個變體（不同雜湊種子），每秒切換 8 次（seed = floor(time×8) mod 3）；每個輪廓頂點偏移 ±1.25px（以 240p 畫面計；1080p 約 ±5px），線寬也在 1.3–2.0px 之間隨變體變化；填色與角色位置保持不動。暫停畫面時仍繼續抖動；提供「減少動態」選項把頻率降為 0。"}, "en": {"name": "Line boil", "observe": "A character or object that is standing still still has outlines that quiver constantly, as if retraced every few frames; the shake is stepped (about 8–12 changes per second), cycling a few drawings, and the fills usually stay put.", "notThis": "Not camera shake (the whole image moves) nor pixel-art sub-pixel animation (PIX-14, a deliberately designed tiny motion). Line boil is the hand-drawn instability of retracing the same drawing, not the character moving. Not edge-detection outlines either (NPR-03, which are stable).", "use": "Hand-drawn animation, doodle or children’s-drawing styles, dreamlike or uneasy scenes, giving 3D or vector graphics a handmade feel.", "prompt": "Add line boil to the game’s hand-drawn outlines: make 3 variants (different hash seeds) and switch 8 times per second (seed = floor(time×8) mod 3); offset each outline vertex by ±1.25 px (at 240p; about ±5 px at 1080p), and vary line width between 1.3 and 2.0 px per variant; keep fills and character positions still. Keep boiling while paused; a “reduce motion” option sets the rate to 0."}, "ja": {"name": "ラインボイル（線のゆらぎ）", "observe": "止まっているキャラクターや物なのに、輪郭線だけがたえず小刻みに震え、数コマごとに描き直されているように見える。震えはカクカクと段階的（毎秒 8〜12 回ほど）で、数枚の絵を順番に繰り返しており、塗りは普通動かない。", "notThis": "カメラシェイク（画面全体が動く）や、ドット絵のサブピクセルアニメーション（PIX-14、意図して作った小さな動き）とは違う。ラインボイルは「同じ絵を何度か描き直した」ことによる手描きの不安定さで、キャラクターが動いているのではない。エッジ検出アウトライン（NPR-03、線が安定している）とも違う。", "use": "手描きアニメ、落書き風・子どもの絵風、夢や不安な場面、3D やベクター画面に手作り感を出す。", "prompt": "ゲームの手描き風輪郭にラインボイルを追加する：3 種類のバリエーション（異なるハッシュシード）を用意し、毎秒 8 回切り替える（seed = floor(time×8) mod 3）。輪郭の各頂点を ±1.25px（240p 基準、1080p では約 ±5px）ずらし、線幅もバリエーションごとに 1.3〜2.0px で変える。塗りとキャラクター位置は動かさない。ポーズ中もゆらぎは続ける。「動きを減らす」設定で頻度を 0 にできるようにする。"}, "params": "variant count · switch rate (fps) · vertex offset amplitude · line-width jitter · whether fills boil", "impl": "Stepped time: seed = floor(time*rate) % variants. Offset stroke vertices (or UVs into a noise texture, or the screen-space position in an outline post-process) by hash(seed, vertexId) * amplitude. For shader outlines, offset the sampling position by noise(uv*scale + seed). Keep the rate low (6–12) — continuous noise reads as wobble, not boil.", "related": ["NPR-03", "NPR-09", "PIX-14"], "refs": [{"t": "PremiumBeat — How to create line boil animations", "u": "https://www.premiumbeat.com/blog/how-to-create-line-boil-animations/"}, {"t": "PremiumBeat — Wiggly text and animations using the line boil effect", "u": "https://www.premiumbeat.com/blog/wiggle-text-line-boil/"}], "nosrc": false}, {"id": "NPR-05", "cat": "NPR", "sub": "筆觸與印刷", "std": "Hatching / Cross-hatching", "aliases": ["Cross-hatching", "Pen-and-ink shading", "Tonal art map (TAM)", "Stroke shading"], "type": "S", "zh": {"name": "排線／交叉排線", "observe": "明暗不是用灰色表現，而是用平行的墨線：亮處是白紙，稍暗處出現一組斜線，再暗加上反方向的第二組線，最暗處線條密集交叉，像鋼筆插畫或版畫。", "notThis": "不是半色調（NPR-08，用大小不同的圓點）；也不是抖色（PIX-08，像素級的點陣）。排線的辨識重點是「有方向的線條，越暗疊越多層」。也不是鉛筆素描（NPR-09，線條較鬆散、有石墨顆粒、輪廓會重複描）。", "use": "筆記本、地圖、古籍或偵探風格的畫面，版畫或漫畫質感，回憶與故事書段落。", "prompt": "在遊戲中加入排線明暗：tone = (0.08+0.92×max(0,N·L))×AO，地面 ×1.15；分 4 層，tone<0.78 畫 45° 線（間距 7px、線寬 1.25px），tone<0.52 加 −45° 線，tone<0.3 加水平線（間距 5px），tone<0.14 加 45° 密線（間距 3.5px）；每條線以 sin 讓位置擺動約 1px。紙色 #f3ecd8、墨色 #2a2238，配合邊緣偵測黑色輪廓。線條在螢幕空間固定或用 TAM 貼圖貼在物件上（後者旋轉時不滑動）。"}, "en": {"name": "Hatching / Cross-hatching", "observe": "Shading is not grey but parallel ink lines: lit areas are bare paper, slightly darker areas get one set of diagonal lines, darker still adds a second set in the opposite direction, and the darkest areas are dense crossing lines, like a pen illustration or engraving.", "notThis": "Not halftone (NPR-08, dots of varying size) nor dithering (PIX-08, pixel-level patterns). Hatching reads as directional lines stacking in more layers as it gets darker. Not a pencil sketch (NPR-09, looser strokes, graphite grain, repeated contours).", "use": "Notebooks, maps, old-book or detective styles, engraving or comic textures, flashbacks and storybook sequences.", "prompt": "Add hatching to the game: tone = (0.08+0.92×max(0,N·L))×AO, ground ×1.15; 4 layers — tone<0.78 draws 45° lines (spacing 7 px, width 1.25 px), tone<0.52 adds −45° lines, tone<0.3 adds horizontal lines (spacing 5 px), tone<0.14 adds dense 45° lines (spacing 3.5 px); wobble each line about 1 px with a sine. Paper #f3ecd8, ink #2a2238, plus black edge-detection outlines. Lines either stay fixed in screen space or are applied as tonal-art-map textures on the objects (which do not slide when objects rotate)."}, "ja": {"name": "ハッチング／クロスハッチング", "observe": "陰影を灰色ではなく平行なインクの線で表す。明るい所は白い紙のまま、少し暗い所に斜線が 1 組入り、さらに暗いと逆向きの斜線が重なり、最も暗い所は細かく交差した線になる。ペン画や版画のように見える。", "notThis": "網点（NPR-08、大きさの違う丸い点）やディザ（PIX-08、ピクセル単位の点パターン）とは違い、見分けるポイントは「方向を持つ線が、暗いほど層を重ねる」こと。鉛筆スケッチ（NPR-09、線がゆるく黒鉛の粒があり、輪郭を何度もなぞる）とも違う。", "use": "ノート、地図、古書や探偵ものの画面、版画やマンガの質感、回想や絵本風の場面。", "prompt": "ゲームにハッチング陰影を追加する：tone = (0.08+0.92×max(0,N·L))×AO、地面は ×1.15。4 層に分け、tone<0.78 で 45° の線（間隔 7px、線幅 1.25px）、tone<0.52 で −45° の線、tone<0.3 で水平線（間隔 5px）、tone<0.14 で 45° の密な線（間隔 3.5px）を加える。各線は sin で約 1px 揺らす。紙色 #f3ecd8、インク色 #2a2238、エッジ検出の黒い輪郭線を組み合わせる。線はスクリーン空間に固定するか、TAM テクスチャとしてオブジェクトに貼る（後者は回転しても線が滑らない）。"}, "params": "layer thresholds · stroke spacing & width · stroke angles · wobble · screen-space vs object-space (TAM) · paper & ink colours", "impl": "Screen-space: for each layer i, if tone < t_i and frac(dot(pixel, dir_i)/spacing_i) < width_i/spacing_i → ink. Object-space (Praun et al.): a tonal art map — a mip-mapped set of 6 stroke textures of increasing density — blended by tone per pixel in UV space, so strokes stick to the surface. Combine with an outline pass; avoid aliasing by keeping spacing ≥ 3 px.", "related": ["NPR-08", "NPR-09", "PIX-08", "NPR-03"], "refs": [{"t": "Wikipedia — Hatching", "u": "https://en.wikipedia.org/wiki/Hatching"}, {"t": "Praun, Hoppe, Webb, Finkelstein — Real-Time Hatching (SIGGRAPH 2001, PDF)", "u": "https://hhoppe.com/hatching.pdf"}, {"t": "Kyle Halladay — A pencil sketch effect (tonal art maps)", "u": "https://kylehalladay.com/blog/tutorial/2017/02/21/Pencil-Sketch-Effect.html"}], "nosrc": false}, {"id": "NPR-06", "cat": "NPR", "sub": "筆觸與印刷", "std": "Kuwahara / Painterly filter", "aliases": ["Kuwahara filter", "Oil-paint filter", "Anisotropic Kuwahara", "Painterly post-process"], "type": "S", "zh": {"name": "Kuwahara 濾鏡／油畫風", "observe": "畫面中細碎的雜訊和紋理被抹成一塊塊扁平的色塊，像用油畫刷塗出來；但物件邊緣仍然清楚，不會整體變模糊。色塊邊界略呈方形或筆觸狀。", "notThis": "不是高斯模糊（PP-08，邊緣也會糊掉）；也不是色調分離（PP-04，只把顏色切成色階，紋理細節還在）。Kuwahara 的特點是「抹平區域內的細節，同時保留邊緣」。", "use": "油畫或水粉繪本風格、夢境與回憶場景、讓寫實素材統一成手繪感、拍照模式濾鏡。", "prompt": "在遊戲中加入 Kuwahara 後處理：每個像素把周圍 (r+1)×(r+1) 的四個象限（r=5px，1080p 時約 r=8）分別計算平均色與亮度變異數，輸出變異數最小那個象限的平均色；用 summed-area table 或分離式計算使成本與 r 無關。想要筆觸方向感可改用各向異性 Kuwahara（依結構張量把核心拉成橢圓，8 個扇區）。在色調映射之後、UI 之前套用，強度可在 0–1 之間與原圖混合。"}, "en": {"name": "Kuwahara / Painterly filter", "observe": "Fine noise and texture in the image are smeared into flat patches of colour, as if laid on with an oil brush, yet object edges stay sharp instead of the whole image blurring. Patch borders look slightly blocky or stroke-like.", "notThis": "Not Gaussian blur (PP-08, which also blurs edges) nor posterization (PP-04, which only bands colours and keeps texture detail). Kuwahara flattens detail inside regions while preserving edges.", "use": "Oil-paint or gouache storybook looks, dream and memory scenes, unifying realistic assets into a painted feel, photo-mode filters.", "prompt": "Add a Kuwahara post-process to the game: for each pixel, compute the mean colour and luminance variance of the four (r+1)×(r+1) quadrants around it (r = 5 px, about r = 8 at 1080p) and output the mean of the quadrant with the lowest variance; use summed-area tables or a separable scheme so cost does not grow with r. For a brush-direction feel, use the anisotropic Kuwahara (kernel stretched into an ellipse along the structure tensor, 8 sectors). Apply after tonemapping and before UI, blendable 0–1 with the source."}, "ja": {"name": "桑原フィルター／油絵風フィルター", "observe": "画面の細かなノイズや質感が、油絵の筆で塗ったような平らな色の塊にならされる。それでいてオブジェクトの縁ははっきり残り、画面全体がぼやけるわけではない。色の塊の境目はやや四角いか、筆跡のような形になる。", "notThis": "ガウスぼかし（PP-08、縁までぼける）やポスタリゼーション（PP-04、色を段階に分けるだけで質感の細部は残る）とは違い、桑原フィルターの特徴は「領域内の細部をならしつつ縁を保つ」こと。", "use": "油絵・ガッシュの絵本風、夢や回想の場面、写実的な素材を手描き風に統一する、フォトモードのフィルター。", "prompt": "ゲームに桑原フィルターのポストプロセスを追加する：各ピクセルの周囲 4 象限（それぞれ (r+1)×(r+1)、r=5px、1080p では約 r=8）で平均色と輝度の分散を求め、分散が最も小さい象限の平均色を出力する。summed-area table や分離計算でコストが r に依存しないようにする。筆の方向感が欲しければ異方性桑原フィルター（構造テンソルに沿って楕円に伸ばしたカーネル、8 セクター）を使う。トーンマッピングの後・UI の前にかけ、元画像と 0〜1 でブレンドできるようにする。"}, "params": "radius · number of sectors (4 square / 8 anisotropic) · anisotropy strength · sharpness of sector weighting · blend with source", "impl": "Per pixel, for each sector k: mean_k and var_k over the sector (box sums via a summed-area table or two-pass separable sums). out = mean of argmin var_k, or a smooth weighting w_k = 1/(1+var_k^q). Generalised/anisotropic versions use Gaussian-weighted polynomial sectors oriented by the local structure tensor. Run at half resolution and upscale for speed.", "related": ["PP-08", "PP-04", "NPR-07", "REN-34 Depth of Field"], "refs": [{"t": "Wikipedia — Kuwahara filter", "u": "https://en.wikipedia.org/wiki/Kuwahara_filter"}, {"t": "Wikipedia — Non-photorealistic rendering", "u": "https://en.wikipedia.org/wiki/Non-photorealistic_rendering"}], "nosrc": false}, {"id": "NPR-07", "cat": "NPR", "sub": "筆觸與印刷", "std": "Watercolor rendering", "aliases": ["Watercolour shader", "Painterly wash", "Wet-edge darkening", "Pigment granulation"], "type": "C", "zh": {"name": "水彩風渲染", "observe": "畫面像畫在粗紙上的水彩：顏色半透明、能看見紙紋；色塊邊緣因顏料積聚而顏色較深；平塗區域有細小的顏料顆粒斑；輪廓有點晃動、會滲到外面；最亮處直接留白紙；畫框邊緣是不規則的毛邊。", "notThis": "不是 Kuwahara 濾鏡（NPR-06，色塊是不透明、平整的）；也不是單純降低飽和度或加紙紋貼圖。水彩的辨識重點是「透明疊色、邊緣變深、顆粒、留白」。", "use": "繪本與童話、溫和的冒險或旅行遊戲、回憶與日記段落、過場插畫。", "prompt": "在遊戲中加入水彩後處理：(1) 以低頻雜訊（尺度 1/28px、幅度 ±3.5px）扭曲取樣座標，讓輪廓晃動；(2) 依明暗把顏料濃度分 3 層釉染（0.42/0.64/0.86），高光處濃度 ×0.15 留白；(3) 顏料顆粒：濃度 ×(0.82+0.36×雜訊)，雜訊尺度約 2px；(4) 邊緣變深：扭曲後區域在 3px 內改變時濃度 +0.25；(5) 以減色混合 color = paper × (1 − 濃度 × (1 − 顏料色))；(6) 紙紋明暗 ±3%，畫面四邊 10–16px 不規則毛邊。過場時可用雜訊遮罩讓顏色在 0.6 秒內「暈開」出現。"}, "en": {"name": "Watercolor rendering", "observe": "The image looks like watercolour on rough paper: colours are translucent with paper texture showing through, patch edges darken where pigment pools, flat areas carry fine granulation speckle, outlines wobble and bleed past the shapes, the brightest spots are left as bare paper, and the frame edge is an irregular deckle.", "notThis": "Not a Kuwahara filter (NPR-06, whose patches are opaque and flat), nor simply desaturating or adding a paper texture. Watercolour reads as transparent glazes, darkened edges, granulation and paper-white highlights.", "use": "Picture books and fairy tales, gentle adventure or travel games, memory and diary segments, cutscene illustrations.", "prompt": "Add a watercolour post-process to the game: (1) warp the sampling coordinates with low-frequency noise (scale 1/28 px, amplitude ±3.5 px) so outlines wobble; (2) split pigment density into 3 glazes by shading (0.42/0.64/0.86) and multiply density by 0.15 at highlights to leave paper white; (3) granulation: density ×(0.82+0.36×noise) with noise around 2 px; (4) edge darkening: +0.25 density where the warped region changes within 3 px; (5) subtractive mix color = paper × (1 − density × (1 − pigment)); (6) paper brightness ±3%, an irregular 10–16 px deckle on all four sides. For transitions, reveal colour with a noise mask that “blooms” in over 0.6 s."}, "ja": {"name": "水彩風レンダリング", "observe": "画面が粗い紙に描いた水彩画のように見える。色は半透明で紙の目が透け、色面の縁は顔料がたまって濃くなり、平塗り部分に細かな顔料の粒（グラニュレーション）がある。輪郭は少し揺れて外ににじみ、最も明るい所は紙の白を残し、画面の縁は不規則なデッケルエッジになる。", "notThis": "桑原フィルター（NPR-06、色面が不透明で平ら）とも、単に彩度を下げたり紙テクスチャを重ねたりするのとも違う。見分けるポイントは「透明な重ね塗り、濃くなる縁、粒状感、紙の白」。", "use": "絵本や童話、穏やかな冒険・旅ゲーム、回想や日記のパート、イベント挿絵。", "prompt": "ゲームに水彩風ポストプロセスを追加する：(1) 低周波ノイズ（スケール 1/28px、振幅 ±3.5px）でサンプリング座標をゆがめ、輪郭を揺らす。(2) 陰影に応じて顔料濃度を 3 段の重ね塗り（0.42/0.64/0.86）に分け、ハイライトでは濃度を ×0.15 にして紙の白を残す。(3) グラニュレーション：濃度 ×(0.82+0.36×ノイズ)、ノイズは約 2px。(4) 縁の濃さ：ゆがめた領域が 3px 以内で変わる所は濃度 +0.25。(5) 減法混色 color = paper × (1 − 濃度 × (1 − 顔料色))。(6) 紙の明るさ ±3%、四辺に 10〜16px の不規則なデッケル。場面転換ではノイズマスクで色が 0.6 秒かけて「にじみ出る」ように表示する。"}, "params": "wobble scale & amplitude · glaze levels · granulation strength & scale · edge-darkening width & amount · paper texture · deckle width", "impl": "Post-process on colour + depth/ID: uvW = uv + (noise(uv*f)-0.5)*amp; region = ID(uvW); density from luminance bands; density *= mix(1-g, 1+g, noise(uv*fg)); edge = any(ID(uvW+offset_i) != region); density += edge*k; col = paper * (1 - density*(1-pigment)). Curtis et al. simulate shallow-water flow and Kubelka–Munk glazing for higher fidelity; real-time games approximate with the steps above.", "related": ["NPR-06", "NPR-09", "PP-06", "PP-02"], "refs": [{"t": "Curtis et al. — Computer-Generated Watercolor (SIGGRAPH 97)", "u": "https://grail.cs.washington.edu/projects/watercolor/"}, {"t": "Wikipedia — Kubelka–Munk theory", "u": "https://en.wikipedia.org/wiki/Kubelka%E2%80%93Munk_theory"}, {"t": "Wikipedia — Non-photorealistic rendering", "u": "https://en.wikipedia.org/wiki/Non-photorealistic_rendering"}], "nosrc": false}, {"id": "NPR-08", "cat": "NPR", "sub": "筆觸與印刷", "std": "Halftone / Ben-Day dots", "aliases": ["Halftone shader", "Comic dots", "Screen tone", "Ben-Day dots"], "type": "S", "zh": {"name": "半色調／網點（Ben-Day 網點）", "observe": "明暗用規則排列、大小不同的圓點表現：亮處點小、暗處點大到幾乎連成一片，網格通常斜 45°；淺色平塗區域則用均勻的小彩色點（Ben-Day 網點），像美式漫畫或舊報紙印刷。", "notThis": "不是抖色（PIX-08，像素級的 0/1 點陣，點大小不變）；也不是排線（NPR-05，用線而不是點）。半色調的辨識重點是「固定網格、點的大小隨明暗變化」。", "use": "美式漫畫或普普藝術風格、報紙／雜誌質感、過場漫畫格、超級英雄或復古廣告主題。", "prompt": "在遊戲中加入半色調後處理：網格旋轉 45°、格距 7px（1080p 約 14px），每格取中心點亮度 tone，點半徑 = 0.56 × 格距 × sqrt(1 − tone)（墨點覆蓋面積約等於 1 − tone），點色 #1a1424；物件內部另疊 Ben-Day 彩色網點（格距 4px、點半徑 0.33 格），點色為物件基礎色、底色為基礎色與白色 50/50 混合；加 1px 黑色邊緣偵測輪廓。CMYK 版本則把 C/M/Y/K 四個網格分別旋轉 15°/75°/0°/45°。"}, "en": {"name": "Halftone / Ben-Day dots", "observe": "Shading uses regularly spaced dots of varying size: small dots in light areas, large ones that almost merge in dark areas, usually on a 45° grid; pale flat areas use evenly sized small coloured dots (Ben-Day dots), like American comics or old newspaper print.", "notThis": "Not dithering (PIX-08, pixel-level on/off patterns with fixed dot size) nor hatching (NPR-05, lines instead of dots). Halftone reads as a fixed grid whose dot size changes with tone.", "use": "American comic or pop-art styles, newspaper/magazine textures, comic-panel cutscenes, superhero or retro-advertising themes.", "prompt": "Add a halftone post-process to the game: grid rotated 45°, cell size 7 px (about 14 px at 1080p); per cell take the centre luminance tone, dot radius = 0.56 × cell × sqrt(1 − tone) (ink coverage ≈ 1 − tone), dot colour #1a1424; inside objects overlay Ben-Day colour dots (cell 4 px, radius 0.33 cell) in the object’s base colour on a 50/50 mix of base colour and white; add 1 px black edge-detection outlines. For a CMYK version rotate the C/M/Y/K grids 15°/75°/0°/45°."}, "ja": {"name": "ハーフトーン／網点（ベンデイドット）", "observe": "陰影を規則的に並んだ大きさの違う丸い点で表す。明るい所は点が小さく、暗い所は点が大きくほとんどつながり、格子はたいてい 45° 傾いている。淡い平塗り部分は均一な小さな色の点（ベンデイドット）で埋められ、アメコミや古い新聞印刷のように見える。", "notThis": "ディザ（PIX-08、ピクセル単位のオン・オフの点で、点の大きさは一定）やハッチング（NPR-05、点ではなく線）とは違い、見分けるポイントは「固定された格子で、点の大きさが明暗に応じて変わる」こと。日本のマンガのスクリーントーンも同じ原理。", "use": "アメコミやポップアート風、新聞・雑誌の質感、コマ割りのカットシーン、ヒーローものやレトロ広告のテーマ。", "prompt": "ゲームにハーフトーンのポストプロセスを追加する：格子を 45° 回転、セル 7px（1080p では約 14px）。セルごとに中心の輝度 tone を取り、点の半径 = 0.56 × セル × sqrt(1 − tone)（インクの被覆率がほぼ 1 − tone になる）、点の色 #1a1424。オブジェクト内部にはベンデイドット（セル 4px、半径 0.33 セル）を重ね、点はベース色、地はベース色と白の 50/50。1px の黒いエッジ検出輪郭を加える。CMYK 版なら C/M/Y/K の格子をそれぞれ 15°/75°/0°/45° 回転させる。"}, "params": "cell size · grid angle · dot shape (round, square, line) · radius curve · colour mode (mono, duotone, CMYK) · Ben-Day tint", "impl": "Rotate pixel coords: p = R(angle)*pixel; cell = floor(p/s); c = (cell+0.5)*s; tone = luminance(sample(R^-1 c)); ink = length(p - c) < s*k*sqrt(1 - tone). Antialias with smoothstep over 1 px using fwidth. Per-channel CMYK: convert to CMYK, run one grid per channel at its own angle, multiply the inks.", "related": ["NPR-05", "PIX-08", "PP-04", "NPR-10"], "refs": [{"t": "Wikipedia — Halftone", "u": "https://en.wikipedia.org/wiki/Halftone"}, {"t": "Wikipedia — Ben-Day dots", "u": "https://en.wikipedia.org/wiki/Ben-Day_dots"}], "nosrc": false}, {"id": "NPR-09", "cat": "NPR", "sub": "筆觸與印刷", "std": "Sketch / Pencil shader", "aliases": ["Pencil rendering", "Pencil sketch effect", "Graphite shading", "Sketchy outlines"], "type": "C", "zh": {"name": "素描／鉛筆風渲染", "observe": "畫面像在紙上用鉛筆畫的草圖：輪廓由好幾條略微錯開、偶爾斷開的線疊成；陰影是鬆散的斜向排線，帶有石墨的顆粒感，紙的紋理清晰可見；顏色只有灰黑色，有時線條會輕微抖動。", "notThis": "不是排線（NPR-05，鋼筆墨線，線條乾淨、規則）；也不是邊緣偵測描邊（NPR-03，單一條穩定的線）。鉛筆風的辨識重點是「重複描繪的鬆散輪廓、石墨顆粒、紙紋」。", "use": "設計草稿、筆記本或日記主題、教學或回憶畫面、關卡尚未完成的「藍圖」狀態、拍照模式濾鏡。", "prompt": "在遊戲中加入鉛筆素描後處理：(1) 紙張：底色 #f0ece2，加縱向拉長的雜訊紋理（x 尺度 1px、y 尺度 3px，±2%）；(2) 輪廓：以邊緣偵測結果取樣 3 次，每次用不同低頻雜訊偏移 ±2.5px，並以雜訊遮掉約 30% 的線段造成斷筆；(3) 陰影：tone<0.75 畫 45° 鬆散排線（間距 5px），tone<0.42 加反方向排線，tone<0.2 整體加深 25%，線條強度乘以 (0.5+0.5×紙紋) 呈現石墨顆粒；(4) 石墨色 #3a3a42；(5) 每秒切換 4 次 2 組偏移種子做輕微抖動。"}, "en": {"name": "Sketch / Pencil shader", "observe": "The image looks like a pencil sketch on paper: outlines are built from several slightly offset, sometimes broken strokes; shading is loose diagonal hatching with graphite grain; the paper tooth is clearly visible; colour is grey-black only, sometimes with lines that boil slightly.", "notThis": "Not hatching (NPR-05, clean, regular pen-ink lines) nor edge-detection outlines (NPR-03, a single stable line). Pencil reads as repeated loose contours, graphite grain and paper texture.", "use": "Design drafts, notebook or diary themes, tutorials or memories, an unfinished “blueprint” state of a level, photo-mode filters.", "prompt": "Add a pencil-sketch post-process to the game: (1) paper: base #f0ece2 plus vertically stretched noise (x scale 1 px, y scale 3 px, ±2%); (2) outlines: sample the edge-detection result 3 times, each offset ±2.5 px by a different low-frequency noise, masking out about 30% of the stroke with noise for broken lines; (3) shading: tone<0.75 adds loose 45° hatching (spacing 5 px), tone<0.42 adds the opposite direction, tone<0.2 darkens 25% overall; multiply stroke strength by (0.5+0.5×paper tooth) for graphite grain; (4) graphite colour #3a3a42; (5) switch between 2 offset seeds 4 times per second for a slight boil."}, "ja": {"name": "スケッチ／鉛筆シェーダー", "observe": "画面が紙に鉛筆で描いた下絵のように見える。輪郭は少しずつずれ、ときどき途切れる何本もの線が重なってできており、陰影はゆるい斜めのハッチングで黒鉛の粒子感がある。紙の目がはっきり見え、色は灰色と黒だけ。線が少し震えることもある。", "notThis": "ハッチング（NPR-05、きれいで規則的なペンの線）やエッジ検出アウトライン（NPR-03、安定した 1 本の線）とは違い、見分けるポイントは「何度もなぞったゆるい輪郭、黒鉛の粒、紙の目」。", "use": "デザインラフ、ノートや日記のテーマ、チュートリアルや回想、ステージ未完成の「設計図」状態、フォトモードのフィルター。", "prompt": "ゲームに鉛筆スケッチのポストプロセスを追加する：(1) 紙：地色 #f0ece2 に縦長のノイズ（x スケール 1px、y スケール 3px、±2%）を加える。(2) 輪郭：エッジ検出結果を 3 回サンプリングし、それぞれ別の低周波ノイズで ±2.5px ずらし、ノイズで線の約 30% を消して途切れを作る。(3) 陰影：tone<0.75 で 45° のゆるいハッチング（間隔 5px）、tone<0.42 で逆方向を追加、tone<0.2 で全体を 25% 暗くする。線の濃さに (0.5+0.5×紙の目) を掛けて黒鉛の粒を出す。(4) 黒鉛色 #3a3a42。(5) 2 組のずらしシードを毎秒 4 回切り替えてわずかに震わせる。"}, "params": "contour passes & offset · stroke breakup · hatch thresholds & spacing · graphite grain · paper texture · boil rate", "impl": "Edge buffer from depth/normals; sketch = sum over passes i of edge(uv + noise_i(uv)*amp) * mask_i(uv); shading via screen-space or TAM strokes thresholded by tone; multiply by paper-grain texture; col = lerp(paper, graphite, clamp(sketch + hatch)). Swap noise seeds at 4–8 fps for boil (see NPR-04).", "related": ["NPR-05", "NPR-03", "NPR-04", "NPR-07"], "refs": [{"t": "Kyle Halladay — A pencil sketch effect (tonal art maps)", "u": "https://kylehalladay.com/blog/tutorial/2017/02/21/Pencil-Sketch-Effect.html"}, {"t": "Lee, Kwon, Lee — Real-Time Pencil Rendering (NPAR 2006, PDF)", "u": "https://cg.postech.ac.kr/papers/47_Real-Time-Pencil-Rendering.pdf"}, {"t": "Wikipedia — Non-photorealistic rendering", "u": "https://en.wikipedia.org/wiki/Non-photorealistic_rendering"}], "nosrc": false}, {"id": "NPR-10", "cat": "NPR", "sub": "復古與低保真", "std": "1-bit dithering (Obra Dinn style)", "aliases": ["1-bit rendering", "Monochrome dithering", "Obra Dinn style", "Two-colour ordered dither"], "type": "C", "zh": {"name": "1-bit 抖色風（Obra Dinn 風格）", "observe": "整個 3D 畫面只有兩種顏色（例如深墨色與米白色），所有明暗都靠規則的點陣圖案表現：越暗的地方暗點越多；加上清楚的輪廓線，看起來像早期 Macintosh 的單色畫面或銅版畫。", "notThis": "不是一般的抖色（PIX-08，泛指用點陣模擬更多顏色，可以有很多色）；這裡是「整個 3D 場景只輸出兩色」的整體風格。也不是半色調（NPR-08，點大小可變、網格傾斜）。", "use": "偵探解謎、恐怖、舊電腦懷舊風格；強調形狀與構圖、刻意剝奪顏色資訊的遊戲。", "prompt": "在遊戲中加入 1-bit 渲染：先以 640×360 渲染灰階（tone = 光照 × AO），再用 8×8 Bayer 矩陣做門檻：tone > (bayer+0.5)/64 輸出亮色 #e6e1c5，否則暗色 #1d1b26；深度與法線邊緣強制為暗色。最後以整數倍最近鄰放大。為避免鏡頭轉動時點陣「游泳」，把抖色圖案貼在以鏡頭方向為中心的球面座標上，而不是固定在螢幕。"}, "en": {"name": "1-bit dithering (Obra Dinn style)", "observe": "The whole 3D image uses just two colours (e.g. dark ink and off-white); every shade is made with a regular dot pattern, more dark dots where it is darker; with crisp outlines it looks like an early Macintosh monochrome screen or an engraving.", "notThis": "Not dithering in general (PIX-08, any use of dot patterns to fake more colours, possibly with many colours); here the whole 3D scene outputs exactly two colours as an overall style. Not halftone (NPR-08, variable dot size on a tilted grid).", "use": "Detective puzzles, horror, vintage-computer nostalgia; games that emphasise shape and composition and deliberately withhold colour.", "prompt": "Add 1-bit rendering to the game: render greyscale at 640×360 (tone = lighting × AO), then threshold with an 8×8 Bayer matrix: tone > (bayer+0.5)/64 outputs the light colour #e6e1c5, otherwise the dark colour #1d1b26; force depth and normal edges to dark. Upscale by an integer factor with nearest filtering. To stop the pattern “swimming” when the camera turns, map the dither pattern onto a sphere around the camera direction instead of fixing it to the screen."}, "ja": {"name": "1 ビットディザ（Obra Dinn 風）", "observe": "3D 画面全体が 2 色（たとえば濃いインク色とオフホワイト）だけで描かれ、陰影はすべて規則的な点のパターンで表される。暗い所ほど暗い点が多い。くっきりした輪郭線と合わせて、初期 Macintosh のモノクロ画面や銅版画のように見える。", "notThis": "一般的なディザ（PIX-08、点のパターンで色数を補う手法全般で、色は多くてもよい）とは違い、こちらは「3D シーン全体を 2 色だけで出力する」全体のスタイル。網点（NPR-08、点の大きさが変わり格子が傾いている）とも違う。", "use": "推理・謎解き、ホラー、レトロ PC 風のノスタルジー。形と構図を重視し、あえて色の情報を取り除くゲーム。", "prompt": "ゲームに 1 ビットレンダリングを追加する：まず 640×360 でグレースケール（tone = 照明 × AO）を描画し、8×8 の Bayer 行列でしきい値処理する。tone > (bayer+0.5)/64 なら明色 #e6e1c5、それ以外は暗色 #1d1b26。深度・法線エッジは強制的に暗色にする。最後に整数倍の最近傍補間で拡大する。カメラを回したときにパターンが「泳ぐ」のを防ぐため、ディザパターンを画面に固定せず、カメラ方向を中心とした球面座標に貼る。"}, "params": "internal resolution · two palette colours · dither matrix (Bayer 4/8, blue noise) · tone curve · edge forcing · pattern anchoring (screen vs world/sphere)", "impl": "Render tone to a low-res target; out = tone > bayer8[(p.y&7)*8+(p.x&7)] ? light : dark. Blue-noise thresholds look more organic. Anchor the threshold texture in a camera-centred spherical mapping (as described by Lucas Pope) to reduce swimming under rotation. Edges: run edge detection on the low-res buffer before thresholding.", "related": ["PIX-08", "NPR-08", "PIX-10", "NPR-03", "MATX-06 Dithered transparency"], "refs": [{"t": "Lucas Pope — Obra Dinn devlog, Nov 2017 (dither stabilisation)", "u": "https://dukope.com/devlogs/obra-dinn/tig-32/"}, {"t": "Wikipedia — Return of the Obra Dinn", "u": "https://en.wikipedia.org/wiki/Return_of_the_Obra_Dinn"}, {"t": "Surma — Ditherpunk: the article I wish I had about monochrome image dithering", "u": "https://surma.dev/things/ditherpunk/"}, {"t": "Wikipedia — Ordered dithering", "u": "https://en.wikipedia.org/wiki/Ordered_dithering"}], "nosrc": false}, {"id": "NPR-11", "cat": "NPR", "sub": "復古與低保真", "std": "PS1-style rendering", "aliases": ["PS1 style", "PSX look", "Vertex snapping / jitter", "Affine texture mapping", "Retro 3D"], "type": "C", "zh": {"name": "PS1 風格（頂點抖動與仿射貼圖）", "observe": "3D 物件移動或鏡頭轉動時，多邊形的頂點一格一格地跳動，邊緣不穩定；靠近鏡頭的大面地板上貼圖會彎曲、「游泳」；貼圖解析度很低、像素清楚；有時物件前後順序錯亂、互相穿插閃爍。", "notThis": "不是低多邊形平面明暗（NPR-12，只是面數少、每面單色，畫面本身穩定）；也不是 3D 像素風（NPR-13，有刻意對齊的像素格與輪廓）。PS1 風的辨識重點是「頂點跳動、貼圖扭曲」這些舊硬體的瑕疵。", "use": "復古恐怖、懷舊 3D 動作、低預算的 90 年代主機氣氛、迷幻或不安的段落。", "prompt": "在遊戲中加入 PS1 風格渲染：(1) 頂點著色器把投影後的螢幕座標對齊到 320×240 的整數格（或 2px 網格）；(2) 貼圖座標不做透視修正（affine：在螢幕空間線性內插 UV，對大三角形先細分成 ≤ 32px 的小三角形以控制扭曲）；(3) 貼圖 64×64 以下、最近鄰取樣、不用 mipmap；(4) 可選：關閉深度緩衝改用多邊形中心排序；(5) 15-bit 顏色加 4×4 抖色；(6) 霧在 8–20 單位內線性淡出。"}, "en": {"name": "PS1-style rendering (vertex snapping & affine textures)", "observe": "When 3D objects move or the camera turns, polygon vertices jump in steps and edges shimmer; textures on large floor polygons near the camera bend and “swim”; textures are low-res with visible texels; sometimes objects sort wrongly and flicker through each other.", "notThis": "Not low-poly flat shading (NPR-12, just few faces with one colour each; the image itself is stable) nor 3D pixel art (NPR-13, with a deliberately aligned pixel grid and outlines). PS1 style is identified by old-hardware artefacts: jumping vertices and warping textures.", "use": "Retro horror, nostalgic 3D action, a low-budget 90s-console mood, trippy or uneasy sequences.", "prompt": "Add PS1-style rendering to the game: (1) in the vertex shader snap projected screen positions to a 320×240 integer grid (or a 2 px grid); (2) interpolate texture coordinates without perspective correction (affine: linear UVs in screen space; subdivide large triangles to ≤ 32 px to limit warping); (3) textures 64×64 or smaller, nearest sampling, no mipmaps; (4) optional: disable the depth buffer and sort polygons by centre depth; (5) 15-bit colour with 4×4 dithering; (6) fog fading linearly from 8 to 20 units."}, "ja": {"name": "PS1 風レンダリング（頂点スナップとアフィンテクスチャ）", "observe": "3D オブジェクトが動いたりカメラが回ったりすると、ポリゴンの頂点がカクカクと飛び、縁が落ち着かない。カメラに近い大きな床ポリゴンではテクスチャがゆがんで「泳ぐ」。テクスチャは低解像度でテクセルがはっきり見え、ときどきオブジェクトの前後関係が乱れてちらつく。", "notThis": "ローポリのフラットシェーディング（NPR-12、面数が少なく各面が単色なだけで、画面自体は安定）や 3D ピクセルアート（NPR-13、意図的にそろえたピクセル格子と輪郭）とは違う。PS1 風の見分けるポイントは「頂点の跳び、テクスチャのゆがみ」という古いハードの癖。", "use": "レトロホラー、懐かしの 3D アクション、低予算の 90 年代ゲーム機の雰囲気、サイケデリックで不安な場面。", "prompt": "ゲームに PS1 風レンダリングを追加する：(1) 頂点シェーダーで投影後のスクリーン座標を 320×240 の整数格子（または 2px 格子）にスナップする。(2) テクスチャ座標を透視補正せずに補間する（アフィン：スクリーン空間で UV を線形補間。大きな三角形は 32px 以下に分割してゆがみを抑える）。(3) テクスチャは 64×64 以下、最近傍サンプリング、ミップマップなし。(4) 任意：深度バッファを切り、ポリゴン中心でソートする。(5) 15 ビットカラーと 4×4 ディザ。(6) フォグは 8〜20 ユニットで線形に濃くする。"}, "params": "snap grid resolution · affine strength / subdivision size · texture size & filtering · depth sort vs z-buffer · colour depth & dither · fog range", "impl": "Vertex shader: clip = MVP*pos; ndc = clip.xy/clip.w; ndc = round(ndc*grid/2)/(grid/2); clip.xy = ndc*clip.w. Affine UVs: pass uv*clip.w and clip.w as varyings with noperspective (or equivalent) interpolation and divide in the fragment shader — or simply mark uv noperspective. Point-sample textures, disable mipmaps.", "related": ["NPR-12", "NPR-13", "PIX-02", "PP-03", "REN-37 Aliasing"], "refs": [{"t": "David Colson — Building a PS1 style retro 3D renderer", "u": "https://www.david-colson.com/2021/11/30/ps1-style-renderer.html"}, {"t": "Wikipedia — Texture mapping (affine vs perspective-correct)", "u": "https://en.wikipedia.org/wiki/Texture_mapping"}, {"t": "Wikipedia — PlayStation technical specifications", "u": "https://en.wikipedia.org/wiki/PlayStation_technical_specifications"}], "nosrc": false}, {"id": "NPR-12", "cat": "NPR", "sub": "復古與低保真", "std": "Low-poly flat shading", "aliases": ["Flat shading", "Faceted shading", "Low poly style", "Facet shading"], "type": "S", "zh": {"name": "低多邊形平面明暗", "observe": "3D 物件由少量明顯的三角形面組成，每一面都是單一顏色，面與面之間有清楚的明暗分界，像摺紙或寶石切面；光源移動時整個面一起變亮或變暗。", "notThis": "不是平滑明暗（Gouraud／Phong，同樣的低面數模型看起來圓滑，看不出面）；也不是 PS1 風（NPR-11，重點是頂點抖動與貼圖扭曲）。低多邊形風的辨識重點是「每面一色、刻意露出面」。", "use": "清爽的獨立遊戲風格、自然風景與岩石、手機遊戲（效能與美術一致）、抽象或極簡畫面。", "prompt": "在遊戲中為低多邊形模型使用平面明暗：每個三角形用面法線（不共用頂點法線，或在著色器中以 normalize(cross(ddx(pos), ddy(pos))) 求得）；模型約 80–500 個三角形，頂點隨機擾動 ±16% 增加不規則感；主光為暖色（強度 1.0，仰角 45°），補光為冷色（強度 0.25，從反方向）；不貼紋理，只用頂點色或每面顏色；可加 2–4 階色階讓顏色更統一。"}, "en": {"name": "Low-poly flat shading", "observe": "3D objects are made of a few obvious triangular faces, each a single colour, with clear light/dark breaks between faces like folded paper or a cut gem; when the light moves, a whole face brightens or darkens at once.", "notThis": "Not smooth shading (Gouraud/Phong, where the same low-poly mesh looks rounded and faces vanish) nor PS1 style (NPR-11, about vertex jitter and texture warping). Low poly reads as one colour per face, faces deliberately shown.", "use": "Clean indie styles, natural scenery and rocks, mobile games (performance and art direction aligned), abstract or minimalist looks.", "prompt": "Use flat shading for the game’s low-poly models: each triangle uses its face normal (do not share vertex normals, or compute normalize(cross(ddx(pos), ddy(pos))) in the shader); models around 80–500 triangles with vertices randomly displaced ±16% for irregularity; warm key light (intensity 1.0, 45° elevation) plus a cool fill (intensity 0.25 from the opposite side); no textures, only vertex or per-face colours; optional 2–4 step quantization for a unified palette."}, "ja": {"name": "ローポリ・フラットシェーディング", "observe": "3D オブジェクトが少数のはっきりした三角形の面でできていて、各面が 1 色。面と面の間に明暗の境目がはっきりあり、折り紙や宝石のカット面のように見える。光源が動くと面ごとまとめて明るく・暗くなる。", "notThis": "スムーズシェーディング（グーローやフォン、同じローポリモデルでも丸く見えて面がわからない）や PS1 風（NPR-11、頂点の跳びとテクスチャのゆがみが要点）とは違い、見分けるポイントは「1 面 1 色、面をわざと見せる」こと。", "use": "すっきりしたインディー風、自然の風景や岩、モバイルゲーム（性能と美術方針が一致）、抽象的・ミニマルな画面。", "prompt": "ゲームのローポリモデルにフラットシェーディングを使う：三角形ごとに面法線を使う（頂点法線を共有しない、またはシェーダーで normalize(cross(ddx(pos), ddy(pos))) を求める）。モデルは約 80〜500 三角形、頂点を ±16% ランダムにずらして不規則さを出す。キーライトは暖色（強度 1.0、仰角 45°）、フィルライトは寒色（強度 0.25、反対側から）。テクスチャは使わず頂点色か面ごとの色だけ。必要なら 2〜4 段の階調化で色をまとめる。"}, "params": "triangle count · vertex jitter · key/fill colours & angles · per-face colour variation · optional quantization", "impl": "Duplicate vertices per face so each triangle carries its face normal, or derive it per pixel from screen-space derivatives of world position (no mesh change). Shade with N_face·L; optionally add per-face hue jitter hash(faceId). Avoid normal maps and smoothing groups.", "related": ["NPR-11", "REN-03 Toon shading", "NPR-13", "LGT-01"], "refs": [{"t": "Wikipedia — Shading (flat vs smooth shading)", "u": "https://en.wikipedia.org/wiki/Shading"}, {"t": "Wikipedia — Low poly", "u": "https://en.wikipedia.org/wiki/Low_poly"}, {"t": "Wikipedia — Gouraud shading", "u": "https://en.wikipedia.org/wiki/Gouraud_shading"}], "nosrc": false}, {"id": "NPR-13", "cat": "NPR", "sub": "復古與低保真", "std": "3D pixel art (pixelated 3D)", "aliases": ["Pixelated 3D", "3D-to-pixel pipeline", "Low-res 3D render", "Pixel-perfect 3D"], "type": "C", "zh": {"name": "3D 像素風（像素化 3D）", "observe": "畫面看起來像手繪像素畫，但物件能流暢旋轉、有正確的透視和光影：所有東西都由清楚的大像素組成，明暗只有 2–3 階，物件邊緣有 1 像素的深色輪廓，顏色來自有限的調色盤；鏡頭移動時像素格不會閃爍抖動。", "notThis": "不是像素化濾鏡（PP-05，只是把高解析度畫面切成方格，沒有輪廓與色階處理，移動時閃爍）；也不是 PS1 風（NPR-11，有頂點抖動和貼圖扭曲）。3D 像素風的重點是「低解析度渲染＋像素美術的規則（輪廓、色階、調色盤、穩定像素格）」。", "use": "想要像素美術外觀但需要 3D 自由度（旋轉、光影、大量動畫）的遊戲、等角視角模擬或策略遊戲、用 3D 模型自動產生像素精靈圖。", "prompt": "在遊戲中把 3D 場景渲染成像素風：(1) 以 1/4 輸出解析度（例如 480×270）的正交鏡頭渲染，最後以整數倍最近鄰放大；(2) 明暗量化為 3 階（N·L > 0.6 / > 0.25 / 其他，倍率 1.0/0.78/0.56），顏色再量化到 8 階／通道或對應調色盤；(3) 物件 ID 或深度不同處畫 1 像素輪廓（顏色 ×0.35，畫在較近的物件上）；(4) 鏡頭位置對齊到像素格大小（世界單位 = 1 低解析度像素），再以子像素偏移平移放大後的畫面，避免像素爬動。"}, "en": {"name": "3D pixel art (pixelated 3D)", "observe": "The image looks like hand-drawn pixel art, yet objects rotate smoothly with correct perspective and lighting: everything is made of clear big pixels, shading has only 2–3 steps, objects have 1-pixel dark outlines, colours come from a limited palette, and the pixel grid does not crawl or shimmer when the camera moves.", "notThis": "Not a pixelation filter (PP-05, just chopping a high-res image into blocks, no outlines or banding, shimmering in motion) nor PS1 style (NPR-11, vertex jitter and texture warping). 3D pixel art means low-res rendering plus pixel-art rules (outlines, bands, palette, stable grid).", "use": "Games that want a pixel-art look with 3D freedom (rotation, lighting, lots of animation), isometric sims or strategy games, auto-generating pixel sprites from 3D models.", "prompt": "Render the game’s 3D scene as pixel art: (1) render with an orthographic camera at 1/4 output resolution (e.g. 480×270) and upscale by an integer factor with nearest filtering; (2) quantize lighting to 3 bands (N·L > 0.6 / > 0.25 / else, multipliers 1.0/0.78/0.56) and colours to 8 levels per channel or a palette; (3) draw 1-pixel outlines where object ID or depth changes (colour ×0.35, on the nearer object); (4) snap the camera position to the pixel size (world units per low-res pixel), then shift the upscaled image by the sub-pixel remainder to avoid pixel crawl."}, "ja": {"name": "3D ピクセルアート（ピクセル化 3D）", "observe": "画面は手描きのドット絵のように見えるのに、オブジェクトはなめらかに回転し、透視や光と影も正しい。すべてがはっきりした大きなピクセルでできていて、陰影は 2〜3 段だけ、オブジェクトの縁には 1 ピクセルの暗い輪郭があり、色は限られたパレットから選ばれる。カメラが動いてもピクセル格子がちらついたり這ったりしない。", "notThis": "ピクセレートフィルター（PP-05、高解像度の画面をマス目に切るだけで、輪郭や階調処理がなく、動くとちらつく）や PS1 風（NPR-11、頂点の跳びとテクスチャのゆがみ）とは違う。3D ピクセルアートの要点は「低解像度レンダリング＋ドット絵のルール（輪郭、階調、パレット、安定した格子）」。", "use": "ドット絵の見た目と 3D の自由度（回転、光と影、大量のアニメーション）を両立したいゲーム、アイソメトリックのシミュレーションや戦略ゲーム、3D モデルからドット絵スプライトを自動生成する。", "prompt": "ゲームの 3D シーンをピクセルアートとして描画する：(1) 出力の 1/4 解像度（例：480×270）の平行投影カメラで描画し、整数倍の最近傍補間で拡大する。(2) 陰影を 3 段に量子化（N·L > 0.6 / > 0.25 / それ以外、倍率 1.0/0.78/0.56）し、色はチャンネルあたり 8 段かパレットに量子化。(3) オブジェクト ID や深度が変わる所に 1 ピクセルの輪郭（色 ×0.35、手前のオブジェクト側に描く）。(4) カメラ位置をピクセルサイズ（低解像度 1 ピクセル分のワールド単位）にスナップし、拡大後の画面を端数分だけずらしてピクセルの這いを防ぐ。"}, "params": "internal resolution / pixel scale · light bands · palette · outline rule (ID, depth, normal) · camera snapping · orthographic vs perspective", "impl": "Render to a low-res target with an ortho camera; snap camera position to texel size in view space and apply the leftover fraction as a screen-space offset when blitting. Shade with stepped N·L, then palette-map. Outline pass on the low-res buffer: compare object ID/depth with 4 neighbours, darken the nearer pixel. Blit with point filtering at an integer scale.", "related": ["PP-05", "PIX-01", "PIX-03", "NPR-11", "PIX-10"], "refs": [{"t": "David Holland — 3D pixel art rendering", "u": "https://www.davidhol.land/articles/3d-pixel-art-rendering/"}, {"t": "Game Developer — Art design deep dive: using a 3D pipeline for 2D animation in Dead Cells", "u": "https://www.gamedeveloper.com/production/art-design-deep-dive-using-a-3d-pipeline-for-2d-animation-in-i-dead-cells-i-"}], "nosrc": false}, {"id": "NPR-14", "cat": "NPR", "sub": "復古與低保真", "std": "HD-2D", "aliases": ["2D-HD", "Pixel sprites in 3D", "Diorama look", "Octopath-style"], "type": "C", "zh": {"name": "HD-2D（像素精靈＋3D 立體透視場景）", "observe": "像素畫的角色與物件像紙片一樣立在 3D 的地面上，鏡頭從斜上方以透視角度俯視，畫面上下兩端明顯模糊（移軸鏡頭般的景深），中間清晰，像在看一個縮小的模型場景；燈火有柔和的泛光，光線穿過空氣，整體色調溫暖。", "notThis": "不是傳統 2D 俯視角（同樣的像素素材，但沒有透視、景深與光影）；也不是 3D 像素風（NPR-13，連 3D 模型都被像素化）。HD-2D 的重點是「像素素材保持原樣，周圍用現代 3D 透視與後處理包裝」。「HD-2D」原是 Square Enix 的品牌用語。", "use": "復古 JRPG 重製或致敬作品、像素美術但想要電影感、模型場景／微縮風格的畫面。", "prompt": "在遊戲中做出 HD-2D 風格：(1) 地面與建築用 3D 幾何加像素貼圖（16px 一格，最近鄰取樣）；(2) 角色、樹木等以像素精靈做垂直立牌，按像素比例縮放、最近鄰取樣，腳下加橢圓陰影；(3) 透視鏡頭俯角約 35°、FOV 約 44°；(4) 移軸景深：畫面頂部 0–30% 和底部 72–100% 逐漸混合為 1/4 解析度的模糊畫面；(5) 燈火加暖色加法泛光（半徑約 1.2 格）、3 道淡淡的斜向光束；(6) 暖色調色（紅 +12%、藍 −12%）與 55% 強度暗角。"}, "en": {"name": "HD-2D", "observe": "Pixel-art characters and props stand like paper cut-outs on 3D ground; the camera looks down from an angle with perspective; the top and bottom of the frame are clearly blurred (tilt-shift style depth of field) while the middle stays sharp, like looking at a miniature model; lamps have soft bloom, light shafts cross the air, and the grade is warm.", "notThis": "Not traditional top-down 2D (the same pixel assets but no perspective, depth of field or lighting) nor 3D pixel art (NPR-13, where even the 3D models are pixelated). HD-2D keeps the pixel assets untouched and wraps them in modern 3D perspective and post effects. “HD-2D” is originally a Square Enix brand term.", "use": "Retro JRPG remakes or homages, pixel art that wants a cinematic feel, miniature/diorama-style scenes.", "prompt": "Build an HD-2D look in the game: (1) ground and buildings as 3D geometry with pixel textures (16 px per tile, nearest sampling); (2) characters, trees etc. as upright pixel-sprite billboards, scaled to the pixel ratio with nearest sampling and an elliptical shadow at the feet; (3) perspective camera pitched about 35° down, FOV about 44°; (4) tilt-shift depth of field: blend toward a 1/4-resolution blurred image over the top 0–30% and bottom 72–100% of the screen; (5) warm additive bloom on lamps (radius about 1.2 tiles) and 3 faint diagonal light shafts; (6) warm grade (red +12%, blue −12%) and a 55% vignette."}, "ja": {"name": "HD-2D（ドット絵スプライト＋3D 透視の背景）", "
