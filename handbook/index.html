patial anti-aliasing", "u": "https://en.wikipedia.org/wiki/Spatial_anti-aliasing"}], "nosrc": false}, {"id": "PIX-12", "cat": "PIX", "sub": "線條與形體", "std": "Selective outlining", "aliases": ["Sel-out", "Selout", "Coloured outline", "Lit outline"], "type": "C", "zh": {"name": "選擇性描邊（sel-out）", "observe": "精靈的外框不是一圈純黑線：外框顏色跟隨旁邊的填色變成較深的同色，受光一側的外框更亮甚至省去，背光一側較深。結果角色仍然分得清輪廓，但看起來比粗黑框柔和、有體積。", "notThis": "不是全黑描邊（整圈同一顏色，卡通感強）；也不是內發光或後處理描邊 shader（自動、按像素一律加線）。sel-out 是逐段按光源和材質選色。", "use": "在中等大小（16–48 像素）的角色上兼顧可讀性與質感；在暗背景上用全黑描邊會消失，sel-out 可避免。", "prompt": "把遊戲的居民與敵人描邊改為選擇性描邊：外框顏色取相鄰填色在色階中的最暗一級；左上受光方向的外框用中間色或省去，右下背光方向保持最暗色；只有與背景對比不足的部位（例如頭髮與夜色）保留近黑描邊。"}, "en": {"name": "Selective outlining (sel-out)", "observe": "The outline is not a solid black ring: each segment takes a darker shade of the fill next to it, the lit side gets a lighter outline (or none), and the shadow side stays dark. The silhouette still reads, but softer and more volumetric than a thick black line.", "notThis": "Not a full black outline (one colour all the way round, very cartoony) nor an inner-glow or post-process outline shader (automatic, same line everywhere). Sel-out is chosen segment by segment from the light direction and material.", "use": "Balances readability and texture on mid-sized characters (16–48 px); a black outline vanishes on dark backgrounds, which sel-out avoids.", "prompt": "Switch the game's NPCs and enemies to selective outlines: each outline pixel uses the darkest step of the adjacent fill's ramp; on the lit (top-left) side use a mid tone or drop the outline; on the shadow (bottom-right) side keep the darkest shade; keep a near-black outline only where contrast with the background is weak (e.g. hair against the night)."}, "ja": {"name": "セレクティブアウトライン（セルアウト）", "observe": "輪郭線を一周真っ黒にせず、隣の塗り色の暗い色にする。光の当たる側は明るい色にするか省き、陰の側は暗くする。輪郭は読み取れるまま、太い黒線より柔らかく立体的に見える。", "notThis": "全部黒の輪郭（同じ色で一周、強いアニメ調）や内側グロー／ポストプロセスのアウトラインシェーダー（自動で一律に線を引く）とは違う。セルアウトは光源と素材に合わせて区間ごとに色を選ぶ。", "use": "中サイズ（16〜48 ドット）のキャラで読みやすさと質感を両立する。暗い背景では黒い輪郭が消えるが、セルアウトなら避けられる。", "prompt": "ゲームの町の人と敵の輪郭をセレクティブアウトラインにして。輪郭の各ドットは隣接する塗り色のランプの最も暗い段。左上の光の当たる側は中間色にするか省き、右下の陰側は最暗色のまま。背景とのコントラストが弱い部分（夜の髪など）だけ黒に近い輪郭を残す。"}, "params": "outline colour rule (darkest ramp step / near-black) · light direction · drop outline on lit side yes/no · minimum contrast vs background", "impl": "Art-side; bake into sprites. If you need a runtime outline (selection highlight), do it as a separate 1-px dilation pass in base-res pixels (sample 4 neighbours of alpha with point sampling) so it stays crisp — never a blurred glow.", "related": ["PIX-09", "PIX-11", "PIX-13"], "refs": [{"t": "Lospec — Selout tutorials (tag)", "u": "https://lospec.com/pixel-art-tutorials/tags/selout"}, {"t": "Lospec — Outline tutorials (tag)", "u": "https://lospec.com/pixel-art-tutorials/tags/outline"}, {"t": "Pedro Medeiros (saint11) — Pixel art tutorials", "u": "https://saint11.org/blog/pixel-art-tutorials/"}], "nosrc": false}, {"id": "PIX-13", "cat": "PIX", "sub": "線條與形體", "std": "Silhouette readability", "aliases": ["Readable silhouettes", "Shape language", "Silhouette test"], "type": "C", "zh": {"name": "剪影可讀性", "observe": "把角色全部塗黑只看外形，仍然一眼分得出誰是誰：居民、弓手、敵人、大塊頭各有獨特的輪廓特徵（武器方向、耳朵、體型比例）。在像素遊戲中，角色只有十幾個像素高，剪影就是最主要的辨認方式。", "notThis": "不是描邊（PIX-12，處理線條顏色）；也不是顏色區分（色盲或夜間會失效）。剪影可讀性是形狀設計問題：如果兩個單位填黑後一模一樣，換甚麼顏色都不夠。", "use": "令玩家在混戰、夜晚、遠景中立即分辨敵我與兵種；也決定角色在畫面上要多大才夠用。", "prompt": "檢查遊戲所有單位的剪影：把每個精靈填成純黑放在同一行比較，居民、弓手、守衛、普通敵人、敵方薩滿、敵方大塊頭必須各有一個獨特的外形特徵（尖耳、弓、盾、法杖、體型），而且不依賴顏色就能分辨。角色高度保持 14–18 像素。"}, "en": {"name": "Silhouette readability", "observe": "Fill every character solid black and you can still tell who is who: NPC, archer, enemy and brute each have a distinctive outline feature (weapon direction, ears, body proportions). In a pixel game a character is only a dozen or so pixels tall, so the silhouette is the main way it is recognised.", "notThis": "Not outlining (PIX-12, which is about line colour) and not colour coding (fails for colour-blind players or at night). Silhouette readability is a shape-design issue: if two units look identical filled black, no colour change is enough.", "use": "Lets players instantly tell friend from foe and unit types in crowds, at night or at a distance; it also decides how large a character needs to be on screen.", "prompt": "Audit the game's units for silhouette readability: fill every sprite pure black and line them up; NPC, archer, guard, enemy, enemy shaman and enemy brute must each have one unique shape feature (pointed ears, bow, shield, staff, bulk) and be distinguishable without colour. Keep characters 14–18 px tall."}, "ja": {"name": "シルエットの判読性", "observe": "キャラを真っ黒に塗りつぶして形だけにしても、誰が誰か一目で分かる。町の人・弓兵・敵・大男がそれぞれ独自の輪郭の特徴（武器の向き、耳、体型の比率）を持つ。キャラが十数ドットしかないドット絵ゲームでは、シルエットが最も重要な識別手段。", "notThis": "輪郭線（PIX-12、線の色の話）や色による区別（色覚や夜間では効かない）とは違う。形のデザインの問題で、黒く塗って同じ形なら色を変えても不十分。", "use": "乱戦・夜・遠景でも敵味方と兵種をすぐ見分けさせる。キャラを画面上でどの大きさにすべきかも決まる。", "prompt": "ゲームの全ユニットのシルエットを点検して。各スプライトを純黒で塗り横一列に並べ、町の人・弓兵・衛兵・敵・敵のシャーマン・敵の大男がそれぞれ固有の形の特徴（尖った耳、弓、盾、杖、体格）を持ち、色に頼らず区別できること。キャラの高さは 14〜18 ドット。"}, "params": "character height (px) · unique feature per unit · test on dark & light backgrounds · facing-left variants also distinct", "impl": "Add a renderer debug toggle that renders all sprites with colour = (0,0,0,a) (one-line pixel shader branch on a constant-buffer flag) so silhouettes can be reviewed in the live scene.", "related": ["PIX-12", "PIX-24", "PIX-25"], "refs": [{"t": "Lospec — Silhouette tutorials (tag)", "u": "https://lospec.com/pixel-art-tutorials/tags/silhouette"}, {"t": "Wikipedia — Silhouette", "u": "https://en.wikipedia.org/wiki/Silhouette"}, {"t": "Slynyrd — Pixelblog 22: Top-down character sprites", "u": "https://www.slynyrd.com/blog/2019/10/21/pixelblog-22-top-down-character-sprites"}], "nosrc": false}, {"id": "PIX-14", "cat": "PIX", "sub": "動畫", "std": "Sub-pixel animation", "aliases": ["Subpixel animation", "Sub-pixel movement (art)", "Anti-aliased motion"], "type": "C", "zh": {"name": "次像素動畫", "observe": "精靈的某部分移動不到一整個像素：美術改變邊緣像素的顏色深淺（例如 100% → 50% → 0%），令眼睛感覺邊緣「移動了半格」。常用在呼吸起伏、眼睛轉動、旗幟擺動等小幅動作，令小精靈的動畫更細膩，卻不用增加解析度。", "notThis": "不是次像素鏡頭平滑（PIX-03，整個畫面在螢幕解析度做偏移）；也不是引擎把精靈畫在小數座標上（會變模糊或抖動）。次像素動畫是美術逐格畫出來的中間色，所有像素仍在整數格上。", "use": "小型角色的待機呼吸、慢動作、細微擺動；在 12–16 像素高的角色上特別有效。", "prompt": "為遊戲的居民待機動畫做次像素呼吸：4 格循環，肩膀與頭頂輪廓不整格移動，而是把頂部一行像素在「實色 → 中間色 → 背景」之間轉換來模擬上升半像素；每格 0.2 秒。引擎繪製時精靈仍然對齊整數像素。"}, "en": {"name": "Sub-pixel animation", "observe": "Part of a sprite moves by less than one pixel: the artist changes the shade of edge pixels (e.g. 100% → 50% → 0%) so the eye reads the edge as \"moving half a pixel\". Common for breathing, eye movement and flag sway — it makes small sprites animate finely without raising the resolution.", "notThis": "Not sub-pixel camera smoothing (PIX-03, offsetting the whole frame at screen resolution) and not the engine drawing sprites at fractional positions (which blurs or jitters). Sub-pixel animation is hand-drawn in-between colours; every pixel is still on the integer grid.", "use": "Idle breathing, slow motions and subtle sways on small characters; especially effective at 12–16 px tall.", "prompt": "Give the game's NPC idle a sub-pixel breathing cycle: 4 frames; the shoulders and top of the head do not move a whole pixel — instead the top row of pixels shifts between solid colour → mid tone → background to fake a half-pixel rise; 0.2 s per frame. The engine still draws the sprite at whole-pixel positions."}, "ja": {"name": "サブピクセルアニメーション", "observe": "スプライトの一部を 1 ドット未満だけ動かす。輪郭のドットの濃さを変え（100%→50%→0% など）、目には輪郭が「半ドット動いた」ように見せる。呼吸、目の動き、旗の揺れなど小さな動きに使い、解像度を上げずに小さなスプライトを繊細に動かせる。", "notThis": "サブピクセルカメラ（PIX-03、画面全体をスクリーン解像度でずらす）やエンジンが小数座標にスプライトを描くこと（ぼけるかガタつく）とは違う。手描きの中間色で、すべてのドットは整数格子上にある。", "use": "小さなキャラの待機呼吸、ゆっくりした動き、微妙な揺れ。高さ 12〜16 ドットのキャラで特に効果的。", "prompt": "ゲームの町の人の待機にサブピクセル呼吸を入れて。4 コマのループで、肩と頭頂の輪郭は 1 ドット丸ごと動かさず、上端の 1 列を「実色→中間色→背景」と切り替えて半ドット上がるように見せる。1 コマ 0.2 秒。描画時のスプライト位置は整数ピクセルのまま。"}, "params": "frames per cycle · in-between shades (1–2 per edge) · frame duration · which parts move (head, shoulders, eyes)", "impl": "Pure art technique; engine must not break it: no bilinear filtering, no fractional sprite positions (PIX-02), no palette quantisation that removes the in-between colours.", "related": ["PIX-02", "PIX-03", "PIX-11"], "refs": [{"t": "pixelart.school — Sub-pixel animation", "u": "https://pixelart.school/learn/pixel-art-sub-pixel"}, {"t": "Lospec — Sub-pixel tutorials (tag)", "u": "https://lospec.com/pixel-art-tutorials/tags/subpixel"}, {"t": "Slynyrd — Pixelblog 8: Intro to animation", "u": "https://www.slynyrd.com/blog/2018/8/19/pixelblog-8-intro-to-animation"}], "nosrc": false}, {"id": "PIX-15", "cat": "PIX", "sub": "場景構成", "std": "Parallax scrolling", "aliases": ["Multi-layer parallax", "Parallax layers", "Depth scrolling"], "type": "S", "zh": {"name": "多層視差捲動", "observe": "背景分成幾層：遠山、雲、遠樹、近樹、地面。鏡頭移動時，越遠的層移動越慢、越近的層越快（前景甚至比地面更快），平面的 2D 畫面因此產生深度感。", "notThis": "不是 Mode 7（PIX-20，逐行變形做出透視地面）；也不是鏡頭縮放。視差只是每層以不同比例跟隨鏡頭平移，每層本身不變形。", "use": "橫向捲軸、標題畫面、過場；俯視角遊戲可用在雲影或遠景地圖邊緣。", "prompt": "為遊戲的標題畫面與世界地圖加入 4 層視差：天空 0.1×、遠山 0.3×、樹林 0.6×、地面 1.0× 的鏡頭移動比例；每層位置在繪製前取整到整數像素（各層獨立取整，不要讓整層出現小數位移模糊）。"}, "en": {"name": "Parallax scrolling", "observe": "The background is split into layers — distant mountains, clouds, far trees, near trees, ground. As the camera moves, farther layers move slower and nearer ones faster (foreground can even outrun the ground), giving a flat 2D image a sense of depth.", "notThis": "Not Mode 7 (PIX-20, which warps each scanline into a perspective floor) and not camera zoom. Parallax only translates each layer at a different fraction of the camera; layers themselves are not distorted.", "use": "Side-scrollers, title screens, cut-scenes; in top-down games it can be used for cloud shadows or distant map edges.", "prompt": "Add 4-layer parallax to the game's title screen and world map: sky moves at 0.1× the camera, far hills 0.3×, forest 0.6×, ground 1.0×. Round each layer's position to whole pixels before drawing (round per layer so no layer ever renders at a blurry fractional offset)."}, "ja": {"name": "多重スクロール（視差スクロール）", "observe": "背景を遠い山、雲、遠い木、近い木、地面などの層に分け、カメラが動くと遠い層ほどゆっくり、近い層ほど速く動く（前景は地面より速いこともある）。平面の 2D 画面に奥行きが生まれる。", "notThis": "Mode 7（PIX-20、走査線ごとに変形して遠近の地面を作る）やカメラのズームとは違う。視差は各層をカメラの異なる割合で平行移動するだけで、層自体は変形しない。", "use": "横スクロール、タイトル画面、カットシーン。見下ろし型でも雲の影やマップ端の遠景に使える。", "prompt": "ゲームのタイトル画面とワールドマップに 4 層の多重スクロールを入れて。カメラ移動に対して空 0.1×、遠い丘 0.3×、森 0.6×、地面 1.0×。各層の位置は描画前に整数ピクセルに丸める（層ごとに丸め、どの層も小数オフセットでぼけないように）。"}, "params": "layer count · speed factor per layer (0–1.2) · vertical parallax yes/no · loop width per layer · per-layer rounding", "impl": "One draw (or one instanced batch) per layer with its own view offset: offset_i = floor(cam * factor_i + 0.5). Use WRAP address mode on a point sampler for horizontally tiling layers and shift UVs instead of moving geometry.", "related": ["PIX-20", "PIX-02", "CAM-04 Camera damping"], "refs": [{"t": "Wikipedia — Parallax scrolling", "u": "https://en.wikipedia.org/wiki/Parallax_scrolling"}, {"t": "Godot docs — 2D parallax", "u": "https://docs.godotengine.org/en/stable/tutorials/2d/2d_parallax.html"}], "nosrc": false}, {"id": "PIX-16", "cat": "PIX", "sub": "場景構成", "std": "Y-sorting", "aliases": ["Depth sorting", "Y-sort", "Painter's algorithm (by Y)", "Sort by foot position"], "type": "S", "zh": {"name": "按 Y 排序（深度排序）", "observe": "俯視角或斜俯視遊戲中，物件按「腳底」的 Y 座標由上至下依次繪製：站在樹後面（較上方）的角色被樹遮住，走到樹前面（較下方）時就蓋過樹。排序依據是物件的底部錨點，而不是圖片頂部。", "notThis": "不是 Z-buffer 深度測試（3D 用每像素深度）；也不是固定圖層（角色永遠在建築上面）。Y-sort 是每幀按腳底位置重新排序的畫家演算法。", "use": "俯視角 RPG、模擬經營、塔防：角色在樹、房屋、圍欄之間穿梭時遮擋正確。", "prompt": "為遊戲實作 Y-sort：所有角色、樹木、房屋、圍欄放在同一個排序層，每幀按「腳底錨點 Y」（精靈底部中心）由小到大排序繪製；Y 相同時按 X 再按實體 ID 排序避免閃爍。高大的建築以其地基線為錨點，而不是圖片中心。"}, "en": {"name": "Y-sorting (depth sorting)", "observe": "In a top-down or three-quarter view, objects are drawn from top to bottom by the Y coordinate of their feet: a character behind a tree (higher up) is covered by the tree, and when it walks in front (lower down) it covers the tree. The sort key is the object's bottom anchor, not the top of the image.", "notThis": "Not a Z-buffer depth test (per-pixel depth in 3D) and not fixed layers (characters always above buildings). Y-sorting is a painter's algorithm re-sorted each frame by foot position.", "use": "Top-down RPGs, sims and tower defence — correct occlusion as characters weave between trees, houses and fences.", "prompt": "Implement Y-sorting in the game: put all characters, trees, houses and fences in one sorted layer and every frame draw them in ascending order of their foot-anchor Y (sprite bottom centre); break ties by X then entity ID to prevent flicker. Tall buildings anchor on their foundation line, not their image centre."}, "ja": {"name": "Y ソート（奥行きソート）", "observe": "見下ろし型・斜め見下ろし型で、オブジェクトを「足元」の Y 座標の上から下へ順に描く。木の後ろ（上側）にいるキャラは木に隠れ、前（下側）に出ると木の上に描かれる。ソートの基準は画像の上端ではなく下端のアンカー。", "notThis": "Z バッファの深度テスト（3D のピクセル単位の深度）や固定レイヤー（キャラが常に建物より上）とは違う。毎フレーム足元の位置で並べ直す画家のアルゴリズム。", "use": "見下ろし型 RPG、経営シム、タワーディフェンス。キャラが木・家・柵の間を通る時に正しく隠れる。", "prompt": "ゲームに Y ソートを実装して。キャラ・木・家・柵を一つのソート対象レイヤーに入れ、毎フレーム「足元アンカーの Y」（スプライト下端中央）の昇順で描く。Y が同じなら X、次にエンティティ ID で並べてちらつきを防ぐ。大きな建物は画像中心ではなく基礎の線をアンカーにする。"}, "params": "sort key (foot Y, optional per-object offset) · tie-breaker · which layers are sorted vs fixed (ground, decals, UI) · multi-part objects split into separate sort entries", "impl": "CPU: build an array of (key = footY*65536 + footX, drawIndex) for the sorted layer, std::sort (or radix sort) each frame, then fill the dynamic sprite VB in that order — one draw call. Alternative: write footY as SV_Depth/vertex Z with a depth test and alpha-tested (clip) sprites, but that fails with semi-transparent pixels.", "related": ["PIX-24", "PIX-18", "PIX-17"], "refs": [{"t": "sgeos — Y-sort article", "u": "https://sgeos.github.io/games/graphics/projection/2026/04/30/draw_order_y_sort_z_sort_and_painters_algorithm.html"}, {"t": "Wikipedia — Painter's algorithm", "u": "https://en.wikipedia.org/wiki/Painter%27s_algorithm"}, {"t": "Godot docs — Sprite2D (offset, centered, flip_h)", "u": "https://docs.godotengine.org/en/stable/classes/class_sprite2d.html"}], "nosrc": false}, {"id": "PIX-17", "cat": "PIX", "sub": "場景構成", "std": "Autotiling", "aliases": ["Tilemap", "Bitmask autotiling", "Wang tiles", "Blob tileset", "Terrain transitions"], "type": "S", "zh": {"name": "圖塊地圖與自動拼接", "observe": "地圖由固定大小（例如 16×16）的圖塊格子組成；畫一條泥路時，引擎按每格四周（或八方向）是否同一種地形，自動選出直路、轉角、T 字、盡頭等邊緣圖塊，令路的邊緣連貫自然，而不是一格格方塊。", "notThis": "不是手動逐格選 tile（費時易錯）；也不是一整張大背景圖。自動拼接是按鄰格計算位元遮罩（bitmask）再查表選圖。", "use": "在關卡編輯器或遊戲中即時修改地形（挖路、蓋牆、腐化蔓延）而邊緣自動更新。", "prompt": "為遊戲的地形加入自動拼接：16×16 tile，泥路與草地交界用 4 方向位元遮罩（上1、右2、下4、左8）挑選 16 種邊緣 tile；玩家建造道路或敵人踩出泥地時，該格與四鄰格即時重新計算。"}, "en": {"name": "Tilemap autotiling", "observe": "The map is a grid of fixed-size tiles (e.g. 16×16). When you paint a dirt road the engine checks whether each cell's 4 (or 8) neighbours are the same terrain and automatically picks straight, corner, T-junction and end tiles, so the road's edges join up naturally instead of looking like square blocks.", "notThis": "Not hand-picking each tile (slow and error-prone) and not one big background image. Autotiling computes a neighbour bitmask per cell and looks up the matching tile.", "use": "Level editors and in-game terrain changes (digging paths, building walls, corruption spreading) with edges updating automatically.", "prompt": "Add autotiling to the game's terrain: 16×16 tiles; the dirt/grass boundary uses a 4-direction bitmask (up 1, right 2, down 4, left 8) to choose among 16 edge tiles. When the player builds a road or enemies trample dirt, recompute that cell and its four neighbours immediately."}, "ja": {"name": "タイルマップのオートタイル", "observe": "マップは決まった大きさ（16×16 など）のタイルの格子。土の道を塗ると、各マスの 4（または 8）方向の隣が同じ地形かを見て、直線・角・T 字・行き止まりなどの縁タイルを自動で選び、道の縁が四角いブロックでなく自然につながる。", "notThis": "1 マスずつ手で選ぶ方法（手間がかかりミスしやすい）や一枚の大きな背景画とは違う。マスごとに隣接ビットマスクを計算してタイルを引く。", "use": "レベルエディタやゲーム中の地形変化（道を掘る、壁を建てる、侵食の広がり）で縁を自動更新する。", "prompt": "ゲームの地形にオートタイルを入れて。16×16 タイルで、土と草の境界は 4 方向ビットマスク（上 1、右 2、下 4、左 8）で 16 種の縁タイルから選ぶ。プレイヤーが道を作ったり敵が土を踏み荒らした時、そのマスと上下左右のマスを即座に再計算する。"}, "params": "tile size · 4-neighbour (16 tiles) vs 8-neighbour blob (47 tiles) vs corner/Wang (16 per pair) · terrain priority when 3 types meet · random variants per mask", "impl": "Keep the tile map as a CPU array of terrain IDs and a derived array of tile indices; on change, recompute mask = N|E<<1|S<<2|W<<3 for the cell and its neighbours and update only those instances in a dynamic instance buffer (one instanced quad draw per chunk). Atlas tiles need padding/extrusion (PIX-26).", "related": ["PIX-26", "ENV-16", "PIX-16"], "refs": [{"t": "Godot docs — Using TileSets", "u": "https://docs.godotengine.org/en/stable/tutorials/2d/using_tilesets.html"}, {"t": "Boris the Brave — Classification of tilesets", "u": "https://www.boristhebrave.com/2021/11/14/classification-of-tilesets/"}, {"t": "Boris the Brave — Tileset roundup", "u": "https://www.boristhebrave.com/2013/07/14/tileset-roundup/"}, {"t": "Excalibur.js blog — Autotiling technique (bitmask)", "u": "https://excaliburjs.com/blog/Autotiling%20Technique/"}, {"t": "Wikipedia — Wang tile", "u": "https://en.wikipedia.org/wiki/Wang_tile"}, {"t": "Wikipedia — Tile-based video game", "u": "https://en.wikipedia.org/wiki/Tile-based_video_game"}], "nosrc": false}, {"id": "PIX-18", "cat": "PIX", "sub": "場景構成", "std": "Fake height with ground shadow", "aliases": ["Z-offset", "Jump arc with shadow", "Height axis in 2D", "Drop shadow anchor"], "type": "D", "zh": {"name": "假高度（影子留在地面）", "observe": "俯視角 2D 中，跳躍、拋物線箭矢、被擊飛的物件，精靈向上畫高 z 像素，但影子仍留在地面原位置，並隨高度變小變淡。玩家靠影子判斷物件真正在地面的哪一點，碰撞與排序也以影子位置計算。", "notThis": "不是單純改 Y 座標（那看起來像向北走，排序與碰撞會錯）；也不是 3D。這是「描述性名稱」：業界沒有統一叫法，常見說法是 z-offset 或 jump shadow。", "use": "跳躍、投擲、拋物線攻擊、被擊飛、掉落物彈跳；讓 2D 俯視角也有高度軸。", "prompt": "為遊戲的投石、箭矢與被擊飛的敵人加入獨立高度軸：每個物件有地面座標 (x, y) 與高度 z；精靈畫在 (x, y − z)，影子畫在 (x, y)，影子寬度隨 z 由 100% 縮到 60%、透明度由 40% 降到 20%；Y-sort 和碰撞都用 (x, y)，不用 y − z。"}, "en": {"name": "Fake height with a ground shadow", "observe": "In top-down 2D, jumps, lobbed arrows and knocked-up objects draw the sprite z pixels higher while the shadow stays at the original ground spot and shrinks/fades with height. The shadow tells the player where the object really is on the ground, and collision and sorting use the shadow position.", "notThis": "Not simply changing Y (that reads as walking north and breaks sorting and collision), and not 3D. This is a descriptive label: there is no single industry name; people say z-offset or jump shadow.", "use": "Jumps, throws, lobbed attacks, knock-ups, bouncing drops — a height axis in top-down 2D.", "prompt": "Give the game's thrown rocks, arrows and knocked-up enemies a separate height axis: each object has a ground position (x, y) and height z; draw the sprite at (x, y − z) and the shadow at (x, y); shrink the shadow width from 100% to 60% and its opacity from 40% to 20% as z rises. Y-sorting and collision use (x, y), never y − z."}, "ja": {"name": "疑似高さ（影を地面に残す）", "observe": "見下ろし 2D で、ジャンプ・山なりの矢・打ち上げられた物は、スプライトを z ドット上に描くが影は元の地面の位置に残り、高さに応じて小さく薄くなる。プレイヤーは影で地面上の本当の位置を判断し、当たり判定とソートも影の位置で行う。", "notThis": "Y 座標を変えるだけ（北へ歩いたように見え、ソートと当たり判定が狂う）でも 3D でもない。これは説明的な名称で、業界に統一名はなく z オフセットやジャンプシャドウと呼ばれる。", "use": "ジャンプ、投擲、山なりの攻撃、打ち上げ、ドロップアイテムのバウンド。見下ろし 2D に高さの軸を持たせる。", "prompt": "ゲームの投石・矢・打ち上げられた敵に独立した高さ軸を付けて。各物体は地面座標 (x, y) と高さ z を持ち、スプライトは (x, y − z)、影は (x, y) に描く。z が上がると影の幅は 100%→60%、不透明度は 40%→20%。Y ソートと当たり判定は y − z ではなく (x, y) を使う。"}, "params": "max height · gravity · shadow scale/alpha vs z · shadow shape (ellipse, pixel blob) · whether z affects collision (hit only when z < threshold)", "impl": "Store z in the entity; vertex position = (x, y − round(z)); shadow drawn as a separate sprite (pre-drawn pixel ellipse at 2–3 sizes rather than scaling, to stay crisp). Sort key = ground y (PIX-16).", "related": ["PIX-16", "PIX-24", "FB-04"], "refs": [{"t": "sgeos — Y-sort article", "u": "https://sgeos.github.io/games/graphics/projection/2026/04/30/draw_order_y_sort_z_sort_and_painters_algorithm.html"}], "nosrc": true}, {"id": "PIX-19", "cat": "PIX", "sub": "場景構成", "std": "Sprite stacking", "aliases": ["Stacked sprites", "Slice stacking", "Pseudo-3D voxel sprites"], "type": "C", "zh": {"name": "疊片假 3D（sprite stacking）", "observe": "把一個物件切成很多層水平切片（像 CT 掃描），每片是一張小像素圖；繪製時每片按同一角度旋轉，再逐片向上偏移 1 像素疊起來，看起來就像可以 360° 旋轉的 3D 像素模型。", "notThis": "不是真 3D 模型渲染成像素（NPR 的 3D pixel art）；也不是 RotSprite（PIX-05，只旋轉一張平面圖）。疊片法沒有透視，只能繞垂直軸旋轉。", "use": "可旋轉的車、船、箱子、建築、塔；俯視角遊戲中鏡頭旋轉時保持像素風。", "prompt": "為遊戲的投石車與箭塔試做 sprite stacking：每個物件 12–16 片 16×16 切片，繪製時每片以物件朝向旋轉（最近鄰取樣）並向上偏移 1 像素；切片從下到上畫，整個疊片物件以最底片的位置參與 Y-sort。"}, "en": {"name": "Sprite stacking", "observe": "An object is cut into many horizontal slices (like a CT scan), each a small pixel image; when drawing, every slice is rotated by the same angle and stacked one pixel higher than the last, so it looks like a 3D pixel model that can spin 360°.", "notThis": "Not real 3D models rendered as pixels (NPR 3D pixel art) and not RotSprite (PIX-05, which rotates one flat image). Stacking has no perspective and only rotates around the vertical axis.", "use": "Rotatable cars, boats, crates, buildings and towers; keeps a pixel look when a top-down camera rotates.", "prompt": "Prototype sprite stacking for the game's catapult and arrow tower: each object has 12–16 slices of 16×16; when drawing, rotate each slice by the object's heading with nearest sampling and offset it 1 px up; draw bottom to top, and use the bottom slice's position for Y-sorting."}, "ja": {"name": "スプライトスタッキング（重ね絵の疑似 3D）", "observe": "物体を CT スキャンのように多数の水平スライスに切り、各スライスを小さなドット画像にする。描画時に全スライスを同じ角度で回し、1 ドットずつ上にずらして重ねると、360° 回転できる 3D のドットモデルに見える。", "notThis": "3D モデルをドット風に描く手法（NPR の 3D ピクセルアート）や RotSprite（PIX-05、平面画像を回すだけ）とは違う。パースがなく、垂直軸まわりにしか回せない。", "use": "回転する車・船・箱・建物・塔。見下ろしカメラが回ってもドットらしさを保つ。", "prompt": "ゲームの投石機と矢倉でスプライトスタッキングを試作して。各物体は 16×16 のスライス 12〜16 枚。描画時は各スライスを物体の向きで（最近傍で）回し、1 ドットずつ上にずらす。下から上へ描き、Y ソートには一番下のスライスの位置を使う。"}, "params": "slice count · slice spacing (1 px, or 2 px for chunkier look) · rotation snapping (free vs 16 steps) · camera pitch fake (spacing scale)", "impl": "Pack slices in an atlas row; render as N instanced quads sharing a rotation matrix, instance i offset by (0, −i). Use point sampling and rotate in base-res pixel space (draw into the base-res RT) so edges stay crisp. Optionally pre-bake 16–32 headings to a regular sprite sheet for cost.", "related": ["PIX-05", "PIX-16"], "refs": [{"t": "Chequered Ink — 2.5D in GameMaker using sprite stacking", "u": "https://chequered.ink/2-5d-in-gamemaker-using-sprite-stacking/"}, {"t": "James Poole — Using sprite stacking for pseudo-3D in Wee Boats (devlog)", "u": "https://jamespoole.itch.io/wee-boats/devlog/685630/using-sprite-stacking-for-pseudo-3d-in-wee-boats"}], "nosrc": false}, {"id": "PIX-20", "cat": "PIX", "sub": "場景構成", "std": "Mode 7 and raster effects", "aliases": ["Mode 7", "Per-scanline effects", "Line scroll", "Raster scroll", "HDMA effects"], "type": "S", "zh": {"name": "Mode 7／逐行（光柵）效果", "observe": "畫面每一條水平掃描線用不同的捲動量或縮放：越下方的線放大越多，一張平面地圖就變成向遠處延伸、可以旋轉的透視地面（Mode 7）；若每行只改水平偏移，就得到熱浪扭曲、水中波動、旗幟般的波浪（line scroll）。", "notThis": "不是多層視差（PIX-15，整層一起平移）；也不是真 3D 地面。效果全部來自「每行一組參數」，地圖本身仍是平面像素圖。", "use": "世界地圖飛行、賽車、Boss 背景扭曲、水中或熱浪的逐行搖晃。", "prompt": "為遊戲的世界地圖過場做 Mode 7 效果：地平線以下每條掃描線 y，按距離 d = h / (y − horizon) 計算該行在地圖上的取樣位置與縮放，地圖隨飛行方向旋轉；地平線以上畫天空漸層。取樣用最近鄰，以免遠處糊成一片。"}, "en": {"name": "Mode 7 and raster (per-scanline) effects", "observe": "Each horizontal scanline uses a different scroll or scale: lower lines are magnified more, so a flat map becomes a rotatable perspective floor stretching to the horizon (Mode 7). If each line only changes its horizontal offset you get heat-haze wobble, underwater sway or flag-like waves (line scroll).", "notThis": "Not multi-layer parallax (PIX-15, whole layers translating) and not a true 3D floor. Everything comes from one set of parameters per line; the map itself is still a flat pixel image.", "use": "World-map flights, racing, warping boss backgrounds, per-line wobble for underwater or heat.", "prompt": "Make a Mode 7 world-map fly-over for the game: for each scanline y below the horizon compute distance d = h / (y − horizon) and from it the map sample position and scale for that line, rotating the map with the flight heading; draw a sky gradient above the horizon. Sample with nearest-neighbour so the distance does not turn to mush."}, "ja": {"name": "Mode 7／ラスター（走査線）エフェクト", "observe": "画面の水平走査線ごとにスクロール量や拡大率を変える。下の線ほど大きく拡大すると、平面のマップが地平線まで続く回転可能な遠近の地面になる（Mode 7）。各行の横オフセットだけを変えると、陽炎・水中の揺れ・旗のような波（ラインスクロール）になる。", "notThis": "多重スクロール（PIX-15、層ごと平行移動）や本物の 3D の地面とは違う。すべて「1 行に 1 組のパラメータ」で作られ、マップ自体は平面のドット絵のまま。", "use": "ワールドマップの飛行、レース、ボス背景の歪み、水中や陽炎の行単位の揺れ。", "prompt": "ゲームのワールドマップ演出に Mode 7 を作って。地平線より下の走査線 y ごとに距離 d = h / (y − horizon) を計算し、その行のマップ上のサンプル位置と拡大率を決め、飛行方向に合わせてマップを回転。地平線より上は空のグラデーション。遠くが潰れないよう最近傍でサンプリング。"}, "params": "horizon line · camera height h · field of view · rotation · per-line offset function (sin wave amplitude/frequency for line scroll)", "impl": "Full-screen pixel shader on the base-res RT: for pixel (x, y) below the horizon, d = h / (y − horizon + ε); world = camPos + R(angle) * float2((x − cx) * d / f, d); sample the map texture with point + WRAP. Line scroll: uv.x += amp * sin(y * freq + time) in base-res pixels, rounded to whole pixels for a crisp look.", "related": ["PIX-15", "ENV-17", "TRN-11"], "refs": [{"t": "Wikipedia — Mode 7", "u": "https://en.wikipedia.org/wiki/Mode_7"}, {"t": "Wikipedia — Raster interrupt", "u": "https://en.wikipedia.org/wiki/Raster_interrupt"}, {"t": "Tonc (GBA programming) — Mode 7 part 1", "u": "https://www.coranac.com/tonc/text/mode7.htm"}], "nosrc": false}, {"id": "PIX-21", "cat": "PIX", "sub": "光照", "std": "Normal-mapped sprites", "aliases": ["2D normal mapping", "Dynamic 2D lighting", "Lit sprites"], "type": "S", "zh": {"name": "2D 法線光照（法線貼圖精靈）", "observe": "每張像素精靈多配一張同尺寸的「法線圖」，記錄每個像素表面朝向哪邊；火把、燈籠、魔法在旁邊移動時，精靈向光的一面亮起、背光一面變暗，像有立體感，而美術仍然只畫一張平面圖。", "notThis": "不是 2D 投影（PIX-22，物件擋光在地上產生陰影）；也不是預先畫好的陰影（光源移動也不會變）。為保持像素風，光照結果通常量化成 2–4 個亮度級，而不是平滑漸變。", "use": "夜晚、洞穴、火把照明；令移動光源（火球、燈籠）與精靈互動。", "prompt": "為遊戲的夜晚加入 2D 法線光照：房屋、石牆、木桶、角色各配一張法線圖；每個燈籠／火把作為點光源（含高度 z），像素 shader 算 N·L 與距離衰減，再把亮度量化為 3 級（暗、中、亮）後乘上精靈顏色，保持像素感。最多同時 8 個光源。"}, "en": {"name": "Normal-mapped sprites (2D lighting)", "observe": "Each pixel sprite gets a matching \"normal map\" storing which way every pixel's surface faces; as torches, lanterns or spells move nearby, the side facing the light brightens and the far side darkens, so the sprite looks three-dimensional while the artist still draws one flat image.", "notThis": "Not 2D shadow casting (PIX-22, where objects block light and cast shadows on the ground) and not baked shading (which never changes as lights move). To stay pixel-art, the lighting is usually quantised to 2–4 brightness steps instead of a smooth gradient.", "use": "Night, caves and torch lighting; makes moving lights (fireballs, lanterns) interact with sprites.", "prompt": "Add normal-mapped 2D lighting to the game at night: houses, stone walls, barrels and characters each get a normal map; every lantern/torch is a point light with a height z; the pixel shader computes N·L with distance falloff, quantises the result to 3 steps (dark, mid, bright) and multiplies the sprite colour, keeping the pixel look. Up to 8 lights at once."}, "ja": {"name": "ノーマルマップ付きスプライト（2D ライティング）", "observe": "各ドットスプライトに同じ大きさの「法線マップ」を用意し、各ドットの表面の向きを記録する。松明・ランタン・魔法が近くを動くと光に向いた面が明るく、反対側が暗くなり、立体的に見える。アーティストは平面の絵を一枚描くだけ。", "notThis": "2D 影（PIX-22、物体が光を遮って地面に影を落とす）や描き込みの陰影（光源が動いても変わらない）とは違う。ドットらしさを保つため、光の結果は滑らかなグラデーションでなく 2〜4 段に量子化することが多い。", "use": "夜、洞窟、松明の照明。動く光源（火球、ランタン）とスプライトを反応させる。", "prompt": "ゲームの夜にノーマルマップの 2D ライティングを入れて。家・石垣・樽・キャラに法線マップを用意し、ランタン／松明は高さ z を持つ点光源。ピクセルシェーダーで N·L と距離減衰を計算し、明るさを 3 段（暗・中・明）に量子化してから色に掛け、ドット感を保つ。光源は同時に最大 8 個。"}, "params": "light height z · falloff radius · quantisation steps (2–4) · ambient level · normal map authoring (hand-painted vs generated from height)", "impl": "Bind the normal map as a second SRV with the same UVs and a point sampler. PS: n = normalize(nTex.xyz*2−1); for each light in a cbuffer array: L = normalize(float3(light.xy − worldPx.xy, light.z)); d += saturate(dot(n,L)) * atten; lit = floor(d*steps)/steps. Use worldPx in base-res pixels so quantisation bands stay pixel-aligned.", "related": ["PIX-22", "ENV-01", "PIX-08"], "refs": [{"t": "Wikipedia — Normal mapping", "u": "https://en.wikipedia.org/wiki/Normal_mapping"}, {"t": "Godot docs — 2D lights and shadows", "u": "https://docs.godotengine.org/en/stable/tutorials/2d/2d_lights_and_shadows.html"}, {"t": "mattdesl — ShaderLesson6: normal mapping for 2D sprites", "u": "https://github.com/mattdesl/lwjgl-basics/wiki/ShaderLesson6"}], "nosrc": false}, {"id": "PIX-22", "cat": "PIX", "sub": "光照", "std": "2D shadow casting", "aliases": ["Line-of-sight shadows", "2D visibility", "Light occluders", "Hard 2D shadows"], "type": "C", "zh": {"name": "2D 投影（視線陰影）", "observe": "光源（火把、角色視野）向四周發光，牆、箱子、樹幹等遮擋物後面形成清楚的陰影區；光源移動時陰影形狀即時改變。像素遊戲中陰影邊緣通常保持硬邊或以抖色做半影，而不是模糊。", "notThis": "不是法線光照（PIX-21，只決定表面明暗）；也不是戰爭迷霧（ENV-15，按探索狀態遮蓋地圖）。2D 投影是按幾何計算光線能否到達每一點。", "use": "夜晚潛行、火把照明、地牢可見範圍、塔的視野範圍。", "prompt": "為遊戲的夜晚加入 2D 投影：鎮上每個火把為光源，房屋與圍欄設為遮擋多邊形；每幀以光源為中心計算可見多邊形（向遮擋物角點投射光線），用它作為光照遮罩，陰影區保持 70% 暗；陰影邊緣不模糊，改用 1–2 像素寬的 Bayer 抖色作半影。"}, "en": {"name": "2D shadow casting (line-of-sight shadows)", "observe": "A light (torch, a character's view) shines outward and walls, crates and tree trunks leave crisp shadow regions behind them; as the light moves the shadow shapes update instantly. In pixel games shadow edges are usually kept hard or given a dithered penumbra rather than blurred.", "notThis": "Not normal-mapped lighting (PIX-21, which only shades surfaces) and not fog of war (ENV-15, which hides the map by exploration state). 2D shadow casting computes geometrically whether light can reach each point.", "use": "Night stealth, torch lighting, dungeon visibility, tower line of sight.", "prompt": "Add 2D shadow casting to the game at night: every town torch is a light and houses and fences are occluder polygons; each frame compute the visibility polygon around each light (cast rays to occluder corners) and use it as a light mask, with shadowed areas 70% dark. Do not blur the edge — use a 1–2 px Bayer-dithered penumbra instead."}, "ja": {"name": "2D シャドウキャスティング（視線の影）", "observe": "光源（松明、キャラの視界）が周囲を照らし、壁・箱・木の幹などの遮蔽物の後ろにはっきりした影ができる。光源が動くと影の形も即座に変わる。ドット絵ゲームでは影の縁は硬いまま、またはディザで半影を作り、ぼかさない。", "notThis": "ノーマルマップのライティング（PIX-21、面の明暗だけ）やフォグオブウォー（ENV-15、探索状態でマップを隠す）とは違う。2D 影は幾何学的に光が各点に届くかを計算する。", "use": "夜のステルス、松明の照明、ダンジョンの視界、塔の射線。", "prompt": "ゲームの夜に 2D シャドウキャスティングを入れて。町の松明をそれぞれ光源、家と柵を遮蔽ポリゴンにする。毎フレーム光源を中心に可視ポリゴン（遮蔽物の角へレイを飛ばす）を計算してライトマスクにし、影の部分は 70% 暗く。縁はぼかさず、1〜2 ドット幅の Bayer ディザで半影にする。"}, "params": "light radius · occluder shapes (tile-based vs polygons) · shadow darkness · penumbra (hard / dithered) · shadow resolution (base-res)", "impl": "Option A (polygons): CPU visibility polygon per light (sort rays to occluder vertices ±ε), triangulate as a fan, draw into a base-res light-mask RT with additive blend; composite with multiply. Option B (GPU, mattdesl-style): render occluders to a 1D shadow map per light via polar transform, then sample in the light pass. Keep the mask at base resolution with point sampling.", "related": ["PIX-21", "ENV-15", "PIX-08"], "refs": [{"t": "Red Blob Games — 2D visibility", "u": "https://www.redblobgames.com/articles/visibility/"}, {"t": "Nicky Case — Sight & Light: 2D visibility/shadow effects (interactive)", "u": "https://ncase.me/sight-and-light/"}, {"t": "mattdesl — 2D pixel-perfect shadows", "u": "https://github.com/mattdesl/lwjgl-basics/wiki/2D-Pixel-Perfect-Shadows"}, {"t": "Godot docs — 2D lights and shadows", "u": "https://docs.godotengine.org/en/stable/tutorials/2d/2d_lights_and_shadows.html"}], "nosrc": false}, {"id": "PIX-23", "cat": "PIX", "sub": "顯示與縮放", "std": "Mixels", "aliases": ["Mixed pixel sizes", "Inconsistent pixel density", "Pixel scale mismatch"], "type": "C", "zh": {"name": "混合像素（mixels，像素大小不一致）", "observe": "同一畫面中出現不同大小的「像素」：例如角色是 1× 美術、Boss 被放大 2 倍畫、某個物件被旋轉或縮放 1.5 倍、UI 字體用另一種解析度。結果有的方塊大、有的小、有的斜，畫面看起來不統一，像拼貼。", "notThis": "不是整數倍放大本身（PIX-01，整個畫面一致放大就沒問題）；問題在於個別物件以不同倍率或非整數倍縮放。也不是刻意的混合風格（HD-2D 這種有意設計）。", "use": "檢查清單：決定所有精靈、特效、UI 是否共用同一像素密度，令角色大小一致可比。", "prompt": "檢查遊戲的像素密度一致性：所有精靈、tile、特效、UI 字體都以同一 1× 美術像素繪製在 320×180 畫布上；Boss 需要更大時重畫成更大的精靈，不要用 scale 放大；擊中時的縮放回饋（squash）以整數像素變形或預畫影格完成；禁止非 90° 倍數的即時旋轉（改用 PIX-05 預生成）。"}, "en": {"name": "Mixels (mixed pixel sizes)", "observe": "Different \"pixel\" sizes appear in the same frame: the hero is 1× art, a boss is drawn scaled 2×, a prop is rotated or scaled 1.5×, the UI font uses another resolution. Some squares are big, some small, some tilted, and the image looks inconsistent, like a collage.", "notThis": "Not integer scaling itself (PIX-01 — scaling the whole frame uniformly is fine); the problem is individual objects scaled by different or non-integer factors. Also not a deliberate mixed style (like HD-2D, which is designed on purpose).", "use": "A checklist item: decide that all sprites, VFX and UI share one pixel density so character sizes stay consistent and comparable.", "prompt": "Audit the game for pixel-density consistency: all sprites, tiles, VFX and UI fonts are drawn at the same 1× art pixel on the 320×180 canvas; when a boss needs to be bigger, draw a bigger sprite rather than scaling it; squash-and-stretch on hit is done with whole-pixel deformation or pre-drawn frames; no real-time rotation except multiples of 90° (use PIX-05 pre-baked angles instead)."}, "ja": {"name": "ミクセル（ドットの大きさの混在）", "observe": "同じ画面に違う大きさの「ドット」が出る状態。主人公は等倍、ボスは 2 倍に拡大、小物は 1.5 倍や回転、UI フォントは別解像度など。大きい四角、小さい四角、斜めの四角が混ざり、コラージュのように統一感がなくなる。", "notThis": "整数倍スケーリング自体（PIX-01、画面全体を一律に拡大するなら問題ない）とは違い、個別の物体を違う倍率や非整数倍で拡縮するのが問題。意図的な混在スタイル（HD-2D のような設計）とも違う。", "use": "チェック項目として、全スプライト・エフェクト・UI が同じドット密度を共有し、キャラの大きさを比較可能に保つ。", "prompt": "ゲームのドット密度の一貫性を点検して。スプライト・タイル・エフェクト・UI フォントはすべて 320×180 キャンバス上で同じ等倍ドットで描く。ボスを大きくしたい時は拡大せず大きなスプライトを描く。被弾時の潰れ（squash）は整数ピクセルの変形か描き起こしコマで行う。90° 単位以外のリアルタイム回転は禁止（PIX-05 の事前生成を使う）。"}, "params": "one art-pixel size per project · allowed exceptions (screen-space UI at native res, deliberate HD effects) · squash done by frames not scale", "impl": "Enforce in the sprite batch: assert scale ∈ {1, −1} (flip only) for world sprites in debug builds; draw everything to the base-res RT so any accidental scale still lands on the same pixel grid. Particles: integer sizes (1×1, 2×2 px) at rounded positions.", "related": ["PIX-01", "PIX-05", "FB-13", "PIX-24"], "refs": [{"t": "Lospec — Mixels tutorials (tag)", "u": "https://lospec.com/pixel-art-tutorials/tags/mixels"}, {"t": "Wikipedia — Pixel art", "u": "https://en.wikipedia.org/wiki/Pixel_art"}], "nosrc": false}, {"id": "PIX-24", "cat": "PIX", "sub": "場景構成", "std": "Sprite pivot at the feet", "aliases": ["Foot anchor", "Bottom-centre origin", "Sprite origin / pivot point", "Baseline alignment"], "type": "C", "zh": {"name": "精靈錨點在腳底（底部中央對齊）", "observe": "每張精靈圖的錨點（pivot／origin）設在「腳底中央」那一個像素：無論角色高矮胖瘦、動作影格大小不一（例如揮劍那格比待機寬），畫在同一座標時腳都踩在同一條地線上、身體中線對齊同一列像素，不會一換動作就跳一格或浮起來。", "notThis": "不是 Y-sort（PIX-16，決定繪製先後，但正需要這個錨點作排序依據）；也不是精靈翻轉（PIX-25）。常見錯誤是以圖片左上角或圖片中心為錨點，或每格影格的留白不同。", "use": "角色大小、水平置中、腳底基準線、動作切換穩定；也令影子、碰撞框、選取圈對準。", "prompt": "把遊戲所有角色精靈的錨點統一為「腳底中央」：每個影格在 atlas 中記錄 pivot = (中線那一列, 最底一行腳底像素)；繪製時以實體地面座標減去 pivot 得到左上角位置，再取整。精靈寬度用奇數（例如 15 像素），中線正好一列；影格之間不可因留白不同而左右或上下跳動。影子與碰撞框都以同一 pivot 為中心。"}, "en": {"name": "Sprite pivot at the feet (bottom-centre anchor)", "observe": "Every sprite frame's pivot/origin is the one pixel at the centre of the feet: however tall or wide the character and however much the frames differ in size (a sword-swing frame is wider than idle), drawing at the same coordinate keeps the feet on one ground line and the body centre on one pixel column — no hop or float when the animation changes.", "notThis": "Not Y-sorting (PIX-16, which decides draw order — but needs this anchor as its sort key) nor sprite flipping (PIX-25). Typical bugs are anchoring at the image's top-left or image centre, or frames with different padding.", "use": "Character size, horizontal centring, foot baseline and stable animation changes; also lines up shadows, hitboxes and selection rings.", "prompt": "Standardise every character sprite in the game on a bottom-centre pivot: each atlas frame stores pivot = (centre column, bottom row of the feet); when drawing, subtract the pivot from the entity's ground position to get the top-left and round it. Use odd sprite widths (e.g. 15 px) so the centre is exactly one column; frames must never shift left/right or up/down because of different padding. Shadows and hitboxes are centred on the same pivot."}, "ja": {"name": "足元ピボット（スプライト原点を下端中央に）", "observe": "各スプライトのピボット（原点）を「足元の中央」のドットにする。キャラの背丈や横幅、コマごとの大きさ（剣を振るコマは待機より広い）が違っても、同じ座標に描けば足は同じ地面の線に乗り、体の中心線も同じ列に揃う。アニメが切り替わっても跳ねたり浮いたりしない。", "notThis": "Y ソート（PIX-16、描画順を決めるが、このアンカーをソートキーに使う）やスプライト反転（PIX-25）とは違う。よくあるバグは画像の左上や画像中心を原点にすること、コマごとに余白が違うこと。", "use": "キャラの大きさ、水平中央、足元の基準線、アニメ切り替えの安定。影・当たり判定・選択リングの位置合わせにも。", "prompt": "ゲームの全キャラスプライトのピボットを「足元中央」に統一して。アトラスの各コマに pivot =（中心列, 足の最下行）を記録し、描画時はエンティティの地面座標から pivot を引いて左上位置を求め、丸める。スプライト幅は奇数（例：15 ドット）にして中心をちょうど 1 列に。余白の違いでコマ間が上下左右にずれないこと。影と当たり判定も同じ pivot を中心に。"}, "params": "pivot per frame (x = centre column, y = foot row) · odd vs even sprite width · padding trimmed per frame · debug overlay (baseline + centre column)", "impl": "Atlas metadata per frame: {u,v,w,h,pivotX,pivotY}. Vertex positions: topLeft = round(groundPos) − (pivotX, pivotY) in base-res pixels. Add a debug draw that plots a 1-px red baseline and a cyan centre column per entity so misaligned frames are obvious.", "related": ["PIX-16", "PIX-25", "PIX-18", "PIX-13"], "refs": [{"t": "Godot docs — Sprite2D (offset, centered, flip_h)", "u": "https://docs.godotengine.org/en/stable/classes/class_sprite2d.html"}, {"t": "Slynyrd — Pixelblog 22: Top-down character sprites", "u": "https://www.slynyrd.com/blog/2019/10/21/pixelblog-22-top-down-character-sprites"}, {"t": "Wikipedia — Sprite (computer graphics)", "u": "https://en.wikipedia.org/wiki/Sprite_(computer_graphics)"}], "nosrc": false}, {"id": "PIX-25", "cat": "PIX", "sub": "動畫", "std": "Sprite flipping for facing", "aliases": ["Horizontal flip", "Mirrored facing", "flip_h", "Left/right facing"], "type": "C", "zh": {"name": "左右翻轉表示朝向", "observe": "角色只畫向右的動畫，向左時把精靈水平鏡像翻轉。翻轉要以錨點那一列像素為軸，否則每次轉身角色會左右跳 1 像素；另外要留意翻轉後武器換手、光源方向、文字或徽章變反的問題。", "notThis": "不是畫兩套方向（需要時才做）；也不是 4／8 方向精靈（上下方向另畫，左右可共用翻轉）。轉身跳一格通常是因為以圖片寬度中心（偶數寬時落在兩列之間）翻轉。", "use": "俯視角與橫向遊戲省一半美術量；轉身要即時、角色站位不變。", "prompt": "為遊戲的角色朝向使用水平翻轉：只保存向右的影格，向左時以錨點中線那一列為軸鏡像（精靈寬度為奇數）；轉身時腳底位置與中線像素完全不變。上、下方向另有影格。若角色持盾或有不對稱標誌，翻轉時另換一張影格修正手持物。"}, "en": {"name": "Sprite flipping for facing", "observe": "The character is only drawn facing right; facing left mirrors the sprite horizontally. The flip must pivot on the anchor pixel column, otherwise the character hops 1 px every time it turns; also watch for weapons switching hands, the light direction flipping and text or emblems becoming mirrored.", "notThis": "Not drawing two full sets of directions (only when needed) and not 4/8-direction sprites (up/down are drawn separately; left/right can share a flip). Turn-around hops usually come from flipping around the image-width centre, which for even widths falls between two columns.", "use": "Halves the art for top-down and side-view games; turning should be instant with the character's footing unchanged.", "prompt": "Use horizontal flipping for facing in the game: store only right-facing frames; for left, mirror around the pivot's centre column (sprites have odd widths) so the foot position and centre pixel never move when turning. Up and down have their own frames. If a character carries a shield or has an asymmetric emblem, swap in a corrected frame for the held item when flipped."}, "ja": {"name": "左右反転で向きを表す", "observe": "キャラは右向きのアニメだけを描き、左向きはスプライトを水平に反転する。反転はピボットの列を軸にしないと、振り向くたびに 1 ドット左右に跳ぶ。反転で武器の持ち手、光源の向き、文字や紋章が逆になる点にも注意。", "notThis": "両方向を全部描くこと（必要な時だけ）や 4／8 方向スプライト（上下は別に描き、左右は反転を共用できる）とは違う。振り向きのズレは、画像幅の中心（偶数幅だと 2 列の間）で反転していることが原因の場合が多い。", "use": "見下ろし型・横型ゲームで素材を半分にする。振り向きは即座に、立ち位置は変えない。", "prompt": "ゲームのキャラの向きに水平反転を使って。保存するのは右向きのコマだけ。左向きはピボットの中心列を軸に反転（スプライト幅は奇数）し、振り向いても足元と中心のドットが一切動かないこと。上下向きは別のコマ。盾を持つなど左右非対称なキャラは、反転時に持ち物を直したコマに差し替える。"}, "params": "flip axis (pivot column) · odd sprite width · per-frame asymmetry fixes · turn delay (instant vs 1 turn frame)", "impl": "Flip in the vertex stage, not by negative scale around the quad centre: x_left = groundX − (w − 1 − pivotX) when flipped, and swap u0/u1. This keeps the pivot column fixed for any width. Hitboxes/attack boxes mirror around the same pivot.", "related": ["PIX-24", "PIX-13", "PIX-16"], "refs": [{"t": "Godot docs — Sprite2D (offset, centered, flip_h)", "u": "https://docs.godotengine.org/en/stable/classes/class_sprite2d.html"}, {"t": "Slynyrd — Pixelblog 22: Top-down character sprites", "u": "https://www.slynyrd.com/blog/2019/10/21/pixelblog-22-top-down-character-sprites"}], "nosrc": false}, {"id": "PIX-26", "cat": "PIX", "sub": "顯示與縮放", "std": "Texture bleeding and atlas padding", "aliases": ["Tile seams", "Atlas bleeding", "Edge extrusion", "Half-texel seams"], "type": "C", "zh": {"name": "貼圖滲色與 atlas 留邊（tile 接縫）", "observe": "tile 地圖或精靈在鏡頭移動、縮放時，tile 之間偶然出現一條條細線：那是取樣時讀到 atlas 中相鄰圖塊的顏色（例如洋紅色或另一塊地形）。解決方法是 atlas 中每塊圖四周複製邊緣像素 1–2 像素（extrusion），並使用最近鄰取樣、整數像素位置。", "notThis": "不是 tile 美術本身沒有接好（那是畫的問題，靜止時也看得見）；也不是自動拼接選錯 tile（PIX-17）。滲色只在特定鏡頭位置、縮放或雙線性過濾下閃現。", "use": "任何使用 atlas 的 tile 地圖與精靈；在大量使用 tile 的俯視角遊戲特別常見。", "prompt": "修正遊戲地圖的 tile 接縫：atlas 打包時每塊 16×16 tile 四邊外擴 1 像素（複製邊緣像素），UV 指向內部 16×16；取樣器用 point、CLAMP；tile 頂點位置對齊整數 base-res 像素並以 320×180 render target 繪製後再整數放大。鏡頭任何位置都不可出現線條。"}, "en": {"name": "Texture bleeding and atlas padding (tile seams)", "observe": "As the camera moves or zooms, thin lines flicker between tiles of a tile map or between sprite parts: sampling is reading the neighbouring image in the atlas (a magenta key colour or another terrain). The fix is to extrude each atlas cell's edge pixels by 1–2 px and use nearest sampling at whole-pixel positions.", "notThis": "Not tiles that do not join in the art itself (an art problem, visible even when still) and not autotiling picking the wrong tile (PIX-17). Bleeding only flashes at certain camera positions, zooms or under bilinear filtering.", "use": "Any atlas-based tile map or sprite set; especially common in tile-heavy top-down tile-heavy top-down games.", "prompt": "Fix tile seams in the game's map: when packing the atlas, extrude every 16×16 tile by 1 px on each side (duplicate edge pixels) with UVs pointing at the inner 16×16; use point samplers with CLAMP; align tile vertices to whole base-res pixels, draw into the 320×180 render target and integer-upscale. No lines may appear at any camera position."}, "ja": {"name": "テクスチャのにじみとアトラスの余白（タイルの継ぎ目）", "observe": "カメラの移動やズームでタイルの間に細い線がちらつく。サンプリングがアトラス内の隣の画像（マゼンタのキー色や別の地形）を読んでいるため。対策はアトラスの各セルの縁ドットを 1〜2 ドット外側に複製（押し出し）し、最近傍サンプリングと整数ピクセル位置を使うこと。", "notThis": "タイルの絵自体がつながっていない（絵の問題で、静止していても見える）ことや、オートタイルの選択ミス（PIX-17）とは違う。にじみは特定のカメラ位置・ズーム・バイリニア時にだけ現れる。", "use": "アトラスを使うタイルマップやスプライト全般。タイルの多い見下ろし型で特に多い。", "prompt": "ゲームのマップのタイル継ぎ目を直して。アトラス作成時に 16×16 タイルの四辺を 1 ドットずつ押し出し（縁を複製）、UV は内側の 16×16 を指す。サンプラーは point・CLAMP。タイル頂点は base 解像度の整数ピクセルに揃え、320×180 のレンダーターゲットに描いてから整数倍拡大。どのカメラ位置でも線が出ないこと。"}, "params": "extrusion width (1–2 px) · sampler filter (point) · vertex snapping · mip-maps off · texel-centre conventions (D3D9 half-texel vs D3D10+)", "impl": "Atlas packer: copy border texels outward (extrude). Sampler: point/nearest filtering, mip-maps off. Do not add a −0.5 texel UV offset on modern APIs (that was a legacy D3D9 rule). If the camera ever zooms by a non-integer factor, render tiles to the base-res RT first so the seam problem cannot reappear in the upscale.", "related": ["PIX-01", "PIX-17", "PIX-02"], "refs": [{"t": "Wikipedia — Texture atlas", "u": "https://en.wikipedia.org/wiki/Texture_atlas"}, {"t": "Microsoft Learn — D3D11_SAMPLER_DESC (point vs linear filtering)", "u": "https://learn.microsoft.com/en-us/windows/win32/api/d3d11/ns-d3d11-d3d11_sampler_desc"}, {"t": "Microsoft Learn — Directly mapping texels to pixels (D3D9 half-texel note; D3D10+ differs)", "u": "https://learn.microsoft.com/en-us/windows/win32/direct3d9/directly-mapping-texels-to-pixels"}, {"t": "Unity — 2D Pixel Perfect package manual", "u": "https://docs.unity3d.com/Packages/com.unity.2d.pixel-perfect@5.0/manual/index.html"}], "nosrc": false}, {"id": "TRN-01", "cat": "TRN", "sub": "淡化與溶接", "std": "Fade to black", "aliases": ["Fade out / fade in", "Dip to black"], "type": "S", "zh": {"name": "淡出至黑", "observe": "畫面逐漸變暗直到全黑，停一下，再從黑逐漸亮出新畫面。", "notThis": "不是交叉溶接（TRN-03，兩個畫面直接重疊混合，中間沒有黑）；也不是淡出至白（TRN-02）。", "use": "場景切換、時間流逝（睡覺到第二天）、讀取遮蔽；最通用、最安全的轉場。", "prompt": "在遊戲中，進入或離開房屋時使用淡出至黑：0.35 秒 ease-in 淡到全黑，保持 0.1 秒（期間切換場景），再 0.35 秒 ease-out 淡入；淡出期間玩家輸入鎖定。"}, "en": {"name": "Fade to black", "observe": "The image darkens until fully black, holds briefly, then the new scene fades up from black.", "notThis": "Not a crossfade (TRN-03, two images blend directly with no black in between) nor a fade to white (TRN-02).", "use": "Scene changes, passage of time (sleeping until morning), hiding a load; the most universal, safest transition.", "prompt": "In your game, use a fade to black when entering or leaving a house: fade to full black over 0.35 s ease-in, hold 0.1 s (swap the scene then), then fade in over 0.35 s ease-out; lock player input during the fade."}, "ja": {"name": "フェードアウト（黒へのフェード）", "observe": "画面がだんだん暗くなって真っ黒になり、少し止まってから黒から新しい場面が明るくなる。", "notThis": "クロスフェード（TRN-03、黒を挟まず 2 枚が直接混ざる）や白へのフェード（TRN-02）とは違う。", "use": "場面転換、時間経過（寝て翌朝へ）、読み込みの隠蔽。最も汎用的で安全な転換。", "prompt": "ゲームで家に出入りする時は黒フェードを使って：0.35 秒 ease-in で真っ黒に、0.1 秒保持（ここでシーン切替）、0.35 秒 ease-out でフェードイン。フェード中はプレイヤー入力をロック。"}, "params": "fade out time · hold time · fade in time · curve · colour (black) · input lock", "impl": "Fullscreen quad with alpha = fade, blended SrcAlpha/InvSrcAlpha after the scene (and before UI if the UI should stay). Drive from a TransitionManager with out/hold/in states; the scene swap happens at the hold.", "related": ["TRN-02", "TRN-03", "TRN-17"], "refs": [{"t": "Wikipedia — Fade (filmmaking)", "u": "https://en.wikipedia.org/wiki/Fade_(filmmaking)"}], "nosrc": false}, {"id": "TRN-02", "cat": "TRN", "sub": "淡化與溶接", "std": "Fade to white", "aliases": ["Flash cut", "White-out", "Dip to white"], "type": "S", "zh": {"name": "淡出至白（閃白轉場）", "observe": "畫面迅速變成全白（像強光爆開），再從白色中淡出新畫面；快的版本就像一次閃光剪接。", "notThis": "不是淡出至黑（TRN-01，感覺是休息／結束）；白色帶來「衝擊、回憶、傳送、覺醒」的感覺。也不是命中閃白（FB-01，只作用在角色）。", "use": "傳送、回憶片段、神秘力量、爆炸後切場景。", "prompt": "在遊戲中，使用傳送石時用淡出至白：0.15 秒內快速白化（ease-out），全白保持 0.15 秒，然後 0.6 秒慢慢淡入新地點，白色帶一點暖黃（#fff6e0）。"}, "en": {"name": "Fade to white", "observe": "The image quickly turns fully white, like a burst of light, then the new scene fades out of the white; fast versions read as a flash cut.", "notThis": "Not a fade to black (TRN-01, which reads as rest/ending); white signals impact, memory, teleport or awakening. Not a hit flash (FB-01, which affects only a character).", "use": "Teleports, flashbacks, mystical power, cutting away after an explosion.", "prompt": "In your game, when using a waystone, fade to white: whiten quickly in 0.15 s (ease-out), hold full white 0.15 s, then fade into the new location over 0.6 s; tint the white slightly warm (#fff6e0)."}, "ja": {"name": "ホワイトアウト（白へのフェード）", "observe": "画面が素早く真っ白になり（強い光が弾けるように）、白の中から新しい場面が現れる。速いものはフラッシュカットのように見える。", "notThis": "黒へのフェード（TRN-01、休息・終わりの印象）とは違い、白は衝撃・回想・転移・覚醒を感じさせる。ヒットフラッシュ（FB-01、キャラだけ）とも違う。", "use": "テレポート、回想、神秘的な力、爆発後の場面転換。", "prompt": "ゲームで転移石を使う時はホワイトアウトにして：0.15 秒で素早く白へ（ease-out）、真っ白を 0.15 秒保持、0.6 秒かけて新しい場所へフェードイン。白は少し暖かい色（#fff6e0）。"}, "params": "attack time (fast) · hold · release (slow) · tint · additive vs alpha blend", "impl": "Same fullscreen quad as TRN-01 with white; an additive pre-pass (rgb += k) before alpha gives a more \"blown-out\" bloom-like ramp.", "related": ["TRN-01", "TRN-03", "ENV-06"], "refs": [{"t": "Wikipedia — Fade (filmmaking)", "u": "https://en.wikipedia.org/wiki/Fade_(filmmaking)"}], "nosrc": false}, {"id": "TRN-03", "cat": "TRN", "sub": "淡化與溶接", "std": "Crossfade", "aliases": ["Dissolve", "Cross-dissolve", "Mix"], "type": "S", "zh": {"name": "交叉溶接", "observe": "舊畫面逐漸變透明，同時新畫面逐漸出現，兩者有一段時間重疊混合。", "notThis": "不是淡出至黑（TRN-01，中間有黑）；也不是遊戲特效中的溶解燒盡（VFX-04，以噪聲邊緣消失）。電影術語中 dissolve 就是交叉溶接。", "use": "時間推移（白天到夜晚的同一地點）、柔和的場景切換、菜單與畫面切換。", "prompt": "在遊戲中，從白天城鎮切到夜晚城鎮（同一鏡頭）時用 1.2 秒的交叉溶接：同時渲染兩個場景到兩張 render target，再以線性 alpha 混合；中段保持兩者都看得到。"}, "en": {"name": "Crossfade", "observe": "The old image becomes transparent while the new image appears, the two overlapping and mixing for a while.", "notThis": "Not a fade to black (TRN-01, black in between) nor a game \"dissolve/burn\" effect (VFX-04, disappearing along a noisy edge). In film terms a dissolve is exactly this crossfade.", "use": "Passage of time (same place day → night), soft scene changes, menu-to-game swaps.", "prompt": "In your game, when cutting from day town to night town (same framing) use a 1.2 s crossfade: render both scenes to two render targets and blend linearly by alpha, keeping both visible through the middle."}, "ja": {"name": "クロスフェード（ディゾルブ）", "observe": "古い画面が徐々に透明になると同時に新しい画面が現れ、しばらく 2 枚が重なって混ざる。", "notThis": "黒へのフェード（TRN-01、間に黒が入る）や、ゲームの「溶けて消える」エフェクト（VFX-04、ノイズの縁で消える）とは違う。映画用語のディゾルブはこのクロスフェードのこと。", "use": "時間経過（同じ場所の昼→夜）、柔らかい場面転換、メニューとゲーム画面の切り替え。", "prompt": "ゲームで昼の町から夜の町（同じ構図）へ切り替える時に 1.2 秒のクロスフェードを使って：2 つのシーンを 2 枚のレンダーターゲットに描き、アルファで線形に混ぜる。中盤は両方が見えるように。"}, "params": "duration · curve · whether both scenes keep updating · colour space (linear vs sRGB mix)", "impl": "Two render targets A/B; fullscreen pixel shader out = lerp(A, B, k). Requires rendering both scenes (or freezing A as a snapshot texture captured at transition start).", "related": ["TRN-01", "TRN-09", "VFX-04", "ENV-01"], "refs": [{"t": "Wikipedia — Dissolve (filmmaking)", "u": "https://en.wikipedia.org/wiki/Dissolve_(filmmaking)"}], "nosrc": false}, {"id": "TRN-04", "cat": "TRN", "sub": "形狀遮罩", "std": "Shape wipe", "aliases": ["Iris wipe (shaped)", "Star wipe", "Cookie-cutter transition"], "type": "C", "zh": {"name": "形狀擦除", "observe": "新舊畫面之間的邊界是一個特定形狀（星形、心形、角色頭像、Logo），形狀從中心放大或縮小來換場。", "notThis": "不是圓形光圈（iris，已在你的圖鑑 starter 中）；形狀擦除用的是任意輪廓。也不是亮度遮罩（TRN-06，邊界由灰階圖決定）。", "use": "有個性、帶品牌感的轉場：關卡完成、角色登場、喜劇式結尾。", "prompt": "在遊戲中，關卡完成時用怪物頭形的形狀擦除：以主角位置為中心，怪物頭輪廓在 0.6 秒內從畫面外縮到 0，黑色覆蓋其外部；停 0.2 秒後再從 0 放大出新畫面。"}, "en": {"name": "Shape wipe", "observe": "The boundary between old and new scenes is a specific shape (star, heart, character head, logo) that grows or shrinks from a point to change scenes.", "notThis": "Not the circular iris (already in your 圖鑑 starter); a shape wipe uses an arbitrary outline. Not a luma wipe (TRN-06, whose edge comes from a greyscale map).", "use": "Characterful, branded transitions: level complete, character intros, comedic endings.", "prompt": "In your game, on level complete use a monster-head shape wipe centred on the hero: the outline shrinks from off-screen to zero over 0.6 s with black outside it; hold 0.2 s, then grow from zero into the new scene."}, "ja": {"name": "シェイプワイプ（形状ワイプ）", "observe": "新旧の画面の境界が特定の形（星、ハート、キャラの顔、ロゴ）で、その形が一点から拡大・縮小して場面が変わる。", "notThis": "円形のアイリス（あなたの図鑑スターターに既にある）とは違い、任意の輪郭を使う。ルマワイプ（TRN-06、境界がグレースケール画像で決まる）とも違う。", "use": "個性やブランド感のある転換：ステージクリア、キャラ登場、コミカルな締め。", "prompt": "ゲームでステージクリア時に、主人公を中心にモンスターの頭の形のシェイプワイプを：輪郭を 0.6 秒で画面外からゼロまで縮め、外側は黒。0.2 秒止めてからゼロから拡大して新しい場面へ。"}, "params": "shape (mask texture or SDF) · centre point · duration · curve · edge softness · rotation during wipe", "impl": "Render the shape as a mask: either a signed-distance-field texture sampled with scale (mask = sdf(uv/scale) < 0) or draw the shape into the stencil buffer and draw black where stencil == 0.", "related": ["TRN-05", "TRN-06", "TRN-07"], "refs": [{"t": "Wikipedia — Iris shot", "u": "https://en.wikipedia.org/wiki/Iris_shot"}, {"t": "Wikipedia — Wipe (transition)", "u": "https://en.wikipedia.org/wiki/Wipe_(transition)"}, {"t": "Kronnect Transitions Plus — transition types (docs)", "u": "https://kronnect.com/docs/transitions-plus/transition-types/"}], "nosrc": false}, {"id": "TRN-05", "cat": "TRN", "sub": "形狀遮罩", "std": "Clock wipe", "aliases": ["Radial wipe", "Angular wipe", "Pie wipe"], "type": "S", "zh": {"name": "時鐘擦除（放射擦除）", "observe": "以畫面中心為軸，一條半徑像時鐘指針般掃過一圈，掃過的扇形區域顯示新畫面。", "notThis": "不是光圈（以圓形縮放）；也不是一般直線擦除。時鐘擦除的邊界是旋轉的直線，有「時間經過」的意味。", "use": "時間流逝、倒數、冷卻圖示放大版、回合切換。", "prompt": "在遊戲中，「一天結束」時用時鐘擦除：從 12 點方向開始順時針掃 1 秒，掃過區域顯示夜晚城鎮，邊緣加 1px 金色線。"}, "en": {"name": "Clock wipe", "observe": "A radius sweeps around the screen centre like a clock hand; the swept pie area reveals the new image.", "notThis": "Not an iris (a scaling circle) nor a straight-line wipe. The edge is a rotating line, which reads as \"time passing\".", "use": "Passage of time, countdowns, a big version of a cooldown icon, turn changes.", "prompt": "In your game, at \"end of day\" use a clock wipe: start at 12 o’clock and sweep clockwise over 1 s, revealing the night town in the swept area, with a 1 px gold edge line."}, "ja": {"name": "クロックワイプ（放射状ワイプ）", "observe": "画面中央を軸に、半径が時計の針のように一周し、通過した扇形の部分に新しい画面が現れる。", "notThis": "アイリス（円の拡大縮小）や直線ワイプとは違い、境界が回転する直線で「時間の経過」を感じさせる。", "use": "時間経過、カウントダウン、クールダウンアイコンの拡大版、ターン切り替え。", "prompt": "ゲームで「一日の終わり」にクロックワイプを使って：12 時の方向から時計回りに 1 秒で一周、通過部分に夜の町を表示、境界に 1px の金色の線。"}, "params": "start angle · direction · duration · centre · edge line / softness", "impl": "Pixel shader: a = atan2(uv.x-c.x, c.y-uv.y) normalised to 0..1; out = (a < k) ? B : A. Soft edge with smoothstep over a small angle band.", "related": ["TRN-04", "TRN-06", "ENV-01"], "refs": [{"t": "Wikipedia — Wipe (transition)", "u": "https://en.wikipedia.org/wiki/Wipe_(transition)"}, {"t": "Kronnect Transitions Plus — transition types (docs)", "u": "https://kronnect.com/docs/transitions-plus/transition-types/"}], "nosrc": false}, {"id": "TRN-06", "cat": "TRN", "sub": "形狀遮罩", "std": "Luma wipe", "aliases": ["Gradient-mask wipe", "Luma fade", "Grayscale-map transition", "Rule transition"], "type": "S", "zh": {"name": "亮度遮罩擦除（灰階圖轉場）", "observe": "用一張灰階圖決定每個像素何時切換：門檻值從黑往白移動，灰階圖暗的地方先換成新畫面，所以邊界可以是任意圖案（漩渦、雲、筆刷）。", "notThis": "形狀擦除（TRN-04）是一個形狀縮放；亮度遮罩可以一張圖做出幾乎所有擦除樣式。日本視覺小說引擎稱這種圖為「ルール画像」。", "use": "一套 shader 搭配多張遮罩圖就能做出整個轉場庫；很適合引擎工具化。", "prompt": "在引擎中實作通用亮度遮罩轉場：輸入舊畫面、新畫面、灰階遮罩圖、進度 k 與邊緣寬度；每像素 mask < k 時顯示新畫面，邊緣 0.05 寬度內平滑混合。先在遊戲用一張漩渦遮罩做進入森林的轉場。"}, "en": {"name": "Luma wipe", "observe": "A greyscale map decides when each pixel switches: a threshold sweeps from black to white, so dark areas of the map switch to the new scene first and the boundary can take any pattern (swirl, clouds, brush).", "notThis": "A shape wipe (TRN-04) scales one shape; a luma wipe can make almost any wipe style from an image. Japanese visual-novel engines call these maps \"rule images\".", "use": "One shader plus a set of mask images gives you a whole transition library — ideal for engine tooling.", "prompt": "Implement a generic luma-wipe transition in your engine: inputs are old frame, new frame, greyscale mask, progress k and edge width; show the new frame where mask < k, blending smoothly within a 0.05 edge band. First use it in the game with a swirl mask for entering the forest."}, "ja": {"name": "ルマワイプ（ルール画像トランジション）", "observe": "グレースケール画像で各ピクセルの切り替え時刻を決める。しきい値が黒から白へ動き、暗い部分から先に新しい画面になるので、境界は渦・雲・筆跡など自由な模様にできる。", "notThis": "シェイプワイプ（TRN-04）は形を拡大縮小するだけだが、ルマワイプは画像 1 枚でほぼあらゆるワイプが作れる。日本のノベルゲームエンジンではこの画像を「ルール画像」と呼ぶ。", "use": "シェーダー 1 本とマスク画像の組み合わせで転換ライブラリ全体が作れる。エンジンのツール化に最適。", "prompt": "エンジンに汎用ルマワイプを実装して：入力は旧画面・新画面・グレースケールマスク・進行度 k・境界幅。mask < k のピクセルは新画面、0.05 の境界幅内はなめらかに混ぜる。まず ゲームの森へ入る転換に渦巻きマスクで使って。"}, "params": "mask texture · progress k · edge softness · invert · edge glow colour", "impl": "out = lerp(A, B, smoothstep(k - e, k + e, k*(1+2e) - e > mask ? 1 : ...)) — in practice: w = saturate((k*(1+e) - mask)/e); out = lerp(A,B,w). Sample the mask with linear filtering; keep k remapped so 0 and 1 are fully A/B.", "related": ["TRN-04", "TRN-05", "TRN-09", "VFX-04"], "refs": [{"t": "Kronnect Transitions Plus — transition types (docs)", "u": "https://kronnect.com/docs/transitions-plus/transition-types/"}, {"t": "Wikipedia — Wipe (transition)", "u": "https://en.wikipedia.org/wiki/Wipe_(transition)"}], "nosrc": false}, {"id": "TRN-07", "cat": "TRN", "sub": "形狀遮罩", "std": "Blinds transition", "aliases": ["Venetian blinds", "Shutter", "Curtain wipe", "Barn door"], "type": "C", "zh": {"name": "百葉窗／捲簾轉場", "observe": "畫面被切成多條橫向或縱向的長條，每條像百葉窗葉片一樣收窄或展開；捲簾版是一整塊從上往下拉，對開門版是左右兩扇合上。", "notThis": "不是像素化（TRN-10，方塊大小變化）；也不是推移（TRN-08，整個畫面滑動）。百葉窗的特徵是「重複的條紋」。", "use": "復古／簡報風格的轉場；捲簾與對開門適合商店、舞台、章節開幕。", "prompt": "在遊戲中，打開商店介面時使用 12 條橫向百葉窗轉場：每條由 0 高度展開到全高，從上到下每條延遲 0.02 秒，總長 0.4 秒。"}, "en": {"name": "Blinds transition", "observe": "The screen is cut into horizontal or vertical strips that narrow or open like venetian-blind slats; a shutter pulls one panel down, a barn door closes two panels from the sides.", "notThis": "Not pixelate (TRN-10, changing block size) nor push (TRN-08, the whole image slides). Blinds are defined by repeated stripes.", "use": "Retro or presentation-style transitions; shutters and barn doors suit shops, stages and chapter openings.", "prompt": "In your game, when opening the shop UI use a 12-strip horizontal blinds transition: each strip opens from zero to full height, each delayed 0.02 s from top to bottom, 0.4 s total."}, "ja": {"name": "ブラインド／シャッター転換", "observe": "画面が横または縦の帯に分かれ、ブラインドの羽のように細くなったり開いたりする。シャッター版は一枚が上から下りてきて、観音開き版は左右から 2 枚が閉じる。", "notThis": "モザイク（TRN-10、ブロックの大きさが変わる）やプッシュ（TRN-08、画面全体が滑る）とは違い、繰り返しの縞が特徴。", "use": "レトロやプレゼン風の転換。シャッターや観音開きはお店・舞台・章の開幕に合う。", "prompt": "ゲームでショップ画面を開く時に横 12 本のブラインド転換を：各帯が高さ 0 から全高まで開き、上から順に 0.02 秒ずつ遅らせ、合計 0.4 秒。"}, "params": "strip count · orientation · per-strip stagger · duration · panel style (blinds / shutter / barn door)", "impl": "Pixel shader: s = frac(uv.y * N); per-strip delay d = floor(uv.y*N)/N * stagger; local k = saturate((k - d)/(1 - stagger)); out = s < local ? B : A.", "related": ["TRN-04", "TRN-08", "TRN-10"], "refs": [{"t": "Kronnect Transitions Plus — transition types (docs)", "u": "https://kronnect.com/docs/transitions-plus/transition-types/"}, {"t": "Wikipedia — Wipe (transition)", "u": "https://en.wikipedia.org/wiki/Wipe_(transition)"}], "nosrc": false}, {"id": "TRN-08", "cat": "TRN", "sub": "剪接與空間", "std": "Push transition", "aliases": ["Slide", "Push", "Slide-in"], "type": "S", "zh": {"name": "推移／滑入", "observe": "新畫面從一側滑進來，同時把舊畫面推出另一側（推移）；或新畫面滑入蓋住舊畫面（滑入）。", "notThis": "不是捲動房間轉場（TRN-16，鏡頭在同一世界中移動）；推移只是兩張畫面的平面滑動。也不是擦除（邊界移動但畫面不動）。", "use": "選單分頁、地圖切換、介面頁面之間；方向可以暗示前後關係。", "prompt": "在遊戲中，背包、技能、地圖三個介面頁之間使用推移：0.25 秒 ease-in-out，按右切換時新頁從右滑入、舊頁往左推出；按左則相反。"}, "en": {"name": "Push transition", "observe": "The new image slides in from one side while pushing the old image out the other (push), or slides in over the old image (slide).", "notThis": "Not a room-scroll transition (TRN-16, the camera moving through one world); a push is two flat images sliding. Not a wipe (the edge moves but images stay still).", "use": "Menu tabs, map switches, UI pages; the direction can imply forward/back.", "prompt": "In your game, use a push between the bag, skills and map UI pages: 0.25 s ease-in-out; pressing right slides the new page in from the right and pushes the old one left, and vice versa."}, "ja": {"name": "プッシュ／スライド転換", "observe": "新しい画面が片側から滑り込み、古い画面を反対側へ押し出す（プッシュ）、または古い画面の上に滑り込む（スライド）。", "notThis": "部屋スクロール転換（TRN-16、同じ世界の中でカメラが動く）とは違い、2 枚の平面が滑るだけ。ワイプ（境界は動くが画面は動かない）とも違う。", "use": "メニューのタブ、マップ切替、UI のページ間。方向で前後関係を示せる。", "prompt": "ゲームのバッグ・スキル・マップの UI ページ間にプッシュ転換を：0.25 秒 ease-in-out、右を押すと新ページが右から入り旧ページは左へ、左はその逆。"}, "params": "direction · duration · easing · push vs overlap slide · parallax between layers", "impl": "Draw snapshot A at offset -k*W and B at (1-k)*W (two textured quads). For pixel-perfect output round the offset to integer pixels.", "related": ["TRN-16", "TRN-07", "TRN-14"], "refs": [{"t": "Wikipedia — Wipe (transition)", "u": "https://en.wikipedia.org/wiki/Wipe_(transition)"}, {"t": "Kronnect Transitions Plus — transition types (docs)", "u": "https://kronnect.com/docs/transitions-plus/transition-types/"}], "nosrc": false}, {"id": "TRN-09", "cat": "TRN", "sub": "像素與風格化", "std": "Dither transition", "aliases": ["Dissolve dither", "Bayer dither fade", "Pixel dissolve"], "type": "C", "zh": {"name": "抖色轉場（點陣溶接）", "observe": "舊畫面不是平滑變透明，而是按照一個點陣圖案（Bayer 矩陣或隨機點）逐點被新畫面取代，中途看起來是網點交錯。", "notThis": "不是平滑的交叉溶接（TRN-03，有半透明）；抖色轉場每個像素只會是 A 或 B，沒有中間色，很適合限色像素畫面。", "use": "保持像素藝術的硬邊與調色盤一致；復古主機風格。", "prompt": "在遊戲中，把場景切換改為 4×4 Bayer 抖色轉場：0.5 秒內門檻值從 0 到 1，像素 (x,y) 在 bayer[x%4][y%4]/16 < k 時顯示新畫面；以遊戲原生解析度（像素格）計算，不是螢幕解析度。"}, "en": {"name": "Dither transition", "observe": "Instead of a smooth fade, the old image is replaced point by point following a dot pattern (a Bayer matrix or random noise), so the midpoint looks like an interleaved screen of dots.", "notThis": "Not a smooth crossfade (TRN-03, which has translucency); in a dither transition each pixel is either A or B, never in-between, which suits limited-palette pixel art.", "use": "Keeps pixel art hard-edged and on-palette; retro-console flavour.", "prompt": "In your game, switch scene transitions to a 4×4 Bayer dither: over 0.5 s the threshold k goes 0→1 and pixel (x,y) shows the new scene when bayer[x%4][y%4]/16 < k; compute it at the game’s native pixel resolution, not screen resolution."}, "ja": {"name": "ディザ転換（ドットディゾルブ）", "observe": "滑らかに透けるのではなく、ドットのパターン（Bayer 行列やランダムノイズ）に従って 1 点ずつ新しい画面に置き換わり、途中は網点が交互に並んで見える。", "notThis": "滑らかなクロスフェード（TRN-03、半透明がある）とは違い、各ピクセルは A か B のどちらかで中間色がない。減色されたドット絵に合う。", "use": "ドット絵の硬いエッジとパレットを保つ。レトロゲーム機風。", "prompt": "ゲームの場面転換を 4×4 Bayer ディザに：0.5 秒でしきい値 k を 0→1、ピクセル (x,y) は bayer[x%4][y%4]/16 < k の時に新画面。画面解像度ではなくゲームの元解像度（ドット単位）で計算。"}, "params": "matrix (2×2 / 4×4 / 8×8 / blue noise) · cell size in game pixels · duration · direction bias (add gradient)", "impl": "Pixel shader: compute integer game-pixel coords p = floor(uv * nativeRes); t = bayer4[p.x&3][p.y&3]/16; out = t < k ? B : A. Optionally add a gradient (uv.x) to the threshold for a dithered wipe.", "related": ["TRN-03", "TRN-10", "PIX-08"], "refs": [{"t": "Wikipedia — Ordered dithering", "u": "https://en.wikipedia.org/wiki/Ordered_dithering"}, {"t": "Wikipedia — Dither", "u": "https://en.wikipedia.org/wiki/Dither"}, {"t": "Lucas Pope — Obra Dinn devlog (dithering, TIGSource post)", "u": "https://dukope.com/devlogs/obra-dinn/tig-32/"}], "nosrc": false}, {"id": "TRN-10", "cat": "TRN", "sub": "像素與風格化", "std": "Pixelate transition", "aliases": ["Mosaic transition", "Pixelation fade", "Blocky dissolve"], "type": "C", "zh": {"name": "像素化轉場（馬賽克）", "observe": "畫面方塊越來越大直到變成幾塊大色塊，在最大時切換畫面，然後方塊變小回復清晰。", "notThis": "不是抖色（TRN-09，點陣替換）；也不是放大濾鏡。像素化轉場是「解析度」在變。", "use": "經典主機風格的場景切換、傳送、進入畫中世界。", "prompt": "在遊戲中做像素化轉場：0.4 秒內像素塊尺寸從 1 → 2 → 4 → 8 → 16 遊戲像素（整數步進），最大時切換到新場景，再 0.4 秒逆向回到 1；同時亮度降低 20%。"}, "en": {"name": "Pixelate transition", "observe": "Pixel blocks grow until the image is a few big colour patches; the scene swaps at the peak, then blocks shrink back to sharp.", "notThis": "Not a dither (TRN-09, dot-pattern replacement) nor an upscaling filter. In a pixelate transition the resolution itself changes.", "use": "Classic console-style scene changes, teleports, entering a painting.", "prompt": "In your game, build a pixelate transition: over 0.4 s step the block size 1→2→4→8→16 game pixels (integer steps), swap to the new scene at the peak, then reverse back to 1 over 0.4 s while dimming brightness by 20%."}, "ja": {"name": "モザイク転換（ピクセレート）", "observe": "ブロックがどんどん大きくなって数個の大きな色の塊になり、最大の時に場面が切り替わり、その後ブロックが小さくなって鮮明に戻る。", "notThis": "ディザ（TRN-09、網点で置換）やアップスケールフィルタとは違い、解像度そのものが変化する。", "use": "往年のゲーム機風の場面転換、テレポート、絵の中の世界へ入る演出。", "prompt": "ゲームでモザイク転換を作って：0.4 秒でブロックを 1→2→4→8→16 ゲームピクセル（整数ステップ）、最大時に新しいシーンへ切替、0.4 秒で逆に 1 へ戻す。同時に明るさを 20% 下げる。"}, "params": "max block size · step mode (integer / continuous) · duration · brightness dip · swap point", "impl": "Pixel shader: uvq = (floor(uv*res/b)+0.5)*b/res, sample with point filter. Integer power-of-two steps look most \"console\"; use the snapshot of A for the first half and live B for the second.", "related": ["TRN-09", "TRN-01", "PIX-04"], "refs": [{"t": "Kronnect Transitions Plus — transition types (docs)", "u": "https://kronnect.com/docs/transitions-plus/transition-types/"}, {"t": "Wikipedia — Pixel art", "u": "https://en.wikipedia.org/wiki/Pixel_art"}], "nosrc": false}, {"id": "TRN-11", "cat": "TRN", "sub": "像素與風格化", "std": "Battle transition", "aliases": ["Encounter transition", "Battle swirl", "Encounter wipe"], "type": "C", "zh": {"name": "戰鬥轉場（遭遇漩渦）", "observe": "遇到敵人時，地圖畫面先閃幾下，然後以漩渦、碎片、螺旋條紋或黑色圖案快速吞沒，接着進入戰鬥畫面。", "notThis": "不是一般場景轉場；戰鬥轉場是 RPG 專屬的「進入另一種玩法」信號，通常比一般轉場更快、更激烈，常配合亮度遮罩（TRN-06）實作。", "use": "回合制或另開戰鬥畫面的遊戲：遭遇、Boss 戰開始。", "prompt": "在遊戲中，若做「遭遇後進入戰鬥場景」，加入戰鬥轉場：先全畫面反白閃 2 次（各 0.06 秒），再以螺旋亮度遮罩在 0.7 秒內轉成黑色，最後從黑中淡入戰鬥場景。"}, "en": {"name": "Battle transition", "observe": "On an encounter the map flashes a few times, then is quickly swallowed by a swirl, shards, spiral stripes or a black pattern before the battle screen appears.", "notThis": "Not a general scene transition; it is the RPG-specific signal of \"entering a different mode of play\", usually faster and more aggressive, often built with a luma wipe (TRN-06).", "use": "Turn-based or separate-battle-screen games: encounters, boss fights.", "prompt": "If your game gets an \"encounter → battle scene\" flow, add a battle transition: invert-flash the screen twice (0.06 s each), then spin into black with a spiral luma mask over 0.7 s, then fade into the battle scene."}, "ja": {"name": "戦闘突入演出（エンカウント演出）", "observe": "敵と遭遇した時、フィールド画面が数回点滅し、渦・破片・らせん状の縞・黒い模様に素早く飲み込まれて戦闘画面へ移る。", "notThis": "一般的な場面転換ではなく、RPG 特有の「別の遊びに入る」合図。普通の転換より速く激しく、ルマワイプ（TRN-06）で作ることが多い。", "use": "ターン制や別画面で戦闘するゲーム：エンカウント、ボス戦開始。", "prompt": "ゲームに「遭遇→戦闘シーン」の流れを作るなら、戦闘突入演出を：画面を 2 回反転フラッシュ（各 0.06 秒）、らせんのルママスクで 0.7 秒かけて黒へ、黒から戦闘シーンへフェードイン。"}, "params": "pre-flash count · pattern mask (swirl/spiral/shards) · rotation speed · duration · audio sting sync", "impl": "Use the TRN-06 luma-wipe shader with a spiral mask (mask = frac(atan2/τ + r*twist)) or a polar-coordinate distortion of A before the cut. Flashes: invert pass (1 - rgb) for N frames.", "related": ["TRN-06", "TRN-12", "TRN-02"], "refs": [{"t": "Dan Game Dev — Shaders Case Study: Pokémon Battle Transitions (YouTube)", "u": "https://www.youtube.com/watch?v=LnAoD7hgDxw"}, {"t": "Kronnect Transitions Plus — transition types (docs)", "u": "https://kronnect.com/docs/transitions-plus/transition-types/"}], "nosrc": false}, {"id": "TRN-12", "cat": "TRN", "sub": "像素與風格化", "std": "Shatter transition", "aliases": ["Glass-break transition", "Screen shatter", "Broken-glass wipe"], "type": "C", "zh": {"name": "碎玻璃轉場", "observe": "舊畫面像玻璃一樣碎成多塊不規則碎片，碎片旋轉、掉落或飛散，露出後面的新畫面。", "notThis": "不是物件碎裂特效（VFX-19，世界中的物件碎掉）；碎玻璃轉場碎的是「整個畫面截圖」。也不是像素化（TRN-10）。", "use": "Boss 戰開始、劇情衝擊、「現實破碎」、進入戰鬥。", "prompt": "在遊戲的 Boss 出場時使用碎玻璃轉場：把當前畫面截成約 20 塊 Voronoi 碎片，命中點附近的碎片先動；每塊碎片帶隨機初速、旋轉與重力，0.9 秒內掉出畫面，露出 Boss 場景。"}, "en": {"name": "Shatter transition", "observe": "The old image breaks like glass into irregular shards that spin, fall or fly away, revealing the new image behind.", "notThis": "Not an object fracture effect (VFX-19, breaking something in the world); here the whole screen snapshot breaks. Not pixelate (TRN-10).", "use": "Boss-fight starts, story shocks, \"reality breaking\", battle entry.", "prompt": "For the boss entrance in the game use a shatter transition: cut the current frame into ~20 Voronoi shards, starting with those near the impact point; give each a random initial velocity, spin and gravity so they fall off-screen within 0.9 s, revealing the boss scene."}, "ja": {"name": "ガラス割れ転換（シャッター）", "observe": "古い画面がガラスのように不規則な破片に割れ、回転・落下・飛散して後ろの新しい画面が現れる。", "notThis": "オブジェクトの破砕エフェクト（VFX-19、世界の中の物が割れる）とは違い、割れるのは「画面のスナップショット全体」。モザイク（TRN-10）とも違う。", "use": "ボス戦の開始、ストーリーの衝撃、「現実が壊れる」演出、戦闘突入。", "prompt": "ゲームのボス登場でガラス割れ転換を：現在の画面を約 20 個のボロノイ破片に分け、衝撃点に近い破片から動かす。各破片にランダムな初速・回転・重力を与え 0.9 秒で画面外へ落とし、ボスのシーンを見せる。"}, "params": "shard count · pattern (Voronoi / radial cracks) · origin · gravity · spin · stagger by distance", "impl": "Pre-build a shard mesh (triangulated Voronoi cells with UVs into the snapshot texture of A). Animate per-shard transforms on the CPU or in the vertex shader from per-instance velocity/spin; draw B underneath.", "related": ["VFX-19", "TRN-11"], "refs": [{"t": "Kronnect Transitions Plus — transition types (docs)", "u": "https://kronnect.com/docs/transitions-plus/transition-types/"}, {"t": "Wikipedia — Voronoi diagram", "u": "https://en.wikipedia.org/wiki/Voronoi_diagram"}], "nosrc": false}, {"id": "TRN-13", "cat": "TRN", "sub": "剪接與空間", "std": "Match cut", "aliases": ["Graphic match", "Match on action"], "type": "S", "zh": {"name": "匹配剪接", "observe": "剪接前後兩個鏡頭的形狀、構圖或動作相同：例如白天的圓形太陽直接切成夜晚的圓月，或角色揮手的動作在下一場延續。", "notThis": "不是交叉溶接（TRN-03，有混合過程）；匹配剪接是瞬間切換，靠「形狀相同」讓切換順暢。", "use": "過場動畫、時間跳躍、建立兩個場景的關聯；遊戲中常用於開場與章節過場。", "prompt": "在遊戲的序章過場中做匹配剪接：鏡頭停在白天城鎮天空中太陽的位置，太陽縮放到畫面中央固定大小，然後在同一位置、同一大小直接切成夜晚的滿月，再把鏡頭拉回顯示夜晚城鎮。"}, "en": {"name": "Match cut", "observe": "The shots before and after the cut share a shape, composition or action — the round sun cuts straight to a round moon, or a character’s wave continues in the next scene.", "notThis": "Not a crossfade (TRN-03, which has a blend); a match cut is instant and relies on matching shapes to feel smooth.", "use": "Cutscenes, time jumps, linking two scenes; common in game intros and chapter interludes.", "prompt": "In a prologue, do a match cut: frame the sun in the daytime sky, centre it at a fixed size, then cut instantly to a full moon at the same position and size, and pull back to reveal the night town."}, "ja": {"name": "マッチカット", "observe": "カット前後のショットで形・構図・動作が一致する。昼の丸い太陽がそのまま夜の満月に切り替わる、手を振る動作が次の場面で続く、など。", "notThis": "クロスフェード（TRN-03、混ざる過程がある）とは違い、一瞬で切り替わり、形の一致で滑らかに感じさせる。", "use": "カットシーン、時間跳躍、2 つの場面の関連付け。オープニングや章の幕間でよく使う。", "prompt": "ゲームのプロローグでマッチカットを：昼の空の太陽を画面中央に一定の大きさで捉え、同じ位置・同じ大きさの夜の満月に瞬時に切り替え、カメラを引いて夜の町を見せる。"}, "params": "matching element & screen position · scale match · hold before/after · optional sound bridge", "impl": "No shader needed: a cutscene camera keyframe on each side of a hard cut, authored so the matching element lands on the same screen rect.", "related": ["TRN-03", "TRN-14", "ENV-01"], "refs": [{"t": "Wikipedia — Match cut", "u": "https://en.wikipedia.org/wiki/Match_cut"}], "nosrc": false}, {"id": "TRN-14", "cat": "TRN", "sub": "剪接與空間", "std": "Whip pan", "aliases": ["Swish pan", "Flash pan", "Blur pan"], "type": "S", "zh": {"name": "甩鏡（快速橫搖）", "observe": "鏡頭極快地橫向甩動，中間畫面被拉成水平動態模糊條紋，停下時已經在新地點或新角色上；切點常藏在模糊中。", "notThis": "不是推移（TRN-08，畫面清晰地平移）；甩鏡有強烈動態模糊與速度感。也不是捲動房間轉場（TRN-16，速度正常）。", "use": "快速切換到另一個角色／地點、喜劇節奏、動作過場。", "prompt": "在遊戲的過場中，從主角甩鏡到遠處的敵人營地：0.25 秒內鏡頭向右加速，中段 0.1 秒畫面以水平方向模糊（約 24px），在模糊最強時切到營地畫面，再減速停下。"}, "en": {"name": "Whip pan", "observe": "The camera swings sideways extremely fast; mid-move the image smears into horizontal motion-blur streaks, and when it stops we are at a new place or character — the cut is often hidden in the blur.", "notThis": "Not a push (TRN-08, a sharp slide) — a whip pan has strong blur and speed. Not a room scroll (TRN-16, normal speed).", "use": "Jumping quickly to another character or place, comic timing, action cutscenes.", "prompt": "In a cutscene, whip pan from the hero to the distant enemy camp: accelerate right over 0.25 s, blur horizontally (~24 px) for the middle 0.1 s, cut to the camp at peak blur, then decelerate to a stop."}, "ja": {"name": "ウィップパン（素早いパン）", "observe": "カメラが極端に速く横へ振られ、途中の画面は水平方向のモーションブラーの縞になり、止まった時には新しい場所や人物にいる。切り替えはブラーの中に隠されることが多い。", "notThis": "プッシュ（TRN-08、くっきりと平行移動）とは違い、強いブラーとスピード感がある。部屋スクロール（TRN-16、普通の速さ）とも違う。", "use": "別の人物・場所へ素早く移る、コメディのテンポ、アクションのカットシーン。", "prompt": "ゲームのカットシーンで主人公から遠くの敵の野営地へウィップパン：0.25 秒で右へ加速、中盤 0.1 秒は水平に約 24px のブラー、ブラーが最大の時に野営地へ切替、そして減速して停止。"}, "params": "duration · peak speed · blur length · cut point · easing in/out", "impl": "Directional blur pass: average N taps along x with offset ∝ camera speed. Swap source texture A→B when blur is maximal. Works on the low-res target before upscaling.", "related": ["TRN-08", "TRN-13", "TRN-16"], "refs": [{"t": "Wikipedia — Whip pan", "u": "https://en.wikipedia.org/wiki/Whip_pan"}], "nosrc": false}, {"id": "TRN-15", "cat": "TRN", "sub": "剪接與空間", "std": "Seamless transition", "aliases": ["Masked loading", "Hidden loading", "Squeeze-through transition", "Elevator loading"], "type": "C", "zh": {"name": "無縫轉場（遮蔽讀取）", "observe": "看起來沒有轉場：玩家在窄縫中擠過、坐電梯、穿過長走廊或門，鏡頭與操作都不中斷，實際上背後正在讀取下一區域。", "notThis": "不是讀取畫面（TRN-17，明確停下來顯示「讀取中」）；無縫轉場把讀取藏在遊戲過程裡。", "use": "開放世界或連續體驗；保持沉浸感，避免黑屏。", "prompt": "在遊戲中，從城鎮進入森林時加入一段 3 秒的「穿過樹叢」通道：主角自動緩慢穿行、兩側樹叢遮擋畫面邊緣，同時背景串流讀取森林區域；若 3 秒後仍未完成，主角放慢並拂開樹枝直到完成。"}, "en": {"name": "Seamless transition", "observe": "There seems to be no transition: the player squeezes through a gap, rides a lift, walks a long corridor or opens a door with no interruption of camera or control, while the next area loads behind the scenes.", "notThis": "Not a loading screen (TRN-17, which stops to show \"loading\"); a seamless transition hides the loading inside gameplay.", "use": "Open worlds and continuous experiences; preserves immersion and avoids black screens.", "prompt": "In your game, add a 3 s \"push through the hedge\" passage between town and forest: the hero walks slowly on rails, bushes cover the screen edges, and the forest area streams in meanwhile; if loading is not done after 3 s, slow the hero and play branch-parting until it is."}, "ja": {"name": "シームレス転換（ロード隠し）", "observe": "転換がないように見える：隙間をすり抜ける、エレベーターに乗る、長い廊下や扉を通る間もカメラと操作が途切れず、裏で次のエリアを読み込んでいる。", "notThis": "ロード画面（TRN-17、止まって「読み込み中」を見せる）とは違い、読み込みをプレイの中に隠す。", "use": "オープンワールドや連続した体験。没入感を保ち、暗転を避ける。", "prompt": "ゲームで町から森へ入る時に 3 秒の「茂みをかき分ける」通路を追加して：主人公はゆっくり自動で進み、左右の茂みが画面端を覆い、その間に森のエリアをストリーミング読み込み。3 秒経っても終わらなければ、主人公の速度を落として枝をかき分ける動作を完了まで続ける。"}, "params": "passage length (s) · movement speed · occluder framing · fallback slow-down · streaming budget", "impl": "Engine-side: async resource loading on a worker thread with a ready flag; gameplay script throttles movement speed until ready. Rendering: foreground occluder sprites near the camera to frame the view.", "related": ["TRN-17", "TRN-16"], "refs": [{"t": "Wikipedia — Loading screen", "u": "https://en.wikipedia.org/wiki/Loading_screen"}], "nosrc": true}, {"id": "TRN-16", "cat": "TRN", "sub": "剪接與空間", "std": "Room transition scroll", "aliases": ["Screen-transition scroll", "Flip-screen scroll", "Zelda-style scroll"], "type": "C", "zh": {"name": "房間捲動轉場", "observe": "玩家走到畫面邊緣時，遊戲暫停，鏡頭把整個畫面平滑捲動到相鄰房間（一個畫面寬），然後恢復操作；角色被一起帶過去。", "notThis": "不是推移（TRN-08，兩張平面畫面）；捲動轉場是在同一個連續世界中移動鏡頭。也不是一般跟隨鏡頭（一直跟着角色）。", "use": "房間制的地城、俯視角迷宮；讓每個房間是一個清楚的「畫面」。", "prompt": "在遊戲的地城中使用房間捲動轉場：主角碰到房間邊界時凍結遊戲邏輯，鏡頭以 0.5 秒 ease-in-out 捲動一個房間寬度，主角同時被移動 16px 進入新房間；捲動完成後才生成新房間的敵人。"}, "en": {"name": "Room transition scroll", "observe": "When the player reaches the screen edge the game pauses, the camera smoothly scrolls one screen to the adjacent room, carrying the character along, and control resumes.", "notThis": "Not a push (TRN-08, two flat images); a room scroll moves the camera within one continuous world. Not a follow camera (which tracks the character continuously).", "use": "Room-based dungeons and top-down mazes, making each room a clear \"screen\".", "prompt": "In dungeons, use a room-transition scroll: when the hero touches a room edge, freeze gameplay, scroll the camera one room width with a 0.5 s ease-in-out, moving the hero 16 px into the new room; spawn the new room’s enemies only after the scroll ends."}, "ja": {"name": "部屋切り替えスクロール", "observe": "プレイヤーが画面端に来るとゲームが一時停止し、カメラが隣の部屋へ 1 画面分なめらかにスクロールしてキャラごと移動し、その後操作が戻る。", "notThis": "プッシュ（TRN-08、2 枚の平面）とは違い、連続した同じ世界の中でカメラが動く。常に追従するカメラとも違う。", "use": "部屋単位のダンジョンや見下ろし型の迷路。部屋ごとに明確な「1 画面」にする。", "prompt": "ゲームのダンジョンで部屋切り替えスクロールを使って：主人公が部屋の境界に触れたらゲームロジックを停止、カメラを 0.5 秒 ease-in-out で部屋 1 つ分スクロール、主人公を 16px 新しい部屋へ移動。スクロール完了後に新しい部屋の敵を出現させる。"}, "params": "scroll duration · easing · player carry distance · freeze gameplay · spawn timing", "impl": "Camera tween between room rects; gameplay timeScale = 0 during the tween while rendering continues. Ensure both rooms’ tilemaps are resident (prefetch neighbours).", "related": ["TRN-08", "TRN-15", "PIX-17"], "refs": [{"t": "Wikipedia — Glossary of video game terms (glossary entry)", "u": "https://en.wikipedia.org/wiki/Glossary_of_video_game_terms"}, {"t": "Itay Keren — Scroll back: the theory and practice of cameras in side-scrollers", "u": "https://www.gamedeveloper.com/design/scroll-back-the-theory-and-practice-of-cameras-in-side-scrollers"}], "nosrc": false}, {"id": "TRN-17", "cat": "TRN", "sub": "剪接與空間", "std": "Loading screen", "aliases": ["Interstitial", "Loading interstitial", "Tips screen"], "type": "S", "zh": {"name": "讀取畫面", "observe": "切換區域時顯示的獨立畫面：讀取進度條或動畫圖示、提示文字、插畫或小動畫，讀取完成後才進入遊戲。", "notThis": "不是無縫轉場（TRN-15，讀取藏在遊玩中）；讀取畫面是明確告訴玩家「正在讀取」。", "use": "大型區域切換、首次啟動；可順便教學（提示）或講世界觀。", "prompt": "在遊戲中加入讀取畫面：深色背景，中央一隻小怪物原地奔跑的 4 幀循環動畫，下方 1 條像素風進度條與一行隨機提示（三語）；讀取完成後至少再顯示 0.3 秒避免閃爍，然後淡出至黑進入遊戲。"}, "en": {"name": "Loading screen", "observe": "A separate screen shown while switching areas: a progress bar or animated icon, tip text, artwork or a small animation; the game starts once loading is done.", "notThis": "Not a seamless transition (TRN-15, loading hidden in gameplay); a loading screen explicitly tells the player \"loading\".", "use": "Large area changes and first launch; can also teach (tips) or tell lore.", "prompt": "Add a loading screen to the game: dark background, a small enemy running in place (4-frame loop) in the centre, a pixel-style progress bar and one random tip (trilingual) below; once loaded keep it up for at least 0.3 s to avoid flicker, then fade to black into the game."}, "ja": {"name": "ロード画面", "observe": "エリア切替時に表示される独立した画面：進捗バーやアニメアイコン、ヒント文、イラストや小さなアニメ。読み込み完了後にゲームへ入る。", "notThis": "シームレス転換（TRN-15、読み込みをプレイ中に隠す）とは違い、「読み込み中」と明示する。", "use": "大きなエリア移動や初回起動。ヒントでチュートリアルや世界観を伝えられる。", "prompt": "ゲームにロード画面を追加して：暗い背景の中央で小さなモンスターがその場で走る 4 フレームのループ、その下にドット風の進捗バーとランダムなヒント（3 言語）を 1 行。読み込み完了後も最低 0.3 秒表示してちらつきを防ぎ、黒フェードでゲームへ。"}, "params": "minimum display time · progress source (real / smoothed) · tip pool · animation · fade in/out", "impl": "Keep the loading scene tiny and resident; load on a worker thread, report progress via an atomic; the render thread only draws the loading scene. Smooth the displayed progress so it never goes backwards.", "related": ["TRN-15", "TRN-01"], "refs": [{"t": "Wikipedia — Loading screen", "u": "https://en.wikipedia.org/wiki/Loading_screen"}, {"t": "Design Atlas — Loading tips", "u": "https://design.solhun.com/en/game-ui/loading-tips/"}], "nosrc": false}, {"id": "ENV-01", "cat": "ENV", "sub": "時間與天空", "std": "Day-night cycle", "aliases": ["Time-of-day cycle", "Diurnal cycle", "Dynamic time of day"], "type": "S", "zh": {"name": "日夜循環", "observe": "遊戲內時間推進時，整個畫面的色調、亮度與天空依序經過清晨、正午、黃昏、夜晚；夜晚時窗戶、火把等光源亮起，陰影方向或長度也可能改變。", "notThis": "不是單純的淡出至黑（TRN-01）；日夜循環是連續、可遊玩的狀態變化。也不是天空漸層（ENV-02，只處理天空本身）。", "use": "時間感、作息玩法（夜晚敵人出沒）、氣氛變化。", "prompt": "在遊戲中加入日夜循環：一天 8 分鐘；用 4 個關鍵色（清晨 #ffd9b0、正午 #ffffff、黃昏 #ff9a6a、夜晚 #3a4a8a）對整個場景做 multiply 調色並平滑插值；夜晚時房屋窗戶與火把以加法混合發出暖光，亮度隨天黑逐漸提高。"}, "en": {"name": "Day-night cycle", "observe": "As in-game time advances, the whole image’s tint, brightness and sky pass through dawn, noon, dusk and night; at night windows and torches light up, and shadow direction or length may change.", "notThis":
