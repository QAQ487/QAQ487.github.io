": {"name": "Range indicator (tower radius)", "observe": "When a tower, unit or skill is selected or being placed, a translucent circle (or set of tiles) with a clear edge appears around it, showing how far it can attack or affect; enemies inside are marked. Before an upgrade, the new radius is often previewed as a dashed ring.", "notThis": "Not an attack telegraph (NAV-04, an enemy hit about to land, with a countdown); a range indicator is information about your own unit and stays while selected. Not fog of war (ENV-15, which shows vision, not attack reach).", "use": "Tower defense, real-time strategy, tactics games (move / attack tiles), skill aiming.", "prompt": "Add range indicators to the game: when the cursor hovers or selects a tower, draw a circle centred on it with radius = attack range, fill rgba(255,255,255,0.12) and a 1 px rgba(255,255,255,0.8) edge; enemies inside get a 3 px red marker above their heads. While the upgrade button is hovered, draw the upgraded radius as a dashed ring with 2 px gaps; on upgrade, grow the radius over 0.25 s with ease-out."}, "ja": {"name": "射程表示（射程円）", "observe": "タワー、ユニット、スキルを選択中または配置中に、それを中心とした半透明の円（またはマスの集まり）とはっきりした縁が出て、攻撃や効果が届く距離を示す。円の中の敵には印が付く。強化の前には、新しい半径を破線で予告することが多い。", "notThis": "攻撃予兆表示（NAV-04、敵の攻撃がもうすぐ当たる、カウントダウン付き）ではなく、味方側の情報で選択中は出たまま。戦場の霧（ENV-15、攻撃距離ではなく視界を示す）とも違う。", "use": "タワーディフェンス、RTS、シミュレーション RPG（移動・攻撃マス）、スキルの照準。", "prompt": "ゲームに射程表示を追加して：カーソルがタワーに重なるか選択したとき、タワーを中心に半径＝攻撃距離の円を描き、塗りは rgba(255,255,255,0.12)、縁は 1 px の rgba(255,255,255,0.8)。円内の敵の頭上に 3 px の赤い印を出す。強化ボタンにホバー中は、強化後の半径を 2 px 間隔の破線で描き、強化時は 0.25 秒の ease-out で半径を広げる。"}, "params": "radius = gameplay range · fill & edge alpha · when shown (hover, select, placement) · in-range highlight · upgrade preview style · circle vs tiles", "impl": "Draw a circle quad on the ground layer below units with a shader: d = length(uv); fill alpha inside, an edge band near d = 1, discard outside (dash by angle for previews). For tile-based games, flood-fill the reachable tiles and tint them. Use the same range value as the targeting query.", "related": ["NAV-04", "NAV-05", "ENV-15"], "refs": [{"t": "GDQuest — Visualizing the weapon’s attack range (tower defense)", "u": "https://school.gdquest.com/courses/godot_2d_secrets_godot_3/tower_defense/visualizing_attack_range"}, {"t": "GameDev.Land — Tower Defense with PIXI, step 6: tower coverage", "u": "https://gamedev.land/articles/tower-defense/preparation-for-shooting/"}, {"t": "Wikipedia — Tower defense", "u": "https://en.wikipedia.org/wiki/Tower_defense"}], "nosrc": false}, {"id": "LGT-01", "cat": "LGT", "sub": "光源", "std": "Directional, point and spot lights", "aliases": ["Light types", "Sun light", "Omni light", "Spotlight", "Punctual lights"], "type": "S", "zh": {"name": "平行光、點光源與聚光燈（光源類型）", "observe": "三種最基本的光源：平行光（太陽）讓整個場景從同一方向受光，影子互相平行；點光源（燈泡、火把）由一點向四周發光，越遠越暗；聚光燈（手電筒、舞台燈）只照亮一個錐形範圍，邊緣有明顯的光圈。", "notThis": "不是光衰減（LGT-02，決定亮度隨距離如何下降）；也不是面光源（LGT-05，光源有面積，影子邊緣柔和）。三者都屬於「點狀／無面積」光源，所以陰影邊緣本身是硬的。", "use": "決定場景的主光與氣氛：白天戶外用平行光，室內與夜晚用點光源，探照、手電筒、舞台與警戒範圍用聚光燈。", "prompt": "在遊戲中建立三種光源：1 個平行光作為太陽（方向 (−0.4, −1, −0.3)、顏色 #fff4e0、強度 1.0）；火把用點光源（半徑 6 m、顏色 #ffb060）；守衛手電筒用聚光燈（內角 20°、外角 30°、射程 12 m），內外角之間平滑過渡。每種光源都可在編輯器裡即時調整並預覽。"}, "en": {"name": "Directional, point and spot lights (light types)", "observe": "The three basic light types: a directional light (the sun) lights the whole scene from one direction with parallel shadows; a point light (bulb, torch) radiates from one point in all directions and gets darker with distance; a spot light (flashlight, stage light) lights only a cone, with a visible pool and edge.", "notThis": "Not light attenuation (LGT-02, how brightness falls off with distance) and not an area light (LGT-05, a light with size and soft shadow edges). All three are \"punctual\" (no size), so their shadows are inherently hard-edged.", "use": "Setting the key light and mood: directional for daytime exteriors, point lights for interiors and night, spot lights for searchlights, flashlights, stages and guard vision cones.", "prompt": "Set up the three light types in the game: one directional light as the sun (direction (−0.4, −1, −0.3), colour #fff4e0, intensity 1.0); torches as point lights (radius 6 m, colour #ffb060); the guard's flashlight as a spot light (inner angle 20°, outer 30°, range 12 m) with a smooth blend between inner and outer angle. Make every light editable and previewable live in the editor."}, "ja": {"name": "平行光・点光源・スポットライト（光源の種類）", "observe": "最も基本的な 3 種類の光源。平行光（太陽）はシーン全体を同じ向きから照らし、影は互いに平行になる。点光源（電球・松明）は 1 点から全方向に光り、遠いほど暗い。スポットライト（懐中電灯・舞台照明）は円錐の範囲だけを照らし、縁のはっきりした光だまりができる。", "notThis": "光の減衰（LGT-02、距離による明るさの落ち方）や面光源（LGT-05、大きさのある光で影の縁が柔らかい）とは違う。3 種類とも「大きさのない」光源なので、影の縁は本来くっきりしている。", "use": "シーンの主光源と雰囲気を決める：昼の屋外は平行光、室内や夜は点光源、サーチライト・懐中電灯・舞台・見張りの視界にはスポットライト。", "prompt": "ゲームに 3 種類の光源を用意して：太陽は平行光 1 つ（向き (−0.4, −1, −0.3)、色 #fff4e0、強度 1.0）。松明は点光源（半径 6 m、色 #ffb060）。見張りの懐中電灯はスポットライト（内角 20°、外角 30°、射程 12 m）で、内角と外角の間は滑らかにつなぐ。どの光源もエディタ上でリアルタイムに調整・確認できるように。"}, "params": "type · direction / position · colour · intensity · range · inner & outer cone angle · shadow on/off", "impl": "Directional: L = −dir, constant intensity. Point: L = normalize(pos − p), multiplied by an attenuation term (LGT-02). Spot: as point, times smoothstep(cos(outer), cos(inner), dot(−L, spotDir)). Pack lights in a constant/structured buffer; evaluate N·L per pixel.", "related": ["LGT-02", "LGT-05", "PIX-21", "LGT-03"], "refs": [{"t": "LearnOpenGL — Light casters (directional, point, spot; attenuation)", "u": "https://learnopengl.com/Lighting/Light-casters"}, {"t": "Godot docs — 3D lights and shadows", "u": "https://docs.godotengine.org/en/stable/tutorials/3d/lights_and_shadows.html"}, {"t": "Unity Manual — Light component", "u": "https://docs.unity3d.com/Manual/class-Light.html"}], "nosrc": false}, {"id": "LGT-02", "cat": "LGT", "sub": "光源", "std": "Light attenuation", "aliases": ["Falloff", "Distance falloff", "Inverse-square falloff", "Light range"], "type": "S", "zh": {"name": "光衰減（距離衰減）", "observe": "光源越遠越暗的「方式」：線性衰減會形成一圈亮度均勻遞減、邊緣突然結束的光；平方反比衰減在光源附近非常亮、向外迅速變暗後拖出長尾；再加上半徑窗口函數後，光在指定半徑內平滑降到零。", "notThis": "不是光源類型（LGT-01）；衰減只描述亮度與距離的關係。也不是霧（REN-26 Fog，會令遠景偏向霧色）；衰減只影響光的強度，不改變物件本身的顏色。", "use": "控制燈光範圍的觀感（火把的光圈大小、街燈之間的暗位）、效能（超出半徑可完全略過計算）、2D 光照的光圈造型。", "prompt": "為遊戲的點光源改用「平方反比＋半徑窗口」衰減：intensity = 1 / (d² + 1) × (1 − (d / r)⁴)²（夾在 0–1），r 為光源半徑；火把 r = 6 m、街燈 r = 10 m。在除錯模式中以 0.25 為間隔畫出等亮度線，確認光在半徑邊緣平滑歸零、沒有可見的硬邊。"}, "en": {"name": "Light attenuation (distance falloff)", "observe": "How a light gets darker with distance: linear falloff gives an evenly fading pool that ends abruptly; inverse-square falloff is very bright near the source, drops quickly and leaves a long tail; adding a radius window makes the light reach zero smoothly at a chosen radius.", "notThis": "Not a light type (LGT-01); attenuation only describes brightness versus distance. Not fog (REN-26 Fog, which shifts distant things towards the fog colour); attenuation changes only the light's intensity, not the object's colour.", "use": "Shaping how far a light seems to reach (torch pool size, dark gaps between street lamps), performance (skip work beyond the radius), the look of 2D light pools.", "prompt": "Switch the game's point lights to inverse-square with a radius window: intensity = 1 / (d² + 1) × (1 − (d / r)⁴)² (clamped 0–1), where r is the light radius; torches r = 6 m, street lamps r = 10 m. In debug mode draw iso-lines at 0.25 steps to confirm the light reaches zero smoothly at the radius with no visible hard edge."}, "ja": {"name": "光の減衰（距離減衰）", "observe": "光源から離れるほど暗くなる「落ち方」。線形減衰は均一に暗くなり縁で急に終わる光だまりになる。逆二乗減衰は光源近くがとても明るく、すぐ暗くなって長い裾を引く。半径による窓関数を加えると、指定した半径で滑らかにゼロになる。", "notThis": "光源の種類（LGT-01）ではなく、明るさと距離の関係だけを表す。フォグ（REN-26 Fog、遠くをフォグ色に寄せる）とも違い、減衰は光の強さだけを変え、物体の色そのものは変えない。", "use": "光の届く範囲の印象（松明の光だまりの大きさ、街灯の間の暗がり）、パフォーマンス（半径外は計算を省ける）、2D ライトの光だまりの形。", "prompt": "ゲームの点光源を「逆二乗＋半径の窓関数」の減衰に変えて：intensity = 1 / (d² + 1) × (1 − (d / r)⁴)²（0〜1 にクランプ）、r は光源半径。松明 r = 6 m、街灯 r = 10 m。デバッグ表示で 0.25 刻みの等輝度線を描き、半径の縁で硬い境目なく滑らかにゼロになることを確認する。"}, "params": "curve (linear / inverse-square / smoothstep / custom LUT) · radius · windowing exponent · intensity", "impl": "Evaluate per pixel from the distance to the light. Common windowed form: falloff = saturate(1 − (d/r)^4)^2 / (d² + 1). The radius also bounds the light for culling (LGT-11). For stylised 2D, sample a 1D falloff texture/LUT instead of a formula.", "related": ["LGT-01", "LGT-11", "PIX-21", "REN-26 Fog"], "refs": [{"t": "LearnOpenGL — Light casters (directional, point, spot; attenuation)", "u": "https://learnopengl.com/Lighting/Light-casters"}, {"t": "Wikipedia — Inverse-square law", "u": "https://en.wikipedia.org/wiki/Inverse-square_law"}, {"t": "Godot docs — 3D lights and shadows", "u": "https://docs.godotengine.org/en/stable/tutorials/3d/lights_and_shadows.html"}], "nosrc": false}, {"id": "LGT-03", "cat": "LGT", "sub": "光源", "std": "Light cookie", "aliases": ["Gobo", "Projector texture", "Light mask", "Projected light texture"], "type": "S", "zh": {"name": "光罩投影（Light cookie／Gobo）", "observe": "光源前面像放了一塊鏤空的板，投到地面和牆上的光帶有圖案：窗框的格子、樹葉縫隙的斑駁光點、彩色玻璃的顏色；圖案隨光源移動或旋轉而改變。", "notThis": "不是陰影（REN-25 Cast shadows／LGT-08，由場景中真實物件擋光產生）；光罩的圖案只是一張貼在光源上的貼圖，場景裡並不需要真的有窗框或樹葉。也不是雲影（ENV-07，通常是投在整個地面上捲動的大範圍圖層）。", "use": "室內窗光、森林樹蔭的斑駁光、舞台與迪斯可燈、手電筒的不規則光圈、以低成本暗示畫面外的物件。", "prompt": "為遊戲的室內場景加入光罩投影：窗外的聚光燈使用一張 128×128 的灰階貼圖（2×3 格窗框，框寬 8 px），投在地板上形成格子光；森林中的平行光使用樹葉斑駁貼圖，以每秒 0.05 UV 緩慢平移模擬風吹樹葉。光罩只影響直接光，不影響環境光。"}, "en": {"name": "Light cookie (gobo)", "observe": "As if a cut-out plate sits in front of the light, the light on the floor and walls carries a pattern: window-frame bars, dappled light through leaves, coloured stained glass; the pattern moves or rotates with the light.", "notThis": "Not a shadow (REN-25 Cast shadows / LGT-08, made by real objects blocking light); a cookie is just a texture attached to the light, with no actual window or leaves needed in the scene. Not cloud shadows (ENV-07, usually a large layer scrolling over the whole ground).", "use": "Window light indoors, dappled forest light, stage and disco lights, irregular flashlight pools, cheaply implying off-screen objects.", "prompt": "Add light cookies to the game's interiors: the spot light outside each window uses a 128×128 greyscale texture (2×3 panes, 8 px bars) to throw a grid of light on the floor; the forest directional light uses a dappled-leaf cookie panning at 0.05 UV/s to suggest leaves in the wind. Cookies affect direct light only, not ambient."}, "ja": {"name": "ライトクッキー（ゴボ）", "observe": "光源の前に切り抜いた板を置いたように、床や壁に模様のある光が落ちる。窓枠の格子、木漏れ日のまだら、ステンドグラスの色など。光源が動いたり回ったりすると模様も変わる。", "notThis": "影（REN-25 Cast shadows／LGT-08、シーン内の物体が光を遮ってできる）ではなく、クッキーは光源に付けたテクスチャにすぎず、シーンに本物の窓枠や葉は要らない。雲の影（ENV-07、地面全体に流れる大きなレイヤー）とも違う。", "use": "室内の窓明かり、森の木漏れ日、舞台やディスコの照明、懐中電灯の不規則な光、画面外の物体を安く示唆する。", "prompt": "ゲームの室内にライトクッキーを入れて：窓の外のスポットライトに 128×128 のグレースケールテクスチャ（2×3 の窓枠、枠幅 8 px）を使い、床に格子状の光を落とす。森の平行光には木漏れ日のクッキーを使い、毎秒 0.05 UV でゆっくり流して風に揺れる葉を表現する。クッキーは直接光だけに効き、環境光には効かない。"}, "params": "cookie texture · projection size / angle · scroll & rotation speed · colour vs greyscale · affects direct light only", "impl": "Project the shaded point into the light's space (spot: its view-projection; directional: an orthographic tiling projection; point: a cubemap) and multiply the light contribution by the sampled cookie. Uses the same light-space transform as a shadow map, but needs no depth comparison.", "related": ["LGT-01", "ENV-07", "LGT-08", "REN-25 Cast shadows"], "refs": [{"t": "Unity Manual — Cookies", "u": "https://docs.unity3d.com/Manual/Cookies.html"}, {"t": "Wikipedia — Gobo (lighting)", "u": "https://en.wikipedia.org/wiki/Gobo_(lighting)"}, {"t": "Godot docs — 3D lights and shadows", "u": "https://docs.godotengine.org/en/stable/tutorials/3d/lights_and_shadows.html"}], "nosrc": false}, {"id": "LGT-04", "cat": "LGT", "sub": "光源", "std": "Flickering light", "aliases": ["Light flicker", "Torch flicker", "Candle flicker", "Light styles", "Animated light"], "type": "C", "zh": {"name": "火光搖曳（閃爍光源）", "observe": "火把、蠟燭、壞掉的日光燈的亮度不斷不規則地變化：火光是小幅、柔和的起伏，偶爾輕輕一跳，光圈半徑和光源位置也微微晃動；壞燈則是突然熄滅又亮起。", "notThis": "不是閃電閃光（ENV-06，整個畫面一次性的強烈閃白）；也不是光衰減（LGT-02，靜態的亮度分佈）。搖曳是隨時間變化的「光源動畫」，而且通常不是每幀完全隨機（那樣會像故障閃爍），而是平滑或有節奏的變化。", "use": "火把、營火、蠟燭、燈籠、壞掉的燈、恐怖氣氛；令靜態場景「活」起來。", "prompt": "為遊戲的火把加入搖曳：亮度 = 0.85 + 0.15 × 分形噪聲(時間 × 8)（兩層噪聲，第二層頻率 ×2.3、幅度 ×0.5）；光圈半徑同步變化 ±6%，光源位置在 ±1 px 內抖動；每個火把用不同的噪聲偏移，避免同步。另加一種「壞燈」模式：按字串序列每 0.1 秒切換亮度（例如 \"mmamammmmammamamaaamammma\"，a = 熄、m = 正常）。"}, "en": {"name": "Flickering light", "observe": "Torches, candles and broken fluorescent tubes keep changing brightness irregularly: firelight dips and rises softly with the occasional small jump, the pool radius and light position wobble slightly; a broken tube cuts out and comes back abruptly.", "notThis": "Not a lightning flash (ENV-06, a one-off strong flash over the whole screen) and not attenuation (LGT-02, a static distribution). Flicker is a light animation over time, and is usually not fully random each frame (which reads as a glitch) but smooth or rhythmic.", "use": "Torches, campfires, candles, lanterns, broken lamps, horror moods; makes static scenes feel alive.", "prompt": "Add flicker to the game's torches: brightness = 0.85 + 0.15 × fractal noise(time × 8) (two octaves, second at ×2.3 frequency and ×0.5 amplitude); vary the pool radius by ±6% in sync and jitter the light position within ±1 px; give every torch its own noise offset so they never pulse together. Add a \"broken lamp\" mode that steps brightness every 0.1 s from a pattern string (e.g. \"mmamammmmammamamaaamammma\", a = off, m = normal)."}, "ja": {"name": "炎の揺らぎ（ちらつく光源）", "observe": "松明・ろうそく・壊れた蛍光灯の明るさが不規則に変わり続ける。炎の光は小さく柔らかに上下し、時々少し跳ね、光だまりの半径や光源の位置もわずかに揺れる。壊れた灯りは突然消えてはまた点く。", "notThis": "稲妻の閃光（ENV-06、画面全体が一度強く白く光る）でも、減衰（LGT-02、静的な明るさの分布）でもない。揺らぎは時間とともに変わる「光源のアニメーション」で、毎フレーム完全にランダムにする（不具合のちらつきに見える）のではなく、滑らかかリズムのある変化にするのが普通。", "use": "松明、焚き火、ろうそく、ランタン、壊れた灯り、ホラーの雰囲気。静止したシーンに生気を与える。", "prompt": "ゲームの松明に揺らぎを入れて：明るさ = 0.85 + 0.15 × フラクタルノイズ(時間 × 8)（2 オクターブ、2 段目は周波数 ×2.3・振幅 ×0.5）。光だまりの半径も同期して ±6% 変え、光源位置を ±1 px 以内で揺らす。松明ごとにノイズのオフセットを変えて同期させない。さらに「壊れた灯り」モードとして、文字列パターン（例 \"mmamammmmammamamaaamammma\"、a = 消灯、m = 通常）で 0.1 秒ごとに明るさを切り替える。"}, "params": "base intensity · amplitude · noise frequency & octaves · radius wobble · position jitter · per-light phase offset · pattern string & step rate", "impl": "Animate light parameters on the CPU each frame (intensity, radius, small position offset) from 1D value/Perlin noise of time plus a per-light seed, then upload to the light buffer. Pattern mode: index = floor(time × 10) mod len; brightness = (char − 'a') / ('m' − 'a').", "related": ["LGT-02", "ENV-06", "VFX-12", "LGT-01"], "refs": [{"t": "Quake Wiki — lightstyle", "u": "https://quakewiki.org/wiki/lightstyle"}, {"t": "Alan Zucconi — The secret behind Valve's flickering lights", "u": "https://www.alanzucconi.com/2021/06/15/valve-flickering-lights/"}, {"t": "id Software — Quake source, world.qc (light style tables)", "u": "https://github.com/id-Software/Quake/blob/master/qw-qc/world.qc"}], "nosrc": false}, {"id": "LGT-05", "cat": "LGT", "sub": "光源", "std": "Area light", "aliases": ["Rect light", "Area lights", "Soft light source", "Light with size"], "type": "S", "zh": {"name": "面光源（區域光）", "observe": "光從一塊有面積的形狀發出（窗戶、霓虹燈管、電視螢幕、柔光箱），而不是一個點：物件的影子靠近接觸點時清楚、越遠越柔和並出現半影；光滑表面上的高光是光源形狀（長方形、長條），不是一個小圓點。", "notThis": "不是聚光燈或點光源（LGT-01，影子邊緣一律硬，高光是小圓點）；也不是把硬陰影直接模糊（REN-25 Cast shadows 的柔影應隨距離變化，模糊則到處一樣柔）。", "use": "室內窗光、霓虹與螢幕光、攝影棚式的人物打光、需要柔和真實光感的場景。", "prompt": "在遊戲的室內加入一個長方形面光源作為窗光（2 m × 1.2 m、顏色 #dfe8ff、強度 3）：漫反射與鏡面高光都以面積積分（例如 LTC 方法）計算，讓地板上的高光呈長方形；陰影在接觸點清晰、離地越遠越柔和（半影寬度與「遮擋物到地面距離 ÷ 光源到遮擋物距離 × 光源寬度」成正比）。"}, "en": {"name": "Area light", "observe": "Light comes from a shape with size (a window, neon tube, TV screen, softbox) rather than a point: shadows are sharp near the contact point and grow softer with a penumbra further away; highlights on glossy surfaces take the shape of the light (rectangle, strip) instead of a tiny dot.", "notThis": "Not a spot or point light (LGT-01, always hard shadows and dot highlights) and not simply blurring a hard shadow (REN-25 Cast shadows: true softness varies with distance, a blur is equally soft everywhere).", "use": "Window light indoors, neon and screen light, studio-style character lighting, scenes that need soft, believable light.", "prompt": "Add a rectangular area light to the game's interiors as window light (2 m × 1.2 m, colour #dfe8ff, intensity 3): compute diffuse and specular as an integral over the area (e.g. the LTC method) so the floor highlight is a rectangle; shadows are crisp at contact and softer further from the ground (penumbra width ∝ occluder-to-ground distance ÷ light-to-occluder distance × light width)."}, "ja": {"name": "面光源（エリアライト）", "observe": "光が点ではなく、面積のある形（窓、ネオン管、テレビ画面、ソフトボックス）から出る。影は接地点近くではくっきり、離れるほど柔らかくなって半影が出る。光沢面のハイライトは小さな点ではなく光源の形（長方形、細長い帯）になる。", "notThis": "スポットライトや点光源（LGT-01、影の縁は常に硬く、ハイライトは点）とは違う。硬い影をただぼかすこと（REN-25 Cast shadows、本物の柔らかさは距離で変わるが、ぼかしはどこも同じ柔らかさ）とも違う。", "use": "室内の窓明かり、ネオンや画面の光、スタジオ風の人物ライティング、柔らかくリアルな光が必要な場面。", "prompt": "ゲームの室内に窓明かりとして長方形の面光源を入れて（2 m × 1.2 m、色 #dfe8ff、強度 3）：拡散と鏡面反射を面積で積分して（例：LTC 法）、床のハイライトを長方形にする。影は接地点でくっきり、地面から離れるほど柔らかく（半影の幅 ∝ 遮蔽物〜地面の距離 ÷ 光源〜遮蔽物の距離 × 光源の幅）。"}, "params": "shape (rect / disc / tube) · size · intensity · two-sided · shadow softness / sample count", "impl": "Real-time: Linearly Transformed Cosines (LTC) with two small LUT textures for diffuse+specular from polygonal lights. Soft shadows: PCSS-style variable filter width from blocker distance, or many shadow samples. Offline/baked: area lights are integrated by the lightmapper (LGT-06).", "related": ["LGT-01", "REN-25 Cast shadows", "LGT-06", "LGT-09"], "refs": [{"t": "LearnOpenGL — Area lights (LTC)", "u": "https://learnopengl.com/Guest-Articles/2022/Area-Lights"}, {"t": "Wikipedia — Umbra, penumbra and antumbra", "u": "https://en.wikipedia.org/wiki/Penumbra"}, {"t": "Unity Manual — Light component", "u": "https://docs.unity3d.com/Manual/class-Light.html"}], "nosrc": false}, {"id": "LGT-06", "cat": "LGT", "sub": "間接光與陰影", "std": "Baked lighting", "aliases": ["Lightmapping", "Lightmaps", "Precomputed lighting", "Static lighting"], "type": "S", "zh": {"name": "烘焙光照（光照貼圖）", "observe": "靜態場景的光影事先計算好、存成貼圖（光照貼圖）貼回牆和地面：柔和的陰影、角落的暗位、反彈光的染色都很細緻，執行時幾乎不花成本；但會移動的物件不會在烘焙的光裡留下影子，開關燈或日夜變化時烘焙的光也不會跟著改變。", "notThis": "不是全域光照本身（REN-20 Global illumination，那是效果的名稱；烘焙是其中一種做法）；也不是光照探針（LGT-07，為「會移動的物件」提供取樣的烘焙光）。和即時陰影（LGT-08）的差別：移動光源或物件時，烘焙的光影不變。", "use": "靜態建築、室內、低效能平台、需要高品質柔影與反彈光但光源固定的場景。", "prompt": "為遊戲的室內關卡使用烘焙光照：所有不會移動的牆、地板、家具標記為靜態，生成第二套不重疊 UV，光照貼圖密度每公尺 20 texel，包含 2 次反彈；會移動的角色與道具不烘焙，改用光照探針（LGT-07）取樣並以即時陰影投影。光照貼圖以 HDR 格式儲存。"}, "en": {"name": "Baked lighting (lightmapping)", "observe": "Lighting for static geometry is computed in advance and stored in textures (lightmaps) mapped back onto walls and floors: soft shadows, dark corners and bounced colour look detailed and cost almost nothing at run time — but moving objects leave no shadow in the baked light, and switching lights or changing time of day does not update it.", "notThis": "Not global illumination itself (REN-20 Global illumination names the effect; baking is one way to get it) and not light probes (LGT-07, baked light sampled for moving objects). Versus real-time shadows (LGT-08): moving a light or object leaves baked lighting unchanged.", "use": "Static architecture, interiors, low-end platforms, scenes with fixed lights that need high-quality soft shadows and bounce light.", "prompt": "Use baked lighting for the game's interior levels: mark all non-moving walls, floors and furniture static, generate a second non-overlapping UV set, bake at 20 texels per metre with 2 bounces; do not bake moving characters and props — light them from light probes (LGT-07) and give them real-time shadows. Store lightmaps in an HDR format."}, "ja": {"name": "ベイクドライティング（ライトマップ）", "observe": "静的なシーンの光と影を事前に計算してテクスチャ（ライトマップ）に保存し、壁や床に貼り戻す。柔らかい影、隅の暗がり、反射光の色移りが細かく出て、実行時のコストはほぼない。ただし動く物体はベイクされた光に影を落とさず、照明の切り替えや昼夜の変化にも追従しない。", "notThis": "グローバルイルミネーションそのもの（REN-20 Global illumination は効果の名前で、ベイクはその手段の一つ）ではなく、ライトプローブ（LGT-07、動く物体のためにサンプリングするベイク光）とも違う。リアルタイムの影（LGT-08）との違いは、光源や物体を動かしてもベイクされた光と影が変わらないこと。", "use": "静的な建物、室内、低スペック環境、光源が固定で質の高い柔らかい影と反射光が欲しい場面。", "prompt": "ゲームの室内ステージにベイクドライティングを使って：動かない壁・床・家具をすべて静的にし、重ならない第 2 UV を生成。ライトマップ密度は 1 m あたり 20 texel、反射 2 回。動くキャラや小物はベイクせず、ライトプローブ（LGT-07）で照らしてリアルタイムの影を付ける。ライトマップは HDR 形式で保存する。"}, "params": "texel density · bounce count · lightmap UV padding · HDR vs LDR · directional lightmaps · static/dynamic flags", "impl": "Offline: a lightmapper path-traces or radiosity-solves irradiance per lightmap texel. Run time: sample the lightmap with the second UV set (bilinear) and multiply albedo; add real-time direct light only from dynamic lights. Pad UV islands to avoid bleeding.", "related": ["REN-20 Global illumination", "LGT-07", "LGT-08", "REN-21 Ambient occlusion"], "refs": [{"t": "Wikipedia — Lightmap", "u": "https://en.wikipedia.org/wiki/Lightmap"}, {"t": "Godot docs — Using Lightmap global illumination", "u": "https://docs.godotengine.org/en/stable/tutorials/3d/global_illumination/using_lightmap_gi.html"}, {"t": "Unity Manual — Lightmapping", "u": "https://docs.unity3d.com/Manual/Lightmapping.html"}, {"t": "Godot docs — Introduction to global illumination", "u": "https://docs.godotengine.org/en/stable/tutorials/3d/global_illumination/introduction_to_global_illumination.html"}], "nosrc": false}, {"id": "LGT-07", "cat": "LGT", "sub": "間接光與陰影", "std": "Light probes", "aliases": ["Irradiance probes", "Probe grid", "Light probe group", "Spherical harmonics lighting"], "type": "S", "zh": {"name": "光照探針", "observe": "場景中預先放置許多看不見的取樣點（探針），每點記錄「從四面八方來的光」；會移動的角色走過時，從附近幾個探針內插出自己的環境光，所以走近紅色光源時身上帶紅、走進陰暗處就變暗，與烘焙好的背景光一致。", "notThis": "不是反射探針（REN-23 Reflections／IBL，記錄清楚的環境影像用於反射）；光照探針只記錄低頻的漫射光。也不是烘焙光照貼圖（LGT-06，貼在靜態表面上）；探針是給動態物件用的。", "use": "讓移動角色、道具、粒子融入烘焙光照的場景；開放世界與大型室內的間接光。", "prompt": "為遊戲的烘焙場景加入光照探針：以 2 m 為間距鋪設探針網格，在光線變化大的地方（門口、光源附近、陰影邊緣）加密到 0.5 m；每個探針以 2 階球諧函數（9 個係數）儲存漫射光。移動角色每幀以三線性內插取最近 8 個探針，作為環境光加到即時直接光上；除錯模式以小球顯示每個探針的顏色。"}, "en": {"name": "Light probes", "observe": "Many invisible sample points (probes) are placed in the scene ahead of time, each storing \"light arriving from every direction\"; moving characters interpolate their ambient light from nearby probes, so they pick up a red tint near a red light and darken in shadowed areas, matching the baked background.", "notThis": "Not reflection probes (REN-23 Reflections / IBL, which capture a sharp environment image for reflections); light probes store only low-frequency diffuse light. Not lightmaps (LGT-06, applied to static surfaces); probes are for dynamic objects.", "use": "Making moving characters, props and particles sit inside baked lighting; indirect light in open worlds and large interiors.", "prompt": "Add light probes to the game's baked scenes: lay a probe grid at 2 m spacing, densified to 0.5 m where light changes quickly (doorways, near lights, shadow edges); store diffuse light per probe as order-2 spherical harmonics (9 coefficients). Each frame, moving characters trilinearly blend the nearest 8 probes and add the result as ambient on top of real-time direct light; a debug mode draws each probe as a small sphere in its colour."}, "ja": {"name": "ライトプローブ", "observe": "シーンにあらかじめ見えないサンプリング点（プローブ）を多数置き、それぞれが「全方向から来る光」を記録する。動くキャラクターは近くのプローブから自分の環境光を補間するので、赤い光源に近づけば赤みを帯び、暗い所では暗くなり、ベイクされた背景の光と合う。", "notThis": "反射プローブ（REN-23 Reflections／IBL、反射用にくっきりした周囲の画像を記録）とは違い、ライトプローブは低周波の拡散光だけを記録する。ライトマップ（LGT-06、静的な面に貼る）とも違い、プローブは動的な物体のためのもの。", "use": "動くキャラ・小物・パーティクルをベイクされたシーンになじませる。オープンワールドや広い室内の間接光。", "prompt": "ゲームのベイク済みシーンにライトプローブを入れて：2 m 間隔でプローブの格子を敷き、光の変化が大きい所（出入口、光源の近く、影の境目）は 0.5 m に密にする。各プローブは 2 次の球面調和関数（係数 9 個）で拡散光を保存。動くキャラは毎フレーム近くの 8 個を三線形補間し、環境光としてリアルタイムの直接光に足す。デバッグ表示では各プローブをその色の小さな球で描く。"}, "params": "probe spacing · placement density near light changes · SH order · interpolation (trilinear / tetrahedral) · update (baked / real-time)", "impl": "Bake irradiance per probe as L2 spherical harmonics (9 RGB coefficients). At run time find the containing cell (grid) or tetrahedron, blend coefficients, then evaluate SH with the surface normal in the vertex or pixel shader. Upload per-object blended SH in a constant buffer.", "related": ["LGT-06", "REN-23 Reflections", "REN-20 Global illumination", "LGT-01"], "refs": [{"t": "Unity Manual — Light Probes", "u": "https://docs.unity3d.com/Manual/LightProbes.html"}, {"t": "Unity Manual — Light Probes technical information", "u": "https://docs.unity3d.com/Manual/LightProbes-TechnicalInformation.html"}, {"t": "Godot docs — Introduction to global illumination", "u": "https://docs.godotengine.org/en/stable/tutorials/3d/global_illumination/introduction_to_global_illumination.html"}], "nosrc": false}, {"id": "LGT-08", "cat": "LGT", "sub": "間接光與陰影", "std": "Shadow mapping and cascaded shadow maps", "aliases": ["Shadow maps", "CSM", "PSSM", "Cascades", "Parallel-split shadow maps"], "type": "S", "zh": {"name": "陰影貼圖與級聯陰影（CSM）", "observe": "即時陰影的主流做法：先從光源角度渲染一張深度圖，再判斷每個像素是否被擋。大型戶外場景會把鏡頭前的距離分成數段（級聯），近處用高解析度、遠處用低解析度；看得出來的特徵是近處影子清楚、遠處影子變粗糙或成鋸齒，段與段之間有時看得到接縫。", "notThis": "陰影本身是效果（REN-25 Cast shadows），陰影貼圖是方法。不是接觸陰影（LGT-09，只補接觸處的細小陰影）；也不是烘焙光照（LGT-06，光影不會隨物件移動）。", "use": "戶外大場景、日夜循環中會移動的太陽、需要即時陰影的動態物件。", "prompt": "為遊戲的太陽光使用 3 級級聯陰影：每級 2048×2048，分段距離 0–12 m、12–40 m、40–120 m（約按對數與線性混合 0.7 分配）；每級的光源投影以 texel 大小對齊，避免鏡頭移動時影子邊緣閃爍；級聯之間用 2 m 寬的過渡區混合；以 3×3 PCF 柔化邊緣，並提供除錯模式把每一級塗成紅、綠、藍。"}, "en": {"name": "Shadow mapping and cascaded shadow maps", "observe": "The mainstream real-time shadow method: render a depth image from the light's point of view, then test whether each pixel is occluded. Large outdoor scenes split the distance in front of the camera into several slices (cascades), high resolution near and low far; the tell-tale signs are crisp nearby shadows, coarse or jagged distant shadows, and sometimes visible seams between cascades.", "notThis": "The shadow is the effect (REN-25 Cast shadows); shadow mapping is the method. Not contact shadows (LGT-09, which add only small shadows at contact points) and not baked lighting (LGT-06, which does not follow moving objects).", "use": "Large outdoor scenes, a moving sun in a day-night cycle, dynamic objects that need real-time shadows.", "prompt": "Use 3 shadow cascades for the game's sun: 2048×2048 each, split at 0–12 m, 12–40 m and 40–120 m (log/linear blend ≈ 0.7); snap each cascade's light projection to its texel size so shadow edges do not shimmer as the camera moves; blend cascades over a 2 m transition band; soften edges with 3×3 PCF; add a debug mode that tints cascades red, green and blue."}, "ja": {"name": "シャドウマップとカスケードシャドウ（CSM）", "observe": "リアルタイムの影の主流の方式。まず光源から見た深度画像を描き、各ピクセルが遮られているか判定する。広い屋外ではカメラ前方の距離をいくつかの区間（カスケード）に分け、近くは高解像度、遠くは低解像度にする。近くの影はくっきり、遠くの影は粗くギザギザになり、区間の境目に継ぎ目が見えることもある、というのが見分けるポイント。", "notThis": "影そのものは効果（REN-25 Cast shadows）で、シャドウマップはその方法。コンタクトシャドウ（LGT-09、接地部の細かい影だけを補う）や、ベイクドライティング（LGT-06、動く物体に追従しない）とは違う。", "use": "広い屋外、昼夜サイクルで動く太陽、リアルタイムの影が必要な動的オブジェクト。", "prompt": "ゲームの太陽光に 3 段のカスケードシャドウを使って：各段 2048×2048、区切りは 0〜12 m・12〜40 m・40〜120 m（対数と線形の混合 ≈ 0.7）。カメラが動いても影の縁がちらつかないよう、各段の光源投影をテクセル単位にスナップ。段の間は 2 m 幅で混ぜ、3×3 PCF で縁を柔らかくする。各段を赤・緑・青で塗るデバッグ表示も用意する。"}, "params": "cascade count · split distances / lambda · resolution per cascade · depth bias & normal bias · PCF kernel · blend band · texel snapping", "impl": "Per cascade: fit an orthographic light frustum around the camera sub-frustum, render depth to a slice of a Texture2DArray. In the pixel shader pick the cascade by view depth, project into light space and compare with SampleCmp (comparison sampler) for hardware PCF. Tune depth/slope bias against acne vs peter-panning.", "related": ["REN-25 Cast shadows", "LGT-09", "LGT-06", "ENV-01"], "refs": [{"t": "Wikipedia — Shadow mapping", "u": "https://en.wikipedia.org/wiki/Shadow_mapping"}, {"t": "LearnOpenGL — Cascaded shadow mapping", "u": "https://learnopengl.com/Guest-Articles/2021/CSM"}, {"t": "Unity Manual — Shadow cascades", "u": "https://docs.unity3d.com/Manual/shadow-cascades.html"}, {"t": "Godot docs — 3D lights and shadows", "u": "https://docs.godotengine.org/en/stable/tutorials/3d/lights_and_shadows.html"}], "nosrc": false}, {"id": "LGT-09", "cat": "LGT", "sub": "間接光與陰影", "std": "Contact shadows", "aliases": ["Screen-space shadows", "Micro shadows", "Contact hardening"], "type": "S", "zh": {"name": "接觸陰影（螢幕空間陰影）", "observe": "在物件和地面、牆壁接觸的地方補上一道短而清楚的陰影：角色的腳底、杯子底部、手指間的縫隙不再「浮」起來。主陰影（陰影貼圖）解析度不夠或因偏移而離地時，最明顯的改善就是腳底多了一條實在的暗線。", "notThis": "不是環境光遮蔽（REN-21 Ambient occlusion，不分方向地壓暗縫隙）；接觸陰影沿著光源方向投射，所以方向會隨光改變。也不是圓形假影（LGT-10，貼在地上的固定圓形）。", "use": "角色站立感、細小物件（草、碎石、道具）、陰影貼圖解析度不足的遠景或細節。", "prompt": "為遊戲的主光加入接觸陰影：在螢幕空間中，從每個像素沿光源方向以 16 步、總長 0.3 m 步進深度緩衝，若中途遇到比射線更靠近鏡頭、厚度在 0.05 m 內的像素就判定為陰影；結果與陰影貼圖相乘。只對主平行光與最近 4 個點光源啟用。"}, "en": {"name": "Contact shadows (screen-space shadows)", "observe": "A short, crisp shadow is added where objects touch the ground or walls: a character's feet, the bottom of a cup and the gaps between fingers no longer look like they float. When the main shadow map is too low-res or detached by bias, the clearest improvement is a solid dark line under the feet.", "notThis": "Not ambient occlusion (REN-21 Ambient occlusion, which darkens crevices regardless of direction); contact shadows are cast along the light direction and move when the light moves. Not a blob shadow (LGT-10, a fixed disc on the ground).", "use": "Grounding characters, small details (grass, pebbles, props), distant or fine detail where shadow-map resolution is insufficient.", "prompt": "Add contact shadows to the game's key light: in screen space, march the depth buffer from each pixel towards the light in 16 steps over 0.3 m; if a sample is closer to the camera than the ray and within 0.05 m thickness, mark it shadowed; multiply the result with the shadow map. Enable only for the main directional light and the nearest 4 point lights."}, "ja": {"name": "コンタクトシャドウ（スクリーンスペースシャドウ）", "observe": "物体が地面や壁に触れる所に、短くはっきりした影を足す。キャラの足元、コップの底、指の間のすき間が「浮いて」見えなくなる。メインの影（シャドウマップ）の解像度が足りなかったりバイアスで地面から離れたりしている時、足元に確かな暗い線が加わるのが最も分かりやすい改善。", "notThis": "アンビエントオクルージョン（REN-21 Ambient occlusion、方向に関係なくすき間を暗くする）ではなく、コンタクトシャドウは光の向きに沿って落ちるので光が動けば向きも変わる。丸影（LGT-10、地面に貼った決まった円）とも違う。", "use": "キャラの接地感、小さな物（草・小石・小物）、シャドウマップの解像度が足りない遠景や細部。", "prompt": "ゲームのメインライトにコンタクトシャドウを入れて：スクリーンスペースで各ピクセルから光源方向へ合計 0.3 m を 16 ステップで深度バッファをたどり、レイよりカメラに近く厚み 0.05 m 以内のピクセルに当たったら影とする。結果はシャドウマップと掛け合わせる。メインの平行光と最寄りの点光源 4 つだけに有効にする。"}, "params": "ray length · step count · thickness · fade with distance · which lights · jitter + temporal filter", "impl": "Fullscreen or per-light pass: reconstruct view position from depth, ray-march towards the light in view space, project each step to screen, compare against the depth buffer with a thickness threshold. Jitter the start per pixel and denoise/TAA to hide banding. Multiply into the light's shadow term.", "related": ["LGT-08", "REN-21 Ambient occlusion", "LGT-10", "REN-25 Cast shadows"], "refs": [{"t": "Unreal Engine docs — Contact Shadows", "u": "https://dev.epicgames.com/documentation/en-us/unreal-engine/contact-shadows-in-unreal-engine"}, {"t": "Unity HDRP docs — Contact Shadows", "u": "https://docs.unity3d.com/Packages/com.unity.render-pipelines.high-definition@17.0/manual/Override-Contact-Shadows.html"}], "nosrc": false}, {"id": "LGT-10", "cat": "LGT", "sub": "間接光與陰影", "std": "Blob shadow", "aliases": ["Drop shadow", "Fake shadow", "Circle shadow", "Shadow decal"], "type": "S", "zh": {"name": "圓形假影（Blob shadow）", "observe": "角色、道具腳下貼著一塊柔和的深色橢圓，不管光從哪裡來都一樣；它不反映角色的形狀，但能清楚告訴玩家「物件在地面的哪一點」。跳起時影子留在地面並變小變淡。", "notThis": "不是真實投影（LGT-08／REN-25 Cast shadows，形狀與方向跟著光源）；也不是接觸陰影（LGT-09，沿光方向的細線）。和假高度（PIX-18）的關係：假高度是「把物件畫高、影子留地」的空間做法，圓形假影是那塊影子本身的畫法，也常用在 3D。", "use": "平台跳躍判斷落點、俯視角色、行動裝置與復古風格、大量單位（RTS）時取代昂貴的即時陰影。", "prompt": "為遊戲的角色與敵人加入圓形假影：在角色腳下（地面高度）畫一個柔邊橢圓，寬度 = 角色寬度 × 0.9、高度 = 寬度 × 0.4，中心不透明度 45%、邊緣淡到 0；離地時寬度按 1 / (1 + 高度 × 0.15) 縮小、不透明度同步下降，最低 15%。在 3D 中以向下投射的貼花實作，並在斜坡上貼合地形。"}, "en": {"name": "Blob shadow", "observe": "A soft dark ellipse sits under characters and props, the same whatever the light direction; it does not follow the character's shape, but tells the player clearly where the object is on the ground. When jumping, the shadow stays on the ground and shrinks and fades.", "notThis": "Not a real cast shadow (LGT-08 / REN-25 Cast shadows, which follow the light's shape and direction) and not a contact shadow (LGT-09, a thin line along the light direction). Versus fake height (PIX-18): fake height is the spatial trick of drawing the object higher while the shadow stays down; the blob shadow is how that shadow itself is drawn, and is common in 3D too.", "use": "Judging landing spots in platformers, top-down characters, mobile and retro styles, replacing costly real-time shadows when there are many units (RTS).", "prompt": "Add blob shadows to the game's characters and enemies: draw a soft ellipse at ground level under each one, width = character width × 0.9, height = width × 0.4, 45% opacity at the centre fading to 0 at the edge; when airborne scale width by 1 / (1 + height × 0.15) and lower opacity with it, minimum 15%. In 3D implement it as a downward-projected decal that conforms to slopes."}, "ja": {"name": "丸影（ブロブシャドウ）", "observe": "キャラや小物の足元に柔らかい暗い楕円を置く。光の向きに関係なく同じで、キャラの形も反映しないが、「物体が地面のどこにいるか」をはっきり伝える。ジャンプすると影は地面に残り、小さく薄くなる。", "notThis": "本物の投影（LGT-08／REN-25 Cast shadows、形と向きが光源に従う）でも、コンタクトシャドウ（LGT-09、光の向きに沿った細い線）でもない。疑似高さ（PIX-18）との関係：疑似高さは「物体を高く描き影を地面に残す」空間の手法で、丸影はその影自体の描き方。3D でもよく使われる。", "use": "アクションの着地点の判断、見下ろしのキャラ、モバイルやレトロ調、ユニットが多い（RTS）時に高価なリアルタイム影の代わりに。", "prompt": "ゲームのキャラと敵に丸影を付けて：各キャラの足元（地面の高さ）に縁の柔らかい楕円を描き、幅 = キャラ幅 × 0.9、高さ = 幅 × 0.4、中心の不透明度 45% から縁で 0 へ。空中では幅を 1 / (1 + 高さ × 0.15) 倍に縮め、不透明度も合わせて下げる（最低 15%）。3D では下向きに投影するデカールで実装し、坂にも沿わせる。"}, "params": "size ratio · opacity · edge softness · shrink & fade with height · decal projection depth", "impl": "2D: a pre-blurred ellipse sprite drawn in a ground layer below sprites (multiply or alpha blend). 3D: a projected decal or a quad aligned to the ground normal from a downward raycast; scale and fade from the raycast distance. Disable it when real shadows are on to avoid double shadows.", "related": ["PIX-18", "LGT-09", "LGT-08", "REN-25 Cast shadows"], "refs": [{"t": "Godot docs — Using decals (blob shadows section)", "u": "https://docs.godotengine.org/en/stable/tutorials/3d/using_decals.html"}], "nosrc": false}, {"id": "LGT-11", "cat": "LGT", "sub": "渲染管線", "std": "Forward+, clustered and deferred shading", "aliases": ["Tiled forward", "Forward+", "Clustered shading", "Deferred rendering", "Light culling"], "type": "S", "zh": {"name": "多光源渲染管線（Forward+／Clustered／Deferred）", "observe": "畫面上可以同時有數十到數百個動態光源（子彈、魔法、街燈、爆炸）而不明顯掉幀。這是管線層面的做法：把畫面切成格子（Tiled／Forward+）或再按深度分層（Clustered），只對影響該格的光源計算；Deferred 則先把表面資料寫進 G-buffer 再逐光計算。在畫面上看不到格子，除錯熱圖才看得到。", "notThis": "不是單一光源的效果（LGT-01／LGT-02）；這是決定「能放多少光、哪些材質效果可用」的渲染架構。Deferred 對透明物件與 MSAA 較不友善，Forward+ 則較易支援。", "use": "大量動態光的場景（彈幕、夜戰、霓虹城市）、需要每個光源都即時照亮表面的遊戲。", "prompt": "為遊戲採用 Clustered（Forward+）光源剔除：把畫面分成 16×9 個格子、深度方向以對數分成 24 層；每幀用 compute shader 把光源的包圍球指定到相交的格子（每格最多 64 個光源索引），像素著色時只迴圈所屬格子的光源。提供除錯熱圖，以藍→紅顯示每格光源數。"}, "en": {"name": "Forward+, clustered and deferred shading", "observe": "The screen can hold tens to hundreds of dynamic lights at once (bullets, spells, street lamps, explosions) without an obvious frame drop. This is a pipeline technique: the screen is split into tiles (tiled / Forward+), optionally also into depth slices (clustered), and each pixel only evaluates lights that touch its tile; deferred instead writes surface data to a G-buffer first, then lights it. The grid is invisible in game; only a debug heat map shows it.", "notThis": "Not the look of a single light (LGT-01 / LGT-02); this is the rendering architecture that decides how many lights you can have and which material features work. Deferred is less friendly to transparency and MSAA; Forward+ supports them more easily.", "use": "Scenes with many dynamic lights (bullet hell, night battles, neon cities), games where every light must light surfaces in real time.", "prompt": "Use clustered (Forward+) light culling in the game: split the screen into 16×9 tiles and 24 logarithmic depth slices; each frame a compute shader assigns light bounding spheres to the clusters they intersect (up to 64 light indices per cluster), and the pixel shader loops only over its cluster's lights. Add a debug heat map showing lights per tile from blue to red."}, "ja": {"name": "多光源のレンダリングパイプライン（Forward+／Clustered／Deferred）", "observe": "画面に数十〜数百の動的光源（弾、魔法、街灯、爆発）を同時に置いても目立ってフレームが落ちない。パイプライン側の手法で、画面をタイルに分け（タイル／Forward+）、さらに奥行き方向にも分け（クラスタ）、各ピクセルは自分のタイルにかかる光源だけを計算する。Deferred は先に表面情報を G バッファに書き、その後で光を計算する。ゲーム中に格子は見えず、デバッグのヒートマップでだけ見える。", "notThis": "1 つの光源の見た目（LGT-01／LGT-02）ではなく、「光をいくつ置けるか、どの材質表現が使えるか」を決めるレンダリング構造。Deferred は半透明や MSAA と相性が悪く、Forward+ のほうが対応しやすい。", "use": "動的な光が多い場面（弾幕、夜戦、ネオン街）、すべての光源が表面をリアルタイムに照らす必要があるゲーム。", "prompt": "ゲームに Clustered（Forward+）のライトカリングを採用して：画面を 16×9 のタイル、奥行きを対数で 24 層に分ける。毎フレーム compute shader で光源の境界球を交差するクラスタに割り当て（1 クラスタ最大 64 個のインデックス）、ピクセルシェーダーは自分のクラスタの光源だけをループする。タイルごとの光源数を青→赤で示すデバッグ用ヒートマップも用意する。"}, "params": "tile size · depth slice count & distribution · max lights per cluster · light bounds (sphere / cone) · forward vs deferred · G-buffer layout", "impl": "Compute pass: build cluster AABBs in view space, test each light's bounding sphere, write a compact light-index list + per-cluster offset/count (structured buffers). Shading pass reads the cluster from (screen xy, log depth). Deferred alternative: G-buffer (albedo, normal, roughness, depth), then per-light or tiled lighting pass.", "related": ["LGT-01", "LGT-02", "VFX-02"], "refs": [{"t": "Ángel Ortiz — A primer on efficient rendering algorithms & clustered shading", "u": "https://www.aortiz.me/2018/12/21/CG.html"}, {"t": "Wikipedia — Deferred shading", "u": "https://en.wikipedia.org/wiki/Deferred_shading"}, {"t": "LearnOpenGL — Deferred shading", "u": "https://learnopengl.com/Advanced-Lighting/Deferred-Shading"}, {"t": "Godot docs — Overview of renderers (Forward+ is clustered)", "u": "https://docs.godotengine.org/en/stable/tutorials/rendering/renderers.html"}], "nosrc": false}, {"id": "LGT-12", "cat": "LGT", "sub": "大氣與體積", "std": "Height fog", "aliases": ["Exponential height fog", "Ground fog", "Altitude fog", "Valley fog"], "type": "S", "zh": {"name": "高度霧（地面霧）", "observe": "霧的濃度隨高度改變：低處（山谷、河面、地面）霧最濃，越高越稀，山頂和高塔清楚地露出霧面；站在高處往下看是一片霧海，站在谷底則四周朦朧。", "notThis": "不是一般距離霧（REN-26 Fog，只按與鏡頭的距離變濃，與高度無關）；也不是體積光（REN-27 Volumetric lighting，空氣中看得見光束）。和戰爭迷霧（ENV-15）完全不同，那是遊戲資訊的遮蓋。", "use": "清晨山谷、沼澤、恐怖場景的地面霧、強調地形高低、遮掩遠處地形的邊界。", "prompt": "為遊戲加入指數高度霧：密度 = 0.06 × e^(−(高度 − 0 m) × 0.35)，在像素著色時沿視線積分得出霧量（使用解析式，不逐步取樣）；霧色 #b8c4d0，朝太陽方向的霧色偏暖 #f0d8b0；霧面高度在 5 秒內可由 0 m 平滑升到 4 m，用於劇情轉換。天空不受高度霧影響。"}, "en": {"name": "Height fog (ground fog)", "observe": "Fog density changes with altitude: thickest down low (valleys, rivers, the ground) and thinner higher up, so mountaintops and towers stand clear above the fog layer; from above you see a sea of fog, from the valley floor everything is hazy.", "notThis": "Not plain distance fog (REN-26 Fog, which thickens only with distance from the camera, regardless of height) and not volumetric lighting (REN-27 Volumetric lighting, visible light shafts in the air). Nothing to do with fog of war (ENV-15, hiding game information).", "use": "Morning valleys, swamps, creepy ground fog, emphasising terrain height, hiding the edge of distant terrain.", "prompt": "Add exponential height fog to the game: density = 0.06 × e^(−(height − 0 m) × 0.35); integrate along the view ray analytically in the pixel shader (no ray marching); fog colour #b8c4d0, warmer #f0d8b0 towards the sun; allow the fog height to rise smoothly from 0 m to 4 m over 5 s for story moments. The sky is not affected by height fog."}, "ja": {"name": "ハイトフォグ（地面の霧）", "observe": "霧の濃さが高さで変わる。低い所（谷、川面、地面）が最も濃く、高いほど薄くなり、山頂や高い塔は霧の上にはっきり出る。高い所から見下ろすと雲海、谷底に立つと周りがかすむ。", "notThis": "普通の距離フォグ（REN-26 Fog、カメラからの距離だけで濃くなり高さは関係ない）でも、ボリューメトリックライト（REN-27 Volumetric lighting、空中に光の筋が見える）でもない。戦場の霧（ENV-15、ゲーム情報を隠す）とはまったく別物。", "use": "朝の谷、沼地、ホラーの地面の霧、地形の高低の強調、遠くの地形の端を隠す。", "prompt": "ゲームに指数ハイトフォグを入れて：密度 = 0.06 × e^(−(高さ − 0 m) × 0.35)。ピクセルシェーダーで視線に沿って解析的に積分する（レイマーチしない）。霧の色 #b8c4d0、太陽方向は暖色 #f0d8b0 に寄せる。演出用に霧の高さを 5 秒かけて 0 m から 4 m まで滑らかに上げられるように。空にはハイトフォグをかけない。"}, "params": "base density · height falloff · fog base height · start distance · colour & sun-direction inscatter colour · max opacity", "impl": "Closed-form integral of density ρ(h)=a·e^(−b·h) along the ray from camera to the pixel: fog = a·e^(−b·h_cam)·(1 − e^(−b·Δh))/(b·Δh)·dist (guard Δh≈0); opacity = 1 − e^(−fog). Apply in the forward pixel shader or a fullscreen pass that reconstructs world position from depth.", "related": ["REN-26 Fog", "REN-27 Volumetric lighting", "LGT-13", "ENV-15"], "refs": [{"t": "Unreal Engine docs — Exponential Height Fog", "u": "https://dev.epicgames.com/documentation/en-us/unreal-engine/exponential-height-fog-in-unreal-engine"}, {"t": "Godot docs — Environment and post-processing (fog)", "u": "https://docs.godotengine.org/en/stable/tutorials/3d/environment_and_post_processing.html"}], "nosrc": false}, {"id": "LGT-13", "cat": "LGT", "sub": "大氣與體積", "std": "Atmospheric scattering", "aliases": ["Sky model", "Physically based sky", "Rayleigh and Mie scattering", "Aerial perspective"], "type": "S", "zh": {"name": "大氣散射（物理天空）", "observe": "天空的顏色由模擬陽光穿過大氣層的散射計算出來：中午頭頂是深藍、地平線偏白；太陽接近地平線時，光要穿過更厚的空氣，天空與太陽變成橙紅，對面的天空轉為紫藍；遠處的山也隨距離變藍變淡（空氣透視）。太陽周圍有一圈明亮的光暈。", "notThis": "不是手調的天空漸層（ENV-02，由美術指定色標）；大氣散射是由太陽角度「算出」顏色。也不是日夜循環（ENV-01，調整整個場景的色調）；不過兩者常一起使用，由散射結果驅動日夜的光色。", "use": "開放世界、飛行與高空場景、需要自然日出日落的日夜循環、星球表面。", "prompt": "為遊戲的天空使用單次散射的大氣模型：Rayleigh 散射係數 (5.8, 13.5, 33.1) × 10⁻⁶ /m、尺度高度 8 km；Mie 散射係數 21 × 10⁻⁶ /m、尺度高度 1.2 km、g = 0.76；沿視線取 16 個樣本、往太陽方向 8 個樣本；結果預先算進 256×64 的查找表，每當太陽角度改變超過 0.5° 才更新。遠景山脈以相同模型加上空氣透視。"}, "en": {"name": "Atmospheric scattering (physically based sky)", "observe": "The sky colour is computed by simulating sunlight scattering through the atmosphere: deep blue overhead and paler at the horizon at noon; as the sun nears the horizon its light crosses more air, so the sky and sun turn orange-red and the opposite sky goes violet-blue; distant mountains also turn bluer and fainter with distance (aerial perspective). A bright halo surrounds the sun.", "notThis": "Not a hand-authored sky gradient (ENV-02, colour stops chosen by an artist); scattering derives the colours from the sun angle. Not a day-night cycle (ENV-01, tinting the whole scene), though the two are often combined so the scattering drives the day-night light colour.", "use": "Open worlds, flight and high-altitude scenes, day-night cycles with natural sunrises and sunsets, planet surfaces.", "prompt": "Use a single-scattering atmosphere model for the game's sky: Rayleigh coefficients (5.8, 13.5, 33.1) × 10⁻⁶ /m with an 8 km scale height; Mie 21 × 10⁻⁶ /m, 1.2 km scale height, g = 0.76; 16 samples along the view ray and 8 towards the sun; precompute into a 256×64 lookup table and refresh only when the sun moves more than 0.5°. Apply the same model as aerial perspective to distant mountains."}, "ja": {"name": "大気散乱（物理ベースの空）", "observe": "空の色を、太陽光が大気を通るときの散乱をシミュレーションして求める。昼は頭上が深い青で地平線は白っぽい。太陽が地平線に近づくと光がより厚い空気を通るので、空と太陽は橙赤に、反対側の空は紫がかった青になる。遠くの山も距離に応じて青く淡くなる（空気遠近法）。太陽の周りには明るい光の輪ができる。", "notThis": "手で調整する空のグラデーション（ENV-02、アーティストが色を指定）ではなく、大気散乱は太陽の角度から色を「計算」する。昼夜サイクル（ENV-01、シーン全体の色味の調整）とも違うが、散乱の結果で昼夜の光の色を決めるなど一緒に使うことが多い。", "use": "オープンワールド、飛行や高高度の場面、自然な日の出・日没のある昼夜サイクル、惑星の地表。", "prompt": "ゲームの空に単一散乱の大気モデルを使って：Rayleigh 散乱係数 (5.8, 13.5, 33.1) × 10⁻⁶ /m、スケールハイト 8 km。Mie 散乱係数 21 × 10⁻⁶ /m、スケールハイト 1.2 km、g = 0.76。視線方向に 16 サンプル、太陽方向に 8 サンプル。結果は 256×64 のルックアップテーブルに事前計算し、太陽が 0.5° 以上動いたときだけ更新。遠くの山脈にも同じモデルで空気遠近法をかける。"}, "params": "Rayleigh & Mie coefficients · scale heights · Mie anisotropy g · sun intensity · sample counts · LUT resolution · aerial-perspective strength", "impl": "Ray-march the view ray through a spherical atmosphere shell; at each sample accumulate density and the optical depth towards the sun; inscatter = Σ e^(−τ)·(β_R·P_R + β_M·P_M)·ds. Bake into transmittance / sky-view LUTs (Hillaire-style) with a compute shader and sample in the sky and fog passes.", "related": ["ENV-02", "ENV-01", "LGT-12", "REN-26 Fog"], "refs": [{"t": "GPU Gems 2 ch.16 — Accurate atmospheric scattering", "u": "https://developer.nvidia.com/gpugems/gpugems2/part-ii-shading-lighting-and-shadows/chapter-16-accurate-atmospheric-scattering"}, {"t": "Wikipedia — Rayleigh scattering", "u": "https://en.wikipedia.org/wiki/Rayleigh_scattering"}, {"t": "Unreal Engine docs — Sky Atmosphere component", "u": "https://dev.epicgames.com/documentation/en-us/unreal-engine/sky-atmosphere-component-in-unreal-engine"}], "nosrc": false}, {"id": "CIN-01", "cat": "CIN", "sub": "鏡頭語言", "std": "Letterbox", "aliases": ["Cinematic bars", "Black bars", "Widescreen bars"], "type": "S", "zh": {"name": "上下黑邊（電影黑邊）", "observe": "進入劇情或重要時刻時，畫面上下各滑入一條黑色橫條，把畫面變成更扁的寬銀幕比例；HUD 通常同時隱藏，結束時黑條再滑出。", "notThis": "不是淡出至黑（TRN-01，整個畫面變黑）；黑邊只遮上下、畫面仍在播放。也不是鏡頭推近（FB-09），黑邊不改變鏡頭本身。", "use": "告訴玩家「現在是演出、不能操作」；過場動畫、Boss 登場、重要對話。", "prompt": "在遊戲中，劇情演出開始時讓上下黑邊各以 0.4 秒 ease-out 滑入，各佔畫面高度 12%（約 2.39:1 的感覺），同時把 HUD 淡出 0.2 秒；演出結束時黑邊 0.3 秒滑出、HUD 淡回，期間鎖定玩家輸入。"}, "en": {"name": "Letterbox (cinematic bars)", "observe": "When a story moment starts, black bars slide in from the top and bottom, turning the view into a wider, cinema-like ratio; the HUD usually hides at the same time, and the bars slide back out at the end.", "notThis": "Not a fade to black (TRN-01, the whole image goes dark); bars only cover top and bottom while the scene keeps playing. Not a camera punch-in (FB-09) — the camera itself does not change.", "use": "Signals \"this is a cinematic, you are not in control\": cutscenes, boss entrances, key conversations.", "prompt": "In your game, when a story sequence starts, slide black bars in from top and bottom over 0.4 s ease-out, each 12% of screen height (≈2.39:1 feel), and fade the HUD out over 0.2 s; at the end slide the bars out over 0.3 s and fade the HUD back; lock player input meanwhile."}, "ja": {"name": "レターボックス（シネマバー）", "observe": "イベントや重要な場面が始まると、画面の上下から黒い帯がスライドして入り、映画のような横長の比率になる。HUD も同時に消え、終わると帯が出ていく。", "notThis": "黒へのフェード（TRN-01、画面全体が暗くなる）とは違い、上下だけを隠し映像は動き続ける。カメラの寄り（FB-09）とも違い、カメラ自体は変わらない。", "use": "「今は演出中で操作できない」と伝える。カットシーン、ボス登場、重要な会話。", "prompt": "ゲームでイベント演出が始まったら、上下の黒帯をそれぞれ 0.4 秒 ease-out でスライドインして（各画面高さの 12%、約 2.39:1 の印象）、HUD を 0.2 秒でフェードアウト。終了時は 0.3 秒で帯をスライドアウトし HUD を戻す。その間プレイヤー入力はロック。"}, "params": "bar height % (8–14) · slide in/out time · easing · HUD fade · input lock", "impl": "Two screen-space black quads drawn after the scene and before (or instead of) the HUD; animate their height with a 0→1 parameter. Keep the camera viewport unchanged so gameplay framing does not jump.", "related": ["CIN-02", "CIN-03", "TRN-01", "FB-09"], "refs": [{"t": "Wikipedia — Letterboxing (filming)", "u": "https://en.wikipedia.org/wiki/Letterboxing_(filming)"}, {"t": "Wikipedia — Aspect ratio (image)", "u": "https://en.wikipedia.org/wiki/Aspect_ratio_(image)"}], "nosrc": false}, {"id": "CIN-02", "cat": "CIN", "sub": "鏡頭語言", "std": "Cutscene", "aliases": ["In-engine cinematic", "Real-time cutscene", "Scripted sequence", "Cinematic"], "type": "S", "zh": {"name": "過場動畫（即時渲染）", "observe": "玩家暫時失去控制，角色按劇本移動、說話、做動作，鏡頭有剪接與運鏡；畫面用遊戲本身的引擎與素材即時畫出，所以角色外觀與遊戲中一致。", "notThis": "不是預先錄好的影片（FMV／預渲染）；即時過場用同一套場景和角色。也不是劇本控制鏡頭（CIN-03），後者只接管鏡頭、玩家可能仍可操作。", "use": "交代劇情、角色登場、任務開始／結束、章節之間。", "prompt": "在遊戲中做一個即時過場：用時間軸（timeline）排好 3 個鏡頭——遠景 2 秒、角色中景 3 秒、對話特寫 4 秒——角色走位用路徑點；開始時上黑邊（CIN-01）並鎖定輸入，按住確認鍵 1 秒可跳過，結束時把鏡頭平滑交還給玩家（0.6 秒混合）。"}, "en": {"name": "Cutscene (in-engine cinematic)", "observe": "The player temporarily loses control while characters move, talk and act to a script, with camera cuts and moves; it is rendered live with the game’s own engine and assets, so characters look the same as in play.", "notThis": "Not pre-recorded video (FMV / pre-rendered); an in-engine cutscene uses the same scene and characters. Not a scripted camera (CIN-03), which only takes over the camera and may leave the player in control.", "use": "Story beats, character introductions, mission start/end, between chapters.", "prompt": "In your game, build an in-engine cutscene: on a timeline, sequence 3 shots — wide 2 s, medium on the character 3 s, close-up for the dialogue 4 s — with characters moving along waypoints; add letterbox bars (CIN-01) and lock input at the start, allow skipping by holding Confirm for 1 s, and blend the camera back to gameplay over 0.6 s at the end."}, "ja": {"name": "カットシーン（リアルタイム演出）", "observe": "プレイヤーが一時的に操作できなくなり、キャラクターが台本どおりに動き・話し・演技し、カメラのカット割りやカメラワークが入る。ゲームのエンジンと素材でその場で描画されるため、見た目はプレイ中と同じ。", "notThis": "事前に録画した映像（FMV／プリレンダー）とは違い、同じシーンとキャラクターを使う。スクリプトカメラ（CIN-03）とも違い、そちらはカメラだけを奪いプレイヤーは操作できる場合がある。", "use": "ストーリーの説明、キャラクター登場、ミッション開始／終了、章の間。", "prompt": "ゲームにリアルタイムのカットシーンを作って：タイムライン上に 3 ショット（引き 2 秒、キャラの中景 3 秒、会話のアップ 4 秒）を並べ、キャラはウェイポイントで移動。開始時にレターボックス（CIN-01）を出して入力をロック、決定ボタン 1 秒長押しでスキップ可能、終了時は 0.6 秒のブレンドでカメラをプレイヤーに戻す。"}, "params": "shot list & durations · cut vs blend · skip rule · letterbox · camera hand-back blend", "impl": "A timeline asset of tracks (camera, actor transforms/animations, dialogue, audio events) evaluated by time each frame; gameplay systems paused or set to \"cinematic\" state. Make evaluation pure in time so scrubbing and skipping are trivial.", "related": ["CIN-01", "CIN-03", "CIN-05", "TRN-13"], "refs": [{"t": "Wikipedia — Cutscene", "u": "https://en.wikipedia.org/wiki/Cutscene"}, {"t": "Unity — Timeline package manual", "u": "https://docs.unity3d.com/Packages/com.unity.timeline@1.8/manual/index.html"}, {"t": "Unreal Engine docs — Cinematics and movie making", "u": "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematics-and-movie-making-in-unreal-engine"}], "nosrc": false}, {"id": "CIN-03", "cat": "CIN", "sub": "鏡頭語言", "std": "Scripted camera", "aliases": ["Camera takeover", "Camera override", "Cinematic camera blend"], "type": "C", "zh": {"name": "劇本控制鏡頭", "observe": "某個事件觸發時，鏡頭暫時不再跟隨玩家，而是自動平移或拉遠去展示某個目標（打開的門、出現的敵人、遠方地標），停留一會後再平滑回到玩家身上。", "notThis": "不是過場動畫（CIN-02）；這裡通常只接管鏡頭、時間不一定停、角色不演戲。也不是鏡頭推近（FB-09，短暫的打擊回饋）。", "use": "「機關打開了在哪裡」、指示新目標、展示 Boss 房、引導視線。", "prompt": "在遊戲中，玩家拉下拉桿後讓鏡頭接管：0.8 秒 ease-in-out 平移到被打開的門，停留 1.2 秒（門的開啟動畫在此播放），再 0.8 秒回到玩家；期間玩家輸入鎖定、敵人暫停，畫面角落顯示「按 B 跳過」。"}, "en": {"name": "Scripted camera (camera takeover)", "observe": "When an event fires, the camera stops following the player and automatically pans or pulls out to show a target (a door that opened, an enemy arriving, a distant landmark), holds, then glides back to the player.", "notThis": "Not a cutscene (CIN-02); usually only the camera is taken over — time may keep running and characters do not perform. Not a camera punch-in (FB-09, a brief hit reaction).", "use": "Showing what a switch opened, pointing out a new objective, revealing a boss room, guiding the eye.", "prompt": "In your game, after the player pulls a lever, take over the camera: pan to the opened door over 0.8 s ease-in-out, hold 1.2 s (the door animation plays here), then return to the player over 0.8 s; lock input and pause enemies meanwhile, and show \"B to skip\" in a corner."}, "ja": {"name": "スクリプトカメラ（カメラの乗っ取り）", "observe": "イベントが起きるとカメラがプレイヤー追従をやめ、自動でパンや引きをして対象（開いた扉、現れた敵、遠くのランドマーク）を見せ、少し止まってから滑らかにプレイヤーへ戻る。", "notThis": "カットシーン（CIN-02）とは違い、通常はカメラだけを奪い、時間は止まらないこともあり、キャラは演技しない。カメラの寄り（FB-09、短い打撃フィードバック）とも違う。", "use": "スイッチで何が開いたか示す、新しい目的地を指す、ボス部屋を見せる、視線誘導。", "prompt": "ゲームで、レバーを引いたらカメラを乗っ取って：0.8 秒 ease-in-out で開いた扉までパン、1.2 秒停止（ここで扉の開くアニメ）、0.8 秒でプレイヤーへ戻る。その間入力をロックし敵を停止、隅に「B でスキップ」を表示。"}, "params": "travel time · easing · hold time · return blend · input/AI pause · skippable", "impl": "Camera \"director\" with prioritised virtual cameras: the event raises a scripted camera’s priority, the brain blends position/zoom between them (ease curve), then lowers it again. Keep the gameplay camera updating underneath so the return blend lands on the right spot.", "related": ["CIN-02", "CIN-01", "FB-09", "TRN-16"], "refs": [{"t": "Cinemachine 3.1 — Camera control and transitions", "u": "https://docs.unity3d.com/Packages/com.unity.cinemachine@3.1/manual/concept-camera-control-transitions.html"}, {"t": "Cinemachine 3.1 — Blending between cameras", "u": "https://docs.unity3d.com/Packages/com.unity.cinemachine@3.1/manual/CinemachineBlending.html"}, {"t": "Unreal Engine docs — Cinematic cameras", "u": "https://dev.epicgames.com/documentation/en-us/unreal-engine/cinematic-cameras-in-unreal-engine"}], "nosrc": false}, {"id": "CIN-04", "cat": "CIN", "sub": "鏡頭語言", "std": "Kill cam", "aliases": ["Killcam", "Death replay", "Finisher cam", "Instant replay"], "type": "S", "zh": {"name": "擊殺回放鏡頭", "observe": "角色被擊倒（或打出最後一擊）後，畫面重播剛才幾秒，常改成攻擊者視角或特寫，配慢動作、色調變化與「REPLAY」標示，讓玩家看清發生了什麼。", "notThis": "不是終結停格（FB-11，畫面停住而不回放）；擊殺回放會倒帶重播。也不是慢動作（FB-10，即時發生、不重播）。", "use": "對戰遊戲中解釋「我是怎樣死的」、精彩的最後一擊、終結技的電影化特寫。", "prompt": "在遊戲中，玩家被擊倒後播放擊殺回放：保留最近 4 秒的位置與動畫快照，從擊倒前 3 秒開始以 0.5 倍速重播，鏡頭切到攻擊者肩後，畫面略為去飽和（-40%），左上角顯示紅色「REPLAY」並閃爍；任何按鍵可跳過，回放長度不超過重生倒數。"}, "en": {"name": "Kill cam (death replay)", "observe": "After a character is defeated (or lands the final blow), the last few seconds replay, often from the attacker’s viewpoint or a close-up, with slow motion, a colour shift and a \"REPLAY\" tag so the player sees what happened.", "notThis": "Not a freeze-frame finisher (FB-11, the frame stops but does not rewind); a kill cam rewinds and replays. Not slow motion (FB-10, which happens live without replay).", "use": "Explaining \"how did I die\" in competitive games, showing off a great final blow, cinematic close-ups of finishers.", "prompt": "In your game, play a kill cam when the player is defeated: keep snapshots of positions and animation for the last 4 s, replay from 3 s before the defeat at 0.5× speed with the camera behind the attacker’s shoulder, desaturate the image by 40%, and blink a red \"REPLAY\" tag top-left; any key skips, and the replay never runs longer than the respawn timer."}, "ja": {"name": "キルカム（撃破リプレイ）", "observe": "キャラが倒された（または最後の一撃を決めた）後、直前の数秒がリプレイされる。攻撃者視点やアップに切り替わり、スロー・色調変化・「REPLAY」表示が付くことが多く、何が起きたかを見せる。", "notThis": "フィニッシュ静止（FB-11、止まるが巻き戻さない）とは違い、巻き戻して再生する。スローモーション（FB-10、その場で起き再生し直さない）とも違う。", "use": "対戦ゲームで「どうやって倒されたか」の説明、見事な最後の一撃、フィニッシュ技の映像的なアップ。", "prompt": "ゲームで、プレイヤーが倒されたらキルカムを再生して：直近 4 秒の位置とアニメのスナップショットを保持し、撃破 3 秒前から 0.5 倍速で再生、カメラは攻撃者の肩越し、画面の彩度を 40% 下げ、左上に赤い「REPLAY」を点滅表示。任意のキーでスキップ、長さはリスポーン待ち時間を超えないこと。"}, "params": "buffer length · replay start offset · playback speed · viewpoint · grade/desaturation · skip & respawn deadline", "impl": "A ring buffer of per-entity snapshots (transform, anim state, events) recorded every tick; on trigger, render a separate playback world from the buffer with interpolation, isolated from live simulation and networking.", "related": ["FB-11", "FB-10", "CIN-03", "FB-09"], "refs": [{"t": "GDC Vault — Replay Technology in Overwatch: Kill Cam, Gameplay, and Highlights", "u": "https://gdcvault.com/play/1024053/Replay-Technology-in-Overwatch-Kill"}, {"t": "Devtricks — Implementing instant replays (killcam)", "u": "https://vorixo.github.io/devtricks/killcam/"}, {"t": "Wikipedia — Instant replay", "u": "https://en.wikipedia.org/wiki/Instant_replay"}], "nosrc": false}, {"id": "CIN-05", "cat": "CIN", "sub": "角色與對白", "std": "Dialogue portrait", "aliases": ["Talking head", "Character portrait", "Face graphic", "Bust portrait"], "type": "C", "zh": {"name": "對白頭像", "observe": "對話框旁邊顯示說話角色的大頭像或半身像，表情會隨台詞改變（開心、生氣、驚訝），說話時嘴巴開合或頭像輕微彈跳；換人說話時頭像切換或另一側的頭像變暗。", "notThis": "不是對話氣泡（CIN-06，文字跟著場景中的角色）；頭像固定在畫面介面上。也不是頭頂表情氣泡（CIN-07，只有符號沒有台詞）。", "use": "角色在場景中太小看不清表情時、重要劇情對話、視覺小說式演出。", "prompt": "在遊戲中為對話框加入頭像：96×96 px 頭像放在對話框左側，每個角色至少 4 種表情（普通、笑、怒、驚），依台詞標籤切換；文字逐字出現時頭像每 0.12 秒切換張嘴／閉嘴，並在換表情時上下彈 3 px；非說話者的頭像調暗 40%。"}, "en": {"name": "Dialogue portrait (talking head)", "observe": "A large face or bust portrait of the speaker sits beside the dialogue box; its expression changes with the line (happy, angry, surprised), the mouth flaps or the portrait bobs while talking, and the portrait swaps or dims when someone else speaks.", "notThis": "Not a speech bubble (CIN-06, text attached to the character in the scene); the portrait is fixed in the UI. Not an emote balloon (CIN-07, a symbol with no line of text).", "use": "When characters are too small on screen to read faces, key story dialogue, visual-novel-style scenes.", "prompt": "In your game, add portraits to the dialogue box: a 96×96 px portrait left of the box, at least 4 expressions per character (neutral, smile, angry, surprised) switched by tags in the script; while text types out, toggle mouth open/closed every 0.12 s, bob the portrait 3 px on an expression change, and dim the non-speaking portrait by 40%."}, "ja": {"name": "会話の顔グラフィック（バストアップ）", "observe": "会話ウィンドウの横に話し手の顔やバストアップが表示され、台詞に合わせて表情（喜び・怒り・驚き）が変わる。話している間は口パクや軽い跳ねがあり、話者が替わると顔が切り替わるか反対側が暗くなる。", "notThis": "吹き出し（CIN-06、シーン内のキャラに付く文字）とは違い、顔は UI に固定。エモートバルーン（CIN-07、記号だけで台詞はない）とも違う。", "use": "キャラが画面上で小さく表情が読めない時、重要な会話、ノベルゲーム風の演出。", "prompt": "ゲームの会話ウィンドウに顔グラを追加して：96×96 px の顔をウィンドウ左に、各キャラ最低 4 表情（通常・笑い・怒り・驚き）を台本のタグで切り替え。文字送り中は 0.12 秒ごとに口の開閉、表情が変わる時に 3 px 跳ねさせ、話していない側の顔は 40% 暗く。"}, "params": "portrait size · expression set · mouth-flap interval · speaker dimming · enter/exit slide · text speed", "impl": "UI layer: portrait atlas indexed by (character, expression, mouth frame); dialogue script lines carry speaker and expression tags; the typewriter drives the mouth frame while characters are being revealed.", "related": ["CIN-06", "CIN-07", "CIN-02", "CIN-08"], "refs": [{"t": "RPG Maker MV help — Messages (Show Text with a face image)", "u": "https://rpgmakerofficial.com/product/MV_Help/page/01_10_01.html"}, {"t": "Voodoo Detective devblog — Talking heads", "u": "https://voodoodetective.com/blog/talking-heads"}, {"t": "Yarn Spinner docs — Snaaake talking-head presenter", "u": "https://www.yarnspinner.dev/docs/godot/gdscript/08-yarn-spinner-plus-and-add-ons/02-snaaake/"}], "nosrc": false}, {"id": "CIN-06", "cat": "CIN", "sub": "角色與對白", "std": "Speech bubble", "aliases": ["Speech balloon", "Dialogue balloon", "Word balloon"], "type": "S", "zh": {"name": "對話氣泡", "observe": "台詞出現在角色頭上一個帶尖角（尾巴）的圓角框內，尖角指向說話者；氣泡跟著角色在場景中移動，文字逐字出現，說完後淡出或等玩家按鍵。", "notThis": "不是對白頭像（CIN-05，台詞在畫面底部固定的介面框）；氣泡屬於場景、跟著角色。也不是頭頂表情氣泡（CIN-07，只有符號）。", "use": "多人同時說話、小型對話、不想打斷遊戲的旁白、漫畫風格演出。", "prompt": "在遊戲中把 NPC 台詞顯示為對話氣泡：白底、2 px 深色描邊、6 px 圓角，內距 6 px，最大寬度 160 px 自動換行；尾巴指向說話者頭頂，氣泡浮在頭上 8 px 並限制在畫面內；以每秒 30 字逐字顯示，彈出時 0.12 秒由 0.6 倍放大到 1 倍。"}, "en": {"name": "Speech bubble", "observe": "The line appears in a rounded box with a pointed tail above the character, the tail pointing at the speaker; the bubble moves with the character in the scene, text types out, then fades or waits for a button press.", "notThis": "Not a dialogue portrait (CIN-05, text in a fixed UI box at the bottom); the bubble belongs to the scene and follows the character. Not an emote balloon (CIN-07, symbol only).", "use": "Several people talking at once, small talk, commentary that should not interrupt play, comic-style scenes.", "prompt": "In your game, show NPC lines as speech bubbles: white fill, 2 px dark outline, 6 px corner radius, 6 px padding, max width 160 px with word wrap; tail pointing at the speaker’s head, bubble floating 8 px above it and clamped inside the screen; type at 30 characters/s and pop in from 0.6× to 1× scale over 0.12 s."}, "ja": {"name": "吹き出し（フキダシ）", "observe": "台詞がキャラの頭上にある、しっぽ付きの角丸の枠に表示され、しっぽが話し手を指す。吹き出しはキャラと一緒にシーン内を動き、文字送りの後にフェードするかボタン入力を待つ。", "notThis": "会話の顔グラフィック（CIN-05、画面下の固定 UI 枠）とは違い、シーンに属しキャラについていく。エモートバルーン（CIN-07、記号だけ）とも違う。", "use": "複数人の同時会話、ちょっとした会話、プレイを止めたくないつぶやき、漫画風の演出。", "prompt": "ゲームで NPC の台詞を吹き出しで表示して：白地、2 px の濃い縁取り、角丸 6 px、余白 6 px、最大幅 160 px で自動改行。しっぽは話し手の頭を指し、吹き出しは頭上 8 px に浮かべて画面内に収める。毎秒 30 文字で文字送り、出現時は 0.12 秒で 0.6 倍→1 倍に拡大。"}, "params": "padding · max width · tail position · offset above head · screen clamping · type speed · pop-in scale", "impl": "World-anchored UI: project the speaker’s head position to screen each frame, build a 9-slice box sized from the wrapped text, attach a tail sprite pointing toward the anchor, and clamp the box to the safe area.", "related": ["CIN-05", "CIN-07", "CIN-08"], "refs": [{"t": "Wikipedia — Speech balloon", "u": "https://en.wikipedia.org/wiki/Speech_balloon"}], "nosrc": false}, {"id": "CIN-07", "cat": "CIN", "sub": "角色與對白", "std": "Emote balloon", "aliases": ["Emotion bubble", "Balloon icon", "Emote icon", "Reaction icon"], "type": "C", "zh": {"name": "頭頂表情氣泡", "observe": "角色頭上短暫彈出一個小氣泡，裡面只有一個符號：「！」（發現）、「？」（疑惑）、汗滴、愛心、音符、「…」或怒氣符號；氣泡彈出、停留約 1 秒後消失，不需要文字。", "notThis": "不是對話氣泡（CIN-06，裡面是台詞）；也不是對白頭像（CIN-05）。與傷害數字（FB-02）不同，它表達情緒而不是數值。", "use": "敵人發現玩家、NPC 的反應、無台詞的情緒表達、劇情中的小動作。", "prompt": "在遊戲中加入頭頂表情氣泡：16×16 px 的白色氣泡浮在角色頭上 4 px，內含像素符號（! ? ♥ ♪ … 汗滴 怒氣）；出現時 0.1 秒由 0 放大到 1.2 倍再回到 1 倍，停留 0.9 秒，最後 0.15 秒淡出；敵人發現玩家時顯示紅色「!」並上下彈一次。"}, "en": {"name": "Emote balloon (emotion bubble)", "observe": "A small bubble briefly pops up above a character containing only a symbol: \"!\" (noticed), \"?\" (confused), a sweat drop, a heart, a music note, \"…\" or an anger mark; it pops, holds about a second, then disappears — no text needed.", "notThis": "Not a speech bubble (CIN-06, which contains a line of dialogue) nor a dialogue portrait (CIN-05). Unlike damage numbers (FB-02), it expresses feeling, not a value.", "use": "An enemy spotting the player, NPC reactions, wordless emotion, small acting beats in story scenes.", "prompt": "In your game, add emote balloons: a 16×16 px white bubble 4 px above the character’s head with a pixel symbol inside (! ? ♥ ♪ … sweat, anger); pop in from 0 to 1.2× and back to 1× over 0.1 s, hold 0.9 s, fade out over the last 0.15 s; when an enemy spots the player show a red \"!\" with one bounce."}, "ja": {"name": "エモートバルーン（感情アイコン）", "observe": "キャラの頭上に小さな吹き出しが一瞬現れ、中には記号だけが入っている：「！」（気づき）、「？」（疑問）、汗、ハート、音符、「…」、怒りマーク。ポンと出て約 1 秒で消え、文字は要らない。", "notThis": "吹き出し（CIN-06、台詞が入る）や会話の顔グラ（CIN-05）とは違う。ダメージ数値（FB-02）とも違い、数値ではなく感情を表す。", "use": "敵がプレイヤーに気づく、NPC のリアクション、台詞なしの感情表現、イベント中のちょっとした演技。", "prompt": "ゲームにエモートバルーンを追加して：16×16 px の白い吹き出しを頭上 4 px に、中にドット記号（! ? ♥ ♪ … 汗 怒り）。出現は 0.1 秒で 0→1.2 倍→1 倍、0.9 秒保持、最後の 0.15 秒でフェードアウト。敵がプレイヤーに気づいたら赤い「!」を 1 回弾ませて表示。"}, "params": "icon set · bubble size · offset · pop overshoot · hold time · fade · colour per meaning", "impl": "Small world-anchored sprite (atlas of balloon frames) attached to the character’s head bone/anchor; a tiny state machine (pop → hold → fade) drives scale and alpha. Trigger from AI perception or the dialogue script.", "related": ["CIN-06", "CIN-05", "CIN-08", "FB-02"], "refs": [{"t": "RPG Maker MV help — Character commands (Show Balloon Icon)", "u": "https://rpgmakerofficial.com/product/MV_Help/page/01_10_07.html"}], "nosrc": false}, {"id": "CIN-08", "cat": "CIN", "sub": "角色與對白", "std": "Barks", "aliases": ["Bark lines", "Ambient dialogue", "Callouts", "One-liners"], "type": "S", "zh": {"name": "角色短句喊話", "observe": "角色在遊玩中自動喊出的短句，由狀態或事件觸發（發現敵人、受傷、換彈、閒聊），不暫停遊戲、不需要玩家回應；畫面上常以短暫的字幕或頭上小字出現，幾秒後消失。", "notThis": "不是對話（CIN-05/06 需要玩家閱讀或按鍵推進）；喊話是即時、系統觸發、可被打斷的。也不是頭頂表情氣泡（CIN-07，只有符號）。", "use": "讓世界有生氣、讓 AI 看起來更聰明、提示敵人狀態（「他在那邊！」）、隊友提醒。", "prompt": "在遊戲中加入喊話系統：事件（發現玩家、受傷、失去目標、閒置 20 秒）各有 3–5 句短句，隨機挑選且同一句 30 秒內不重複；同時最多 2 句，每個角色喊完後冷卻 4 秒；以小字幕顯示在角色頭上 12 px，1.8 秒後淡出，不暫停遊戲。"}, "en": {"name": "Barks", "observe": "Short lines characters shout automatically during play, triggered by state or events (spotting an enemy, getting hurt, reloading, idle chatter); they do not pause the game or need a reply, and usually appear as a brief subtitle or small text above the head that fades after a few seconds.", "notThis": "Not conversation (CIN-05/06 need the player to read or press to advance); barks are real-time, system-triggered and interruptible. Not an emote balloon (CIN-07, symbol only).", "use": "Making the world feel alive, making AI look smarter, telegraphing enemy state (\"Over there!\"), companion callouts.", "prompt": "In your game, add a bark system: each event (player spotted, hurt, lost target, idle 20 s) has 3–5 short lines chosen at random with no repeat of the same line within 30 s; at most 2 barks at once and a 4 s per-character cooldown; show them as small subtitles 12 px above the speaker that fade after 1.8 s, without pausing the game."}, "ja": {"name": "バーク（掛け声・一言ボイス）", "observe": "プレイ中にキャラが自動で発する短い台詞。状態やイベント（敵の発見、被弾、リロード、雑談）がきっかけで、ゲームを止めず返事も要らない。画面には短い字幕や頭上の小さな文字として出て数秒で消えることが多い。", "notThis": "会話（CIN-05/06、読む・ボタンで進める必要がある）とは違い、リアルタイムでシステムが発し、割り込まれてもよい。エモートバルーン（CIN-07、記号のみ）とも違う。", "use": "世界に生気を与える、AI を賢く見せる、敵の状態を伝える（「あそこだ！」）、仲間からの声かけ。", "prompt": "ゲームにバークの仕組みを追加して：イベント（プレイヤー発見、被弾、見失う、20 秒放置）ごとに 3〜5 個の短い台詞をランダムに選び、同じ台詞は 30 秒以内に繰り返さない。同時に最大 2 つ、キャラごとに 4 秒のクールダウン。話し手の頭上 12 px に小さな字幕で出し 1.8 秒でフェード、ゲームは止めない。"}, "params": "events → line pools · repeat window · global & per-speaker cooldown · max concurrent · priority · subtitle duration", "impl": "Event bus → bark manager that queries a rule table (event, speaker, world-state conditions) and picks a line; priority and cooldown arbitration; output as voice + world-anchored subtitle.", "related": ["CIN-07", "CIN-06", "CIN-05"], "refs": [{"t": "Game Developer — Adding life to worlds with dialogue barks", "u": "https://www.gamedeveloper.com/design/adding-life-to-worlds-with-dialogue-barks"}, {"t": "Game Architecture blog — notes on GDC 2009 \"Talking to the player with barks\"", "u": "https://www.gamearch.com/2009/03/"}], "nosrc": false}, {"id": "CIN-09", "cat": "CIN", "sub": "章節與身份", "std": "Title card", "aliases": ["Chapter card", "Chapter title", "Intertitle", "Area name card"], "type": "S", "zh": {"name": "章節卡", "observe": "進入新章節、新地區或新的一天時，畫面中央（或下方）出現大字標題，例如「第二章　沉沒之城」或「DAY 3」，常有細線、副標題與淡入淡出，停留 2–3 秒後消失，有時背景變暗或全黑。", "notThis": "不是 Boss 登場名牌（CIN-10，介紹一個角色）；章節卡介紹時間或地點。也不是讀取畫面（TRN-17，用來遮蔽讀取，可能有進度條）。", "use": "章節分段、進入新地區、日數或時間跳躍、讓節奏有「呼吸」。", "prompt": "在遊戲中，進入新地區時顯示章節卡：背景暗 50%，中央先以 0.5 秒淡入 28 px 標題（如「北方森林」），0.3 秒後上下兩條 1 px 金色細線由中間向兩側展開到 160 px，再淡入 12 px 副標題；停留 2 秒後全部 0.6 秒淡出；同一地區第二次進入時只在左上角顯示小字地名。"}, "en": {"name": "Title card (chapter card)", "observe": "On entering a new chapter, area or day, a large title appears centre (or lower) screen — e.g. \"Chapter 2 — The Sunken City\" or \"DAY 3\" — often with thin rules, a subtitle and fades, held for 2–3 s; the background may dim or go black.", "notThis": "Not a boss intro name card (CIN-10, which introduces a character); a title card introduces a time or place. Not a loading screen (TRN-17, which hides loading and may show progress).", "use": "Chapter breaks, arriving in a new area, day counters or time skips, giving the pacing a breath.", "prompt": "In your game, show a title card when entering a new area: dim the background 50%, fade in a 28 px title in the centre (e.g. \"Northern Woods\") over 0.5 s, 0.3 s later expand two 1 px gold rules from the centre outward to 160 px, then fade in a 12 px subtitle; hold 2 s, fade everything out over 0.6 s; on later visits show only a small area name top-left."}, "ja": {"name": "タイトルカード（章タイトル）", "observe": "新しい章・地域・日に入ると、画面中央（または下寄り）に大きな見出しが出る。「第二章　沈んだ都」や「DAY 3」など。細い線や副題、フェードを伴い 2〜3 秒表示され、背景が暗くなったり真っ黒になったりすることもある。", "notThis": "ボス登場の名前カード（CIN-10、キャラを紹介する）とは違い、時間や場所を紹介する。ロード画面（TRN-17、読み込みを隠し進捗を出すこともある）とも違う。", "use": "章の区切り、新しい地域への到着、日数表示や時間の跳躍、テンポに「間」を作る。", "prompt": "ゲームで新しい地域に入った時にタイトルカードを表示して：背景を 50% 暗く、中央に 28 px の見出し（例「北の森」）を 0.5 秒でフェードイン、0.3 秒後に 1 px の金色の線 2 本を中央から左右へ 160 px まで伸ばし、12 px の副題をフェードイン。2 秒保持し 0.6 秒で全体をフェードアウト。2 回目以降は左上に小さく地名だけ。"}, "params": "title/subtitle size · rule animation · background dim · hold time · fade · first-visit only", "impl": "UI sequence on a timer: dim quad → title text alpha → rule width → subtitle alpha → hold → fade. Store a \"seen\" flag per chapter/area to choose the full card or the small corner version.", "related": ["CIN-10", "CIN-12", "TRN-17", "TRN-01"], "refs": [{"t": "Wikipedia — Title card", "u": "https://en.wikipedia.org/wiki/Title_card"}, {"t": "Wikipedia — Intertitle", "u": "https://en.wikipedia.org/wiki/Intertitle"}], "nosrc": false}, {"id": "CIN-10", "cat": "CIN", "sub": "章節與身份", "std": "Boss intro card", "aliases": ["Boss name card", "Boss title card", "Name plate", "Boss subtitles"], "type": "C", "zh": {"name": "Boss 登場名牌", "observe": "Boss 出場時鏡頭對準它，畫面上以大字打出名字和稱號（例如「熔岩巨像　——　古代的守門者」），文字常以滑入、斜條紋背景或衝擊式放大出現，持續 1.5–3 秒後戰鬥開始，Boss 血條出現。", "notThis": "不是章節卡（CIN-09，介紹地點或章節）；名牌介紹一個角色，通常伴隨鏡頭接管（CIN-03）。也不是波次來襲字幕（CIN-11，宣告一群敵人）。", "use": "Boss 戰開場、重要角色初次登場、給對手「分量」與記憶點。", "prompt": "在遊戲中加入 Boss 登場名牌：鏡頭 0.6 秒移到 Boss 並推近 10%，一條 30 px 高的斜向深紅色帶由左向右 0.25 秒掃入，Boss 名字（24 px，白色加黑邊）從右側滑入並輕微過衝，下方以 10 px 顯示稱號；停留 1.8 秒後色帶與文字向左退出，鏡頭回到玩家，Boss 血條由空填滿 0.5 秒。"}, "en": {"name": "Boss intro card (name card)", "observe": "As the boss enters, the camera frames it and its name and epithet appear in large type (e.g. \"Magma Colossus — Ancient Gatekeeper\"), often sliding in over a slanted stripe or slamming in with a scale punch; after 1.5–3 s the fight starts and the boss health bar appears.", "notThis": "Not a title card (CIN-09, which introduces a place or chapter); the name card introduces a character, usually with a camera takeover (CIN-03). Not a wave announcement (CIN-11, announcing a group of enemies).", "use": "Boss fight openings, a major character’s first appearance, giving an opponent weight and memorability.", "prompt": "In your game, add a boss intro card: move the camera to the boss over 0.6 s and push in 10%, sweep a 30 px tall slanted crimson band in from left to right over 0.25 s, slide the boss name (24 px, white with black outline) in from the right with a slight overshoot and its epithet in 10 px below; hold 1.8 s, then exit band and text to the left, return the camera to the player and fill the boss health bar from empty over 0.5 s."}, "ja": {"name": "ボス登場カード（名前表示）", "observe": "ボスが登場するとカメラがボスを捉え、名前と二つ名が大きく表示される（例「溶岩巨像　―　古の門番」）。斜めの帯の上をスライドしたり、衝撃的に拡大して出たりすることが多く、1.5〜3 秒後に戦闘が始まりボスの体力ゲージが現れる。", "notThis": "タイトルカード（CIN-09、場所や章を紹介）とは違い、キャラを紹介する。たいていカメラの乗っ取り（CIN-03）を伴う。ウェーブ告知（CIN-11、敵の集団を告げる）とも違う。", "use": "ボス戦の幕開け、重要キャラの初登場、敵に「格」と印象を与える。", "prompt": "ゲームにボス登場カードを追加して：カメラを 0.6 秒でボスへ移し 10% 寄せる。高さ 30 px の斜めの深紅の帯を 0.25 秒で左から右へ差し込み、ボス名（24 px、白文字に黒縁）を右からオーバーシュート気味にスライドイン、下に 10 px で二つ名。1.8 秒保持後、帯と文字を左へ退場させカメラをプレイヤーに戻し、ボスの体力ゲージを 0.5 秒で空から満タンに。"}, "params": "camera move · band shape/colour · name slide & overshoot · epithet · hold time · health-bar fill · skip on retry", "impl": "Combine a scripted camera (CIN-03) with a UI timeline: band quad with animated clip rect, text with eased x offset, then a health-bar fill tween. Make the intro shorter or skippable after the first attempt.", "related": ["CIN-03", "CIN-09", "CIN-11", "CIN-01"], "refs": [{"t": "Wikipedia — Boss (video games)", "u": "https://en.wikipedia.org/wiki/Boss_(video_games)"}, {"t": "Interface In Game — NieR:Automata UI captures (incl. \"Boss Intro\")", "u": "https://interfaceingame.com/games/nierautomata/"}, {"t": "Epic Boss System docs — boss intro styles (NamePlate / CameraFocus / Cutscene)", "u": "https://adrenalinegames.pl/epicbosssystem"}], "nosrc": false}, {"id": "CIN-11", "cat": "CIN", "sub": "章節與身份", "std": "Wave announcement banner", "aliases": ["Wave banner", "Incoming wave text", "Round announcement"], "type": "D", "zh": {"name": "波次來襲字幕", "observe": "新一波敵人即將出現前，畫面中央橫向出現一條橫幅，大字顯示「WAVE 3」或「第 3 波來襲」，常配倒數數字、閃爍與警示色；橫幅滑入、停留、滑出，接著敵人從畫面邊緣湧入。", "notThis": "不是 Boss 登場名牌（CIN-10，介紹單一角色）；也不是章節卡（CIN-09，介紹地點，節奏較慢）。波次字幕是緊湊的、重複出現的遊戲節奏提示。", "use": "塔防、生存、清版、競技場模式；告訴玩家「休息結束、準備迎戰」。", "prompt": "在遊戲中，每波開始前顯示波次字幕：高 28 px 的黑色半透明橫幅 0.2 秒由左滑入畫面中央，上面以 20 px 金色字顯示「WAVE 3」，下方 3、2、1 倒數每秒一次並各做一次 1.3→1 倍縮放；倒數完橫幅 0.2 秒向右滑出，敵人同時從畫面邊緣出現。最後一波改用紅色「FINAL WAVE」。"}, "en": {"name": "Wave announcement banner", "observe": "Just before a new wave of enemies, a horizontal banner crosses the centre of the screen with big text — \"WAVE 3\" or \"Wave 3 incoming\" — often with a countdown, blinking and warning colours; it slides in, holds, slides out, and enemies pour in from the edges.", "notThis": "Not a boss intro card (CIN-10, introducing one character) nor a title card (CIN-09, introducing a place at a slower pace). The wave banner is a short, repeating gameplay-rhythm cue.", "use": "Tower defence, survival, brawler and arena modes; telling the player \"break’s over, get ready\".", "prompt": "In your game, show a wave banner before each wave: a 28 px tall translucent black band slides from the left to the screen centre over 0.2 s with \"WAVE 3\" in 20 px gold, then a 3-2-1 countdown below, one per second, each scaling 1.3→1×; after the countdown slide the band out to the right over 0.2 s as enemies appear at the screen edges. Use a red \"FINAL WAVE\" for the last wave."}, "ja": {"name": "ウェーブ告知バナー", "observe": "新しい敵の波が来る直前に、画面中央を横切る帯が出て「WAVE 3」「第 3 波襲来」などを大きく表示する。カウントダウン、点滅、警告色を伴うことが多く、帯がスライドイン・停止・スライドアウトした後、敵が画面端からなだれ込む。", "notThis": "ボス登場カード（CIN-10、1 体のキャラを紹介）やタイトルカード（CIN-09、場所を紹介しテンポがゆっくり）とは違う。短く繰り返し出る、ゲームのリズムの合図。", "use": "タワーディフェンス、サバイバル、ベルトスクロール、アリーナモード。「休憩は終わり、構えろ」と伝える。", "prompt": "ゲームで各ウェーブの前に告知バナーを出して：高さ 28 px の半透明の黒帯を 0.2 秒で左から画面中央へスライドし、20 px の金色で「WAVE 3」。その下に 3・2・1 のカウントダウンを 1 秒ごとに、それぞれ 1.3→1 倍に縮小。終わったら 0.2 秒で右へスライドアウトし、同時に敵を画面端から出現。最終ウェーブは赤い「FINAL WAVE」。"}, "params": "band height · slide time · text colour by wave type · countdown length · final-wave variant · spawn sync", "impl": "UI timeline driven by the wave spawner’s state machine (intermission → announce → spawn); the banner’s end event triggers spawning so text and enemies stay in sync.", "related": ["CIN-10", "CIN-09", "FB-18"], "refs": [{"t": "Wikipedia — Glossary of video game terms (\"Wave\")", "u": "https://en.wikipedia.org/wiki/Glossary_of_video_game_terms#Wave"}, {"t": "Wikipedia — Tower defense", "u": "https://en.wikipedia.org/wiki/Tower_defense"}], "nosrc": true}, {"id": "CIN-12", "cat": "CIN", "sub": "章節與身份", "std": "Credits roll", "aliases": ["End credits", "Closing credits", "Staff roll", "Scrolling credits"], "type": "S", "zh": {"name": "製作人員名單", "observe": "遊戲通關後，製作人員的職位與名字由畫面下方向上慢慢捲動，通常配結局音樂，旁邊可能播放劇情回顧圖、角色走過或小型可玩場景；最後以「THE END」或感謝字樣結束。", "notThis": "不是章節卡（CIN-09，短暫停留的標題）；名單是長時間、連續捲動的。也不是過場動畫（CIN-02），但兩者常串在一起。", "use": "結局、致謝、讓玩家情緒沉澱；也可做成可遊玩的名單（射擊名字、在名單上跑）。", "prompt": "在遊戲中做結尾製作人員名單：黑底，職位以 10 px 灰色、名字以 14 px 白色置中，每組之間空 24 px，以每秒 20 px 等速向上捲動；畫面上下各 20 px 做漸隱遮罩；右側每 8 秒換一張回顧插圖並交叉溶接 1 秒；按住確認鍵 3 倍速，名單完結後顯示「THE END」3 秒。"}, "en": {"name": "Credits roll", "observe": "After the game is finished, the team’s roles and names scroll slowly up from the bottom of the screen, usually over ending music, sometimes beside story recap images, characters walking by, or a small playable scene; it ends with \"THE END\" or a thank-you.", "notThis": "Not a title card (CIN-09, a short static title); credits are a long, continuous scroll. Not a cutscene (CIN-02), though the two are often chained.", "use": "Endings, acknowledgements, letting emotions settle; can be playable (shooting names, running across them).", "prompt": "In your game, make an end credits roll: black background, roles in 10 px grey and names in 14 px white, centred, 24 px between groups, scrolling up at a constant 20 px/s; 20 px fade masks at top and bottom; a recap illustration on the right changes every 8 s with a 1 s crossfade; holding Confirm speeds up 3×; show \"THE END\" for 3 s when the list finishes."}, "ja": {"name": "スタッフロール（エンドクレジット）", "observe": "クリア後、制作スタッフの役職と名前が画面下からゆっくり上へスクロールする。たいていエンディング曲と共に、横に振り返りの絵やキャラが歩く様子、小さな遊べる場面が入ることもあり、最後に「THE END」や感謝の言葉で終わる。", "notThis": "タイトルカード（CIN-09、短く止まる見出し）とは違い、長く連続してスクロールする。カットシーン（CIN-02）とも違うが、続けて流れることが多い。", "use": "エンディング、謝辞、余韻を味わわせる。名前を撃つ・名前の上を走るなど遊べるクレジットにもできる。", "prompt": "ゲームにスタッフロールを作って：黒背景、役職は 10 px の灰色、名前は 14 px の白で中央揃え、グループ間 24 px、毎秒 20 px の一定速度で上へスクロール。上下 20 px にフェードマスク。右側の振り返りイラストは 8 秒ごとに 1 秒のクロスフェードで切り替え。決定ボタン長押しで 3 倍速、終わったら「THE END」を 3 秒表示。"}, "params": "scroll speed px/s · group spacing · typography · fade masks · side images · speed-up / skip rules", "impl": "Pre-layout all lines once into a list of (y, text, style); each frame draw only lines whose y − scroll is on screen; fade masks are gradient quads. Time-based scroll keeps it frame-rate independent.", "related": ["CIN-09", "CIN-02", "TRN-03"], "refs": [{"t": "Wikipedia — Closing credits", "u": "https://en.wikipedia.org/wiki/Closing_credits"}], "nosrc": false}, {"id": "CIN-13", "cat": "CIN", "sub": "敘事手法", "std": "Environmental storytelling", "aliases": ["Set-dressing narrative", "Visual storytelling", "Embedded narrative"], "type": "S", "zh": {"name": "環境敘事", "observe": "不用台詞或過場，而是透過場景擺設讓玩家自己推測發生過什麼：翻倒的桌椅、拖行的血跡、熄滅的營火、散落的信件、被破壞的牆；玩家走近時可能只有輕微的高亮或可調查提示。", "notThis": "不是過場動畫（CIN-02，明確播給玩家看）；環境敘事讓玩家主動發現與解讀。也不是腐化擴散（ENV-16，即時的世界狀態變化），雖然兩者可結合。", "use": "世界觀補充、懸疑感、探索獎勵、在不打斷遊玩下交代背景。", "prompt": "在遊戲中用環境敘事交代「營地遇襲」：場景放置翻倒的鍋、熄滅但仍冒細煙的營火、一串通往森林的拖痕、地上一封信；不加任何台詞，只在玩家走到 24 px 內時讓可調查物件出現 1 px 白色外框並每 1.2 秒閃一次，調查信件時顯示 2 行文字。"}, "en": {"name": "Environmental storytelling", "observe": "Instead of dialogue or cutscenes, the arrangement of the scene lets players infer what happened: overturned furniture, drag marks, a dead campfire, scattered letters, a broken wall; at most a faint highlight or \"inspect\" hint appears when the player gets close.", "notThis": "Not a cutscene (CIN-02, which shows the player explicitly); environmental storytelling lets players discover and interpret. Not corruption spread (ENV-16, a live change of world state), though the two can combine.", "use": "Adding lore, building mystery, rewarding exploration, giving backstory without interrupting play.", "prompt": "In your game, tell \"the camp was attacked\" through the environment: place an overturned pot, a dead campfire still trailing thin smoke, drag marks leading into the forest, and a letter on the ground; add no dialogue — only when the player is within 24 px give inspectable props a 1 px white outline that pulses every 1.2 s, and show 2 lines of text when the letter is inspected."}, "ja": {"name": "環境ストーリーテリング（環境による語り）", "observe": "台詞やカットシーンではなく、場面の配置から何が起きたかをプレイヤー自身に推測させる。倒れた家具、引きずった跡、消えた焚き火、散らばった手紙、壊れた壁など。近づいた時にかすかなハイライトや「調べる」表示が出る程度。", "notThis": "カットシーン（CIN-02、はっきり見せる）とは違い、プレイヤーが自分で発見し解釈する。侵食の拡大（ENV-16、リアルタイムのワールド状態の変化）とも違うが、組み合わせられる。", "use": "世界観の補足、謎めいた雰囲気、探索のご褒美、プレイを止めずに背景を伝える。", "prompt": "ゲームで「野営地が襲われた」ことを環境で伝えて：ひっくり返った鍋、細い煙がまだ上る消えた焚き火、森へ続く引きずり跡、地面の手紙を配置。台詞は入れず、プレイヤーが 24 px 以内に来た時だけ調べられる物に 1 px の白い縁取りを付けて 1.2 秒ごとに明滅、手紙を調べたら 2 行のテキストを表示。"}, "params": "prop set · readability at play scale · highlight radius · highlight style · optional inspect text", "impl": "Content technique more than code: needs decal/prop placement, plus a proximity query that toggles an outline shader (or outline sprite) on inspectable props.", "related": ["CIN-02", "ENV-16", "ENV-10", "PIX-13"], "refs": [{"t": "GDC Vault — What Happened Here? Environmental Storytelling (Smith & Worch, 2010)", "u": "https://www.gdcvault.com/play/1012647/What-Happened-Here-Environmental"}, {"t": "Wikipedia — Glossary of video game terms (\"Environmental storytelling\")", "u": "https://en.wikipedia.org/wiki/Glossary_of_video_game_terms#Environmental_storytelling"}], "nosrc": false}, {"id": "CIN-14", "cat": "CIN", "sub": "敘事手法", "std": "Flashback filter", "aliases": ["Memory filter", "Sepia flashback", "Dream sequence look"], "type": "D", "zh": {"name": "回憶濾鏡", "observe": "進入回憶片段時，整個畫面套上一層「過去」的質感：褐色調或黑白、降低飽和、四周暗角或柔邊光暈、輕微雜訊或膠片刮痕，有時邊緣模糊；回到現在時濾鏡淡出。", "notThis": "不是淡出至白（TRN-02，只是轉場）；回憶濾鏡在整段回憶期間持續。也不是狀態異常調色（FB-05，只套在角色上）。", "use": "回憶、夢境、過去的時間線、角色內心世界，讓玩家立即分辨「這不是現在」。", "prompt": "在遊戲中，進入回憶片段時套上回憶濾鏡：先以 0.5 秒淡出至白（TRN-02），然後全畫面轉為褐色調（灰階後乘 #c8a878）、飽和度降至 20%，加 35% 強度的圓形暗角與 6% 動態雜訊；回到現在時濾鏡用 0.8 秒淡出。"}, "en": {"name": "Flashback filter", "observe": "W
