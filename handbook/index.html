hen a memory sequence starts, the whole image gets a \"past\" look: sepia or black-and-white, lowered saturation, a dark vignette or soft glow at the edges, light grain or film scratches, sometimes blurred edges; the filter fades out when returning to the present.", "notThis": "Not a fade to white (TRN-02, just a transition); the flashback filter stays on for the whole memory. Not a status effect tint (FB-05, applied only to a character).", "use": "Memories, dreams, past timelines, a character’s inner world — players instantly read \"this is not now\".", "prompt": "In your game, apply a flashback filter for memory sequences: start with a 0.5 s fade to white (TRN-02), then grade the whole image sepia (greyscale multiplied by #c8a878) at 20% saturation, add a 35% round vignette and 6% animated grain; fade the filter out over 0.8 s when returning to the present."}, "ja": {"name": "回想フィルター", "observe": "回想シーンに入ると、画面全体に「過去」の質感がかかる。セピアや白黒、彩度の低下、周辺の暗いビネットや柔らかい光、軽いノイズやフィルムの傷、時には周辺のぼかし。現在に戻るとフィルターが消える。", "notThis": "白へのフェード（TRN-02、単なる転換）とは違い、回想の間ずっと続く。状態異常の色付け（FB-05、キャラだけにかかる）とも違う。", "use": "回想、夢、過去の時間軸、キャラの心の中。「これは今ではない」とすぐ分かる。", "prompt": "ゲームの回想シーンに回想フィルターをかけて：まず 0.5 秒の白フェード（TRN-02）、その後画面全体をセピア（グレースケールに #c8a878 を乗算）、彩度 20%、強さ 35% の円形ビネットと 6% の動くノイズ。現在に戻る時は 0.8 秒でフィルターをフェードアウト。"}, "params": "tone (sepia / mono / desaturated) · saturation · vignette strength · grain amount · edge blur · fade in/out time", "impl": "Fullscreen post pass on the scene render target: luminance → tint multiply → lerp with original by strength; multiply a radial vignette; add hashed per-frame grain. Drive one \"flashback\" weight 0→1 so it can fade.", "related": ["TRN-02", "FB-05", "FB-16", "TRN-03"], "refs": [{"t": "Wikipedia — Flashback (narrative)", "u": "https://en.wikipedia.org/wiki/Flashback_(narrative)"}, {"t": "Wikipedia — Sepia (color)", "u": "https://en.wikipedia.org/wiki/Sepia_(color)"}, {"t": "Wikipedia — Vignetting", "u": "https://en.wikipedia.org/wiki/Vignetting"}], "nosrc": true}, {"id": "CIN-15", "cat": "CIN", "sub": "敘事手法", "std": "Quick time event", "aliases": ["QTE", "Button prompt sequence", "Press X to …"], "type": "S", "zh": {"name": "快速反應事件", "observe": "演出進行中，畫面突然出現按鍵圖示（例如「A」或連打提示），周圍有收縮的圓環或計時條；玩家要在時限內按對，成功則演出繼續（反擊、閃避），失敗則播放失敗分支；時間有時會放慢。", "notThis": "不是一般的介面提示（只是說明按鍵）；QTE 有時限、會決定演出結果。也不是慢動作（FB-10），雖然 QTE 常配慢動作。", "use": "把過場變得有參與感、Boss 終結技、掙脫、追逐場面。", "prompt": "在遊戲中加入 QTE：演出中時間放慢到 0.3 倍，畫面中央出現 24 px 的按鍵圖示，外圈白色圓環在 1.2 秒內由 40 px 收縮到 24 px；圓環與圖示重疊時按下為「完美」（金色閃光），時限內按對為成功，超時或按錯則圖示變紅抖動並播放失敗分支；可在設定中改為長按代替連打。"}, "en": {"name": "Quick time event (QTE)", "observe": "In the middle of a scene a button icon suddenly appears (e.g. \"A\" or a mash prompt) with a shrinking ring or timer bar; the player must press the right input in time — success continues the scene (counter, dodge), failure plays a fail branch; time often slows down.", "notThis": "Not an ordinary UI hint (that only explains a button); a QTE has a time limit and decides the outcome. Not slow motion (FB-10), although QTEs often use it.", "use": "Making cutscenes interactive, boss finishers, breaking free, chase scenes.", "prompt": "In your game, add a QTE: slow time to 0.3× during the scene, show a 24 px button icon in the centre with a white ring shrinking from 40 px to 24 px over 1.2 s; pressing while ring and icon overlap is \"Perfect\" (gold flash), pressing correctly in time is success, timing out or a wrong press turns the icon red with a shake and plays the fail branch; offer a hold-instead-of-mash accessibility option."}, "ja": {"name": "QTE（クイックタイムイベント）", "observe": "演出の途中で突然ボタンアイコン（「A」や連打の表示など）が現れ、縮んでいく輪やタイマーバーが付く。制限時間内に正しく押すと演出が続き（反撃、回避）、失敗すると失敗の分岐が流れる。時間がスローになることも多い。", "notThis": "ただの操作ガイド（ボタンを説明するだけ）とは違い、制限時間があり結果を左右する。スローモーション（FB-10）とも違うが、よく組み合わされる。", "use": "カットシーンに参加感を与える、ボスへのとどめ、拘束からの脱出、追跡シーン。", "prompt": "ゲームに QTE を追加して：演出中は時間を 0.3 倍にし、画面中央に 24 px のボタンアイコン、外側の白い輪を 1.2 秒で 40 px から 24 px に縮める。輪とアイコンが重なった時に押せば「Perfect」（金色の閃光）、時間内に正しく押せば成功、時間切れや誤入力ならアイコンを赤くして揺らし失敗分岐へ。設定で連打の代わりに長押しを選べるように。"}, "params": "time window · slow-down factor · ring/timer visual · perfect window · fail branch · mash vs hold option", "impl": "A timed prompt node in the cutscene timeline: it pauses or slows the timeline, reads input against a window, and jumps to the success or fail track. Show the correct glyph for the active input device.", "related": ["CIN-02", "FB-10", "FB-11", "CIN-01"], "refs": [{"t": "Wikipedia — Quick time event", "u": "https://en.wikipedia.org/wiki/Quick_time_event"}], "nosrc": false}, {"id": "CIN-16", "cat": "CIN", "sub": "敘事手法", "std": "Photo mode", "aliases": ["Virtual photography", "Photo camera", "Screenshot mode"], "type": "S", "zh": {"name": "拍照模式", "observe": "玩家按下按鍵後遊戲暫停、HUD 全部隱藏，鏡頭變成可自由移動、旋轉、變焦的相機；畫面上有取景框線（三分線）、濾鏡、景深、邊框與貼紙等選項，按下快門後畫面閃白並存檔。", "notThis": "不是劇本控制鏡頭（CIN-03，由遊戲接管）；拍照模式由玩家控制鏡頭。也不是單純截圖（不能調整構圖和效果）。", "use": "分享、社群宣傳、欣賞場景與角色；也能當作簡易的「暫停並環顧」。", "prompt": "在遊戲中加入拍照模式：按 P 暫停遊戲並隱藏 HUD，鏡頭可在玩家周圍 200 px 內自由移動、0.5–2 倍變焦、±15° 傾斜；顯示可開關的三分線，提供 4 個濾鏡（原色、黑白、褐色、高對比）與暗角強度滑桿；按快門時白閃 0.1 秒並把畫面以 2 倍解析度存成 PNG。"}, "en": {"name": "Photo mode", "observe": "At a button press the game pauses, the whole HUD hides, and the view becomes a camera the player can freely move, rotate and zoom; there are framing guides (rule of thirds), filters, depth of field, frames and stickers, and pressing the shutter flashes white and saves the image.", "notThis": "Not a scripted camera (CIN-03, taken over by the game); in photo mode the player drives the camera. Not a plain screenshot (no control over framing or effects).", "use": "Sharing, community marketing, admiring scenes and characters; also a simple \"pause and look around\".", "prompt": "In your game, add a photo mode: P pauses the game and hides the HUD; the camera moves freely within 200 px of the player, zooms 0.5–2×, and tilts ±15°; show a toggleable rule-of-thirds grid, offer 4 filters (none, mono, sepia, high contrast) and a vignette slider; on shutter flash white for 0.1 s and save the image as a PNG at 2× resolution."}, "ja": {"name": "フォトモード", "observe": "ボタンを押すとゲームが一時停止して HUD がすべて消え、自由に移動・回転・ズームできるカメラになる。構図ガイド（三分割線）、フィルター、被写界深度、フレームやスタンプなどの選択肢があり、シャッターを押すと画面が白く光って保存される。", "notThis": "スクリプトカメラ（CIN-03、ゲームがカメラを奪う）とは違い、プレイヤーがカメラを操作する。単なるスクリーンショット（構図や効果を調整できない）とも違う。", "use": "共有、コミュニティでの宣伝、景色やキャラを眺める。簡易的な「止めて見回す」機能にもなる。", "prompt": "ゲームにフォトモードを追加して：P でゲームを一時停止し HUD を隠す。カメラはプレイヤーから 200 px 以内を自由に移動、0.5〜2 倍ズーム、±15° 傾け可能。三分割線の表示切替、4 種のフィルター（なし・白黒・セピア・高コントラスト）とビネット強度スライダー。シャッターで 0.1 秒白く光らせ、画面を 2 倍解像度の PNG で保存。"}, "params": "camera range · zoom/tilt limits · grid overlay · filter list · vignette/DOF · capture resolution · HUD hide", "impl": "Pause gameplay time but keep rendering; spawn a free camera from the current view with clamped bounds; post-process stack exposed as sliders; capture by rendering to an offscreen target at higher resolution and encoding to PNG.", "related": ["CIN-03", "CIN-14", "TRN-02"], "refs": [{"t": "Wikipedia — Virtual photography (photo mode)", "u": "https://en.wikipedia.org/wiki/Virtual_photography"}, {"t": "Unity Technologies — Photo Mode sample (GitHub)", "u": "https://github.com/UnityTechnologies/PhotoMode"}], "nosrc": false}, {"id": "PP-01", "cat": "PP", "sub": "風格濾鏡", "std": "Vignette", "aliases": ["Vignetting", "Edge darkening", "Lens vignette"], "type": "S", "zh": {"name": "暗角（Vignette）", "observe": "畫面四角與邊緣比中央暗（或偏某個顏色），亮度由中心向外柔和遞減，視線自然被拉到畫面中央。", "notThis": "不是低血量暗角（FB-16，紅色、隨血量或受擊脈動的狀態提示）；一般暗角是長期、靜態的鏡頭風格。也不是曝光（原手冊 REN-30，改變的是整體亮度）。", "use": "電影感、聚焦主角、恐怖或回憶場景的壓迫感，掩飾畫面邊緣的空白。", "prompt": "在遊戲中加入全畫面暗角後處理：中心為圓形（依畫面比例修正為正圓），由半徑 40% 處開始變暗，到角落時亮度乘以 0.55；過渡使用 smoothstep，顏色預設黑色 #000000，強度 0–1 可調，室內場景 0.35、洞窟 0.6。"}, "en": {"name": "Vignette", "observe": "The corners and edges of the image are darker (or tinted) than the centre, falling off smoothly from the middle outward, so the eye drifts to the centre.", "notThis": "Not the low-health vignette (FB-16, a red, pulsing status cue driven by HP or hits); a plain vignette is a persistent, static lens style. Not exposure (original handbook REN-30, which changes overall brightness).", "use": "Cinematic feel, focusing on the hero, oppressive horror or flashback mood, hiding empty screen edges.", "prompt": "Add a fullscreen vignette post-process to the game: circular centre (aspect-corrected to a true circle), darkening starts at 40% radius and reaches ×0.55 brightness in the corners; smoothstep falloff, default colour black #000000, intensity 0–1 (indoors 0.35, caves 0.6)."}, "ja": {"name": "ビネット（周辺減光）", "observe": "画面の四隅や縁が中央より暗く（または色付きに）なり、明るさが中心から外へなめらかに落ちる。視線が自然に中央へ向かう。", "notThis": "低体力ビネット（FB-16、体力や被弾に応じて赤く脈打つ状態表示）とは違い、普通のビネットは常時かかる静的なレンズ表現。露出（元ハンドブック REN-30、全体の明るさを変える）とも違う。", "use": "映画的な雰囲気、主人公への注目、ホラーや回想の圧迫感、画面端の空白を隠す。", "prompt": "ゲームに全画面のビネットをポストプロセスで追加して：中心は円形（画面比を補正して真円に）、半径 40% から暗くなり始め、四隅で明るさ ×0.55。smoothstep で減衰、色は既定で黒 #000000、強度 0〜1 を調整可能（屋内 0.35、洞窟 0.6）。"}, "params": "intensity · inner radius · smoothness · roundness (aspect correction) · colour · centre offset", "impl": "Fullscreen pass: d = length((uv-centre)*float2(aspect,1)); k = smoothstep(inner, outer, d); out.rgb = lerp(src.rgb, src.rgb*vignetteColour, k*intensity). Can be folded into the final tonemap/composite pass for free.", "related": ["FB-16", "REN-30 Exposure", "PP-11"], "refs": [{"t": "Wikipedia — Vignetting", "u": "https://en.wikipedia.org/wiki/Vignetting"}, {"t": "Unity URP manual — Vignette", "u": "https://docs.unity3d.com/Packages/com.unity.render-pipelines.universal@14.0/manual/post-processing-vignette.html"}], "nosrc": false}, {"id": "PP-02", "cat": "PP", "sub": "風格濾鏡", "std": "Film grain", "aliases": ["Grain", "Noise overlay", "Film noise"], "type": "S", "zh": {"name": "膠片顆粒（Film grain）", "observe": "整個畫面覆蓋一層細小、每幀都在變動的隨機顆粒，暗部與中間調較明顯；靜止畫面看起來也在微微「沸騰」。", "notThis": "不是抖色（PIX-08，固定的規則點陣，不會每幀亂跳）；也不是 CRT 濾鏡（PP-03，有規則的掃描線）。顆粒的重點是「隨機、每幀更新、覆蓋全畫面」。", "use": "電影或紀錄片質感、恐怖氣氛、復古照片感，也能打散漸層色帶。", "prompt": "在遊戲中加入膠片顆粒後處理：每幀以新種子產生單色雜訊，顆粒大小 1px（以輸出解析度計），強度 0.06，主要作用在中間調（以亮度曲線 4·L·(1−L) 加權，純黑與純白幾乎不受影響）；以 24fps 更新顆粒圖案即可，不必每個顯示幀都換。"}, "en": {"name": "Film grain", "observe": "A fine random speckle that changes every frame covers the whole image, most visible in shadows and mid-tones; even a still shot seems to gently “boil”.", "notThis": "Not dithering (PIX-08, a fixed regular pattern that doesn’t jump each frame) nor a CRT filter (PP-03, regular scanlines). Grain is random, refreshed every frame and fullscreen.", "use": "Film or documentary texture, horror mood, vintage-photo feel; also breaks up gradient banding.", "prompt": "Add a film-grain post-process to the game: generate monochrome noise with a new seed each frame, grain size 1 px at output resolution, intensity 0.06, weighted toward mid-tones by 4·L·(1−L) so pure black and white are barely touched; refresh the grain pattern at 24 fps rather than every display frame."}, "ja": {"name": "フィルムグレイン", "observe": "細かくランダムな粒が毎フレーム変わりながら画面全体を覆い、暗部や中間調で特に目立つ。静止した場面でもかすかに「ざわついて」見える。", "notThis": "ディザ（PIX-08、毎フレーム跳ねない規則的な点）や CRT フィルター（PP-03、規則的な走査線）とは違う。グレインは「ランダム・毎フレーム更新・全画面」。", "use": "映画やドキュメンタリーの質感、ホラーの雰囲気、古写真風。グラデーションのバンディングを目立たなくする効果も。", "prompt": "ゲームにフィルムグレインをポストプロセスで追加して：毎フレーム新しいシードでモノクロのノイズを生成、粒の大きさは出力解像度で 1px、強度 0.06。4·L·(1−L) で中間調に重み付けして純黒と純白にはほぼかけない。粒のパターン更新は表示フレームごとではなく 24fps で十分。"}, "params": "intensity · grain size · luminance response · colour vs mono · update rate", "impl": "Fullscreen pass: n = hash(pixelCoord + frameSeed) - 0.5 (or sample a tiling noise texture with a per-frame random UV offset); w = 4*L*(1-L); out = src + n*intensity*w. Apply after tonemapping so grain is in display space.", "related": ["PIX-08", "PP-03", "PP-04"], "refs": [{"t": "Wikipedia — Film grain", "u": "https://en.wikipedia.org/wiki/Film_grain"}, {"t": "Unity URP manual — Film Grain", "u": "https://docs.unity3d.com/Packages/com.unity.render-pipelines.universal@14.0/manual/Post-Processing-Film-Grain.html"}, {"t": "Wikipedia — Image noise", "u": "https://en.wikipedia.org/wiki/Image_noise"}], "nosrc": false}, {"id": "PP-03", "cat": "PP", "sub": "風格濾鏡", "std": "CRT filter", "aliases": ["CRT shader", "Scanlines", "Shadow mask / Aperture grille", "CRT emulation"], "type": "C", "zh": {"name": "CRT 濾鏡／掃描線", "observe": "畫面上有一條條水平暗線（掃描線），細看有紅綠藍的直條或點狀遮罩，邊緣微微向外彎曲、四角變暗，亮處會稍微發光滲色，有時還有緩慢上移的亮帶。", "notThis": "不是膠片顆粒（PP-02，隨機雜訊）；也不是整數縮放（PIX-01，只是把像素放大得乾淨）。CRT 濾鏡是在放大後「模擬舊電視的顯示結構」。", "use": "復古遊戲氣氛、讓低解析度像素美術看起來像在舊電視上、選單中的「復古模式」選項。", "prompt": "在遊戲中加入 CRT 濾鏡選項：先以整數倍放大，再讓每條原始像素列中有 1/3 高度變暗至 60%；疊加 RGB 直條遮罩（每 3 個輸出像素一組，強度 0.15）；桶形彎曲係數 0.04；四角暗角 0.3；每 6 秒有一條 20px 高、亮度 +4% 的亮帶由下往上滾動。設定中可開關。"}, "en": {"name": "CRT filter / Scanlines", "observe": "Horizontal dark lines (scanlines) run across the image; up close there is a red-green-blue stripe or dot mask, the edges bow outward slightly, the corners darken, highlights bleed a little glow, sometimes a slow bright band rolls upward.", "notThis": "Not film grain (PP-02, random noise) nor integer scaling (PIX-01, which only enlarges pixels cleanly). A CRT filter simulates the display structure of an old TV after upscaling.", "use": "Retro mood, making low-res pixel art look as it did on old TVs, a “retro mode” toggle in options.", "prompt": "Add a CRT filter option to the game: integer-upscale first, then darken the bottom 1/3 of each source pixel row to 60%; overlay an RGB vertical-stripe mask (3 output pixels per triad, strength 0.15); barrel curvature 0.04; corner vignette 0.3; every 6 s a 20 px tall band of +4% brightness rolls from bottom to top. Toggleable in settings."}, "ja": {"name": "CRT フィルター／スキャンライン", "observe": "画面に水平の暗い線（走査線）が並び、よく見ると赤・緑・青の縦縞や点のマスクがある。縁はわずかに外へ膨らみ、四隅が暗く、明るい部分は少しにじんで光る。ゆっくり上へ流れる明るい帯が出ることも。", "notThis": "フィルムグレイン（PP-02、ランダムノイズ）や整数倍スケーリング（PIX-01、ドットをきれいに拡大するだけ）とは違い、拡大後に「ブラウン管の表示構造を模倣」する。", "use": "レトロな雰囲気、低解像度のドット絵を昔のテレビで見たように見せる、オプションの「レトロモード」。", "prompt": "ゲームに CRT フィルターのオプションを追加して：まず整数倍に拡大し、元の各ドット行の下 1/3 を 60% に暗く。RGB の縦縞マスク（出力 3 ドットで 1 組、強さ 0.15）を重ね、樽型の湾曲係数 0.04、四隅のビネット 0.3。6 秒ごとに高さ 20px・明るさ +4% の帯を下から上へ流す。設定でオン・オフ可能に。"}, "params": "scanline strength & profile · mask type (aperture grille / shadow mask / slot) · curvature · bloom/glow · corner radius · rolling band", "impl": "Render the game to a low-res target, then a fullscreen pass at output res: warp uv for curvature; sample source (nearest or sharp-bilinear); scan = lerp(1, minScan, f(frac(uv.y*srcH))); mask = triad colour by (pixel.x % 3); out = src*scan*mask, plus a blurred bright-pass added for glow.", "related": ["PIX-01", "PP-02", "PP-01", "PIX-04"], "refs": [{"t": "Wikipedia — Scan line", "u": "https://en.wikipedia.org/wiki/Scan_line"}, {"t": "Wikipedia — Aperture grille", "u": "https://en.wikipedia.org/wiki/Aperture_grille"}, {"t": "Wikipedia — Shadow mask", "u": "https://en.wikipedia.org/wiki/Shadow_mask"}, {"t": "Libretro docs — CRT shaders", "u": "https://docs.libretro.com/shader/crt/"}, {"t": "Libretro docs — Shaders introduction", "u": "https://docs.libretro.com/shader/introduction/"}], "nosrc": false}, {"id": "PP-04", "cat": "PP", "sub": "風格濾鏡", "std": "Posterization", "aliases": ["Color quantization", "Posterize", "Tone banding"], "type": "S", "zh": {"name": "色調分離（Posterization）", "observe": "平滑的漸層（天空、光暈、陰影）被切成幾個明顯的色階台階，整個畫面像版畫或海報，顏色數量變少但仍保留原本的色相。", "notThis": "不是限色調色盤（PIX-10，美術在繪製時就只用固定顏色）；色調分離是對已完成的畫面「事後」把每個通道量化。也不是抖色（PIX-08，會用點陣假裝中間色）。", "use": "海報／漫畫風格、復古主機色彩感、中毒或幻覺等狀態效果、刻意的低保真風格。", "prompt": "在遊戲中加入色調分離後處理：每個 RGB 通道量化為 N 階（預設 5 階，可設 2–16），公式 floor(c·(N−1)+0.5)/(N−1)；可選在量化前加入 4×4 Bayer 抖色偏移（強度 1/N）以減少硬色帶；狀態效果觸發時於 0.3 秒內由 16 階降到 4 階。"}, "en": {"name": "Posterization", "observe": "Smooth gradients (sky, glows, shadows) break into a few visible colour steps; the image looks like a print or poster, with fewer colours but the original hues kept.", "notThis": "Not a limited palette (PIX-10, where the artist paints with fixed colours from the start); posterization quantizes each channel of a finished image after the fact. Not dithering (PIX-08, which fakes in-between colours with patterns).", "use": "Poster/comic styles, a retro-console colour feel, poison or hallucination status effects, deliberate lo-fi looks.", "prompt": "Add a posterization post-process to the game: quantize each RGB channel to N levels (default 5, range 2–16) with floor(c·(N−1)+0.5)/(N−1); optionally add a 4×4 Bayer dither offset (strength 1/N) before quantizing to soften hard bands; when a status effect triggers, drop from 16 to 4 levels over 0.3 s."}, "ja": {"name": "ポスタリゼーション（階調化）", "observe": "なめらかなグラデーション（空、光のにじみ、影）がはっきりした数段の色の階段に分かれ、版画やポスターのような画面になる。色数は減るが元の色相は残る。", "notThis": "限定パレット（PIX-10、描く段階から決まった色だけを使う）とは違い、完成した画面の各チャンネルを「後から」量子化する。ディザ（PIX-08、点のパターンで中間色を作る）とも違う。", "use": "ポスター・コミック調、レトロ機の色の雰囲気、毒や幻覚などの状態異常、意図的なローファイ表現。", "prompt": "ゲームにポスタリゼーションをポストプロセスで追加して：RGB の各チャンネルを N 段に量子化（既定 5 段、2〜16）、式は floor(c·(N−1)+0.5)/(N−1)。量子化の前に 4×4 Bayer のディザを強さ 1/N で加えて硬い帯を和らげる選択肢も。状態異常の発動時は 0.3 秒で 16 段から 4 段へ。"}, "params": "levels per channel · per-channel vs luminance quantization · dither before quantize · colour space (gamma vs linear)", "impl": "Fullscreen pass in display (gamma) space: c = floor(c*(N-1) + 0.5 + ditherOffset)/(N-1). Quantizing luminance only (then re-applying chroma) keeps hues steadier than per-channel quantization.", "related": ["PIX-10", "PIX-08", "PP-06", "FB-05"], "refs": [{"t": "Wikipedia — Posterization (banding)", "u": "https://en.wikipedia.org/wiki/Posterization"}, {"t": "Wikipedia — Dither", "u": "https://en.wikipedia.org/wiki/Dither"}], "nosrc": false}, {"id": "PP-05", "cat": "PP", "sub": "風格濾鏡", "std": "Pixelation", "aliases": ["Mosaic", "Pixelize", "Pixelate filter", "Censor mosaic"], "type": "S", "zh": {"name": "像素化／馬賽克", "observe": "畫面（或其中一塊區域）被分成大方格，每格只有一種顏色，細節消失，只剩大致色塊與輪廓；方格大小可以變化。", "notThis": "不是像素化轉場（TRN-10，方格先變大再變小，用來切換兩個場景）；這裡是「持續的濾鏡狀態」或局部遮蔽。也不是整數縮放（PIX-01，原本就是像素美術，只是放大）。", "use": "打碼遮蔽、暈眩／中毒狀態、低解析度回憶畫面、讓 3D 畫面帶像素風。", "prompt": "在遊戲中加入像素化後處理：以方格大小 B 取樣（每格取中心點顏色），B 預設 1（關閉），暈眩狀態時在 0.25 秒內升到 6px 並維持；另提供局部馬賽克：只在指定矩形（例如 48×48px）內套用 B=8 的方格，方格與螢幕座標對齊以免移動時閃爍。"}, "en": {"name": "Pixelation", "observe": "The image (or one region of it) is split into large squares, each a single colour, so detail disappears and only rough blocks and outlines remain; the block size can change.", "notThis": "Not the pixelate transition (TRN-10, blocks grow then shrink to switch between two scenes); this is an ongoing filter state or a local censor. Not integer scaling (PIX-01, which just enlarges genuine pixel art).", "use": "Censoring, dizzy/poison states, low-res flashback shots, giving 3D a pixel look.", "prompt": "Add a pixelation post-process to the game: sample in blocks of size B (one centre sample per block); B defaults to 1 (off), rises to 6 px over 0.25 s while the player is dazed and holds there; also provide a local mosaic that applies B=8 only inside a given rectangle (e.g. 48×48 px), with blocks aligned to screen coordinates so they don’t shimmer when things move."}, "ja": {"name": "ピクセレート／モザイク", "observe": "画面（またはその一部）が大きなマス目に分かれ、各マスが 1 色になって細部が消え、おおまかな色の塊と輪郭だけが残る。マスの大きさは変えられる。", "notThis": "ピクセレート転換（TRN-10、マスが大きくなってから小さくなり 2 つの場面を切り替える）とは違い、こちらは「持続するフィルター状態」や部分的な目隠し。整数倍スケーリング（PIX-01、もともとのドット絵を拡大するだけ）とも違う。", "use": "モザイク処理、めまい・毒の状態、低解像度の回想、3D にドット感を出す。", "prompt": "ゲームにピクセレートをポストプロセスで追加して：マスの大きさ B ごとに 1 点（中心）をサンプル。B は既定 1（オフ）、めまい状態では 0.25 秒で 6px まで上げて維持。部分モザイクも用意し、指定した矩形（例：48×48px）の中だけ B=8 を適用。マスは画面座標に揃えて動いてもちらつかないように。"}, "params": "block size · sample point (centre vs average) · region mask · grid alignment · ramp time", "impl": "Fullscreen pass: uvBlock = (floor(pixel/B)+0.5)*B/screenSize; sample source at uvBlock with point filtering. For an averaged mosaic, downsample to (W/B,H/B) with a box filter then upscale with nearest. Region mosaic = same pass with a scissor rect or mask.", "related": ["TRN-10", "PIX-01", "PP-08"], "refs": [{"t": "Wikipedia — Pixelization", "u": "https://en.wikipedia.org/wiki/Pixelization"}, {"t": "Godot docs — Screen-reading shaders", "u": "https://docs.godotengine.org/en/stable/tutorials/shaders/screen-reading_shaders.html"}], "nosrc": false}, {"id": "PP-06", "cat": "PP", "sub": "風格濾鏡", "std": "Desaturation", "aliases": ["Grayscale", "Monochrome", "Black and white filter", "Saturation reduction"], "type": "S", "zh": {"name": "去飽和／灰階", "observe": "畫面的顏色變淡，最後只剩黑白灰；亮度關係保持不變，只是色彩消失。也可以只去掉一部分飽和度，或保留某一種顏色。", "notThis": "不是調色（原手冊 REN-32，改變色調而非單純去色）；也不是狀態染色（FB-05，加上某種顏色而不是去掉顏色）。灰階的辨識重點是「亮度不變、顏色消失」。", "use": "死亡或失敗畫面、回憶、暫停或時停、強調唯一保留顏色的物件（選擇性著色）。", "prompt": "在遊戲中加入去飽和後處理：亮度用 Rec.709 權重 L=0.2126R+0.7152G+0.0722B，輸出 lerp(原色, L, s)；玩家死亡時 s 在 0.8 秒內由 0 升到 1；回憶場景固定 s=0.7 並加上微暖色 #f0e0c0 乘色；可選保留紅色系（色相 ±20° 內的像素不去色）。"}, "en": {"name": "Desaturation", "observe": "The image’s colours drain until only black, white and grey remain; brightness relationships stay the same, only colour disappears. It can also remove only part of the saturation, or keep one colour.", "notThis": "Not colour grading (original handbook REN-32, which shifts tones rather than simply removing colour) nor a status tint (FB-05, adding a colour rather than removing it). Grayscale reads as same brightness, no colour.", "use": "Death or game-over screens, flashbacks, pause or time-stop, highlighting the one object that keeps its colour (selective colour).", "prompt": "Add a desaturation post-process to the game: luminance with Rec.709 weights L=0.2126R+0.7152G+0.0722B, output lerp(colour, L, s); on player death ramp s from 0 to 1 over 0.8 s; flashback scenes hold s=0.7 with a slight warm multiply #f0e0c0; optionally keep reds (pixels within ±20° hue are not desaturated)."}, "ja": {"name": "彩度低下／グレースケール", "observe": "画面の色が薄れ、最後は白黒と灰色だけになる。明るさの関係は変わらず、色だけが消える。彩度を一部だけ下げたり、特定の 1 色だけ残したりもできる。", "notThis": "カラーグレーディング（元ハンドブック REN-32、色調を変えるもので単に色を抜くのではない）や状態異常の色付け（FB-05、色を足す）とは違う。見分けるポイントは「明るさはそのまま、色だけが消える」。", "use": "死亡・ゲームオーバー画面、回想、ポーズや時間停止、1 つだけ色を残した物を目立たせる（パートカラー）。", "prompt": "ゲームに彩度低下のポストプロセスを追加して：輝度は Rec.709 の重み L=0.2126R+0.7152G+0.0722B、出力は lerp(元の色, L, s)。プレイヤー死亡時は s を 0.8 秒で 0→1、回想では s=0.7 固定でわずかに暖色 #f0e0c0 を乗算。赤系を残すオプション（色相 ±20° 以内の画素は脱色しない）も。"}, "params": "saturation amount · luminance weights · ramp time · keep-hue range · tint after desaturation", "impl": "Fullscreen pass: L = dot(rgb, float3(0.2126,0.7152,0.0722)) (on linear colour, or the gamma-space approximation); out = lerp(rgb, L.xxx, s). Selective colour: compute hue, s *= 1 - smoothstep(range, range+feather, hueDistance).", "related": ["REN-32 Color grading", "FB-05", "PP-04", "FB-11"], "refs": [{"t": "Wikipedia — Grayscale", "u": "https://en.wikipedia.org/wiki/Grayscale"}, {"t": "Wikipedia — Colorfulness (saturation)", "u": "https://en.wikipedia.org/wiki/Colorfulness"}, {"t": "Unity URP manual — Color Adjustments (saturation)", "u": "https://docs.unity3d.com/Packages/com.unity.render-pipelines.universal@14.0/manual/Post-Processing-Color-Adjustments.html"}], "nosrc": false}, {"id": "PP-07", "cat": "PP", "sub": "模糊與扭曲", "std": "Radial blur", "aliases": ["Zoom blur", "Zoom burst", "Radial motion blur", "Speed blur"], "type": "S", "zh": {"name": "放射模糊／縮放模糊", "observe": "畫面由某個中心點向外拉出放射狀的模糊條紋，中心保持清晰、越外圍越糊，像鏡頭快速推近時的效果。", "notThis": "不是動態模糊（原手冊 REN-33，沿物件或鏡頭的實際速度方向模糊）；放射模糊是固定由一點向外。也不是甩鏡轉場（TRN-14，水平方向的高速掃過）。", "use": "衝刺／加速、蓄力或必殺技瞬間、強烈衝擊、傳送或進入異空間。", "prompt": "在遊戲中加入放射模糊後處理：中心為玩家角色的螢幕位置，沿「像素→中心」方向取 10 個樣本，總長度為距離的 12%（強度 0.12），中心半徑 15% 內不模糊；衝刺時強度在 0.1 秒內升到 0.12，再用 0.3 秒 ease-out 回到 0。"}, "en": {"name": "Radial blur", "observe": "Blur streaks radiate outward from a centre point; the centre stays sharp and the outskirts smear more, like a lens zooming in fast.", "notThis": "Not motion blur (original handbook REN-33, blur along the real velocity of objects or the camera); radial blur always streaks out from one point. Not a whip pan (TRN-14, a fast horizontal sweep).", "use": "Dashes/boosts, charge-up or super-move moments, heavy impacts, teleporting or entering another realm.", "prompt": "Add a radial-blur post-process to the game: centre on the player’s screen position, take 10 samples along the pixel→centre direction over 12% of the distance (strength 0.12), no blur inside 15% radius; on a dash ramp strength to 0.12 over 0.1 s, then ease out to 0 over 0.3 s."}, "ja": {"name": "放射ブラー／ズームブラー", "observe": "画面のある中心点から外へ放射状のブラーの筋が伸び、中心はくっきり、外側ほどぼやける。レンズを素早くズームしたような見た目。", "notThis": "モーションブラー（元ハンドブック REN-33、物体やカメラの実際の速度方向にぼかす）とは違い、放射ブラーは常に 1 点から外へ。ホイップパン（TRN-14、横方向の高速スイープ）とも違う。", "use": "ダッシュ・加速、溜めや必殺技の瞬間、強い衝撃、テレポートや異空間への突入。", "prompt": "ゲームに放射ブラーのポストプロセスを追加して：中心はプレイヤーの画面上の位置、「画素→中心」方向に 10 サンプル、長さは距離の 12%（強さ 0.12）、半径 15% 以内はぼかさない。ダッシュ時は 0.1 秒で強さ 0.12 まで上げ、0.3 秒の ease-out で 0 に戻す。"}, "params": "centre · strength (streak length) · sample count · clear radius · ramp in/out", "impl": "Fullscreen pass: dir = centre - uv; accumulate N samples of src at uv + dir*strength*(i/N), weighted equally (or falling off); mask with smoothstep(clearRadius, clearRadius+0.1, length(dir)). Two cheaper passes of N/2 samples with the second at half step approximates more samples.", "related": ["REN-33 Motion blur", "TRN-14", "FB-09", "PP-08"], "refs": [{"t": "Wikipedia — Zoom burst", "u": "https://en.wikipedia.org/wiki/Zoom_burst"}, {"t": "GPU Gems 3, ch. 13 — Volumetric light scattering as a post-process (radial blur)", "u": "https://developer.nvidia.com/gpugems/gpugems3/part-ii-light-and-shadows/chapter-13-volumetric-light-scattering-post-process"}], "nosrc": false}, {"id": "PP-08", "cat": "PP", "sub": "模糊與扭曲", "std": "Gaussian blur", "aliases": ["Kawase blur", "Dual Kawase blur", "Box blur", "Background blur", "Screen blur"], "type": "S", "zh": {"name": "高斯模糊／Kawase 模糊", "observe": "畫面（或背景）整體均勻變朦，沒有方向性；常見於暫停選單或對話時把遊戲畫面糊掉，讓前景的 UI 更清楚。", "notThis": "不是景深（原手冊 REN-34，依距離只模糊焦點前後）；也不是放射模糊（PP-07，有方向）。高斯／Kawase 是「無方向、均勻」的模糊，兩者只是演算法不同（Kawase 以多次擴大取樣距離的少量取樣，近似高斯但更快）。", "use": "暫停選單、背包或對話的背景、毛玻璃 UI、bloom 與其他效果的內部步驟。", "prompt": "在遊戲中暫停時模糊背景：把畫面降到 1/2 解析度，用 4 次 dual-Kawase（下採樣再上採樣）模糊，等效半徑約 8px；暫停選單打開時半徑在 0.2 秒內由 0 漸增，並同時把背景亮度乘 0.7；只在暫停瞬間模糊一次並快取結果，不必每幀重算。"}, "en": {"name": "Gaussian blur", "observe": "The whole image (or background) becomes evenly soft with no direction; common behind pause menus or dialogue so the foreground UI reads clearly.", "notThis": "Not depth of field (original handbook REN-34, blurring only in front of/behind the focus by distance) nor radial blur (PP-07, directional). Gaussian/Kawase is uniform, directionless blur; they differ only in algorithm (Kawase takes a few samples at growing offsets over several passes, approximating a Gaussian more cheaply).", "use": "Pause menus, inventory or dialogue backdrops, frosted-glass UI, an internal step of bloom and other effects.", "prompt": "Blur the background when the game is paused: downsample the frame to 1/2 resolution and blur with 4 dual-Kawase passes (down then up), about an 8 px equivalent radius; ramp the radius from 0 over 0.2 s as the pause menu opens and multiply background brightness by 0.7; blur once when pausing and cache the result instead of recomputing every frame."}, "ja": {"name": "ガウスぼかし／Kawase ブラー", "observe": "画面（または背景）全体が方向性なく均一にぼやける。ポーズメニューや会話中にゲーム画面をぼかして、手前の UI を読みやすくするのによく使う。", "notThis": "被写界深度（元ハンドブック REN-34、距離に応じてピントの前後だけぼかす）や放射ブラー（PP-07、方向がある）とは違う。ガウスと Kawase はどちらも「方向のない均一な」ぼかしで、違いはアルゴリズムだけ（Kawase は複数パスでサンプル間隔を広げながら少ないサンプルでガウスに近づける、より高速な手法）。", "use": "ポーズメニュー、インベントリや会話の背景、すりガラス風 UI、ブルームなど他の効果の内部処理。", "prompt": "ゲームのポーズ中に背景をぼかして：画面を 1/2 解像度に縮小し、dual-Kawase（縮小→拡大）を 4 パスかけて半径約 8px 相当に。ポーズメニューを開くと 0.2 秒で半径を 0 から上げ、同時に背景の明るさを ×0.7。ぼかしはポーズした瞬間に 1 回だけ行って結果をキャッシュし、毎フレーム計算しない。"}, "params": "radius / sigma · pass count · downsample factor · algorithm (separable Gaussian / Kawase / dual filter / box) · dim amount", "impl": "Separable Gaussian: horizontal then vertical pass, using bilinear taps between texels to halve sample count. Kawase: each pass samples 4 diagonal taps at offset (i+0.5) texels, ping-ponging between two targets. Dual filter: progressively downsample then upsample with 4–8 taps per pass.", "related": ["REN-34 Depth of field", "PP-07", "REN-29 Bloom", "PP-05"], "refs": [{"t": "Wikipedia — Gaussian blur", "u": "https://en.wikipedia.org/wiki/Gaussian_blur"}, {"t": "Wikipedia — Box blur", "u": "https://en.wikipedia.org/wiki/Box_blur"}, {"t": "RasterGrid — Efficient Gaussian blur with linear sampling", "u": "https://www.rastergrid.com/blog/2010/09/efficient-gaussian-blur-with-linear-sampling/"}, {"t": "ARM, SIGGRAPH 2015 — Bandwidth-efficient rendering (Kawase / dual-filter blur, PDF)", "u": "https://community.arm.com/cfs-file/__key/communityserver-blogs-components-weblogfiles/00-00-00-20-66/siggraph2015_2D00_mmg_2D00_marius_2D00_slides.pdf"}], "nosrc": false}, {"id": "PP-09", "cat": "PP", "sub": "模糊與扭曲", "std": "Screen-space distortion", "aliases": ["Refraction distortion", "Heat distortion", "Displacement post-process", "Screen warp"], "type": "C", "zh": {"name": "全畫面扭曲（螢幕空間扭曲）", "observe": "某一塊畫面（或整個畫面）的影像被推開、彎曲或波動，像透過玻璃、水或熱空氣看過去；物件本身沒有變形，是「畫面影像」被位移取樣。", "notThis": "不是熱浪（ENV-17，是這個技術的一種環境應用，固定在熱源上方）；也不是衝擊波（VFX-06，可用此技術做，但它是一次性的圓環特效）。本條指通用的「讀取已渲染畫面再偏移 UV」技術本身。", "use": "透明護盾、水下或酒醉晃動、傳送門、隱形角色的輪廓、爆炸氣浪、熱浪。", "prompt": "在遊戲中加入全畫面扭曲層：特效把「偏移向量」畫到一張半解析度的扭曲緩衝（RG 通道，±8px），最後合成時以該偏移重新取樣畫面；示例：一個半徑 28px 的透明氣泡沿路徑移動，像放大鏡般把影像向外推，偏移在半徑中段最大 6px、中心與邊緣為 0，氣泡邊緣加 1px 白色高光；扭曲緩衝每幀清空。"}, "en": {"name": "Screen-space distortion", "observe": "Part of the image (or all of it) is pushed, bent or wobbled, as if seen through glass, water or hot air; the objects themselves don’t deform — the rendered image is resampled with an offset.", "notThis": "Not heat haze (ENV-17, one environmental application of this technique fixed above a heat source) nor a shockwave (VFX-06, which can be built with it but is a one-off ring effect). This entry is the general technique: read the rendered frame and offset its UVs.", "use": "Transparent shields, underwater or drunk wobble, portals, the outline of invisible characters, explosion blasts, heat haze.", "prompt": "Add a screen-distortion layer to the game: effects draw offset vectors into a half-resolution distortion buffer (RG channels, ±8 px), and the final composite resamples the frame by that offset; example: a 28 px-radius transparent bubble moving along a path that magnifies like a lens, offset peaking at 6 px mid-radius and 0 at the centre and rim, with a 1 px white rim highlight; clear the distortion buffer every frame."}, "ja": {"name": "画面空間の歪み（スクリーンディストーション）", "observe": "画面の一部（または全体）の映像が押しのけられ、曲がり、揺らぎ、ガラスや水や熱気越しに見たようになる。物体自体は変形せず、「描画済みの画面」をずらしてサンプルしている。", "notThis": "陽炎（ENV-17、熱源の上に固定されたこの技術の環境への応用例）や衝撃波（VFX-06、この技術で作れるが一回きりのリング状エフェクト）とは違い、本項目は「描画済み画面を読んで UV をずらす」汎用技術そのもの。", "use": "透明なシールド、水中や酔いの揺れ、ポータル、透明キャラの輪郭、爆風、陽炎。", "prompt": "ゲームに画面歪みレイヤーを追加して：エフェクトは「ずれのベクトル」を半解像度の歪みバッファ（RG チャンネル、±8px）に描き、最終合成でそのずれを使って画面をサンプルし直す。例：半径 28px の透明な泡が経路に沿って動き、レンズのように映像を拡大し、ずれは半径の中ほどで最大 6px・中心と縁で 0、縁に 1px の白いハイライト。歪みバッファは毎フレームクリア。"}, "params": "offset strength (px) · distortion buffer resolution · normal/noise texture · mask shape · chromatic split · rim highlight", "impl": "Copy the scene colour to a texture (it cannot be read while bound as the render target). Effects render offset vectors (from a normal map or analytic shape) additively into an RG16F target; composite: out = scene.Sample(uv + offset.rg*strength/screenSize).", "related": ["ENV-17", "VFX-06", "VFX-03", "PP-07", "REN-36 Chromatic aberration"], "refs": [{"t": "GPU Gems 2, ch. 19 — Generic refraction simulation", "u": "https://developer.nvidia.com/gpugems/gpugems2/part-ii-shading-lighting-and-shadows/chapter-19-generic-refraction-simulation"}, {"t": "Godot docs — Screen-reading shaders", "u": "https://docs.godotengine.org/en/stable/tutorials/shaders/screen-reading_shaders.html"}, {"t": "Wikipedia — Heat haze", "u": "https://en.wikipedia.org/wiki/Heat_haze"}], "nosrc": false}, {"id": "PP-10", "cat": "PP", "sub": "模糊與扭曲", "std": "Sharpening", "aliases": ["CAS", "Contrast adaptive sharpening", "Unsharp mask", "Sharpen filter"], "type": "S", "zh": {"name": "銳化（含 CAS）", "observe": "邊緣與細節變得更清晰、對比更高，紋理更「脆」；過度時邊緣出現亮暗白邊（光暈）與雜訊被放大。", "notThis": "不是抗鋸齒（原手冊 REN-39，作用是把鋸齒弄平）；銳化方向相反，是強化邊緣。也常與升頻（原手冊 REN-42）或 TAA（REN-40）一起使用，用來補回它們帶來的模糊。", "use": "補償 TAA 或低解析度升頻造成的柔化、讓遠處紋理更清楚、圖像選項中的「銳利度」滑桿。", "prompt": "在遊戲中加入銳化後處理並放在最後（UI 之前）：使用對比自適應銳化（CAS），以十字形 5 個樣本估計局部對比，低對比區域銳化較強、高對比邊緣較弱以避免白邊；銳利度滑桿 0–1（預設 0.4）；與 TAA 或升頻同時開啟時預設 0.6。"}, "en": {"name": "Sharpening", "observe": "Edges and details become crisper with more local contrast and textures look “crunchier”; overdone, bright/dark halos appear around edges and noise is amplified.", "notThis": "Not anti-aliasing (original handbook REN-39, which smooths jaggies); sharpening does the opposite and boosts edges. Often paired with upscaling (REN-42) or TAA (REN-40) to win back the softness they cause.", "use": "Compensating TAA or low-res upscaling softness, clearer distant textures, the “sharpness” slider in graphics options.", "prompt": "Add a sharpening post-process to the game, run last before UI: use contrast adaptive sharpening (CAS), estimating local contrast from a 5-tap cross; sharpen low-contrast areas more and high-contrast edges less to avoid halos; sharpness slider 0–1 (default 0.4), default 0.6 when TAA or upscaling is on."}, "ja": {"name": "シャープネス（CAS を含む）", "observe": "輪郭や細部がくっきりして局所的なコントラストが上がり、テクスチャが「パリッと」見える。かけすぎると輪郭に明暗のふち（ハロー）が出て、ノイズも強調される。", "notThis": "アンチエイリアス（元ハンドブック REN-39、ジャギーをなめらかにする）とは逆で、輪郭を強める。アップスケーリング（REN-42）や TAA（REN-40）と組み合わせて、それらによるぼやけを取り戻すのによく使う。", "use": "TAA や低解像度アップスケールの甘さの補正、遠景のテクスチャをはっきりさせる、グラフィック設定の「シャープネス」スライダー。", "prompt": "ゲームにシャープネスのポストプロセスを追加し、最後（UI の前）にかけて：コントラスト適応シャープニング（CAS）を使い、十字形の 5 サンプルで局所コントラストを推定。低コントラスト部分は強く、高コントラストの輪郭は弱くしてハローを防ぐ。シャープネスのスライダー 0〜1（既定 0.4）、TAA やアップスケール使用時は既定 0.6。"}, "params": "sharpness amount · kernel (cross / 3×3) · adaptive limit · run before/after upscale · noise threshold", "impl": "Unsharp mask: out = src + amount*(src - blur(src)). CAS-style: from the 4-neighbour cross get min/max; w = sqrt(min(minC, 1-maxC)/maxC) * lerp(-1/8, -1/5, sharpness); out = (src + w*(n+s+e+w4)) / (1 + 4w). Clamp to avoid ringing.", "related": ["REN-39 FXAA", "REN-40 TAA", "REN-42 Upscaling", "PP-08"], "refs": [{"t": "Wikipedia — Unsharp masking", "u": "https://en.wikipedia.org/wiki/Unsharp_masking"}, {"t": "AMD GPUOpen — FidelityFX Contrast Adaptive Sharpening (CAS)", "u": "https://gpuopen.com/fidelityfx-cas/"}, {"t": "AMD FidelityFX SDK manual — Contrast Adaptive Sharpening", "u": "https://gpuopen.com/manuals/fidelityfx_sdk/techniques/contrast-adaptive-sharpening/"}], "nosrc": false}, {"id": "PP-11", "cat": "PP", "sub": "鏡頭模擬", "std": "Lens dirt", "aliases": ["Lens dirt mask", "Dirt mask", "Bloom dirt", "Dirty lens"], "type": "C", "zh": {"name": "鏡頭污漬（Lens dirt）", "observe": "當強光（太陽、爆炸、燈）在畫面中時，鏡片上的灰塵、指紋、水痕與光斑被照亮浮現；光源越亮越近就越明顯，沒有強光時完全看不到。", "notThis": "不是鏡頭光暈（原手冊 REN-35，沿光源與畫面中心連線排列的鬼影光斑）；污漬的位置固定在「鏡片」上，不隨光源移動，只有亮度隨光源變化。也不是暗角（PP-01，常駐的邊緣變暗）。", "use": "強化逆光與爆炸的衝擊感、寫實或攝影機視角的質感、太空與科幻場景。", "prompt": "在遊戲中加入鏡頭污漬：準備一張全螢幕污漬遮罩（柔和圓斑、六角光斑、少量刮痕，大部分為黑色），在 bloom 合成時以「bloom 亮度 × 污漬遮罩 × 強度 1.5」加法疊加；只有 bloom 超過門檻（亮度 1.0 以上）的區域附近會亮出污漬；強度可設 0 關閉。"}, "en": {"name": "Lens dirt", "observe": "When a strong light (sun, explosion, lamp) is on screen, dust, fingerprints, water marks and specks on the lens light up; the brighter and closer the light, the more visible, and with no strong light they vanish entirely.", "notThis": "Not a lens flare (original handbook REN-35, ghost spots lined up between the light and the screen centre); dirt stays fixed on the “lens” and doesn’t move with the light — only its brightness follows it. Not a vignette (PP-01, constant edge darkening).", "use": "Selling backlight and explosion impact, a realistic or camera-POV texture, space and sci-fi scenes.", "prompt": "Add lens dirt to the game: author a fullscreen dirt mask (soft round blotches, hexagonal specks, a few scratches, mostly black) and during bloom compositing add bloom × dirtMask × intensity 1.5; dirt only lights up near areas where bloom exceeds the threshold (luminance > 1.0); intensity 0 disables it."}, "ja": {"name": "レンズダート（レンズの汚れ）", "observe": "強い光（太陽、爆発、照明）が画面にあると、レンズ上のほこり・指紋・水滴の跡・光の粒が照らされて浮かび上がる。光が明るく近いほど目立ち、強い光がなければまったく見えない。", "notThis": "レンズフレア（元ハンドブック REN-35、光源と画面中心を結ぶ線上に並ぶゴースト）とは違い、汚れは「レンズ」に固定されて光源と一緒に動かず、明るさだけが光に追従する。ビネット（PP-01、常に縁が暗い）とも違う。", "use": "逆光や爆発の迫力を強める、写実的またはカメラ視点の質感、宇宙や SF の場面。", "prompt": "ゲームにレンズダートを追加して：全画面の汚れマスク（柔らかい丸い染み、六角形の光の粒、少しの擦り傷、大部分は黒）を用意し、ブルーム合成時に「ブルーム × 汚れマスク × 強度 1.5」を加算。ブルームがしきい値（輝度 1.0 以上）を超えた付近だけ汚れが光る。強度 0 で無効に。"}, "params": "dirt texture · intensity · bloom threshold · tint · which bloom mip feeds it", "impl": "In the bloom composite: dirtContribution = bloomWide.rgb * dirtTex.Sample(screenUV).rgb * dirtIntensity, using a wide (low-mip) bloom level so a bright source lights dirt far from itself; out = scene + bloom + dirtContribution. The dirt texture is in screen space, not world space.", "related": ["REN-29 Bloom", "REN-35 Lens flare", "PP-01", "VFX-09"], "refs": [{"t": "Unity URP manual — Bloom (Lens Dirt)", "u": "https://docs.unity3d.com/Packages/com.unity.render-pipelines.universal@14.0/manual/post-processing-bloom.html"}, {"t": "Unreal Engine docs — Bloom (Dirt Mask)", "u": "https://dev.epicgames.com/documentation/en-us/unreal-engine/bloom-in-unreal-engine"}, {"t": "Wikipedia — Lens flare", "u": "https://en.wikipedia.org/wiki/Lens_flare"}], "nosrc": false}, {"id": "ANI-01", "cat": "ANI", "sub": "動畫原則", "std": "Smear frame", "aliases": ["Smears", "Smear drawing", "Multiples"], "type": "S", "zh": {"name": "拖影變形格（Smear frame）", "observe": "快速揮擊或轉身時，中間有 1–2 格角色或武器被刻意拉長、扭曲成一條模糊的形狀，或同一肢體畫出好幾個；單格停下來看很怪，連續播放時卻讓動作顯得極快而流暢。", "notThis": "不是揮砍特效（VFX-07，額外疊上的發光弧線）；拖影格是角色本身的畫法被拉長。也不是殘影（保留數個完整分開的姿勢），也不是後處理的動態模糊（PP-07，對整個畫面做模糊）。", "use": "快速攻擊、衝刺、轉身；在幀數很少的像素或手繪動畫中補足速度感。", "prompt": "在遊戲中，為主角的橫斬（共 6 格、每格 50 ms）在第 3 格插入一張拖影格：把刀刃與手臂沿揮動方向拉成約 3 倍長的彎月形，前端實色、後端漸淡，持續 1 格（50 ms）；前後兩格保持清楚的預備與收招姿勢。"}, "en": {"name": "Smear frame", "observe": "During a fast swing or turn, one or two frames deliberately stretch and distort the character or weapon into a blurred streak, or draw the same limb several times; a single frame looks odd when paused, but in playback the motion reads as very fast and fluid.", "notThis": "Not slash VFX (VFX-07, an extra glowing arc layered on top); a smear is the character drawing itself being stretched. Not afterimages (several separate complete poses), and not post-process motion blur (PP-07, blurring the whole image).", "use": "Fast attacks, dashes and turns; adding speed to low-frame-count pixel or hand-drawn animation.", "prompt": "In your game, for the hero’s horizontal slash (6 frames, 50 ms each), insert a smear on frame 3: stretch the blade and arm along the swing into a crescent about 3× longer, solid at the leading edge and fading at the tail, for one frame (50 ms); keep clear wind-up and follow-through poses on either side."}, "ja": {"name": "スミア（Smear frame）", "observe": "素早い振りや振り向きの途中 1〜2 コマで、キャラや武器を意図的に引き伸ばしたり歪めたりして流れた形にする、または同じ手足を何本も描く。一時停止すると奇妙だが、再生すると動きが非常に速く滑らかに見える。", "notThis": "斬撃エフェクト（VFX-07、上に重ねる光る弧）とは違い、キャラの絵そのものを伸ばす。残像（完全な姿勢を複数残す）でも、画面全体をぼかすモーションブラー（PP-07）でもない。", "use": "素早い攻撃、ダッシュ、振り向き。コマ数の少ないドット絵や手描きアニメに速さを足す。", "prompt": "ゲームで、主人公の横斬り（全 6 コマ、各 50 ms）の 3 コマ目にスミアを入れて：刀身と腕を振りの方向に約 3 倍の長さの三日月形に引き伸ばし、先端はベタ塗り、後端は薄くする。表示は 1 コマ（50 ms）。前後のコマは予備動作とフォロースルーの姿勢をはっきり保つ。"}, "params": "smear length (×2–4) · frames shown (1–2) · shape (stretch / multiples / streak) · fade at tail · which frame of the swing", "impl": "Authored as ordinary frames in the sprite sheet or as a deformed mesh/blend shape for 1–2 frames; nothing special at runtime. For 3D, scale the limb bone along its velocity or swap in a stretched mesh for the peak frame. Keep the leading edge crisp so the silhouette still reads.", "related": ["VFX-07", "PP-07", "ANI-02", "ANI-03", "PIX-14"], "refs": [{"t": "Wikipedia — Smear frame", "u": "https://en.wikipedia.org/wiki/Smear_frame"}, {"t": "Wikipedia — Twelve basic principles of animation", "u": "https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation"}], "nosrc": false}, {"id": "ANI-02", "cat": "ANI", "sub": "動畫原則", "std": "Animating on twos", "aliases": ["Stepped animation", "On twos / on threes", "Limited animation", "Stepped interpolation"], "type": "S", "zh": {"name": "一拍二／逐格動畫（On twos）", "observe": "角色動作不是每一格都更新，而是每兩格（或三格）才換一個姿勢，動作有一種「一頓一頓」的手繪感；在 3D 遊戲中常見於刻意模仿手繪或定格動畫的風格，鏡頭與背景仍然順暢移動。", "notThis": "不是低幀率或卡頓（整個遊戲都慢）；只有角色姿勢故意降格，其他東西照常流暢。也不是次像素動畫（PIX-14，在不改輪廓下做細微移動）。", "use": "手繪、動畫片或定格動畫風格；讓 3D 角色帶有 2D 的節奏感；強調關鍵姿勢。", "prompt": "在遊戲中，讓角色動畫以「一拍二」播放：動畫取樣固定在 12 fps（每 83 ms 換一次姿勢，不做插值），但角色在世界中的位移、鏡頭和特效仍以 60 fps 更新；在放大招時切成一拍一（24 fps）讓動作更順。"}, "en": {"name": "Animating on twos (stepped animation)", "observe": "The character’s pose does not update every frame but every second (or third) frame, giving a choppy, hand-drawn rhythm; in 3D games it is used to mimic hand-drawn or stop-motion styles while the camera and background still move smoothly.", "notThis": "Not low frame rate or lag (the whole game slows); only the character’s pose is deliberately stepped while everything else stays smooth. Not sub-pixel animation (PIX-14, subtle motion without changing the outline).", "use": "Hand-drawn, cartoon or stop-motion looks; giving 3D characters a 2D rhythm; emphasising key poses.", "prompt": "In your game, play character animation on twos: sample the animation at a fixed 12 fps (a new pose every 83 ms, no interpolation), but keep world movement, camera and VFX at 60 fps; switch to ones (24 fps) during super moves so they read smoother."}, "ja": {"name": "2コマ打ち（ステップアニメーション）", "observe": "キャラのポーズが毎フレームではなく 2（または 3）フレームごとに切り替わり、カクカクした手描きのリズムになる。3D ゲームでは手描きやストップモーション風を狙って使われ、カメラや背景は滑らかに動き続ける。", "notThis": "フレームレート低下やカクつき（ゲーム全体が遅い）とは違い、キャラのポーズだけを意図的に間引き、他は滑らかなまま。サブピクセルアニメ（PIX-14、輪郭を変えない微細な動き）とも違う。", "use": "手描き・アニメ・ストップモーション風の表現、3D キャラに 2D のリズムを与える、キーポーズの強調。", "prompt": "ゲームで、キャラのアニメーションを 2 コマ打ちで再生して：アニメのサンプリングを固定 12 fps（83 ms ごとにポーズ更新、補間なし）にし、ワールド上の移動・カメラ・エフェクトは 60 fps のまま。必殺技の間だけ 1 コマ打ち（24 fps）に切り替えて滑らかにする。"}, "params": "pose rate (8 / 12 / 24 fps) · interpolation off (stepped) · which layers are stepped · switch to ones for key moments", "impl": "Quantise the animation sample time: t_sampled = floor(t * rate) / rate before evaluating the clip (or use constant/stepped key interpolation). Root motion and camera keep using unquantised time so movement stays smooth.", "related": ["PIX-14", "ANI-01", "ANI-03"], "refs": [{"t": "Wikipedia — Traditional animation (\"Shooting on twos\")", "u": "https://en.wikipedia.org/wiki/Traditional_animation"}, {"t": "Wikipedia — Limited animation", "u": "https://en.wikipedia.org/wiki/Limited_animation"}, {"t": "Blender Manual — F-Curve modifiers (Stepped Interpolation)", "u": "https://docs.blender.org/manual/en/latest/editors/graph_editor/fcurves/modifiers.html"}], "nosrc": false}, {"id": "ANI-03", "cat": "ANI", "sub": "動畫原則", "std": "Hold frame / Impact frame", "aliases": ["Held pose", "Impact hold", "Impact frames", "ショックコマ"], "type": "C", "zh": {"name": "停格強調／衝擊格（Impact frame）", "observe": "打中的瞬間，角色停在最有力的姿勢上多留幾格（hold），或插入 1–3 格風格完全不同的畫面：黑白反轉、單色剪影、粗放射線，然後立即回到正常畫面，令這一擊顯得特別重。", "notThis": "不是 hitstop（命中時整個遊戲時間暫停），停格只是動畫本身拉長某一姿勢。也不是受擊閃白（FB-01，只把被打的角色刷白）或終結定格（FB-11，整個畫面慢下來演出）。衝擊格是改變整個畫面的繪畫風格。", "use": "重擊、必殺技、反擊成功；動畫片或動漫風格的戰鬥演出。", "prompt": "在遊戲中，重擊命中時：攻擊者停在出拳姿勢 3 格（50 ms），同時插入 2 格（每格 33 ms）衝擊格——整個畫面變成黑底、角色白色剪影、加 16 條從命中點放射的白線；第 2 格黑白反轉，之後立即回到彩色畫面並播放火花。"}, "en": {"name": "Hold frame / impact frame", "observe": "At the moment of a hit the character stays on the strongest pose for a few extra frames (a hold), or 1–3 frames in a completely different style are inserted — inverted black and white, a flat silhouette, bold radiating lines — then the image snaps back, making the blow feel heavy.", "notThis": "Not hitstop (pausing game time on contact); a hold only lengthens one pose of the animation. Not a hit flash (FB-01, only the victim turns white) or a freeze-frame finisher (FB-11, the whole scene slows for a finishing shot). An impact frame changes the drawing style of the whole image.", "use": "Heavy hits, super moves, successful counters; cartoon or anime-style combat.", "prompt": "In your game, when a heavy hit lands: hold the attacker on the punch pose for 3 frames (50 ms), and insert 2 impact frames (33 ms each) — whole screen black, characters as white silhouettes, 16 white lines radiating from the hit point; invert black and white on the second frame, then snap back to colour and play the sparks."}, "ja": {"name": "ホールド／インパクトフレーム（ショックコマ）", "observe": "当たった瞬間、キャラが最も力強いポーズで数コマ止まる（ホールド）、または白黒反転・単色シルエット・太い集中線など全く違う画風のコマを 1〜3 コマ挟み、すぐに通常画面に戻して一撃を重く見せる。", "notThis": "ヒットストップ（命中時にゲーム時間全体を止める）とは違い、ホールドはアニメの一つのポーズを伸ばすだけ。ヒットフラッシュ（FB-01、被弾側だけ白くなる）やフィニッシュの静止演出（FB-11、場面全体がスローになる）とも違う。インパクトフレームは画面全体の描き方を変える。", "use": "強攻撃、必殺技、カウンター成功。アニメ調の戦闘演出。", "prompt": "ゲームで強攻撃が当たったとき：攻撃側をパンチのポーズで 3 フレーム（50 ms）ホールドし、同時にインパクトフレームを 2 コマ（各 33 ms）挟んで——画面全体を黒にしてキャラを白いシルエットにし、命中点から白い集中線を 16 本描く。2 コマ目は白黒反転し、その後すぐカラーに戻して火花を出す。"}, "params": "hold length (2–6 frames) · impact frames (1–3) · style (invert / silhouette / radial lines / accent colour) · reserve for big hits only", "impl": "Hold: extend the key frame duration in the clip or freeze the animator for N frames on the hit notify. Impact frame: a fullscreen pass for 1–3 frames that thresholds luminance to two tones (optionally inverted) and draws radial lines from the hit point; trigger it from the same hit event.", "related": ["FB-01", "FB-11", "FB-10", "ANI-01", "ANI-05"], "refs": [{"t": "Sakugabooru wiki — impact frames (ショックコマ)", "u": "https://www.sakugabooru.com/wiki/show?title=impact_frames"}, {"t": "Sakuga Blog — Glossary (Impact Frames)", "u": "https://blog.sakugabooru.com/glossary/"}, {"t": "Wikipedia — Twelve basic principles of animation", "u": "https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation"}], "nosrc": false}, {"id": "ANI-04", "cat": "ANI", "sub": "角色狀態", "std": "Idle animation", "aliases": ["Breathing idle", "Idle loop", "Fidget animation", "Idle break"], "type": "S", "zh": {"name": "待機動畫（呼吸）", "observe": "玩家沒有操作時，角色不是完全靜止，而是循環播放細微的呼吸起伏、眨眼、頭髮或衣服輕擺；站久了可能再播一段較長的小動作（伸懶腰、看四周）。", "notThis": "不是次要動作（主要動作進行時附加的小動作）；待機是「什麼都沒做時」的狀態。也不是彈簧骨骼（ANI-10，由物理推動的擺動）；待機通常是預先做好的循環動畫。", "use": "讓角色和場景看起來是活的；顯示「可以操作」；讓玩家感受角色個性。", "prompt": "在遊戲中，為主角加入待機動畫：4 格循環、每格 200 ms，身體上下起伏 1 px（吸氣時胸口上移、肩膀稍微抬起）；每 3–5 秒（以固定種子決定）眨眼一次，持續 100 ms；閒置超過 8 秒後播放一次 1.5 秒的伸懶腰小動作，再回到呼吸循環。"}, "en": {"name": "Idle animation (breathing)", "observe": "When the player is not giving input, the character is not frozen but loops subtle breathing, blinking, and gentle hair or cloth movement; after a while it may play a longer fidget (stretching, looking around).", "notThis": "Not secondary action (small motions added while a main action plays); idle is the state of \"doing nothing\". Not spring bones (ANI-10, physics-driven sway); an idle is usually an authored loop.", "use": "Makes characters and scenes feel alive; shows the character is ready for input; conveys personality.", "prompt": "In your game, give the hero an idle: a 4-frame loop at 200 ms per frame with a 1 px body bob (chest rises and shoulders lift slightly on the inhale); blink for 100 ms every 3–5 s (chosen with a fixed seed); after 8 s without input play a 1.5 s stretch fidget once, then return to the breathing loop."}, "ja": {"name": "待機モーション（呼吸）", "observe": "操作していないとき、キャラが完全に止まらず、かすかな呼吸の上下、まばたき、髪や服の揺れをループする。しばらく放置すると長めの仕草（伸び、周りを見回す）を再生することもある。", "notThis": "セカンダリーアクション（主動作中に足す小さな動き）とは違い、待機は「何もしていない」状態。スプリングボーン（ANI-10、物理による揺れ）とも違い、通常は作り込んだループアニメ。", "use": "キャラや場面に生命感を与える、操作可能であることを示す、キャラの個性を伝える。", "prompt": "ゲームで主人公に待機モーションを追加して：4 コマループ、各 200 ms、体を 1 px 上下させる（吸気で胸が上がり肩が少し上がる）。3〜5 秒ごと（固定シードで決定）に 100 ms のまばたき。8 秒以上操作がなければ 1.5 秒の伸びを 1 回再生し、呼吸ループに戻る。"}, "params": "loop length · bob amplitude (1–2 px) · blink interval & length · fidget delay & pool · offset per character so crowds don’t sync", "impl": "A looping clip in the default state of the animation state machine; trigger idle breaks from a timer after N seconds without input, picked from a small pool. Add a per-instance time offset so several characters don’t breathe in sync.", "related": ["ANI-10", "ANI-02", "PIX-14"], "refs": [{"t": "Wikipedia — Idle animation", "u": "https://en.wikipedia.org/wiki/Idle_animation"}, {"t": "Wikipedia — Twelve basic principles of animation", "u": "https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation"}], "nosrc": false}, {"id": "ANI-05", "cat": "ANI", "sub": "角色狀態", "std": "Hit reaction", "aliases": ["Flinch", "Hit react", "Stagger", "Hurt animation"], "type": "S", "zh": {"name": "受擊反應／畏縮（Hit reaction）", "observe": "被打中時角色的身體朝攻擊方向的反方向縮一下或後仰：頭和上身先被推開，然後慢慢回到原本姿勢；重擊時變成踉蹌或倒地。打從前面和背後時方向不同。", "notThis": "不是 hitstun（受擊硬直，指不能行動的時間長度）；受擊反應是看得到的身體動作，兩者可以分開設計。也不是受擊閃白（FB-01，顏色變化）或擊退（整個角色被推離原位），也不是受擊擠壓（FB-13，單純縮放變形）。", "use": "讓玩家確認打中了、從哪個方向打中；區分輕擊、重擊。", "prompt": "在遊戲中，為敵人加入受擊反應：判斷攻擊來自前方或後方，播放對應方向的畏縮——頭和上身在 60 ms 內向反方向傾 15°，再用 300 ms ease-out 回正；輕擊只影響上半身（下半身繼續走路），重擊改為 0.8 秒全身踉蹌並後退 6 px。"}, "en": {"name": "Hit reaction (flinch)", "observe": "When struck, the character’s body recoils away from the hit: the head and upper body are pushed back first, then ease back to the original pose; heavy hits become a stagger or knockdown. Hits from the front and back recoil in different directions.", "notThis": "Not hitstun (how long the character cannot act); the hit reaction is the visible body motion, and the two can be designed separately. Not a hit flash (FB-01, a colour change), not knockback (the whole character is pushed away), and not squash on hit (FB-13, a pure scale deformation).", "use": "Confirms the hit landed and from which side; distinguishes light from heavy hits.", "prompt": "In your game, give enemies hit reactions: determine whether the hit came from the front or back and play a matching flinch — head and upper body tilt 15° away within 60 ms, then return over 300 ms ease-out; light hits affect only the upper body (the legs keep walking), heavy hits switch to a 0.8 s full-body stagger that steps back 6 px."}, "ja": {"name": "被弾リアクション（のけぞり）", "observe": "攻撃を受けると、体が攻撃と反対方向へのけぞる。頭と上半身が先に押され、その後ゆっくり元の姿勢に戻る。強攻撃ではよろめきやダウンになる。正面と背後からでは方向が変わる。", "notThis": "ヒットストップの後の硬直（行動不能の時間の長さ）とは違い、被弾リアクションは目に見える体の動きで、別々に設計できる。ヒットフラッシュ（FB-01、色の変化）、ノックバック（キャラ全体が押し出される）、被弾時のつぶれ（FB-13、単純な拡縮）とも違う。", "use": "当たったこと、どちらから当たったかを伝える。弱攻撃と強攻撃を区別する。", "prompt": "ゲームで敵に被弾リアクションを追加して：攻撃が前方か後方かを判定して対応する向きののけぞりを再生——頭と上半身を 60 ms で反対方向へ 15° 傾け、300 ms の ease-out で戻す。弱攻撃は上半身のみ（下半身は歩き続ける）、強攻撃は 0.8 秒の全身よろめきで 6 px 後退。"}, "params": "direction set (front / back / left / right) · strength tiers (flinch / stagger / knockdown) · snap-in time (0.05–0.1 s) · recovery time · upper-body only vs full body", "impl": "Pick a clip from the angle between the character’s forward vector and the hit direction; light flinches play as an additive layer masked to the upper body so locomotion continues, heavy ones as full-body states. Blend in very fast, out slowly; restart on repeated hits.", "related": ["FB-01", "FB-13", "ANI-03", "ANI-06", "ANI-09"], "refs": [{"t": "Game Developer — The role of animations in hit effects", "u": "https://www.gamedeveloper.com/programming/the-role-of-animations-in-hit-effects"}, {"t": "Player Motion — Hit reaction animations for games (flinch, stagger, knockdown, death)", "u": "https://playermotion.games/playbook/hit-reaction-animations"}], "nosrc": false}, {"id": "ANI-06", "cat": "ANI", "sub": "角色狀態", "std": "Death animation", "aliases": ["Defeat animation", "Death pose", "KO animation"], "type": "C", "zh": {"name": "死亡動畫", "observe": "角色被打倒時播放的一段身體動作：例如跪下後向前倒、被擊飛後落地彈一下，最後停在倒地姿勢；之後屍體可能留在原地、閃爍後消失或溶解。", "notThis": "不是死亡特效（FB-04，爆開、煙霧、粒子等特效）；死亡動畫是角色身體本身的動作，兩者常一起用。也不是布娃娃（ANI-09，由物理即時算出倒下方式）；死亡動畫通常是預先做好的。", "use": "明確告訴玩家「這個敵人已經打倒」；給最後一擊一個收尾；Boss 戰的結束演出。", "prompt": "在遊戲中，為敵人加入死亡動畫：最後一擊後 0.15 秒向後仰，0.35 秒內倒地並彈起 2 px 一次，停在倒地姿勢 1 秒；之後用 0.5 秒閃爍（每 60 ms 切換一次可見）再消失。倒地方向朝向攻擊的反方向。"}, "en": {"name": "Death animation", "observe": "A body motion played when a character is defeated: for example kneeling then falling forward, or being launched and bouncing once on landing, ending in a lying pose; the body may then stay, blink out or dissolve.", "notThis": "Not a death effect (FB-04, bursts, smoke and particles); the death animation is the character’s own body motion, and the two are often combined. Not a ragdoll (ANI-09, physics computes the fall live); a death animation is usually authored.", "use": "Tells the player clearly that the enemy is down; gives the final blow a conclusion; ending beats in boss fights.", "prompt": "In your game, add an enemy death animation: after the final hit, lean back for 0.15 s, fall to the ground within 0.35 s with one 2 px bounce, hold the lying pose for 1 s; then blink for 0.5 s (toggle visibility every 60 ms) and disappear. Fall away from the direction of the hit."}, "ja": {"name": "やられモーション（死亡アニメーション）", "observe": "キャラが倒されたときに再生する体の動き。膝をついて前に倒れる、吹き飛ばされて着地で 1 回弾むなど、最後は倒れた姿勢で止まる。その後、体が残る、点滅して消える、溶けて消えるなど。", "notThis": "やられエフェクト（FB-04、爆発・煙・パーティクル）とは違い、キャラの体そのものの動き。両者はよく組み合わせる。ラグドール（ANI-09、倒れ方を物理でその場で計算）とも違い、通常は作り込んだアニメ。", "use": "敵を倒したことをはっきり伝える、とどめの一撃を締めくくる、ボス戦の終幕演出。", "prompt": "ゲームで敵のやられモーションを追加して：とどめの後 0.15 秒のけぞり、0.35 秒以内に倒れて 2 px 1 回弾み、倒れた姿勢で 1 秒停止。その後 0.5 秒点滅（60 ms ごとに表示切替）して消える。倒れる向きは攻撃と反対方向。"}, "params": "fall direction · fall time · bounce · hold on ground · removal (blink / dissolve / stay) · variants per attack type", "impl": "A terminal state in the animation state machine with no exit transitions; spawn the death VFX from an animation event at the impact frame. Optionally switch to a ragdoll mid-fall (ANI-09) or dissolve the body (VFX-04) after the hold.", "related": ["FB-04", "ANI-09", "ANI-05", "VFX-04", "FB-03"], "refs": [{"t": "Player Motion — Hit reaction animations for games (flinch, stagger, knockdown, death)", "u": "https://playermotion.games/playbook/hit-reaction-animations"}, {"t": "Wikipedia — Ragdoll physics", "u": "https://en.wikipedia.org/wiki/Ragdoll_physics"}], "nosrc": false}, {"id": "ANI-07", "cat": "ANI", "sub": "角色狀態", "std": "4-way / 8-way directional sprites", "aliases": ["Directional sprites", "8-direction sprite sheet", "Facing directions"], "type": "C", "zh": {"name": "四方向／八方向精靈", "observe": "俯視或斜角遊戲中，角色依移動方向切換到不同角度畫的圖：四方向是上下左右，八方向再加四個斜角；轉向時是「換一張圖」而不是旋轉圖片。通常左邊是右邊的左右翻轉，只需畫 3 或 5 個方向。", "notThis": "不是精靈翻轉（PIX-25，只在左右兩個朝向之間翻轉）；方向精靈有正面、背面等完全不同的畫。也不是 RotSprite（PIX-05，把同一張圖旋轉）。", "use": "俯視 RPG、動作 RPG、雙搖桿射擊、斜角視角遊戲。", "prompt": "在遊戲中，為主角做八方向精靈：畫 5 個方向（下、右下、右、右上、上），左邊三個方向用左右翻轉；把移動角度分成 8 份（每份 45°）選擇方向，只在移動時更新朝向，停下時保持最後的方向；所有方向的腳底基準線和格子大小一致。"}, "en": {"name": "4-way / 8-way directional sprites", "observe": "In top-down or isometric games the character switches to a separately drawn view for each movement direction: 4-way covers up/down/left/right, 8-way adds the four diagonals; turning swaps the image rather than rotating it. Left is usually a mirrored right, so only 3 or 5 directions are drawn.", "notThis": "Not sprite flipping (PIX-25, only flipping between left and right facing); directional sprites include genuinely different front and back drawings. Not RotSprite (PIX-05, rotating one image).", "use": "Top-down RPGs, action RPGs, twin-stick shooters, isometric games.", "prompt": "In your game, make 8-way sprites for the hero: draw 5 directions (down, down-right, right, up-right, up) and mirror them for the three left-facing ones; pick the direction by splitting the movement angle into 8 slices of 45°, update facing only while moving and keep the last one when stopped; keep the same feet baseline and cell size in every direction."}, "ja": {"name": "4方向・8方向スプライト", "observe": "見下ろしやクォータービューのゲームで、移動方向ごとに別に描かれた向きの絵に切り替える。4 方向は上下左右、8 方向は斜め 4 方向を加える。向きを変えると絵を回転するのではなく差し替える。左向きは右向きの反転で済ませることが多く、描くのは 3 または 5 方向。", "notThis": "スプライト反転（PIX-25、左右の 2 方向だけを反転）とは違い、正面・背面などまったく別の絵を持つ。RotSprite（PIX-05、1 枚の絵を回転）とも違う。", "use": "見下ろし型 RPG、アクション RPG、ツインスティックシューター、クォータービューのゲーム。", "prompt": "ゲームで主人公の 8 方向スプライトを作って：5 方向（下・右下・右・右上・上）を描き、左向き 3 方向は左右反転で作る。移動角度を 45° ずつ 8 分割して向きを選び、移動中だけ向きを更新し、止まったら最後の向きを保持。全方向で足元の基準線とセルサイズをそろえる。"}, "params": "direction count (4 / 8 / 16) · mirrored vs unique views · angle slices · update facing only while moving · same baseline per view", "impl": "Store one row per direction in the sheet; dir = round(atan2(vy, vx) / (TAU/8)) mod 8, then map left-facing indices to their right-facing row with a horizontal flip. Hysteresis on the angle avoids flicker when moving along a slice boundary.", "related": ["PIX-25", "PIX-05", "PIX-24", "PIX-16"], "refs": [{"t": "Pixeli pixel-art rules — Views and directions", "u": "https://pixeli.pebbly.space/knowledge/rules/37-views-and-directions"}, {"t": "Spritefy — 8-directional sprites: views, sheets & code", "u": "https://spritefy.com/blog/eight-direction-character-sprite"}, {"t": "Spritesheets.ai — 4-direction vs 8-direction sprites", "u": "https://www.spritesheets.ai/blog/4-direction-vs-8-direction-sprites"}], "nosrc": false}, {"id": "ANI-08", "cat": "ANI", "sub": "動畫系統技術", "std": "Procedural animation", "aliases": ["Runtime animation", "Code-driven animation", "Procedural locomotion"], "type": "S", "zh": {"name": "程序動畫", "observe": "動作不是預先畫好或錄好的，而是由程式即時計算：例如多足生物的腳會自己找地面落點、觸手或尾巴跟隨身體擺動、身體依速度傾斜；地形或速度一變，動作就跟着變，不會重複同一段。", "notThis": "不是預先製作的關鍵格動畫；程序動畫在不同情況下每次都略有不同。也不是布娃娃（ANI-09，完全交給物理、角色失去控制）；程序動畫仍由規則控制。腳步貼地（ANI-12）是程序動畫的一種特定用途。", "use": "多足生物、蛇、觸手、機械臂；需要配合任何地形的移動；美術資源有限但想要大量變化。", "prompt": "在遊戲中，為一隻四足蜘蛛型敵人做程序步行：每隻腳有一個地面目標點，當腳與「身體下方理想位置」的距離超過 10 px 時，用 0.15 秒沿弧線（最高抬起 5 px）移到新位置；對角的腳交替移動，身體高度取四隻腳平均值再加 2 px 上下起伏。"}, "en": {"name": "Procedural animation", "observe": "Motion is not drawn or recorded in advance but computed by code at runtime: a many-legged creature’s feet find footholds on their own, tentacles or tails follow the body, the body leans with speed; when terrain or speed changes, the motion changes with it and never repeats exactly.", "notThis": "Not authored keyframe animation; procedural motion differs slightly every time. Not a ragdoll (ANI-09, handed fully to physics with the character out of control); procedural animation is still rule-driven. Foot IK (ANI-12) is one specific use of it.", "use": "Many-legged creatures, snakes, tentacles, robot arms; locomotion that must fit any terrain; lots of variation from few art assets.", "prompt": "In your game, give a four-legged spider-like enemy a procedural walk: each leg has a ground target; when a foot is more than 10 px from its ideal spot under the body, move it there over 0.15 s along an arc (lifting up to 5 px); diagonal legs alternate, and body height is the average of the four feet plus a 2 px bob."}, "ja": {"name": "プロシージャルアニメーション", "observe": "動きを事前に描いたり収録したりせず、プログラムがその場で計算する。多脚生物の足が自分で接地点を探す、触手や尻尾が体についてくる、速度に応じて体が傾くなど。地形や速度が変わると動きも変わり、同じ動きを繰り返さない。", "notThis": "事前に作るキーフレームアニメとは違い、状況ごとに毎回少しずつ違う。ラグドール（ANI-09、完全に物理任せで制御を失う）とも違い、ルールで制御されている。フット IK（ANI-12）はその特定の用途の一つ。", "use": "多脚生物、ヘビ、触手、ロボットアーム。どんな地形にも合う移動。少ない素材で多くのバリエーション。", "prompt": "ゲームで四足のクモ型の敵にプロシージャル歩行を付けて：各脚に地面の目標点を持たせ、足が「体の下の理想位置」から 10 px 以上離れたら、0.15 秒で弧を描いて（最大 5 px 持ち上げ）新しい位置へ移す。対角の脚を交互に動かし、体の高さは 4 本の足の平均に 2 px の上下動を加える。"}, "params": "step distance threshold · step time · lift height · leg pairing / gait · body lean & bob · smoothing", "impl": "Per-limb state machines (planted / stepping) with targets found by raycasting the ground ahead of the body; limbs solved with simple two-bone IK; chains such as tails use follow-the-leader constraints or damped springs. Everything is driven from velocity and terrain each frame.", "related": ["ANI-12", "ANI-10", "ANI-09", "ANI-11"], "refs": [{"t": "Wikipedia — Procedural animation", "u": "https://en.wikipedia.org/wiki/Procedural_animation"}, {"t": "GDC Vault — Animation Bootcamp: An Indie Approach to Procedural Animation (David Rosen)", "u": "https://www.gdcvault.com/play/1020583/Animation-Bootcamp-An-Indie-Approach"}, {"t": "t3ssel8r — Giving personality to procedural animations using math (YouTube)", "u": "https://www.youtube.com/watch?v=KPoeNZZ6H4s"}], "nosrc": false}, {"id": "ANI-09", "cat": "ANI", "sub": "動畫系統技術", "std": "Ragdoll", "aliases": ["Ragdoll physics", "Physical animation", "Active ragdoll", "Powered ragdoll"], "type": "S", "zh": {"name": "布娃娃物理（Ragdoll）", "observe": "角色被打倒或被炸飛時，身體像布娃娃一樣由物理引擎即時決定怎樣倒下：四肢甩動、撞到台階或牆壁會被擋住、每次倒法都不同。也有「主動布娃娃」：角色一邊做動畫，一邊被物理推動而搖晃。", "notThis": "不是死亡動畫（ANI-06，預先做好的固定倒法）；布娃娃每次結果都不同，而且會和地形互動。也不是程序動畫（ANI-08，仍由規則控制步伐）；布娃娃把控制權交給物理。", "use": "死亡、被炸飛、被擊倒；滑稽的物理玩法；讓倒下的方式配合實際地形。", "prompt": "在遊戲中，敵人死亡時切換成布娃娃：把當下動畫姿勢和速度複製到 10 個剛體（頭、軀幹、骨盆、上下臂、上下腿），關節加角度限制（膝蓋只能向後彎 0–140°）；把命中方向的衝量（約 6 m/s）加在被打中的部位；3 秒後若已靜止就凍結並淡出。"}, "en": {"name": "Ragdoll", "observe": "When a character is defeated or blown away, a physics engine decides live how the body falls, like a rag doll: limbs flail, steps and walls block them, and every fall is different. An \"active ragdoll\" variant keeps playing animation while physics pushes the body around.", "notThis": "Not a death animation (ANI-06, an authored fixed fall); a ragdoll differs every time and interacts with the terrain. Not procedural animation (ANI-08, rules still drive the steps); a ragdoll hands control to physics.", "use": "Deaths, explosions, knockdowns; comedic physics play; falls that fit the actual terrain.", "prompt": "In your game, switch enemies to a ragdoll on death: copy the current animated pose and velocities into 10 rigid bodies (head, torso, pelvis, upper/lower arms, upper/lower legs) with joint limits (knees bend backward only, 0–140°); apply an impulse of about 6 m/s along the hit direction to the struck part; after 3 s, if it has come to rest, freeze it and fade it out."}, "ja": {"name": "ラグドール（物理やられ）", "observe": "キャラが倒されたり吹き飛ばされたりすると、物理エンジンがその場で倒れ方を決め、布人形のように手足が振り回され、段差や壁に引っかかり、毎回違う倒れ方になる。アニメを再生しながら物理で揺さぶられる「アクティブラグドール」もある。", "notThis": "やられモーション（ANI-06、作り込んだ決まった倒れ方）とは違い、毎回結果が変わり地形とも干渉する。プロシージャルアニメ（ANI-08、ルールで歩みを制御）とも違い、制御を物理に渡す。", "use": "死亡、爆風で吹き飛ぶ、ダウン。コミカルな物理表現。実際の地形に合った倒れ方。", "prompt": "ゲームで敵の死亡時にラグドールに切り替えて：現在のアニメ姿勢と速度を 10 個の剛体（頭・胴・骨盤・上腕／前腕・太もも／すね）にコピーし、関節に角度制限（膝は後ろにだけ 0〜140°）を付ける。攻撃方向に約 6 m/s の衝撃を当たった部位へ加える。3 秒後に静止していれば固定してフェードアウト。"}, "params": "body count & joint limits · impulse strength & hit bone · damping · blend from animation (0.1–0.2 s) · sleep / cleanup time · active-ragdoll motor strength", "impl": "Each bone maps to a rigid body plus constraint; on activation copy bone transforms and velocities from the animated pose, then each frame write simulated transforms back to the skeleton. Active ragdolls drive joint motors toward the animated pose with limited strength.", "related": ["ANI-06", "ANI-05", "ANI-08", "ANI-10"], "refs": [{"t": "Wikipedia — Ragdoll physics", "u": "https://en.wikipedia.org/wiki/Ragdoll_physics"}, {"t": "GDC Vault — Physics driven ragdolls and animation at EA: from sports to Star Wars", "u": "https://www.gdcvault.com/play/1025210/Animation-Bootcamp-Animating-the-3rd"}, {"t": "Unreal Engine docs — Physical animation", "u": "https://dev.epicgames.com/documentation/en-us/unreal-engine/physical-animation-in-unreal-engine"}, {"t": "Godot docs — Ragdoll system", "u": "https://docs.godotengine.org/en/stable/tutorials/physics/ragdoll_system.html"}], "nosrc": false}, {"id": "ANI-10", "cat": "ANI", "sub": "動畫系統技術", "std": "Spring bones / Jiggle physics", "aliases": ["Secondary motion", "Dynamic bones", "Jiggle bones", "Hair & cloth physics"], "type": "S", "zh": {"name": "彈簧骨骼／次級擺動", "observe": "角色移動或停下時，頭髮、馬尾、披風、耳朵、飾物等會被慣性拖後，再像彈簧一樣來回晃幾下才靜止；這些擺動不是手動做的動畫，而是即時物理計算出來的。", "notThis": "不是待機動畫（ANI-04，預先做好的循環）；彈簧骨骼只在身體移動後產生反應。也不是布娃娃（ANI-09，整個身體交給物理）；這裏只有附屬部件晃動，身體仍照動畫走。也不是植物擺動（ENV-08，由風驅動）。", "use": "頭髮、尾巴、披風、配件；讓急停、轉身、跳躍更有份量感。", "prompt": "在遊戲中，為主角的馬尾加入彈簧骨骼：3 節骨，每節剛度 0.15、阻尼 0.8、重力 1 px/frame²；角色急停時馬尾向前甩約 20° 後在 0.6 秒內晃 2–3 下停下；限制每節最大偏轉 45°，避免穿入身體。"}, "en": {"name": "Spring bones / jiggle physics", "observe": "When the character moves or stops, hair, ponytails, capes, ears and accessories lag behind from inertia, then swing back and forth like a spring a few times before settling; the sway is not hand-animated but computed live.", "notThis": "Not an idle animation (ANI-04, an authored loop); spring bones react only after the body moves. Not a ragdoll (ANI-09, the whole body is physical); here only attachments sway while the body follows its animation. Not foliage sway (ENV-08, driven by wind).", "use": "Hair, tails, capes, accessories; adding weight to sudden stops, turns and jumps.", "prompt": "In your game, add spring bones to the hero’s ponytail: 3 bones, stiffness 0.15, damping 0.8, gravity 1 px/frame² each; on a sudden stop the ponytail swings forward about 20° and settles within 0.6 s after 2–3 wobbles; clamp each bone to 45° deflection so it never clips into the body."}, "ja": {"name": "揺れもの（スプリングボーン）", "observe": "キャラが動いたり止まったりすると、髪・ポニーテール・マント・耳・アクセサリーが慣性で遅れてついてきて、バネのように数回揺れてから止まる。揺れは手付けのアニメではなく、その場で計算される。", "notThis": "待機モーション（ANI-04、作り込んだループ）とは違い、体が動いた後にだけ反応する。ラグドール（ANI-09、体全体が物理）とも違い、揺れるのは付属パーツだけで体はアニメ通りに動く。草木の揺れ（ENV-08、風で動く）とも違う。", "use": "髪、尻尾、マント、アクセサリー。急停止・振り向き・ジャンプに重みを与える。", "prompt": "ゲームで主人公のポニーテールにスプリングボーンを付けて：3 本のボーン、各剛性 0.15・減衰 0.8・重力 1 px/frame²。急停止すると前方へ約 20° 振れ、0.6 秒以内に 2〜3 回揺れて止まる。各ボーンの最大偏角を 45° に制限して体にめり込まないようにする。"}, "params": "stiffness · damping · gravity · drag / inertia scale · bone count · angle limits · collision spheres", "impl": "Verlet or damped-spring simulation per bone tip after the animation pose is evaluated: tip += (tip - prevTip) * (1 - damping) + gravity; pull toward the animated rest direction by stiffness; re-constrain to bone length; write rotations back. Run at a fixed timestep for stability.", "related": ["ANI-04", "ANI-09", "ANI-08", "ENV-08"], "refs": [{"t": "Godot docs — SpringBoneSimulator3D", "u": "https://docs.godotengine.org/en/stable/classes/class_springbonesimulator3d.html"}, {"t": "Unreal Engine docs — AnimDynamics (Animation Blueprint)", "u": "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprint-animdynamics-in-unreal-engine"}, {"t": "Unity Animation Rigging — Damped Transform constraint", "u": "https://docs.unity3d.com/Packages/com.unity.animation.rigging@1.3/manual/constraints/DampedTransform.html"}], "nosrc": false}, {"id": "ANI-11", "cat": "ANI", "sub": "動畫系統技術", "std": "Look-at / Head tracking", "aliases": ["Head look", "Aim offset", "Look-at IK", "Eye tracking"], "type": "S", "zh": {"name": "視線追蹤（Look-at）", "observe": "角色的頭（有時連眼睛、上半身）會自動轉向感興趣的東西：走近 NPC 時對方轉頭看你、敵人一直盯着玩家、角色看向可撿的道具。身體繼續做原本的動作，只有頭部轉動，而且有轉動角度上限。", "notThis": "不是整個角色轉身（方向精靈 ANI-07 或轉向），身體方向不變。也不是互動提示高光（NAV-01，在物件上加外框）；視線追蹤是角色的反應。", "use": "讓 NPC 有反應、提示玩家可互動的東西、敵人鎖定、對話時角色互看。", "prompt": "在遊戲中，為 NPC 加入視線追蹤：玩家進入 64 px 範圍時，頭部在 0.3 秒內平滑轉向玩家，水平最多 ±70°、垂直 ±30°；超出角度時頭回正而不是扭過頭；玩家離開後 1 秒內回到原本朝向。"}, "en": {"name": "Look-at / head tracking", "observe": "The character’s head (sometimes eyes and upper body too) turns automatically toward something of interest: an NPC turns to look as you approach, an enemy keeps staring at the player, a character glances at a pickup. The body keeps its current action; only the head turns, within an angle limit.", "notThis": "Not the whole character turning (directional sprites ANI-07 or a turn); the body’s facing stays the same. Not an interactable highlight (NAV-01, an outline on the object); look-at is the character’s reaction.", "use": "Makes NPCs responsive, hints at interactable things, enemy lock-on, characters looking at each other in dialogue.", "prompt": "In your game, add look-at to NPCs: when the player is within 64 px, turn the head smoothly toward them over 0.3 s, up to ±70° horizontally and ±30° vertically; beyond the limit, return the head to neutral rather than over-twisting; when the player leaves, return to the original facing within 1 s."}, "ja": {"name": "視線追従（ルックアット）", "observe": "キャラの頭（目や上半身も含むことがある）が興味のある対象へ自動で向く。近づくと NPC が振り向く、敵がプレイヤーを見つめ続ける、拾えるアイテムに目をやるなど。体は今の動きを続け、頭だけが回り、回転角には上限がある。", "notThis": "キャラ全体の向き変更（方向スプライト ANI-07 や旋回）とは違い、体の向きは変わらない。インタラクトのハイライト（NAV-01、対象に輪郭を付ける）とも違い、キャラ側の反応。", "use": "NPC に反応を持たせる、インタラクトできる物のヒント、敵のロックオン、会話中にキャラ同士が見合う。", "prompt": "ゲームで NPC に視線追従を追加して：プレイヤーが 64 px 以内に入ったら頭を 0.3 秒かけて滑らかにプレイヤーへ向け、水平 ±70°・垂直 ±30° まで。限界を超えたら首をねじらず正面に戻す。プレイヤーが離れたら 1 秒以内に元の向きへ戻す。"}, "params": "trigger radius · max yaw / pitch · turn speed · weight split head / neck / spine / eyes · return delay · target priority", "impl": "After evaluating the animation, rotate the head (and a fraction on neck/spine) toward the target direction in local space, clamped to limits and smoothed with a damped interpolation; fade the weight to 0 when the target leaves the cone. In 2D, swap head frames or offset the face block.", "related": ["ANI-07", "NAV-01", "ANI-12", "ANI-08"], "refs": [{"t": "Unreal Engine docs — Look At (Animation Blueprint)", "u": "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprint-look-at-in-unreal-engine"}, {"t": "Unity Scripting API — Animator.SetLookAtPosition", "u": "https://docs.unity3d.com/ScriptReference/Animator.SetLookAtPosition.html"}, {"t": "Unity Animation Rigging — Multi-Aim constraint", "u": "https://docs.unity3d.com/Packages/com.unity.animation.rigging@1.3/manual/constraints/MultiAimConstraint.html"}, {"t": "Godot docs — LookAtModifier3D", "u": "https://docs.godotengine.org/en/stable/classes/class_lookatmodifier3d.html"}], "nosrc": false}, {"id": "ANI-12", "cat": "ANI", "sub": "動畫系統技術", "std": "Foot IK / Foot placement", "aliases": ["Foot locking", "Ground alignment", "Leg IK"], "type": "S", "zh": {"name": "腳步貼地（Foot IK）", "observe": "角色站在樓梯、斜坡或石頭上時，兩隻腳會分別落在實際的地面高度：一隻腳踏高、另一隻腳伸低，膝蓋自動彎曲，骨盆降下配合，而不是一隻腳浮在半空、另一隻陷進地裏。", "notThis": "不是程序動畫（ANI-08）的整個步行系統；腳步貼地是在既有的走路／站立動畫上修正腳的位置。也不是一般的 IK 概念本身，這是它在腳部的特定應用。", "use": "3D 角色在不平地形上站立和行走；樓梯、斜坡、石頭地。", "prompt": "在遊戲中，為角色加入腳步貼地：每隻腳從腳踝上方 0.5 m 向下射線找地面，把腳移到命中點並讓腳掌貼合斜面法線（最多 30°）；骨盆下降兩腳高度差中較低的一邊；用 0.1 秒平滑避免抖動；角色在空中時關閉。"}, "en": {"name": "Foot IK / foot placement", "observe": "When a character stands on stairs, slopes or rocks, each foot lands at the actual ground height: one foot steps higher, the other reaches lower, the knees bend automatically and the pelvis drops to match, instead of one foot floating and the other sinking into the floor.", "notThis": "Not the whole procedural walk system (ANI-08); foot placement corrects foot positions on top of an existing walk or stand animation. Not the general IK concept itself — this is its specific use on feet.", "use": "3D characters standing and walking on uneven terrain: stairs, slopes, rocky ground.", "prompt": "In your game, add foot placement: cast a ray down from 0.5 m above each ankle to find the ground, move the foot to the hit point and align the sole to the surface normal (up to 30°); lower the pelvis by the lower of the two foot offsets; smooth over 0.1 s to avoid jitter; disable while airborne."}, "ja": {"name": "足の接地（フット IK）", "observe": "階段・坂・岩の上に立つと、両足がそれぞれ実際の地面の高さに着く。片足は高く、もう片足は低く伸び、膝が自動で曲がり、骨盤も下がって合わせる。片足が浮いたり地面にめり込んだりしない。", "notThis": "歩行システム全体であるプロシージャルアニメ（ANI-08）とは違い、既存の歩き・立ちアニメの上で足の位置を補正する。IK の一般概念そのものではなく、足への特定の応用。", "use": "凸凹した地形で立ち歩く 3D キャラ。階段、坂、岩場。", "prompt": "ゲームでキャラに足の接地を追加して：各足首の 0.5 m 上から下へレイを飛ばして地面を探し、足をヒット点へ移して足裏を面の法線に合わせる（最大 30°）。骨盤は両足のずれの低い方だけ下げる。0.1 秒の平滑化でガタつきを防ぎ、空中では無効にする。"}, "params": "ray length · max foot rotation · pelvis offset · blend speed · foot lock during plant · disable in air / on fast movement", "impl": "After the animation pass, raycast per foot, solve a two-bone IK chain (hip–knee–ankle) to the corrected target with a pole vector for the knee, rotate the foot to the ground normal, and offset the pelvis; drive weights by animation curves so only planted feet are corrected.", "related": ["ANI-08", "ANI-11", "PIX-24"], "refs": [{"t": "Unity Manual — Inverse Kinematics (foot / hand IK)", "u": "https://docs.unity3d.com/Manual/InverseKinematics.html"}, {"t": "Unreal Engine docs — Leg IK (Animation Blueprint)", "u": "https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-blueprint-leg-ik-in-unreal-engine"}, {"t": "Unity Animation Rigging — Two Bone IK constraint", "u": "https://docs.unity3d.com/Packages/com.unity.animation.rigging@1.3/manual/constraints/TwoBoneIKConstraint.html"}, {"t": "Wikipedia — Inverse kinematics", "u": "https://en.wikipedia.org/wiki/Inverse_kinematics"}], "nosrc": false}, {"id": "ANI-13", "cat": "ANI", "sub": "動畫系統技術", "std": "Morph targets / Blend shapes", "aliases": ["Shape keys", "Blend shapes", "Vertex morphing", "Facial blend shapes"], "type": "S", "zh": {"name": "表情變形（Morph targets）", "observe": "角色的臉或身體形狀在幾個預先做好的形狀之間平滑過渡：嘴巴開合配合說話、眉毛皺起、眼睛閉上、臉頰鼓起，可以同時混合多個（例如一邊笑一邊眨眼）。", "notThis": "不是骨骼動畫（靠骨頭旋轉帶動網格）；變形目標直接改變頂點形狀，適合骨骼難以表現的細節。也不是換圖（2D 換另一張臉）；這是連續的混合。也不是擠壓拉伸（整體縮放）。", "use": "臉部表情、對嘴、肌肉鼓起、角色外形調整（捏臉）、矯正形狀。", "prompt": "在遊戲中，為角色臉部加入變形目標：至少 5 個——嘴巴張開、微笑、皺眉、左眼閉、右眼閉；說話時依音量把「嘴巴張開」權重在 0–0.8 之間變化（每 80 ms 更新、平滑 40 ms）；每 4 秒眨眼一次，雙眼權重在 120 ms 內 0→1→0。"}, "en": {"name": "Morph targets / blend shapes", "observe": "The face or body smoothly blends between several pre-made shapes: the mouth opens and closes with speech, brows furrow, eyes close, cheeks puff, and several can be mixed at once (smiling while blinking).", "notThis": "Not skeletal animation (bones rotating the mesh); morph targets move vertices directly, suited to detail bones handle poorly. Not swapping images (a different face drawing in 2D); this is a continuous blend. Not squash and stretch (overall scaling).", "use": "Facial expressions, lip sync, muscle bulges, character customisation, corrective shapes.", "prompt": "In your game, add facial morph targets to the character: at least 5 — mouth open, smile, frown, left eye closed, right eye closed; while speaking, drive \"mouth open\" between 0 and 0.8 from the audio level (update every 80 ms, smooth over 40 ms); blink every 4 s by taking both eye weights 0→1→0 over 120 ms."}, "ja": {"name": "ブレンドシェイプ（モーフターゲット）", "observe": "顔や体の形が、事前に作ったいくつかの形の間を滑らかに移り変わる。話すのに合わせて口が開閉する、眉をひそめる、目を閉じる、頬を膨らませるなど。複数を同時に混ぜられる（笑いながらまばたき）。", "notThis": "スケルタルアニメ（ボーンの回転でメッシュを動かす）とは違い、頂点の形を直接変えるので、ボーンで表しにくい細部に向く。2D の差し替え（別の顔の絵に替える）とも違い、連続的な混合。スクワッシュ＆ストレッチ（全体の拡縮）とも違う。", "use": "表情、リップシンク、筋肉の膨らみ、キャラメイク、補正シェイプ。", "prompt": "ゲームでキャラの顔にブレンドシェイプを追加して：最低 5 つ——口を開く・笑顔・しかめ面・左目閉じ・右目閉じ。話している間は音量に応じて「口を開く」の重みを 0〜0.8 で変化させる（80 ms ごとに更新、40 ms で平滑化）。4 秒ごとにまばたきし、両目の重みを 120 ms で 0→1→0。"}, "params": "target set · weight range · blend speed · combination rules (exclusive groups) · driven by audio / animation curves · corrective shapes", "impl": "Each target stores per-vertex position (and normal) deltas from the base mesh; final = base + Σ weight_i × delta_i, evaluated in the vertex shader or a compute pass before skinning. Weights are animated by clips, curves or runtime drivers such as audio amplitude.", "related": ["ANI-04", "ANI-01", "ANI-11"], "refs": [{"t": "Wikipedia — Morph target animation", "u": "https://en.wikipedia.org/wiki/Morph_target_animation"}, {"t": "Unity Manual — Blend shapes", "u": "https://docs.unity3d.com/Manual/BlendShapes.html"}, {"t": "Unreal Engine docs — Morph targets", "u": "https://dev.epicgames.com/documentation/en-us/unreal-engine/morph-targets-in-unreal-engine"}, {"t": "Khronos glTF tutorial — Simple morph target", "u": "https://github.com/KhronosGroup/glTF-Tutorials/blob/main/gltfTutorial/gltfTutorial_017_SimpleMorphTarget.md"}], "nosrc": false}, {"id": "CAMX-01", "cat": "CAMX", "sub": "跟隨與構圖規則", "std": "Cue-focus", "aliases": ["Attention point", "Point of interest framing", "Camera attractor"], "type": "C", "zh": {"name": "興趣點吸引（Cue-focus）", "observe": "玩家靠近寶箱、出口或 Boss 門等興趣點時，鏡頭不再只看角色，而是被拉向角色與興趣點之間的某個位置；離開範圍後鏡頭慢慢回到角色身上。", "notThis": "不是前瞻（CAM-06 Look-ahead，依移動方向預留空間）；Cue-focus 的偏移來自場景中的固定物件。也不是劇本鏡頭（CIN-03，會奪走控制權）；這裡玩家一直可以操作。", "use": "提示「這裡有東西」、讓重要物件留在畫面內、引導玩家視線而不打斷遊玩。", "prompt": "在遊戲中為興趣點加入 Cue-focus：每個興趣點有半徑 96 px 的影響範圍與權重 0–1；角色進入範圍後，鏡頭目標 = 角色位置 + (興趣點 − 角色) × 權重 × (1 − 距離/半徑)，權重預設 0.45；鏡頭以 0.35 秒的平滑時間追上目標，離開範圍時同樣平滑回到角色。"}, "en": {"name": "Cue-focus", "observe": "When the player approaches a point of interest — a chest, an exit, a boss door — the camera stops looking only at the character and is pulled toward a point between the character and that cue; after leaving its range the camera drifts back to the character.", "notThis": "Not look-ahead (CAM-06 Look-ahead, which leaves room in the movement direction); cue-focus offsets come from fixed objects in the level. Not a scripted camera (CIN-03, which takes control away); the player keeps playing throughout.", "use": "Signalling \"something is here\", keeping important objects in frame, steering the eye without interrupting play.", "prompt": "In your game, add cue-focus to points of interest: each cue has a 96 px influence radius and a 0–1 weight; inside the radius, camera target = character + (cue − character) × weight × (1 − distance/radius), default weight 0.45; the camera reaches the target with a 0.35 s smoothing time and eases back to the character the same way when leaving."}, "ja": {"name": "キュー・フォーカス（注目点への引き寄せ）", "observe": "宝箱や出口、ボス扉などの注目点にプレイヤーが近づくと、カメラはキャラクターだけを映すのをやめ、キャラクターと注目点の間の位置へ引き寄せられる。範囲を出るとゆっくりキャラクターへ戻る。", "notThis": "先読み（CAM-06 Look-ahead、移動方向に余白を取る）とは違い、ずれの原因はステージ内の固定オブジェクト。スクリプトカメラ（CIN-03、操作を奪う）とも違い、プレイヤーはずっと操作できる。", "use": "「ここに何かある」と知らせる、重要物を画面内に保つ、遊びを止めずに視線を誘導する。", "prompt": "ゲームの注目点にキュー・フォーカスを追加して：各注目点に半径 96 px の影響範囲と 0〜1 の重みを持たせ、範囲内ではカメラ目標＝キャラ位置＋（注目点−キャラ）×重み×（1−距離/半径）、重みの既定値は 0.45。カメラは 0.35 秒のスムージングで目標に追従し、範囲外に出たら同じく滑らかにキャラへ戻す。"}, "params": "influence radius · weight · falloff curve · smoothing time · max offset · priority when cues overlap", "impl": "Keep a list of cue volumes; each frame sum weighted offsets (weight × falloff(distance)) from the followed target, clamp the total offset, then feed the result into the normal follow/damping step instead of moving the camera directly. Apply camera bounds last.", "related": ["CAM-06 Look-ahead", "CAM-08 Region-focus", "CIN-03", "NAV-01"], "refs": [{"t": "Itay Keren — Scroll Back: The Theory and Practice of Cameras in Side-Scrollers (Game Developer)", "u": "https://www.gamedeveloper.com/design/scroll-back-the-theory-and-practice-of-cameras-in-side-scrollers"}, {"t": "Cinemachine 3.1 — Target Group", "u": "https://docs.unity3d.com/Packages/com.unity.cinemachine@3.1/manual/CinemachineTargetGroup.html"}], "nosrc": false}, {"id": "CAMX-02", "cat": "CAMX", "sub": "跟隨與構圖規則", "std": "Zoom-to-fit", "aliases": ["Auto-zoom to fit targets", "Dynamic zoom", "Framing zoom"], "type": "C", "zh": {"name": "自動縮放包住所有目標（Zoom-to-fit）", "observe": "多名玩家或多個目標分散時，鏡頭自動拉遠，讓所有人都留在畫面內並保留邊距；大家靠攏時鏡頭再拉近。縮放有上下限，變化平滑。", "notThis": "不是多人同框構圖（CAM-13 Group framing）只移動鏡頭中心；Zoom-to-fit 的重點是「縮放倍率跟著包圍框變」。也不是命中推近（FB-09，短暫的回饋）。", "use": "本地多人、群體戰鬥、需要同時看到主角與敵人的場面。", "prompt": "在遊戲中加入 Zoom-to-fit：每幀計算所有目標的包圍框，四邊各加 24 px 邊距；縮放 = min(畫面寬/框寬, 畫面高/框高)，限制在 0.6–1.5 倍之間；縮放以 0.5 秒平滑時間變化，拉遠比拉近快一倍，避免目標被切出畫面。"}, "en": {"name": "Zoom-to-fit", "observe": "When several players or targets spread out, the camera automatically zooms out so everyone stays on screen with a margin; when they regroup it zooms back in. The zoom is clamped and changes smoothly.", "notThis": "Not group framing (CAM-13 Group framing), which only moves the camera centre; zoom-to-fit is about the zoom factor following the bounding box. Not an impact punch-in (FB-09, a brief feedback move).", "use": "Local multiplayer, group fights, scenes where the hero and the enemies must be visible together.", "prompt": "In your game, add zoom-to-fit: each frame compute the bounding box of all targets plus a 24 px margin on every side; zoom = min(screenW/boxW, screenH/boxH), clamped to 0.6–1.5×; smooth the zoom with a 0.5 s time, zooming out twice as fast as zooming in so no target is clipped."}, "ja": {"name": "ズーム・トゥ・フィット（全員が収まる自動ズーム）", "observe": "複数のプレイヤーや対象が散らばると、カメラが自動で引いて全員を余白付きで画面に収める。集まると再び寄る。ズームには上限・下限があり、変化は滑らか。", "notThis": "複数対象のフレーミング（CAM-13 Group framing、カメラの中心を動かすだけ）とは違い、ズーム倍率がバウンディングボックスに追従するのが要点。ヒット時の寄り（FB-09、一瞬の演出）とも違う。", "use": "ローカル協力・対戦、集団戦、主人公と敵を同時に見せたい場面。", "prompt": "ゲームにズーム・トゥ・フィットを追加して：毎フレーム全対象のバウンディングボックスを求め、四辺に 24 px の余白を足す。ズーム＝min(画面幅/箱の幅, 画面高/箱の高さ) を 0.6〜1.5
