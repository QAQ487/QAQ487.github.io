<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>遊戲畫面表現手冊 · 第一批 / Visual Presentation Handbook · Batch 1</title><style>:root{--bg:#11151d;--panel:#1a2130;--panel2:#162334;--line:#35495f;--text:#e6eaf1;--muted:#aebbd0;--accent:#91cfbf;--tag:#dab880;--btn:#202f43;--btnline:#4a637c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,'Segoe UI','Microsoft JhengHei','PingFang TC','Hiragino Sans','Noto Sans CJK TC',sans-serif}
.top{padding:28px 24px 8px;max-width:1400px;margin:auto}.top h1{margin:0 0 6px;font-size:26px}.top p{margin:0;color:var(--muted)}
.toolbar{position:sticky;top:0;z-index:5;background:rgba(17,21,29,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.langs{display:flex;gap:4px}button{background:var(--btn);color:var(--text);border:1px solid var(--btnline);border-radius:7px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}button:hover{border-color:var(--accent)}button.active{background:var(--accent);color:#0f1a1e;border-color:var(--accent);font-weight:600}
#q{flex:1;min-width:220px;background:#0e1420;border:1px solid var(--btnline);color:var(--text);border-radius:7px;padding:7px 10px;font:inherit}#count{color:var(--muted);font-size:13px}
#categories{max-width:1400px;margin:12px auto 0;padding:0 24px;display:flex;gap:6px;flex-wrap:wrap}#categories button{border-radius:99px}
.typehelp{max-width:1400px;margin:8px auto;padding:0 24px;color:var(--muted);font-size:12.5px}#empty{text-align:center;color:var(--muted)}
#cards{max-width:1400px;margin:auto;padding:8px 24px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(500px,1fr));gap:18px}
@media(max-width:560px){#cards{grid-template-columns:1fr;padding:8px 10px}}
article{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;scroll-margin-top:70px;min-width:0}article:target{border-color:var(--accent);box-shadow:0 0 0 2px rgba(145,207,191,.3)}
.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}.eid{font-family:ui-monospace,monospace;color:var(--accent);font-weight:700}.badge{border-radius:5px;padding:1px 7px;font-weight:600}.t-S{background:#21433b;color:#9ff0d6}.t-C{background:#463a1f;color:#f3d48f}.t-D{background:#3d2a4a;color:#e0b8ff}.subn{color:var(--tag)}.entry-link{margin-left:auto;color:var(--muted);text-decoration:none;font-weight:700;font-size:15px}.entry-link:hover{color:var(--accent)}
h2.nm{margin:6px 0 0;font-size:20px}.std{color:var(--muted);font-size:13px;margin-bottom:8px}.std b{color:var(--text)}.al{color:var(--muted)}
.visual{margin:0 0 10px;background:#0b1426;border:1px solid var(--line);border-radius:9px;overflow:hidden}.visual canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;background:#152435}
.ctl{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--panel2)}.ctl input{flex:1;accent-color:var(--accent)}.ctl button{padding:3px 10px;min-width:64px}.stl{color:var(--muted);font-size:12px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}dt{color:var(--accent);font-size:12.5px;font-weight:600;white-space:nowrap;padding-top:1px}dd{margin:0;font-size:14px}.mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:12.5px;color:#cdd6e4}
.prompt{margin:10px 0;border:1px dashed var(--btnline);border-radius:8px;padding:8px 10px;background:#141c2a}.ph{display:flex;justify-content:space-between;align-items:center;color:var(--tag);font-size:12.5px;font-weight:600}.ph button{padding:2px 9px;font-size:12px}.prompt p{margin:4px 0 0;font-size:14px}
details{margin:6px 0 8px}summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600}details p{margin:6px 0 0}
.meta{margin-top:6px;padding-top:8px;border-top:1px solid #2a3a4e}.meta ul{margin:0;padding-left:18px}.meta li{font-size:13px}a{color:#9fd4ff}.ext{color:var(--muted);font-size:13px}.meta dd a{font-size:13px}.nosrc{color:#e0b8ff;font-size:12.5px;display:block}
footer{max-width:1400px;margin:auto;padding:10px 24px 40px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}
@media print{.toolbar,#categories,.ctl{display:none}article{break-inside:avoid}body{background:#fff;color:#000}}

mask wipes", "ja": "形状・マスクのワイプ"}, "像素與風格化": {"zh": "像素與風格化", "en": "Pixel & stylised", "ja": "ドット・様式化"}, "剪接與空間": {"zh": "剪接與空間", "en": "Cuts & spatial transitions", "ja": "カットと空間遷移"}, "時間與天空": {"zh": "時間與天空", "en": "Time & sky", "ja": "時間と空"}, "天氣": {"zh": "天氣", "en": "Weather", "ja": "天候"}, "地表與植被": {"zh": "地表與植被", "en": "Ground & foliage", "ja": "地面と植生"}, "水": {"zh": "水", "en": "Water", "ja": "水"}, "世界狀態": {"zh": "世界狀態", "en": "World state", "ja": "ワールドの状態"}, "載體與技術": {"zh": "載體與技術", "en": "Carriers & techniques", "ja": "表現手段と技術"}, "戰鬥特效": {"zh": "戰鬥特效", "en": "Combat VFX", "ja": "戦闘エフェクト"}, "元素": {"zh": "元素", "en": "Elements", "ja": "属性エフェクト"}, "狀態與增益": {"zh": "狀態與增益", "en": "States & buffs", "ja": "状態・バフ"}, "破壞": {"zh": "破壞", "en": "Destruction", "ja": "破壊"}, "顯示與縮放": {"zh": "顯示與縮放", "en": "Display & scaling", "ja": "表示とスケーリング"}, "色彩": {"zh": "色彩", "en": "Colour", "ja": "色彩"}, "線條與形體": {"zh": "線條與形體", "en": "Line & form", "ja": "線と形"}, "動畫": {"zh": "動畫", "en": "Animation", "ja": "アニメーション"}, "場景構成": {"zh": "場景構成", "en": "Scene construction", "ja": "シーン構成"}, "光照": {"zh": "光照", "en": "Lighting", "ja": "ライティング"}}, "entries": [{"id": "FB-01", "cat": "FB", "sub": "命中與受擊", "std": "Hit flash", "aliases": ["White flash", "Damage flash", "Flash on hit"], "type": "C", "zh": {"name": "命中閃白", "observe": "角色被擊中的一瞬間，整個精靈變成純白（或純紅）約 2–6 格畫面，然後立即恢復原色。輪廓不變，只是顏色被覆蓋。", "notThis": "不是無敵閃爍（FB-03，持續一段時間的明滅）；也不是狀態染色（FB-05，持續的半透明色調）。閃白是單次、極短、全覆蓋。", "use": "讓玩家確定「打中了」，尤其在畫面混亂或像素很小時；與 hitstop、擊退一起用效果最好。", "prompt": "在遊戲中，敵人或居民被擊中時加入命中閃白：精靈整體以純白覆蓋 0.08 秒（約 5 幀），之後立即恢復；Boss 用 0.12 秒。與現有 hitstop 同步觸發，不要改變精靈輪廓。"}, "en": {"name": "Hit flash", "observe": "On the frame of impact the whole sprite turns solid white (or red) for roughly 2–6 frames, then snaps back. The silhouette is unchanged; only the colour is overridden.", "notThis": "Not invincibility blink (FB-03, an on/off flicker lasting a while) nor status tint (FB-05, a lingering translucent colour). A hit flash is one short, full-coverage pulse.", "use": "Confirms \"that hit landed\", especially in busy scenes or with tiny sprites; best stacked with hitstop and knockback.", "prompt": "In your game, add a hit flash when an enemy or NPC takes damage: override the whole sprite with pure white for 0.08 s (~5 frames), then snap back; bosses use 0.12 s. Trigger it in sync with the existing hitstop and do not change the sprite silhouette."}, "ja": {"name": "ヒットフラッシュ（白フラッシュ）", "observe": "被弾した瞬間、スプライト全体が 2〜6 フレームほど真っ白（または赤）になり、すぐ元の色に戻る。輪郭は変わらず色だけが上書きされる。", "notThis": "無敵点滅（FB-03、一定時間続く点滅）や状態異常の色付け（FB-05、持続する半透明の色）とは違い、一回きりで極めて短く、全面を覆う。", "use": "「当たった」ことを確実に伝える。画面が混雑していたりスプライトが小さい時に特に有効。ヒットストップやノックバックと併用すると効果的。", "prompt": "ゲームで、敵や町の人が被弾した時にヒットフラッシュを入れて。スプライト全体を純白で 0.08 秒（約 5 フレーム）上書きしてすぐ戻す。ボスは 0.12 秒。既存のヒットストップと同時に発火し、輪郭は変えないこと。"}, "params": "duration 0.05–0.12 s · colour (white / red / team colour) · easing (snap vs fade-out) · max re-trigger rate", "impl": "Pixel shader uniform flashAmount (0..1): out.rgb = lerp(tex.rgb, flashColor, flashAmount * tex.a). Set per-draw via a small constant buffer or per-instance data; decay on the CPU each tick. Keep alpha from the texture so the silhouette is preserved.", "related": ["ACT-21 Hitstop", "FB-03", "FB-05", "FB-13"], "refs": [{"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}, {"t": "Godot 4 game-feel tricks (saltmire)", "u": "https://saltmire.github.io/godot-4-game-feel-tricks.html"}, {"t": "Godot docs — CanvasItem shaders", "u": "https://docs.godotengine.org/en/stable/tutorials/shaders/shader_reference/canvas_item_shader.html"}], "nosrc": false}, {"id": "FB-02", "cat": "FB", "sub": "介面回饋", "std": "Damage numbers", "aliases": ["Floating combat text", "Damage popups", "Pop-up numbers"], "type": "S", "zh": {"name": "傷害數字", "observe": "擊中時在目標頭上彈出數字，向上飄並淡出；通常先放大再縮回，暴擊時更大、顏色不同。", "notThis": "不是連擊計數（FB-18，固定在畫面角落累計）；也不是 HUD 血條。傷害數字在世界空間、跟着目標出現，短暫存在。", "use": "讓玩家看到每一下的數值與差異（暴擊、抗性、治療用綠色），尤其適合 RPG／塔防式的數值成長。", "prompt": "為遊戲加入浮動傷害數字：每次命中在目標頭頂出現像素字型數字，0.1 秒內由 150% 縮回 100%，之後 0.7 秒向上飄 12px 並淡出；暴擊用金色並大一號，治療用綠色加「+」。多個數字輕微左右錯開避免重疊。"}, "en": {"name": "Damage numbers", "observe": "A number pops out above the target on hit, drifts upward and fades; usually it overshoots in scale first, and crits are bigger and a different colour.", "notThis": "Not a combo counter (FB-18, a running total pinned to the screen corner) or a HUD health bar. Damage numbers live in world space, follow the target and are short-lived.", "use": "Shows the value of every hit and its variation (crits, resistances, green for healing); great for RPG or tower-defence-style number growth.", "prompt": "Add floating damage numbers to the game: on each hit spawn a pixel-font number above the target that scales 150%→100% in 0.1 s, then rises 12 px and fades over 0.7 s. Crits are gold and one size larger; heals are green with a \"+\". Offset simultaneous numbers slightly left/right so they do not overlap."}, "ja": {"name": "ダメージ数値（ダメージポップアップ）", "observe": "命中時に対象の頭上へ数字が飛び出し、上へ漂いながら消える。最初に少し拡大してから戻ることが多く、クリティカルは大きく色も違う。", "notThis": "コンボカウンター（FB-18、画面の隅で累計する表示）や HUD の体力バーとは違う。ワールド空間で対象に付いて現れ、短時間で消える。", "use": "一撃ごとの数値と差（クリティカル、耐性、回復は緑）を見せる。RPG やタワーディフェンス的な数値の成長に向く。", "prompt": "ゲームにダメージポップアップを追加して。命中ごとに対象の頭上へドット文字の数字を出し、0.1 秒で 150%→100% に縮め、その後 0.7 秒で 12px 上昇しつつフェードアウト。クリティカルは金色で一回り大きく、回復は緑で「+」付き。同時に出る数字は左右に少しずらして重ならないように。"}, "params": "lifetime 0.6–1.0 s · rise distance · scale overshoot · colour per damage type · stacking offset · font", "impl": "Spawn screen-space text quads from world position projected each frame (or keep them in world space with a billboard). Use a bitmap pixel font atlas; batch all numbers into one dynamic vertex buffer. Alpha and scale from a per-instance age value.", "related": ["FB-06", "FB-18", "FB-17"], "refs": [{"t": "Design Atlas — Damage numbers", "u": "https://design.solhun.com/en/game-ui/damage-numbers/"}, {"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}], "nosrc": false}, {"id": "FB-03", "cat": "FB", "sub": "命中與受擊", "std": "Invincibility blink", "aliases": ["I-frame flicker", "Invincibility flicker", "Mercy invincibility", "Damage blink"], "type": "C", "zh": {"name": "無敵閃爍", "observe": "受傷後角色在一段時間內（約 1–2 秒）有規律地時隱時現或半透明閃動，期間不會再受傷；時間結束後恢復正常。", "notThis": "不是命中閃白（FB-01，只有一下）。閃爍的節奏本身就是「無敵時間還剩多少」的計時器，常常最後加快。", "use": "防止連續被圍毆即死，並清楚告訴玩家「現在是安全時間」。", "prompt": "在遊戲中，主角受傷後給 1.2 秒無敵時間（i-frames），期間精靈每 0.08 秒在 100% 與 25% 不透明度之間切換，最後 0.3 秒加快到每 0.04 秒；期間忽略所有傷害判定。"}, "en": {"name": "Invincibility blink", "observe": "After taking damage the character blinks on and off (or flickers translucent) at a steady rhythm for about 1–2 s, during which it cannot be hurt again; then it returns to normal.", "notThis": "Not a hit flash (FB-01, a single pulse). The blink rhythm itself is the timer for the remaining invulnerability, often speeding up near the end.", "use": "Prevents being juggled to death by a crowd and clearly signals \"you are safe right now\".", "prompt": "In your game, give the hero 1.2 s of i-frames after taking damage: toggle the sprite between 100% and 25% opacity every 0.08 s, speeding up to every 0.04 s for the last 0.3 s, and ignore all damage checks during that window."}, "ja": {"name": "無敵点滅（無敵時間の点滅）", "observe": "被弾後、キャラクターが約 1〜2 秒間一定のリズムで点滅（または半透明でちらつき）し、その間は再びダメージを受けない。終わると通常に戻る。", "notThis": "ヒットフラッシュ（FB-01、一回だけ）とは違う。点滅のリズム自体が残り無敵時間のタイマーで、終盤に速くなることが多い。", "use": "囲まれて連続ヒットで即死するのを防ぎ、「今は安全」とはっきり伝える。", "prompt": "ゲームで、主人公が被弾したら 1.2 秒の無敵時間を付けて。スプライトを 0.08 秒ごとに不透明度 100% と 25% で切り替え、最後の 0.3 秒は 0.04 秒ごとに加速。その間のダメージ判定はすべて無視。"}, "params": "i-frame duration 0.6–2 s · blink period · low alpha (0 vs 25%) · speed-up near end · whether attacks/collision also pass through", "impl": "Purely gameplay-timer driven: alpha = (floor(time/period) % 2) ? lowAlpha : 1. Pass alpha via per-instance colour; enable alpha blending (SrcAlpha/InvSrcAlpha) for the sprite batch. Keep the damage-immune flag in the same component so visuals and logic cannot drift.", "related": ["FB-01", "FB-05"], "refs": [{"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}, {"t": "Wikipedia — Glossary of video game terms (glossary entry)", "u": "https://en.wikipedia.org/wiki/Glossary_of_video_game_terms"}], "nosrc": false}, {"id": "FB-04", "cat": "FB", "sub": "命中與受擊", "std": "Death effect", "aliases": ["Death burst", "Death poof", "Defeat effect"], "type": "C", "zh": {"name": "死亡特效", "observe": "敵人被擊倒時不是直接消失，而是閃白、膨脹後爆成碎片／煙霧／像素粒子，並可能留下掉落物或屍體。", "notThis": "不是爆炸（VFX-09，有火球與衝擊）；也不是溶解燒盡（VFX-04，以噪聲邊緣慢慢消失）。死亡特效重點是「這個敵人確定結束了」的總結動作。", "use": "給擊殺一個清楚的結尾與滿足感；配合掉落物（FB-14）和殘留物（FB-12）。", "prompt": "在遊戲中，敵人被擊倒時：先閃白 0.06 秒並放大到 120%，然後分裂成 10–14 個綠色與深綠像素碎片向外噴射並受重力下落，同時出現一團灰白煙霧 0.4 秒淡出；最後在原地掉出金幣。"}, "en": {"name": "Death effect", "observe": "A defeated enemy does not just vanish: it flashes, swells, then pops into chunks, smoke or pixel particles, possibly leaving loot or a corpse.", "notThis": "Not an explosion (VFX-09, with fireball and shock) nor a dissolve (VFX-04, fading along a noisy edge). A death effect is the closing beat that says \"this enemy is definitely done\".", "use": "Gives kills a clear ending and satisfaction; pairs with pickups (FB-14) and permanence (FB-12).", "prompt": "In your game, when an enemy dies: flash white for 0.06 s and scale to 120%, then split into 10–14 green/dark-green pixel chunks that burst outward and fall under gravity, plus a grey-white smoke puff fading over 0.4 s; finally drop a coin at the spot."}, "ja": {"name": "撃破演出（デスエフェクト）", "observe": "倒された敵がただ消えるのではなく、白く光って膨らみ、破片・煙・ドットの粒子になって弾け、ドロップ品や死体を残すこともある。", "notThis": "爆発（VFX-09、火球と衝撃を伴う）やディゾルブ（VFX-04、ノイズ状の縁で消えていく）とは違う。「この敵は確実に終わった」という締めの演出。", "use": "撃破に明確な終わりと気持ちよさを与える。ドロップ（FB-14）や残留物（FB-12）と組み合わせる。", "prompt": "ゲームで、敵撃破時に：0.06 秒白フラッシュして 120% に拡大、その後緑と濃い緑のドット破片 10〜14 個を外向きに飛ばして重力で落とし、同時に灰白色の煙を 0.4 秒でフェード。最後にその場へコインを落として。"}, "params": "pre-flash time · swell scale · chunk count & speed · gravity · smoke lifetime · loot delay", "impl": "CPU-side burst emitter writing into the shared sprite/particle dynamic vertex buffer; chunks are 1–2 px quads sampled from the dying sprite palette. Optionally use the sprite texture itself split into tiles for real chunks.", "related": ["FB-01", "FB-12", "FB-14", "VFX-18", "VFX-04"], "refs": [{"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}, {"t": "Unity Manual — Particle System", "u": "https://docs.unity3d.com/Manual/class-ParticleSystem.html"}], "nosrc": false}, {"id": "FB-05", "cat": "FB", "sub": "命中與受擊", "std": "Status effect tint", "aliases": ["Status colour overlay", "Debuff tint", "Elemental tint"], "type": "D", "zh": {"name": "狀態染色", "observe": "角色在中毒、燃燒、冰凍、減速等狀態期間，持續帶着一層半透明顏色（綠、橙、淺藍），常伴隨小粒子或脈動。", "notThis": "不是命中閃白（FB-01，一瞬間全覆蓋）；也不是光環（VFX-14，在角色外圍發光）。狀態染色是「角色本身變色」並持續整段狀態時間。", "use": "一眼看出誰中了什麼狀態；顏色要與元素系統一致。", "prompt": "在遊戲中加入狀態染色：中毒時精靈疊加 40% 綠色並每 0.6 秒脈動一次，頭上冒小綠泡；冰凍時疊加 50% 淺藍並停止動畫；燃燒時疊加 35% 橙色並冒小火星。狀態結束時 0.2 秒淡出。"}, "en": {"name": "Status effect tint", "observe": "While poisoned, burning, frozen or slowed, the character carries a translucent colour layer (green, orange, pale blue) for the whole duration, often with small particles or a pulse.", "notThis": "Not a hit flash (FB-01, an instant full override) nor an aura (VFX-14, glow around the outside). Here the character itself changes colour and keeps it while the status lasts.", "use": "Tells at a glance who has which status; colours must match the element system.", "prompt": "Add status tints to the game: poison overlays 40% green pulsing every 0.6 s with small green bubbles above the head; freeze overlays 50% pale blue and stops the animation; burn overlays 35% orange with sparks. Fade the tint out over 0.2 s when the status ends."}, "ja": {"name": "状態異常の色付け（ステータスティント）", "observe": "毒・燃焼・凍結・鈍足などの間、キャラクターに半透明の色（緑・橙・水色）が持続的に重なり、小さな粒子や脈動を伴うことが多い。", "notThis": "ヒットフラッシュ（FB-01、一瞬の全面上書き）やオーラ（VFX-14、外側の発光）とは違い、キャラクター自体の色が状態の間ずっと変わる。", "use": "誰がどの状態か一目で分かる。色は属性システムと統一する。", "prompt": "ゲームに状態異常の色付けを追加して。毒は緑 40% を重ねて 0.6 秒ごとに脈動、頭上に小さな緑の泡。凍結は水色 50% を重ねてアニメを停止。燃焼は橙 35% と火の粉。状態終了時は 0.2 秒でフェードアウト。"}, "params": "tint colour & strength 30–60% · pulse period · blend (lerp / multiply / additive) · paired particles · fade-out", "impl": "Same sprite shader as FB-01 with a second uniform: rgb = lerp(rgb, tintColor, tintAmount*(0.75+0.25*sin(time*pulse))). Multiply blending (rgb*tint) keeps shading readable for dark tints; lerp works better for ice/white.", "related": ["FB-01", "VFX-14", "FB-03"], "refs": [{"t": "Wikipedia — Status effect", "u": "https://en.wikipedia.org/wiki/Status_effect"}], "nosrc": false}, {"id": "FB-06", "cat": "FB", "sub": "命中與受擊", "std": "Critical hit emphasis", "aliases": ["Crit feedback", "Critical hit effect", "Crit pop"], "type": "D", "zh": {"name": "暴擊強調", "observe": "暴擊時同一套命中回饋被全面加強：更大的傷害數字（不同顏色）、更長的 hitstop、更強的震動、額外星形火花或閃光，有時加短暫慢動作。", "notThis": "不是另一種效果，而是把 FB-01/02/07 等「調大」；與終結停格（FB-11）不同，暴擊不一定結束戰鬥。", "use": "讓隨機或技巧性的高傷害有明顯的獎勵感，玩家能分辨「普通一刀」與「暴擊一刀」。", "prompt": "在遊戲中把暴擊做得與普通命中明顯不同：傷害數字改金色、放大 1.6 倍並加「!」；hitstop 由 0.05 秒延長到 0.1 秒；震動 trauma +0.4；命中點出現 4 角星形白色火花 0.15 秒。"}, "en": {"name": "Critical hit emphasis", "observe": "On a crit the normal hit feedback is amplified across the board: bigger, differently coloured damage number, longer hitstop, stronger shake, an extra star spark or flash, sometimes a brief slow-down.", "notThis": "Not a separate effect but FB-01/02/07 \"turned up\"; unlike a freeze-frame finisher (FB-11), a crit does not end the fight.", "use": "Makes random or skill-based big hits feel rewarding, so players can tell a normal hit from a crit.", "prompt": "In your game, make crits clearly different from normal hits: gold damage number at 1.6× scale with \"!\"; hitstop 0.05 s → 0.1 s; add +0.4 shake trauma; spawn a white 4-point star spark at the impact point for 0.15 s."}, "ja": {"name": "クリティカル演出", "observe": "クリティカル時に通常のヒット演出が全体的に強化される：大きく色の違うダメージ数値、長めのヒットストップ、強い揺れ、星形の火花や閃光、時には短いスロー。", "notThis": "別の効果ではなく FB-01/02/07 などを「強めた」もの。フィニッシュの静止（FB-11）とは違い、戦闘を終わらせるとは限らない。", "use": "ランダムや技術による大ダメージにご褒美感を与え、通常ヒットと区別できるようにする。", "prompt": "ゲームでクリティカルを通常ヒットとはっきり区別して：ダメージ数値は金色・1.6 倍・「!」付き、ヒットストップを 0.05→0.1 秒、揺れの trauma を +0.4、命中点に白い 4 方向の星形火花を 0.15 秒。"}, "params": "number scale & colour · hitstop multiplier · extra shake trauma · spark shape · optional time-scale dip", "impl": "No new rendering path: a CritEvent multiplies parameters of existing feedback systems (hitstop, shake, numbers, spark emitter). Keep the multipliers in one data table so design can tune them.", "related": ["FB-02", "FB-07", "ACT-21 Hitstop", "FB-11"], "refs": [{"t": "Wikipedia — Critical hit", "u": "https://en.wikipedia.org/wiki/Critical_hit"}, {"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}], "nosrc": false}, {"id": "FB-07", "cat": "FB", "sub": "鏡頭回饋", "std": "Trauma-based screen shake", "aliases": ["Trauma shake", "Perlin screen shake", "Camera shake"], "type": "C", "zh": {"name": "創傷值震動（Trauma 震動）", "observe": "畫面震動不是固定抖幾下，而是用一個「創傷值」（0–1）控制：每次受擊加創傷值，創傷值隨時間衰減，實際震幅＝創傷值的平方，位移與旋轉用平滑噪聲產生。", "notThis": "不是隨機每幀亂跳的抖動（會顯得廉價）；也不是鏡頭後座（FB-08，單方向一下）。Trauma 震動可以疊加、會自然平息。", "use": "爆炸、重擊、Boss 落地；多個事件同時發生時震動自然累加而不爆表。", "prompt": "在遊戲的鏡頭加入 trauma 震動：trauma 0–1，每秒衰減 1.5；震幅 = trauma²，最大位移 6px、最大旋轉 2°，用 Perlin 噪聲（頻率約 15Hz）取樣。普通命中 +0.2，爆炸 +0.6。像素模式下最後位移取整到整數像素。"}, "en": {"name": "Trauma-based screen shake", "observe": "Shake is driven by a \"trauma\" value (0–1) instead of a fixed wobble: each hit adds trauma, trauma decays over time, actual amplitude = trauma², and offset/rotation come from smooth noise.", "notThis": "Not per-frame random jitter (which looks cheap) nor camera kick (FB-08, one directional jolt). Trauma shake stacks and settles naturally.", "use": "Explosions, heavy hits, boss landings; many simultaneous events add up without going out of control.", "prompt": "Add trauma-based shake to the game camera: trauma 0–1 decaying 1.5/s; amplitude = trauma²; max offset 6 px and max rotation 2°, sampled from Perlin noise at ~15 Hz. Normal hit +0.2, explosion +0.6. In pixel mode round the final offset to whole pixels."}, "ja": {"name": "トラウマ式画面揺れ（トラウマシェイク）", "observe": "固定回数の揺れではなく「トラウマ値」（0〜1）で制御する。被弾ごとに加算され時間で減衰し、実際の振幅＝トラウマ²、位置と回転は滑らかなノイズから作る。", "notThis": "毎フレームのランダムなガタつき（安っぽく見える）やカメラキック（FB-08、一方向に一回）とは違う。重ね掛けでき、自然に収まる。", "use": "爆発、重い一撃、ボスの着地。複数の出来事が同時に起きても破綻せずに加算される。", "prompt": "ゲームのカメラにトラウマ式シェイクを入れて：trauma 0〜1、毎秒 1.5 減衰、振幅＝trauma²、最大移動 6px・最大回転 2°、約 15Hz の Perlin ノイズで取得。通常ヒット +0.2、爆発 +0.6。ドットモードでは最終オフセットを整数ピクセルに丸める。"}, "params": "trauma add per event · decay/s · exponent (2–3) · max offset & angle · noise frequency · pixel rounding", "impl": "Camera-only: offset = maxOffset * trauma^2 * noise(seed, t*freq) per axis; angle likewise. Apply in the view matrix before the pixel-snapped blit (or round offset when rendering at native low res). Never move the world objects themselves.", "related": ["FB-08", "FB-09", "PIX-02"], "refs": [{"t": "Squirrel Eiserloh — Math for Game Programmers: Juicing Your Cameras With Math (GDC Vault)", "u": "https://www.gdcvault.com/play/1023557/Math-for-Game-Programmers-Juicing"}, {"t": "Juicing Your Cameras With Math (GDC, YouTube)", "u": "https://www.youtube.com/watch?v=tu-Qe66AvtY"}, {"t": "Jan Willem Nijman — The art of screenshake (talk, YouTube)", "u": "https://www.youtube.com/watch?v=AJdEqssNZ-U"}, {"t": "Design Atlas — Screen shake", "u": "https://design.solhun.com/en/game-ui/screen-shake/"}], "nosrc": false}, {"id": "FB-08", "cat": "FB", "sub": "鏡頭回饋", "std": "Camera kick", "aliases": ["Recoil kick", "Directional screen shake", "Camera recoil"], "type": "C", "zh": {"name": "鏡頭後座", "observe": "開槍或重擊時鏡頭朝一個特定方向（通常與攻擊方向相反）猛地推一下，然後快速彈回原位；只有一下，有方向性。", "notThis": "不是全方向的隨機震動（FB-07）；也不是推鏡放大（FB-09，改變縮放）。鏡頭後座只平移、有明確方向。", "use": "射擊、蓄力攻擊、被大力擊退；讓「力的方向」被感受到。", "prompt": "在遊戲中，主角揮重錘或射箭時，鏡頭沿攻擊反方向位移 3px，用 0.12 秒彈簧回彈到原位（輕微過衝）；連射時每發只加位移不累積超過 6px。"}, "en": {"name": "Camera kick", "observe": "On firing or a heavy hit the camera jolts in one specific direction (usually opposite the attack) and springs back quickly — a single, directional push.", "notThis": "Not omnidirectional random shake (FB-07) nor a punch-in (FB-09, which changes zoom). A kick only translates, with a clear direction.", "use": "Shooting, charged attacks, heavy knockback — it makes the direction of force felt.", "prompt": "In your game, when the hero swings a heavy hammer or fires an arrow, offset the camera 3 px opposite the attack and spring it back within 0.12 s with slight overshoot; during rapid fire, add per shot but clamp the total at 6 px."}, "ja": {"name": "カメラキック（反動キック）", "observe": "射撃や重い一撃の時、カメラが特定の方向（多くは攻撃と逆）へ一瞬押され、すぐ跳ね返って戻る。一回きりで方向性がある。", "notThis": "全方向のランダムな揺れ（FB-07）やパンチイン（FB-09、ズームが変わる）とは違い、平行移動だけで方向がはっきりしている。", "use": "射撃、溜め攻撃、大きなノックバック。力の向きを体感させる。", "prompt": "ゲームで、主人公がハンマーを振ったり矢を射たりした時、カメラを攻撃と逆方向へ 3px ずらし、0.12 秒のバネで少しオーバーシュートしつつ戻して。連射時は一発ごとに加算するが合計 6px を上限に。"}, "params": "kick distance · direction · spring stiffness/damping · overshoot · clamp for rapid fire", "impl": "Damped spring on a camera offset vector (x += v*dt; v += (-k*x - c*v)*dt). Add an impulse to v on each event. Combine with trauma shake by summing offsets before the view matrix.", "related": ["FB-07", "FB-09", "FB-15"], "refs": [{"t": "Jan Willem Nijman — The art of screenshake (talk, YouTube)", "u": "https://www.youtube.com/watch?v=AJdEqssNZ-U"}, {"t": "Squirrel Eiserloh — Math for Game Programmers: Juicing Your Cameras With Math (GDC Vault)", "u": "https://www.gdcvault.com/play/1023557/Math-for-Game-Programmers-Juicing"}], "nosrc": false}, {"id": "FB-09", "cat": "FB", "sub": "鏡頭回饋", "std": "Camera punch-in", "aliases": ["Impact zoom", "Zoom punch", "Hit zoom"], "type": "D", "zh": {"name": "推鏡放大（衝擊縮放）", "observe": "重擊命中的瞬間，鏡頭快速放大幾個百分比（或對準命中點拉近），然後在零點幾秒內緩緩退回原本縮放。", "notThis": "不是慢動作（FB-10，時間變慢）；也不是鏡頭後座（FB-08，平移）。推鏡放大改變的是「縮放」，強調焦點。", "use": "Boss 重擊、蓄力斬、最後一擊；配合停格效果更強。", "prompt": "在遊戲中，蓄力重擊命中時鏡頭以命中點為中心在 0.05 秒內放大到 108%，之後 0.35 秒 ease-out 回到 100%；像素模式下只用整數倍或在放大期間短暫允許非整數縮放。"}, "en": {"name": "Camera punch-in", "observe": "On a heavy hit the camera zooms in a few percent quickly (or toward the impact point), then eases back to the original zoom over a fraction of a second.", "notThis": "Not slow motion (FB-10, time slows) nor camera kick (FB-08, translation). A punch-in changes zoom to emphasise focus.", "use": "Boss blows, charged slashes, final hits; stronger combined with a freeze frame.", "prompt": "In your game, when a charged heavy attack lands, zoom the camera to 108% centred on the impact point within 0.05 s, then ease out back to 100% over 0.35 s; in pixel mode either use integer steps or accept non-integer zoom only during the punch."}, "ja": {"name": "パンチイン（衝撃ズーム）", "observe": "重い一撃が当たった瞬間、カメラが数％素早くズームイン（または命中点へ寄る）し、0.数秒かけて元の倍率へ戻る。", "notThis": "スローモーション（FB-10、時間が遅くなる）やカメラキック（FB-08、平行移動）とは違い、変わるのは「倍率」で、焦点を強調する。", "use": "ボスへの重撃、溜め斬り、最後の一撃。ヒットストップと組み合わせるとより強い。", "prompt": "ゲームで、溜め重撃が当たった時に命中点を中心に 0.05 秒で 108% までズームし、0.35 秒の ease-out で 100% に戻して。ドットモードでは整数倍のみ、またはズーム中だけ非整数倍を許可。"}, "params": "peak zoom 104–115% · attack time · release time & curve · zoom pivot (screen centre vs impact point)", "impl": "Scale the orthographic projection (or the low-res → backbuffer blit rect) around a pivot. For pixel-perfect output, render the low-res target slightly larger and crop, or accept a short non-integer phase with point sampling.", "related": ["FB-08", "FB-10", "FB-11", "PIX-01"], "refs": [{"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}], "nosrc": true}, {"id": "FB-10", "cat": "FB", "sub": "時間操控", "std": "Slow motion", "aliases": ["Bullet time", "Time dilation", "Slow-mo"], "type": "S", "zh": {"name": "慢動作（子彈時間）", "observe": "遊戲時間整體變慢（例如 30%），角色、粒子、投射物都以慢速移動；有時玩家自己仍正常速度，畫面邊緣加暗角或去色。", "notThis": "不是停格／hitstop（完全停住）；也不是終結停格（FB-11）。慢動作仍在動，只是慢，可持續幾秒。", "use": "技能（子彈時間）、閃避成功獎勵、最後一個敵人倒下時的戲劇效果。", "prompt": "在遊戲中，完美閃避後觸發 1.5 秒慢動作：全域 timeScale 在 0.1 秒內降到 0.3，結束前 0.3 秒回升到 1；期間畫面飽和度降 40% 並加淡藍暗角，主角動畫仍以 0.6 倍速播放。"}, "en": {"name": "Slow motion", "observe": "Game time slows down globally (e.g. to 30%), so characters, particles and projectiles all move slowly; sometimes the player stays faster, and the screen edges darken or desaturate.", "notThis": "Not a freeze or hitstop (fully stopped) nor a freeze-frame finisher (FB-11). Slow-mo still moves, just slower, and can last seconds.", "use": "Abilities (bullet time), perfect-dodge rewards, drama when the last enemy falls.", "prompt": "In your game, trigger 1.5 s of slow motion after a perfect dodge: drop global timeScale to 0.3 within 0.1 s and ramp back to 1 over the final 0.3 s; meanwhile desaturate 40% with a pale-blue vignette, and keep the hero animating at 0.6×."}, "ja": {"name": "スローモーション（バレットタイム）", "observe": "ゲーム全体の時間が遅くなり（例：30%）、キャラ・粒子・弾がゆっくり動く。プレイヤーだけ速いままのこともあり、画面端が暗くなったり彩度が下がったりする。", "notThis": "ヒットストップ（完全停止）や撃破の静止（FB-11）とは違い、遅いだけで動き続け、数秒続くこともある。", "use": "スキル（バレットタイム）、ジャスト回避のご褒美、最後の敵が倒れる時のドラマ。", "prompt": "ゲームで、ジャスト回避後に 1.5 秒のスローを発動して：全体 timeScale を 0.1 秒で 0.3 へ下げ、最後の 0.3 秒で 1 に戻す。その間彩度を 40% 下げて薄青のビネット、主人公のアニメは 0.6 倍速。"}, "params": "time scale 0.1–0.5 · ramp in/out · duration · player exemption factor · post effect (desaturate, vignette) · audio pitch", "impl": "Two clocks: gameDelta = realDelta * timeScale; UI and post-process use realDelta. Post: fullscreen pass with saturation lerp and vignette in a pixel shader. Particles must use gameDelta to slow correctly.", "related": ["FB-11", "ACT-21 Hitstop", "FB-16"], "refs": [{"t": "Wikipedia — Bullet time", "u": "https://en.wikipedia.org/wiki/Bullet_time"}, {"t": "Wikipedia — Slow motion", "u": "https://en.wikipedia.org/wiki/Slow_motion"}], "nosrc": false}, {"id": "FB-11", "cat": "FB", "sub": "時間操控", "std": "Freeze-frame finisher", "aliases": ["Time-stop finisher", "Kill freeze", "Final-hit freeze"], "type": "C", "zh": {"name": "終結停格", "observe": "最後一擊命中時畫面完全停住約 0.3–1 秒，常同時變黑白／高對比、背景變暗、命中點放射線，然後才繼續播放擊倒動作。", "notThis": "不是一般 hitstop（每一下都停幾幀）；終結停格更長、只在關鍵一擊，並常加畫面風格化。電影中的 freeze frame 是同一概念。", "use": "Boss 最後一擊、回合／波次結束、必殺技；給「這一下決定勝負」的分量。", "prompt": "在遊戲中，每波最後一隻敵人被擊倒時，全畫面停住 0.45 秒：畫面轉成高對比黑白、命中點出現白色放射線，鏡頭同時推近 6%；之後恢復色彩並播放死亡特效。"}, "en": {"name": "Freeze-frame finisher", "observe": "On the final blow the frame stops completely for ~0.3–1 s, often going monochrome/high-contrast with a darkened background and speed lines from the impact, then playback resumes with the defeat.", "notThis": "Not regular hitstop (a few frames on every hit); this is longer, reserved for the decisive hit, and usually stylised. The film freeze frame is the same idea.", "use": "Boss final hits, end of a wave or round, super moves — giving weight to \"this hit decided it\".", "prompt": "In your game, when the last enemy of a wave dies, freeze the whole screen for 0.45 s: high-contrast monochrome, white radial lines from the impact, camera pushed in 6%; then restore colour and play the death effect."}, "ja": {"name": "フィニッシュ静止（撃破時の一時停止）", "observe": "最後の一撃で画面が約 0.3〜1 秒完全に止まり、白黒・高コントラスト化、背景の暗転、命中点からの集中線などが入り、その後倒れる動きが再開する。", "notThis": "通常のヒットストップ（毎回数フレーム止まる）とは違い、長く、決定的な一撃だけに使い、様式化を伴うことが多い。映画のフリーズフレームと同じ考え方。", "use": "ボスへの最後の一撃、ウェーブやラウンドの終了、必殺技。「この一撃で決まった」重みを出す。", "prompt": "ゲームで、各ウェーブ最後の敵を倒した時に画面全体を 0.45 秒停止：高コントラストの白黒、命中点から白い放射線、カメラを 6% 寄せる。その後色を戻して撃破演出を再生して。"}, "params": "freeze length 0.3–1.0 s · style (mono / invert / colour key) · radial lines · camera push · resume easing", "impl": "Set gameplay timeScale = 0 while render continues; draw a fullscreen post pass (luminance threshold → 2-tone) and a radial-line overlay mesh. Same clock split as FB-10.", "related": ["FB-10", "FB-09", "ACT-21 Hitstop", "FB-06"], "refs": [{"t": "Wikipedia — Freeze frame shot", "u": "https://en.wikipedia.org/wiki/Freeze_frame_shot"}, {"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}], "nosrc": false}, {"id": "FB-12", "cat": "FB", "sub": "物件反應", "std": "Permanence", "aliases": ["Persistent debris", "Corpses & decals", "Leftover shells"], "type": "C", "zh": {"name": "殘留物（永久痕跡）", "observe": "戰鬥後留下的痕跡不會立即消失：屍體、彈殼、血跡／焦痕、碎片留在地上，讓場地記錄剛才發生過的戰鬥。", "notThis": "不是碎片飛散（VFX-18，飛出那一刻的動態）；殘留物是之後「留在那裡」的狀態。", "use": "加強因果感與世界感；《Juice it or lose it》與 Nijman 的演講都把它列為手感技巧。", "prompt": "在遊戲中，敵人死後在原地留下一個深色焦痕貼花與 2–3 個碎骨小精靈，最多保留 64 個，超過時最舊的在 1 秒內淡出；這些貼花畫在角色之下、地面之上。"}, "en": {"name": "Permanence", "observe": "Traces of combat do not vanish immediately: corpses, shells, blood or scorch marks and debris stay on the ground, so the arena remembers what happened.", "notThis": "Not debris flying out (VFX-18, the moment of ejection); permanence is the state that remains afterwards.", "use": "Strengthens cause-and-effect and a sense of place; both \"Juice it or lose it\" and Nijman list it as a game-feel trick.", "prompt": "In your game, leave a dark scorch decal and 2–3 small bone sprites where each enemy dies; keep at most 64 and fade the oldest over 1 s when exceeded. Draw them above the ground and below characters."}, "ja": {"name": "残留物（パーマネンス）", "observe": "戦闘の痕跡がすぐに消えない：死体、薬莢、血痕・焦げ跡、破片が地面に残り、場所がさっきの戦闘を記憶する。", "notThis": "破片が飛び散る瞬間（VFX-18）ではなく、その後「そこに残る」状態のこと。", "use": "因果関係と世界の実在感を強める。「Juice it or lose it」と Nijman の講演がどちらも手触りの技として挙げている。", "prompt": "ゲームで、敵が死んだ場所に濃い焦げ跡のデカールと小さな骨のスプライト 2〜3 個を残して。最大 64 個、超えたら最古のものを 1 秒でフェード。地面より上・キャラより下に描画。"}, "params": "max count · lifetime / never · fade-out · layer (below characters) · variety", "impl": "Ring buffer of decal instances drawn in a dedicated layer between ground tiles and Y-sorted sprites; one instanced draw. For huge counts, bake decals into a persistent render target over the ground.", "related": ["VFX-18", "FB-04", "PIX-16"], "refs": [{"t": "Jan Willem Nijman — The art of screenshake (talk, YouTube)", "u": "https://www.youtube.com/watch?v=AJdEqssNZ-U"}, {"t": "GDAD wiki — Source: Juice it or lose it", "u": "https://gdad.wiki/wiki/sources/source-juice-it-or-lose-it"}], "nosrc": false}, {"id": "FB-13", "cat": "FB", "sub": "物件反應", "std": "Squash on hit", "aliases": ["Hit wobble", "Hit squash and stretch", "Jelly reaction"], "type": "C", "zh": {"name": "受擊壓扁晃動", "observe": "被擊中的物件或角色瞬間被壓扁（變寬變矮）再彈回，或左右搖晃幾下後靜止，像果凍一樣。", "notThis": "不是一般動畫原則中的跳躍壓扁（ANI 類）而是專門的受擊反應；也不是命中閃白（FB-01，變色不變形）。", "use": "讓擊中「有彈性」：敵人、木箱、草叢、按鈕都能用；在像素遊戲中用縮放即可，不必另畫幀。", "prompt": "在遊戲中，敵人與木桶被擊中時以腳底為中心做受擊壓扁：0.04 秒內縮放到 (1.3, 0.75)，再以阻尼彈簧 0.25 秒回到 (1,1)，有一次輕微過衝；同時沿擊退方向傾斜 8°。"}, "en": {"name": "Squash on hit", "observe": "A struck object or character instantly squashes (wider and shorter) and bounces back, or wobbles side to side before settling — like jelly.", "notThis": "Not the general squash-and-stretch of jumps (an animation principle) but a dedicated hit reaction; not a hit flash (FB-01, colour not shape).", "use": "Makes hits feel springy — for enemies, crates, bushes, even buttons; in pixel games a scale tween works without extra frames.", "prompt": "In your game, squash enemies and barrels on hit around their feet: scale to (1.3, 0.75) within 0.04 s, then return to (1,1) with a damped spring over 0.25 s with one small overshoot; also tilt 8° along the knockback direction."}, "ja": {"name": "被弾時の潰れ・揺れ（ヒットウォブル）", "observe": "当たった物体やキャラが一瞬潰れて（横に広く低く）跳ね返る、あるいは左右に数回揺れて止まる。ゼリーのような反応。", "notThis": "ジャンプなどの一般的なスクワッシュ＆ストレッチではなく被弾専用の反応。ヒットフラッシュ（FB-01、色が変わるだけ）とも違う。", "use": "当たりに弾力を与える。敵、木箱、草むら、ボタンにも使える。ドット絵でも拡大縮小だけで追加フレーム不要。", "prompt": "ゲームで、敵や樽が被弾したら足元を基点に潰して：0.04 秒で (1.3, 0.75) に、その後減衰バネで 0.25 秒かけて (1,1) へ、軽く一回オーバーシュート。同時にノックバック方向へ 8° 傾ける。"}, "params": "squash scale · pivot (feet) · spring frequency & damping · tilt angle · pixel-snapping of the result", "impl": "Per-instance scale/rotation in the sprite vertex shader (world = pivot + R*S*(local - pivot)). Point sampling keeps pixels crisp; optionally quantise scale to multiples of 1/spriteHeight to avoid shimmering.", "related": ["FB-01", "FB-04", "PIX-05"], "refs": [{"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}, {"t": "Godot 4 game-feel tricks (saltmire)", "u": "https://saltmire.github.io/godot-4-game-feel-tricks.html"}], "nosrc": false}, {"id": "FB-14", "cat": "FB", "sub": "物件反應", "std": "Pickup magnetism", "aliases": ["Item vacuum", "Loot magnet", "Auto-collect pull"], "type": "C", "zh": {"name": "拾取吸附", "observe": "掉落的金幣、經驗球先散開彈跳，之後當玩家靠近（或過一會）便加速飛向玩家並被吸收，吸收時有小閃光和數字。", "notThis": "不是拾取閃光（VFX-16，物件在地上閃亮提示）；吸附是「飛向玩家」的移動。", "use": "減少玩家逐個走過去撿的麻煩，並讓收集有爽快感；倖存者類遊戲大量使用。", "prompt": "在遊戲中，敵人死後掉出的金幣先向外彈跳 0.4 秒，然後若主角在 48px 內，金幣以加速度 600px/s² 追向主角（最大速度 220px/s），接觸時播放小黃色閃光並在頭上顯示「+1」。"}, "en": {"name": "Pickup magnetism", "observe": "Dropped coins or XP orbs first scatter and bounce, then once the player is close (or after a delay) they accelerate toward the player and get absorbed with a small flash and number.", "notThis": "Not a pickup sparkle (VFX-16, a shine on an item lying on the ground); magnetism is the movement toward the player.", "use": "Removes the chore of walking over every item and makes collecting satisfying; used heavily in survivor-likes.", "prompt": "In your game, coins dropped by an enemy bounce outward for 0.4 s; then if the hero is within 48 px they home in with 600 px/s² acceleration (max 220 px/s), and on contact play a small yellow flash and show \"+1\" above the hero."}, "ja": {"name": "アイテム吸い寄せ（ピックアップマグネット）", "observe": "落ちたコインや経験値オーブがまず散らばって跳ね、プレイヤーが近づくと（または少し経つと）加速してプレイヤーへ飛んで吸収され、小さな光と数字が出る。", "notThis": "ピックアップのきらめき（VFX-16、地面のアイテムが光る合図）とは違い、こちらは「プレイヤーへ飛ぶ」動き。", "use": "一つずつ拾いに行く手間を省き、回収を気持ちよくする。サバイバー系で多用される。", "prompt": "ゲームで、敵が落とすコインはまず 0.4 秒外へ跳ね、その後主人公が 48px 以内なら加速度 600px/s²（最大 220px/s）で追尾し、接触時に小さな黄色い光と頭上の「+1」を出して。"}, "params": "scatter time · magnet radius · acceleration · max speed · absorb flash · stacking of \"+N\"", "impl": "Pure CPU motion on pickup entities (homing: v += normalize(player-p)*accel*dt; clamp). Render in the sprite batch; absorb flash uses the additive particle batch.", "related": ["FB-04", "VFX-16", "FB-02"], "refs": [{"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}, {"t": "Unity Manual — Particle System", "u": "https://docs.unity3d.com/Manual/class-ParticleSystem.html"}], "nosrc": true}, {"id": "FB-15", "cat": "FB", "sub": "戰鬥特效回饋", "std": "Muzzle flash", "aliases": ["Gun flash", "Firing flash"], "type": "S", "zh": {"name": "槍口焰", "observe": "開火瞬間在槍口出現一團 1–3 幀的明亮星形／錐形閃光，並短暫照亮周圍；之後才看到子彈或煙。", "notThis": "不是爆炸（VFX-09）；也不是彈道拖尾（VFX-08）。槍口焰只在發射點、極短。", "use": "讓射擊有力量與節奏；在暗處同時充當光源。也適用於魔杖、弩炮發射。", "prompt": "在遊戲中，弩塔每次射擊時在弩口顯示 2 幀的黃白色星形閃光（第 1 幀大、第 2 幀小，隨機旋轉 0/45°），同時在 24px 半徑內加一個 0.05 秒的暖色點光源；之後冒一縷灰煙。"}, "en": {"name": "Muzzle flash", "observe": "At the moment of firing a bright star/cone flash appears at the muzzle for 1–3 frames and briefly lights the surroundings; only then do you see the projectile or smoke.", "notThis": "Not an explosion (VFX-09) nor a tracer (VFX-08). A muzzle flash lives only at the firing point and is extremely short.", "use": "Gives shots power and rhythm and doubles as a light source in the dark; also works for wands and ballistae.", "prompt": "In your game, each time a crossbow tower fires show a 2-frame yellow-white star flash at the muzzle (big then small, randomly rotated 0/45°), add a 0.05 s warm point light with 24 px radius, then a wisp of grey smoke."}, "ja": {"name": "マズルフラッシュ（発砲炎）", "observe": "発射の瞬間、銃口に 1〜3 フレームの明るい星形・円錐形の閃光が出て周囲を一瞬照らし、その後に弾や煙が見える。", "notThis": "爆発（VFX-09）や弾道の軌跡（VFX-08）とは違い、発射点だけで極めて短い。", "use": "射撃に力強さとリズムを与え、暗所では光源にもなる。杖やバリスタの発射にも使える。", "prompt": "ゲームで、弩の塔が撃つたびに発射口に黄白色の星形フラッシュを 2 フレーム（1 フレーム目は大、2 フレーム目は小、0/45° ランダム回転）、半径 24px の暖色点光源を 0.05 秒、その後に灰色の煙を一筋出して。"}, "params": "frames 1–3 · size · random rotation/sprite variant · light radius & duration · smoke follow-up", "impl": "Additive sprite (Blend: One/One) spawned for N frames; register a transient point light into the 2D light buffer (PIX-21) if lighting is enabled.", "related": ["VFX-08", "VFX-09", "FB-08", "PIX-21"], "refs": [{"t": "Wikipedia — Muzzle flash", "u": "https://en.wikipedia.org/wiki/Muzzle_flash"}], "nosrc": false}, {"id": "FB-16", "cat": "FB", "sub": "介面回饋", "std": "Low-health vignette", "aliases": ["Damage vignette", "Danger vignette", "Red screen edges"], "type": "C", "zh": {"name": "低血量暗角", "observe": "血量低於門檻時畫面四周出現紅色暗角，並隨心跳節奏脈動；越接近死亡越濃、脈動越快，有時畫面去色。", "notThis": "不是受擊時整個畫面閃紅一下（那是全螢幕受擊閃光）；低血量暗角是持續的狀態提示。", "use": "玩家不用看血條也知道「危險」；最好配心跳音效。", "prompt": "在遊戲中，主角血量低於 30% 時加入紅色暗角：強度由 0 線性增加到血量 0% 時的 0.6，以每分鐘 70→110 次的心跳節奏脈動（每次雙跳），同時整體飽和度降低最多 30%。"}, "en": {"name": "Low-health vignette", "observe": "When health drops below a threshold, a red vignette appears around the screen edges and pulses like a heartbeat; it gets stronger and faster near death, sometimes desaturating the image.", "notThis": "Not a one-off red flash of the whole screen when hit; the low-health vignette is a persistent state indicator.", "use": "Lets players feel \"danger\" without looking at the health bar; best paired with a heartbeat sound.", "prompt": "In your game, add a red vignette below 30% hero health: strength rises linearly to 0.6 at 0% health, pulsing as a double heartbeat from 70 to 110 bpm, and overall saturation drops by up to 30%."}, "ja": {"name": "瀕死時のビネット（ローヘルスビネット）", "observe": "体力がしきい値を下回ると画面の周囲に赤いビネットが現れ、心拍のように脈打つ。死に近いほど濃く速くなり、彩度が落ちることもある。", "notThis": "被弾時に画面全体が一瞬赤くなる演出とは違い、持続的な状態表示。", "use": "体力バーを見なくても「危ない」と分かる。心音の効果音と合わせると良い。", "prompt": "ゲームで、主人公の体力が 30% 未満になったら赤いビネットを追加して：強さは体力 0% で 0.6 まで線形に上昇、70→110 bpm の二拍の心拍で脈動、全体の彩度を最大 30% 下げる。"}, "params": "threshold · max strength · inner radius · pulse bpm range · desaturation amount", "impl": "Fullscreen post pass: vig = smoothstep(r0, r1, length(uv-0.5)*aspect); rgb = lerp(rgb, red, vig*strength*pulse). Run it after the low-res blit so the vignette is smooth, or before it for a pixelated look.", "related": ["FB-10", "FB-17"], "refs": [{"t": "Wikipedia — Health (game terminology)", "u": "https://en.wikipedia.org/wiki/Health_(game_terminology)"}], "nosrc": true}, {"id": "FB-17", "cat": "FB", "sub": "介面回饋", "std": "Delayed health bar", "aliases": ["Ghost bar", "Damage delay bar", "Chip-damage trail", "Catch-up bar"], "type": "C", "zh": {"name": "延遲血條（殘影血條）", "observe": "受傷時血條的前景立即減少，但後面有一段淺色（白／黃）殘影條停留一下才慢慢追上，讓玩家看清剛才扣了多少。", "notThis": "不是普通血條（瞬間變短）；也不是格鬥遊戲中的「可恢復紅血」（那是另一個機制）。延遲血條純粹是顯示上的殘影。", "use": "讓每次扣血的份量可讀，尤其是連續小傷害；Boss 血條幾乎都用。", "prompt": "在遊戲中，主角與 Boss 血條改為延遲血條：前景紅條即時更新；後方白色殘影條在受傷後停 0.4 秒，然後以每秒 40% 最大血量的速度追上；治療時則反過來，綠色預覽條先長，前景再追上。"}, "en": {"name": "Delayed health bar", "observe": "On damage the bar’s foreground drops immediately, but a pale (white/yellow) ghost segment lingers before catching up, so the player can read how much was lost.", "notThis": "Not a plain bar (instant drop), nor the \"recoverable red health\" mechanic of fighting games. The delayed bar is purely a display trail.", "use": "Makes each chunk of damage readable, especially rapid small hits; nearly every boss bar uses it.", "prompt": "Use delayed health bars for the hero and bosses in the game: the red foreground updates instantly; the white ghost bar waits 0.4 s after damage, then catches up at 40% of max HP per second; for heals invert it — a green preview grows first and the foreground follows."}, "ja": {"name": "遅延体力バー（ゴーストバー）", "observe": "ダメージ時に体力バーの前景はすぐ減るが、後ろの淡い色（白・黄）の残像部分が少し留まってからゆっくり追いつき、今どれだけ減ったかが読める。", "notThis": "普通のバー（瞬時に減る）とも、格闘ゲームの「回復可能な赤ゲージ」（別の仕組み）とも違う。表示上の残像に過ぎない。", "use": "連続した小ダメージでも一回ごとの量が読める。ボスの体力バーではほぼ定番。", "prompt": "ゲームの主人公とボスの体力バーを遅延バーに：赤い前景は即時更新、白い残像バーは被弾後 0.4 秒待ってから最大 HP の毎秒 40% の速さで追いつく。回復時は逆に緑のプレビューが先に伸び、前景が追う。"}, "params": "hold time 0.3–0.6 s · catch-up speed · ghost colour · heal preview colour · reset on new hit", "impl": "UI-only: two floats (shown, ghost). Draw three quads (bg, ghost, fg) in the UI batch; no special GPU work.", "related": ["FB-16", "FB-02"], "refs": [{"t": "Design Atlas — Health bar (delayed / ghost bar)", "u": "https://design.solhun.com/en/game-ui/health-bar/"}, {"t": "Wikipedia — Health (game terminology)", "u": "https://en.wikipedia.org/wiki/Health_(game_terminology)"}], "nosrc": false}, {"id": "FB-18", "cat": "FB", "sub": "介面回饋", "std": "Combo counter", "aliases": ["Hit counter", "Chain counter"], "type": "S", "zh": {"name": "連擊計數", "observe": "連續命中時畫面固定位置顯示「12 HITS」之類的數字，每加一次就彈跳放大，並有一條逐漸縮短的計時條；中斷後數字淡出或結算評分。", "notThis": "不是傷害數字（FB-02，跟着目標、顯示傷害值）；連擊計數顯示次數，位置固定在 HUD。", "use": "鼓勵玩家保持攻勢、建立節奏；可與分數倍率掛鉤。", "prompt": "在遊戲中加入連擊計數：畫面右上顯示「N HITS」，每次命中數字放大到 130% 再 0.1 秒縮回；下方一條 2 秒計時條，2 秒內無命中則重置並以 0.3 秒淡出；10 連擊以上數字轉金色。"}, "en": {"name": "Combo counter", "observe": "During consecutive hits a fixed spot on screen shows something like \"12 HITS\"; it bounces bigger on every increment and has a shrinking timer bar; when broken the number fades or a grade is tallied.", "notThis": "Not damage numbers (FB-02, which follow targets and show damage); a combo counter shows a count and lives in the HUD.", "use": "Encourages keeping up the pressure and builds rhythm; can tie into score multipliers.", "prompt": "Add a combo counter to the game: show \"N HITS\" at the top right, scale the number to 130% and back over 0.1 s on each hit, with a 2 s timer bar underneath; reset and fade out over 0.3 s if no hit lands in 2 s; turn the number gold from 10 hits."}, "ja": {"name": "コンボカウンター（ヒット数表示）", "observe": "連続ヒット中、画面の決まった位置に「12 HITS」のような数字が出て、増えるたびに弾むように拡大し、減っていくタイマーバーが付く。途切れると数字が消えるか評価が出る。", "notThis": "ダメージ数値（FB-02、対象に付いてダメージ量を表示）とは違い、回数を表示し、HUD に固定される。", "use": "攻め続けることを促し、リズムを作る。スコア倍率と連動させることもできる。", "prompt": "ゲームにコンボカウンターを追加して：右上に「N HITS」、命中ごとに数字を 130% に拡大して 0.1 秒で戻す。下に 2 秒のタイマーバー、2 秒ヒットがなければリセットして 0.3 秒でフェード。10 ヒット以上で金色に。"}, "params": "combo window (s) · bump scale · timer bar · colour tiers · break animation · score multiplier", "impl": "UI batch with a bitmap font; scale anim from a per-element timer. Keep the combo window logic in gameplay code and expose it to the UI as (count, timeLeft/window).", "related": ["FB-02", "FB-06"], "refs": [{"t": "Wikipedia — Combo (video games)", "u": "https://en.wikipedia.org/wiki/Combo_(video_games)"}, {"t": "Design Atlas — Combo counter", "u": "https://design.solhun.com/en/game-ui/combo-counter/"}], "nosrc": false}, {"id": "PIX-01", "cat": "PIX", "sub": "顯示與縮放", "std": "Integer scaling", "aliases": ["Pixel-perfect rendering", "Nearest-neighbour upscaling", "Point filtering", "Low-res render target"], "type": "S", "zh": {"name": "整數倍放大（像素完美顯示）", "observe": "整個遊戲先畫在一張很小的低解析度畫布（例如 320×180），再以 2×、3×、4× 等整數倍、最近鄰取樣放大到螢幕。每一個美術像素在螢幕上都是大小完全相同的正方形，邊緣銳利，沒有模糊。不夠整數倍的地方留黑邊（letterbox）。", "notThis": "不是像素放大濾鏡（PIX-04，會「補畫」平滑邊緣）；也不是只把貼圖過濾改成 point——若縮放比例是 2.5× 之類的非整數，即使用最近鄰，像素也會一列寬一列窄（PIX-23 混合像素感）。雙線性過濾則會令整張圖發矇。", "use": "像素美術的基礎：決定角色看起來有多大、線條是否穩定、會不會一移動就閃爍。其他所有像素效果都建立在這個顯示管線上。", "prompt": "在遊戲中把畫面改為像素完美顯示：所有遊戲內容先畫到 320×180 的 render target，取樣器一律用 point（最近鄰），再以「視窗能容納的最大整數倍」放大到 back buffer，剩餘空間填黑邊並置中。角色精靈 16×16 左右，在 1080p 下為 6× 顯示。不可使用雙線性過濾，也不可用非整數倍。"}, "en": {"name": "Integer scaling (pixel-perfect rendering)", "observe": "The whole game is drawn into a tiny low-resolution canvas (e.g. 320×180) and then enlarged to the screen by a whole-number factor — 2×, 3×, 4× — with nearest-neighbour sampling. Every art pixel becomes an identical square on screen with sharp edges and no blur. Leftover space is letterboxed.", "notThis": "Not an upscaling filter (PIX-04, which invents smooth edges), and not merely switching texture filtering to point: at a non-integer factor like 2.5× even nearest-neighbour gives alternating wide and narrow pixel columns (see PIX-23 mixels). Bilinear filtering makes the whole image soft.", "use": "The foundation of pixel art: it decides how big a character reads, whether lines stay stable, and whether things shimmer when they move. Every other pixel effect sits on top of this display pipeline.", "prompt": "Make the game render pixel-perfect: draw all game content into a 320×180 render target, use point (nearest) samplers everywhere, then upscale to the back buffer by the largest integer factor that fits the window, centring it with black letterbox bars. Character sprites are about 16×16, shown at 6× on 1080p. No bilinear filtering and no non-integer factors."}, "ja": {"name": "整数倍スケーリング（ピクセルパーフェクト表示）", "observe": "ゲーム全体をまず小さな低解像度キャンバス（例：320×180）に描き、2×・3×・4× などの整数倍で最近傍補間により画面へ拡大する。ドット一つ一つが画面上で同じ大きさの正方形になり、輪郭はシャープでぼけない。余白は黒帯（レターボックス）。", "notThis": "ドット絵拡大フィルタ（PIX-04、滑らかな輪郭を補完する）とは違う。テクスチャフィルタを point にするだけでも不十分で、2.5× のような非整数倍では最近傍でも太い列と細い列が交互に出る（PIX-23 ミクセル）。バイリニアは画面全体がぼやける。", "use": "ドット絵の土台。キャラがどの大きさに見えるか、線が安定するか、動いた時にちらつくかを決める。他のドット表現はすべてこの表示パイプラインの上に成り立つ。", "prompt": "ゲームをピクセルパーフェクト表示にして。ゲーム内容はすべて 320×180 のレンダーターゲットに描き、サンプラーは全部 point（最近傍）。ウィンドウに収まる最大の整数倍でバックバッファへ拡大し、余りは黒帯で中央寄せ。キャラスプライトは 16×16 前後で 1080p では 6× 表示。バイリニアと非整数倍は禁止。"}, "params": "base resolution (320×180 / 384×216 / 480×270) · integer factor = floor(min(winW/baseW, winH/baseH)) · letterbox colour · UI at native vs base res", "impl": "Render the world into a base-res render target (RGBA8, e.g. 320×180). Every sprite sampler: point/nearest filtering, clamp addressing, no mips. Final pass: viewport = (base*k) centred in the back buffer, draw a full-screen quad sampling the RT with the point sampler. Snap sprite positions to whole base pixels before writing vertices. Handle window resize by recomputing k, never by stretching.", "related": ["PIX-02", "PIX-03", "PIX-04", "PIX-23", "PIX-26"], "refs": [{"t": "Godot docs — Multiple resolutions (integer scaling)", "u": "https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html"}, {"t": "Unity — 2D Pixel Perfect package manual", "u": "https://docs.unity3d.com/Packages/com.unity.2d.pixel-perfect@5.0/manual/index.html"}, {"t": "Cole Cecil — Scaling pixel art without destroying it", "u": "https://colececil.dev/blog/2017/scaling-pixel-art-without-destroying-it/"}, {"t": "Wikipedia — Nearest-neighbor interpolation", "u": "https://en.wikipedia.org/wiki/Nearest-neighbor_interpolation"}, {"t": "Microsoft Learn — D3D11_SAMPLER_DESC (point vs linear filtering)", "u": "https://learn.microsoft.com/en-us/windows/win32/api/d3d11/ns-d3d11-d3d11_sampler_desc"}], "nosrc": false}, {"id": "PIX-02", "cat": "PIX", "sub": "顯示與縮放", "std": "Pixel snapping", "aliases": ["Pixel jitter", "Sprite jitter", "Position rounding", "Snap to pixel grid"], "type": "C", "zh": {"name": "像素對齊（避免像素抖動）", "observe": "物件與鏡頭的座標在畫出來前被四捨五入到整數像素，所以精靈永遠對齊像素格。沒處理好時，緩慢移動或鏡頭跟隨的角色會相對背景「一抖一抖」：一幀快一格、一幀慢一格，或者精靈內部某些像素列忽寬忽窄。", "notThis": "不是低解析度下的平滑鏡頭（PIX-03，刻意以高解析度偏移讓鏡頭移動更順）；也不是次像素動畫（PIX-14，美術手繪的中間色）。像素抖動是取整順序錯誤造成的 bug：角色與鏡頭各自取整，差值在 0 和 1 之間跳。", "use": "保證線條穩定、角色貼地；鏡頭跟隨主角時主角不應相對畫面晃動。", "prompt": "檢查遊戲的像素抖動：鏡頭先把位置取整到整數像素，所有物件以「世界座標取整 − 鏡頭取整座標」計算螢幕位置，而不是分開對浮點值四捨五入。物理與移動仍使用浮點，只有繪製時取整。跟隨主角時主角在畫面上的位置應保持不動。"}, "en": {"name": "Pixel snapping (avoiding pixel jitter)", "observe": "Object and camera coordinates are rounded to whole pixels before drawing, so sprites always sit on the pixel grid. When it is done wrong, a slowly moving or camera-followed character jitters against the background — one frame a pixel ahead, the next a pixel behind — or some pixel columns inside the sprite flicker wider and narrower.", "notThis": "Not sub-pixel camera smoothing (PIX-03, which deliberately offsets at high resolution for smoother scrolling) nor sub-pixel animation (PIX-14, hand-drawn in-between colours). Pixel jitter is a rounding-order bug: the character and the camera are rounded independently, so their difference flips between 0 and 1.", "use": "Keeps lines stable and characters planted; the followed hero should not wobble relative to the screen.", "prompt": "Fix pixel jitter in the game: round the camera position to whole pixels first, then compute each object's screen position as round(worldPos) − roundedCamera instead of rounding the floating values separately. Keep physics and movement in floats; round only at draw time. While following the hero, the hero should stay perfectly still on screen."}, "ja": {"name": "ピクセルスナップ（ドットのガタつき防止）", "observe": "描画前にオブジェクトとカメラの座標を整数ピクセルに丸め、スプライトを常にドット格子に揃える。これが正しくないと、ゆっくり動くキャラやカメラ追従中のキャラが背景に対して 1 ドット前後にガタガタ揺れたり、スプライト内部の列が太くなったり細くなったりする。", "notThis": "低解像度でのスムーズカメラ（PIX-03、意図的に高解像度でずらして滑らかにする）やサブピクセルアニメ（PIX-14、手描きの中間色）とは違う。ガタつきは丸め順序のバグで、キャラとカメラを別々に丸めるため差が 0 と 1 の間で跳ねる。", "use": "線を安定させ、キャラを地面に落ち着かせる。追従中の主人公は画面上で揺れてはいけない。", "prompt": "ゲームのドットのガタつきを直して。まずカメラ位置を整数ピクセルに丸め、各オブジェクトの画面位置は「round(ワールド座標) − 丸めたカメラ座標」で計算する（浮動小数をそれぞれ丸めない）。物理と移動は float のまま、丸めるのは描画時だけ。主人公を追従している時は画面上で完全に静止していること。"}, "params": "rounding mode (floor vs round, consistent sign handling) · what is snapped (camera, sprites, particles, UI) · snap in base-res pixels, not screen pixels", "impl": "In the sprite batch, compute camI = floor(cam + 0.5) once per frame; per sprite screen = floor(world + 0.5) − camI (use the same rounding for negatives). Feed integer positions to the vertex shader in base-res pixel units and build the ortho matrix with modern texel-centre conventions (no half-texel offset on current graphics APIs). Do not snap inside physics.", "related": ["PIX-01", "PIX-03", "PIX-14", "PIX-24"], "refs": [{"t": "Unity — 2D Pixel Perfect package manual", "u": "https://docs.unity3d.com/Packages/com.unity.2d.pixel-perfect@5.0/manual/index.html"}, {"t": "Godot docs — Multiple resolutions (integer scaling)", "u": "https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html"}, {"t": "Microsoft Learn — Directly mapping texels to pixels (D3D9 half-texel note; D3D10+ differs)", "u": "https://learn.microsoft.com/en-us/windows/win32/direct3d9/directly-mapping-texels-to-pixels"}], "nosrc": false}, {"id": "PIX-03", "cat": "PIX", "sub": "顯示與縮放", "std": "Sub-pixel camera smoothing", "aliases": ["Smooth pixel camera", "High-res camera offset", "Render-target margin scrolling"], "type": "C", "zh": {"name": "低解析度下的平滑鏡頭", "observe": "遊戲仍在低解析度畫布上以整數像素繪製（像素格不會變形），但鏡頭的小數部分不丟掉：低解析度畫面多畫一圈邊，最後放大到螢幕時以「小數 × 放大倍數」的螢幕像素偏移。結果鏡頭能以 1/6 個美術像素的精度慢慢滑動，而不是一格一格跳。", "notThis": "不是像素對齊（PIX-02，全部取整、鏡頭一格一格跳）；也不是把整個遊戲改用高解析度繪製（那樣精靈就可以停在半格位置，產生混合像素 PIX-23）。這裡只有「整張畫面」一起做次像素平移，美術像素之間的相對位置保持整數。", "use": "在低解析度（例如 320×180）時，鏡頭慢速跟隨會明顯一頓一頓；這個技巧讓捲動順滑，同時保留像素完美。", "prompt": "為遊戲的鏡頭加入次像素平滑：世界繪製到 (320+2)×(180+2) 的 render target，鏡頭整數部分用來繪製，小數部分 frac 保留；最終放大時把整張 RT 以 −frac×縮放倍數 的螢幕像素偏移，並裁掉多出的一像素邊。精靈與 tile 之間仍以整數像素對齊。"}, "en": {"name": "Sub-pixel camera smoothing", "observe": "The game is still drawn on a low-res canvas at whole pixels (the pixel grid never distorts), but the camera's fractional part is not thrown away: the low-res image is rendered with a one-pixel margin and, when it is enlarged to the screen, it is shifted by fraction × scale screen pixels. The camera can glide in 1/6-art-pixel steps instead of jumping a whole art pixel at a time.", "notThis": "Not pixel snapping (PIX-02, where everything rounds and the camera steps a pixel at a time), and not switching the whole game to high-resolution drawing (that lets sprites stop at half pixels and creates mixels, PIX-23). Only the finished frame is shifted by a sub-pixel amount; art pixels stay on whole-pixel offsets relative to each other.", "use": "At low base resolutions (e.g. 320×180) slow camera follow visibly stutters; this keeps scrolling smooth while staying pixel-perfect.", "prompt": "Add sub-pixel camera smoothing to the game: render the world into a (320+2)×(180+2) render target using the integer part of the camera; keep the fractional part. In the final upscale pass offset the whole RT by −frac × scale screen pixels and crop the extra one-pixel border. Sprites and tiles stay aligned to each other in whole pixels."}, "ja": {"name": "低解像度でのサブピクセルカメラ（スムーズスクロール）", "observe": "ゲームは低解像度キャンバスに整数ピクセルで描いたまま（ドット格子は崩れない）、カメラの小数部分を捨てない。低解像度画面を 1 ドット余分に描き、画面へ拡大する時に「小数 × 倍率」スクリーンピクセルだけずらす。カメラが 1 ドット単位で跳ばず、1/6 ドット精度で滑らかに動く。", "notThis": "ピクセルスナップ（PIX-02、全部丸めてカメラが 1 ドットずつ跳ぶ）とも、ゲーム全体を高解像度で描くこと（スプライトが半ドット位置に止まりミクセル PIX-23 になる）とも違う。完成した画面全体だけをサブピクセル移動し、ドット同士の相対位置は整数のまま。", "use": "320×180 のような低解像度ではゆっくりしたカメラ追従がカクつく。ピクセルパーフェクトを保ったままスクロールを滑らかにできる。", "prompt": "ゲームのカメラにサブピクセル補正を入れて。ワールドは (320+2)×(180+2) のレンダーターゲットにカメラの整数部分で描き、小数部分 frac を保持。最終拡大パスで RT 全体を −frac×倍率 スクリーンピクセルずらし、余分な 1 ドットの縁を切り取る。スプライトとタイルは互いに整数ピクセルで揃ったまま。"}, "params": "margin (1 px each side) · scale factor k · whether UI is excluded from the offset · camera damping curve (see CAM-04)", "impl": "World pass: RT size (baseW+2, baseH+2), view = translate(−floor(cam)+1). Upscale pass: draw a quad of size (baseW+2)*k at screen offset −frac(cam)*k − k, inside a scissor rect / viewport of baseW*k × baseH*k. Point sampler throughout. Draw HUD after this pass so it does not slide.", "related": ["PIX-01", "PIX-02", "CAM-04 Camera damping"], "refs": [{"t": "Unity — 2D Pixel Perfect package manual", "u": "https://docs.unity3d.com/Packages/com.unity.2d.pixel-perfect@5.0/manual/index.html"}, {"t": "Godot docs — Multiple resolutions (integer scaling)", "u": "https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html"}, {"t": "Cole Cecil — Scaling pixel art without destroying it", "u": "https://colececil.dev/blog/2017/scaling-pixel-art-without-destroying-it/"}], "nosrc": false}, {"id": "PIX-04", "cat": "PIX", "sub": "顯示與縮放", "std": "Pixel-art upscaling filters", "aliases": ["Scale2x / EPX", "hqx", "xBR", "Smoothing filters for pixel art"], "type": "S", "zh": {"name": "像素放大濾鏡（Scale2x／hqx／xBR）", "observe": "放大時演算法按相鄰像素的形狀「猜」出斜線與曲線，把階梯邊補成較平滑的對角線：Scale2x 每個像素變 2×2 並修圓角；hqx、xBR 更進一步，輸出接近手繪向量的輪廓，但顏色仍分明，不是模糊。", "notThis": "不是整數倍放大（PIX-01，每個像素只是變成大方塊，保留鋸齒）；也不是雙線性模糊。濾鏡會改變美術原貌，多數像素遊戲預設應提供「關閉」。", "use": "模擬器、復古重製版的「平滑」顯示選項；也是 RotSprite（PIX-05）的中間步驟。", "prompt": "在遊戲的顯示設定加一個可選的「平滑像素」濾鏡：預設為最近鄰整數放大；選項開啟時在最終放大前對 320×180 畫面跑一次 Scale2x（再接整數放大）。濾鏡只作用於最終畫面，不改變遊戲邏輯解析度。"}, "en": {"name": "Pixel-art upscaling filters (Scale2x / hqx / xBR)", "observe": "While enlarging, the algorithm looks at the shape of neighbouring pixels and \"guesses\" diagonals and curves, turning stair-step edges into smoother slopes: Scale2x turns each pixel into a 2×2 block and rounds corners; hqx and xBR go further and output near-vector contours — colours stay crisp, it is not a blur.", "notThis": "Not integer scaling (PIX-01, where each pixel becomes a big square and jaggies are kept), and not a bilinear blur. These filters change the artwork, so most pixel games should keep \"off\" as the default.", "use": "\"Smooth\" display options in emulators and retro remasters; also the intermediate step inside RotSprite (PIX-05).", "prompt": "Add an optional \"smooth pixels\" display filter to the game: the default stays nearest-neighbour integer scaling; when enabled, run Scale2x on the 320×180 frame before the integer upscale. The filter only affects the final image, not the game's logical resolution."}, "ja": {"name": "ドット絵拡大フィルタ（Scale2x／hqx／xBR）", "observe": "拡大時に周囲のドットの形から斜線や曲線を「推測」し、階段状の輪郭を滑らかな斜めの線にする。Scale2x は 1 ドットを 2×2 にして角を丸め、hqx・xBR はさらにベクター風の輪郭を出す。色ははっきりしたままで、ぼかしではない。", "notThis": "整数倍スケーリング（PIX-01、ドットが大きな正方形になるだけでギザギザは残る）やバイリニアのぼかしとは違う。原画が変わるので、多くのドット絵ゲームでは「オフ」を既定にすべき。", "use": "エミュレーターやリマスターの「スムーズ」表示オプション。RotSprite（PIX-05）の途中工程でもある。", "prompt": "ゲームの表示設定に任意の「スムーズドット」フィルタを追加して。既定は最近傍の整数倍拡大のまま。オンの時は 320×180 の画面に Scale2x をかけてから整数倍拡大する。フィルタは最終画像だけに作用し、論理解像度は変えない。"}, "params": "algorithm (Scale2x/3x, hq2x–hq4x, xBR/xBRZ levels) · equality threshold for colours · applied before or after integer scale · default off", "impl": "Implement as a full-screen pixel shader on the base-res RT: for Scale2x each output texel reads its source pixel P and neighbours A(up),B(right),C(left),D(down) and applies the EPX rules (e.g. E0 = (C==A && C!=D && A!=B) ? A : P). Output to a 2× RT, then integer-upscale with point sampling. Compare colours exactly (or with a small tolerance) — never sample with linear filtering.", "related": ["PIX-01", "PIX-05"], "refs": [{"t": "Wikipedia — Pixel-art scaling algorithms (xBR, hqx, Scale2x, RotSprite)", "u": "https://en.wikipedia.org/wiki/Pixel-art_scaling_algorithms"}, {"t": "Scale2x — algorithm description", "u": "https://www.scale2x.it/algorithm"}, {"t": "libretro glsl-shaders — xBR shader sources (GitHub)", "u": "https://github.com/libretro/glsl-shaders/tree/master/xbr"}], "nosrc": false}, {"id": "PIX-05", "cat": "PIX", "sub": "顯示與縮放", "std": "RotSprite", "aliases": ["Pixel-art rotation", "Rotating sprites without breaking lines"], "type": "S", "zh": {"name": "RotSprite（像素圖旋轉）", "observe": "把像素精靈旋轉任意角度後，線條仍是一像素寬、連續、沒有破洞，顏色也沒有混出新色。做法是先用 Scale2x 類演算法放大 8 倍，再旋轉，最後縮回原大小取樣。對比之下，直接最近鄰旋轉會令斜線斷開、出現孤立點和缺口。", "notThis": "不是即時以雙線性旋轉（會模糊並產生新顏色）；也不是美術手繪多個角度。RotSprite 通常離線預先生成或在載入時生成，結果仍會比手繪粗糙。", "use": "旋轉的武器、飛行的箭矢與投射物、轉動的門或風車，在不想手繪每個角度時使用。", "prompt": "為遊戲的箭矢與擲斧預先生成 16 個角度的旋轉圖：每張原圖先用 Scale2x 放大 8 倍、按角度做最近鄰旋轉、再每 8×8 取中心像素縮回原大小，存入 atlas；遊戲中按飛行方向挑最接近的角度，不做即時旋轉。"}, "en": {"name": "RotSprite (pixel-art rotation)", "observe": "A pixel sprite is rotated to any angle and its lines stay one pixel wide and continuous, with no holes and no new blended colours. It works by upscaling 8× with a Scale2x-style algorithm, rotating, then sampling back down to the original size. By comparison, a straight nearest-neighbour rotation breaks diagonals into gaps and stray single pixels.", "notThis": "Not real-time bilinear rotation (blurry, invents colours) and not hand-drawing each angle. RotSprite is normally baked offline or at load time, and the result is still rougher than hand-drawn frames.", "use": "Spinning weapons, flying arrows and projectiles, rotating doors or windmills — whenever you do not want to hand-draw every angle.", "prompt": "Pre-bake 16 rotation angles for the game's arrows and thrown axes: for each source image, Scale2x it to 8×, rotate with nearest-neighbour sampling, then take the centre pixel of every 8×8 block to shrink back to the original size, and store the results in the atlas. In game pick the closest angle to the flight direction — no real-time rotation."}, "ja": {"name": "RotSprite（ドット絵の回転）", "observe": "ドットスプライトを任意の角度に回転しても、線が 1 ドット幅で途切れず、穴もなく、新しい混色も出ない。Scale2x 系で 8 倍に拡大→回転→元のサイズにサンプリングして戻す。対して最近傍でそのまま回転すると斜線が切れ、孤立ドットや欠けが出る。", "notThis": "リアルタイムのバイリニア回転（ぼけて新しい色が出る）とも、全角度の手描きとも違う。通常はオフラインかロード時に事前生成し、結果は手描きより粗い。", "use": "回転する武器、飛ぶ矢や投射物、回る扉や風車など、全角度を手描きしたくない時。", "prompt": "ゲームの矢と投げ斧を 16 方向分事前生成して。元画像を Scale2x で 8 倍にし、角度ごとに最近傍で回転、8×8 ブロックごとに中心ドットを取って元サイズに戻し、アトラスに保存。ゲーム中は飛行方向に最も近い角度を選び、リアルタイム回転はしない。"}, "params": "number of baked angles (8/16/32) · pre-scale factor (8×) · downsample rule (centre sample vs similarity vote) · pivot pixel", "impl": "Offline/tool step (C++ at asset import): scale2x ×3 → nearest rotate around the sprite pivot → pick centre texel of each 8×8 cell. Pack angles into the atlas; at runtime select frame = round(angle / (2π/N)) mod N. Keep the pivot on a whole pixel so the projectile does not wobble between angles.", "related": ["PIX-04", "PIX-11", "PIX-24"], "refs": [{"t": "Wikipedia — Pixel-art scaling algorithms (xBR, hqx, Scale2x, RotSprite)", "u": "https://en.wikipedia.org/wiki/Pixel-art_scaling_algorithms"}, {"t": "Scale2x — algorithm description", "u": "https://www.scale2x.it/algorithm"}], "nosrc": false}, {"id": "PIX-06", "cat": "PIX", "sub": "色彩", "std": "Palette swap", "aliases": ["Palette shift", "Recolour variant", "Colour LUT swap", "Indexed sprite recolour"], "type": "S", "zh": {"name": "換色盤（同圖換色）", "observe": "同一張精靈圖按「色號」繪製，只要換一組調色盤，就得到紅色精英、藍色冰凍、紫色中毒等不同版本；形狀和陰影位置完全相同，只有顏色換掉。", "notThis": "不是狀態染色（FB-05，在原色上疊半透明色，陰影會被一起蓋住）；也不是色盤循環（PIX-07，色號隨時間輪轉做動畫）。換色盤是逐色號一對一替換，深色仍是深色。", "use": "少量美術做出多種敵人／隊伍顏色／稀有變種；玩家亦可用來即時辨認強度。", "prompt": "為遊戲的敵人加入換色盤：精靈以 8 色色號圖儲存，普通敵人用綠色盤、精英用紅色盤、薩滿用紫色盤、冰凍狀態臨時換成淺藍盤。每組色盤保留相同明暗層次（暗→亮），描邊色不變。"}, "en": {"name": "Palette swap", "observe": "One sprite is drawn in colour indices; swapping the palette gives a red elite, a blue frozen or a purple poisoned version. Shape and shading are identical — only the colours change.", "notThis": "Not a status tint (FB-05, a translucent colour laid over the original, which also covers the shading) nor colour cycling (PIX-07, rotating indices over time for animation). A palette swap replaces colours index-for-index, so dark stays dark.", "use": "Many enemy variants, team colours or rare versions from little art; players can read strength at a glance.", "prompt": "Add palette swaps to the game's enemies: store the sprite as an 8-colour index map; normal enemies use the green palette, elites the red one, shamans the purple one, and frozen enemies temporarily switch to a light-blue palette. Each palette keeps the same dark-to-light value order and the outline colour is unchanged."}, "ja": {"name": "パレットスワップ（色替え）", "observe": "一枚のスプライトを色番号で描き、パレットを替えるだけで赤いエリート、青い凍結、紫の毒などの別バージョンになる。形と影の位置は全く同じで、色だけが変わる。", "notThis": "状態異常の色付け（FB-05、元の色に半透明の色を重ねるので影も塗りつぶされる）やカラーサイクリング（PIX-07、色番号を時間で回すアニメ）とは違う。番号ごとの一対一の置き換えなので、暗い色は暗いまま。", "use": "少ない素材で多くの敵バリエーション・チームカラー・レア個体を作る。強さを一目で判別させる。", "prompt": "ゲームの敵にパレットスワップを入れて。スプライトは 8 色のインデックス画像で保存し、通常は緑、エリートは赤、シャーマンは紫、凍結中は一時的に水色パレットに切り替える。どのパレットも暗→明の明度順は同じに保ち、輪郭色は変えない。"}, "params": "palette size (4–16) · which indices are swappable (skin/cloth vs outline/eyes) · per-instance palette row · swap timing (instant vs flash)", "impl": "Store sprites as R8_UNORM index textures (or encode index in the red channel of the atlas). Bind a palette texture (N×rows, R8G8B8A8) with a point sampler; pixel shader: idx = tex.r*255; col = pal.Load(int3(idx, paletteRow, 0)). Pass paletteRow per instance. Index 0 = transparent.", "related": ["FB-05", "PIX-07", "PIX-10"], "refs": [{"t": "Wikipedia — Palette swap", "u": "https://en.wikipedia.org/wiki/Palette_swap"}, {"t": "Lospec — Palette list", "u": "https://lospec.com/palette-list"}], "nosrc": false}, {"id": "PIX-07", "cat": "PIX", "sub": "色彩", "std": "Color cycling", "aliases": ["Palette cycling", "Palette rotation", "Palette animation"], "type": "S", "zh": {"name": "色盤循環（色彩循環動畫）", "observe": "畫面本身一個像素都沒有移動，只是某一段色號的顏色每隔一段時間向前輪轉一格，於是瀑布在流、河水在閃、火把在跳、傳送門在轉。所有用同一段色號的像素同步動起來。", "notThis": "不是換色盤（PIX-06，一次性換整組顏色）；也不是逐格動畫（每格重畫）。色盤循環只改調色盤，成本極低，動感來自顏色排列的方向。", "use": "以很少的美術成本讓大面積的水、熔岩、瀑布、霓虹或魔法陣持續流動；經典的 8／16 色時代技巧。", "prompt": "在遊戲的河流與鎮上魔法陣加入色盤循環：水面以 6 個連續色號（深藍→淺藍→白）繪製，每 0.12 秒把這 6 色向下游方向輪轉一格；魔法陣用另一組 4 色以 0.08 秒循環。其他顏色不受影響。"}, "en": {"name": "Color cycling (palette cycling)", "observe": "Not a single pixel moves — a range of palette indices just rotates its colours by one step every so often, and suddenly the waterfall flows, the river glints, the torch flickers and the portal spins. Every pixel using that index range animates in sync.", "notThis": "Not a palette swap (PIX-06, a one-off swap of the whole set) and not frame-by-frame animation (redrawing each frame). Only the palette changes, so it is extremely cheap; the sense of motion comes from how the indices are laid out.", "use": "Keeps large areas of water, lava, waterfalls, neon or magic circles moving for almost no art cost; a classic 8/16-colour-era technique.", "prompt": "Add colour cycling to the game's river and the town magic circle: draw the water with 6 consecutive palette indices (deep blue → light blue → white) and rotate those 6 colours one step downstream every 0.12 s; the magic circle uses a separate 4-colour range cycling every 0.08 s. No other colours are affected."}, "ja": {"name": "カラーサイクリング（パレットアニメーション）", "observe": "ドットは一つも動かず、特定範囲の色番号の色を一定間隔で一つずつ回すだけで、滝が流れ、川がきらめき、松明が揺れ、ポータルが回る。同じ番号範囲を使うドットがすべて同期して動く。", "notThis": "パレットスワップ（PIX-06、一度に色を総入れ替え）やコマ送りアニメ（毎フレーム描き直す）とは違う。パレットだけを変えるので非常に軽く、動きの方向は色番号の並べ方で決まる。", "use": "少ない素材で広い水面・溶岩・滝・ネオン・魔法陣を動かし続ける。8／16 色時代の古典的手法。", "prompt": "ゲームの川と町の魔法陣にカラーサイクリングを入れて。水面は連続した 6 つの色番号（濃い青→水色→白）で描き、0.12 秒ごとに下流方向へ 1 つ回す。魔法陣は別の 4 色範囲を 0.08 秒ごとに回す。他の色には影響させない。"}, "params": "cycle range (start index, length) · step interval · direction · ping-pong vs loop · several independent ranges", "impl": "Keep palette indices in the sprite/tile textures (see PIX-06). Each frame update a small dynamic palette texture (rewritten each frame) or pass a per-range offset in a constant buffer: if idx in [s, s+n) then idx = s + (idx − s + offset) % n before the palette lookup.", "related": ["PIX-06", "PIX-10", "ENV-12"], "refs": [{"t": "Wikipedia — Color cycling", "u": "https://en.wikipedia.org/wiki/Color_cycling"}, {"t": "the-pixel.art — Color cycling article", "u": "https://the-pixel.art/articles/color-cycling/"}, {"t": "EffectGames — Mark Ferrari color-cycling Q&A", "u": "https://www.effectgames.com/effect/article-Q_A_with_Mark_J_Ferrari.html"}], "nosrc": false}, {"id": "PIX-08", "cat": "PIX", "sub": "色彩", "std": "Dithering", "aliases": ["Ordered dithering", "Bayer dithering", "Checkerboard dither", "Dither pattern"], "type": "S", "zh": {"name": "抖色網點（有序抖色）", "observe": "顏色不夠時，用兩種顏色按規則棋盤或 Bayer 矩陣交錯排列，遠看就像中間色；漸變的天空、陰影邊緣、透明感都可以用網點做出來，而不是增加新顏色。沒有抖色時，漸變會變成一條條明顯的色帶（banding）。", "notThis": "不是抖色轉場（TRN-09，用網點閾值逐步切換兩個畫面）；也不是雜訊顆粒（隨機、會閃爍）。有序抖色的圖案固定、對齊像素格，靜止時不會閃。", "use": "限制色盤下做出漸層與半透明；也可用作像素風的「透明」：每隔一像素畫一點，模擬 50% 透明而不需要混色。", "prompt": "在遊戲的夜晚光暈與雲影使用有序抖色：光暈範圍內以 4×4 Bayer 矩陣在「暗色」和「燈光色」之間選擇，不做 alpha 混合；網點圖案固定在世界座標（隨鏡頭移動），不要隨螢幕座標滑動。"}, "en": {"name": "Dithering (ordered dithering)", "observe": "When there are not enough colours, two colours are interleaved in a checkerboard or Bayer-matrix pattern so that from a distance they read as an in-between tone; gradient skies, soft shadow edges and translucency are built from patterns instead of new colours. Without dithering a gradient breaks into visible bands.", "notThis": "Not a dither transition (TRN-09, using pattern thresholds to switch between two images over time) and not noise grain (random and flickering). Ordered dithering uses a fixed pattern aligned to the pixel grid, so it does not shimmer when still.", "use": "Gradients and translucency inside a limited palette; also pixel-style \"transparency\": drawing every other pixel to fake 50% opacity without blending.", "prompt": "Use ordered dithering for the game's night light halos and cloud shadows: inside a halo choose between the dark colour and the lamp colour with a 4×4 Bayer matrix instead of alpha blending. Anchor the pattern to world coordinates (it scrolls with the camera) — it must not slide in screen space."}, "ja": {"name": "ディザリング（組織的ディザ）", "observe": "色数が足りない時、2 色を市松模様や Bayer 行列で交互に並べ、遠目には中間色に見せる。グラデーションの空、影の境界、半透明感を新しい色を増やさず網点で作る。ディザがないとグラデーションが帯状（バンディング）になる。", "notThis": "ディザトランジション（TRN-09、網点の閾値で 2 画面を切り替える）やランダムなノイズ粒子（ちらつく）とは違う。組織的ディザは固定パターンでドット格子に揃い、静止時にちらつかない。", "use": "限られたパレットでグラデーションや半透明を出す。1 ドットおきに描いて 50% 透明を合成なしで表現する「ドット絵の透明」にも使う。", "prompt": "ゲームの夜の灯りのにじみと雲の影に組織的ディザを使って。にじみの範囲内では 4×4 Bayer 行列で「暗い色」と「灯りの色」を選び、アルファブレンドはしない。パターンはワールド座標に固定（カメラと一緒に動く）し、スクリーン座標で滑らないように。"}, "params": "matrix (2×2 checker, 4×4 / 8×8 Bayer, hand-made patterns) · anchored to world vs screen · number of levels · avoid on tiny moving sprites", "impl": "Pixel shader: float th = (BAYER4[(px.y&3)*4 + (px.x&3)] + 0.5) / 16; col = (value > th) ? colA : colB; where px is the base-res pixel coordinate (+ floor(cam) for world anchoring). Put the 16 thresholds in a constant buffer or a 4×4 R8 texture with wrap + point sampler.", "related": ["TRN-09", "PIX-10", "PIX-22"], "refs": [{"t": "Wikipedia — Dither", "u": "https://en.wikipedia.org/wiki/Dither"}, {"t": "Wikipedia — Ordered dithering", "u": "https://en.wikipedia.org/wiki/Ordered_dithering"}, {"t": "Lucas Pope — Obra Dinn devlog (dithering, TIGSource post)", "u": "https://dukope.com/devlogs/obra-dinn/tig-32/"}, {"t": "Lospec — Dithering tutorials (tag)", "u": "https://lospec.com/pixel-art-tutorials/tags/dithering"}], "nosrc": false}, {"id": "PIX-09", "cat": "PIX", "sub": "色彩", "std": "Hue shifting", "aliases": ["Hue-shifted ramps", "Colour ramp hue shift", "Warm highlights / cool shadows"], "type": "C", "zh": {"name": "色相偏移（色階的冷暖偏移）", "observe": "一條由暗到亮的顏色階梯（color ramp），不只是同一色相變暗變亮：暗部向藍／紫偏，亮部向黃／暖色偏。結果陰影顯得通透、亮部有光感；只用加黑加白的階梯則會顯得灰濁、像蒙了一層泥。", "notThis": "不是換色盤（PIX-06，同圖換一整組顏色）；也不是後處理的色調映射。色相偏移是美術在設計調色盤時決定的，每一級顏色都是挑出來的。", "use": "令有限的顏色看起來更豐富、更有光照感；整個遊戲共用的色階能令畫面風格統一。", "prompt": "為遊戲重新設計角色與植被的色階：每條 5 級色階由暗到亮，暗端色相向藍紫偏移約 −20°、飽和度略降，亮端向黃偏移約 +15°、明度提高；不要用純黑加深或純白提亮。敵人綠、草地綠、屋頂紅各一條。"}, "en": {"name": "Hue shifting (hue-shifted colour ramps)", "observe": "A dark-to-light colour ramp does not just darken and lighten one hue: shadows lean toward blue/purple and highlights toward yellow/warm. Shadows look clear and highlights feel lit; a ramp made by only mixing black and white looks grey and muddy.", "notThis": "Not a palette swap (PIX-06, swapping a whole set on the same sprite) and not a post-process colour grade. Hue shifting is decided by the artist when designing the palette — every step is chosen.", "use": "Makes a limited palette feel richer and more lit; a shared set of ramps unifies the whole game's look.", "prompt": "Redesign the game's character and foliage ramps with hue shifting: each 5-step ramp goes dark to light; the dark end shifts hue about −20° toward blue-purple with slightly lower saturation, the light end shifts about +15° toward yellow with higher value. Never darken with pure black or lighten with pure white. Make one ramp each for enemy green, grass green and roof red."}, "ja": {"name": "色相シフト（ランプの色相をずらす）", "observe": "暗→明の色の階段（カラーランプ）を、同じ色相の明暗だけで作らず、暗部は青・紫寄り、明部は黄・暖色寄りにずらす。影が澄み、明部に光を感じる。黒と白を混ぜただけのランプは灰色っぽく濁る。", "notThis": "パレットスワップ（PIX-06、同じ絵の色を総入れ替え）やポストプロセスのカラーグレーディングとは違う。色相シフトはパレット設計時にアーティストが決めるもので、各段の色は選んで決める。", "use": "少ない色数でも豊かで光を感じる画面にする。ゲーム全体で共通のランプを使うと統一感が出る。", "prompt": "ゲームのキャラと植生のカラーランプを色相シフトで作り直して。各ランプは暗→明の 5 段。暗い端は色相を約 −20° 青紫側へずらし彩度を少し下げ、明るい端は約 +15° 黄色側へずらし明度を上げる。純黒で暗く、純白で明るくはしない。敵の緑、草の緑、屋根の赤でそれぞれ 1 本。"}, "params": "ramp length (4–6) · hue shift per step (5–20°) · saturation curve (peak in mid-tones) · shared ramps across assets", "impl": "Art-side technique; engine side only needs indexed palettes (PIX-06) or authoring tools. Optionally provide a debug view that renders every sprite in greyscale (luma) to check value steps independently of hue.", "related": ["PIX-06", "PIX-10", "PIX-12"], "refs": [{"t": "Slynyrd — Pixelblog 1: Color palettes (hue shifting)", "u": "https://www.slynyrd.com/blog/2018/1/10/pixelblog-1-color-palettes"}, {"t": "Lospec — Hue-shifting tutorials (tag)", "u": "https://lospec.com/pixel-art-tutorials/tags/hueshifting"}, {"t": "Lospec — Pixel art tutorials", "u": "https://lospec.com/pixel-art-tutorials"}], "nosrc": false}, {"id": "PIX-10", "cat": "PIX", "sub": "色彩", "std": "Limited palette", "aliases": ["Indexed color", "Restricted palette", "Fixed palette", "Colour budget"], "type": "S", "zh": {"name": "限制色盤", "observe": "整個遊戲（或每個場景、每個精靈）只使用一組固定數量的顏色，例如 4、8、16 或 32 色。所有素材都從同一組顏色挑選，畫面因此統一，對比和可讀性由少量顏色決定。", "notThis": "不是抖色（PIX-08，限制色盤下製造中間色的手法）；也不是後處理把畫面量化（那會產生意外顏色和雜訊）。限制色盤是設計約束，美術一開始就照它畫。", "use": "保持像素風統一；方便換色盤、色盤循環、昼夜改色；也令角色與背景的對比可控。", "prompt": "為遊戲定一套 32 色的主色盤：背景與地面只用其中低飽和度的 16 色，角色與可互動物件使用高飽和度的另外 12 色，UI 用剩下 4 色。所有新素材匯入時檢查是否只使用這 32 色，超出就報錯。"}, "en": {"name": "Limited palette", "observe": "The whole game (or each scene or sprite) uses one fixed set of colours — 4, 8, 16 or 32. Every asset picks from the same set, so the image is unified and contrast and readability are controlled by a handful of colours.", "notThis": "Not dithering (PIX-08, a way to make in-between tones inside a limited palette) and not a post-process that quantises the frame (that produces stray colours and noise). A limited palette is a design constraint the art is drawn to from the start.", "use": "Keeps a pixel style coherent; makes palette swaps, colour cycling and day/night recolouring easy; keeps character-versus-background contrast under control.", "prompt": "Define a 32-colour master palette for the game: backgrounds and ground use only its 16 low-saturation colours, characters and interactive objects use another 12 high-saturation colours, and UI uses the last 4. When importing a new asset, check it only uses these 32 colours and fail the import otherwise."}, "ja": {"name": "限定パレット（インデックスカラー）", "observe": "ゲーム全体（またはシーンやスプライトごと）で固定数の色だけを使う（4・8・16・32 色など）。すべての素材を同じ色の組から選ぶので画面が統一され、コントラストと読みやすさが少数の色で決まる。", "notThis": "ディザリング（PIX-08、限定パレットの中で中間色を作る手法）や画面を後処理で減色すること（予期しない色やノイズが出る）とは違う。限定パレットは最初からその色で描く設計上の制約。", "use": "ドット絵のスタイルを統一し、パレットスワップ・カラーサイクリング・昼夜の色替えを容易にし、キャラと背景のコントラストを管理する。", "prompt": "ゲームに 32 色のマスターパレットを決めて。背景と地面は低彩度の 16 色だけ、キャラとインタラクト可能な物は高彩度の別の 12 色、UI は残り 4 色。新しい素材をインポートする時、この 32 色以外を使っていたらエラーにする。"}, "params": "palette size · split per role (background / actors / UI / FX) · per-scene sub-palettes · import validation", "impl": "Validate at asset build time (hash each texel colour against the palette set). If sprites are converted to indices (R8), the same palette texture drives PIX-06/PIX-07 and day/night palette rows. Avoid runtime quantisation post-processes except as a deliberate filter.", "related": ["PIX-06", "PIX-07", "PIX-08", "PIX-09"], "refs": [{"t": "Wikipedia — Indexed color", "u": "https://en.wikipedia.org/wiki/Indexed_color"}, {"t": "Lospec — Palette list", "u": "https://lospec.com/palette-list"}, {"t": "Wikipedia — Posterization (banding)", "u": "https://en.wikipedia.org/wiki/Posterization"}], "nosrc": false}, {"id": "PIX-11", "cat": "PIX", "sub": "線條與形體", "std": "Manual anti-aliasing", "aliases": ["Pixel-art AA", "Hand-placed anti-aliasing", "Jaggies smoothing"], "type": "C", "zh": {"name": "手動抗鋸齒", "observe": "美術在曲線或斜線的「階梯轉角」位置手動放一兩個介乎線色與背景色之間的中間色像素，令放大後的線條看起來更圓滑，但每個像素仍是清楚的單一顏色。只在內部輪廓使用，外輪廓通常保持乾淨。", "notThis": "不是渲染器的 MSAA／FXAA（自動、會產生大量新顏色並令像素模糊）；也不是像素放大濾鏡（PIX-04）。手動 AA 是逐點設計，用量很少；用太多會令精靈發矇（「pillow shading」般的糊）。", "use": "令大型精靈、標誌、UI 圖示的曲線更順；小於 16 像素的精靈通常少用甚至不用。", "prompt": "為遊戲的 Boss 精靈與標題標誌做手動抗鋸齒：只在曲線長階梯的轉角處加 1–2 個中間色像素（從同一條色階中選），外輪廓與背景交界不加 AA，以免在不同背景上出現光邊。遊戲中不開啟 MSAA／FXAA。"}, "en": {"name": "Manual anti-aliasing (pixel-art AA)", "observe": "At the \"stair-step\" corners of curves and diagonals the artist hand-places one or two pixels in a colour between the line and the background, so the enlarged line reads smoother while every pixel is still one clean colour. It is used mostly on interior contours; the outer silhouette usually stays clean.", "notThis": "Not renderer MSAA/FXAA (automatic, invents many colours and blurs the pixels) nor an upscaling filter (PIX-04). Manual AA is designed pixel by pixel and used sparingly; overdone it makes a sprite look soft.", "use": "Smoother curves on large sprites, logos and UI icons; sprites under ~16 px often use little or none.", "prompt": "Apply manual anti-aliasing to the game's boss sprite and title logo: add 1–2 in-between pixels (chosen from the same colour ramp) only at the corners of long stair-steps in curves; do not anti-alias the outer silhouette against the background so no halo appears on different backgrounds. Keep MSAA/FXAA off in game."}, "ja": {"name": "手打ちアンチエイリアス（ドット絵の AA）", "observe": "曲線や斜線の「階段の角」に、線の色と背景色の中間色のドットを 1〜2 個手で置き、拡大しても線を滑らかに見せる。各ドットは単色のまま。主に内側の輪郭に使い、外側の輪郭は通常すっきり保つ。", "notThis": "レンダラーの MSAA／FXAA（自動で、大量の新しい色を作りドットをぼかす）やドット絵拡大フィルタ（PIX-04）とは違う。1 ドットずつ設計して控えめに使う。やりすぎるとスプライトがぼやける。", "use": "大きなスプライト、ロゴ、UI アイコンの曲線を滑らかにする。16 ドット未満の小さなスプライトではほとんど使わない。", "prompt": "ゲームのボススプライトとタイトルロゴに手打ち AA を入れて。曲線の長い段差の角にだけ中間色ドットを 1〜2 個（同じカラーランプから選ぶ）。背景との外側の境界には AA を入れず、どの背景でも縁が光らないように。ゲーム中は MSAA／FXAA をオフ。"}, "params": "AA pixels per step (1–2) · which ramp colour (25% / 50% / 75%) · interior only vs outer edge · minimum sprite size", "impl": "Art-side technique. Engine side: keep MSAA off for the sprite RT (SampleDesc.Count = 1) and no FXAA/TAA on the pixel layer, otherwise hand-placed AA is destroyed. If 3D or vector UI is mixed in, render it at native resolution in a separate layer.", "related": ["PIX-04", "PIX-12", "PIX-05"], "refs": [{"t": "Lospec — Pixel-art anti-aliasing tutorials (tag)", "u": "https://lospec.com/pixel-art-tutorials/tags/antialiasing"}, {"t": "Pedro Medeiros (saint11) — Pixel art tutorials", "u": "https://saint11.org/blog/pixel-art-tutorials/"}, {"t": "Wikipedia — S
