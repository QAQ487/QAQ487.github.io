 s; when the hero picks one up, burst 6 yellow stars and a ring expanding to 10 px over 0.2 s, shrink the coin as it flies to the gold counter in the top-left, and bump the counter to 130% then back."}, "ja": {"name": "取得キラリ（ピックアップエフェクト）", "observe": "地面に落ちている取得可能なアイテムが、時々キラッと光る（四芒星がまたたく、または光が斜めに走る）。拾うと星と光の輪が弾け、アイテムが UI へ飛び、数字が跳ねる。", "notThis": "アイテム吸い寄せ（FB-14、アイテムがプレイヤーへ飛ぶ動き）とは違い、キラリは「拾える」という合図と拾った瞬間の手応え。バフのオーラ（VFX-14、キャラを常に包む）でもない。", "use": "散らかった地面の上でもコイン・宝物・資源を目立たせ、拾った時に即座の満足感を与える。", "prompt": "ゲームで、地面のコインに 1.2 秒ごと 5px の四芒星のキラリ（0.15 秒）をコインの右上に出して。主人公が拾ったら黄色い星 6 個と 0.2 秒で 10px に広がる光の輪を出し、コインは縮みながら左上の所持金表示へ飛び、表示は 130% に膨らんで戻る。"}, "params": "glint interval & duration · glint shape (star / sweep) · burst count · ring size · fly-to-UI time · counter bump scale", "impl": "Glint: small additive star sprite spawned on a timer with per-item random phase so coins do not blink in sync; or a sweep via a diagonal band in the sprite PS (frac(time) moving along uv.x+uv.y). Pickup: burst emitter + ring sprite; fly-to-UI by converting UI position to world (or render the flying coin in the UI pass).", "related": ["FB-14", "VFX-14", "FB-02"], "refs": [{"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}, {"t": "Design Atlas — Juice", "u": "https://design.solhun.com/en/game-ui/juice/"}], "nosrc": true}, {"id": "VFX-17", "cat": "VFX", "sub": "狀態與增益", "std": "Healing effect", "aliases": ["Heal VFX", "Regen effect", "Restore effect"], "type": "D", "zh": {"name": "治療效果", "observe": "角色回血時，身上短暫泛起綠色（或金色）柔光，十字或光點由下向上飄起並消失，腳下可能有一圈柔和光環；頭上跳出綠色「+數字」。", "notThis": "不是增益氣場（VFX-14，只要狀態存在就持續）；治療效果是一次性或按跳數播放。也不是拾取閃光（VFX-16）。注意「Healing effect」只是描述性名稱，各遊戲叫法不一。", "use": "讓玩家清楚看到誰被治療、治療了多少；在塔防中讓「治療塔有效」一眼看得見。", "prompt": "在遊戲中，居民被治療塔治療時：身體綠色染色 30% 並在 0.3 秒內淡出；5 個綠色「+」像素圖案在身邊隨機位置出現，0.8 秒內上升 12px 並淡出；腳下出現一個壓扁的淺綠光環向外擴散；同時顯示綠色「+數字」。持續回復時每 1 秒重播一次較小版本。"}, "en": {"name": "Healing effect", "observe": "When a character regains health, a soft green (or gold) glow washes over it briefly, crosses or motes float upward and vanish, a soft ring may appear at the feet, and a green \"+number\" pops above the head.", "notThis": "Not a buff aura (VFX-14, lasting as long as the state); healing plays once or per tick. Not a pickup sparkle (VFX-16). Note: \"Healing effect\" is a descriptive label — games call it many things.", "use": "Shows clearly who is being healed and by how much; in tower defence, makes it obvious that the healer tower works.", "prompt": "In your game, when an NPC is healed by the healer tower: tint the body 30% green and fade over 0.3 s; spawn 5 green pixel \"+\" glyphs at random spots around them that rise 12 px and fade over 0.8 s; a squashed pale-green ring spreads out at the feet; show a green \"+number\". For heal-over-time, replay a smaller version every 1 s."}, "ja": {"name": "回復エフェクト", "observe": "キャラの体力が回復すると、体に緑（または金）の柔らかい光が一瞬広がり、十字や光の粒が下から上へ漂って消え、足元に柔らかな光の輪が出ることもある。頭上に緑の「+数値」が出る。", "notThis": "バフのオーラ（VFX-14、状態が続く間ずっと出る）とは違い、回復は一度きり、または回復ごとに再生。取得キラリ（VFX-16）でもない。※「Healing effect」は説明的な名称で、ゲームごとに呼び方はまちまち。", "use": "誰がどれだけ回復したかをはっきり見せる。タワーディフェンスでは回復塔が効いていることが一目で分かる。", "prompt": "ゲームで、回復塔が町の人を回復した時：体を 30% 緑に染めて 0.3 秒でフェード、周りのランダムな位置に緑のドットの「+」を 5 個出し、0.8 秒で 12px 上昇してフェード、足元に潰した薄緑の輪が外へ広がる。同時に緑の「+数値」を表示。継続回復は 1 秒ごとに小さい版を再生して。"}, "params": "tint strength & fade · glyph count/shape · rise distance & time · ring size · tick replay interval · colour (green / gold / blue for mana)", "impl": "Reuse the per-sprite tint uniform (same path as FB-05) for the glow; \"+\" glyphs are particles drawn from a tiny atlas frame; ring = flat additive sprite scaled over time. Fire from the gameplay heal event, throttled so many small ticks merge into one visual.", "related": ["VFX-14", "FB-05", "FB-02", "VFX-16"], "refs": [{"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}, {"t": "Wikipedia — Health (game terminology)", "u": "https://en.wikipedia.org/wiki/Health_(game_terminology)"}], "nosrc": true}, {"id": "VFX-18", "cat": "VFX", "sub": "破壞", "std": "Debris", "aliases": ["Gibs", "Chunks", "Rubble", "Splinters"], "type": "S", "zh": {"name": "碎片／殘骸", "observe": "物件被打壞時噴出多塊碎片（木片、石塊、像素塊），一邊旋轉一邊拋物線飛出，落地會彈一兩下、滑動停下，之後留在地上或慢慢消失；碎片有影子顯示高度。", "notThis": "不是碎裂（VFX-19，把物件本身按幾何切成碎塊）；碎片通常是另外生成的小塊。也不是爆炸火花（VFX-09 的一層，發光、很快消失）。", "use": "木欄、箱子、城牆、石頭被打壞；給破壞一種實在的重量，配合殘留物（FB-12）讓戰場留下痕跡。", "prompt": "在遊戲中，敵人打壞木欄時：噴出 8 塊 2×1 到 3×2 像素的木片，初速 40–80px/s、向上拋起高度 10–20px，每塊以隨機速度旋轉（按 90° 一格旋轉，保持像素感）；落地彈 1 次（反彈係數 0.4），之後在地上停留 4 秒再閃爍消失。碎片需要畫小影子表示高度。"}, "en": {"name": "Debris", "observe": "When something breaks it throws out several pieces (wood splinters, stones, pixel chunks) that spin along ballistic arcs, bounce once or twice on landing, slide to a stop, then stay on the ground or fade; shadows show their height.", "notThis": "Not a shatter (VFX-19, cutting the object itself into geometric pieces); debris is usually separate small pieces spawned for the effect. Not explosion sparks (a layer of VFX-09, glowing and short-lived).", "use": "Breaking fences, crates, walls and rocks; gives destruction tangible weight and, with permanence (FB-12), leaves marks on the battlefield.", "prompt": "In your game, when enemies break a wooden fence: throw 8 wood chips of 2×1 to 3×2 px at 40–80 px/s, launched 10–20 px high, each spinning at a random rate (snapped to 90° steps to keep it pixel-art); bounce once on landing (restitution 0.4), then lie on the ground for 4 s before blinking out. Draw small shadows so height reads."}, "ja": {"name": "破片・瓦礫（デブリ）", "observe": "物が壊れると複数の破片（木片・石・ドットの塊）が飛び出し、回転しながら放物線を描き、着地して 1〜2 回跳ね、滑って止まり、地面に残るか徐々に消える。影で高さが分かる。", "notThis": "破砕（VFX-19、物体そのものを幾何学的に分割する）とは違い、デブリは演出用に別に生成した小片であることが多い。爆発の火花（VFX-09 の一層、光ってすぐ消える）でもない。", "use": "柵・木箱・城壁・岩の破壊。破壊に確かな重さを与え、残留物（FB-12）と組み合わせて戦場に痕跡を残す。", "prompt": "ゲームで敵が木の柵を壊した時：2×1〜3×2px の木片を 8 個、初速 40〜80px/s、10〜20px の高さへ打ち上げ、それぞれランダムな速度で回転（ドット感を保つため 90° 刻み）。着地で 1 回跳ね（反発係数 0.4）、地面に 4 秒残ってから点滅して消える。高さが分かるよう小さな影を描くこと。"}, "params": "piece count & size · launch speed & height · spin · gravity · restitution & friction · ground lifetime · shadow", "impl": "CPU particles with a separate height (z) channel for top-down: screen y = ground y − z, shadow drawn at ground y. Integrate z with gravity, bounce when z < 0. Draw pieces as atlas sub-rects; rotate in 90° steps for pixel art. Cap the count and recycle oldest pieces first.", "related": ["VFX-19", "FB-12", "FB-04", "VFX-09"], "refs": [{"t": "Wikipedia — Gibs", "u": "https://en.wikipedia.org/wiki/Gibs"}, {"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}, {"t": "Unity Manual — Particle System", "u": "https://docs.unity3d.com/Manual/class-ParticleSystem.html"}], "nosrc": false}, {"id": "VFX-19", "cat": "VFX", "sub": "破壞", "std": "Shatter", "aliases": ["Fracture", "Voronoi fracture", "Glass break", "Destruction"], "type": "S", "zh": {"name": "碎裂／破碎", "observe": "一件物件（冰塊、水晶、玻璃、石像）被打中時，先出現裂紋，然後沿裂紋分成多塊不規則多邊形碎塊，各自帶着原本圖案飛散、旋轉、下墜並淡出。", "notThis": "不是碎片（VFX-18，另外噴出的小塊）；碎裂是物件「本身」被切開。也不是碎玻璃轉場（TRN-12，碎的是整個畫面）。", "use": "冰凍敵人被擊碎、水晶護盾破裂、雕像或寶箱被打破；給「完全破壞」一個戲劇化的瞬間。", "prompt": "在引擎中實作物件碎裂：預先用 Voronoi 把冰塊網格切成 12–20 塊（離線或載入時生成），命中後 0.1 秒先顯示裂紋貼圖，然後每塊以由命中點向外的速度、加上隨機旋轉飛散，受重力，1 秒內縮小淡出。應用例：被冰凍的敵人碎成 8 塊淡藍色像素碎片。"}, "en": {"name": "Shatter", "observe": "When an object (ice block, crystal, glass, statue) is hit, cracks appear first, then it splits along them into irregular polygon shards that each carry their part of the original image as they scatter, spin, fall and fade.", "notThis": "Not debris (VFX-18, extra small pieces thrown out); with a shatter the object itself is cut apart. Not the glass-break transition (TRN-12, where the whole screen breaks).", "use": "Smashing frozen enemies, breaking crystal shields, statues or chests — a dramatic moment of total destruction.", "prompt": "Implement object shatter in your engine: pre-fracture the ice-block mesh into 12–20 Voronoi cells (offline or at load), show a crack texture for 0.1 s after the hit, then fling each piece outward from the hit point with random spin under gravity, shrinking and fading within 1 s. Example: a frozen enemy shatters into 8 pale-blue pixel shards."}, "ja": {"name": "破砕（シャッター）", "observe": "物体（氷塊・水晶・ガラス・石像）が打たれると、まずひびが入り、そのひびに沿って不規則な多角形の破片に割れ、それぞれが元の絵柄を持ったまま飛び散り、回転し、落下してフェードする。", "notThis": "デブリ（VFX-18、別に飛ばす小片）とは違い、破砕は物体「そのもの」が切り分けられる。ガラス割れの画面転換（TRN-12、割れるのは画面全体）でもない。", "use": "凍った敵を砕く、水晶のシールドが割れる、像や宝箱を壊す。「完全に壊れた」というドラマチックな瞬間に。", "prompt": "エンジンで物体の破砕を実装して。氷塊メッシュを Voronoi で 12〜20 個に事前分割（オフラインまたはロード時）、命中後 0.1 秒ひびのテクスチャを見せてから、各破片を命中点から外向きの速度とランダムな回転で飛ばし、重力付きで 1 秒以内に縮んでフェード。応用例：凍った敵が薄い青のドット破片 8 個に砕ける。"}, "params": "piece count · crack preview time · impulse from hit point · spin · gravity · fade/shrink time · interior colour", "impl": "Pre-fracture with Voronoi cells (clip the mesh/quad by bisector half-planes per seed); each shard keeps original UVs. At runtime replace the intact object with shard instances; per-instance transform (pos, rot, scale, alpha) in a structured or instance buffer updated on the CPU. In 2D, shards are polygons with the sprite texture mapped by original position.", "related": ["VFX-18", "TRN-12", "VFX-04", "FB-04"], "refs": [{"t": "Wikipedia — Voronoi diagram", "u": "https://en.wikipedia.org/wiki/Voronoi_diagram"}, {"t": "The Book of Shaders — Cellular noise", "u": "https://thebookofshaders.com/12/"}, {"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}], "nosrc": false}, {"id": "UI-01", "cat": "UI", "sub": "UI 動態", "std": "Tweening / Easing curves", "aliases": ["Easing", "Ease in / ease out", "Interpolation curve", "Tween"], "type": "S", "zh": {"name": "補間與緩動曲線", "observe": "介面元素從 A 移到 B（位置、大小、透明度）時，速度不是等速：開始慢、結束慢，或是衝過頭再彈回。看移動軌跡上的「間距」就分得出來：等速時間距平均，ease-out 時一開始間距大、到終點越來越密。", "notThis": "不是錯誤搖晃（UI-04，原地來回衰減振動）；緩動是「從一處到另一處」時的速度曲線，是所有 UI 動態的底層。也不是精靈動畫的逐格動作。", "use": "面板滑入、按鈕彈起、數字滾動、鏡頭移動等一切插值；讓介面感覺有重量、有回應，而不是生硬地瞬移或機械地等速移動。", "prompt": "在遊戲中統一介面動態的緩動：進場一律 ease-out cubic，0.25 秒；退場 ease-in cubic，0.18 秒；需要「彈出感」的按鈕與獎勵用 ease-out back（overshoot 1.7）；禁止 UI 用 linear 移動（進度條除外）。把這些曲線做成共用函式，所有 tween 只傳入「起點、終點、時長、曲線名稱」。"}, "en": {"name": "Tweening / Easing curves", "observe": "When a UI element goes from A to B (position, scale, opacity) it does not move at constant speed: it starts slow, ends slow, or overshoots and settles back. Look at the spacing along the path: linear spacing is even, ease-out has wide gaps at first and bunches up near the end.", "notThis": "Not an error shake (UI-04, an in-place decaying oscillation); easing is the speed profile of going from one place to another and underlies all UI motion. Not frame-by-frame sprite animation.", "use": "Every interpolation: sliding panels, bouncy buttons, number rolls, camera moves. Makes the interface feel weighty and responsive instead of teleporting or moving mechanically.", "prompt": "Standardise UI easing in your game: all entrances use ease-out cubic over 0.25 s; exits use ease-in cubic over 0.18 s; buttons and rewards that should feel springy use ease-out back (overshoot 1.7); never move UI linearly (progress bars excepted). Put the curves in one shared helper so every tween only takes start, end, duration and curve name."}, "ja": {"name": "トゥイーンとイージング", "observe": "UI 要素が A から B へ（位置・大きさ・不透明度）変化するとき、速度が一定ではない。ゆっくり始まりゆっくり止まる、または行き過ぎてから戻る。軌跡上の「間隔」を見ると分かる：リニアは等間隔、イーズアウトは最初の間隔が広く終点に向かって詰まる。", "notThis": "エラー時の揺れ（UI-04、その場で減衰しながら往復する動き）ではない。イージングは「ある場所から別の場所へ」の速度の付け方で、あらゆる UI モーションの土台。スプライトのコマ送りアニメとも違う。", "use": "パネルのスライド、ボタンの弾み、数値のロール、カメラ移動などあらゆる補間。UI に重さと手応えを与え、瞬間移動や機械的な等速移動を避ける。", "prompt": "ゲームの UI イージングを統一して：登場はすべて ease-out cubic・0.25 秒、退場は ease-in cubic・0.18 秒。弾む感じが欲しいボタンや報酬は ease-out back（オーバーシュート 1.7）。UI のリニア移動は禁止（プログレスバーを除く）。曲線は共通関数にまとめ、各トゥイーンは「始点・終点・時間・曲線名」だけを渡す形に。"}, "params": "duration · curve family (sine/cubic/quint/back/elastic/bounce) · in / out / in-out · overshoot amount · delay & stagger between items", "impl": "A tween is value = lerp(a, b, ease(clamp((now - start) / duration))). Keep tweens in a small manager updated once per frame with unscaled UI time (so pause/slow-motion does not freeze menus). Use standard Penner-style formulas; ease-out-back: 1 + c3*(x-1)^3 + c1*(x-1)^2 with c1 = 1.70158, c3 = c1 + 1.", "related": ["UI-02", "UI-04", "UI-06", "TRN-08"], "refs": [{"t": "Wikipedia — Inbetweening (tweening)", "u": "https://en.wikipedia.org/wiki/Inbetweening"}, {"t": "easings.net — Easing functions cheat sheet", "u": "https://easings.net/"}, {"t": "MDN — <easing-function> (CSS)", "u": "https://developer.mozilla.org/en-US/docs/Web/CSS/easing-function"}, {"t": "Godot docs — Tween class (transition & ease types)", "u": "https://docs.godotengine.org/en/stable/classes/class_tween.html"}], "nosrc": false}, {"id": "UI-02", "cat": "UI", "sub": "UI 動態", "std": "Number roll / Count-up", "aliases": ["Counting number", "Rolling counter", "Odometer counter", "Score tally"], "type": "C", "zh": {"name": "數字滾動遞增", "observe": "分數、金錢、經驗值增加時，數字不是直接跳到新值，而是在 0.5–1 秒內快速一路數上去（通常先快後慢），到達時輕輕放大一下；也有像里程表一樣每位數字上下捲動的版本。", "notThis": "不是傷害數字（FB-02，在世界中飄出後消失的單次數值）；數字滾動是固定在 HUD 上的「總數」在變化。也不是連擊計數（FB-18，計的是連續命中次數）。", "use": "結算畫面、金錢／分數 HUD、商店購買後的餘額；讓玩家感覺到「增加了多少」，而不只是看到結果。", "prompt": "在遊戲的金錢 HUD 加入數字滾動：每次增加時用 0.6 秒、ease-out cubic 從舊值數到新值（大於 1000 的差額用 1.0 秒）；數字到達時整個數字放大到 115% 再 0.12 秒縮回；滾動期間數字變成金色 #f2c94c，結束後回到白色。若滾動未完又有新收入，從目前顯示值接着數到新總數。"}, "en": {"name": "Number roll / Count-up", "observe": "When score, money or XP rises, the number does not jump to the new value: it rapidly counts up over 0.5–1 s (usually fast then slow) and gives a small scale pop on arrival. There is also an odometer version where each digit scrolls vertically.", "notThis": "Not damage numbers (FB-02, one-off values that float out in the world and vanish); a number roll is a HUD total changing in place. Not a combo counter (FB-18, which counts consecutive hits).", "use": "Results screens, money/score HUDs, the balance after a shop purchase; lets the player feel how much they gained, not just see the result.", "prompt": "Add a number roll to the money HUD in your game: on every increase count from the old to the new value over 0.6 s with ease-out cubic (1.0 s if the difference exceeds 1000); on arrival scale the whole number to 115% and back over 0.12 s; tint it gold #f2c94c while rolling and white afterwards. If more income arrives mid-roll, continue from the currently displayed value to the new total."}, "ja": {"name": "数値のカウントアップ（ロール）", "observe": "スコア・お金・経験値が増えるとき、新しい値へ一気に切り替わらず、0.5〜1 秒で素早く数え上がり（多くは速く始まりゆっくり止まる）、到達時に軽く拡大する。桁ごとに数字が縦に回るオドメーター型もある。", "notThis": "ダメージ数値（FB-02、ワールドに飛び出して消える一回きりの値）ではない。カウントアップは HUD に固定された「合計値」の変化。コンボカウンター（FB-18、連続ヒット数）とも違う。", "use": "リザルト画面、所持金・スコアの HUD、ショップ購入後の残高。結果だけでなく「どれだけ増えたか」を体感させる。", "prompt": "ゲームの所持金 HUD にカウントアップを追加して：増えるたびに旧値から新値まで ease-out cubic で 0.6 秒（差が 1000 を超える場合は 1.0 秒）で数え上げる。到達時に数字全体を 115% に拡大し 0.12 秒で戻す。ロール中は金色 #f2c94c、終わったら白に戻す。ロール中に追加の収入があれば、現在の表示値から新しい合計へ続けて数える。"}, "params": "duration (fixed or scaled by delta) · easing · tick sound rate · arrival pop scale · colour while rolling · odometer vs plain digits", "impl": "Store displayValue separately from the real value; each frame displayValue = lerp(from, to, ease(k)) and print floor(displayValue). For the odometer, draw each digit column from a vertical digit strip with a scissor/clip rect and offset by the fractional part of (value / 10^place). Throttle tick sounds to ≤ 20 per second.", "related": ["UI-01", "FB-02", "FB-18", "UI-06"], "refs": [{"t": "countUp.js — animates a numerical value by counting to it (GitHub)", "u": "https://github.com/inorganik/countUp.js"}, {"t": "HubSpot Odometer — rolling-digit number transitions (GitHub)", "u": "https://github.com/HubSpot/odometer"}, {"t": "Design Atlas — Juice", "u": "https://design.solhun.com/en/game-ui/juice/"}], "nosrc": false}, {"id": "UI-03", "cat": "UI", "sub": "UI 動態", "std": "Button feedback (hover, press, disabled)", "aliases": ["Button states", "Interaction states", "Hover / pressed / disabled", "Press feedback"], "type": "S", "zh": {"name": "按鈕狀態回饋", "observe": "按鈕在不同狀態有明顯不同的外觀：游標或焦點移上去時變亮、浮起或出現外框（hover／focus）；按下時往下沉、變暗、陰影消失（pressed）；放開時輕微彈回；不能用時變灰、低對比，按了也沒有反應（disabled）。", "notThis": "不是焦點高亮框本身的設計（只處理「選中哪一項」）；按鈕回饋是同一顆按鈕在各狀態之間的變化。也不是錯誤搖晃（UI-04，用來表示「操作被拒絕」）。", "use": "任何可點擊或可確認的介面：主選單、商店、對話選項。玩家要能在按下前就知道「這能按」，按下的瞬間知道「按到了」。", "prompt": "在遊戲的所有按鈕實作 4 種狀態：normal；hover／focus 時亮度 +15%、上移 1px、加 1px 白色外框，0.08 秒 ease-out；pressed 時下移 2px、亮度 -15%、取消下方陰影，即時（0 秒）切換；放開時以 ease-out back 0.12 秒回到 hover；disabled 時去飽和、透明度 50%、不響應 hover，按下時只播放一個低沉的「不可用」音效。"}, "en": {"name": "Button feedback (hover, press, disabled)", "observe": "A button looks clearly different in each state: it brightens, lifts or gains an outline when the cursor or focus is on it (hover/focus); it sinks, darkens and loses its shadow when held (pressed); it springs back slightly on release; when unavailable it is grey, low-contrast and does nothing when clicked (disabled).", "notThis": "Not the focus highlight design on its own (which only shows which item is selected); button feedback is one button changing between states. Not an error shake (UI-04, which says \"this action was rejected\").", "use": "Anything clickable or confirmable: main menus, shops, dialogue choices. The player should know \"this can be pressed\" before pressing and \"that registered\" the instant they do.", "prompt": "Implement 4 states for every button in your game: normal; hover/focus = +15% brightness, 1 px up, 1 px white outline, 0.08 s ease-out; pressed = 2 px down, −15% brightness, drop shadow removed, switched instantly (0 s); on release return to hover with ease-out back over 0.12 s; disabled = desaturated, 50% opacity, no hover response, and pressing only plays a dull \"unavailable\" sound."}, "ja": {"name": "ボタンの状態フィードバック", "observe": "ボタンが状態ごとにはっきり違う見た目になる。カーソルやフォーカスが乗ると明るくなる・浮く・枠が出る（ホバー／フォーカス）。押している間は沈んで暗くなり影が消える（プレス）。離すと少し弾んで戻る。使えない時はグレーで低コントラスト、押しても反応しない（無効）。", "notThis": "フォーカスハイライトそのもの（どれが選ばれているかの表示）ではない。ボタンフィードバックは同じボタンの状態間の変化。エラー時の揺れ（UI-04、「操作が拒否された」の表示）とも違う。", "use": "クリック・決定できるあらゆる UI：メインメニュー、ショップ、会話の選択肢。押す前に「押せる」、押した瞬間に「押せた」と分かるようにする。", "prompt": "ゲームのすべてのボタンに 4 状態を実装して：通常。ホバー／フォーカスで明るさ +15%、1px 上へ、1px の白枠、0.08 秒 ease-out。プレスで 2px 下へ、明るさ −15%、下の影を消す（即時切り替え）。離したら ease-out back 0.12 秒でホバー状態へ。無効は彩度を落として不透明度 50%、ホバーに反応せず、押すと鈍い「使えない」音だけ鳴らす。"}, "params": "state colours · hover offset (px) · press depth (px) · transition times per state · release overshoot · disabled opacity · focus outline width", "impl": "Model the button as a tiny state machine (normal/hover/pressed/disabled, plus focused for gamepad). Draw from a 9-slice (UI-14) with a per-state tint and y-offset rather than separate textures where possible. Pressed must show on the press event, not on release, or the UI feels laggy.", "related": ["UI-01", "UI-04", "UI-14", "UI-11"], "refs": [{"t": "Apple Human Interface Guidelines — Buttons", "u": "https://developer.apple.com/design/human-interface-guidelines/buttons"}, {"t": "MDN — :hover pseudo-class", "u": "https://developer.mozilla.org/en-US/docs/Web/CSS/:hover"}, {"t": "MDN — :active pseudo-class", "u": "https://developer.mozilla.org/en-US/docs/Web/CSS/:active"}, {"t": "Godot docs — Button / BaseButton (normal, hover, pressed, disabled styles)", "u": "https://docs.godotengine.org/en/stable/classes/class_button.html"}], "nosrc": false}, {"id": "UI-04", "cat": "UI", "sub": "UI 動態", "std": "Error shake / Invalid-input shake", "aliases": ["Shake on error", "Wrong-password shake", "Head-shake feedback", "Rejection wiggle"], "type": "C", "zh": {"name": "錯誤搖晃", "observe": "輸入或操作不被接受時（密碼錯、金錢不足、背包已滿），那個欄位或按鈕在原地左右快速搖動 3–4 下並逐漸停下，像人搖頭說「不」，同時通常變紅並出現簡短說明。", "notThis": "不是畫面震動（FB-07，整個鏡頭在搖）；錯誤搖晃只搖那個被拒絕的 UI 元件。也不是緩動（UI-01，從 A 移動到 B）。", "use": "密碼／代碼輸入、買不起、槽位已滿、技能冷卻中按下。不用彈出視窗也能即時告訴玩家「不行」。", "prompt": "在遊戲中，玩家嘗試購買金錢不足的物品時，讓價格標籤做錯誤搖晃：水平位移 sin 波，振幅 6px，0.35 秒內衰減到 0，共 3 個來回；同時文字變紅 #e04a3a 0.5 秒，並在下方顯示「金錢不足」；若開啟「減少動態」設定，改為只閃紅框不移動。"}, "en": {"name": "Error shake / Invalid-input shake", "observe": "When an input or action is refused (wrong password, not enough money, inventory full), that field or button quickly shakes left-right 3–4 times in place and settles, like a head shaking \"no\", usually turning red with a short explanation.", "notThis": "Not screen shake (FB-07, the whole camera moves); an error shake moves only the rejected UI element. Not easing (UI-01, moving from A to B).", "use": "Password/code entry, cannot afford, slot full, pressing a skill on cooldown. Says \"no\" immediately without a pop-up.", "prompt": "In your game, when the player tries to buy an item they cannot afford, error-shake the price tag: horizontal sine offset, 6 px amplitude decaying to 0 over 0.35 s, 3 full swings; tint the text red #e04a3a for 0.5 s and show \"Not enough gold\" below. If the reduced-motion option is on, flash a red outline instead of moving."}, "ja": {"name": "エラー時の揺れ（シェイク）", "observe": "入力や操作が受け付けられない時（パスワード違い、所持金不足、持ち物が満杯）、その欄やボタンがその場で左右に 3〜4 回素早く揺れて止まる。首を横に振る「ダメ」のようで、多くは赤くなり短い説明も出る。", "notThis": "画面揺れ（FB-07、カメラ全体が揺れる）ではなく、拒否された UI 要素だけが揺れる。イージング（UI-01、A から B への移動）とも違う。", "use": "パスワード／コード入力、お金が足りない、枠が満杯、クールダウン中のスキル押下。ポップアップなしで即座に「ダメ」と伝える。", "prompt": "ゲームで、所持金が足りないアイテムを買おうとしたら値札をエラーシェイクさせて：水平方向の sin 波、振幅 6px を 0.35 秒で 0 まで減衰、往復 3 回。同時に文字を 0.5 秒赤 #e04a3a にし、下に「お金が足りません」を表示。「動きを減らす」設定がオンなら、移動せず赤枠の点滅だけにする。"}, "params": "amplitude (px) · swing count · duration · decay curve · colour flash · reduced-motion fallback", "impl": "offsetX = A * sin(k * 2π * n) * (1 - k)^2 with k = elapsed / duration, applied as a UI-local translation (never move the camera). Restart cleanly if triggered again mid-shake. Always pair with text or colour so the meaning does not rely on motion alone.", "related": ["FB-07", "UI-01", "UI-03"], "refs": [{"t": "Interface Lineage — Wrong-password shake animation", "u": "https://interfacelineage.com/wrong-password-shake-animation"}, {"t": "Smashing Magazine — How functional animation helps improve user experience", "u": "https://www.smashingmagazine.com/2017/01/how-functional-animation-helps-improve-user-experience/"}], "nosrc": false}, {"id": "UI-05", "cat": "UI", "sub": "UI 動態", "std": "Cooldown sweep / Radial fill", "aliases": ["Cooldown ring", "Radial cooldown", "Clock-wipe cooldown", "Radial fill"], "type": "C", "zh": {"name": "冷卻扇形遮罩", "observe": "技能圖示在使用後被一層半透明暗色覆蓋，這層遮罩像時鐘指針一樣順時針（或逆時針）逐漸掃開，中間常顯示剩餘秒數；冷卻結束時圖示閃白或外圈發光一下，表示「可以再用」。", "notThis": "不是時鐘擦除轉場（TRN-05，用同樣的扇形遮罩切換整個畫面）；冷卻扇形只蓋在單一圖示上，表示時間。也不是一般進度條（橫向填滿）。", "use": "技能欄、道具冷卻、建造／生產倒數、互動時的「長按」進度。圖示大小有限時，扇形比橫條更容易一眼看出還剩多少。", "prompt": "在遊戲的技能欄加入冷卻扇形：使用技能後，在 24×24 的圖示上覆蓋 60% 黑色扇形，從 12 點方向順時針掃開，持續等於冷卻秒數；剩餘超過 1 秒時在中央顯示整數秒，少於 1 秒時顯示一位小數；冷卻結束時圖示閃白 0.1 秒並向外擴散一個 2px 的白色圓環 0.25 秒。"}, "en": {"name": "Cooldown sweep / Radial fill", "observe": "After a skill is used its icon is covered by a translucent dark layer that sweeps away clockwise (or anticlockwise) like a clock hand, often with the remaining seconds in the middle; when the cooldown ends the icon flashes white or its rim glows to say \"ready\".", "notThis": "Not a clock-wipe transition (TRN-05, the same radial mask used to change the whole screen); a cooldown sweep sits on one icon and shows time. Not an ordinary horizontal progress bar.", "use": "Skill bars, item cooldowns, build/production timers, hold-to-interact progress. On small icons a radial sweep reads faster than a bar.", "prompt": "Add cooldown sweeps to your game’s skill bar: after use, cover the 24×24 icon with a 60% black wedge that sweeps open clockwise from 12 o’clock over the cooldown duration; show whole seconds in the centre while more than 1 s remains and one decimal below 1 s; when ready, flash the icon white for 0.1 s and expand a 2 px white ring outward over 0.25 s."}, "ja": {"name": "クールダウンの扇形マスク", "observe": "スキル使用後、アイコンが半透明の暗いマスクで覆われ、時計の針のように時計回り（または反時計回り）に少しずつ開いていく。中央に残り秒数が出ることが多く、終わるとアイコンが白く光るか縁が輝いて「使える」と知らせる。", "notThis": "時計ワイプの画面転換（TRN-05、同じ扇形マスクで画面全体を切り替える）ではない。クールダウンの扇形は 1 つのアイコン上で時間を表す。横に伸びる通常のプログレスバーとも違う。", "use": "スキルバー、アイテムのクールダウン、建設・生産の待ち時間、長押しインタラクションの進捗。小さいアイコンでは横バーより残量が一目で分かる。", "prompt": "ゲームのスキルバーにクールダウンの扇形を追加して：使用後、24×24 のアイコンに 60% の黒い扇形を重ね、12 時方向から時計回りにクールダウン秒数かけて開いていく。残り 1 秒超は中央に整数秒、1 秒未満は小数 1 桁を表示。終わったらアイコンを 0.1 秒白く光らせ、2px の白い輪を 0.25 秒で外へ広げる。"}, "params": "start angle · direction · mask colour & opacity · number format · ready flash & ring · shared vs per-skill timers", "impl": "In the icon pixel shader compute a = atan2(uv - 0.5) remapped to [0,1) from 12 o’clock; darken where a > progress. Or build a triangle-fan wedge mesh on the CPU. Drive progress from game time (pauses with gameplay) and keep the number on a separate text layer.", "related": ["TRN-05", "UI-03", "UI-06"], "refs": [{"t": "Design Atlas — Cooldown ring", "u": "https://design.solhun.com/en/game-ui/cooldown-ring/"}, {"t": "Godot docs — TextureProgressBar (radial / clockwise fill modes)", "u": "https://docs.godotengine.org/en/stable/classes/class_textureprogressbar.html"}, {"t": "Unity UI manual — Image (Filled type, Radial 360 fill method)", "u": "https://docs.unity3d.com/Packages/com.unity.ugui@1.0/manual/script-Image.html"}], "nosrc": false}, {"id": "UI-06", "cat": "UI", "sub": "UI 動態", "std": "Reward pop / Level-up fanfare", "aliases": ["Level-up burst", "Reward popup", "Celebration popup", "Achievement pop"], "type": "D", "zh": {"name": "獎勵彈出／升級演出", "observe": "經驗條填滿或獲得重要獎勵時，畫面中央彈出大字（如「LEVEL UP!」）：先從很小放大到超過原尺寸再回彈，背後有旋轉的放射光芒與爆開的星星粒子，等級數字跟着跳一下，1–2 秒後淡出，經驗條歸零重新開始。", "notThis": "不是 Toast 通知（UI-13，角落的小訊息，不打斷遊戲）；獎勵彈出是刻意搶眼的慶祝。也不是拾取閃光（VFX-16，在世界中的物件上）。", "use": "升級、稀有掉落、成就、關卡完成、抽獎結果。用來標記「重要時刻」，頻率要低才有份量。", "prompt": "在遊戲中，角色升級時播放升級演出：經驗條填滿後停 0.1 秒，「LEVEL UP!」文字以 ease-out back 在 0.3 秒內由 0% 放大到 100%（峰值約 125%），背後 12 道金色放射光以每秒 30° 旋轉，同時爆出 20 顆金色星星粒子；左上的等級數字放大 140% 並加 1；1.5 秒後全部在 0.3 秒內淡出，經驗條從 0 重新開始。"}, "en": {"name": "Reward pop / Level-up fanfare", "observe": "When the XP bar fills or a big reward is earned, large text pops up in the centre (e.g. \"LEVEL UP!\"): it grows from tiny to past full size and springs back, with rotating light rays and bursting star particles behind it; the level number bumps, and after 1–2 s it fades and the XP bar restarts from zero.", "notThis": "Not a toast (UI-13, a small corner message that does not interrupt play); a reward pop is a deliberately loud celebration. Not a pickup sparkle (VFX-16, on an object in the world).", "use": "Level-ups, rare drops, achievements, stage clears, gacha results. Marks important moments, so keep it rare for it to carry weight.", "prompt": "In your game, play a level-up fanfare: when the XP bar fills, hold 0.1 s, then pop \"LEVEL UP!\" from 0% to 100% with ease-out back over 0.3 s (peaking around 125%); behind it 12 gold rays rotate at 30°/s and 20 gold star particles burst out; the level number in the top-left scales to 140% and increments; after 1.5 s fade everything out over 0.3 s and restart the XP bar from 0."}, "ja": {"name": "報酬ポップ／レベルアップ演出", "observe": "経験値バーが満タンになったり大きな報酬を得たりすると、画面中央に大きな文字（「LEVEL UP!」など）が飛び出す。極小から原寸以上に拡大して弾んで戻り、背後で放射状の光が回転し星のパーティクルが弾ける。レベルの数字も跳ね、1〜2 秒後にフェードアウトして経験値バーが 0 から再開する。", "notThis": "トースト通知（UI-13、隅に出る小さなメッセージでプレイを妨げない）ではなく、意図的に目立たせるお祝い演出。取得キラキラ（VFX-16、ワールド内の物に付く）とも違う。", "use": "レベルアップ、レアドロップ、実績、ステージクリア、ガチャ結果。「大事な瞬間」を示すので、頻度を低くして重みを保つ。", "prompt": "ゲームでレベルアップ時に演出を入れて：経験値バーが満タンになったら 0.1 秒止め、「LEVEL UP!」を ease-out back で 0.3 秒かけて 0% から 100% に拡大（ピーク約 125%）。背後で金色の放射光 12 本を毎秒 30° で回転させ、金色の星パーティクルを 20 個弾けさせる。左上のレベル数字は 140% に拡大して +1。1.5 秒後に 0.3 秒ですべてフェードアウトし、経験値バーは 0 から再開。"}, "params": "pop scale curve & peak · hold time · ray count & spin speed · particle count · sound sting sync · whether gameplay pauses", "impl": "Draw on a top UI layer: rays as one additive textured quad rotated over time, text as a scaled quad with ease-out-back, particles via a small deterministic burst. Queue multiple rewards so they play one after another instead of overlapping. Use unscaled time if gameplay is paused.", "related": ["UI-01", "UI-02", "UI-13", "VFX-16"], "refs": [{"t": "Design Atlas — Level-up burst", "u": "https://design.solhun.com/en/game-ui/level-up/"}, {"t": "Jonasson & Purho — Juice it or lose it (talk, YouTube)", "u": "https://www.youtube.com/watch?v=Fy0aCDmgnxg"}, {"t": "Design Atlas — Juice", "u": "https://design.solhun.com/en/game-ui/juice/"}], "nosrc": false}, {"id": "UI-07", "cat": "UI", "sub": "UI 動態", "std": "Background blur on pause", "aliases": ["Pause blur", "Backdrop blur", "Frosted-glass background", "Blurred backdrop"], "type": "C", "zh": {"name": "暫停時背景模糊", "observe": "按下暫停或打開選單時，背後的遊戲畫面在約 0.2 秒內逐漸變模糊並稍微變暗，遊戲世界停住不動，清晰的選單面板浮在上面；關閉時模糊退回、世界繼續。", "notThis": "不是淡出至黑（TRN-01，整個畫面被蓋掉、用於切換場景）；背景模糊仍讓玩家隱約看見遊戲。也不是景深（只模糊遠近某一段的鏡頭效果）；模糊濾鏡本身見 PP-08。", "use": "暫停選單、背包、設定、對話選擇時；把注意力集中在選單上，同時讓玩家記得自己在遊戲的哪裏。", "prompt": "在遊戲中，打開暫停選單時：凍結遊戲時間，把目前畫面以 0.2 秒 ease-out 逐步模糊到約 8px 半徑並疊上 35% 的深藍 #0d1630；暫停面板從下方 12px 滑入並淡入；關閉時 0.15 秒反向播放。模糊只在打開時計算一次快照，不要每格重新渲染整個場景。"}, "en": {"name": "Background blur on pause", "observe": "When the game is paused or a menu opens, the gameplay image behind it blurs and darkens slightly over ~0.2 s, the world freezes, and a sharp menu panel floats on top; closing it un-blurs and the world resumes.", "notThis": "Not a fade to black (TRN-01, the screen is covered, used to change scenes); with a background blur the game is still faintly visible. Not depth of field (a lens effect blurring one depth range); the blur filter itself is PP-08.", "use": "Pause menus, inventory, settings, dialogue choices; focuses attention on the menu while the player still remembers where they are.", "prompt": "In your game, when the pause menu opens: freeze game time, blur a snapshot of the current frame to about an 8 px radius over 0.2 s with ease-out and overlay 35% dark blue #0d1630; slide the pause panel in from 12 px below while fading in; reverse over 0.15 s on close. Compute the blur once from a snapshot instead of re-rendering the scene every frame."}, "ja": {"name": "ポーズ時の背景ぼかし", "observe": "ポーズやメニューを開くと、背後のゲーム画面が約 0.2 秒でぼやけて少し暗くなり、ワールドは止まり、その上にくっきりしたメニューパネルが浮かぶ。閉じるとぼかしが戻り、ワールドが動き出す。", "notThis": "黒へのフェード（TRN-01、画面を覆って場面を切り替える）ではなく、背景ぼかしではゲームがうっすら見えたまま。被写界深度（特定の距離だけをぼかすレンズ効果）とも違う。ぼかしフィルター自体は PP-08。", "use": "ポーズメニュー、持ち物、設定、会話の選択肢。メニューに注意を集めつつ、今ゲームのどこにいるかを忘れさせない。", "prompt": "ゲームでポーズメニューを開いたら：ゲーム時間を止め、現在の画面のスナップショットを 0.2 秒 ease-out で半径約 8px までぼかし、35% の濃紺 #0d1630 を重ねる。ポーズパネルは 12px 下からスライドしつつフェードイン。閉じる時は 0.15 秒で逆再生。ぼかしは開いた時のスナップショットから一度だけ計算し、毎フレームシーン全体を描き直さない。"}, "params": "blur radius · ramp time · dim colour & opacity · desaturation · snapshot vs live · panel entrance", "impl": "Copy the back buffer to a texture when pausing, then run a downsample chain (½, ¼, ⅛) with a small tent/Gaussian or dual-Kawase filter and upsample; lerp between blur levels for the ramp. Draw that texture fullscreen behind the menu. For pixel art, consider blurring at low resolution and upscaling with nearest-neighbour for a chunkier look.", "related": ["TRN-01", "PP-08", "UI-01", "UI-03"], "refs": [{"t": "Wikipedia — Gaussian blur", "u": "https://en.wikipedia.org/wiki/Gaussian_blur"}, {"t": "Marius Bjørge (ARM) — Bandwidth-efficient rendering, SIGGRAPH 2015 notes (dual Kawase blur, PDF)", "u": "https://community.arm.com/cfs-file/__key/communityserver-blogs-components-weblogfiles/00-00-00-20-66/siggraph2015_2D00_mmg_2D00_marius_2D00_notes.pdf"}, {"t": "MDN — backdrop-filter (blur behind a panel)", "u": "https://developer.mozilla.org/en-US/docs/Web/CSS/backdrop-filter"}, {"t": "Apple Human Interface Guidelines — Materials (blurred backgrounds)", "u": "https://developer.apple.com/design/human-interface-guidelines/materials"}], "nosrc": false}, {"id": "UI-08", "cat": "UI", "sub": "HUD 與介面類型", "std": "Minimap", "aliases": ["Mini-map", "Radar", "Overview map"], "type": "S", "zh": {"name": "小地圖", "observe": "畫面角落有一個縮小的地圖，顯示周圍地形、玩家位置（常是會閃爍或有方向的箭嘴）、敵人與目標的圖示，有時還畫出主畫面目前看到的範圍框；玩家移動時，小地圖的點或地圖本身跟着移動。", "notThis": "不是畫面外指示箭嘴（UI-09，只在主畫面邊緣指方向）；小地圖是獨立的縮圖。也不是全螢幕地圖（要另外打開、會遮住遊戲）。", "use": "開放式地圖、塔防／即時戰略、地城探索；讓玩家知道自己在哪、敵人從哪來，不用一直打開大地圖。", "prompt": "在遊戲右上角加入 56×40px 的小地圖：以 1/8 比例畫出整張地圖（地面、道路、建築用簡化色塊），玩家是白色方點並以 1 秒週期閃爍，敵人是紅點，目標是金色星星；用 1px 白框畫出主鏡頭可見範圍。小地圖外框 1px 深色加 50% 透明底，不要遮住重要遊戲區域。"}, "en": {"name": "Minimap", "observe": "A shrunken map in a screen corner shows the surrounding terrain, the player position (often a blinking dot or heading arrow), enemy and objective icons, and sometimes a frame for what the main view currently shows; as the player moves, the dot or the map moves with them.", "notThis": "Not an off-screen indicator (UI-09, an arrow on the main view’s edge); a minimap is a separate thumbnail. Not a fullscreen map (opened separately, covers the game).", "use": "Open maps, tower defence/RTS, dungeon crawling; tells the player where they are and where threats come from without opening the big map.", "prompt": "Add a 56×40 px minimap to the top-right of your game: draw the whole map at 1/8 scale (ground, roads and buildings as simple colour blocks); the player is a white square blinking on a 1 s cycle, enemies are red dots and the objective is a gold star; outline the main camera’s visible area with a 1 px white frame. Give it a 1 px dark border and a 50% transparent backing, and keep it off important play areas."}, "ja": {"name": "ミニマップ", "observe": "画面の隅に縮小した地図があり、周囲の地形、プレイヤー位置（点滅する点や向きの矢印）、敵や目的地のアイコン、ときにはメイン画面が今映している範囲の枠も描かれる。プレイヤーが動くと点か地図そのものが一緒に動く。", "notThis": "画面外インジケーター（UI-09、メイン画面の端で方向を指す矢印）ではなく、独立した縮小図。全画面マップ（別に開き、ゲームを覆う）とも違う。", "use": "オープンなマップ、タワーディフェンス／RTS、ダンジョン探索。大きな地図を開かなくても、現在地と敵の来る方向が分かる。", "prompt": "ゲームの右上に 56×40px のミニマップを追加して：マップ全体を 1/8 縮尺で描く（地面・道・建物は単純な色ブロック）。プレイヤーは白い四角で 1 秒周期で点滅、敵は赤い点、目的地は金色の星。メインカメラの可視範囲を 1px の白枠で示す。1px の暗い縁と 50% 透明の下地を付け、重要なプレイ領域を隠さないこと。"}, "params": "scale · north-up vs player-up rotation · shape (rect/circle) · icon set & priority · viewport frame · fog of war on map", "impl": "Render the map layer once into a small render target (or keep a pre-baked minimap texture), then each frame draw it with a scissor/circular mask and draw icons on top from world→minimap coordinates (pos * scale + offset). For a rotating minimap, rotate around the player in UV space.", "related": ["UI-09", "ENV-15", "PIX-17"], "refs": [{"t": "Wikipedia — Mini-map", "u": "https://en.wikipedia.org/wiki/Mini-map"}, {"t": "Design Atlas — Minimap", "u": "https://design.solhun.com/en/game-ui/minimap/"}, {"t": "Wikipedia — HUD (video games)", "u": "https://en.wikipedia.org/wiki/HUD_(video_games)"}], "nosrc": false}, {"id": "UI-09", "cat": "UI", "sub": "HUD 與介面類型", "std": "Off-screen indicator / Edge arrow", "aliases": ["Off-screen pointer", "Screen-edge marker", "Offscreen target indicator", "Edge arrow"], "type": "C", "zh": {"name": "畫面外指示箭嘴", "observe": "目標（任務點、隊友、敵人）在畫面外時，畫面邊緣出現一個指向它的箭嘴或圖示，沿着邊緣滑動以保持方向正確，常附距離數字；目標進入畫面後，箭嘴消失，改為在目標頭上顯示標記。", "notThis": "不是小地圖（UI-08，獨立的縮圖）；畫面外箭嘴直接貼在主畫面邊緣。也不是受傷方向提示（只在被攻擊時短暫出現）。", "use": "護送、尋找任務目標、多人遊戲中看隊友位置、從畫面外接近的敵人。", "prompt": "在遊戲中為畫面外的任務目標加入邊緣箭嘴：從畫面中心向目標方向畫一條射線，與內縮 10px 的畫面矩形求交點，在交點畫 9px 金色箭嘴並旋轉指向目標，旁邊顯示距離（如「24m」）；目標進入畫面後 0.15 秒內把箭嘴換成目標頭上 6px 的上下浮動標記。多個箭嘴重疊時按距離排序並錯開 10px。"}, "en": {"name": "Off-screen indicator / Edge arrow", "observe": "When a target (objective, ally, enemy) is outside the view, an arrow or icon appears on the screen edge pointing to it, sliding along the edge to stay accurate, often with a distance number; once the target enters the view the arrow disappears and a marker shows above the target instead.", "notThis": "Not a minimap (UI-08, a separate thumbnail); an edge arrow sits directly on the main view’s border. Not a damage-direction indicator (which only flashes briefly when you are hit).", "use": "Escorts, finding objectives, tracking teammates in multiplayer, enemies approaching from off-screen.", "prompt": "Add edge arrows for off-screen objectives in your game: cast a ray from screen centre towards the target, intersect it with the screen rectangle inset by 10 px, draw a 9 px gold arrow at that point rotated to face the target and show the distance (e.g. \"24m\") next to it; when the target comes on screen, swap the arrow within 0.15 s for a 6 px bobbing marker above the target. If several arrows overlap, sort by distance and offset them by 10 px."}, "ja": {"name": "画面外インジケーター（エッジ矢印）", "observe": "目標（目的地、味方、敵）が画面外にあると、画面の端にそちらを指す矢印やアイコンが現れ、方向が合うように端に沿って移動する。距離の数字が付くことが多い。目標が画面に入ると矢印は消え、目標の頭上にマーカーが出る。", "notThis": "ミニマップ（UI-08、独立した縮小図）ではなく、メイン画面の縁に直接付く。被弾方向表示（攻撃された時だけ短く出る）とも違う。", "use": "護衛、目的地探し、マルチプレイでの味方の位置、画面外から近づく敵。", "prompt": "ゲームで画面外の目的地にエッジ矢印を付けて：画面中心から目標方向へレイを飛ばし、10px 内側に縮めた画面矩形との交点に 9px の金色の矢印を描いて目標の方へ回転させ、横に距離（例「24m」）を表示。目標が画面に入ったら 0.15 秒以内に矢印を目標頭上の 6px の上下に揺れるマーカーへ切り替える。複数の矢印が重なる時は距離順に並べ 10px ずらす。"}, "params": "edge inset · arrow size & colour per target type · distance text · fade near edge · on-screen marker swap · clustering of overlapping arrows", "impl": "Project the target to screen space; if inside the safe rect show the on-screen marker. Otherwise d = target - centre, t = min(halfW/|d.x|, halfH/|d.y|), pos = centre + d*t, angle = atan2(d.y, d.x). For 3D targets behind the camera, flip d before clamping.", "related": ["UI-08", "UI-10"], "refs": [{"t": "Envato Tuts+ — Positioning on-screen indicators to point to off-screen targets", "u": "https://code.tutsplus.com/positioning-on-screen-indicators-to-point-to-off-screen-targets--gamedev-6644t"}, {"t": "Wikipedia — HUD (video games)", "u": "https://en.wikipedia.org/wiki/HUD_(video_games)"}], "nosrc": false}, {"id": "UI-10", "cat": "UI", "sub": "HUD 與介面類型", "std": "Floating nameplate / Overhead bar", "aliases": ["Nameplate", "Overhead health bar", "Unit frame above head", "World-space health bar"], "type": "C", "zh": {"name": "頭頂名牌與血條", "observe": "角色或敵人頭上浮着名字和一條細小的血條，跟着角色移動；名字顏色表示陣營（敵紅、友綠），血條常在受傷後才出現或變亮，不受傷一段時間後淡出；文字大小不隨鏡頭遠近改變。", "notThis": "不是 HUD 上固定位置的血條（玩家自己的資源計）；頭頂血條跟着單位走。也不是傷害數字（FB-02，每次命中短暫飄出）。也不是延遲血條（FB-17，講的是扣血動畫，可以套用在頭頂血條上）。", "use": "動作 RPG、塔防、即時戰略、多人遊戲；同時看多個單位的狀態，不必逐一點選。", "prompt": "在遊戲中為敵人加入頭頂血條：寬 16px、高 2px，位於精靈頭頂上方 4px，紅色 #e04a3a 加 1px 深色外框；只在敵人受傷後顯示，3 秒沒受傷就以 0.3 秒淡出；名字以 6px 像素字型顯示在血條上方，敵人紅色、友方綠色；血條與名字保持整數像素座標，不旋轉、不隨鏡頭縮放。"}, "en": {"name": "Floating nameplate / Overhead bar", "observe": "A name and a thin health bar float above a character or enemy and follow it; the name colour shows allegiance (red enemy, green ally), the bar often appears or brightens only after damage and fades after a while without being hit; text size does not change with camera distance.", "notThis": "Not the fixed HUD health bar (the player’s own resource meter); an overhead bar travels with the unit. Not damage numbers (FB-02, brief pop-ups per hit). Not the delayed health bar (FB-17, which is a drain animation you can apply to an overhead bar).", "use": "Action RPGs, tower defence, RTS, multiplayer; reading many units’ states without clicking each one.", "prompt": "Add overhead health bars for enemies in your game: 16 px wide, 2 px tall, 4 px above the sprite’s head, red #e04a3a with a 1 px dark outline; show it only after the enemy is damaged and fade it out over 0.3 s after 3 s without damage; draw the name in a 6 px pixel font above the bar, red for enemies and green for allies; keep bar and name on integer pixel coordinates, never rotated or scaled by the camera."}, "ja": {"name": "頭上のネームプレートと体力バー", "observe": "キャラクターや敵の頭上に名前と細い体力バーが浮かび、一緒に移動する。名前の色で陣営を示し（敵は赤、味方は緑）、バーは被弾後に表示・強調され、しばらく被弾しないとフェードアウトすることが多い。文字の大きさはカメラ距離で変わらない。", "notThis": "HUD に固定された体力バー（プレイヤー自身のゲージ）ではなく、ユニットに付いて動く。ダメージ数値（FB-02、ヒットごとに短く出る）とも、遅延体力バー（FB-17、減り方のアニメで、頭上バーにも適用できる）とも違う。", "use": "アクション RPG、タワーディフェンス、RTS、マルチプレイ。一体ずつ選択しなくても多数のユニットの状態が読める。", "prompt": "ゲームの敵に頭上の体力バーを追加して：幅 16px・高さ 2px、スプライトの頭の 4px 上、赤 #e04a3a に 1px の暗い縁。被弾後だけ表示し、3 秒被弾しなければ 0.3 秒でフェードアウト。名前は 6px のドットフォントでバーの上に、敵は赤・味方は緑。バーと名前は整数ピクセル座標に置き、回転もカメラによる拡縮もしない。"}, "params": "size & offset above head · show rule (always / damaged / targeted) · fade delay · allegiance colours · overlap handling · max distance", "impl": "Each frame project the unit’s head anchor to screen space, snap to whole pixels and draw the plate in the UI pass (screen-space size). Batch all plates into one dynamic vertex buffer. Hide or stack plates that overlap; cull by distance and when the unit is off-screen.", "related": ["FB-02", "FB-17", "UI-09", "PIX-02"], "refs": [{"t": "Roblox Creator Hub — Character name/health display", "u": "https://create.roblox.com/docs/characters/name-health-display"}, {"t": "Design Atlas — Health bar (delayed / ghost bar)", "u": "https://design.solhun.com/en/game-ui/health-bar/"}, {"t": "Wikipedia — HUD (video games)", "u": "https://en.wikipedia.org/wiki/HUD_(video_games)"}], "nosrc": false}, {"id": "UI-11", "cat": "UI", "sub": "HUD 與介面類型", "std": "Radial menu", "aliases": ["Pie menu", "Weapon wheel", "Ring menu", "Radial selector"], "type": "S", "zh": {"name": "圓形選單", "observe": "按住按鈕時，選項以圓形排在中心周圍（常是 4–8 格扇形）；推動搖桿或移動滑鼠的方向決定選中哪一格，被選中的那格放大或變亮，中間顯示名稱；放開按鈕即確認並關閉。", "notThis": "不是一般的直列選單（上下逐項移動焦點）；圓形選單用「方向」而不是「次序」選擇。也不是冷卻扇形（UI-05，扇形表示時間）。", "use": "手把操作的武器／道具切換、快速表情、建造類別；每個選項都只差一個方向，可以靠肌肉記憶快速選。", "prompt": "在遊戲中加入道具圓形選單：按住 Q 或 LB 時，8 個扇形在 0.12 秒內以 ease-out back 從 60% 放大展開，半徑 40px、內圈 14px，背景遊戲放慢到 30%；以搖桿或滑鼠方向選擇，死區 8px；選中扇形變亮並外移 3px，中間顯示道具名稱；放開時確認並以 0.08 秒收起。"}, "en": {"name": "Radial menu", "observe": "While a button is held, options are arranged in a circle around a centre (often 4–8 wedges); the stick or mouse direction picks a wedge, which grows or brightens, with its name in the middle; releasing the button confirms and closes the menu.", "notThis": "Not a regular list menu (moving focus up and down in order); a radial menu selects by direction, not sequence. Not a cooldown sweep (UI-05, where a wedge shows time).", "use": "Gamepad weapon/item switching, quick emotes, build categories; each option is one direction away, so muscle memory makes it fast.", "prompt": "Add an item radial menu to your game: while Q or LB is held, 8 wedges expand from 60% to 100% with ease-out back over 0.12 s, outer radius 40 px, inner radius 14 px, and gameplay slows to 30%; select by stick or mouse direction with an 8 px dead zone; the selected wedge brightens and moves out 3 px with the item name in the centre; releasing confirms and closes over 0.08 s."}, "ja": {"name": "ラジアルメニュー（パイメニュー）", "observe": "ボタンを押している間、選択肢が中心の周りに円形（多くは 4〜8 個の扇形）に並ぶ。スティックやマウスの方向で扇形を選び、選ばれた扇形は大きく・明るくなって中央に名前が出る。ボタンを離すと決定して閉じる。", "notThis": "普通のリストメニュー（上下に順番でフォーカスを動かす）ではなく、「順番」ではなく「方向」で選ぶ。クールダウンの扇形（UI-05、扇形で時間を表す）とも違う。", "use": "パッドでの武器・アイテム切り替え、クイックエモート、建築カテゴリ。どれも一方向ぶんの操作なので、体で覚えて素早く選べる。", "prompt": "ゲームにアイテムのラジアルメニューを追加して：Q か LB を押している間、8 つの扇形が ease-out back で 0.12 秒かけて 60% から 100% に展開（外半径 40px、内半径 14px）、ゲームは 30% の速度に。スティックかマウスの方向で選択し、デッドゾーンは 8px。選ばれた扇形は明るくなって 3px 外へ出て、中央にアイテム名。離すと決定し 0.08 秒で閉じる。"}, "params": "wedge count · radii · dead zone · open/close timing · time scale while open · hold vs toggle · selection highlight", "impl": "index = floor(((atan2(dy,dx) + π/2 + π/n) mod 2π) / (2π/n)) after checking |d| > deadzone. Build wedges as triangle-strip arcs (or one quad with an angle/radius test in the pixel shader). Remember the last selection so a quick tap can re-use it.", "related": ["UI-03", "UI-05", "UI-01"], "refs": [{"t": "Wikipedia — Pie menu (radial menu)", "u": "https://en.wikipedia.org/wiki/Pie_menu"}, {"t": "Game UI Database (reference screenshots of game interfaces)", "u": "https://www.gameuidatabase.com/"}], "nosrc": false}, {"id": "UI-12", "cat": "UI", "sub": "HUD 與介面類型", "std": "Tooltip", "aliases": ["Hover info", "Info popup", "Item tooltip", "Mouse-over text"], "type": "S", "zh": {"name": "懸停說明框", "observe": "游標（或手把焦點）停在物品、技能或按鈕上一小段時間後，旁邊出現一個小框，寫着名稱、稀有度顏色、數值或說明；游標移開就消失。框靠近畫面邊緣時會翻到另一側，不會被切掉。", "notThis": "不是 Toast 通知（UI-13，系統主動推送、會自己消失）；說明框是玩家「指着」某物才出現。也不是對話框（UI-16，講故事的文字）。", "use": "背包、技能樹、商店、設定項目；在不佔畫面空間的前提下提供詳細資訊。", "prompt": "在遊戲背包中加入物品說明框：游標停在格子上 0.35 秒後，在游標右下 8px 處以 0.1 秒淡入一個深色框（#141a24，90% 不透明，1px 外框用稀有度顏色）；第一行物品名稱用稀有度顏色，下面兩行灰色數值；若框會超出畫面右邊或下邊，翻到游標左側或上方；游標移到別的格子時直接切換內容，不再等待延遲。"}, "en": {"name": "Tooltip", "observe": "When the cursor (or gamepad focus) rests on an item, skill or button for a moment, a small box appears beside it with the name, rarity colour, stats or a description, and disappears when the cursor leaves. Near the screen edge the box flips to the other side rather than being cut off.", "notThis": "Not a toast (UI-13, pushed by the system and self-dismissing); a tooltip appears only because the player points at something. Not a dialogue box (UI-16, story text).", "use": "Inventories, skill trees, shops, settings; detailed information without permanently taking screen space.", "prompt": "Add item tooltips to your game’s inventory: after the cursor rests on a slot for 0.35 s, fade in over 0.1 s a dark box (#141a24, 90% opaque, 1 px border in the rarity colour) 8 px below-right of the cursor; first line is the item name in the rarity colour, then two grey stat lines; if the box would leave the screen on the right or bottom, flip it to the left of or above the cursor; when moving to another slot, swap content immediately without waiting for the delay again."}, "ja": {"name": "ツールチップ", "observe": "カーソル（またはパッドのフォーカス）がアイテム・スキル・ボタンに少し留まると、横に小さな枠が出て、名前・レア度の色・数値や説明が表示される。カーソルが離れると消える。画面端に近いと反対側に回り込み、切れない。", "notThis": "トースト通知（UI-13、システムが自動で出して自然に消える）ではなく、プレイヤーが何かを「指した」時にだけ出る。会話ボックス（UI-16、物語のテキスト）とも違う。", "use": "持ち物、スキルツリー、ショップ、設定項目。画面を常に占有せずに詳しい情報を見せる。", "prompt": "ゲームの持ち物画面にアイテムのツールチップを追加して：カーソルがマスに 0.35 秒留まったら、カーソルの右下 8px に暗い枠（#141a24、不透明度 90%、1px の縁はレア度の色）を 0.1 秒でフェードイン。1 行目はレア度の色でアイテム名、下に灰色の数値 2 行。画面の右か下にはみ出すなら、カーソルの左か上に反転。別のマスに移った時は遅延を待たず内容を即座に切り替える。"}, "params": "hover delay · offset from cursor · edge flipping rule · fade time · max width & wrapping · rarity colours · gamepad anchoring", "impl": "Measure the text first, then position: x = cursor.x + offset; if x + w > screenW, x = cursor.x - offset - w (same for y). Draw with a 9-slice panel (UI-14) on the topmost UI layer. Track a \"tooltip already open\" flag so moving between slots skips the delay.", "related": ["UI-13", "UI-14", "UI-16", "UI-03"], "refs": [{"t": "Wikipedia — Tooltip", "u": "https://en.wikipedia.org/wiki/Tooltip"}, {"t": "Nielsen Norman Group — Tooltip guidelines", "u": "https://www.nngroup.com/articles/tooltip-guidelines/"}], "nosrc": false}, {"id": "UI-13", "cat": "UI", "sub": "HUD 與介面類型", "std": "Toast / Notification popup", "aliases": ["Toast", "Notification toast", "Snackbar", "Feed message", "Pop-up notification"], "type": "S", "zh": {"name": "Toast 短暫通知", "observe": "畫面一角滑入一條小訊息（例如「+3 木材」「任務已更新」），停留約 2–3 秒後自動滑走或淡出；多條同時出現時會疊成一列，新的把舊的推開；不用玩家按任何鍵，也不會暫停遊戲。", "notThis": "不是模態對話框（要玩家按確定才關閉、會擋住操作）；Toast 不打斷遊戲。也不是獎勵彈出（UI-06，畫面中央的大型慶祝）。也不是說明框（UI-12，玩家指着某物才出現）。", "use": "拾取記錄、任務更新、成就、存檔完成、網絡狀態。用來告知「發生了甚麼」，但不要求玩家立即處理。", "prompt": "在遊戲右上角加入 Toast 通知：每條高 14px、寬 96px，從右邊外 0.2 秒 ease-out 滑入，停留 2.5 秒，再 0.25 秒淡出；最多同時 4 條，新的出現在最上面並把舊的以 0.15 秒推下 16px；相同類型（如「+1 木材」）在 1 秒內重複時合併成「+3 木材」並重新計時，而不是新增一條。"}, "en": {"name": "Toast / Notification popup", "observe": "A small message slides into a screen corner (e.g. \"+3 Wood\", \"Quest updated\"), stays for about 2–3 s, then slides away or fades on its own; several stack into a column, with new ones pushing old ones along; the player does not have to press anything and the game is not paused.", "notThis": "Not a modal dialog (needs a confirm press and blocks input); a toast never interrupts play. Not a reward pop (UI-06, a large centre-screen celebration). Not a tooltip (UI-12, which only appears when the player points at something).", "use": "Pickup logs, quest updates, achievements, save complete, network status. Tells the player what happened without asking them to deal with it now.", "prompt": "Add toast notifications to the top-right of your game: each 14 px tall and 96 px wide, sliding in from off the right edge with ease-out over 0.2 s, staying 2.5 s, then fading over 0.25 s; at most 4 at once, the newest on top pushing older ones down 16 px over 0.15 s; repeats of the same kind (e.g. \"+1 Wood\") within 1 s merge into \"+3 Wood\" and reset the timer instead of adding a new line."}, "ja": {"name": "トースト通知", "observe": "画面の隅に小さなメッセージ（「+3 木材」「クエスト更新」など）がスライドして入り、2〜3 秒ほど表示されたあと自動でスライドアウトまたはフェードする。複数同時なら縦に積み重なり、新しいものが古いものを押しのける。ボタン操作は不要で、ゲームも止まらない。", "notThis": "モーダルダイアログ（決定を押すまで閉じず操作を塞ぐ）ではなく、プレイを中断しない。報酬ポップ（UI-06、画面中央の大きなお祝い）とも、ツールチップ（UI-12、何かを指した時だけ出る）とも違う。", "use": "取得ログ、クエスト更新、実績、セーブ完了、通信状態。「何が起きたか」を伝えるが、すぐの対応は求めない。", "prompt": "ゲームの右上にトースト通知を追加して：1 件は高さ 14px・幅 96px、右端の外から ease-out 0.2 秒でスライドイン、2.5 秒表示、0.25 秒でフェードアウト。同時に最大 4 件、新しいものが一番上に出て古いものを 0.15 秒で 16px 下へ押す。同じ種類（「+1 木材」など）が 1 秒以内に続いたら新しい行を増やさず「+3 木材」にまとめてタイマーをリセット。"}, "params": "lifetime · entrance/exit motion · stacking direction & spacing · max visible · merge rule for duplicates · priority/colour by type", "impl": "Keep a queue of {text, icon, born, slotY}; each frame tween slotY toward index*spacing, compute alpha from age, and drop items past lifetime. Use unscaled time so toasts still expire during slow motion. Draw in screen space at a fixed anchor with safe-area margins.", "related": ["UI-06", "UI-12", "UI-02"], "refs": [{"t": "Wikipedia — Pop-up notification (toast)", "u": "https://en.wikipedia.org/wiki/Pop-up_notification"}, {"t": "Android Developers — Toasts overview", "u": "https://developer.android.com/guide/topics/ui/notifiers/toasts"}, {"t": "Nielsen Norman Group — Indicators, validations and notifications", "u": "https://www.nngroup.com/articles/indicators-validations-notifications/"}], "nosrc": false}, {"id": "UI-14", "cat": "UI", "sub": "HUD 與介面類型", "std": "Nine-slice / 9-patch", "aliases": ["9-slice scaling", "Nine-patch", "Scale-9 grid", "Border image"], "type": "S", "zh": {"name": "九宮格拉伸", "observe": "同一張小小的面板圖可以拉成任何大小的對話框、按鈕或視窗，而四個角的花紋保持原樣、不變形；只有四條邊沿一個方向延伸，中間區域填滿。", "notThis": "不是整張圖片直接縮放（角落和邊框會被拉寬、拉糊）；九宮格是把圖切成 3×3 再分別處理。也不是鋪磚地圖（PIX-17，用很多格子組成場景）。", "use": "所有大小不固定的介面框：對話框、按鈕、說明框、背包面板；一張素材適用全部尺寸，像素風格的邊框也保持銳利。", "prompt": "在遊戲的介面中用九宮格繪製所有面板：來源圖 24×24px，四邊各留 8px 作為角落；角落原尺寸繪製，上下邊只水平延伸，左右邊只垂直延伸，中央兩方向延伸；像素風格請用「重複鋪排」而不是拉伸邊緣，並以整數倍放大、最近鄰取樣。"}, "en": {"name": "Nine-slice / 9-patch", "observe": "One small panel image can be stretched into dialogue boxes, buttons or windows of any size while the decorated corners stay exactly as drawn; only the four edges extend along one axis and the centre fills the rest.", "notThis": "Not scaling the whole image (corners and borders get stretched and blurry); nine-slice cuts the image into a 3×3 grid and treats each part separately. Not a tilemap (PIX-17, building scenes out of many tiles).", "use": "Every UI frame whose size varies: dialogue boxes, buttons, tooltips, inventory panels; one asset covers all sizes and pixel-art borders stay crisp.", "prompt": "Draw every panel in your game’s UI with nine-slice: a 24×24 px source with 8 px margins on each side as corners; draw corners at native size, top/bottom edges stretch horizontally only, left/right edges vertically only, and the centre in both; for pixel art tile (repeat) the edges instead of stretching them, scale by whole integers and sample nearest-neighbour."}, "ja": {"name": "9 スライス（ナインパッチ）", "observe": "1 枚の小さなパネル画像を、四隅の模様をそのままに、どんな大きさの会話ボックス・ボタン・ウィンドウにも伸ばせる。四辺は一方向にだけ伸び、中央が残りを埋める。", "notThis": "画像全体を拡大縮小する（角や縁が引き伸ばされてぼやける）のではなく、画像を 3×3 に分けてそれぞれ扱う。タイルマップ（PIX-17、多数のタイルで場面を作る）とも違う。", "use": "サイズが変わるあらゆる UI 枠：会話ボックス、ボタン、ツールチップ、持ち物パネル。1 つの素材で全サイズに対応し、ドット絵の縁もくっきり保てる。", "prompt": "ゲームの UI のパネルをすべて 9 スライスで描いて：元画像は 24×24px、上下左右 8px を角とする。角は原寸、上下の辺は横方向のみ、左右の辺は縦方向のみ、中央は両方向に伸ばす。ドット絵では辺を引き伸ばさずに繰り返し並べ、整数倍で拡大し最近傍サンプリングにする。"}, "params": "margins (left/top/right/bottom) · stretch vs tile for edges & centre · pixel scale · minimum size · content padding", "impl": "Emit 9 quads (or 16 vertices / 54 indices) whose positions use the target size and whose UVs use the fixed source margins; for tiled edges either emit repeated quads or use a wrap sampler with UVs scaled by (edgeLength / sourceEdgeLength). Keep vertex positions on integer pixels.", "related": ["UI-12", "UI-16", "PIX-01", "PIX-17"], "refs": [{"t": "Wikipedia — 9-slice scaling", "u": "https://en.wikipedia.org/wiki/9-slice_scaling"}, {"t": "Godot docs — NinePatchRect", "u": "https://docs.godotengine.org/en/stable/classes/class_ninepatchrect.html"}, {"t": "Unity Manual — 9-slicing sprites", "u": "https://docs.unity3d.com/Manual/sprite/9-slice/9-slice-landing.html"}, {"t": "MDN — border-image (CSS nine-slice)", "u": "https://developer.mozilla.org/en-US/docs/Web/CSS/border-image"}], "nosrc": false}, {"id": "UI-15", "cat": "UI", "sub": "文字與對白", "std": "Typewriter effect", "aliases": ["Text crawl", "Letter-by-letter reveal", "Character reveal", "Scrolling text"], "type": "S", "zh": {"name": "打字機效果（逐字顯示）", "observe": "對白或說明文字一個字一個字地出現，像打字機一樣；遇到標點會稍微停頓，全部打完後角落出現一個上下跳動的「▼」提示可以繼續；文字還在出現時按鍵，會立即顯示整句。", "notThis": "不是文字特效（UI-17，已顯示的文字在波動或抖動）；打字機效果只管「何時出現」。也不是對話框本身（UI-16，承載文字的框與名牌）。", "use": "對白、教學說明、劇情旁白；控制閱讀節奏、表現說話語氣（慢＝猶豫，快＝激動），並配合「嗶嗶」說話聲。", "prompt": "在遊戲的對白中加入打字機效果：每秒 30 個字元，逗號後停 0.15 秒、句號／問號／感嘆號後停 0.35 秒；每顯示 2 個字元播放一次短促說話音；整句先排版好再逐字顯示，避免單字在行尾跳行；文字未完時按確認鍵立即顯示全部，完成後右下角顯示以 0.6 秒週期上下跳動 2px 的「▼」。"}, "en": {"name": "Typewriter effect", "observe": "Dialogue or instructions appear one character at a time, like a typewriter; it pauses briefly at punctuation, and when the line is complete a bobbing \"▼\" appears in the corner to show you can continue; pressing a key while text is still appearing reveals the whole line at once.", "notThis": "Not animated text (UI-17, already-visible text that waves or jitters); a typewriter only controls when characters appear. Not the dialogue box itself (UI-16, the frame and name tag that hold the text).", "use": "Dialogue, tutorials, narration; controls reading pace and conveys tone (slow = hesitant, fast = excited), often paired with blip voice sounds.", "prompt": "Add a typewriter effect to your game’s dialogue: 30 characters per second, a 0.15 s pause after commas and 0.35 s after full stops, question and exclamation marks; play a short voice blip every 2 characters; lay out the whole line first and then reveal it, so words never jump to the next line mid-reveal; pressing confirm while typing shows the full line instantly, and once complete show a \"▼\" in the bottom-right that bobs 2 px on a 0.6 s cycle."}, "ja": {"name": "タイプライター効果（1 文字ずつ表示）", "observe": "セリフや説明が 1 文字ずつタイプライターのように現れる。句読点で少し止まり、1 行が出きると隅に上下に跳ねる「▼」が出て先へ進めることを示す。表示途中でボタンを押すと全文が一度に出る。", "notThis": "テキストエフェクト（UI-17、表示済みの文字が波打つ・震える）ではなく、タイプライターは「いつ出るか」だけを扱う。会話ボックス自体（UI-16、文字を入れる枠と名札）とも違う。", "use": "会話、チュートリアル、ナレーション。読む速さを制御し、口調を表す（遅い＝ためらい、速い＝興奮）。「ピピッ」という発話音と組み合わせることが多い。", "prompt": "ゲームの会話にタイプライター効果を追加して：毎秒 30 文字、読点の後 0.15 秒、句点・疑問符・感嘆符の後 0.35 秒止める。2 文字ごとに短い発話音。先に 1 行全体をレイアウトしてから表示し、途中で単語が次の行へ飛ばないように。表示中に決定ボタンで全文を即表示、表示完了後は右下に 0.6 秒周期で 2px 上下する「▼」を出す。"}, "params": "characters per second · punctuation pauses · blip sound interval & pitch · skip behaviour (finish line / fast-forward) · continue indicator", "impl": "Lay out the full string once (line breaks, glyph positions), then each frame set visibleCount = number of glyphs whose scheduled reveal time ≤ elapsed; schedule = cumulative sum of 1/cps plus punctuation pauses. Rich-text tags must be excluded from the count. Advance on input: if visibleCount < total, reveal all; else go to the next line.", "related": ["UI-16", "UI-17", "UI-01"], "refs": [{"t": "Febucci — How to make a typewriter effect in Unity with TextMeshPro", "u": "https://blog.febucci.com/2026/05/how-to-make-a-typewriter-effect-in-unity-with-textmeshpro/"}, {"t": "Ren'Py docs — Text (cps / wait / fast text tags)", "u": "https://www.renpy.org/doc/html/text.html"}, {"t": "Godot docs — RichTextLabel (visible_characters / visible_ratio)", "u": "https://docs.godotengine.org/en/stable/classes/class_richtextlabel.html"}], "nosrc": false}, {"id": "UI-16", "cat": "UI", "sub": "文字與對白", "std": "Dialogue box / Text box", "aliases": ["Text box", "Message window", "Speech box", "Dialogue window"], "type": "S", "zh": {"name": "對話框", "observe": "畫面下方（或上方）出現一個橫向的框，裏面是對白文字，旁邊或上緣有說話者的名牌，常附人物頭像；框打開時有簡短的展開動畫，換說話者時名牌與頭像切換到另一側，對話結束時框收起。", "notThis": "不是對白氣泡（CIN-06，掛在世界中角色頭上、有尾巴指向說話者）；對話框固定在畫面上，頭像的表情與口型另見 CIN-05。也不是打字機效果（UI-15，只是文字出現方式）。也不是說明框（UI-12，指着物件時出現）。", "use": "劇情對話、NPC 交談、教學、系統訊息；把「誰在說、說甚麼」整理在固定位置，方便閱讀。", "prompt": "在遊戲中加入對話框：固定在畫面底部，左右各留 8px、高 40px，以九宮格繪製；打開時以 0.15 秒 ease-out back 由 0% 高度展開；左側 32×32px 頭像，頭像上方 1 個名牌（說話者名稱、角色主題色）；換說話者時頭像與名牌以 0.1 秒淡入淡出換邊；每頁最多 3 行，文字以打字機效果顯示；對話結束時 0.1 秒收起。"}, "en": {"name": "Dialogue box / Text box", "observe": "A wide box appears at the bottom (or top) of the screen holding the dialogue text, with the speaker’s name tag on or beside its edge and often a portrait; it opens with a short expanding animation, the name tag and portrait switch sides when the speaker changes, and the box closes when the conversation ends.", "notThis": "Not a speech bubble (CIN-06, attached to a character in the world with a tail pointing at the speaker); a dialogue box is fixed on screen, and portrait expressions and mouth flaps are covered by CIN-05. Not the typewriter effect (UI-15, only how the text appears). Not a tooltip (UI-12, appears when pointing at an object).", "use": "Story conversations, NPC chats, tutorials, system messages; keeps \"who is speaking and what they say\" in one readable place.", "prompt": "Add a dialogue box to your game: fixed at the bottom with 8 px side margins and 40 px height, drawn with nine-slice; open it from 0% height with ease-out back over 0.15 s; a 32×32 px portrait on the left with a name tag above it (speaker name in the character’s theme colour); when the speaker changes, fade portrait and tag across to the other side over 0.1 s; at most 3 lines per page, revealed with a typewriter effect; close over 0.1 s when the conversation ends."}, "ja": {"name": "会話ボックス（メッセージウィンドウ）", "observe": "画面の下（または上）に横長の枠が出て、中にセリフ、縁か横に話し手の名札、多くは顔グラフィックが付く。開く時に短い展開アニメがあり、話し手が変わると名札と顔グラが反対側へ移り、会話が終わると枠が閉じる。", "notThis": "吹き出し（CIN-06、ワールド内のキャラに付き、しっぽで話し手を指す）ではなく、画面に固定される。顔グラの表情や口パクは CIN-05 を参照。タイプライター効果（UI-15、文字の出し方だけ）とも、ツールチップ（UI-12、物を指した時に出る）とも違う。", "use": "ストーリー会話、NPC との会話、チュートリアル、システムメッセージ。「誰が何を言っているか」を決まった場所にまとめ、読みやすくする。", "prompt": "ゲームに会話ボックスを追加して：画面下に固定、左右 8px の余白、高さ 40px、9 スライスで描画。開く時は ease-out back 0.15 秒で高さ 0% から展開。左に 32×32px の顔グラ、その上に名札（話し手の名前をキャラのテーマ色で）。話し手が変わったら顔グラと名札を 0.1 秒のフェードで反対側へ。1 ページ最大 3 行、文字はタイプライター効果で表示。会話終了時は 0.1 秒で閉じる。"}, "params": "position & size · open/close animation · portrait size & side · name-tag style · lines per page · advance indicator · auto vs manual advance", "impl": "A UI-layer widget: nine-slice frame (UI-14) + portrait sprite + name label + text block. Drive it from a dialogue queue of {speaker, side, text}. Animate the frame’s height with a tween (UI-01) and clip the text while it is opening so glyphs are not squashed.", "related": ["UI-15", "UI-14", "CIN-05", "CIN-06", "UI-17"], "refs": [{"t": "Design Atlas — Dialogue box", "u": "https://design.solhun.com/en/game-ui/dialogue-box/"}, {"t": "Godot docs — RichTextLabel (visible_characters / visible_ratio)", "u": "https://docs.godotengine.org/en/stable/classes/class_richtextlabel.html"}], "nosrc": false}, {"id": "UI-17", "cat": "UI", "sub": "文字與對白", "std": "Animated text (wave, shake, rainbow)", "aliases": ["Text effects", "Rich-text effects", "Wavy text", "Shaky text", "Rainbow text"], "type": "C", "zh": {"name": "文字特效（波浪、抖動、彩虹）", "observe": "已經顯示出來的文字中，某些字逐個在動：一個接一個上下起伏（波浪）、每個字隨機輕微抖動（抖動，表示害怕或憤怒）、顏色沿着字串循環變化（彩虹）；只套用在被標記的字詞上，其餘文字保持靜止。", "notThis": "不是打字機效果（UI-15，控制字何時出現）；文字特效是字出現後的持續動作。也不是錯誤搖晃（UI-04，整個 UI 元件一起搖、只搖一次）。", "use": "強調關鍵字、表現情緒（顫抖、吶喊、魔法咒語）、稀有物品名稱；讓對白有「語氣」。", "prompt": "在遊戲的對白系統加入 3 種文字特效標籤：<wave> 每個字元的 y 偏移 = 2px × sin(時間 × 6 + 字元序號 × 0.6)；<shake> 每 0.05 秒為每個字元隨機產生 ±1px 的偏移（固定種子，不平滑）；<rainbow> 每個字元的色相 = 時間 × 120° + 字元序號 × 30°。效果只作用於標籤內的字，並在「減少動態」設定中可關閉 wave 與 shake。"}, "en": {"name": "Animated text (wave, shake, rainbow)", "observe": "Some of the already-visible characters keep moving individually: rising and falling one after another (wave), jittering randomly by a pixel (shake, for fear or anger), or cycling colours along the string (rainbow); only tagged words are affected and the rest stays still.", "notThis": "Not a typewriter effect (UI-15, which controls when characters appear); animated text is continuous motion after they appear. Not an error shake (UI-04, a whole UI element shaking once).", "use": "Emphasising keywords, conveying emotion (trembling, shouting, spells), rare item names; gives dialogue a tone of voice.", "prompt": "Add 3 text-effect tags to your game’s dialogue system: <wave> sets each character’s y offset to 2 px × sin(time × 6 + index × 0.6); <shake> gives each character a random ±1 px offset re-rolled every 0.05 s (seeded, not smoothed); <rainbow> sets each character’s hue to time × 120° + index × 30°. Effects apply only inside the tags, and wave and shake can be turned off by the reduced-motion option."}, "ja": {"name": "テキストエフェクト（波・震え・虹色）", "observe": "表示済みの文字のうち一部が 1 文字ずつ動き続ける：順番に上下する（波）、1px ほどランダムに震える（震え。恐怖や怒り）、色が文字列に沿って巡る（虹色）。タグを付けた語だけに効き、残りは静止したまま。", "notThis": "タイプライター効果（UI-15、文字がいつ出るか）ではなく、出た後の継続的な動き。エラー時の揺れ（UI-04、UI 要素全体が一度だけ揺れる）とも違う。", "use": "キーワードの強調、感情表現（震え声、叫び、呪文）、レアアイテム名。セリフに「口調」を与える。", "prompt": "ゲームの会話システムに 3 種のテキストエフェクトタグを追加して：<wave> は各文字の y オフセット = 2px × sin(時間 × 6 + 文字番号 × 0.6)。<shake> は 0.05 秒ごとに各文字へ ±1px のランダムオフセット（シード固定、補間なし）。<rainbow> は各文字の色相 = 時間 × 120° + 文字番号 × 30°。タグ内の文字だけに適用し、「動きを減らす」設定で wave と shake をオフにできるように。"}, "params": "amplitude (px) · speed · per-character phase offset · shake re-roll rate · hue speed & spread · which effects reduced-motion disables", "impl": "Render text as per-glyph quads; in the vertex stage (or CPU) offset each glyph by f(time, glyphIndex) for glyphs inside an effect range parsed from the markup. For pixel fonts round offsets to whole pixels. Use a seeded hash of (floor(time*rate), index) for shake so it is stable and scrub-able.", "related": ["UI-15", "UI-16", "UI-04"], "refs": [{"t": "Godot docs — BBCode in RichTextLabel ([wave], [shake], [rainbow] effects)", "u": "https://docs.godotengine.org/en/stable/tutorials/ui/bbcode_in_richtextlabel.html"}, {"t": "Text Animator for Unity — Built-in effects list (wave, shake, rainbow…)", "u": "https://docs.febucci.com/text-animator-unity/effects/built-in-effects-list"}], "nosrc": false}, {"id": "NAV-01", "cat": "NAV", "sub": "互動提示", "std": "Interactable highlight", "aliases": ["Outline on hover", "Proximity highlight", "Interaction outline"], "type": "C", "zh": {"name": "可互動物件高亮（靠近／懸停描邊）", "observe": "角色走近或游標移到可互動的物件（寶箱、告示牌、門、NPC）時，物件外圍出現一圈 1 像素的亮色描邊並輕微脈動，上方通常同時出現按鍵提示（例如「E」）；離開範圍後描邊淡出。外觀相似但不能互動的物件保持原樣。", "notThis": "不是黃漆標記（NAV-02，一直畫在場景上，多用於攀爬路線）；描邊只在接近或懸停時出現。也不是選擇性描邊（PIX-12，美術上的輪廓上色手法）或拾取閃光（VFX-16，物品本身持續閃爍）。", "use": "探索、解謎、點擊冒險、生存遊戲中分辨「哪些東西可以按」，以及多個物件靠在一起時指出目前會被選中的那一個。", "prompt": "在遊戲中加入可互動物件高亮：玩家與物件距離小於 24 px（或游標懸停）時，在物件外圍畫 1 px #ffe08a 描邊，0.12 秒淡入，並以 1.2 秒週期在 60%–100% 不透明度之間脈動；同一時間只高亮最近的一個物件，並在它上方 6 px 顯示按鍵提示圖示；離開範圍後 0.15 秒淡出。不可互動的物件不要有任何描邊。"}, "en": {"name": "Interactable highlight (outline on approach / hover)", "observe": "When the character walks up to, or the cursor hovers over, an object that can be used (chest, sign, door, NPC), a 1-pixel bright outline appears around it and pulses gently, usually with a button prompt (e.g. “E”) above it; the outline fades when you leave. Similar-looking objects that can’t be used stay unchanged.", "notThis": "Not yellow paint (NAV-02, always painted into the world, mostly for climbing routes); this outline only appears on approach or hover. Not selective outlining (PIX-12, an art technique for colouring line work) or a pickup sparkle (VFX-16, the item itself glints all the time).", "use": "Exploration, puzzles, point-and-click adventures and survival games, to show “what can I press” and which of several nearby objects will be chosen.", "prompt": "Add interactable highlighting to the game: when the player is within 24 px of an object (or the cursor hovers it), draw a 1 px #ffe08a outline around it, fade in over 0.12 s and pulse between 60% and 100% opacity on a 1.2 s period; highlight only the single nearest object at a time and show a button-prompt icon 6 px above it; fade out over 0.15 s on leaving. Objects that can’t be used never get an outline."}, "ja": {"name": "インタラクト可能オブジェクトのハイライト（接近・ホバーで輪郭）", "observe": "キャラが近づくか、カーソルを使えるオブジェクト（宝箱、看板、扉、NPC）に合わせると、周りに 1 ドットの明るい輪郭線が出てゆっくり明滅し、多くの場合上にボタン表示（「E」など）も出る。離れると輪郭は消える。見た目が似ていても使えない物はそのまま。", "notThis": "黄色ペイント（NAV-02、常にワールドに描かれ、主に登攀ルート用）ではなく、接近・ホバー時だけ出る輪郭。セルアウト（PIX-12、線の色付けの技法）や取得キラキラ（VFX-16、アイテム自体が常に光る）とも違う。", "use": "探索、謎解き、ポイント＆クリック、サバイバルで「どれが押せるか」と、近くに複数あるときどれが選ばれるかを示す。", "prompt": "ゲームにインタラクト可能オブジェクトのハイライトを追加して：プレイヤーとの距離が 24 px 未満（またはカーソルが重なった）とき、オブジェクトの外側に 1 px の #ffe08a 輪郭を描き、0.12 秒でフェードイン、1.2 秒周期で不透明度 60%〜100% の間を明滅させる。同時にハイライトするのは最も近い 1 つだけで、その 6 px 上にボタン表示アイコンを出す。範囲外に出たら 0.15 秒でフェードアウト。使えないオブジェクトには輪郭を付けない。"}, "params": "trigger radius / hover · outline width & colour · pulse period · fade in/out time · nearest-only vs all · prompt icon offset", "impl": "Draw the sprite’s silhouette (alpha>0 → outline colour) at 1-px offsets in 4 or 8 directions behind the sprite; or in the sprite pixel shader, output the outline colour where own alpha=0 and any neighbouring texel’s alpha>0 (pad atlas regions by 1 px). In 3D use an inverted-hull pass or a mask + edge-detect post pass. Pick the target on the CPU: nearest interactable in range, ties broken by facing direction.", "related": ["NAV-02", "PIX-12", "VFX-16", "FB-14"], "refs": [{"t": "Vallentin — Interactive hints (outline vs overlay highlight tests)", "u": "https://survival.vallentin.dev/blog/post/interactive-hints"}, {"t": "Beyond the Norm — Pick Up That Can: The Problem With Interactive Objects", "u": "https://www.beyondthenorm.org/pick-up-that-can-the-problem-with-interactive-objects/"}, {"t": "Game Developer — Affordance Design in Half-Life 2", "u": "https://www.gamedeveloper.com/design/affordance-design-in-half-life-2"}], "nosrc": false}, {"id": "NAV-02", "cat": "NAV", "sub": "互動提示", "std": "Yellow paint", "aliases": ["Climbable markers", "Ledge paint", "Traversal markers"], "type": "C", "zh": {"name": "黃漆標記（可攀爬標示）", "observe": "場景中可攀爬的崖邊、梯子、可破壞的木板等，被塗上全遊戲一致的高對比顏色（常見為黃色或白色的漆痕、布條、刻痕）；外形相似但不能用的岩石沒有這種顏色，玩家一眼就看出路線。", "notThis": "不是可互動高亮（NAV-01，只在接近時出現的描邊或 UI）；黃漆畫在世界裡，一直看得到。也不是前後景分離（NAV-03，整個遊玩層的明度對比）；黃漆只標出特定可用的點。", "use": "攀爬／跑酷路線，以及寫實畫風中「看起來能抓卻不能抓」的岩石太多的時候。常見爭議是破壞沉浸感，所以宜提供強度或關閉選項。", "prompt": "在遊戲中為可攀爬的平台邊緣加上黃漆標示：每個可攀爬邊緣的頂部畫 2 px 高的 #f2c94c 色帶，下方隨機加 1–3 條 1×3 px 的滴痕；形狀相似但不可攀爬的岩石一律不上色。標示顏色全遊戲保持一致，並在設定中提供「標示強度：關／淡／標準」三檔（淡＝50% 不透明度）。"}, "en": {"name": "Yellow paint (climbable markers)", "observe": "Climbable ledges, ladders, breakable planks and the like are painted in one consistent, high-contrast colour across the whole game (commonly yellow or white paint marks, cloth strips or scratches); similar-looking rocks that can’t be used have no such colour, so the route reads at a glance.", "notThis": "Not an interactable highlight (NAV-01, an outline or UI that appears only on approach); yellow paint is part of the world and always visible. Not foreground-background separation (NAV-03, value contrast of the whole gameplay layer); yellow paint marks specific usable points.", "use": "Climbing and parkour routes, and realistic art where too many rocks look grabbable but aren’t. It is often criticised as immersion-breaking, so offer an intensity or off setting.", "prompt": "Add yellow-paint markers to climbable ledges in the game: paint a 2 px tall #f2c94c strip along the top of every climbable edge, plus 1–3 random 1×3 px drips below it; similar-looking rocks that aren’t climbable never get paint. Keep the colour consistent across the game and add a setting “Marker intensity: Off / Subtle / Standard” (Subtle = 50% opacity)."}, "ja": {"name": "黄色ペイント（登れる場所の目印）", "observe": "登れる崖のふち、はしご、壊せる板などが、ゲーム全体で統一された目立つ色（よくあるのは黄色や白のペンキ跡、布、傷）で塗られている。形が似ていても使えない岩には色がなく、ルートがひと目で分かる。", "notThis": "インタラクト可能ハイライト（NAV-01、近づいたときだけ出る輪郭や UI）ではなく、ワールドに描かれていて常に見える。前景と背景の分離（NAV-03、遊べるレイヤー全体の明度差）とも違い、使える特定の場所だけを示す。", "use": "登攀・パルクールのルート、写実的な絵で「つかめそうでつかめない」岩が多いとき。没入感を損なうと批判されやすいので、強さやオフの設定を用意するとよい。", "prompt": "ゲームの登れる足場のふちに黄色ペイントの目印を付けて：登れるふちの上端すべてに高さ 2 px の #f2c94c の帯を描き、その下に 1×3 px の垂れ跡を 1〜3 本ランダムに付ける。形が似ていても登れない岩には塗らない。色はゲーム全体で統一し、設定に「目印の強さ：オフ／控えめ／標準」（控えめ＝不透明度 50%）を用意する。"}, "params": "marker colour · coverage (edge strip / patches / drips) · consistency rules · intensity setting · diegetic justification (paint, cloth, scratches)", "impl": "Author markers as decals, an overlay layer or tile variants on climbable edges, generated from the same collision tag the movement code uses (one source of truth, so paint never lies). The intensity setting is the overlay alpha or a material parameter. In 3D: a world-space decal or a vertex-colour mask on the climbable mesh.", "related": ["NAV-01", "NAV-03", "PIX-13"], "refs": [{"t": "GamesRadar+ — Ignore the yellow paint detractors: visual cues are great for games", "u": "https://www.gamesradar.com/ignore-the-yellow-paint-detractors-visual-cues-are-great-for-games/"}, {"t": "Kotaku — Yellow Paint Is Once Again Breaking People’s Brains", "u": "https://kotaku.com/yellow-paint-debate-ff7-rebirth-demo-resident-evil-4-1851249608"}, {"t": "CritPoints — It’s Not the Yellow Paint, It’s What the Paint Represents", "u": "https://critpoints.net/2024/03/03/yellow-paint-is-fine-actually/"}], "nosrc": false}, {"id": "NAV-03", "cat": "NAV", "sub": "可讀性", "std": "Foreground-background separation", "aliases": ["Figure–ground separation", "Gameplay layer readability", "Value separation"], "type": "S", "zh": {"name": "前後景分離（遊玩層與背景分離）", "observe": "可遊玩的層（地面、平台、角色、敵人、道具）在明度、飽和度與輪廓上都明顯比背景突出；背景偏淡、偏冷、對比低、細節少。轉成灰階後仍能一眼分出哪裡能站、哪個是敵人。", "notThis": "不是景深模糊（靠模糊分層）也不是視差捲動（PIX-15，靠移動速度分層）；這裡是靜止截圖也成立的明度與色彩分層。也不是剪影可讀性（PIX-13，單一角色的外形）。", "use": "背景華麗的 2D 平台或動作遊戲、彈幕，以及任何需要瞬間判斷「能踩／危險」的場面。", "prompt": "在遊戲中做前後景分離：背景圖層整體與霧色 #9fb8c8 混合 50%，對比降到 60%；可站立的平台、角色、敵人與道具加 1 px #141a24 外框並保持原本飽和度。完成後把截圖轉為灰階檢查：遊玩層與背景的平均明度差至少 25%。"}, "en": {"name": "Foreground-background separation", "observe": "The playable layer (ground, platforms, characters, enemies, items) clearly stands out from the background in value, saturation and outline; the background is paler, cooler, lower in contrast and less detailed. Even in greyscale you can tell at once where you can stand and which thing is an enemy.", "notThis": "Not depth of field (layers separated by blur) or parallax scrolling (PIX-15, separated by scroll speed); this is a value-and-colour separation that works in a still screenshot. Not silhouette readability (PIX-13, the shape of a single character).", "use": "2D platformers and action games with rich backgrounds, bullet hell, and any scene where “can I stand here / is this dangerous” must be read instantly.", "prompt": "Add foreground-background separation to the game: blend the whole background layer 50% toward a haze colour #9fb8c8 and reduce its contrast to 60%; give standable platforms, characters, enemies and items a 1 px #141a24 outline and keep their full saturation. Check by converting a screenshot to greyscale: the average value difference between the gameplay layer and the background should be at least 25%."}, "ja": {"name": "前景と背景の分離（プレイレイヤーの分離）", "observe": "遊べるレイヤー（地面、足場、キャラ、敵、アイテム）が、明度・彩度・輪郭のすべてで背景よりはっきり目立つ。背景は淡く、寒色寄りで、コントラストが低く、描き込みも少ない。グレースケールにしても、どこに立てるか、どれが敵かがすぐ分かる。", "notThis": "被写界深度（ぼかしで分ける）や視差スクロール（PIX-15、動く速さで分ける）ではなく、静止したスクリーンショットでも成り立つ明度と色の分離。シルエットの読みやすさ（PIX-13、1 体のキャラの形）とも違う。", "use": "背景が凝った 2D アクションやプラットフォーマー、弾幕など、「乗れるか・危ないか」を瞬時に読ませたい場面。", "prompt": "ゲームで前景と背景を分離して：背景レイヤー全体を霧色 #9fb8c8 へ 50% 寄せ、コントラストを 60% に下げる。立てる足場、キャラ、敵、アイテムには 1 px の #141a24 の輪郭を付け、彩度はそのまま。スクリーンショットをグレースケールにして確認し、プレイレイヤーと背景の平均明度差が 25% 以上あること。"}, "params": "background haze colour & amount · background contrast / saturation scale · gameplay outline · target value gap · per-layer settings", "impl": "Render background layers into their own render target and composite with a fullscreen pass: lerp(col, haze, k) and scale contrast around mid-grey (or bake this into the background art). Draw the gameplay layer afterwards, optionally with a silhouette-outline pass. Add a greyscale debug view (luma = dot(rgb, [.299,.587,.114])) to validate the value gap.", "related": ["PIX-13", "PIX-15", "NAV-02", "PIX-12"], "refs": [{"t": "Frozenbyte Wiki — Level Art: Color and Lighting (guiding with values)", "u": "https://wiki.frozenbyte.com/index.php/Level_Art:_Color_and_Lighting"}, {"t": "Wikipedia — Figure–ground (perception)", "u": "https://en.wikipedia.org/wiki/Figure%E2%80%93ground_(perception)"}, {"t": "Game Developer — How to Reduce Visual Confusion in Your Game", "u": "https://www.gamedeveloper.com/design/how-to-reduce-visual-confusion-in-your-game"}, {"t": "Wikipedia — Aerial perspective", "u": "https://en.wikipedia.org/wiki/Aerial_perspective"}], "nosrc": false}, {"id": "NAV-04", "cat": "NAV", "sub": "可讀性", "std": "Attack telegraph", "aliases": ["Danger zone marking", "AoE indicator", "Ground telegraph"], "type": "C", "zh": {"name": "攻擊預警（危險區標示）", "observe": "敵人出招前，地上先出現與實際傷害範圍同形狀的半透明紅色區域（圓形、扇形、直線），邊框清楚；區域內的填充或掃動弧線像時鐘一樣推進，填滿那一刻才造成傷害，之後區域消失。", "notThis": "不是射程圈（NAV-06，顯示己方能打到的範圍，選取時常駐）；預警是短暫的「將要受傷」警告，帶倒數。也不是魔法陣（VFX-13，裝飾性的施法特效，不一定等於判定範圍）。", "use": "動作 RPG、Boss 戰、MMO 團隊戰、彈幕，讓玩家有可預期的閃避時間。", "prompt": "在遊戲中為敵人的範圍攻擊加入地面預警：出招前畫出與判定完全相同的形狀（圓形半徑＝攻擊半徑），底色 rgba(224,74,58,0.18)，外圈 2 px 深色加 1 px #e04a3a 邊框；從中心向外填充 rgba(224,74,58,0.4) 作為倒數，小招 0.6 秒、大招 1.5 秒；填滿時才判定傷害，以 0.05 秒白色閃光加擴散圓環收尾。直線衝撞用長方形，從敵人往前填滿。"}, "en": {"name": "Attack telegraph (danger-zone marking)", "observe": "Before an enemy attack lands, a translucent red area with the same shape as the real damage area (circle, cone, line) appears on the ground with a clear border; a fill or sweeping arc inside advances like a clock, damage happens the moment it is full, and then the area disappears.", "notThis": "Not a range indicator (NAV-06, shows what your own unit can reach and stays while selected); a telegraph is a brief “you are about to be hit” warning with a countdown. Not a magic circle (VFX-13, a decorative casting effect that isn’t necessarily the hit area).", "use": "Action RPGs, boss fights, MMO raids, bullet hell: anywhere players need a predictable window to dodge.", "prompt": "Add ground telegraphs to enemy area attacks in the game: before the attack, draw exactly the hitbox shape (circle radius = attack radius) with a background of rgba(224,74,58,0.18), a 2 px dark outer border and a 1 px #e04a3a inner border; fill it from the centre outward with rgba(224,74,58,0.4) as the countdown, 0.6 s for small attacks and 1.5 s for big ones; apply damage only when full, and finish with a 0.05 s white flash and an expanding ring. Use a rectangle filling forward from the enemy for a charge."}, "ja": {"name": "攻撃予兆表示（危険範囲の表示）", "observe": "敵の攻撃が当たる前に、実際のダメージ範囲と同じ形（円、扇形、直線）の半透明の赤い領域が地面に現れ、縁ははっきりしている。中の塗りや回る弧が時計のように進み、満ちた瞬間にダメージが発生して領域は消える。", "notThis": "射程表示（NAV-06、味方の届く範囲を示し、選択中は出たまま）ではなく、カウントダウン付きの短い「もうすぐ当たる」警告。魔法陣（VFX-13、装飾的な詠唱エフェクトで、判定範囲と一致するとは限らない）とも違う。", "use": "アクション RPG、ボス戦、MMO のレイド、弾幕など、予測できる回避の猶予を与えたい場面。", "prompt": "ゲームの敵の範囲攻撃に地面の予兆表示を追加して：攻撃前に判定とまったく同じ形（円の半径＝攻撃半径）を描き、下地は rgba(224,74,58,0.18)、外側に 2 px の暗い縁と 1 px の #e04a3a の縁。中心から外へ rgba(224,74,58,0.4) で塗りつぶしてカウントダウンにし、小技 0.6 秒、大技 1.5 秒。満ちたときだけダメージを判定し、0.05 秒の白フラッシュと広がるリングで締める。突進は敵から前方へ塗りが進む長方形にする。"}, "params": "shape = hitbox · warning time per damage · border / background / fill alpha · countdown style (radial fill, sweep, pulse) · non-colour cue (pattern, outline) · end flash", "impl": "Draw the telegraph as a ground decal / projected quad after the ground and before actors. A pixel shader computes distance (circle) or local uv (lane, cone) and outputs border, background and fill where dist < progress × radius. Feed the same shape data to the damage query so the visual always equals the hitbox, and add a pattern or outline so the warning doesn’t rely on colour alone.", "related": ["NAV-06", "VFX-13", "VFX-06", "FB-01"], "refs": [{"t": "Game Developer — Enemy Attacks and Telegraphing", "u": "https://www.gamedeveloper.com/design/enemy-attacks-and-telegraphing"}, {"t": "GreenyNeko — WildStar’s Legacy: The Telegraph-based Combat System", "u": "https://www.greenyneko.com/2019/07/wildstars-legacy-telegraph-based-combat.html"}, {"t": "Wikipedia — Area of effect", "u": "https://en.wikipedia.org/wiki/Area_of_effect"}], "nosrc": false}, {"id": "NAV-05", "cat": "NAV", "sub": "放置與範圍", "std": "Placement ghost", "aliases": ["Build placement preview", "Ghost building", "Valid / invalid placement tint"], "type": "C", "zh": {"name": "建造預覽（幽靈放置）", "observe": "選好要建造的物件後，一個半透明的「幽靈」版本跟著游標移動並吸附格子；可以放置時呈綠色，與岩石、水或其他建築重疊時變紅，並標出衝突的格子；點擊確認後才變成實體。", "notThis": "不是射程圈（NAV-06，顯示攻擊或作用半徑）；兩者可在預覽時同時出現，但幽靈預覽處理的是「佔用的位置是否合法」。也不是可互動高亮（NAV-01，針對已存在的物件）。", "use": "城市建造、塔防、生存基地建設、農場擺設、關卡編輯器。", "prompt": "在遊戲中加入建造預覽：選取建築後，以 50% 不透明度在游標位置顯示該建築，吸附到 12 px 格子；建築佔用的每一格若可建造就覆蓋 rgba(80,220,120,0.35)，否則覆蓋 rgba(230,60,60,0.45) 並畫紅色 X；只要有一格是紅色就不能放置，並在游標旁顯示原因（例如「被擋住」）。確認放置時播放 0.2 秒的縮放彈出與塵土粒子。"}, "en": {"name": "Placement ghost (build placement preview)", "observe": "After choosing something to build, a translucent “ghost” copy follows the cursor and snaps to the grid; it is green where it can be placed and turns red where it overlaps rocks, water or other buildings, marking the conflicting cells; it only becomes solid when you click to confirm.", "notThis": "Not a range indicator (NAV-06, shows attack or effect radius); both can appear during placement, but the ghost answers “is this footprint legal”. Not an interactable highlight (NAV-01, for objects that already exist).", "use": "City builders, tower defense, survival base building, farm decoration, level editors.", "prompt": "Add a placement preview to the game: after a building is selected, draw it at 50% opacity at the cursor, snapped to a 12 px grid; tint each footprint cell rgba(80,220,120,0.35) if buildable, otherwise rgba(230,60,60,0.45) with a red X; placement is refused if any cell is red, and a reason (e.g. “Blocked”) appears next to the cursor. On confirm, play a 0.2 s scale pop and dust particles."}, "ja": {"name": "配置プレビュー（ゴースト配置）", "observe": "建てる物を選ぶと、半透明の「ゴースト」がカーソルについて動き、グリッドに吸着する。置ける場所では緑、岩や水、他の建物と重なると赤になり、ぶつかっているマスが示される。クリックで確定して初めて実体になる。", "notThis": "射程表示（NAV-06、攻撃や効果の半径を示す）ではない。配置中に両方出ることはあるが、ゴーストが答えるのは「この占有範囲は置けるか」。インタラクト可能ハイライト（NAV-01、既にある物が対象）とも違う。", "use": "街づくり、タワーディフェンス、サバイバルの拠点建築、農場の飾り付け、レベルエディター。", "prompt": "ゲームに配置プレビューを追加して：建物を選んだら、カーソル位置に不透明度 50% で表示し、12 px のグリッドに吸着させる。占有する各マスを、建てられるなら rgba(80,220,120,0.35)、建てられないなら rgba(230,60,60,0.45) と赤い × で塗る。赤いマスが 1 つでもあれば配置できず、カーソルの横に理由（例：「ふさがっている」）を表示。確定時に 0.2 秒の拡大ポップと土ぼこりのパーティクルを出す。"}, "params": "grid size & snapping · ghost alpha · valid / invalid colours · per-cell conflict marks · reason text · rotate key · confirm animation", "impl": "Ghost = the same sprite drawn with alpha and a tint uniform (or a colour-multiply material). Check the footprint cells on the CPU against an occupancy grid whenever the snapped cell changes, and draw one quad per cell for valid / invalid. The preview must call the same validation function as real placement, so it can never lie.", "related": ["NAV-06", "NAV-01", "PIX-17"], "refs": [{"t": "RoClicks — Building UX: placing, picking and selecting (placement ghost)", "u": "https://roclicks.gg/resources/building/building-ux"}], "nosrc": false}, {"id": "NAV-06", "cat": "NAV", "sub": "放置與範圍", "std": "Range indicator", "aliases": ["Tower radius", "Attack range circle", "Range preview"], "type": "C", "zh": {"name": "射程圈（範圍指示）", "observe": "選取或準備放置防禦塔、單位或技能時，以它為中心出現半透明的圓（或一組格子）和清楚的邊線，顯示它能攻擊或影響的距離；進入圈內的敵人會被標記。升級前常以虛線預覽升級後的半徑。", "notThis": "不是攻擊預警（NAV-04，敵方即將命中，有倒數）；射程圈是己方的資訊，選取時常駐。也不是戰爭迷霧（ENV-15，表示視野而不是攻擊距離）。", "use": "塔防、即時戰略、戰棋（移動／攻擊格）、技能瞄準。", "prompt": "在遊戲中加入射程指示：游標懸停或選取防禦塔時，以塔為中心畫半徑等於攻擊距離的圓，填色 rgba(255,255,255,0.12)，邊線 1 px rgba(255,255,255,0.8)；圈內敵人頭上顯示 3 px 紅色標記。懸停升級按鈕時，以間隔 2 px 的虛線畫出升級後的半徑；升級時半徑在 0.25 秒內以 ease-out 擴大。"}, "en
