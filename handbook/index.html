observe": "ドット絵のキャラクターや小物が紙の切り抜きのように 3D の地面に立ち、カメラは斜め上から透視で見下ろす。画面の上下がはっきりぼけ（ティルトシフト風の被写界深度）、中央だけがくっきりして、ミニチュアの模型を見ているように見える。灯りには柔らかなブルームがかかり、空気中に光の筋が差し、全体の色調は暖かい。", "notThis": "従来の 2D 見下ろし（同じドット素材でも透視・被写界深度・光の演出がない）や 3D ピクセルアート（NPR-13、3D モデルまでピクセル化する）とは違う。HD-2D の要点は「ドット素材はそのまま、周囲を現代的な 3D の透視とポストエフェクトで包む」こと。「HD-2D」はもともとスクウェア・エニックスのブランド名。", "use": "レトロ JRPG のリメイクやオマージュ、ドット絵で映画的な雰囲気を出したいとき、ミニチュア・ジオラマ風の画面。", "prompt": "ゲームで HD-2D 風の表現を作る：(1) 地面や建物は 3D ジオメトリにドット絵テクスチャ（1 タイル 16px、最近傍サンプリング）。(2) キャラクターや木などはドット絵スプライトの縦向きビルボードにし、ピクセル比率に合わせて最近傍で拡大縮小、足元に楕円の影を付ける。(3) 透視カメラの俯角は約 35°、FOV は約 44°。(4) ティルトシフト被写界深度：画面上部 0〜30% と下部 72〜100% を 1/4 解像度のぼかし画像へ徐々にブレンドする。(5) 灯りに暖色の加算ブルーム（半径約 1.2 タイル）と、淡い斜めの光の筋を 3 本。(6) 暖色のグレーディング（赤 +12%、青 −12%）と強度 55% のビネット。"}, "params": "camera pitch & FOV · sprite pixel scale · tilt-shift band positions & blur radius · bloom radius & threshold · grade & vignette · shadow style", "impl": "Two layers: 3D world (tile-textured meshes, point-sampled) and camera-facing or Y-axis billboards for sprites, sized so one sprite texel = a constant number of screen pixels at the focus distance. Post stack: depth-of-field (or a screen-space vertical mask for tilt-shift) → bloom → colour grade/LUT → vignette. Real-time shadows from billboards use a separate shadow-caster quad.", "related": ["REN-34 Depth of Field", "REN-29 Bloom", "NPR-13", "PIX-01", "CAM-28 Depth of field"], "refs": [{"t": "Wikipedia — HD-2D", "u": "https://en.wikipedia.org/wiki/HD-2D"}, {"t": "Digital Foundry — Octopath Traveler: a 90s-style JRPG brought to life with cutting-edge tech", "u": "https://www.digitalfoundry.net/articles/digitalfoundry-2018-octopath-traveler-a-hybrid-game-for-a-hybrid-console"}, {"t": "4Gamer.biz — 「OCTOPATH TRAVELER」アートスタイル開発秘話 (CEDEC 2018)", "u": "https://business.4gamer.net/article/1810/18101801/"}, {"t": "Wikipedia — Tilt–shift photography", "u": "https://en.wikipedia.org/wiki/Tilt%E2%80%93shift_photography"}], "nosrc": false}, {"id": "MATX-01", "cat": "MATX", "sub": "著色模型與材質參數", "std": "Matcap", "aliases": ["MatCap", "Material capture", "Lit sphere", "Sphere-mapped shading"], "type": "S", "zh": {"name": "Matcap（材質捕捉球）", "observe": "整個物件的光影、高光與反射都來自一張「圓球照片」：表面朝向鏡頭哪個方向，就取球圖上對應位置的顏色。物件怎樣旋轉，亮面永遠在同一個畫面方向，彷彿光源黏在鏡頭上；場景燈光改變時它完全不受影響。", "notThis": "不是 Unlit（原手冊 REN-02 Unlit，只有平色、沒有明暗）；Matcap 有完整的明暗與高光，只是這些都「畫死」在球圖上。也不是 PBR（原手冊 REN-01 PBR，會隨真實光源與環境變化）。", "use": "雕刻與建模預覽、風格化或手繪感角色、手機上用極低成本做出金屬、陶瓷、糖果等質感，以及 UI 裡的 3D 圖示。", "prompt": "為遊戲加入 Matcap 材質：在頂點或像素著色器把法線轉到視角空間，取 uv = normalView.xy × 0.5 + 0.5 去採樣一張 256×256 的球圖（陶土、鉻、糖果三款可切換），乘上底色 #ffffff；完全不讀場景燈光。另加一個 0–1 的「混合到普通光照」參數，讓物件在過場時可以從 Matcap 過渡到正常光照。"}, "en": {"name": "Matcap (material capture)", "observe": "All of the object’s shading, highlights and reflections come from one picture of a lit sphere: whichever way a surface faces relative to the camera picks the matching spot on the sphere image. However the object rotates, the bright side stays in the same screen direction, as if the light were glued to the camera; changing the scene lights has no effect at all.", "notThis": "Not unlit (original handbook REN-02 Unlit, flat colour with no shading); a matcap has full shading and highlights, they are just baked into the sphere image. Not PBR (original handbook REN-01 PBR, which responds to real lights and the environment).", "use": "Sculpt and modelling previews, stylised or hand-painted characters, very cheap metal, ceramic or candy looks on mobile, 3D icons in UI.", "prompt": "Add a matcap material to the game: transform the normal to view space and sample a 256×256 sphere image at uv = normalView.xy × 0.5 + 0.5 (switchable clay, chrome and candy images), multiplied by a base colour #ffffff; ignore scene lights entirely. Add a 0–1 “blend to regular lighting” parameter so an object can cross-fade from matcap to normal lighting during a cutscene."}, "ja": {"name": "マットキャップ（MatCap）", "observe": "物体の陰影・ハイライト・反射がすべて 1 枚の「球の写真」から来る。面がカメラに対してどちらを向いているかで、球画像の対応する位置の色を取る。物体をどう回しても明るい面は常に画面の同じ方向にあり、光源がカメラに貼り付いているように見える。シーンのライトを変えてもまったく変化しない。", "notThis": "アンリット（元ハンドブック REN-02 Unlit、陰影のない平坦な色）とは違い、マットキャップには陰影やハイライトがあるが、すべて球画像に焼き込まれている。PBR（元ハンドブック REN-01 PBR、実際の光源や環境に反応する）とも違う。", "use": "スカルプトやモデリングのプレビュー、様式化・手描き風のキャラクター、モバイルで極めて低コストに金属・陶器・キャンディ風の質感を出す、UI 内の 3D アイコン。", "prompt": "ゲームにマットキャップマテリアルを追加して：法線をビュー空間に変換し、uv = normalView.xy × 0.5 + 0.5 で 256×256 の球画像（粘土・クロム・キャンディの 3 種を切り替え可能）をサンプルし、ベースカラー #ffffff を掛ける。シーンのライトは一切読まない。さらに 0〜1 の「通常ライティングへのブレンド」パラメータを用意し、カットシーン中にマットキャップから通常の照明へクロスフェードできるように。"}, "params": "matcap image · view-space normal (with or without perspective correction) · tint · blend with lit shading · normal map on/off", "impl": "uv = mul((float3x3)View, N).xy * 0.5 + 0.5 (flip y as needed); colour = matcapTex.Sample(uv) * tint. For fewer edge distortions use the reflected view vector instead of N. No light loop, so it costs one texture fetch per pixel. Normal maps still work: perturb N before the view transform.", "related": ["REN-02 Unlit", "REN-01 PBR", "MATX-02", "MATX-07"], "refs": [{"t": "Blender Manual — Workbench lighting (MatCap)", "u": "https://docs.blender.org/manual/en/latest/render/workbench/lighting.html"}, {"t": "nidorx/matcaps — MatCap texture library and explanation (GitHub)", "u": "https://github.com/nidorx/matcaps"}, {"t": "Wikipedia — Reflection mapping (sphere mapping)", "u": "https://en.wikipedia.org/wiki/Reflection_mapping"}], "nosrc": false}, {"id": "MATX-02", "cat": "MATX", "sub": "著色模型與材質參數", "std": "Clear coat, sheen and iridescence", "aliases": ["Clearcoat", "Coat layer", "Cloth sheen", "Velvet", "Thin-film interference", "Iridescent"], "type": "S", "zh": {"name": "清漆、絨布光澤與薄膜虹彩（多層材質）", "observe": "三種疊在基礎材質上的「額外一層」：清漆是在有顏色的底層上多一層透明亮光漆，可同時看到底層模糊的大高光和表層銳利的小高光（汽車烤漆、漆器）；絨布光澤在物件輪廓邊緣泛起柔和的亮邊（絲絨、桃皮）；薄膜虹彩的顏色隨觀看角度由藍綠變紫紅（肥皂泡、甲蟲殼、油膜）。", "notThis": "不是高光本身（原手冊 REN-10 Specular highlight，只有一層）或粗糙度（原手冊 REN-08 Roughness）；清漆是兩層高光疊加。絨布的亮邊也不是邊緣光（原手冊 REN-05 Rim lighting，通常是藝術加光）；也不是異向性反射（原手冊 REN-11 Anisotropy，高光被拉長）。", "use": "汽車、塗漆傢俱、陶瓷、絨布衣物與毛氈、昆蟲與寶石、肥皂泡、魔法藥水瓶。", "prompt": "為遊戲的材質加入三個可選圖層：清漆（強度 0–1、清漆粗糙度 0.05，獨立計算第二個 GGX 高光並按 Fresnel 減弱底層）、絨布光澤（顏色 #f0d0ff、粗糙度 0.6，用 Charlie 分佈令輪廓邊緣發亮）、薄膜虹彩（厚度 300–600 nm，以視角計算干涉色，再乘到高光上）。每層都有開關，關閉時不增加任何成本。"}, "en": {"name": "Clear coat, sheen and iridescence (layered materials)", "observe": "Three extra layers on top of a base material: clear coat adds a transparent glossy varnish over a coloured base, so you see the base’s broad blurry highlight and the coat’s small sharp one at the same time (car paint, lacquer); sheen adds a soft glow along the silhouette edges (velvet, peach skin); iridescence shifts colour with viewing angle from blue-green to magenta (soap bubbles, beetle shells, oil films).", "notThis": "Not a single specular highlight (original handbook REN-10 Specular highlight) or roughness (original handbook REN-08 Roughness); clear coat is two stacked highlights. The sheen edge is not rim lighting (original handbook REN-05 Rim lighting, usually an artistic extra light), and none of these is anisotropy (original handbook REN-11 Anisotropy, a stretched highlight).", "use": "Cars, painted furniture, ceramics, velvet clothing and felt, insects and gems, soap bubbles, magic potion bottles.", "prompt": "Add three optional layers to the game’s material: clear coat (strength 0–1, coat roughness 0.05, a second GGX highlight computed separately, with the base attenuated by the coat’s Fresnel), sheen (colour #f0d0ff, roughness 0.6, using the Charlie distribution so silhouette edges glow) and iridescence (film thickness 300–600 nm, interference colour from the view angle, multiplied into the specular). Each layer has a toggle and costs nothing when off."}, "ja": {"name": "クリアコート・シーン・イリデセンス（多層マテリアル）", "observe": "ベースマテリアルの上に重ねる 3 種類の「追加の層」。クリアコートは色の付いた下地の上に透明な艶のある塗膜を重ね、下地のぼやけた大きなハイライトと塗膜の鋭く小さなハイライトが同時に見える（車の塗装、漆器）。シーンはシルエットの縁に柔らかな光沢が出る（ベルベット、桃の皮）。イリデセンスは見る角度によって青緑から赤紫へ色が変わる（シャボン玉、甲虫の殻、油膜）。", "notThis": "単一のスペキュラーハイライト（元ハンドブック REN-10 Specular highlight）や粗さ（元ハンドブック REN-08 Roughness）とは違い、クリアコートはハイライトが 2 層重なる。シーンの縁の光はリムライト（元ハンドブック REN-05 Rim lighting、多くは演出用の追加光）ではなく、いずれも異方性反射（元ハンドブック REN-11 Anisotropy、引き伸ばされたハイライト）とも違う。", "use": "車、塗装家具、陶器、ベルベットの服やフェルト、昆虫や宝石、シャボン玉、魔法の薬瓶。", "prompt": "ゲームのマテリアルに 3 つのオプション層を追加して：クリアコート（強さ 0〜1、コート粗さ 0.05、2 つ目の GGX ハイライトを別に計算し、下地はコートのフレネルで減衰）、シーン（色 #f0d0ff、粗さ 0.6、Charlie 分布でシルエットの縁を光らせる）、イリデセンス（膜厚 300〜600 nm、視線角から干渉色を求めてスペキュラーに乗算）。各層はオン・オフでき、オフのときは追加コストなし。"}, "params": "coat strength · coat roughness · coat normal · sheen colour & roughness · film thickness range · film IOR", "impl": "Clear coat: f = base * (1 - Fc) + coatSpec, where Fc = Fresnel(0.04, N·V) and coatSpec is a second GGX lobe with its own roughness (Filament). Sheen: Charlie distribution D = (2 + 1/r)·sin^(1/r)θ /2π with a simple visibility term. Iridescence: thin-film interference — phase = 4π·n·d·cosθt/λ evaluated for R, G, B (KHR_materials_iridescence gives a reference implementation).", "related": ["REN-10 Specular highlight", "REN-08 Roughness", "REN-05 Rim lighting", "REN-11 Anisotropy", "MATX-01"], "refs": [{"t": "Google Filament — Physically Based Rendering (clear coat, cloth/sheen)", "u": "https://google.github.io/filament/Filament.md.html"}, {"t": "Khronos glTF — KHR_materials_clearcoat", "u": "https://github.com/KhronosGroup/glTF/tree/main/extensions/2.0/Khronos/KHR_materials_clearcoat"}, {"t": "Khronos glTF — KHR_materials_sheen", "u": "https://github.com/KhronosGroup/glTF/tree/main/extensions/2.0/Khronos/KHR_materials_sheen"}, {"t": "Khronos glTF — KHR_materials_iridescence", "u": "https://github.com/KhronosGroup/glTF/tree/main/extensions/2.0/Khronos/KHR_materials_iridescence"}, {"t": "Unreal Engine docs — Using the Clear Coat shading model", "u": "https://dev.epicgames.com/documentation/en-us/unreal-engine/using-the-clear-coat-shading-model-in-unreal-engine"}, {"t": "Blender Manual — Principled BSDF (coat, sheen, thin film)", "u": "https://docs.blender.org/manual/en/latest/render/shader_nodes/shader/principled.html"}, {"t": "Wikipedia — Thin-film interference", "u": "https://en.wikipedia.org/wiki/Thin-film_interference"}], "nosrc": false}, {"id": "MATX-03", "cat": "MATX", "sub": "表面細節", "std": "Triplanar mapping", "aliases": ["Triplanar projection", "World-space texturing", "Box mapping", "Tri-planar"], "type": "S", "zh": {"name": "三向投影貼圖（Triplanar mapping）", "observe": "貼圖不再依賴模型的 UV，而是從 X、Y、Z 三個世界方向各投影一次，再按表面朝向混合：頂面用俯視投影，陡峭的崖壁用側面投影。結果是峭壁不會出現被拉長的條紋，貼圖密度到處一致；物件移動時，紋理固定在世界中而不是跟着物件走。", "notThis": "不是視差貼圖（原手冊 REN-14 Parallax mapping，製造深度錯覺）或法線貼圖（原手冊 REN-13 Normal mapping）；三向投影解決的是「貼圖怎樣鋪上去」。也不是高度混合地表（MATX-04，決定兩種地表的交界）。", "use": "程序生成或雕刻出來的地形、岩石、洞穴、沒有 UV 的體素或 SDF 模型、可隨意縮放的關卡積木。", "prompt": "為遊戲的地形與岩石改用三向投影：以世界座標的 YZ、XZ、XY 平面各採樣一次岩石貼圖（每 4 m 重複一次），權重 w = |normal|^4 後正規化，讓過渡集中在 45° 左右；頂面（normal.y > 0）改用草地貼圖。法線貼圖也要按同樣的三個平面轉換方向（whiteout 混合）。"}, "en": {"name": "Triplanar mapping", "observe": "The texture no longer depends on the model’s UVs: it is projected once along each world axis X, Y and Z and blended by surface orientation — tops get the top-down projection, steep cliffs get a side projection. Cliffs show no stretched streaks and texel density is uniform everywhere; when an object moves, the texture stays fixed in the world rather than travelling with it.", "notThis": "Not parallax mapping (original handbook REN-14 Parallax mapping, faking depth) or normal mapping (original handbook REN-13 Normal mapping); triplanar solves how the texture is laid onto the surface. Not height-blend splatting (MATX-04, which decides the border between two ground layers).", "use": "Procedural or sculpted terrain, rocks, caves, voxel or SDF meshes without UVs, freely scaled level-building blocks.", "prompt": "Switch the game’s terrain and rocks to triplanar mapping: sample the rock texture once on each of the world-space YZ, XZ and XY planes (repeating every 4 m), weight with w = |normal|^4 then normalise so the transition is concentrated around 45°; on upward faces (normal.y > 0) use a grass texture instead. Reorient normal maps per plane as well (whiteout blend)."}, "ja": {"name": "トライプラナーマッピング（三方向投影）", "observe": "テクスチャはモデルの UV に頼らず、ワールドの X・Y・Z の 3 方向からそれぞれ投影し、面の向きに応じて混ぜる。上面は真上からの投影、急な崖は横からの投影になる。崖に引き伸ばされた縞が出ず、テクセル密度がどこでも均一。物体を動かすとテクスチャは物体と一緒に動かず、ワールドに固定されたままになる。", "notThis": "視差マッピング（元ハンドブック REN-14 Parallax mapping、奥行きの錯覚）や法線マッピング（元ハンドブック REN-13 Normal mapping）ではなく、トライプラナーは「テクスチャをどう貼るか」を解決する。ハイトブレンド（MATX-04、2 種類の地面の境目を決める）とも違う。", "use": "プロシージャル生成やスカルプトした地形、岩、洞窟、UV のないボクセルや SDF メッシュ、自由に拡大縮小するレベル用ブロック。", "prompt": "ゲームの地形と岩をトライプラナーマッピングに変えて：岩テクスチャをワールド座標の YZ・XZ・XY 平面でそれぞれ 1 回サンプル（4 m ごとに繰り返し）、重みは w = |normal|^4 を正規化して 45° 付近に遷移を集中させる。上向きの面（normal.y > 0）には草テクスチャを使う。法線マップも平面ごとに向きを変換する（whiteout ブレンド）。"}, "params": "texture scale (world units per tile) · blend sharpness (weight exponent) · per-axis textures (top vs sides) · object vs world space · normal-map reorientation", "impl": "w = pow(abs(N), k); w /= (w.x+w.y+w.z); col = texX.Sample(P.zy*s)*w.x + texY.Sample(P.xz*s)*w.y + texZ.Sample(P.xy*s)*w.z. Three fetches per texture (cost ×3); skip fetches whose weight < 0.01. Use object-space P instead of world-space if the texture must move with the object.", "related": ["REN-14 Parallax mapping", "REN-13 Normal mapping", "MATX-04", "PIX-17"], "refs": [{"t": "Unity Shader Graph — Triplanar node", "u": "https://docs.unity3d.com/Packages/com.unity.shadergraph@17.0/manual/Triplanar-Node.html"}, {"t": "GPU Gems 3, ch. 1 — Generating complex procedural terrains (triplanar texturing)", "u": "https://developer.nvidia.com/gpugems/gpugems3/part-i-geometry/chapter-1-generating-complex-procedural-terrains-using-gpu"}, {"t": "Godot docs — Standard Material 3D (triplanar, distance fade dither)", "u": "https://docs.godotengine.org/en/stable/tutorials/3d/standard_material_3d.html"}], "nosrc": false}, {"id": "MATX-04", "cat": "MATX", "sub": "表面細節", "std": "Height-blend texture splatting", "aliases": ["Height blending", "Height-based blend", "Texture splatting", "Terrain layer blend", "Splat map"], "type": "C", "zh": {"name": "高度混合地表（高度混合式貼圖拼接）", "observe": "兩種地表（例如石磚與草地、泥地與沙）的交界不是一條糊成一片的漸變，而是「高的先露出來」：石頭的頂部在草地中先冒出頭，草從石縫的低處先長進去；交界跟着石塊形狀走，乾淨又自然。", "notThis": "不是普通的透明度混合（兩張貼圖按比例淡入淡出，交界像被弄髒）；高度混合用每張貼圖自身的高度圖決定誰在上面。也不是三向投影（MATX-03，處理投影方向）或濕潤表面（MATX-05，在同一種材質上改粗糙度）。", "use": "地形繪製（草、泥、石、雪的交界）、路面磨損、苔蘚與積雪覆蓋、牆角的污漬與青苔。", "prompt": "為遊戲的地形改用高度混合：每層貼圖的 alpha 通道存高度（0–1），splat map 的權重 a 先加上各層高度，再只保留最高值以下 0.08 範圍內的部分（h_i + a_i − max + 0.08，夾在 0 以上後正規化）；石磚與草的交界因此沿着石塊邊緣走。用筆刷在編輯器裡塗 splat map，並可調整 0.02–0.3 的過渡寬度。"}, "en": {"name": "Height-blend texture splatting", "observe": "The border between two ground layers (cobbles and grass, mud and sand) is not a smeared gradient but “the higher one shows first”: stone tops poke through the grass first and grass creeps into the low gaps between stones; the border follows the stone shapes and stays crisp and natural.", "notThis": "Not a plain alpha blend (two textures cross-fading by weight, which looks dirty at the border); height blending uses each layer’s own height map to decide which is on top. Not triplanar mapping (MATX-03, projection direction) or a wet surface (MATX-05, changing roughness on one material).", "use": "Terrain painting (borders of grass, mud, stone, snow), worn paths, moss and snow cover, grime and moss in wall corners.", "prompt": "Switch the game’s terrain to height blending: store height (0–1) in each layer’s alpha channel, add it to the splat-map weight a, then keep only what lies within 0.08 below the maximum (h_i + a_i − max + 0.08, clamped above 0, then normalised); the cobble/grass border then follows the stone edges. Paint the splat map with a brush in the editor and expose a transition width of 0.02–0.3."}, "ja": {"name": "ハイトブレンド（高さを使ったテクスチャスプラッティング）", "observe": "2 種類の地面（石畳と草、泥と砂など）の境目が、ぼやけたグラデーションではなく「高いほうが先に出る」形になる。石の頭が草の中から先に顔を出し、草は石の隙間の低いところから入り込む。境目が石の形に沿うので、くっきりして自然に見える。", "notThis": "普通のアルファブレンド（2 枚のテクスチャを割合でクロスフェードし、境目が汚れたように見える）ではなく、ハイトブレンドは各レイヤー自身のハイトマップでどちらが上かを決める。トライプラナー（MATX-03、投影方向の問題）や濡れた表面（MATX-05、同じ材質の粗さを変える）とも違う。", "use": "地形ペイント（草・泥・石・雪の境目）、すり減った道、苔や積雪の被覆、壁の隅の汚れや苔。", "prompt": "ゲームの地形をハイトブレンドに変えて：各レイヤーのアルファチャンネルに高さ（0〜1）を入れ、スプラットマップの重み a に高さを足し、最大値から 0.08 以内の部分だけを残す（h_i + a_i − max + 0.08 を 0 以上にクランプして正規化）。これで石畳と草の境目が石の縁に沿う。スプラットマップはエディタでブラシ塗りし、遷移幅 0.02〜0.3 を調整できるように。"}, "params": "layer heights (texture alpha) · splat weights · transition depth · per-layer height bias/contrast · up to 4 layers per pass", "impl": "For layers i: v_i = h_i + a_i; m = max(v_i) - depth; w_i = max(v_i - m, 0); col = Σ col_i*w_i / Σ w_i. Four layers fit one RGBA splat texture; more layers need index maps or multiple passes. Apply the same weights to normal and roughness so lighting matches.", "related": ["MATX-03", "MATX-05", "PIX-17", "ENV-03"], "refs": [{"t": "Game Developer — Advanced terrain texture splatting (height blend)", "u": "https://www.gamedeveloper.com/programming/advanced-terrain-texture-splatting"}, {"t": "Wikipedia — Texture splatting", "u": "https://en.wikipedia.org/wiki/Texture_splatting"}], "nosrc": false}, {"id": "MATX-05", "cat": "MATX", "sub": "表面細節", "std": "Wet surface", "aliases": ["Wetness", "Rain-soaked surface", "Puddles", "Wet shader"], "type": "C", "zh": {"name": "濕潤表面（雨後路面）", "observe": "下雨時表面逐漸變深色、變光滑：石頭和泥土的顏色變暗，高光由一大片模糊變成銳利的小點，燈光在地面拉出長長的倒影；低窪處先積成反射天空的水窪，雨停後水窪縮小、表面再慢慢回到乾燥的啞光。", "notThis": "不是下雨本身（ENV-04，空中的雨線與水花）或水面（ENV-12，真正的水體）；濕潤是固體材質的反應。也不是單純調低粗糙度（原手冊 REN-08 Roughness）：濕潤同時令多孔材質變暗，而金屬幾乎不會變暗。", "use": "雨天與暴風場景、洞窟滲水、河邊與海灘、雨停後的氣氛轉變。", "prompt": "為遊戲加入全域濕度參數 wetness（0–1，下雨 20 秒內升到 1，雨停後 60 秒內降回 0）：多孔材質的底色乘上 lerp(1, 0.55, wetness)、粗糙度乘上 lerp(1, 0.25, wetness)；地形高度圖低於「水位 = wetness × 0.4」的位置形成水窪，粗糙度 0.02、底色接近黑色，並顯示天空與燈光的倒影。金屬的底色保持不變。"}, "en": {"name": "Wet surface (rain-soaked ground)", "observe": "When it rains, surfaces gradually get darker and glossier: stone and earth darken, highlights change from a broad blur to small sharp points, lights stretch long reflections across the ground; puddles reflecting the sky form first in low spots, and after the rain they shrink and the surface slowly returns to a dry matte.", "notThis": "Not rain itself (ENV-04, streaks and splashes in the air) or a water surface (ENV-12, an actual body of water); wetness is a solid material’s response. Not just lowering roughness (original handbook REN-08 Roughness): wetness also darkens porous materials, while metals barely darken.", "use": "Rainy and stormy scenes, dripping caves, riverbanks and beaches, the mood shift after rain.", "prompt": "Add a global wetness parameter to the game (0–1, rising to 1 within 20 s of rain starting and back to 0 within 60 s after it stops): multiply porous materials’ base colour by lerp(1, 0.55, wetness) and roughness by lerp(1, 0.25, wetness); where the terrain height map is below “water level = wetness × 0.4”, form puddles with roughness 0.02 and near-black albedo that show sky and light reflections. Leave metals’ base colour unchanged."}, "ja": {"name": "濡れた表面（雨上がりの路面）", "observe": "雨が降ると表面がだんだん濃く、艶やかになる。石や土の色が暗くなり、ハイライトは広いぼやけから鋭い小さな点に変わり、街灯の光が地面に長い映り込みを引く。くぼみには先に空を映す水たまりができ、雨がやむと水たまりが縮み、表面はゆっくり乾いたマットに戻る。", "notThis": "雨そのもの（ENV-04、空中の雨筋やしぶき）や水面（ENV-12、実際の水域）ではなく、濡れは固体の材質の反応。粗さを下げるだけ（元ハンドブック REN-08 Roughness）でもなく、濡れると多孔質の材質は暗くなるが、金属はほとんど暗くならない。", "use": "雨や嵐のシーン、水がしみ出る洞窟、川辺や海辺、雨上がりの雰囲気の変化。", "prompt": "ゲームにグローバルな湿り度 wetness（0〜1、雨が始まって 20 秒で 1 に、やんでから 60 秒で 0 に戻る）を追加して：多孔質の材質はベースカラーに lerp(1, 0.55, wetness)、粗さに lerp(1, 0.25, wetness) を掛ける。地形ハイトマップが「水位 = wetness × 0.4」より低い所は水たまりにし、粗さ 0.02、ほぼ黒のアルベドで空やライトの映り込みを見せる。金属のベースカラーは変えない。"}, "params": "wetness 0–1 · darkening amount (porosity) · roughness scale · puddle level vs height map · ripple normal on puddles · drying speed", "impl": "In the surface shader: albedo *= lerp(1, darken, wetness*porosity); roughness = lerp(roughness, 0.05, wetness); puddle = saturate((level - height)/0.05) → roughness 0.02, normal flattened (plus animated ripple normals, ENV-13). Reflections come from probes/SSR (original handbook REN-23/REN-24). Drive porosity by a mask so metals and paint stay unchanged.", "related": ["ENV-04", "ENV-12", "ENV-13", "REN-08 Roughness", "MATX-04"], "refs": [{"t": "Sébastien Lagarde — Water drop 3a: Physically based wet surfaces", "u": "https://seblagarde.wordpress.com/2013/03/19/water-drop-3a-physically-based-wet-surfaces/"}], "nosrc": false}, {"id": "MATX-06", "cat": "MATX", "sub": "透明與折射", "std": "Dithered transparency", "aliases": ["Screen-door transparency", "Stipple transparency", "Dither fade", "Opacity mask dithering"], "type": "S", "zh": {"name": "網點透明（Screen-door transparency）", "observe": "物件變「半透明」時沒有真正混色，而是按固定的點陣（棋盤格或 Bayer 矩陣）把部分像素整粒挖走：透明度 50% 時就像隔着紗窗看，每隔一格一個空洞；淡出時空洞越來越多直到消失。在高解析度或有 TAA 時看起來接近柔和的半透明。", "notThis": "不是 Alpha 混合（原手冊 REN-16 Alpha blending，每個像素都是兩種顏色的中間值）或固定門檻的 Alpha 裁切（原手冊 REN-17 Alpha clipping，只有全有或全無）。也不是抖色漸變轉場（TRN-09，切換兩個畫面）或像素藝術的抖色（PIX-08，用來表現中間色）。", "use": "擋住角色的樹木、屋頂與柱子淡出，遠距離或 LOD 交替時的淡入淡出，第三人稱鏡頭貼近角色時的淡化，不想處理透明排序的場合。", "prompt": "為遊戲中擋住玩家的物件加入網點透明：當物件位於鏡頭與角色之間時，不透明度在 0.25 秒內降到 0.35，像素著色器以螢幕座標查 4×4 Bayer 矩陣（門檻 = 值 / 17），alpha 低於門檻就 discard；物件仍然寫入深度、不需要排序。鏡頭移開後 0.4 秒內恢復到 1。"}, "en": {"name": "Dithered transparency (screen-door transparency)", "observe": "When an object turns “semi-transparent” no colours are actually mixed: whole pixels are punched out in a fixed pattern (checkerboard or Bayer matrix). At 50% opacity it looks like seeing through a fly screen, a hole every other pixel; fading out adds more holes until it is gone. At high resolution or with TAA it reads close to soft translucency.", "notThis": "Not alpha blending (original handbook REN-16 Alpha blending, where every pixel is a mix of two colours) or fixed-threshold alpha clipping (original handbook REN-17 Alpha clipping, all-or-nothing). Not the dither transition (TRN-09, switching between two images) or pixel-art dithering (PIX-08, faking in-between colours).", "use": "Fading trees, roofs and pillars that hide the character, distance and LOD cross-fades, fading the character when a third-person camera gets too close, anywhere you want to avoid transparency sorting.", "prompt": "Add dithered transparency to objects that hide the player in the game: when an object is between the camera and the character, lower its opacity to 0.35 over 0.25 s; the pixel shader looks up a 4×4 Bayer matrix by screen position (threshold = value / 17) and discards when alpha is below it; the object still writes depth and needs no sorting. Restore to 1 over 0.4 s when the camera clears it."}, "ja": {"name": "ディザ透明（スクリーンドア透過）", "observe": "物体が「半透明」になるとき、実際には色を混ぜず、決まったパターン（市松模様やベイヤー行列）でピクセルをまるごと抜く。不透明度 50% なら網戸越しに見るように 1 ピクセルおきに穴があき、フェードアウトでは穴が増えて最後に消える。高解像度や TAA があると柔らかな半透明に近く見える。", "notThis": "アルファブレンド（元ハンドブック REN-16 Alpha blending、各ピクセルが 2 色の中間）や固定しきい値のアルファクリップ（元ハンドブック REN-17 Alpha clipping、全部かゼロか）とは違う。ディザ画面転換（TRN-09、2 枚の画像の切り替え）やドット絵のディザ（PIX-08、中間色の表現）とも違う。", "use": "キャラクターを隠す木・屋根・柱のフェード、遠距離や LOD 切り替えのクロスフェード、三人称カメラが近づきすぎたときのキャラクターのフェード、透明物のソートを避けたい場面。", "prompt": "ゲームでプレイヤーを隠す物体にディザ透明を追加して：物体がカメラとキャラクターの間にあるとき、不透明度を 0.25 秒で 0.35 に下げる。ピクセルシェーダーで画面座標から 4×4 ベイヤー行列を引き（しきい値 = 値 / 17）、アルファがしきい値未満なら discard。物体は深度を書き込んだままで、ソート不要。カメラが離れたら 0.4 秒で 1 に戻す。"}, "params": "opacity · matrix size (2×2 / 4×4 / 8×8 / blue noise) · screen vs world anchoring · temporal jitter (for TAA) · fade speed", "impl": "Opaque pass, no blending: float th = (bayer4[(int)pos.x & 3][(int)pos.y & 3] + 1) / 17; clip(alpha - th); depth write stays on so no sorting is needed and it works with deferred shading. Offset the pattern per object (or use blue noise) so two overlapping faded objects don’t cancel out; jitter per frame when TAA can resolve it.", "related": ["REN-16 Alpha blending", "REN-17 Alpha clipping", "PIX-08", "TRN-09", "MATX-10"], "refs": [{"t": "OpenGL Advanced ’98 course notes — Screen-door transparency", "u": "https://www.opengl.org/archives/resources/code/samples/advanced/advanced98/notes/node145.html"}, {"t": "DigitalRune docs — Screen-door transparency", "u": "https://digitalrune.github.io/DigitalRune-Documentation/html/fa431d48-b457-4c70-a590-d44b0840ab1e.htm"}, {"t": "Alex Ocias — Unity stipple transparency shader", "u": "https://ocias.com/blog/unity-stipple-transparency-shader/"}, {"t": "Unity Shader Graph — Dither node", "u": "https://docs.unity3d.com/Packages/com.unity.shadergraph@17.0/manual/Dither-Node.html"}, {"t": "Godot docs — Standard Material 3D (triplanar, distance fade dither)", "u": "https://docs.godotengine.org/en/stable/tutorials/3d/standard_material_3d.html"}, {"t": "Wikipedia — Ordered dithering", "u": "https://en.wikipedia.org/wiki/Ordered_dithering"}], "nosrc": false}, {"id": "MATX-07", "cat": "MATX", "sub": "特殊材質", "std": "Hologram shader", "aliases": ["Hologram effect", "Holographic material", "Holo shader"], "type": "C", "zh": {"name": "全息投影材質（Hologram）", "observe": "物件看起來由光組成：通常是單一冷色（青、藍或綠），半透明並疊加發光；有一條條水平掃描線緩慢向上捲動，輪廓邊緣較亮、正面較淡；不時出現閃爍、整條橫向錯位的「訊號干擾」，底部常有投影光錐。", "notThis": "不是溶解（VFX-04，物件逐步消失）或傳送特效（VFX-15，一次性的出現或離開）；全息是一種持續的材質狀態。也不是 X 光剪影（MATX-10，只在被遮擋時才出現）或 CRT 濾鏡（PP-03，套在整個畫面上）。", "use": "科幻介面與通訊畫面、地圖投影、遠程角色、建造預覽、教學中的示範幽靈。", "prompt": "為遊戲加入全息材質：顏色 #6ff0ff，以加法混合繪製；不透明度 = 0.25 + 0.75 × Fresnel(指數 2)；世界座標 y 每 4 px 一條掃描線，以 20 px/秒向上捲動；每 0.8–2 秒隨機觸發一次 0.1 秒的干擾，期間隨機 3 條水平帶各自橫移 ±6 px，整體亮度閃爍到 60%。"}, "en": {"name": "Hologram shader", "observe": "The object looks made of light: usually one cool colour (cyan, blue or green), translucent and additive; horizontal scanlines scroll slowly upward, silhouette edges are brighter than the faces pointing at you; occasionally it flickers and whole horizontal bands jump sideways like signal interference, often with a projector light cone at the base.", "notThis": "Not a dissolve (VFX-04, an object gradually disappearing) or a teleport effect (VFX-15, a one-off appear/leave); a hologram is an ongoing material state. Not an X-ray silhouette (MATX-10, which appears only when occluded) or a CRT filter (PP-03, applied to the whole screen).", "use": "Sci-fi interfaces and comms screens, projected maps, remote characters, build previews, tutorial demonstration ghosts.", "prompt": "Add a hologram material to the game: colour #6ff0ff, drawn with additive blending; opacity = 0.25 + 0.75 × Fresnel (power 2); scanlines every 4 px of world-space y, scrolling upward at 20 px/s; every 0.8–2 s trigger a 0.1 s glitch in which 3 random horizontal bands shift ±6 px and overall brightness flickers to 60%."}, "ja": {"name": "ホログラムシェーダー", "observe": "物体が光でできているように見える。多くは寒色の単色（シアン・青・緑）で、半透明の加算表示。水平な走査線がゆっくり上へ流れ、こちらを向いた面より輪郭の縁が明るい。時々ちらつき、横の帯がまるごと横にずれる「信号ノイズ」が起き、足元に投影機の光の円錐があることも多い。", "notThis": "ディゾルブ（VFX-04、物体が徐々に消える）やテレポート演出（VFX-15、一度きりの出現・退場）ではなく、ホログラムは持続するマテリアルの状態。X 線シルエット（MATX-10、遮られたときだけ出る）や CRT フィルター（PP-03、画面全体にかかる）とも違う。", "use": "SF のインターフェースや通信画面、投影マップ、遠隔地のキャラクター、建築プレビュー、チュートリアルの手本ゴースト。", "prompt": "ゲームにホログラムマテリアルを追加して：色 #6ff0ff、加算ブレンドで描画。不透明度 = 0.25 + 0.75 × フレネル（指数 2）。ワールド座標 y の 4 px ごとに走査線を入れ、20 px/秒で上へスクロール。0.8〜2 秒ごとにランダムで 0.1 秒のグリッチを起こし、その間はランダムな 3 本の横帯をそれぞれ ±6 px ずらし、全体の明るさを 60% までちらつかせる。"}, "params": "tint · Fresnel power · scanline spacing & speed · base opacity · glitch frequency/duration/band count · vertex jitter · additive vs alpha", "impl": "Unlit, additive (or premultiplied alpha), ZWrite off. a = base + fresnel(pow(1 - saturate(dot(N,V)), p)); a *= 0.6 + 0.4*step(0.5, frac(worldPos.y/spacing + time*speed)); glitch: offset vertex x by (hash(floor(worldPos.y/bandH) + floor(time*rate)) - 0.5)*amp while glitchActive. Add bloom (original handbook REN-29) for the glow.", "related": ["VFX-04", "VFX-15", "MATX-10", "PP-03", "REN-06 Fresnel effect", "NAV-05"], "refs": [{"t": "Cyanilux — Hologram shader breakdown", "u": "https://www.cyanilux.com/tutorials/hologram-shader-breakdown/"}, {"t": "Unity Shader Graph — Fresnel Effect node", "u": "https://docs.unity3d.com/Packages/com.unity.shadergraph@17.0/manual/Fresnel-Effect-Node.html"}], "nosrc": false}, {"id": "MATX-08", "cat": "MATX", "sub": "特殊材質", "std": "Force field / Shield", "aliases": ["Energy shield", "Bubble shield", "Intersection highlight", "Depth-fade edge", "Shield impact ripple"], "type": "C", "zh": {"name": "力場／護盾（交界發光）", "observe": "一個近乎透明的能量球或圓頂罩住角色或基地：正面幾乎看不見，輪廓邊緣明亮（Fresnel）；與地面、牆壁或任何穿過它的物件相交的地方，會出現一條發光的交界線；表面常有六角格或流動紋理，被擊中時從命中點擴散出一圈漣漪。", "notThis": "不是光環（VFX-14，貼着角色的柔和光暈，沒有實體邊界）或衝擊波（VFX-06，一次性的擴散環）；力場有清楚的形狀與交界。也不是畫面扭曲（PP-09，只是其中一個可選的組成部分）或全息（MATX-07，物件本身變成光）。", "use": "能量護盾與無敵狀態、基地防護罩、地圖邊界與禁區、傳送門薄膜、Boss 的護盾階段。", "prompt": "為遊戲加入半徑 2 m 的球形護盾：顏色 #5cc8ff，加法混合，不透明度 = 0.08 + Fresnel(指數 3) × 0.8；用深度緩衝計算與場景的距離差，差值小於 0.3 m 的地方加亮成交界線（強度 1.5）；表面疊一層 0.25 m 的六角格，緩慢流動；被擊中時從命中點發出半徑 0→2.5 m、0.5 秒的漣漪環，經過處六角格亮起。"}, "en": {"name": "Force field / Shield (intersection highlight)", "observe": "A nearly transparent energy sphere or dome surrounds a character or base: invisible face-on, bright at the silhouette edges (Fresnel); wherever it intersects the ground, a wall or anything passing through it, a glowing intersection line appears; the surface often carries a hex grid or flowing pattern, and a hit sends a ripple ring outward from the impact point.", "notThis": "Not an aura (VFX-14, a soft glow hugging the character with no solid boundary) or a shockwave (VFX-06, a one-off expanding ring); a force field has a clear shape and intersection lines. Not screen distortion (PP-09, just one optional ingredient) or a hologram (MATX-07, where the object itself turns to light).", "use": "Energy shields and invulnerability, base shields, map boundaries and no-go zones, portal membranes, a boss’s shielded phase.", "prompt": "Add a 2 m-radius sphere shield to the game: colour #5cc8ff, additive, opacity = 0.08 + Fresnel (power 3) × 0.8; use the depth buffer to get the distance to the scene behind and brighten where it is under 0.3 m into an intersection line (intensity 1.5); overlay a slowly flowing 0.25 m hex grid; on hit, emit a ripple ring from the impact point growing 0→2.5 m over 0.5 s that lights up the hex cells it passes."}, "ja": {"name": "フォースフィールド／シールド（交差部の発光）", "observe": "ほぼ透明なエネルギーの球やドームがキャラクターや基地を包む。正面からはほとんど見えず、輪郭の縁が明るい（フレネル）。地面や壁、中を通り抜ける物体と交わる所には光る交差線が出る。表面には六角形のグリッドや流れる模様があることが多く、攻撃が当たると命中点から波紋が広がる。", "notThis": "オーラ（VFX-14、キャラクターに沿う柔らかな光で、はっきりした境界がない）や衝撃波（VFX-06、一度きりの広がる輪）ではなく、フォースフィールドにははっきりした形と交差線がある。画面の歪み（PP-09、材料の一つにすぎない）やホログラム（MATX-07、物体そのものが光になる）とも違う。", "use": "エネルギーシールドや無敵状態、基地の防御フィールド、マップの境界や立入禁止区域、ポータルの膜、ボスのシールド段階。", "prompt": "ゲームに半径 2 m の球形シールドを追加して：色 #5cc8ff、加算、不透明度 = 0.08 + フレネル（指数 3）× 0.8。深度バッファで背後のシーンとの距離差を求め、0.3 m 未満の所を交差線として明るくする（強度 1.5）。表面に 0.25 m の六角グリッドを重ねてゆっくり流す。被弾時は命中点から 0.5 秒で半径 0→2.5 m に広がる波紋を出し、通過した六角セルを光らせる。"}, "params": "tint · Fresnel power · intersection width (depth fade distance) · pattern (hex / noise) & scroll speed · hit ripple speed/width/lifetime · distortion amount", "impl": "Transparent pass after opaques, ZWrite off, both faces drawn. edge = 1 - saturate((sceneDepthLinear - pixelDepthLinear)/width) — needs the depth texture. a = base + fresnel + edge*k + ripple, ripple = smoothstep band of (distance(worldPos, hitPos) - t*speed). Hit positions are passed as a small array of (pos, startTime). Optional screen-space distortion (PP-09) behind it.", "related": ["VFX-14", "VFX-06", "PP-09", "MATX-07", "REN-06 Fresnel effect"], "refs": [{"t": "Cyanilux — Forcefield shader breakdown", "u": "https://www.cyanilux.com/tutorials/forcefield-shader-breakdown/"}, {"t": "Unity Shader Graph — Scene Depth node", "u": "https://docs.unity3d.com/Packages/com.unity.shadergraph@17.0/manual/Scene-Depth-Node.html"}, {"t": "Unity Shader Graph — Fresnel Effect node", "u": "https://docs.unity3d.com/Packages/com.unity.shadergraph@17.0/manual/Fresnel-Effect-Node.html"}], "nosrc": false}, {"id": "MATX-09", "cat": "MATX", "sub": "特殊材質", "std": "Vertex animation texture (VAT)", "aliases": ["VAT", "Vertex animation", "Baked vertex animation", "Morph texture"], "type": "S", "zh": {"name": "頂點動畫貼圖（VAT）", "observe": "複雜的動畫（布料飄動、建築倒塌、液體、成群的魚或士兵）被「烘焙」成一張貼圖：每一列是一個影格，每一欄是一個頂點，顏色存的是頂點位移。遊戲時著色器按時間讀取那一列並移動頂點，所以畫面上有大量物件同時播放原本需要物理模擬的動畫，成本卻接近靜態模型。", "notThis": "不是骨骼動畫（每個頂點跟隨骨頭，可以即時混合）或即時物理模擬（布娃娃、即時布料，會對碰撞反應）；VAT 是預錄的、不會互動。也不是頂點位移（原手冊 REN-15 Displacement，通常由公式或高度圖即時推出）。", "use": "大量群眾與魚群、預先模擬的破壞與倒塌、布料與旗幟、液體與煙霧網格、遠景中重複的動畫道具。", "prompt": "為遊戲加入 VAT 播放器：在 DCC 工具裡把 60 影格、最多 2048 個頂點的動畫烘焙成兩張貼圖（RGBA16F 的位置位移與法線，寬 = 頂點數、高 = 影格數），頂點著色器以 SV_VertexID 作為 u、(時間 × 30 fps) / 影格數作為 v 讀取並在相鄰兩格間線性插值；每個實例有自己的時間偏移，以 GPU instancing 一次畫出 500 個。"}, "en": {"name": "Vertex animation texture (VAT)", "observe": "A complex animation (cloth flapping, a building collapsing, fluid, a school of fish or a crowd) is baked into a texture: each row is a frame, each column a vertex, and the colour stores that vertex’s offset. At runtime the shader reads the row for the current time and moves the vertices, so huge numbers of objects play animation that originally needed physics simulation, at a cost close to a static mesh.", "notThis": "Not skeletal animation (vertices follow bones and can blend at runtime) or live physics (ragdolls, real-time cloth that react to collisions); a VAT is pre-recorded and non-interactive. Not displacement (original handbook REN-15 Displacement, usually computed live from a formula or height map).", "use": "Crowds and schools of fish, pre-simulated destruction and collapses, cloth and flags, fluid and smoke meshes, repeated animated props in the distance.", "prompt": "Add a VAT player to the game: in the DCC tool bake a 60-frame animation of up to 2048 vertices into two textures (RGBA16F position offsets and normals; width = vertex count, height = frame count); the vertex shader reads them with u from SV_VertexID and v = (time × 30 fps) / frameCount, lerping between the two neighbouring frames; give each instance its own time offset and draw 500 of them in one instanced call."}, "ja": {"name": "頂点アニメーションテクスチャ（VAT）", "observe": "複雑なアニメーション（はためく布、崩れる建物、液体、魚の群れや群衆）を 1 枚のテクスチャに「焼き込む」。各行が 1 フレーム、各列が 1 頂点で、色に頂点の移動量が入っている。実行時はシェーダーが時間に応じた行を読んで頂点を動かすので、本来は物理シミュレーションが必要な動きを大量の物体が同時に再生でき、コストは静的メッシュに近い。", "notThis": "スケルタルアニメーション（頂点がボーンに従い、実行時にブレンドできる）やリアルタイム物理（ラグドール、衝突に反応する布）ではなく、VAT は事前に記録されたもので反応しない。ディスプレイスメント（元ハンドブック REN-15 Displacement、数式やハイトマップからその場で計算することが多い）とも違う。", "use": "群衆や魚の群れ、事前にシミュレーションした破壊や倒壊、布や旗、液体や煙のメッシュ、遠景で繰り返されるアニメーション小道具。", "prompt": "ゲームに VAT プレーヤーを追加して：DCC ツールで 60 フレーム・最大 2048 頂点のアニメーションを 2 枚のテクスチャ（RGBA16F の位置オフセットと法線、幅 = 頂点数、高さ = フレーム数）に焼き込む。頂点シェーダーは u に SV_VertexID、v に (時間 × 30 fps) / フレーム数を使って読み、隣り合う 2 フレームを線形補間する。インスタンスごとに時間オフセットを持たせ、GPU インスタンシングで 500 体を 1 回で描く。"}, "params": "frame count & fps · vertex count (texture width) · offset range / encoding (16F vs 8-bit normalised + bounds) · normals texture · interpolation · loop vs one-shot · per-instance time offset", "impl": "Vertex shader: u = (vertexID + 0.5)/vertCount; v0 = (floor(f) + 0.5)/frames, v1 = next row; pos = basePos + lerp(tex.SampleLevel(pointClamp, (u,v0)), tex.SampleLevel(pointClamp, (u,v1)), frac(f)). Needs vertex texture fetch (all modern GPUs). Rigid-piece variants store per-piece position + rotation (quaternion) instead of per-vertex offsets.", "related": ["REN-15 Displacement", "ENV-08", "VFX-19", "MATX-03"], "refs": [{"t": "SideFX Labs — Vertex Animation Textures (Houdini docs)", "u": "https://www.sidefx.com/docs/houdini/nodes/out/labs--vertex_animation_textures-3.0.html"}, {"t": "Unreal Engine docs — Vertex Animation Tool", "u": "https://dev.epicgames.com/documentation/en-us/unreal-engine/vertex-animation-tool-in-unreal-engine"}, {"t": "GPU Gems 3, ch. 2 — Animated crowd rendering (animation stored in textures)", "u": "https://developer.nvidia.com/gpugems/gpugems3/part-i-geometry/chapter-2-animated-crowd-rendering"}], "nosrc": false}, {"id": "MATX-10", "cat": "MATX", "sub": "特殊材質", "std": "X-ray silhouette", "aliases": ["See-through walls", "Occluded silhouette", "Behind-wall outline", "Character occlusion silhouette"], "type": "C", "zh": {"name": "隔牆剪影（X 光輪廓）", "observe": "角色或敵人走到牆、樹或建築後面時，被擋住的部分不會消失，而是以單一顏色的剪影或描邊「透」出來（隊友藍色、敵人紅色、可拾取物黃色）；沒有被擋住的部分照常顯示，所以剪影只出現在被遮蓋的那一截。", "notThis": "不是網點透明（MATX-06，把擋路的牆變透明）；隔牆剪影是讓被擋住的角色穿透顯示，牆本身不變。也不是可互動高亮（NAV-01，一直顯示的描邊）或剪影可讀性（PIX-13，角色外形設計）。", "use": "俯視或第三人稱遊戲中角色被建築擋住、隊友與敵人位置提示、潛行中的偵查能力、可拾取物穿牆標示。", "prompt": "為遊戲加入隔牆剪影：角色在正常繪製時於 stencil 寫入 1；之後再畫一次角色，用 ZTest Greater、ZWrite Off、stencil ≠ 1，輸出單色（玩家 #4aa8ff、敵人 #ff5a4a，不透明度 0.6），並加上 1 px 的較亮描邊；剪影與正常畫面的交界要剛好在牆的邊緣。距離超過 30 m 的角色不顯示剪影。"}, "en": {"name": "X-ray silhouette (see-through walls)", "observe": "When a character or enemy walks behind a wall, tree or building, the hidden part doesn’t vanish but shows through as a flat-colour silhouette or outline (allies blue, enemies red, pickups yellow); the unoccluded part renders normally, so the silhouette appears only on the covered portion.", "notThis": "Not dithered transparency (MATX-06, which makes the blocking wall see-through); with an X-ray silhouette the hidden character shows through and the wall is unchanged. Not an interactable highlight (NAV-01, an always-on outline) or silhouette readability (PIX-13, character shape design).", "use": "Characters hidden by buildings in top-down or third-person games, ally and enemy position cues, a scouting ability in stealth games, pickups shown through walls.", "prompt": "Add X-ray silhouettes to the game: characters write stencil 1 when drawn normally; then draw each character again with ZTest Greater, ZWrite Off and stencil ≠ 1, outputting a flat colour (player #4aa8ff, enemies #ff5a4a, opacity 0.6) with a 1 px brighter outline; the border between silhouette and normal rendering must sit exactly on the wall’s edge. Hide silhouettes for characters further than 30 m."}, "ja": {"name": "壁越しシルエット（X 線表示）", "observe": "キャラクターや敵が壁・木・建物の後ろに入っても、隠れた部分は消えず、単色のシルエットや輪郭線として「透けて」見える（味方は青、敵は赤、拾えるアイテムは黄色）。遮られていない部分は普通に描かれるので、シルエットは隠れた部分だけに出る。", "notThis": "ディザ透明（MATX-06、遮る壁を透かす）ではなく、壁越しシルエットは隠れたキャラクターを透かして見せ、壁そのものは変わらない。インタラクト可能ハイライト（NAV-01、常時表示の輪郭）やシルエットの判読性（PIX-13、キャラクターの形のデザイン）とも違う。", "use": "見下ろし型や三人称でキャラクターが建物に隠れるとき、味方や敵の位置の手がかり、ステルスゲームの索敵能力、壁越しのアイテム表示。", "prompt": "ゲームに壁越しシルエットを追加して：キャラクターは通常描画時にステンシルへ 1 を書く。その後もう一度キャラクターを ZTest Greater・ZWrite Off・ステンシル ≠ 1 で描き、単色（プレイヤー #4aa8ff、敵 #ff5a4a、不透明度 0.6）に 1 px の明るい輪郭線を付ける。シルエットと通常描画の境目は壁の縁とぴったり一致させる。30 m より遠いキャラクターにはシルエットを出さない。"}, "params": "silhouette colour per team · opacity · outline width · pattern (flat / hatched / Fresnel) · max distance · which occluders count (layer mask)", "impl": "Pass 1: normal draw, stencil write 1. Pass 2 (after all occluders): same mesh, depth test GREATER, depth write off, stencil test NOT_EQUAL 1 (prevents self-occlusion), flat colour or Fresnel-tinted. Alternative: render characters to a mask + depth buffer and composite with a screen-space outline (sobel) only where the mask’s depth > scene depth.", "related": ["MATX-06", "NAV-01", "PIX-13", "NAV-03", "MATX-07"], "refs": [{"t": "Unity Manual — ShaderLab ZTest command", "u": "https://docs.unity3d.com/Manual/SL-ZTest.html"}, {"t": "Unity Manual — ShaderLab Stencil command", "u": "https://docs.unity3d.com/Manual/SL-Stencil.html"}, {"t": "Unity URP docs — Render Objects example: character visible behind objects", "u": "https://docs.unity3d.com/Packages/com.unity.render-pipelines.universal@10.5/manual/renderer-features/how-to-custom-effect-render-objects.html"}, {"t": "Rito15 — Stencil silhouette shader (ZTest Greater + stencil)", "u": "https://rito15.github.io/posts/unity-shader-script-stencil-silhouette/"}, {"t": "Wikipedia — Stencil buffer", "u": "https://en.wikipedia.org/wiki/Stencil_buffer"}], "nosrc": false}]}</script>
<script>"use strict";
const W=240,H=135,TAU=Math.PI*2;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const eo=x=>1-Math.pow(1-clamp(x),3);
const ei=x=>Math.pow(clamp(x),3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const P={sky:'#5fa8c8',grass:'#5a9a4a',grass2:'#4f8c42',grassD:'#3d7236',dirt:'#b9925e',dirtD:'#94704a',wood:'#7a5034',woodD:'#55361f',roof:'#b6483a',roofD:'#86302a',wall:'#e3c99a',wallD:'#bf9f72',stone:'#8a8f99',stoneD:'#5e636e',water:'#3d7fc4',waterL:'#6fb3e8',skin:'#f0c69a',gob:'#6fbf4a',gobD:'#3f7f2a',red:'#e04a3a',white:'#ffffff',ink:'#141a24',gold:'#f2c94c',purple:'#9a5ad1',cyan:'#7fe3d8',blue:'#4a78c8',night:'#0d1630',leaf:'#3f8f3a',leafD:'#2c6a2e',orange:'#f08a3a'};
function R(c,x,y,w,h,col){if(col)c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,Math.max(0,r),0,TAU);c.fill()}
function ring(c,x,y,r,w,col){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.arc(x,y,Math.max(0,r),0,TAU);c.stroke()}
function txt(c,s,x,y,col,size=8,align='center',font='bold'){c.font=font+' '+size+'px monospace';c.textAlign=align;c.textBaseline='middle';c.fillStyle=col;c.fillText(s,x,y)}
function otxt(c,s,x,y,col,size=8,align='center'){c.font='bold '+size+'px monospace';c.textAlign=align;c.textBaseline='middle';c.fillStyle=P.ink;for(const[dx,dy]of[[-1,0],[1,0],[0,-1],[0,1]])c.fillText(s,x+dx,y+dy);c.fillStyle=col;c.fillText(s,x,y)}
function mk(w,h){const k=document.createElement('canvas');k.width=w;k.height=h;return k}
/* ---- sprites ---- */
const SPR={
gob:{c:{g:P.gob,G:P.gobD,k:P.ink,t:P.wood,d:P.woodD,w:'#ffe9a8'},m:["g.......g","gg.ggg.gg",".GgggggG.",".gwkgwkg.",".ggggggg.","..gGGGg..","..ttttt..",".gtttttg.","..t...t..","..d...d.."]},
vil:{c:{h:P.woodD,s:P.skin,k:P.ink,b:P.blue,B:'#34589a',d:P.woodD},m:["..hhh..",".hhhhh.",".sksks.",".sssss.","..bbb..",".bbbbb.","s.bBb.s","..bbb..","..b.b..","..d.d.."]},
hero:{c:{h:'#d9a441',s:P.skin,k:P.ink,b:P.red,B:'#a8342a',d:P.woodD,m:'#cfd8e3'},m:["..hhh...",".hhhhh..",".sksks..",".sssss.m","..bbb..m",".bbbbbsm","s.bBb...","..bbb...","..b.b...","..d.d..."]},
coin:{c:{y:P.gold,o:'#b8892a',w:'#fff6c8'},m:[".yyy.","ywyyo","ywyyo","yyyyo",".ooo."]},
heart:{c:{r:P.red,w:'#ffb3a8'},m:[".r.r.","rwrrr","rrrrr",".rrr.","..r.."]},
};
const sprCache={};
function sprCanvas(name,mode){const key=name+'|'+(mode||'');if(sprCache[key])return sprCache[key];const s=SPR[name],m=s.m,h=m.length,w=m[0].length,k=mk(w,h),g=k.getContext('2d');for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=m[y][x];if(ch==='.')continue;g.fillStyle=mode?(mode[0]==='#'?mode:'#fff'):s.c[ch];g.fillRect(x,y,1,1)}return sprCache[key]=k}
/* draw sprite with feet at (x,y). o:{flash,tint,tintA,sx,sy,alpha,flip,sil} */
function spr(c,name,x,y,o={}){const k=sprCanvas(name),w=k.width,h=k.height,sx=o.sx||1,sy=o.sy||1;c.save();c.globalAlpha=o.alpha==null?1:o.alpha;c.translate(Math.round(x),Math.round(y));if(o.flip)c.scale(-1,1);c.scale(sx,sy);const dx=-Math.floor(w/2),dy=-h;if(o.sil){c.drawImage(sprCanvas(name,o.sil),dx,dy)}else{c.drawImage(k,dx,dy);if(o.tint&&o.tintA){c.globalAlpha*=o.tintA;c.drawImage(sprCanvas(name,o.tint),dx,dy)}if(o.flash){c.globalAlpha=(o.alpha==null?1:o.alpha)*o.flash;c.drawImage(sprCanvas(name,'w'),dx,dy)}}c.restore()}
function shadow(c,x,y,w=6,a=.35){c.fillStyle='rgba(0,0,0,'+a+')';c.beginPath();c.ellipse(Math.round(x),Math.round(y),w,w*.4,0,0,TAU);c.fill()}
function tree(c,x,y,sway=0,col=P.leaf,colD=P.leafD){R(c,x-2,y-7,4,7,P.woodD);c.fillStyle=colD;c.beginPath();c.moveTo(x-9+sway*.5,y-6);c.lineTo(x+sway,y-24);c.lineTo(x+9+sway*.5,y-6);c.fill();c.fillStyle=col;c.beginPath();c.moveTo(x-7+sway*.6,y-11);c.lineTo(x+sway*1.1,y-27);c.lineTo(x+6+sway*.6,y-11);c.fill()}
function house(c,x,y,lit=0){R(c,x-12,y-14,24,14,P.wall);R(c,x-12,y-3,24,3,P.wallD);c.fillStyle=P.roof;c.beginPath();c.moveTo(x-15,y-13);c.lineTo(x,y-25);c.lineTo(x+15,y-13);c.fill();R(c,x-15,y-14,30,2,P.roofD);R(c,x-3,y-8,6,8,P.woodD);R(c,x-10,y-10,5,4,lit>0?'rgba(255,214,120,'+(.35+lit*.65)+')':'#6f8a99');R(c,x+5,y-10,5,4,lit>0?'rgba(255,214,120,'+(.35+lit*.65)+')':'#6f8a99')}
function tower(c,x,y){R(c,x-6,y-22,12,22,P.stone);R(c,x-6,y-4,12,4,P.stoneD);for(let i=0;i<3;i++)R(c,x-7+i*5,y-26,4,4,P.stone);R(c,x-1,y-15,2,4,P.ink)}
function fence(c,x,y,n){for(let i=0;i<n;i++)R(c,x+i*6,y-6,2,6,P.wood);R(c,x,y-5,n*6-4,1,P.woodD);R(c,x,y-2,n*6-4,1,P.woodD)}
function ground(c,ox=0,oy=0,col=P.grass,col2=P.grass2){R(c,0,0,W,H,col);c.fillStyle=col2;for(let i=0;i<70;i++){const x=((hash(i)*W*1.3-ox)%W+W)%W,y=((hash(i+99)*H*1.3-oy)%H+H)%H;c.fillRect(Math.round(x),Math.round(y),2,1)}}
function path(c,ox=0){c.fillStyle=P.dirt;c.beginPath();c.moveTo(100-ox,H);c.bezierCurveTo(110-ox,90,150-ox,70,140-ox,0);c.lineTo(160-ox,0);c.bezierCurveTo(170-ox,70,130-ox,95,135-ox,H);c.fill()}
/* the shared town scene, night 0..1 */
function town(c,o={}){const ox=o.ox||0,oy=o.oy||0,n=o.night||0,sway=o.sway||0;ground(c,ox,oy,o.g1,o.g2);c.save();c.translate(-ox,-oy);path(c);house(c,50,52,n);house(c,195,40,n);tower(c,120,30);fence(c,20,92,6);tree(c,20,40,sway);tree(c,85,100,sway);tree(c,215,95,sway);tree(c,170,120,sway);tree(c,232,60,sway);c.restore();if(n>0){c.fillStyle='rgba(12,22,58,'+(n*.62)+')';c.fillRect(0,0,W,H);c.save();c.globalCompositeOperation='lighter';for(const[x,y]of[[43,44],[58,44],[188,32],[203,32]]){const g=c.createRadialGradient(x-ox,y-oy,0,x-ox,y-oy,14);g.addColorStop(0,'rgba(255,190,90,'+(n*.45)+')');g.addColorStop(1,'rgba(255,190,90,0)');c.fillStyle=g;c.fillRect(x-ox-14,y-oy-14,28,28)}c.restore()}}
/* forest / alt scene */
function forest(c,o={}){const ox=o.ox||0;R(c,0,0,W,H,'#2f5f4a');c.fillStyle='#3a7356';for(let i=0;i<60;i++)c.fillRect(Math.round(((hash(i+5)*W*1.4-ox)%W+W)%W),Math.round(hash(i+50)*H),3,1);for(let i=0;i<14;i++){const x=((hash(i+300)*W*1.5-ox)%(W+30)+W+30)%(W+30)-15,y=20+hash(i+400)*115;tree(c,x,y,0,'#2f7a4a','#1f5a38')}R(c,0,0,W,H,'rgba(40,20,80,.15)')}
let SCN={};
function scene(name){if(SCN[name])return SCN[name];const k=mk(W,H),g=k.getContext('2d');if(name==='day'){town(g);spr(g,'hero',120,80)}else if(name==='night'){town(g,{night:1});spr(g,'hero',120,80)}else if(name==='forest'){forest(g);spr(g,'hero',120,80)}else if(name==='vday'){town(g)}else if(name==='vnight'){town(g,{night:1})}else if(name==='vforest'){forest(g)}else if(name==='battle'){R(g,0,0,W,H,'#2a2440');R(g,0,90,W,45,'#3d3460');circ(g,170,62,22,'#463a70');spr(g,'gob',170,72,{sx:3,sy:3});spr(g,'hero',60,118,{sx:3,sy:3})}return SCN[name]=k}
/* deterministic particle burst: returns positions */
function burst(c,x,y,p,n,seed,o={}){const sp=o.speed||40,g=o.grav||0,life=o.life||1;for(let i=0;i<n;i++){const a=(o.a0||0)+(o.spread==null?TAU:o.spread)*hash(seed+i)-(o.spread==null?0:o.spread/2),v=sp*(.4+.6*hash(seed+i*7)),lt=p/(life*(.6+.4*hash(seed+i*3)));if(lt>=1||lt<0)continue;const px=x+Math.cos(a)*v*lt*life,py=y+Math.sin(a)*v*lt*life+g*lt*lt;const col=typeof o.col==='function'?o.col(lt,i):(o.col||P.gold);const s=o.size?o.size(lt,i):(lt<.5?2:1);c.globalAlpha=o.fade?1-lt:1;R(c,px-s/2,py-s/2,s,s,col)}c.globalAlpha=1}
function vignette(c,col,a,inner=.35){const g=c.createRadialGradient(W/2,H/2,H*inner,W/2,H/2,W*.62);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,col.replace('A',a));c.fillStyle=g;c.fillRect(0,0,W,H)}
function label(c,s,x,y,col='#e9edf2'){txt(c,s,x,y,col,7,'center','bold')}
function bar(c,x,y,w,h,v,col,bg='#1d2533'){R(c,x-1,y-1,w+2,h+2,P.ink);R(c,x,y,w,h,bg);R(c,x,y,w*clamp(v),h,col)}
const DEMOS={};
let _tmp=null;function TMP(){if(!_tmp)_tmp=mk(W,H);const g=_tmp.getContext('2d');g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.clearRect(0,0,W,H);return _tmp}
let _tmp2=null;function TMP2(){if(!_tmp2)_tmp2=mk(W,H);const g=_tmp2.getContext('2d');g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.clearRect(0,0,W,H);return _tmp2}

DEMOS['PP-02']={d:2,f:(c,t)=>{const s=ppSmData().data,o=outData(c),d=o.data,fr=Math.floor(t*48),half=W/2;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;let r=s[i],g=s[i+1],b=s[i+2];if(x>=half){const L=(r*.2126+g*.7152+b*.0722)/255,n=(ppIH(y*W+x+fr*100003)-.5)*2*24*(.25+3*L*(1-L));r+=n;g+=n;b+=n}d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255}c.putImageData(o,0,0);ppDiv(c,half);ppTag(c,'OFF',half/2,8);ppTag(c,'GRAIN',half*1.5,8)}};

/* PP-03 CRT filter — hi-res; sweeping divider: plain integer scale | CRT (scanlines, RGB mask, curvature, rolling band) */
let ppCrtO=null;
DEMOS['PP-03']={d:6,hi:true,f:(c,t)=>{const OW=480,OH=270,s=imgData('day').data;if(!ppCrtO)ppCrtO=c.createImageData(OW,OH);const d=ppCrtO.data,split=Math.round(240+170*Math.sin(t*TAU)),band=(1-t)*(OH+60)-30,X0=60,Y0=34;
 for(let y=0;y<OH;y++)for(let x=0;x<OW;x++){const i=(y*OW+x)*4;let r,g,b;if(x<split){const j=((Y0+(y>>2))*W+X0+(x>>2))*4;r=s[j];g=s[j+1];b=s[j+2]}else{let u=x/OW*2-1,v=y/OH*2-1;const rr=u*u+v*v,k=1+.05*rr;u*=k;v*=k;if(Math.abs(u)>1||Math.abs(v)>1){r=g=b=0}else{const sx=X0+(u+1)/2*W/2,sy=Y0+(v+1)/2*H/2,j=((Math.min(H-1,sy|0))*W+Math.min(W-1,sx|0))*4,fy=sy-Math.floor(sy);const scan=.35+.8*Math.sin(Math.PI*fy);const m=x%3;const ed=Math.min(1,(1-Math.abs(u))*10)*Math.min(1,(1-Math.abs(v))*10);const bb=1+.06*Math.max(0,1-Math.abs(y-band)/14);const f=scan*ed*bb;r=s[j]*f*(m===0?1.06:.86);g=s[j+1]*f*(m===1?1.06:.86);b=s[j+2]*f*(m===2?1.06:.86)}}d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255}
 c.putImageData(ppCrtO,0,0);c.fillStyle='rgba(255,255,255,.9)';c.fillRect(split,0,2,OH);c.save();c.scale(2,2);if(split>40)ppTag(c,'PLAIN',Math.min(split/4,60),8);if(split<440)ppTag(c,'CRT',Math.max((split/2+W)/2,180),8);ppTag(c,'4x ZOOM',W/2,H-8);c.restore()}};

const ppBs=[1,2,3,4,6,8,6,4,3,2];let ppPxK=null;
DEMOS['PP-05']={d:5,f:(c,t)=>{if(!ppPxK)ppPxK=mk(W,H);const g=ppPxK.getContext('2d');g.drawImage(scene('vday'),0,0);const local=t>=.5,hx=local?Math.round(lerp(40,200,(t-.5)/.5)):120;spr(g,'hero',hx,local?44:80);const s=g.getImageData(0,0,W,H).data,o=outData(c),d=o.data;
 let B,x0=0,y0=0,x1=W,y1=H;if(!local){B=ppBs[Math.floor(t*2*ppBs.length)%ppBs.length]}else{B=8;x0=Math.floor((hx-32)/8)*8;y0=8;x1=x0+64;y1=56}
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;let sx=x,sy=y;if(x>=x0&&x<x1&&y>=y0&&y<y1&&B>1){sx=Math.min(W-1,Math.floor(x/B)*B+(B>>1));sy=Math.min(H-1,Math.floor(y/B)*B+(B>>1))}const j=(sy*W+sx)*4;d[i]=s[j];d[i+1]=s[j+1];d[i+2]=s[j+2];d[i+3]=255}c.putImageData(o,0,0);if(local){c.strokeStyle='rgba(255,255,255,.7)';c.setLineDash([2,2]);c.strokeRect(x0+.5,y0+.5,x1-x0-1,y1-y0-1);c.setLineDash([])}ppTag(c,local?'LOCAL MOSAIC  B=8':'FULL SCREEN  B='+B,W/2,H-8)}};

/* PP-06 Desaturation — ramp to grayscale, then selective colour (keep reds) */
DEMOS['PP-06']={d:5,f:(c,t)=>{const s=imgData('day').data,o=outData(c),d=o.data,keep=t>=.6,sat=keep?0:1-ease(seg(t,.08,.4));for(let i=0;i<d.length;i+=4){const r=s[i],g=s[i+1],b=s[i+2],L=.2126*r+.7152*g+.0722*b;let k=1-sat;if(keep&&r>g*1.6&&r>b*1.6)k=0;d[i]=lerp(r,L,k);d[i+1]=lerp(g,L,k);d[i+2]=lerp(b,L,k);d[i+3]=255}c.putImageData(o,0,0);ppTag(c,keep?'GRAYSCALE + KEEP RED':'SATURATION '+Math.round(sat*100)+'%',W/2,H-8)}};

DEMOS['PP-07']={d:3,f:(c,t)=>{const src=scene('day'),cx=120,cy=72,st=t<.2?0:t<.28?.16*eo((t-.2)/.08):.16*(1-eo((t-.28)/.42));c.drawImage(src,0,0);if(st>.002){const N=10;for(let i=1;i<=N;i++){const sc=1+st*i/N;c.globalAlpha=1/(i+1);c.drawImage(src,cx-cx*sc,cy-cy*sc,W*sc,H*sc)}c.globalAlpha=1;c.save();c.beginPath();c.arc(cx,cy,16,0,TAU);c.clip();c.drawImage(src,0,0);c.restore()}ppTag(c,'STRENGTH '+st.toFixed(2),W/2,H-8)}};

/* PP-08 Gaussian blur (3× box ≈ Gaussian) — radius ramps up behind a pause panel */
let ppA=null,ppB=null;
function ppBoxH(src,dst,r){const w=W,h=H,n=2*r+1;for(let y=0;y<h;y++)for(let ch=0;ch<3;ch++){let acc=0;const row=y*w;for(let k=-r;k<=r;k++)acc+=src[(row+clamp(k,0,w-1))*4+ch];for(let x=0;x<w;x++){dst[(row+x)*4+ch]=acc/n;acc+=src[(row+Math.min(w-1,x+r+1))*4+ch]-src[(row+Math.max(0,x-r))*4+ch]}}}
function ppBoxV(src,dst,r){const w=W,h=H,n=2*r+1;for(let x=0;x<w;x++)for(let ch=0;ch<3;ch++){let acc=0;for(let k=-r;k<=r;k++)acc+=src[(clamp(k,0,h-1)*w+x)*4+ch];for(let y=0;y<h;y++){dst[(y*w+x)*4+ch]=acc/n;acc+=src[(Math.min(h-1,y+r+1)*w+x)*4+ch]-src[(Math.max(0,y-r)*w+x)*4+ch]}}}
function ppBlur(s,r){if(!ppA){ppA=new Float32Array(W*H*4);ppB=new Float32Array(W*H*4)}for(let i=0;i<s.length;i++)ppA[i]=s[i];for(let p=0;p<3;p++){ppBoxH(ppA,ppB,r);ppBoxV(ppB,ppA,r)}return ppA}
